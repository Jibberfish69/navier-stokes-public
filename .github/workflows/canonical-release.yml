name: Canonical proof release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  canonical-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install PDF metadata tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Test release drift checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Verify canonical source and copies
        run: python3 tools/canonical_release.py verify
