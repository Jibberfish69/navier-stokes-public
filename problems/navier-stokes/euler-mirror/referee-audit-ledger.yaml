artifact_id: euler-mirror-referee-audit-ledger
purpose: >-
  Mechanical branch-local referee ledger for the Euler mirror. Every repo-visible
  Euler-mirror surface must read as one or more of: smooth by explicit
  hypothesis, nonsmooth control, proved conditional surface, false base
  implication, non-Euler import, provenance/comparison only, or machinery status.
  This ledger is not a proof of global Euler smoothness; it is the authority that
  prevents copied Navier-Stokes viscosity labor from being treated as an Euler
  theorem. It is also not a global binary verdict on Euler. Its job is
  scenario-by-scenario refereeing: record where Euler is smooth by hypothesis,
  where Euler is nonsmooth or not forced smooth, and where Navier-Stokes crosses
  a gap only because viscosity supplies proof labor. The audit is terminal as
  comparison cleanup, but it is also the graphing input for the Euler-only
  smoothness continuum program and for nonsmooth Euler class-membership
  exploration.
classification_vocabulary:
  - id: smooth_by_hypothesis
    meaning: >-
      Euler is smooth only because the surface assumes classical regularity,
      fixed-thickness smooth data, a fixed interval of classical existence, or an
      explicitly chosen regularity layer above Member_E.
  - id: nonsmooth_control
    meaning: >-
      The surface exhibits or records Euler behavior compatible with base
      equation membership while failing classical smoothness, one-field
      coherence, a flow map, or a receiver ledger.
  - id: proved_conditional_surface
    meaning: >-
      The installed statement is proved after extra Euler controls are supplied
      on the same family, interval, cover, or ledger. The assumptions are part of
      the theorem.
  - id: false_base_implication
    meaning: >-
      The attempted move from base Member_E to smoothness, one-field coherence,
      a Lagrangian carrier, or ELCI.CP.A is false.
  - id: non_euler_import
    meaning: >-
      The installed parent step spends viscosity, dissipation, heat/Stokes
      structure, parabolic observability, ACT.X-TopVisc, c_nu N, 2nu, or nu D_N.
  - id: provenance_or_comparison_only
    meaning: >-
      The surface is useful source comparison, route provenance, or downstream
      bookkeeping, but it is not theorem authority on the Euler branch.
  - id: machinery_status
    meaning: >-
      The surface records branch state, contracts, audit status, or the checker
      that enforces this ledger.
global_readback:
  scenario_not_binary: >-
    The branch does not classify Euler as globally smooth or globally nonsmooth.
    It classifies each installed Euler/NS contact scenario separately.
  smooth_where: >-
    Euler is smooth in this branch only in explicit smooth cases: fixed-interval
    classical Euler, fixed-thickness smooth shear layers, or regularity/control
    layers assumed above Member_E.
  nonsmooth_where: >-
    Euler is nonsmooth or not forced smooth at base Member_E, tangential
    slip/vortex-sheet witnesses, stationary unbounded shear, singular limits of
    smooth shear layers, same-datum non-classical weak branches, boundary blowup
    comparisons, and base attempts to force the ELCI.CP.A receiver ledger. The
    tangential slip/vortex-sheet witness and stationary unbounded shear both
    have global periodic weak-Euler globalizations with nonsmooth initial data.
  viscosity_role: >-
    The parent Navier-Stokes route uses viscosity as shear participation,
    lower-collar absorption, ACT.KX scheduling, top-viscous readout, dyadic
    damping, parabolic observability, and fixed-nu class separation. Euler has
    transport and pressure, but no automatic replacement for those jobs.
  continuum_program: >-
    The case matrix is also the Euler-NS continuum graph: smooth and conditional
    rows identify viscosity-free overlap worth extracting as Euler-only
    smoothness theorems; viscosity-import rows identify the exact NS proof labor
    requiring inviscid replacement; nonsmooth rows identify local Euler members
    or near-members that test how far class membership extends beyond
    smoothness.
