---
version: 1
updated_on: '2026-05-22'
branch_id: euler-mirror-chat20
artifact_id: euler-mirror-referee-audit-ledger
purpose: >-
  Mechanical branch-local referee ledger for the Euler mirror. Every repo-visible
  Euler-mirror surface must read as one or more of: smooth by explicit
  hypothesis, nonsmooth control, proved conditional surface, false base
  implication, non-Euler import, provenance/comparison only, or machinery status.
  This ledger is not a proof of global Euler smoothness; it is the authority that
  prevents copied Navier-Stokes viscosity labor from being treated as an Euler
  theorem.
classification_vocabulary:
  - id: smooth_by_hypothesis
    meaning: >-
      Euler is smooth only because the surface assumes classical regularity,
      fixed-thickness smooth data, a fixed interval of classical existence, or an
      explicitly chosen regularity layer above Member_E.
  - id: nonsmooth_control
    meaning: >-
      The surface exhibits or records Euler behavior compatible with base
      equation membership while failing classical smoothness, one-field
      coherence, a flow map, or a receiver ledger.
  - id: proved_conditional_surface
    meaning: >-
      The installed statement is proved after extra Euler controls are supplied
      on the same family, interval, cover, or ledger. The assumptions are part of
      the theorem.
  - id: false_base_implication
    meaning: >-
      The attempted move from base Member_E to smoothness, one-field coherence,
      a Lagrangian carrier, or ELCI.CP.A is false.
  - id: non_euler_import
    meaning: >-
      The installed parent step spends viscosity, dissipation, heat/Stokes
      structure, parabolic observability, ACT.X-TopVisc, c_nu N, 2nu, or nu D_N.
  - id: provenance_or_comparison_only
    meaning: >-
      The surface is useful source comparison, route provenance, or downstream
      bookkeeping, but it is not theorem authority on the Euler branch.
  - id: machinery_status
    meaning: >-
      The surface records branch state, contracts, audit status, or the checker
      that enforces this ledger.
global_readback:
  smooth_where: >-
    Euler is smooth in this branch only in explicit smooth cases: fixed-interval
    classical Euler, fixed-thickness smooth shear layers, or regularity/control
    layers assumed above Member_E.
  nonsmooth_where: >-
    Euler is nonsmooth or not forced smooth at base Member_E, tangential
    slip/vortex-sheet witnesses, singular limits of smooth shear layers,
    same-datum non-classical weak branches, boundary blowup comparisons, and
    base attempts to force the ELCI.CP.A receiver ledger.
  viscosity_role: >-
    The parent Navier-Stokes route uses viscosity as shear participation,
    lower-collar absorption, ACT.KX scheduling, top-viscous readout, dyadic
    damping, parabolic observability, and fixed-nu class separation. Euler has
    transport and pressure, but no automatic replacement for those jobs.
authority_surfaces_requiring_readback:
  - README.md
  - campaign-map.md
  - route-lock.yaml
  - execution-ledger.yaml
  - completion-status.yaml
  - branch-manifest.yaml
  - theorem-construction/mpp-euler-mirror-terminal-closure-20260522.md
parent_comparison_anchors:
  - problems/navier-stokes/theorem-construction/mpp-lower-carrier-interval-integrability-theorem-program.md
  - problems/navier-stokes/theorem-construction/mpp-retained-window-native-forcing-theorem-program.md
  - problems/navier-stokes/theorem-construction/mpp-act-kx-conditional-route-completion-packet.md
  - problems/navier-stokes/theorem-construction/mpp-act-kx-hidden-spending-audit-note.md
  - problems/navier-stokes/theorem-construction/mpp-lci-a-fixed-increment-top-viscous-readout-note.md
  - problems/navier-stokes/theorem-construction/mpp-lci-a-first-rung-viscous-center-supplier-note.md
  - problems/navier-stokes/theorem-construction/route-b-euclidean-closure-theorem.md
  - problems/navier-stokes/theorem-construction/exact-potential-v2-static-diffusion-heat-plus-perturbation-split.md
  - problems/navier-stokes/theorem-construction/exact-potential-v2-static-diffusion-wang-zhang-route.md
  - problems/navier-stokes/theorem-construction/mpp-direct-fixed-nu-euler-smooth-ns-smooth-hierarchy-20260509.md
  - problems/navier-stokes/theorem-construction/mpp-ns-cm-smoothness-euler-dual-regularity-map-20260516.md
  - problems/navier-stokes/theorem-construction/mpp-endpoint-cover-taxonomy-dead-blown-jump-slip-map-20260517.md
stale_failure_patterns:
  - id: active-next-target
    pattern: active_next_theorem_target
  - id: open-theorem-claim
    pattern: 'theorem_claim_status:\s*open'
  - id: open-theorem-target
    pattern: 'theorem_target_status:\s*(open|live|active)'
  - id: open-burden-surface-key
    pattern: open_burden_surfaces
  - id: live-burden-surface-key
    pattern: live_burden_surfaces
  - id: remaining-global-regularity-burden
    pattern: remaining_global_regularity_burden
  - id: proved-global-smoothness-overclaim
    pattern: Euler global smoothness has been proved
  - id: stale-rewrite-needed
    pattern: rewrite-needed
  - id: stale-blocked-by-label
    pattern: blocked-by-non-Euler-dependence
  - id: stale-holdout
    pattern: holdout
  - id: stale-open-continuation
    pattern: open-continuation
  - id: stale-debt-language
    pattern: '(live branch debt|live mirror debt|theorem debt|remaining burden)'
  - id: stale-unresolved-language
    pattern: '(unresolved|unfinished)'
  - id: stale-generic-mirrored-status
    pattern: 'mirror_status:\s*mirrored$'
  - id: stale-partial-rewrite-required
    pattern: classified-partial-euler-rewrite-required
  - id: stale-receiver-burden-key
    pattern: closed_literal_receiver_burden
  - id: stale-theorem-queue
    pattern: mirror_theorem_queue
  - id: stale-rebuild-language
    pattern: '(needs an Euler ledger theorem|must be rebuilt|missing Euler replacements)'
  - id: stale-earned-language
    pattern: '(must still be earned|earned controls)'
  - id: stale-live-regularity-language
    pattern: '(open target|live regularity question|live stronger-carrier)'
  - id: stale-old-heading-language
    pattern: '(Honest Current Burden|Source And Receiver Burdens|Exact Remaining Object|successor work|extra regularity burdens)'
surface_rules:
  - id: branch_authority_status
    paths:
      - README.md
      - campaign-map.md
      - route-lock.yaml
      - execution-ledger.yaml
      - completion-status.yaml
      - branch-manifest.yaml
      - branch-audit-index.yaml
      - corpus-derivation-ledger.yaml
      - derivation-audit-status.yaml
      - methodology-aim-walkdown-status.yaml
      - positive-control-file-ledger.yaml
      - viscosity-dependence-ledger.yaml
      - referee-audit-ledger.yaml
    classifications:
      - machinery_status
    referee_readback: >-
      These are authority/readback surfaces. Their job is to keep the Euler
      branch terminally classified by this ledger and not to advertise an
      unclassified smoothness theorem.
  - id: contracts_and_findings
    paths:
      - completion-contract.md
      - derivation-audit-contract.md
      - methodology-aim-walkdown-contract.md
      - methodology-aim-walkdown-gap-note.md
      - corpus-derivation-findings.md
    classifications:
      - machinery_status
      - provenance_or_comparison_only
    referee_readback: >-
      These files define the branch discipline and record prior derivation
      findings. They are not smoothness proofs.
  - id: source_pack_conditional_or_provenance
    paths:
      - target-fidelity-discharge-source-pack.md
      - scale-barrier-source-pack.md
      - compactness-discharge-source-pack.md
      - gradient-discharge-source-pack.md
      - gradient-transfer-coercivity-source-pack.md
      - nonlinear-closure-discharge-source-pack.md
      - interdependencies-discharge-source-pack.md
      - monotone-functional-discharge-source-pack.md
      - cascade-after-monotone-bridge-source-pack.md
      - scale-high-side-remainder-source-pack.md
      - scale-barrier-tail-discharge-source-pack.md
      - energy-insufficiency-source-pack.md
      - closure-audit-source-pack.md
      - source-grounded-framework-map.md
      - claim-ladder.md
    classifications:
      - proved_conditional_surface
      - non_euler_import
      - provenance_or_comparison_only
    referee_readback: >-
      These are source-pack and route-shape surfaces. They preserve usable proof
      order only under added Euler controls; parent damping or parabolic pieces
      are non-Euler imports.
  - id: demoted_curvature_and_v6_provenance
    paths:
      - curvature-based-regularity-discharge-source-pack.md
      - v6-four-bridge-source-note.md
    classifications:
      - provenance_or_comparison_only
      - non_euler_import
    referee_readback: >-
      Curvature/geometric and V6 bridge material is provenance or comparison
      support after viscosity removal, not installed Euler theorem authority.
  - id: audits
    globs:
      - audits/*.yaml
    classifications:
      - machinery_status
      - proved_conditional_surface
      - non_euler_import
      - provenance_or_comparison_only
    referee_readback: >-
      Audit files certify downstream branches as conditional, non-Euler, or
      provenance-only according to this ledger.
  - id: euler_membership_and_regular_class_boundary
    paths:
      - theorem-construction/mpp-euler-class-membership-flux-volume-definition.md
      - theorem-construction/mpp-class-membership-contradiction-source-locked-note.md
      - theorem-construction/mpp-class-membership-contradiction-frontier-packet.md
      - theorem-construction/euler-mirror-frontier-packet.md
      - theorem-construction/mpp-class-membership-forward-invariance-theorem-program.md
      - theorem-construction/mpp-law13-surviving-endpoint-exclusion-program.md
    classifications:
      - false_base_implication
      - nonsmooth_control
      - proved_conditional_surface
    referee_readback: >-
      Base Member_E is flux-volume plus weak momentum-pressure fidelity. It
      admits nonsmooth controls and cannot be promoted to smoothness, Field, or
      flow-map status without extra regularity hypotheses.
  - id: explicit_nonsmooth_controls
    paths:
      - theorem-construction/mpp-euler-pressure-nonparticipation-vortex-sheet-witness-20260517.md
      - theorem-construction/mpp-smooth-data-to-euler-nonsmooth-bridge-20260517.md
    classifications:
      - smooth_by_hypothesis
      - nonsmooth_control
      - false_base_implication
    referee_readback: >-
      Fixed-thickness shear layers are smooth by hypothesis; the limiting
      slip/vortex-sheet object is a nonsmooth base Euler member and a control
      witness against one-field or smoothness promotion.
  - id: receiver_elci_chain
    paths:
      - theorem-construction/mpp-lower-carrier-interval-integrability-theorem-program.md
      - theorem-construction/mpp-elci-a-direct-transport-pressure-attempt-20260519.md
      - theorem-construction/mpp-elci-cp-a-separation-closure-20260522.md
      - theorem-construction/mpp-euler-mirror-terminal-closure-20260522.md
    classifications:
      - proved_conditional_surface
      - false_base_implication
      - non_euler_import
    referee_readback: >-
      ELCI.CP.A is proved only under explicit same-cover Euler controls. Base
      Member_E fails to force the ledger, and the parent ACT.KX / ACT.X-TopVisc /
      2nu chain is non-Euler import.
  - id: positive_control_and_route_b
    paths:
      - theorem-construction/positive-control-euler-program.md
      - theorem-construction/route-b-euler-closure-theorem.md
      - theorem-construction/integrated-euler-closure-program.md
      - theorem-construction/mpp-lower-carrier-interval-integrability-theorem-program.md
      - theorem-construction/mpp-one-field-forward-preservation-theorem-program.md
      - theorem-construction/mpp-one-field-forward-preservation-reduction-note.md
    classifications:
      - smooth_by_hypothesis
      - proved_conditional_surface
      - non_euler_import
    referee_readback: >-
      Positive-control, compactness, one-field, and Route B surfaces are
      conditional Euler regularity programs. Any parent damping or viscous
      continuation term remains non-Euler.
  - id: scenario_map_and_downstream_walkdowns
    paths:
      - theorem-construction/euler-ns-viscosity-scenario-separation-map-20260521.md
      - theorem-construction/export-whole-space-euler-walkdown-program.md
      - theorem-construction/selector-geometry-euler-walkdown-program.md
      - theorem-construction/exact-potential-euler-entry-obstruction-note.md
      - theorem-construction/curvature-provenance-euler-support-note.md
    classifications:
      - smooth_by_hypothesis
      - nonsmooth_control
      - proved_conditional_surface
      - non_euler_import
      - provenance_or_comparison_only
    referee_readback: >-
      These surfaces separate smooth cases, nonsmooth cases, and viscosity jobs
      before downstream comparison packets are allowed to act as authority.
  - id: local_referee_tooling
    globs:
      - tools/*.rb
    classifications:
      - machinery_status
    referee_readback: >-
      Branch-local tooling enforces per-surface coverage and authority readback.
