  new_boundary_effect: The heterochiral unique leg receives less than one half of
    one donor's kinetic-energy loss, but the critically valued ratio is below one
    half only for eta>1/2 and diverges in the high-high-low limit. Full signed incompressible
    recombination gives C eta^2 sqrt(R) D, whose adaptive absorption destroys that
    local critical barrier. The perfectly balanced rip-cord can also coast with zero
    transverse VPI curvature through the same field's trace-free pressure quadrupole.
    Finite energy pays unweighted pressure mass but not the extra inverse-scale recruited-label
    moment. The complete non-scalar parent Gramian either stores the future critical
    action anti-causally or requires a causal endpoint coercivity condition equivalent
    to that same action bound; coherent incidence prevents an ambient product-tensor
    comparison by an N^3 collapse loss. Rejoined pressure and viscosity cancel at
    equal core-complement weight, but inverse-scale valuation leaves the signed adjacent-scale
    endpoint, membership, and strain-square combination; exact coasting refunds its
    positive occupation and Hardy control retains the critical scale jump. Full modal
    incidence gives X_(n+1)=X_n+Y_n, so the sub-half kinetic child share is not a
    critical contraction. Energy and viscosity do absorb all interactions below the
    parabolic cutoff a <= c_0 (nu/||u_0||_2)^(2/5) h^(4/5). Enstrophy narrows the
    remainder to h <= C Z/nu^2 and a dynamic lower cutoff, with datum-integrable geometric
    ratio Xi in L_t^8; the joined donor throughput remains unpaid. Actual same-label
    nesting gives a positive scale-crossing term, but exact coasting stores it with
    contraction in the negative scale-weighted endpoint, while one smooth finite-energy
    periodic NS history realizes both signs of the VPI projection during simultaneous
    contraction. On the dynamic core the original first binomial row gives the exact
    three-leg law c_tau' + nu S_tau c_tau = a_tau. Heat normalization retains the
    critical 1/(nu K) complete quartic source port, and the moving enstrophy selector
    contributes signed Z-threshold entry/exit endpoints; both source and full quartic
    ports retain both signs in true-Leray tests. The restored all-material-pair law
    gives j_ab = 4(e_ab/K_ab) D_t K_ab and integral j_ab = P_(1/2), so the dynamic
    Fourier core is this exact inverse-length flux minus the proved exterior. Its
    record weight makes the scale endpoint equal to critical height, adds the principal
    pair-selection response, and the moving FIM gate adds the signed alpha Z'/Z collar
    flux; the joined history remains closure-equivalent. The geometric factor obeys
    Xi^8 = ||u_0||_2^2 Z/nu^4. Its direct time dual requires [P_core/Xi]_+ in L_t^(8/7);
    paid estimates leave Z D^(4/7), scale-local packets force Z^(13/7), and recombined
    donor variation forces the closure-equivalent Z^2 time-square. Modal enstrophy
    cancellation does not sign-control the critical current, and differentiating Xi
    restores Z'. The joined first-row identity is R+X=B'+C. Any coefficientwise local
    correction in (b_tau,Z) cancelling every refill and Z' coefficient is uniquely
    B plus a constant, with the signed core current forced as the remainder. Dividing
    b_tau by Z^(3/2) removes only scalar radius motion; true-Leray data with Z'=0
    retain both signs of the remaining tangent phase. The complete binomial/Carleman
    resummation preserves every parent heat rate and selector derivative. Its reciprocal
    tail is nonuniform when parent rates exceed depth times output rate; if controlled,
    it sums exactly to 1/(nu |k|) and reconstructs the same critical DCT.47 action.
    Full pair-orientation recombination first proves the favorable balanced turn-down
    sign. Weighted Betchov recombination then pays axial wobble exactly and leaves
    the signed strain-shape term a(d^2-a^2) joined to the selector collar, finite
    chords, complement, and exterior. The BPT-DCT tangent telescope is only a storage-endpoint
    alias, while canonical last-record failure forces signed high-receiver coincidence.
    The fixed- selector full-field form removes bookkeeping collars but leaves the
    signed strain shape joined to the complete finite chords; its higher response
    has both signs. Every failed record further forces critical source-square concentration
    and a signed supplier prefix at every reciprocal binomial depth. Those prefixes
    are endpoint aliases of the same open action. These are exact in-method boundaries,
    not a datum-prefix proof.
  authority_effect: The strict-subinterval mixed coordinates and the conditional intersection-to-endpoint
    theorem isolate the exact direct boundary. The datum-generated whole-terminal
    compatible rectangles are established. If supplied, the common H_x^infinity endpoint,
    pressure-explicit endpoint jet, and same-history restart give T_*=infinity. Scalar-prefix,
    dome, residual, shell, Gold, and Silver surfaces advance this chain only by discharging
    that producer or an equivalent noncircular terminal exclusion.
