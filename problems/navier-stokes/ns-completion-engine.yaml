work_graph:
  graph_id: ns-completion-work-graph
  graph_rule: Derive executable work from the whole project model, not from one selected
    note or a green ledger.
  nodes:
  - node_id: ns-cm-proof-frontier
    layer_id: proof_repo
    action_type: theorem_legitimacy_then_proof
    work_kind: theorem
    target_state: The CM contrapositive frontier is smaller, closed, or blocked by
      a named Pack/Part/Field face.
    dependencies: []
    parallel_lane_id: proof_lane
    expected_state_delta: A proof note, failed-attempt note, or exact blocker changes
      the Navier-Stokes proof frontier itself.
    current_state: Open CM contrapositive frontier under Exit(Q):=not Member(Q).
    evidence_refs:
    - problems/navier-stokes/source-frontier.yaml
    - problems/navier-stokes/live-theorem-edge.yaml
    - problems/navier-stokes/ns-proof-program-route-table.yaml
    ready_state: ready-or-dependent-on-known-node
  - node_id: ns-route-graph-app-sync
    layer_id: app_viewer_mcp
    action_type: route_graph_and_app_sync
    work_kind: graph_app_mcp
    target_state: The route graph, viewer, and MCP route readout expose the same live
      CM target and next obstruction.
    dependencies:
    - ns-cm-proof-frontier
    parallel_lane_id: graph_app_mcp_lane
    expected_state_delta: A changed proof frontier is re-entered into graph/app/MCP
      state instead of remaining an isolated theorem note.
    current_state: Route graph/app/MCP must track the current proof frontier and next
      obstruction.
    evidence_refs:
    - problems/navier-stokes/current-route-dependency-graph.yaml
    - problems/navier-stokes/d8-completion-route-map.yaml
    - system/gui/navier-stokes-repo-viewer/src/nsAnalysis.ts
    - system/runner/lib/research_os_live_state_support.rb
    ready_state: ready-or-dependent-on-known-node
  - node_id: ns-pdf-proof-scaffold
    layer_id: manuscript_pdf
    action_type: reader_facing_proof_scaffold
    work_kind: manuscript_pdf
    target_state: The manuscript/PDF receives only theorem movement that is true enough
      to write for a human referee.
    dependencies:
    - ns-cm-proof-frontier
    - ns-route-graph-app-sync
    parallel_lane_id: manuscript_lane
    expected_state_delta: Earned proof movement becomes reader-facing proof structure,
      while open blockers stay out of polished claims.
    current_state: PDF/manuscript writing waits for earned proof movement and honest
      blocker language.
    evidence_refs:
    - problems/navier-stokes/paper-architecture.yaml
    - problems/navier-stokes/submission-bundle/reader-facing-abstract-intro-checklist.md
    - problems/navier-stokes/submission-bundle/navier-stokes-submission.tex
