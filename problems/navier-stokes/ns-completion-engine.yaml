parallel_lanes:
- lane_id: proof_lane
  role: theorem work
  work_node_ids: &1
  - ns-cm-proof-frontier
  can_run_parallel: true
  reentry_targets:
  - project_model
  - work_graph
  - thomas-facing report
  custody_boundary: Parent thread keeps theorem judgment; helpers may inspect sources
    or draft bounded attempts.
  dispatch_packet:
    packet_id: proof_lane-dispatch
    inputs:
    - problems/navier-stokes/source-frontier.yaml
    - problems/navier-stokes/live-theorem-edge.yaml
    - problems/navier-stokes/ns-proof-program-route-table.yaml
    work_node_ids: *1
    allowed_outputs:
    - theorem note
    - failed attempt with exact blocker
    - Pack/Part/Field face landing
    done_condition: complete when the theorem node changes proof state or is exactly
      blocked by a named mathematical obstruction
    handoff_back: Handoff back with a changed-state ref, exact blocker, and next work-node
      recommendation for parent-thread reentry.
    forbidden_outputs:
    - status-only completion
    - support-only success
    - theorem closure claim without Pack/Part/Field mechanism
    - PDF/submission promotion without proof-state movement
- lane_id: graph_app_mcp_lane
  role: graph/app/MCP sync
  work_node_ids: &2
  - ns-route-graph-app-sync
  can_run_parallel: true
  reentry_targets:
  - project_model
  - work_graph
  - thomas-facing report
  custody_boundary: Helpers may inspect app and graph state; parent integrates route
    meaning.
  dispatch_packet:
    packet_id: graph_app_mcp_lane-dispatch
    inputs:
    - problems/navier-stokes/current-route-dependency-graph.yaml
    - problems/navier-stokes/d8-completion-route-map.yaml
    - system/gui/navier-stokes-repo-viewer/src/nsAnalysis.ts
    - system/runner/lib/research_os_live_state_support.rb
    work_node_ids: *2
    allowed_outputs:
    - route graph update
    - viewer route update
    - MCP/live-state route update
    done_condition: complete when changed proof state is visible in graph/app/MCP
      route state or the sync blocker is exact
    handoff_back: Handoff back with a changed-state ref, exact blocker, and next work-node
      recommendation for parent-thread reentry.
    forbidden_outputs:
    - status-only completion
    - support-only success
    - theorem closure claim without Pack/Part/Field mechanism
    - PDF/submission promotion without proof-state movement
- lane_id: manuscript_lane
  role: human proof writing
  work_node_ids: &3
  - ns-pdf-proof-scaffold
  can_run_parallel: true
  reentry_targets:
  - project_model
  - work_graph
  - thomas-facing report
  custody_boundary: Parent keeps authorial judgment; writing starts only from earned
    proof movement.
  dispatch_packet:
    packet_id: manuscript_lane-dispatch
    inputs:
    - problems/navier-stokes/paper-architecture.yaml
    - problems/navier-stokes/submission-bundle/reader-facing-abstract-intro-checklist.md
    - problems/navier-stokes/submission-bundle/navier-stokes-submission.tex
    work_node_ids: *3
    allowed_outputs:
    - reader-facing proof scaffold
    - manuscript blocker note
    - prose section only from earned proof movement
    done_condition: complete when earned proof state has a human-facing scaffold or
      the writing is blocked by missing proof
    handoff_back: Handoff back with a changed-state ref, exact blocker, and next work-node
      recommendation for parent-thread reentry.
    forbidden_outputs:
    - status-only completion
    - support-only success
    - theorem closure claim without Pack/Part/Field mechanism
    - PDF/submission promotion without proof-state movement
- lane_id: submission_lane
  role: submission boundary
  work_node_ids: &4
  - ns-submission-readiness
  can_run_parallel: true
  reentry_targets:
  - project_model
  - work_graph
  - thomas-facing report
  custody_boundary: Submission state follows proof and manuscript evidence.
  dispatch_packet:
    packet_id: submission_lane-dispatch
    inputs:
    - problems/navier-stokes/submission-verdict.yaml
    - problems/navier-stokes/submission-bundle/submission-verdict.yaml
    - problems/navier-stokes/submission-bundle/submission-export-status.yaml
    work_node_ids: *4
    allowed_outputs:
    - submission boundary readback
    - blocked readiness state
    - readiness promotion only from proof/PDF evidence
    done_condition: complete when submission state follows proof/PDF evidence as ready
      or blocked
    handoff_back: Handoff back with a changed-state ref, exact blocker, and next work-node
      recommendation for parent-thread reentry.
    forbidden_outputs:
    - status-only completion
    - support-only success
    - theorem closure claim without Pack/Part/Field mechanism
    - PDF/submission promotion without proof-state movement
theorem_legitimacy_prechecks:
- precheck_id: ns-cm-proof-frontier-legitimacy
  target_node_id: ns-cm-proof-frontier
  problem_legitimacy_question: Is the proposed obstruction a legitimate mathematical
    obstruction inside the CM exit-witness program, or a scope/definition error that
    should be rejected before proof work starts?
  ontology_check: 'Type the object before estimating it: finite breakdown assumption,
    admissible CM test object, class-member predicate, Pack/Part/Field face, face
    failure, or class-exit conclusion.'
  human_scenario_or_counter_scenario: For the zero-radius vortex pattern, a vortex
    squeezed to radius zero has stopped being a vortex in the human picture; that
    can be a definition failure rather than a harder vortex theorem.
  pass_side_nonvacuity_check: For each obstruction split, verify that the pass branch
    has a genuine smooth/Member(Q) possibility and that the fail branch lands in a
    concrete face.
  face_landing_policy: Valid fail branches must land in Pack, Part, or Field with
    the exact face named; illegitimate objects close by definition or scope.
  allowed_proof_methods:
  - contrapositive
  - cases
  - minimal counterexample
  - compactness
  - finite exhaustion
  - ontology rejection
  evidence_refs:
  - problems/navier-stokes/source-frontier.yaml
  - problems/navier-stokes/live-theorem-edge.yaml
  - problems/navier-stokes/theorem-construction/chatgpt-terminal-zeno-vortex-ontology-verbatim-note-20260528.md
