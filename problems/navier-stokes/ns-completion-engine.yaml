    - ns-cm-proof-frontier
    - ns-pdf-proof-scaffold
    parallel_lane_id: submission_lane
    expected_state_delta: Submission readiness remains blocked, or advances from proof/PDF
      evidence rather than from green support ledgers.
    current_state: Submission state remains blocked until proof and reader-facing
      manuscript state support it.
    evidence_refs:
