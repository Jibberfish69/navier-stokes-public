  corrected_synthesis:
    closure_kernel:
    - deformation drain
    - tower flux control
    - source ledger + receiver collar closure
    - one-field preservation
    - class-membership forward invariance
    - endpoint exclusion
    immediate_theorem_facing_question: Can deformation geometry or tower control prove
      the remaining receiver/collar theorem feeding LCI.A?
    sharpened_receiver_theorem:
      theorem_note: problems/navier-stokes/theorem-construction/mpp-deformation-tower-receiver-supplier-theorem-program.md
      supplier_form: DTR.A proves DG_rec + TW_ctr -> (RCF.1) + (RCF.2) + (RCF.A0)
      assembly_form: DTR.B proves DTR.A + RCF.A -> LCI.A
      true_closure_form: DTR.C+ proves DG_rec + TW_ctr^aff -> A_ctr in L2 directly
      concrete_packet_form: DTR.E proves ATE.A affine-normalized receiver packet inequality
        -> RCF.A -> LCI.A
      bookkeeping_packet_form: DTR.Eb proves Dini inequality for full affine bookkeeping
        energy -> RCF.A -> LCI.A
      packet_correction: 'DTR.E splits the affine-normalized receiver object into
        a differentiable state packet and a source ledger; affine-defect, pressure-tail,
        and tower remainders must not be treated as state variables unless separate
        evolution laws are proved. DTR.Eb is the licensed exception: it may use the
        full bookkeeping packet only if its Dini inequality is proved directly.'
      local_packet_correction: ATE.1 closes only the center-state affine identity
        and has zero intrinsic point-center dissipation. The usable ATE.A closure
        must be the local affine receiver packet on enlarged transported-center balls,
        with H2/H3 parabolic dissipation controlling ATE.2 and ATE.3.
      local_packet_reduction: 'After the local packet refinement, ATE.2-ATE.5 reduce
        to two live estimates: localized tower/pressure response S_press^aff + S_top-visc^aff
        in L1(I), and local affine commutator/cutoff control S_mid^aff + Cut_mid +
        Cut_osc + Cut_visc in L1(I). ATE.4 is a local Sobolev/Morrey readout; ATE.5
        is a source-ledger readout from ATE.3, pressure-tail input, m>=3, and the
        local Gronwall bound.'
      act_master_target: 'ACT.A is the bundled affine-center theorem target: one master
        packet should close D_1^aff in L1(I), F_ctr_res in L1(I), and H_osc^alpha
        in L2(I). It is not promoted by the circular implication E_ACT in Linfty implies
        B_ACT,F_ACT in L1 and then Gronwall implies E_ACT in Linfty. Promotion requires
        ACT.E1 or ACT.E2, a term-by-term affine-center energy estimate with external
        or dissipatively absorbed L1 coefficients.'
      act_finite_stage_route: 'The valid ACT.E2 completion is finite-stage: ACT.Stage(0)..ACT.Stage(m+2)
        implies ACT.E2. Each rung may use lower affine rungs already controlled, but
        not the desired same-stage E_ACT bound as a coefficient. The middle block
        is triangular; the live checks are the stage pressure response on affine balls
        and the stage cutoff/frame estimate.'
      act_scale_small_alternative: 'ACT.ScaleSmall is a conditional sufficient branch:
        if the scale-normalized affine excess satisfies dX_exc + cN <= (L0+C A_core)X_exc
        + (C_cut+C_press) X_exc^(1/2) N + F0, while the core line and forcing line
        are carried in the same ACT.KX block. If the initial excess plus source budget
        is below the eta_X absorption threshold, then the nonlinear excess term is
        absorbed and ACT.E1/E2 follows on that affine interval. X is excess-only;
        center zero modes split into A_core^ctr and A_buf^ctr rather than being placed
        in the smallness variable, and a full-strip retained-branch proof needs ACT.X-Scale
        at each retained restart, ACT.KX, and RWS.C_scale to recover fixed-radius
        readouts, not just a retained-window partition. On the averaged branch, the
        restart seed is the X_R(s_a) component of SCF_avg^m on SCF-good cylinders
        supplied by SGC.A_a.e and ATD_m^epsilon, not point-center retained smoothness.'
      act_x_atom_split: ACT.X-Def separates the small affine excess X_exc from the
        full readout packet Y_read = A_core^ctr + A_buf^ctr + X_exc. AXE.A is the
        excess line inside ACT.KX; ACT.X-MidRaw contributes real zero-mode linear
        terms controlled by A_core. ACT.KX uses the eta_X first-exit argument for
        X_exc with that combined threshold and carries A_core in J=X_exc+theta A_core.
        ACT.X-Readout spends Y_read after ACT.KX has supplied A_core^ctr; A_buf^ctr
        is readout/top-viscous buffer data and cannot be smuggled into the smallness
        variable. ACT.X-Scale supplies the small restart seed from retained smooth
        center-ball regularity on the retained branch. On the averaged branch this
        slot is replaced by SCF_base plus SGC.A_a.e plus ATD_m^epsilon, and the route
        is SCF_base + SGC.A_a.e + ATD_m^epsilon => SCF_avg^m => AACT.KX off B_epsilon^Phi
        => DTC.A_avg => AVG.RCV.A => LCI.A_avg. AVG.MAIN.A compresses SCF_base + ATD_m^epsilon
        + CAVG.J + AVG.RCV.A + AVG.END.A + FFSRC.A into no averaged finite-time class
        exit. AVG.COVER.A combines good-region propagation with the bad-region jump
        case via CAVG.J, and the installed DTC.Read bridge is the fixed-scale finite-cover
        terminal readout when endpoint/tower recovery needs pointwise DTC.A; it is
        not an upstream input to SCF_base, AACT.KX, AVG.RCV.A, LCI.A_avg, CSP.A_avg,
        OFP.A_avg, CFI.A_avg, or End_NS_avg. RWS.C_cover supplies the dynamic same-fluid
        cover from compact retained label tubes and the pack gauge. RWS.C_scale is
        the finite-cover readout bridge that transfers small-radius packets to the
        fixed-radius readouts; it does not assert fixed-radius packet smallness.
      act_center_core_rule: 'The center-amplitude rule is now carried inside ACT.KX:
        K_le_m^ctr in L1(I) and A_core^ctr in Linfty(I) are joint outputs. K_le_m^ctr
        consists of K_0(c_j), the first-rung affine-frame acceleration E_j^(1), and
        transformed lower-rung forcings Ktilde_{q,j} for 2<=q<=m. On the retained
        branch, RSCB.NKF supplies NKF.Native, then NKF.Native + NKF.Ann + NKF.Quad
        + ACT.X-Cut + ACT.X-Press_energy + ACT.X-MidRaw + ACT.X-TopVisc + ACT.X-Scale
        + RWS.C_scale produce ACT.KX. Residual pressure is read from ACT.X-Press_cell
        after subtracting the native affine normal-form pressure p_j^aff from p_j^loc;
        this normal form annihilates affine and affine-linear center pressure modes.
        Lower viscous recycle is core-controlled, and the top-viscous m+1,m+2 line
        is forcing/readout, not pre-pressure A_buf amplitude. The m+1 and m+2 modes
        are buffer/readout modes; proving them before ACT.KX would require the optional
        top forcing sum_{q=m+1}^{m+2}|Ktilde_q|^2 in L1(I) and risks rung creep.'
      act_x_press_rule: Pressure is split into in-bootstrap normal-form estimates
        and the post-bootstrap ACT.X-Press_cell readout. The cell form supplies the
        residual P_le_m^cell only after ACT.KX, controlling pi_j^loc=p_j^loc-p_j^aff
        by a quadratic affine-excess core plus projected annular/harmonic/far-tail
        terms. The energy form is an AXE.A atom, not an after-Actr_core theorem; finite
        pressure far-tail is energy-controlled in Linfty(I). The quadratic residual
        contributes C_press X_exc^(1/2) N to the same scale-small bootstrap as the
        cutoff term. It does not spend LCI.A, CSP.A, OFP.A, or Field.
      act_compact_chain: 'Retained branch: RSCB.NKF => NKF.Moll + NKF.Point => NKF.Native;
        then NKF.Native + NKF.Ann + NKF.Quad + ACT.X-Cut + ACT.X-Press_energy + ACT.X-MidRaw
        + ACT.X-TopVisc + ACT.X-Scale + RWS.C_scale => ACT.KX => ACT.X-Press_cell
        + ACT.Kcore + ACT.Actr_core + ACT.X-Readout => ACT.A => RCF.A => LCI.A. This
        is a conditional retained-window receiver discharge, not an unconditional
        energy result. The retained native forcing certificate is RSCB.NKF, which
        supplies the retained smooth forcing route NKF.Moll + NKF.Point => NKF.Native,
        together with the scheduler budgets; source-channel and endpoint blocks remain
        separate. Finite-energy-native branch: SCF_base + SGC.A_a.e + ATD_m^epsilon
        => SCF_avg^m => AACT.KX off B_epsilon^Phi => DTC.A_avg => AVG.RCV.A => LCI.A_avg
        => CSP.A_avg => OFP.A_avg => CFI.A_avg => End_NS_avg => AVG.MAIN.A, with AVG.COVER.A
        covering every same-fluid approach tail by good-region propagation or nonempty
        B_epsilon^Phi => Jump_avg via CAVG.J. The installed readout layer is terminal:
        DTC.Read supplies pointwise DTC.A and endpoint tower readout under fixed-scale
        cover plus ATD_m^epsilon; Field.Read supplies old Field under uniform positive-scale
        SCF-good cover plus ATD_m^epsilon; READ.END has shape End_NS_avg + READ.COVER
        + Field.Read + DTC.Read => End_NS; FULL.END has shape AVG.MAIN.A + READ.COVER
        + READ.END => End_NS. These consequences do not promote DTC.A_avg or CFI.A_avg
        into upstream pointwise objects. END.Exh_avg and END.Cross_avg are locked
        endpoint cells; finite energy supplies only SCF_base at good material restarts,
        ATD_m^epsilon is the local epsilon-regularity tower supplier, and SGC.A_strong
        is off the main line as regularity-equivalent. The bad set is folded directly
        into Jump_avg by CAVG.J.'
      audit_correction: DTR.A is only a supplier theorem. Bare TW_ctr supplies residual
        pressure/top-viscous forcing; the strong closure needs TW_ctr^aff, which also
        closes the affine-frame transformed forcing/recycle problem; DTR.E gives the
        concrete ATE.A packet target for that closure.
    reason_for_priority: The source side already has an organized near-closure package.
      Once the strengthened source branch is granted, the live burden returns to the
      receiver side, so deformation and tower ideas should be tested first as suppliers
      for LCI.A / RCF.A / the thickened collar consumer.
