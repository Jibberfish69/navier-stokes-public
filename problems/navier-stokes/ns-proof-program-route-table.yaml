object_transfer_guard:
  danger_pattern: estimate_for_A_used_as_closure_of_B
  rule: >-
    A theorem or estimate closes only the object it actually propagates. It may
    support a different program only through an explicit bridge theorem.
  core_risk_name: bridge-license failure
  required_bridge_fields:
    - source_program_id
    - source_controlled_object
    - target_program_id
    - target_object_to_be_closed
    - carrier_or_coordinate_transfer
    - scale_or_threshold_conversion
    - pressure_or_source_transfer
    - endpoint_or_continuation_compatibility
    - noncircularity_check
  forbidden_shortcuts:
    - using fixed Eulerian packet control as transported one-field coherence without the moving-collar bridge
    - using SG.4 selector-defect progress as closure of CFI.A, OFP.A, or LCI.A without a class-membership bridge
    - using mixed-jet tower control as Pack / Part / Field persistence without a membership bridge
    - using Lagrangian deformation estimates as receiver-side LCI.A closure without pressure/source and collar transfer
    - using Euclidean strict-shadow export as internal torus-first closure without explicit downstream export theorem
live_route_table_columns:
  - program
  - authority_status
  - propagated_object
  - surface
  - bridge_needed
  - current_open_theorem
  - allowed_imports
  - forbidden_substitutions
