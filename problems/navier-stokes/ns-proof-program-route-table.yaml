  anti_flattening_rule: A single release blocker or frontier count is a dashboard
    gate, not evidence that Navier-Stokes has one path, method, proof mode, wall,
    or target.
  missing_field_rule: If any required field is missing, recover it from the direct
    live surfaces first. Ask the user exactly one referent-lock question only if the
    current prompt and direct live surfaces still do not identify the field.
  language_boundary: Do not say "the route", "the wall", "the path", or "the method"
    unless the sentence names the exact proof mode, identifies the shared Gold/Silver
    object, or says explicitly that it is only a dashboard/release gate.
