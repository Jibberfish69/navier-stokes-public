proof_program_topology:
- program_id: cm-member-class-exit
  proof_mode: contrapositive_class_membership
  governing_primitive: Exit(Q;O_NS^work):=not Member(Q;O_NS^work)
  propagated_object: live same-solution object first, then same-fluid Part/Field witness
    notation after field-local testing is named; Member(Q) is the forward membership
    predicate
  promotion_gate: Original-NS participation at the original Navier-Stokes participation-law
    slot first; Silver Part_{N,Q} or Field_{N,r,Q}; Pack_Q only as Field window evidence
    only after field-local testing is named, with true failed packet-window reserved
    for carrier/window/readout absence after that typing
  current_role: governing proof grammar for CM-bearing promotion
  governing_engine_note: problems/navier-stokes/theorem-construction/mpp-positive-obstruction-pass-exit-cm-engine-20260525.md
  pack_before_part_dependency_audit:
    note: problems/navier-stokes/theorem-construction/mpp-pack-out-of-cm-boundary-resurfacing-audit-20260620.md
    licensing_note: problems/navier-stokes/theorem-construction/mcp-partfieldbeforepacklicensing-a-packpositiveradiuscertification-a-770adef0d8.md
    rule: Preserve Silver Part/Field after a legitimate Pack window, carrier, readout,
      or jump-comparison structure is admitted. When an outside-CM participation-field/window
      or singular branch was disposed as not Pack_Q before the original Navier-Stokes
      participation law was applied to the live same-solution object, first ask whether
      the original Navier-Stokes viscosity, pressure, and incompressibility law still
      gives original participation status. If yes, apply the original Navier-Stokes
      participation law to the live same-solution object; localize to Part_{N,Q} only
      after the tested record exists; if no, keep not Pack_Q as a true carrier/window/readout
      failure.
  obstruction_pass_exit_rule: Follow the ordinary positive proof program until it
    reaches a real obstruction, then split the obstruction into a pass branch and
    a fail branch. The pass branch is the in-class `Member(Q)` branch and may be supplied
    by any lawful continuation mechanism. The fail branch is lawful CM contrapositive
    work only when the failure is capable of nonsmoothness and lands as a Part or
    Field Part/Field failure, or as an original-participation audit of an outside-CM
    participation-field/window branch, supporting `Exit(Q):=not Member(Q)`. Do not
    replace this engine with a demand to prove one particular positive estimate directly.
  no_third_branch_rule: The installed no-third-branch audit proves that no terminal
    branch is both an in-class `Member(Q)` continuation branch and a finite nonsmoothness
    branch once the obstruction has been admitted to the CM test and a concrete Part/Field
    failure has been derived. Do not respawn the rejected positive no-exit slogan
    as the local burden; the live proof engine is obstruction-by-obstruction CM-test
    entry plus Part/Field face derivation.
  no_genuine_exit_rule: The direct first-exit positive no-exit attempt is retained
    as a failed positive no-exit shortcut and may not control the local CM target.
    Under the current pass-or-exit engine, a pass branch may be supplied by any lawful
    continuation mechanism, and a fail branch is useful exactly when it lands in Part
    or Field; that concrete Part/Field failure supports `Exit(Q):=not Member(Q)`.
  silver_face_failure_finality_correction_20260619: Do not state or preserve as a
    Silver burden that a concrete Part/Field Part/Field failure must then be proved
    not to be the finite-time breakdown of the original smooth solution. That imports
    a forward no-exit theorem into the contrapositive. For Silver, after same-solution
    CM-test admission, the row is consumed by admissibility failure, continuation/readout
    recovery, or concrete Part/Field failure. `NoGenuineExitFromSmoothData.A`, first-Pack
    survival, terminal anti-atom, and PCTP/TTU are positive supplier or manuscript
    support unless a concrete promoted row is shown to enter the CM test and still
    neither continue nor land in a real Part/Field failure.
  positive_existence_translation_veto: Do not restate the live CM burden as proving
    that at least one solution remains in the class, producing a smooth/class-member
    solution, or showing smooth data stays in CM. That is a positive-existence/class-preservation
    reading. The pass side is already the smooth/Member(Q) side under whatever lawful
    continuation mechanism supplies it; the proof work is admitting each obstruction
    to the CM test and deriving the fail side as a concrete Part/Field failure supporting
    Exit(Q):=not Member(Q).
  source_reserve_birth_rule: 'The May 25 source-reserve burst is support, not live
    frontier: `ReserveCreationCharge.A` remains a positive supplier / charge-ledger
    subprimitive, `ActiveHeightFluxTrichotomy.A` remains conditional face-routing
    support after the zero-first-moment visibility veto, and `SourceReserveBirthCharge.A
    / RetainedPositiveScaleNativeReserveBirthCharge.A` is support-only after the Pack-out-of-CM
    source-reserve face audit. The exact classification is: paid same-ledger service
    is pass-side nonvacuity; an admitted finite terminal obstruction is CM-test admission
    only; selected unpaid infinite donor-refill remains Field-window support, while
    zero-radius terminal residue lands Part-side when a same-solution original participation
    record remains and packet/window evidence only when that record is absent; retained
    positive-scale first-created native donor-square reserve surplus remains supplier
    quarantine. Its honest next burden is `RetainedPositiveScaleNativeReserveBirthCharge.A
    / TerminalReserveFirstAppearanceCharge.A` as supplier-quarantined positive Pack
    support, promotable only by same-ledger payment or CM-test admission plus first
    Part/Field failure.'
