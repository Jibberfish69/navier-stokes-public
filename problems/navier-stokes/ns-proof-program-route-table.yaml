closure_ecology:
  status: route-facing bridge map under live CM authority
  central_live_junction: OFP.A
  audit_verdict: >-
    The synthesis is correct as a closure ecology rather than a merged theorem.
    Its improvement is to make every cooperation point a licensed supplier slot
    into the native live route, with no transfer allowed unless the source
    object, target slot, and noncircularity check are named.
  governing_rule: >-
    Each program keeps its native object. A contact point is valid only where a
    theorem shows that one native burden supplies a named missing input for
    another native burden without spending the target conclusion.
  live_chain:
    - FCI.5f + LCI.A
    - CSP.A
    - OFP.A
    - CFI.B3
    - CFI.A
    - endpoint exclusion
  native_burdens:
    - program: class-membership
      native_object: Pack / Part / Field witnessing M_Q(u,p)
      natural_role: final contradiction frame
    - program: tower / mixed jets
      native_object: transfer matrix and finite-difference defect energy
      natural_role: visible analytic bookkeeping and Field supplier
    - program: Lagrangian deformation
      native_object: pulled-back velocity, pressure, F, A, G, strain, coefficient commutator
      natural_role: deep drain mechanism and receiver-geometry supplier
    - program: frozen-family Eulerian
      native_object: fixed packet family plus pressure, strain, and cutoff ledgers
      natural_role: source-side accounting for FCI.5f
    - program: receiver / collar
      native_object: LCI.A, CSP.A, widened receiver return, transported-center controls
      natural_role: local one-field closure under OFP.A
    - program: TPS / SG.4
      native_object: selector defect and strain readout
      natural_role: downstream survivor consumer
    - program: Euclidean strict shadow
      native_object: strict export / lift carrier and shadow errors
      natural_role: downstream whole-space export
  contact_points:
    - contact_id: CE.1
      name: deformation geometry to Pack
      source_program: Lagrangian deformation
      source_object: flow map, F, deformation gauge, collar strain
      target_slot: CFI.B1 / pack-side gauge survival
      bridge_license_status: support bridge; must stay on the same label collar
      current_status: structurally reliable because it uses the exact flow-map ODE
      theorem_shape: collar strain in L1 controls Gamma_sharp, hence Pack survives
      forbidden_overclaim: deformation gauge control does not close CM, OFP.A, or endpoint exclusion
    - contact_id: CE.2
      name: deformation geometry to receiver segment geometry
      source_program: Lagrangian deformation
      source_object: label-halo gradient control and deformation halo regularity
      target_slot: OFP.C1e3 / OFP.C1e4 / WTC.4 -> WTL.A -> LCI.A_{delta+delta_seg}; DG_rec beneath RCF.A
      bridge_license_status: genuine contact point; supplies only segment geometry unless strengthened to exact RCF.1 / affine-defect inputs
      current_status: useful against the receiver circularity
      theorem_shape: U2 halo carrier in L1 gives label-halo nabla F control and segment-thickness control
      forbidden_overclaim: segment thickness alone is not LCI.A, CSP.A, or Field
    - contact_id: CE.3
      name: deformation drain to tower matrix
      source_program: Lagrangian deformation
      source_object: v, G, coefficient commutator, Lagrangian drain functional
      target_slot: Eulerian mixed-source transfer matrix and finite-difference defect energy
      bridge_license_status: unproved high-leverage bridge
      current_status: least proved, but best candidate for a genuinely new mechanism
      theorem_shape: K_Lag + D_Lag + C_Lag one-sided inequality shadows into Eulerian tower control
      forbidden_overclaim: shared heat language is not a theorem bridge
    - contact_id: CE.4
      name: tower / finite differences to Field
      source_program: tower / mixed jets
      source_object: mixed-jet transfer matrix and localized defect-energy propagation
      target_slot: finite-difference coherence modulus inside OFP.A; TW_ctr beneath RCF.A
      bridge_license_status: route-native if it controls the same finite-difference escalation or exact transported-center pressure/top-viscous ledgers
      current_status: direct support path with lower-rung coefficient risk
      theorem_shape: mixed-jet transfer control implies localized defect-energy propagation, hence Field support
      forbidden_overclaim: tower boundedness is not direct CM persistence
    - contact_id: CE.5
      name: tower / frozen family to source ledger
      source_program: tower / mixed jets and frozen-family Eulerian
      source_object: source transfer terms, pressure ledger, strain/cascade ledger, cutoff absorption
      target_slot: FFSRC.A -> FCI.5f with exact FPCR.C kept visible and packet-local FFPB.A0 solved on the stronger branch
      bridge_license_status: finite-packet source bridge
      current_status: real source-side contact point
      theorem_shape: tower coefficient control supplies the frozen-family source ledger and exact pressure wall input
      forbidden_overclaim: source closure cannot be asserted independently of collar data
    - contact_id: CE.6
      name: frozen-family plus receiver/collar to OFP.A
      source_program: frozen-family Eulerian plus receiver / collar
      source_object: FCI.5f source ledger and LCI.A receiver closure
      target_slot: CSP.A -> OFP.A -> CFI.B3
      bridge_license_status: live recombination theorem
      current_status: highest-authority executable junction
      theorem_shape: FCI.5f + LCI.A -> CSP.A -> OFP.A
      forbidden_overclaim: fixed-family control is not transported one-field coherence by itself
    - contact_id: CE.7
      name: TPS / SG.4 after endpoint progress
      source_program: TPS / SG.4 selector-defect
      source_object: selector defect / strain readout
      target_slot: downstream survivor branch certification
      bridge_license_status: downstream only unless a new CM bridge is proved
      current_status: preserved as survivor consumer context
      theorem_shape: endpoint survivor branch feeds selector-defect / strain consumer, hence SG.4
      forbidden_overclaim: SG.4 cannot retake route authority
    - contact_id: CE.8
      name: Euclidean strict shadow after internal closure
      source_program: Euclidean strict-shadow export
      source_object: full-data lift, strict shadow, global carrier control, shadow-error coupling
      target_slot: whole-space export after torus/internal closure
      bridge_license_status: downstream export theorem
      current_status: export mechanism, not live internal closure
      theorem_shape: internal closure gives full-data lift/readout and exact strict shadow for R3 export
      forbidden_overclaim: Euclidean shadow cannot replace the internal CM route
  rejected_superficial_bridges:
    - move: deformation language and tower language both mention heat
      missing_theorem: shadow inequality from (v,G) to the tower matrix
    - move: TPS / SG.4 becomes route authority again
      missing_theorem: direct priority theorem over CFI.A / OFP.A / LCI.A
    - move: Euclidean strict shadow replaces torus/internal route
      missing_theorem: full direct theorem changing branch authority
    - move: full Field coherence proves a pre-Field receiver input
      missing_theorem: noncircular receiver proof independent of OFP.A output
    - move: source closure independent of collar data
      missing_theorem: source-to-OFP bridge that does not spend receiver closure
  closure_loops:
    - loop_id: CE.A
      name: route-native OFP loop
      role: executable live-edge closure
      chain:
        - FFSRC.A or exact FCI.5f
        - LCI.A / receiver closure
        - CSP.A
        - OFP.A
        - CFI.A
        - endpoint exclusion
      critical_theorem: solved packet-local FFPB.A0 or exact pressure wall path plus RCF.A / LCI.A, thickened collar consumer, and widened receiver return
      authority_status: highest
    - loop_id: CE.B
      name: deformation-assisted receiver loop
      role: targeted supplier search
      chain:
        - deformation strain / halo-gradient control
        - DG_rec
        - RCF.1 + affine-defect first-rung input
        - RCF.A / LCI.A
        - CSP.A / OFP.A
      critical_theorem: prove DG_rec noncircularly; then decide whether it gives only DTR.A supplier form or the true DTR.C receiver closure
      authority_status: promising supplier loop
    - loop_id: CE.C
      name: deformation-to-tower drain loop
      role: high-risk mechanism search
      chain:
        - Lagrangian drain on (v,G)
        - Eulerian tower shadow inequality
        - local TW_ctr
        - pressure-center + top-viscous center forcing
        - RCF.A or Field
        - OFP.A
      critical_theorem: K_Lag drain shadows to Eulerian defect-energy or local TW_ctr control without spending LCI.A / CSP.A
      authority_status: speculative high payoff
    - loop_id: CE.D
      name: tower-to-source loop
      role: narrow source-side support
      chain:
        - mixed-jet transfer control
        - fixed-family packet source bounds
        - pressure / strain / cutoff source ledger
        - FCI.5f
      critical_theorem: tower coefficient control gives widened pressure bridge or exact frozen-net pressure wall
      authority_status: useful but not whole-route closure
    - loop_id: CE.E
      name: survivor dictionary loop
      role: obstruction alignment
      chain:
        - tail leakage
        - tower flux / debt
        - deformation commutator
        - frozen-family source debt
        - receiver collar defect
      critical_theorem: one-way translations first; full equivalence only after proof
      authority_status: organizing only
  corrected_synthesis:
    closure_kernel:
      - deformation drain
      - tower flux control
      - source ledger + receiver collar closure
      - one-field preservation
      - class-membership forward invariance
      - endpoint exclusion
    immediate_theorem_facing_question: >-
      Can deformation geometry or tower control prove the remaining
      receiver/collar theorem feeding LCI.A?
    sharpened_receiver_theorem:
      theorem_note: problems/navier-stokes/theorem-construction/mpp-deformation-tower-receiver-supplier-theorem-program.md
      supplier_form: DTR.A proves DG_rec + TW_ctr -> (RCF.1) + (RCF.2) + (RCF.A0)
      assembly_form: DTR.B proves DTR.A + RCF.A -> LCI.A
      true_closure_form: DTR.C+ proves DG_rec + TW_ctr^aff -> A_ctr in L2 directly
      concrete_packet_form: DTR.E proves ATE.A affine-normalized receiver packet inequality -> RCF.A -> LCI.A
      bookkeeping_packet_form: DTR.Eb proves Dini inequality for full affine bookkeeping energy -> RCF.A -> LCI.A
      packet_correction: >-
        DTR.E splits the affine-normalized receiver object into a differentiable
        state packet and a source ledger; affine-defect, pressure-tail, and
        tower remainders must not be treated as state variables unless separate
        evolution laws are proved. DTR.Eb is the licensed exception: it may use
        the full bookkeeping packet only if its Dini inequality is proved
        directly.
      local_packet_correction: >-
        ATE.1 closes only the center-state affine identity and has zero
        intrinsic point-center dissipation. The usable ATE.A closure must be
        the local affine receiver packet on enlarged transported-center balls,
        with H2/H3 parabolic dissipation controlling ATE.2 and ATE.3.
      local_packet_reduction: >-
        After the local packet refinement, ATE.2-ATE.5 reduce to two live
        estimates: localized tower/pressure response
        S_press^aff + S_top-visc^aff in L1(I), and local affine
        commutator/cutoff control S_mid^aff + Cut_mid + Cut_osc + Cut_visc in
        L1(I). ATE.4 is a local Sobolev/Morrey readout; ATE.5 is a source-ledger
        readout from ATE.3, pressure-tail input, m>=3, and the local Gronwall
        bound.
      act_master_target: >-
        ACT.A is the bundled affine-center theorem target: one master packet
        should close D_1^aff in L1(I), F_ctr_res in L1(I), and H_osc^alpha in
        L2(I). It is not promoted by the circular implication E_ACT in Linfty
        implies B_ACT,F_ACT in L1 and then Gronwall implies E_ACT in Linfty.
        Promotion requires ACT.E1 or ACT.E2, a term-by-term affine-center energy
        estimate with external or dissipatively absorbed L1 coefficients.
      act_finite_stage_route: >-
        The valid ACT.E2 completion is finite-stage:
        ACT.Stage(0)..ACT.Stage(m+2) implies ACT.E2. Each rung may use lower
        affine rungs already controlled, but not the desired same-stage E_ACT
        bound as a coefficient. The middle block is triangular; the live checks
        are the stage pressure response on affine balls and the stage
        cutoff/frame estimate.
      act_scale_small_alternative: >-
        ACT.ScaleSmall is a conditional sufficient branch: if the
        scale-normalized affine excess satisfies dX_exc + cN <=
        (L0+C A_core)X_exc + (C_cut+C_press) X_exc^(1/2) N + F0, while the
        core line and forcing line are carried in the same ACT.KX block. If the
        initial excess plus source budget is below the eta_X absorption
        threshold, then the nonlinear excess term is absorbed and ACT.E1/E2
        follows on that affine interval. X is excess-only; center zero modes
        split into A_core^ctr and A_buf^ctr rather than being placed in the
        smallness variable, and a full-strip retained-branch proof needs
        ACT.X-Scale at each retained restart, ACT.KX, and RWS.C_scale to recover
        fixed-radius readouts, not just a retained-window partition. On the
        averaged branch, the restart seed is the X_R(s_a) component of SCF_avg^m
        on SCF-good cylinders supplied by SGC.A_a.e and ATD_m^epsilon, not
        point-center retained smoothness.
      act_x_atom_split: >-
        ACT.X-Def separates the small affine excess X_exc from the full readout
        packet Y_read = A_core^ctr + A_buf^ctr + X_exc. AXE.A is the excess
        line inside ACT.KX; ACT.X-MidRaw contributes real zero-mode linear
        terms controlled by A_core. ACT.KX uses the eta_X first-exit argument
        for X_exc with that combined threshold and carries A_core in
        J=X_exc+theta A_core. ACT.X-Readout spends Y_read after ACT.KX has
        supplied A_core^ctr; A_buf^ctr is readout/top-viscous buffer data and
        cannot be smuggled into the smallness variable. ACT.X-Scale supplies the
        small restart seed from retained smooth center-ball regularity on the
        retained branch. On the averaged branch this slot is replaced by
        SCF_base plus SGC.A_a.e plus ATD_m^epsilon, and the route is
        SCF_base + SGC.A_a.e + ATD_m^epsilon => SCF_avg^m => AACT.KX off
        B_epsilon^Phi => DTC.A_avg => AVG.RCV.A => LCI.A_avg. AVG.MAIN.A compresses
        SCF_base + ATD_m^epsilon + CAVG.J + AVG.RCV.A + AVG.END.A + FFSRC.A
        into no averaged finite-time class exit. AVG.COVER.A
        combines good-region propagation with the bad-region jump case via CAVG.J,
        and the installed DTC.Read bridge is the fixed-scale finite-cover
        terminal readout when endpoint/tower recovery needs pointwise DTC.A; it
        is not an upstream input to SCF_base, AACT.KX, AVG.RCV.A, LCI.A_avg,
        CSP.A_avg, OFP.A_avg, CFI.A_avg, or End_NS_avg. RWS.C_cover supplies the
        dynamic same-fluid cover from compact retained label tubes and the pack
        gauge. RWS.C_scale is the finite-cover readout bridge that transfers
        small-radius packets to the fixed-radius readouts; it does not assert
        fixed-radius packet smallness.
      act_center_core_rule: >-
        The center-amplitude rule is now carried inside ACT.KX:
        K_le_m^ctr in L1(I) and A_core^ctr in Linfty(I) are joint outputs.
        K_le_m^ctr consists of K_0(c_j), the first-rung affine-frame acceleration
        E_j^(1), and transformed lower-rung forcings Ktilde_{q,j} for 2<=q<=m.
        On the retained branch, RSCB.NKF supplies NKF.Native, then
        NKF.Native + NKF.Ann + NKF.Quad +
        ACT.X-Cut + ACT.X-Press_energy + ACT.X-MidRaw + ACT.X-TopVisc +
        ACT.X-Scale + RWS.C_scale produce ACT.KX. Residual pressure is read from ACT.X-Press_cell after
        subtracting the native affine normal-form pressure p_j^aff from
        p_j^loc; this normal form annihilates affine and affine-linear center
        pressure modes. Lower viscous recycle is core-controlled, and the
        top-viscous m+1,m+2 line is forcing/readout, not pre-pressure A_buf
        amplitude. The m+1 and m+2 modes are
        buffer/readout modes; proving them before ACT.KX would
        require the optional top forcing sum_{q=m+1}^{m+2}|Ktilde_q|^2 in L1(I)
        and risks rung creep.
      act_x_press_rule: >-
        Pressure is split into in-bootstrap normal-form estimates and the
        post-bootstrap ACT.X-Press_cell readout. The cell form supplies the
        residual P_le_m^cell only after ACT.KX, controlling
        pi_j^loc=p_j^loc-p_j^aff by a quadratic affine-excess core plus
        projected annular/harmonic/far-tail terms. The energy form is an AXE.A atom, not
        an after-Actr_core theorem; finite pressure far-tail is energy-controlled
        in Linfty(I). The quadratic residual contributes C_press X_exc^(1/2) N
        to the same scale-small bootstrap as the cutoff term. It does not spend
        LCI.A, CSP.A, OFP.A, or Field.
      act_compact_chain: >-
        Retained branch: RSCB.NKF => NKF.Moll + NKF.Point => NKF.Native; then NKF.Native +
        NKF.Ann + NKF.Quad + ACT.X-Cut + ACT.X-Press_energy + ACT.X-MidRaw +
        ACT.X-TopVisc + ACT.X-Scale + RWS.C_scale => ACT.KX =>
        ACT.X-Press_cell + ACT.Kcore + ACT.Actr_core + ACT.X-Readout =>
        ACT.A => RCF.A => LCI.A. This is a conditional retained-window receiver
        discharge, not an unconditional energy result. The retained native forcing
        certificate is RSCB.NKF, which supplies the retained smooth forcing route
        NKF.Moll + NKF.Point => NKF.Native, together with the scheduler budgets;
        source-channel and endpoint blocks remain separate. Finite-energy-native
        branch: SCF_base + SGC.A_a.e + ATD_m^epsilon => SCF_avg^m =>
        AACT.KX off B_epsilon^Phi => DTC.A_avg => AVG.RCV.A => LCI.A_avg =>
        CSP.A_avg => OFP.A_avg => CFI.A_avg => End_NS_avg => AVG.MAIN.A, with
        AVG.COVER.A covering every same-fluid approach tail by good-region
        propagation or nonempty B_epsilon^Phi => Jump_avg via CAVG.J. The
        installed readout layer is terminal: DTC.Read supplies pointwise DTC.A
        and endpoint tower readout under fixed-scale cover plus ATD_m^epsilon;
        Field.Read supplies old Field under uniform positive-scale SCF-good
        cover plus ATD_m^epsilon; READ.END has shape End_NS_avg + READ.COVER +
        Field.Read + DTC.Read => End_NS; FULL.END has shape AVG.MAIN.A +
        READ.COVER + READ.END => End_NS. These consequences do not promote
        DTC.A_avg or CFI.A_avg into upstream pointwise objects.
        END.Exh_avg and END.Cross_avg are locked endpoint cells; finite energy
        supplies only SCF_base at good material restarts, ATD_m^epsilon is the
        local epsilon-regularity tower supplier, and SGC.A_strong is off the
        main line as regularity-equivalent. The bad set is folded directly into
        Jump_avg by CAVG.J.
      audit_correction: >-
        DTR.A is only a supplier theorem. Bare TW_ctr supplies residual
        pressure/top-viscous forcing; the strong closure needs TW_ctr^aff,
        which also closes the affine-frame transformed forcing/recycle problem;
        DTR.E gives the concrete ATE.A packet target for that closure.
    reason_for_priority: >-
      The source side already has an organized near-closure package. Once the
      strengthened source branch is granted, the live burden returns to the
      receiver side, so deformation and tower ideas should be tested first as
      suppliers for LCI.A / RCF.A / the thickened collar consumer.
