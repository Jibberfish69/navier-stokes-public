      release-blocker, or similar dashboard language.
  target_object:
    meaning: The exact theorem, primitive, transfer claim, file object, bridge gate,
      or burden.
    examples:
    - Exit(Q):=not Member(Q)
    - Pack_Q / Part_{N,Q} / Field_{N,r,Q}
    - 'Pack/Part/Field as overlapping witness axes: Pack has fixed-box flux and finite-window
      material-coordinate readings; Part is same pressure-viscosity carrier law; Field
      is neighboring tower coherence'
    - 'Pack/Part/Field ontological collapse audit: test whether formal witness rows
      have real terminal same-fluid realizations, or collapse into overlapping Dead/Jump/Blown
      readouts'
    - EulerSmooth(u_0,[0,T]) => NSSmooth_nu(u_0,[0,T]) for fixed nu>0
    - ScaleCriticalTreeCarleson.A as diagnostic positive source-control language with
      selected failure sorted to Field by RawSCTCFailurePartition.A + SCTCFailureToFaceWitness.A
