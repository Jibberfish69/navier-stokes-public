  proof_mode: same_datum_same_interval_transfer
  governing_primitive: EulerSmooth(u_0,[0,T]) => NSSmooth_nu(u_0,[0,T]) for fixed
    nu>0
  propagated_object: relative fixed-viscosity a priori bound or first-failure exclusion
  promotion_gate: quarantined transfer theorem; not a proof of Euler smoothness or
    stand-alone NS smoothness
  current_role: separate theorem target, not the CM source-wall root
- program_id: euler-mirror
  proof_mode: viscosity_removed_comparison
  governing_primitive: parallel Euler branch under euler-mirror/
  propagated_object: Euler analogues of selected NS route objects
  promotion_gate: comparison only unless a separate transfer theorem is proved
  current_role: quarantined mirror lane
- program_id: source-wall-residual-root-group
  proof_mode: branch_native_supplier_or_cm_landing_support
  governing_primitive: source-wall-root-after-reconcile
  propagated_object: source-reserve or Field-face residual support, depending on branch
  promotion_gate: must bridge into the CM witness envelope before closure
  current_role: top-level release blocker containing multiple live presentations
- program_id: receiver-source-readout
  proof_mode: forward_positive_support_and_endpoint_readout
  governing_primitive: retained/averaged receiver, source ledger, endpoint readout
  propagated_object: receiver/source/read-cover/end-point packets
  promotion_gate: typed bridge into a Pack/Part/Field face or into Member, or explicit
    downstream readout
  current_role: support program, not interchangeable with the CM primitive
- program_id: export-readout-branches
  proof_mode: downstream_readout_or_export
  governing_primitive: TPS/SG.4, exact-potential/Hodge, Euclidean strict-shadow, mixed-jet,
    frozen-family, Lagrangian
  propagated_object: branch-local carrier or readout object
  promotion_gate: explicit bridge theorem into the target program
  current_role: do not substitute for live CM, transfer, or positive targets
- program_id: source-recovery
  proof_mode: source_recovery
  governing_primitive: original corpus and archived theorem notes
  propagated_object: recovered definitions, route splits, theorem obligations, and
    proof text
  promotion_gate: source-backed promotion into a lane-local theorem surface
  current_role: preservation and rehydration, not proof closure by itself
- program_id: new-idea-generation
  proof_mode: new_idea_generation
  governing_primitive: bounded speculative theorem invention under frozen target object
  propagated_object: candidate mediating object, inequality, or local bridge
  promotion_gate: falsification plus promotion into a typed theorem surface
  current_role: route mutation/new idea; never silently overwrites source authority
- program_id: automation-runtime-repair
  proof_mode: route_runtime_repair
  governing_primitive: lane daemon, hardener, MCP, collaboration scope, and generated-surface
    health
  propagated_object: runnable target custody and correct generated surfaces
  promotion_gate: verification commands and refreshed surfaces
  current_role: infrastructure repair; not mathematical progress unless it materializes
    theorem work
