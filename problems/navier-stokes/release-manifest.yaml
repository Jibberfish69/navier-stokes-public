non_merge_rules:
- rule_id: positive-vs-cm
  statement: Positive smoothness control is not the CM contrapositive unless a named
    bridge proves membership or witness-face landing.
- rule_id: fixed-nu-transfer-vs-ns-smoothness
  statement: Fixed-nu Euler-to-NS transfer compares two equations on the same datum
    and interval; it does not prove Euler smoothness or stand-alone NS smoothness.
- rule_id: euler-mirror-vs-transfer
  statement: Euler mirror removes viscosity for comparison; it is not the fixed-nu
    transfer theorem.
- rule_id: ns-cm-smoothness-to-euler-dual
  statement: Shared flux-volume Pack failure exits both Euler and Navier-Stokes; NS
    Part/Field smoothness mechanisms do not become Euler pressure-participation or
    one-field membership laws, and Euler pressure/incompressibility may coexist with
    slip, jet-shear, Dead-like stronger-carrier failure, or Jump-like one-field failure.
  authority: problems/navier-stokes/theorem-construction/mpp-ns-cm-smoothness-euler-dual-regularity-map-20260516.md
  proof_witness: problems/navier-stokes/euler-mirror/theorem-construction/mpp-euler-pressure-nonparticipation-vortex-sheet-witness-20260517.md
  smooth_data_bridge: problems/navier-stokes/euler-mirror/theorem-construction/mpp-smooth-data-to-euler-nonsmooth-bridge-20260517.md
  endpoint_cover_taxonomy: problems/navier-stokes/theorem-construction/mpp-endpoint-cover-taxonomy-dead-blown-jump-slip-map-20260517.md
  ns_attack_map: problems/navier-stokes/theorem-construction/mpp-euler-control-case-to-ns-attack-map-20260517.md
  fixed_datum_boundary_reference: Chen-Hou prove a boundary/axisymmetric smooth-data
    blowup route; no-boundary smooth finite-energy Euler remains a separate open target.
- rule_id: supplier-vs-promotion
  statement: PCTP, SOURCE.NO-PULSE, AWG, TGC, Jump_avg, signed-current, pressure-strain,
    compactness, ancestry, and donor-depletion objects remain supplier/readout support
    except where a named face diagnostic supplies a Pack, Part, Field, or Zeno-sorted
    landing with its promotion boundary stated.
- rule_id: source-recovery-vs-proof
  statement: Recovering a source or route split preserves authority; it does not discharge
    the theorem burden without object-level proof text.
- rule_id: runtime-repair-vs-math
  statement: Repairing generated surfaces or daemon behavior is not theorem progress
    unless it creates or promotes exact theorem-facing work.
