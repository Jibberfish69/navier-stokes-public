      rigid-class branch has no currently produced class, and temporal non-atomicity
      is not supplied from installed inputs because the source ledger is only L1_t.
      The operational positive-supplier burden is therefore PositiveRemainderDepletion.A,
      with UniformLedgerAC.A / NativeTrilinearDefectDomination.A / mu_*^sing=0 kept
      as RN/native-trilinear presentations of the same carrier. This is not the CM
      contrapositive target itself: in the contrapositive program, a surviving positive
      source residue must be carried as a typed retained source-residue witness rather
