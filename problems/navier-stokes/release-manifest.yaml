      language with selected terminal-atom failure sorted to Field by RawZenoFailurePartition.A
      + ZenoAtomFailureToFaceWitness.A + RetainedZenoAtomFieldExit.A
    - RetainedFaceAmplitudeGain.A as a PackGainLedger/PartEnvelopeAmplitudeConservation
      boundary, not a new face
    - ActiveHeightFluxTrichotomy.A as Pack/Part/legal-Field/Zeno face routing
    - PCTP.hard as supplier/readout support
  action_type:
    meaning: The operation requested by the user or lane.
    allowed_values:
    - prove_close_discharge_do_the_math
    - audit_verify
    - summarize_status
    - edit_patch
    - inventory
    - target_tail
    - decide_prioritize
    - explain
    - route_runtime_repair
