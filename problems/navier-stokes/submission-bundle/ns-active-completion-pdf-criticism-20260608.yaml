  reader_role: plain-grad-student-reader
  location_or_scope: abstract and first-page proof promise
  problem: 'The opening says that a failed check means the candidate state has exited
    the class specified by the problem definition. To a normal reader this can sound
    like the proof defines the singular endpoint out of Navier-Stokes rather than
    deriving a same-solution terminal-member failure.

'
  why_it_blocks_clay_ready_submission: 'The core idea is legitimate only when the
    reader understands that a Clay counterexample is a same-solution terminal object
    claim, and that Part or Field failure removes exactly that terminal-member
    status. The current opening makes the hinge easier to misunderstand than it should
    be.

'
