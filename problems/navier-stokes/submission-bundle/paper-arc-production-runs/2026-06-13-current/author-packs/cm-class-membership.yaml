    \section{Silver Standard Approach}

    The silver route is the class-membership route.  It starts with a terminal record \(Q\) selected from the original Navier--Stokes solution and asks whether that record still belongs to the same solution branch.  This is a contrapositive route: a terminal branch that keeps the required class data belongs to the continuation side, and a terminal branch that loses one required class datum supplies the exit witness.

    The split is
    \[
      \begin{array}{rcl}
      \text{pass} &:& \Member(Q;\Owork),\\[2mm]
      \text{fail} &:& \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
      \end{array}
    \]
    The pass line means that the same selected record keeps the original datum, the fixed viscosity, the Navier--Stokes pressure law, incompressibility, the transported carrier, the participation tower, and a positive-scale field readout strong enough for the continuation criterion in force.  The fail line means that the same selected record loses one of those requirements.  The proof then names the first lost requirement.

    The first lost requirement is read in Pack-before-Part audited order:
    \[
      \begin{aligned}
      \text{lost same-fluid carrier} &\longmapsto \neg\Pack_Q,\\
      \text{lost pressure-viscosity-incompressibility participation} &\longmapsto \Pack_Q\wedge\neg\Part_{N,Q},\\
      \text{lost positive-scale coherent field readout} &\longmapsto
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
      \end{aligned}
    \]
    These are membership failures, not three independent proof programs.  Pack asks whether the selected record is carried by the same fluid body.  Part asks whether the same Navier--Stokes law acts on that body through the finite derivative tower being tested.  Field asks whether the resulting readings still live on one positive scale.

    The forward-positive work determines what \(Q\) is.  It may select the transported torus atlas, an exterior-source survivor in \(\mathbb R^3\), a high-frequency tail, a source reserve, or an annular residual branch.  After selection, the silver route consumes that exact record.  It does not choose a more convenient comparison object and it does not turn a failed estimate into a smoothness proof.  The paper has to show the record, name the class data it carries, and derive the first Pack, Part, or Field loss.

    This is the economical closure test for the manuscript.  A branch can close on the silver side only after the page has made the same-solution record readable and then shown the face failure.  A branch can close on the gold side only when the direct forward estimate supplies the continuation readout.  Material that has not selected a same-solution terminal record remains support for a later hinge.
