    \section{Compressing The Map To Pack, Part, And Field}

    The reader can now forget most branch names.  The classification proof uses the branch map only through three tests on the selected terminal record \(Q\).  First, does \(Q\) still have a positive same-fluid carrier?  Second, does the same Navier--Stokes pressure-viscosity-incompressibility law still act on that carrier through the tower being tested?  Third, after the first two answers survive, do the retained readings form one velocity field on a positive scale?

    These tests are written as
    \[
      \Pack_Q,\qquad
      \Part_{N,Q},\qquad
      \Field_{N,r,Q}.
    \]
    They are ordered because the proof is looking for the first lost requirement.  A missing body is not a broken field; the field question has not yet begun.  A retained body with broken same-law participation is not merely a large derivative; the selected object has lost the equation that would make the derivative tower a Navier--Stokes tower.  A retained body with retained participation can still fail to be a member-side record if no positive scale carries one coherent field.

    Thus the terminal alternatives have the form
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    This is not a naming convention.  It is the proof discipline for the rest of the paper.  A branch may describe a pulse, reserve, jump, weak limit, shear sheet, or Zeno source.  Before it can prove class exit, the paper must say which same-solution terminal record is under test and which one of the three displayed alternatives is the first failure.

    The annular endpoint shows why the order matters.  The point \(r=0\) can look like no carrier, but the alleged singularity is witnessed by positive-radius fields shrinking toward that point.  Once those annular fields are selected as the terminal record, carrier has been paid for that test.  The remaining nonsmooth annular exit is then Part or Field.  Pack remains available only for no-carrier or pre-admission failure.
