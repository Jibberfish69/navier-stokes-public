    \section{Part And Field Failure Mechanisms}

    The old words dead, jump, and blown are useful only after the first failed face has been located.  They are mechanism descriptions, not extra terminal classes.  The proof first fixes the selected record \(Q\), checks Part, then checks Field; Pack is only Field-window evidence.  Only after that order is clear may the mechanism be named.

    \subsection{Dead}

    Dead is the clean Part mechanism.  A carrier is still being named, but the same pressure-viscosity-incompressibility law no longer acts on it through the tower being tested.  The word does not mean zero velocity.  It means loss of same-object dynamics.  In symbols, the first face is
    \[
      \Pack_Q\wedge\neg\Part_{N,Q}.
    \]
    Once Part fails, neighboring field readings usually fail as a consequence, but the proof records Part as the first lost requirement.

    \subsection{Jump}

    Jump is the clean Field mechanism.  The carrier survives and the local law remains readable far enough to compare neighboring readings, but those readings do not assemble into one velocity field on any positive scale allowed by the record.  The first face is
    \[
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    A jump is not an infinite value.  It is a coherence failure: finite local readings cannot be the readings of one smooth field.

    \subsection{Blown}

    Blown is the unbounded-tower mechanism.  A positive carrier remains visible, and a derivative, pressure term, viscous term, or continuation readout becomes unbounded at the finite depth under test.  This mechanism does not decide the face by itself.  If the unbounded reading destroys the carrier, the first face is Pack.  If the carrier survives while the pressure-viscosity tower is no longer the same Navier--Stokes tower, the first face is Part.  If Pack and Part survive but no positive-scale coherent field can include the unbounded reading, the first face is Field.

    This is the point of the taxonomy.  Large quantities, terminal pulses, weak limits, and endpoint traces do not prove exit merely by sounding singular.  They prove exit only after the paper identifies the selected same-solution record and derives the first Pack, Part, or Field face failure on that record.
