    \section{Endpoint Failure Map}

    The forward work produces many named surfaces, but the terminal proof does not ask the reader to carry all of those names.  At the point where a finite-time breakdown is alleged, the paper asks a smaller question.  What object is being offered as the terminal record for the original Navier--Stokes branch, what has already been paid for that object, and which first requirement can fail?

    This section is the map from the forward attempts into that terminal question.  Each entry below has the same form.  The first sentence names what the direct route tried to prove.  The second sentence names the survivor left behind when the route does not close.  The last sentence says how that survivor can enter the Part/Field test.  A branch that has not selected a same-solution terminal object remains support; it is not yet a CM proof step.

    \begin{enumerate}[leftmargin=2em]
    \item \textbf{Energy and enstrophy.}
    The energy identity controls \(\|u(t)\|_{L^2}\) and the time integral of \(\|\nabla u(t)\|_{L^2}^2\).  The enstrophy identity exposes the source
    \[
      \int (u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    The survivor is derivative growth that energy alone does not see.  If the same branch still carries the derivative tower, the pressure is Part or Field; if the tower has no positive same-fluid carrier, the failure is Pack before any tower question begins.

    \item \textbf{Global energy--enstrophy budget.}
    The quantity
    \[
      Q(t)=\|u(t)\|_{L^2}^2+\|\nabla u(t)\|_{L^2}^2
    \]
    is useful as a visible budget, but it is too coarse to stop all transfer to small scales.  The survivor is a concentration or source reserve hidden below the scale read by \(Q(t)\).  It becomes CM material only when the paper names the terminal record carrying that reserve.

    \item \textbf{Scale barrier and dyadic tail.}
    The direct route tries to make high-frequency transfer summable.  The survivor is a lower-prefix memory, high-high packet, or upper-tail leakage that keeps moving activity into dangerous shells.  If the selected survivor has no coherent positive-scale field after Pack and Part survive, the first unpaid face is Field.

    \item \textbf{Cascade ancestry.}
    Some branches try to identify the parent of a dangerous packet: donor window, previous shell, pressure channel, or source history.  The survivor is an ancestry claim.  Missing donor body is Pack pressure; a retained donor whose ancestry is no longer governed by the same pressure-viscosity-incompressibility law is Part pressure.

    \item \textbf{Pressure-source and Zeno residue.}
    The longest positive branch follows pressure sustain, source residue, no-incoming-source drain, time-face anti-atom, angular saturation, and Zeno ancestry.  The survivor is a terminal reserve whose payment is pushed to a smaller time face or a previous source parent.  After the annular witness has been admitted, this is not a Pack shortcut.  The surrounding positive-radius fields have paid carrier for that annular test, so the remaining failure must be Part or Field.

    \item \textbf{Compactness and tensor closure.}
    The direct route needs a classical approximation family whose nonlinear tensors converge strongly enough that \(u^{(n)}\otimes u^{(n)}\) becomes \(u\otimes u\).  The survivor is a weak limit or terminal trace that keeps information without giving one classical field.  This is Field pressure when the pieces cannot assemble into one positive-scale velocity field.

    \item \textbf{Gradient transfer and coercivity.}
    The route tries to absorb high-frequency production into viscosity plus a summable tail.  The survivor is a spill collar, lifted high-side remainder, or high-high gradient packet.  The first face depends on what survives: no carrier gives Pack, broken pressure-viscosity action gives Part, and retained but non-coherent readings give Field.

    \item \textbf{Comparison, export, and wrong-object support.}
    A nearby equation, filtered model, geometric estimate, or comparison branch can explain a mechanism without proving the Clay claim.  The survivor is a useful object that may no longer be the fixed-viscosity Navier--Stokes branch.  It supports the paper only after it is reattached to the original solution, or else it is recorded as a scope boundary.
    \end{enumerate}

    The map is exhaustive for the manuscript in the following narrow sense: every branch used later must enter through one of these terminal roles.  It either supplies a continuation readout, selects a same-solution terminal object, proves a Pack failure, proves a Part failure, proves a Field failure, or remains support.
