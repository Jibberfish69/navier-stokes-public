    \section{The Class-Membership Exit Method}
    \label{sec:cm-exit-method}

    The preceding branches share the same lesson. A positive-forward proof tries to
    pay every dangerous channel by a stronger estimate. When that effort stalls, the
    branch leaves a more precise terminal object: a source reserve, a high-frequency
    tail, a compactness artifact, a surface-fidelity defect, an endpoint remnant, or
    an export boundary. The class-membership exit method begins at that point.

    The method asks a direct question. Suppose a finite-time breakdown claim points
    to a terminal object \(Q\). What must \(Q\) carry in order to count as a terminal
    object for the same Navier--Stokes solution?

    We write the working class as
    \[
      \mathfrak O_{\NS}^{\mathrm{work}}.
    \]
    Membership in this class means that the object under discussion is still a
    same-solution Navier--Stokes object. It has to remain attached to the original
    datum, the same equation, the same pressure-viscosity participation law, and a
    field readout capable of supporting continuation.

    The exit predicate is
    \[
      \Exit(Q;\mathfrak O_{\NS}^{\mathrm{work}})
      :=
      \neg\Member(Q;\mathfrak O_{\NS}^{\mathrm{work}}).
    \]
    This formula is the organizing primitive of the proof. It does not assert that a
    bad-looking object is automatically an exit. The object first has to enter the
    same-solution terminal test. The exit is derived only after a required membership
    requirement fails.

    The requirements are recorded as three faces.

    \paragraph{Pack.}
    The Pack face asks whether the terminal object has a positive material carrier
    or selected packet. A proposed breakdown witness has to be carried by something
    with positive terminal presence. A zero-radius remnant, detached donor ancestry,
    or packet with no selected positive carrier fails at this face.

    \subsection{The endpoint point and the annular witness}
    \label{subsec:annular-limit-witness}

    The endpoint point is not the whole singularity question. A point with radius
    zero cannot by itself be the positive packet required for continuation, but a
    finite-time singularity is normally seen through the fields on neighborhoods
    around that point. Those neighborhoods still have positive radius before the
    limit. The proof has to follow them.

    Write the alleged terminal point as \((x_*,T_*)\). Choose radii
    \(\rho_m\downarrow 0\) and times \(t_m\uparrow T_*\). The annular witness is the
    family of positive-radius windows around the tip, for example
    \[
      \mathcal A_m
      =
      \{(x,t):\rho_{m+1}<|x-x_*|<\rho_m,\quad
      T_*-\rho_m^2<t<T_*\}.
    \]
    Each \(\mathcal A_m\) is still part of the same preterminal Navier--Stokes
    solution. The endpoint statement \(r_*=0\) only says that the point-object is not
    a selected continuation packet. It does not yet say what happened to the
    surrounding fields on the annuli.

    The accounting on the annuli is residual accounting. Raw energy, raw boundary
    flux, raw cone volume, and raw tower amplitude are too coarse for this point of
    the proof. The current theorem notes use the residual load
    \[
      D_m^{\mathrm{res}},
    \]
    obtained after the already-paid pieces have been removed: heat descendants,
    through-flow, legal losses, finite payments, and paid dissipation. The live
    question is whether that remaining load can keep refilling a scale-critical
    terminal profile on infinitely many annular slabs.

    The load is measured from the same dyadic residual account used by the current
    forward-positive notes. At scale \(2^{-j_m}\simeq \rho_m\), write
    \[
      u_j=\Delta_j u,\qquad
      E_j(t)=2^{2j}\|u_j(t)\|_2^2,\qquad
      D_j(t)=2^{4j}\|u_j(t)\|_2^2 .
    \]
    The positive nonlinear source into the shell is \(\Phi_j^+(t)\), and the shell
    energy obeys
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)\le \Phi_j^+(t).
    \]
    After solving from an entrance time \(t_0\), the unpaid refill part is
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The annular \(D_m^{\mathrm{res}}\) is this quantity localized to the shells and
    time windows meeting \(\mathcal A_m\). It records positive same-solution
    nonlinear refill after the heat descendant and already-paid losses have been
    removed.

    In this section the open gold supplier has the following concrete form:
    \[
      \forall \varepsilon>0\ \exists \rho_\varepsilon>0
      \quad\text{such that}\quad
      \rho_m<\rho_\varepsilon \Longrightarrow D_m^{\mathrm{res}}\le \varepsilon
    \]
    for every same-solution terminal annular schedule. A stronger tail estimate is
    \[
      \sup_{\mathcal A}\ \sum_{m\ge M}D_m^{\mathrm{res}}
      \longrightarrow 0
      \qquad(M\to\infty).
    \]
    This is the forward-positive estimate that remains open. Its failure is the
    residual annular obstruction that the silver route is allowed to classify.

    The paper treats the annular witness as a live proof argument. The gold route
    asks for forward annular control: the residual scale-critical load on these
    windows must remain controlled strongly enough that no terminal singular profile
    survives. In the notation of the current theorem notes, this is the role of
    \(\mathrm{AnnularLimitForwardControl.A}\).

    The silver route asks the CM question directly only after the annular residue
    has been admitted as the same-solution witness. At that point carrier has been
    paid for this annular test. A no-carrier outcome is pre-admission failure, not
    the CM argument here. The admitted annular witness can fail by Part, when it
    leaves the same pressure-viscosity-incompressibility law, or by Field, when
    participation survives but no positive-scale coherent field readout remains.
    This is the role of \(\mathrm{AnnularLimitCMFaceLanding.A}\).

    This distinction is important for the reader. The proof is not allowed to call
    the terminal-radius problem closed merely because the endpoint has radius zero.
    The actual singularity witness is the limiting behavior of the positive-radius
    fields around the point. The stronger gold annular estimate is still open, and
    the silver analysis applies after annular admission by landing the nonsmooth
    residual branch in Part or Field.

    The proof state after this subsection is precise. The endpoint point-object has
    a Pack reading, but the singularity claim is carried by the annular fields.
    Gold remains the stronger direct estimate. Silver receives only an admitted
    annular witness, and after that admission the nonsmooth branch is Part or Field,
    not Pack.

    \paragraph{What the gold layer has paid.}
    The forward-positive cone notes have not been wasted, and they are not final
    closure. They have paid the accounting around the annulus: the moving-cone local
    energy identity, the distinction between discounted physical energy and
    undiscounted scale-critical cone control, the conditional implication from a
    finite undiscounted cone budget to late-slab smallness and regularity, the
    failure of raw LPAS as a closure currency, the residual refill currency
    \(D_m^{\mathrm{res}}\), the critical payment-rate threshold
    \(O(\nu^3/r)\), and the \(N+2\) derivative-tower debt.

    The remaining gold theorem is exactly the scale-uniform supplier. It has to
    show that the residual annular refill cannot beat participation on every
    shrinking schedule, or that the discounted physical cone account can be upgraded
    to the undiscounted scale-critical cone budget. The CM exit route begins only
    with the residual annular obstruction left after that forward accounting.

    The current forward-positive obstruction is terminal Zeno source-refill. Donor
    balance and entrance-leaf decay pay non-Zeno trees, but a Zeno branch may have
    \[
      r_m\downarrow0,\qquad \sum_m r_m^2<\infty,
    \]
    while retaining positive same-solution source mass on shrinking heat-time
    windows. The unresolved gold production theorem is
    \[
      \mathrm{TerminalTimeFaceAntiAtom.A},
    \]
    or an equivalent theorem producing temporal thickness, source Carleson charge,
    diffuse-parent charge, no-incoming-flux control, or rigid source-residue
    Liouville. Until that production theorem is proved, the silver route receives
    only the surviving residual source-balanced pulse.

    The corrected goal-run boundary is now explicit.  The installed forward-positive inputs
    leave the terminal time-face concentration model
    \(g_m(s)=m\,1_{(-1/m,0]}(s)\) alive: it has bounded \(L^1_s\) source mass and
    concentrates on the terminal time face.  That is the hard gold obstruction, not
    a hidden proof of the annular supplier.  In residual currency the obstruction is
    visible on heat-scale windows.  Put \(\lambda_m=2^{j_m}\),
    \(\tau_m=\lambda_m^{-2}\), and
    \[
      \Phi_{j_m}^+(s)=a_m\,1_{[t_m-\tau_m,t_m]}(s),
      \qquad 0<a_0\le a_m\le A .
    \]
    Then
    \[
      \sum_m\int_{t_m-\tau_m}^{t_m}\Phi_{j_m}^+(s)\,ds
      \le A\sum_m2^{-2j_m}<\infty,
    \]
    but
    \[
      D_{j_m}^{\mathrm{res}}(t_m;t_m-\tau_m)
      =
      a_m\frac{1-e^{-c_0\nu}}{c_0\nu}
      \ge a_0\frac{1-e^{-c_0\nu}}{c_0\nu}.
    \]
    Finite source mass does not force the residual annular refill to vanish.  Once
    the surviving residual annular witness is admitted as the same-solution terminal
    object, Pack is no longer the CM argument: carrier and selection have already
    been paid.  Retained same-equation participation and a positive-scale Field
    readout give \(\Member(Q;\Owork)\).  A finite nonsmooth admitted annular witness
    must exit \(\Member(Q;\Owork)\) through Part failure or Field failure.

    \paragraph{Silver annular face landing.}
    The silver route for this residual obstruction is the annular face-landing
    route:
    \[
      \mathrm{AnnularLimitCMFaceLanding.A}.
    \]
    Its premise is not merely that the endpoint has radius zero. Its premise is
    that the surviving annular residual has been admitted as the same-solution
    terminal witness and is readout-complete for the claimed breakdown. Under that
    premise, Pack is not available as the annular CM argument. Loss of coherent
    annular carrier would mean this annular witness was not admitted. The admitted
    witness can fail by Part, when it loses the same
    pressure-viscosity-incompressibility tower, or by Field, when retained
    participation has no positive-scale field readout.

    The Field line is not only a label.  If Part survives and a positive-scale Field
    readout gives the installed \(H^s\), \(s>5/2\), bound \(M\), then
    \[
      \|\Delta_j\mathbb P\nabla\cdot(u\otimes u)\|_2
      \le C_sM^2\,2^{-j(s-1)},
      \qquad
      \|u_j\|_2\le M\,2^{-js}.
    \]
    Thus
    \[
      \Phi_j^+(t)\le C_sM^3\,2^{(3-2s)j}
      \quad\text{and}\quad
      D_j^{\mathrm{res}}(t;t_0)\le C_s'M^3\,2^{(3-2s)j}\to0 .
    \]
    A selected residual pulse with \(D_{j_m}^{\mathrm{res}}\ge\eta>0\) cannot keep
    that Field readout.  After Part survives, the nonzero pulse is a Field failure.

    The annular face landing exposes the silver boundary: selection and readout
    completeness for the annular tail. Those premises are treated as proof
    obligations here, not hidden finality language.

    Selection means that the proof has to keep the annular tail tied to the
    original alleged breakdown. The object under the CM test must be the tail the
    preterminal Navier--Stokes field gives as \(t\uparrow T_*\), not a later
    surrogate chosen because it is easier to classify. Readout completeness means
    that the selected tail has to carry enough same-solution records to run the CM
    test: coherent carrier, same pressure-viscosity-incompressibility participation,
    the derivative tower depth in force, and positive-scale field information. Once
    that annular witness is admitted, a surviving annular obstruction has no hidden
    fourth landing place: it either continues on the membership side, or it fails
    same-equation participation or positive-scale field readout.

    On the periodic branch, the whole transported material atlas pays that boundary.
    The terminal object is \(Q_{\mathrm{atlas}}\), not a private annular packet. The
    atlas selection keeps the annular tail attached to the original solution, the
    finite atlas overlap supplies the global \(H^s\) readout when Pack, Part, and
    Field all survive, and the unified Pack predicate turns loss of atlas selection
    or material comparability into \(\neg\Pack_{Q_{\mathrm{atlas}}}\). The annular
    residue still matters, but it matters as a branch read inside the selected
    whole-atlas object. The remaining open work at this point is the gold
    forward-positive supplier: scale-uniform control of the residual annular refill.

    The whole-space branch has its own payment. It is not copied from the torus
    atlas. For rapidly decaying data on \(\mathbb R^3\), the exterior Duhamel split
    removes the initial heat tail and the far-field effect of a fixed compact-core
    source. The remaining source is the nonlinear source already living far out in
    space. If that source vanishes in exterior \(H^s\), the whole-space continuation
    readout is available. If it survives, fixed-band control removes bounded
    frequencies and leaves a dyadic high-frequency escape. The survivor is then read
    inside the CM packet test: Pack when no same-fluid material address remains,
    Part when the source has detached from the same equation and participation law,
    and Field when retained Pack plus Part still has no fixed positive Field scale.
    The direct exterior \(H^s\) theorem remains stronger gold/export work; it is not
    being spent as a silent silver premise.

    \paragraph{Part.}
    The Part face asks whether the same Navier--Stokes equation still acts on the
    selected packet. The pressure law, viscosity, divergence-free constraint, and
    preterminal branch have to remain the same. A source object that survives only by
    leaving the original pressure-viscosity participation law fails at this face.

    \paragraph{Field.}
    The Field face asks whether the object admits a positive-scale coherent field
    readout. Once the object has a carrier and participates in the same equation, it
    still has to produce field information strong enough to belong to the
    continuation side. A terminal object with no positive-scale field readout fails
    at this face.

    The branch split is:
    \[
      \text{terminal witness candidate}
      \quad\longrightarrow\quad
      \begin{cases}
      \text{membership side: continuation readout},\\
      \text{exit side: first failed requirement}.
      \end{cases}
    \]
    The pass side belongs to the classical continuation logic. The fail side gives a
    class exit and cannot serve as an in-class nonsmooth terminal continuation of the
    same solution.

    This is why the CM-exit method is a proof route. It does not try
    to prove global smoothness by one monolithic estimate. It consumes the finite
    breakdown witness itself. Every branch that produces a terminal survivor must
    explain the survivor's role inside the same-solution membership test.

    The method fixes the structure of this paper. Each branch section
    has to end by placing its survivor into one of four bins:
    \[
      \text{continuation readout},\qquad
      \text{Pack failure},\qquad
      \text{Part failure},\qquad
      \text{Field failure}.
    \]
    A branch can also remain marked as support or scope boundary until its terminal
    object is admitted to the test. This prevents source-wall, no-pulse, endpoint,
    local-critical, compactness, or comparison material from being promoted before it
    lands on a same-solution face.

    The no-third-branch principle is the final class-law step. After the terminal
    object is admitted to the same-solution test, the branch cannot be both a lawful
    in-class continuation and the same finite nonsmooth terminal witness whose first
    membership requirement has failed. The pass branch and the exit branch have different
    membership conclusion. That distinction is the engine of the contrapositive proof.
