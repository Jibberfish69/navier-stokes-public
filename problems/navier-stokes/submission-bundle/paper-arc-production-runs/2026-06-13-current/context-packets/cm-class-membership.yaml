    \section{Silver Standard Approach}

    The silver-standard approach is the class-membership proof for a same-solution terminal record.  It is a certification layer with its own burden.  It receives a terminal object only after the manuscript has selected the record for the original solution and stated what forward-positive accounting has left unpaid.

    The split is
    \[
      \text{pass: the selected record remains a same Navier--Stokes member,}
    \]
    \[
      \text{fail: the selected record exits the working Navier--Stokes class.}
    \]

    On the pass side, the record keeps a positive material carrier, the same pressure-viscosity-incompressibility participation law, and one coherent positive-scale velocity field.  That record belongs to the continuation/readout side and has to be paired with the relevant continuation supplier.  On the fail side, the record loses one requirement that belongs to the problem definition.  That first loss is the class-exit witness for the alleged breakdown branch.

    The silver burden has three parts.  First, the manuscript has to identify the terminal picture supplied by the forward-support work.  Second, it has to select the same-solution object being tested.  Third, it has to land the selected object at its first failed face:
    \[
      \begin{aligned}
      \text{lost carrier} &\longmapsto \Pack,\\
      \text{lost same-law participation} &\longmapsto \Part,\\
      \text{lost positive-scale field readout} &\longmapsto \Field.
      \end{aligned}
    \]

    This is the present certification boundary.  The periodic branch has a selected whole-torus material atlas.  The whole-space branch has an exterior-source CM dichotomy.  The annular endpoint branch remains explicitly open: the radius-zero point is a Pack-side point-object, and the surrounding positive-radius fields still need gold control or, after annular admission, a Part or Field landing.  The paper can claim only the payments written on the page.  Full CMI finality requires every live terminal record to pass this gold-or-silver accounting with rendered evidence.
