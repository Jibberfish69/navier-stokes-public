    \section{Expanded CM Branch Obligations}

    This appendix expands the source field into class-membership obligations. Each numbered obligation names the terminal mechanism, the CM requirement being tested, and the proof role it plays in the pass-or-exit engine. The full source inventory is kept outside the reader-facing paper.

    \subsection{CM proof role 1: Field-face terminal obligations}
    This proof role accounts for 769 branch obligations with one mathematical CM job. The proof rules represented here are retained field failure after the other faces have been removed (417); direct face failure (352). The tested requirements are Field \{N,r,Q\} (769). The terminal mechanisms represented here are terminal source wall, source reserve, source pulse, square source, or active window failure (285); one field coherence, receiver, finite difference, Field readout, or endpoint Field failure (266); carrier, cover, or Pack gauge failure routed by the row's face sort rule (96); source wall / Carleson type retained terminal source failure routed by the row's face sort rule (69); Zeno or zero heat time source residue failure routed by the row's face sort rule (33); one field coherence or Field readout failure routed by the row's face sort rule (14); Zeno terminal atom, zero heat time residue, or terminal source residue failure (6).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 1 keeps carrier and participation but gives \(\forall r>0\,\neg\Field_{N,r,Q}\), hence \(\Exit(Q;\Owork)\).

    \emph{Proof.} This branch is read after carrier and participation have survived for the case split. The remaining continuation requirement is a positive-scale coherent field readout. The terminal branch has no such scale at any \(r>0\), so the Field face fails and the failure embeds as \(\Exit(Q;\Owork)\).

    \emph{Reader-facing role.} This is the last face of the witness tree, so the page has to make the order visible. The branch has already survived the packet and participation questions; what remains is the absence of any positive scale on which the field can be read coherently. The conclusion is Field-face exit, not a generic statement that the solution looks bad.

    \subsection{CM proof role 2: finite Pack/Part/Field disjunction obligations}
    This proof role accounts for 96 branch obligations with one mathematical CM job. The proof rules represented here are finite face disjunction (96). The tested requirements are Field \{N,r,Q\} and Pack Q and Part \{N,Q\} (96). The terminal mechanisms represented here are branch local first failure routed by the surface's trichotomy or boundary lemma (80); carrier, cover, or Pack gauge failure routed by the row's face sort rule (7); source wall / Carleson type retained terminal source failure routed by the row's face sort rule (5); Zeno or zero heat time source residue failure routed by the row's face sort rule (2); one field coherence or Field readout failure routed by the row's face sort rule (2).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 2 gives a finite disjunction of Pack, Part, and Field losses, hence \(\Exit(Q;\Owork)\).

    \emph{Proof.} The terminal branch presents finitely many same-solution alternatives. Each alternative is tested in Pack-first order. A finite disjunction of Pack, Part, and Field losses is still exhausted by the CM witness tree, so every alternative gives the same class-exit conclusion.

    \emph{Reader-facing role.} This keeps the reader from seeing the alternatives as an open cloud of cases. There are only finitely many branch options here, and each option pays one of the same three witness-face costs. Once the finite list is exhausted, there is no remaining terminal branch outside the pass-or-exit law.

    \subsection{CM proof role 3: inherited-authority obligations}
    This proof role accounts for 44 branch obligations with one mathematical CM job. The proof rules represented here are authority inheritance with no new terminal face (44). The tested requirements are no independent Pack/Part/Field face (44). The terminal mechanisms represented here are authority or generated carrier for the installed face sweep boundary (24); copy of an authority or export support surface (17); carrier, cover, or Pack gauge failure routed by the row's face sort rule (3).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 3 introduces no independent terminal alternative outside the installed Pack/Part/Field exhaustion.

    \emph{Proof.} The branch carries already established CM content. Its mathematical force is inherited from the terminal packet capture and face-exhaustion theorems. Since it supplies no new selected nonsmooth packet, it contributes no extra continuation requirement and no fourth branch.

    \emph{Reader-facing role.} For the reader, the point is restraint. This entry explains why already-paid proof work is not being reread as a new terminal branch. It belongs in the manuscript because it preserves the closed branch count and prevents a hidden fourth alternative from being smuggled back into the argument.

    \subsection{CM proof role 4: Pack-face terminal obligations}
    This proof role accounts for 244 branch obligations with one mathematical CM job. The proof rules represented here are direct face failure (244). The tested requirements are Pack Q (244). The terminal mechanisms represented here are carrier, cover, packing, retained packet admission, or Pack bridge failure (164); carrier, cover, or Pack gauge failure routed by the row's face sort rule (71); one field coherence or Field readout failure routed by the row's face sort rule (7); participation, no drop, or Part envelope failure routed by the row's face sort rule (2).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 4 gives \(\neg\Pack_Q\), hence \(\Exit(Q;\Owork)\).

    \emph{Proof.} A member branch must first carry \(Q\) by a positive same-fluid packet. The selected terminal branch loses that carrier requirement before any participation or field readout can be asked of it. The Pack-first order therefore gives \(\neg\Pack_Q\), and the class-exit embedding gives \(\Exit(Q;\Owork)\).

    \emph{Reader-facing role.} On the page, this tells the reader that the branch never reaches the later questions. The proof is not claiming a new smooth solution; it is recording that the alleged terminal branch cannot even supply the packet that would let membership be tested. That is why the branch belongs on the fail side of the pass-or-exit split.

    \subsection{CM proof role 5: Part-face terminal obligations}
    This proof role accounts for 250 branch obligations with one mathematical CM job. The proof rules represented here are direct face failure (250). The tested requirements are Part \{N,Q\} (250). The terminal mechanisms represented here are same PDE participation, no drop, pressure viscosity tether, envelope, or Part bridge failure (195); carrier, cover, or Pack gauge failure routed by the row's face sort rule (42); one field coherence or Field readout failure routed by the row's face sort rule (7); participation, no drop, or Part envelope failure routed by the row's face sort rule (6).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 5 keeps the carrier but gives \(\neg\Part_{N,Q}\), hence \(\Exit(Q;\Owork)\).

    \emph{Proof.} Here the carrier question has already passed for the purpose of the split. The branch still has to participate in the same pressure-viscosity tower as the original Navier--Stokes solution. The selected failure breaks that tower, so the first surviving lost requirement is \(\Part_{N,Q}\). The face failure embeds as class exit.

    \emph{Reader-facing role.} The reader-facing point is that this is a same-solution participation test. The same-fluid carrier is still present. The branch no longer participates in the Navier--Stokes pressure-viscosity tower that the member branch needs. The obligation therefore closes by loss of participation.

    \subsection{CM proof role 6: support-boundary obligations}
    This proof role accounts for 541 branch obligations with one mathematical CM job. The proof rules represented here are support retained outside the CM conclusion until a bridge supplies a face (541). The tested requirements are no independent Pack/Part/Field face (541). The terminal mechanisms represented here are history, audit, or context support (164); downstream export or readout consumer (94); root support or context surface (91); carrier, cover, or Pack gauge failure routed by the row's face sort rule (71); supplier/readout claim without independent CM steering authority (42); runtime or governance surface (31); manuscript or export presentation (23); source recovery or history context (22); Zeno or zero heat time source residue failure routed by the row's face sort rule (2); participation, no drop, or Part envelope failure routed by the row's face sort rule (1).

    \paragraph{Family proof role.}
    \emph{Claim.} CM proof role 6 has no CM conclusion until it selects a same-fluid terminal packet.

    \emph{Proof.} A support branch can strengthen the positive pass side, sharpen a pressure test, or prepare a later terminal witness. It cannot assert \(\Member(Q;\Owork)\) or \(\Exit(Q;\Owork)\) by itself. Its proof role is to feed a later Pack, Part, Field, membership-readout, or no-third-branch hinge.

    \emph{Reader-facing role.} This is included so the reader can see the boundary of the proof claim. The material may be useful, but it has not yet selected the same-fluid terminal packet that the CM test consumes. Until that selection is made, the branch remains support for the argument rather than an independent class conclusion.


