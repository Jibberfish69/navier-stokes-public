  - gold status and obstruction stated without redefining gold
  - CM/silver counterpart written where the arc touches class exit
  - endpoint status stated as proved, support, obstruction, obsolete, contradiction,
    or open continuation
  must_not_write:
  - current-state paper boilerplate
  - worker/runner/source-spine/bookkeeping voice
  - placeholder prose
  - unsupported theorem claim hidden as narrative confidence
