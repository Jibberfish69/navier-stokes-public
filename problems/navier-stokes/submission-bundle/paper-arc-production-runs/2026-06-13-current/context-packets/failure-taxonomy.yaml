    \section{Generally Classifying Failure Types From the List}

    The inventory above is useful only after it is compressed into proof behavior.  The reader should not have to remember every branch name.  What matters is what kind of terminal record the branch leaves behind and which membership face that record pressures first.

    \textbf{Loss of selected body.}
    The terminal story points at a trace, pulse, residue, limiting record, or endpoint, while the positive same-fluid carrier has disappeared.  Once the paper has selected that record as the object under test, this is Pack pressure.  A point with no positive carrier is a Pack-side object.

    \textbf{Detached ancestry.}
    The terminal reserve is assigned to a donor, parent window, pressure channel, previous shell, or source history.  The ancestry has to remain the ancestry of the same transported Navier--Stokes branch.  Missing donor body is Pack pressure.  Retained carrier with a broken pressure-viscosity-incompressibility ancestry law is Part pressure.

    \textbf{Lost participation.}
    The packet remains visible, while the original Navier--Stokes law no longer acts on it as one pressure-viscosity-incompressibility law.  This is the clean Part case.  The proof has a body, and the body has lost the same equation.

    \textbf{Broken neighboring-field coherence.}
    Several readings can be finite and locally meaningful while failing to join into one velocity field on a positive scale.  After Pack and Part have survived far enough for the neighboring readings to be compared, this is Field pressure.  The Euler boundary material is used only to recognize an escaped inviscid reading; the Navier--Stokes target remains the fixed-viscosity class.

    \textbf{Tower blowup.}
    The packet stays positive, while the derivative tower, pressure readings, or viscous readings lose the finite control needed by the continuation criterion.  The first face depends on where the loss occurs.  The paper must locate that first failure rather than calling every large quantity an exit.

    \textbf{Wrong object.}
    A regularized equation, filtered dynamics, geometric model, exported estimate, or comparison branch can solve a nearby problem.  The Clay object stays the original Navier--Stokes branch.  Material of this kind can support the proof only after it is reattached to the original solution or recorded as a scope boundary.

    These shapes do not finish the proof by naming a defect.  They tell the reader what each branch has to pay.  A branch must select its terminal record, show why that record belongs in the same-solution test, and then prove the first Pack, Part, or Field face that fails on that record.
  truncated: false
