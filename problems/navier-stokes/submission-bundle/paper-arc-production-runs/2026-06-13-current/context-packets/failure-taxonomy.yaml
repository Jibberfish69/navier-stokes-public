    \section{Packet Failure Types}

    Packet failure is carrier failure.  It happens before the proof asks whether a derivative tower is unbounded or whether neighboring readings fit together.  Typical Pack failures are:
    \[
    \begin{array}{l}
    \text{no positive terminal carrier scale,}\\
    \text{a source atom with no transported body,}\\
    \text{a donor history detached from the same flow,}\\
    \text{a Zeno ancestry with no positive terminal packet,}\\
    \text{or degeneration of the material atlas needed for readout.}
    \end{array}
    \]

    The annular endpoint issue is the main reason Pack must be handled carefully.  The radius-zero point is a point-object reading, not the supplier payment.  A finite-time singularity is witnessed by the surrounding positive-radius annular fields as they shrink toward the endpoint.  Those annuli remain live until the gold route controls their residual load or the silver route admits the selected residual obstruction and lands it at Part or Field.  Pack belongs only to no-carrier or pre-admission failure here, not to the admitted annular witness.
  truncated: false
