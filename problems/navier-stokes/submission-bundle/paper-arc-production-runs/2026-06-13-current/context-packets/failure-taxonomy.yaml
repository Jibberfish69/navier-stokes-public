  text: |+
    \section{Exhaustive Failure List}

    The support stack behind this paper is large.  The terminal possibilities it
    leaves for the CM test are few.  This section is the reader's map from the
    forward-positive work to the class-membership proof.  Each item records three
    things: the estimate or branch that was tried, the terminal picture left behind
    when that branch stalls, and the first membership face naturally put under
    pressure by that picture.

    The list is exhaustive in this precise sense.  It covers the failure surfaces
    used by the present manuscript and by the current proof notes.  The rule is
    strict: a surface becomes CM proof material only after the same-solution
    terminal object has been selected.

    \begin{enumerate}[leftmargin=2em]
    \item \textbf{Energy/enstrophy insufficiency.}
    Energy controls the \(L^2\) size of the velocity and gives time-integrated dissipation.
    The enstrophy step exposes the nonlinear source term.
    The failure picture is derivative growth left uncontrolled by energy.  The CM
    threat is a retained terminal record whose derivative tower is being used as a
    same-solution readout while the equation has left the corresponding same-law
    control unpaid.

    \item \textbf{Monotone functional \(Q(t)\).}
    The recovered positive route names \(Q(t)=\|u(t)\|_{L^2}^2+\|\nabla u(t)\|_{L^2}^2\) as a global energy/enstrophy budget.
    The failure picture is that a global budget can remain too coarse to stop dangerous transfer into smaller scales.
    The CM threat is retained budget information without the positive packet and
    positive-scale field control needed to make that information a member-side
    terminal record.

    \item \textbf{Scale barrier and dyadic tail.}
    The route asks for a same-surface estimate suppressing high-frequency transfer.
    The failed surface is the one-sided scale-memory or genuine high-high packet: activity keeps moving into the dangerous tail while the available budget sees too little of the transfer.
    The CM threat is a positive dyadic readout that cannot be assembled into one
    coherent field on any positive terminal scale.

    \item \textbf{Post-\(Q(t)\) cascade carrier.}
    After the monotone budget is named, the remaining burden is the exact carrier of the cascade.
    The failed picture is a localized remainder that keeps asking for a more precise parent.
    The CM threat is detached ancestry: the number has a donor story, while the
    donor fails to remain the same transported fluid object.

    \item \textbf{Pressure-source, BASAC, Zeno, and residue attempts.}
    This is the longest pressure-source branch.
    It contains pressure-sustain, pure-pressure residue, source-residue, no-incoming-source-drain, time-face anti-atom, angular-saturation, transported-boundary, quantized-parent, and Zeno-ancestry attempts.
    The failure picture is a terminal reserve whose payment is always pushed to another ancestor, another boundary, another time face, or another residue.
    The CM threat is not Pack after annular admission.  A no-carrier outcome means
    the annular witness was not admitted.  Once the surrounding positive-radius
    fields are the admitted witness, the threat is detached Part ancestry or
    retained annular field pressure that still has to be tested at Field.

    \item \textbf{Compactness and nonlinear tensor closure.}
    The positive route needs one classical approximation family to converge strongly enough that \(u^{(n)}\otimes u^{(n)}\) becomes \(u\otimes u\).
    The failure picture is a weak limit or endpoint trace that records information while failing to produce the same classical field.
    The CM threat is Field loss: the local pieces remain readable as fragments but
    do not assemble into one velocity field at a positive scale.

    \item \textbf{Gradient transfer and coercivity.}
    The route needs the high-frequency enstrophy tail to obey a coercive inequality with the nonlinear remainder absorbed into viscosity plus a summable tail.
    The failed surface is the spill collar, lifted high-side remainder, or genuine high-high gradient packet.
    The CM threat is a retained packet whose velocity, pressure, or viscous tower no
    longer has the finite readout required by membership.

    \item \textbf{Curvature, regularity, and export support.}
    Older positive surfaces used geometric or curvature language to control gradient growth.
    The failure picture is a useful coercive story whose carrier may be a nearby problem, a stronger structure, or an export support surface.
    The CM threat is target loss.  A proof for a filtered, geometric, regularized,
    or exported object does not prove membership for the fixed Navier--Stokes object
    unless the bridge back to the same solution is paid.

    \item \textbf{Interdependencies and closed-loop support.}
    The recovered source framework links scale barrier, monotone functional, compactness, and gradient control in a feedback cycle.
    The failure picture is a loop whose arrows remain descriptive while one bridge still lacks a same-surface estimate.
    The CM threat is unsupported participation: the packet is named inside the loop, while the pressure-viscosity participation law is still unpaid.

    \item \textbf{Target-fidelity and closure audit.}
    Regularized equations, filtered dynamics, stronger hidden data classes, and uncertified decay laws can make a nearby proof look smooth.
    The failure picture is a successful argument for the wrong object.
    The CM threat is direct class exit because the object has changed the problem definition.

    \item \textbf{Local critical translator and heat-ancestor records.}
    The late \(L^3\), Duhamel, heat-ancestor, and same-record surfaces try to attach endpoint information to the same terminal record.
    The failure picture is a readout or ancestor that survives as information while failing to attach to the same Navier--Stokes object.
    The CM threat is detached terminal ancestry when the ancestor is no longer the
    same transported branch, or Field readout loss when the readings survive but do
    not form one positive-scale field.

    \item \textbf{Euler class-entrance boundary.}
    Euler appears here only at the boundary where the same selected terminal picture has left the fixed-viscosity Navier--Stokes class while the inviscid transport-pressure law is still readable.
    In the clean Part/Field cases, the event is no longer the Navier--Stokes fluid object; it is a base Euler object, \(\mathrm{EVol}+\mathrm{EMom}\), possibly with failed one-field regularity.
    Slip sheets and weak shear examples give a concrete model of that boundary.

    \item \textbf{Current theorem-creation support surfaces.}
    Reserve-creation, active-height, height-flux, terminal angular depletion, and source-weighted variants add candidate ways a terminal reserve could appear or be seen.
    The failure picture is a live candidate branch that supplies pressure on the failure field before a final witness face has been selected.
    The CM threat is whichever first face the candidate actually violates: Pack, Part, or Field.
    \end{enumerate}

    The important point is that the list is a triage map.  The later proof must select the terminal record, show which of
    these pictures it realizes, and then prove the first Pack, Part, or Field face
    that fails on that record.

