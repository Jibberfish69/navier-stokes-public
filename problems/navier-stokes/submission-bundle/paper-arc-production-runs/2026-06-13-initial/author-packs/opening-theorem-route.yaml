    \section{Reframing the Problem}

    The direct route and the CM route ask different questions about the same branch.  The direct route asks whether the equation supplies estimates strong enough to continue the original solution.  The CM route begins with the exact obstruction left after that accounting and asks whether the selected terminal record is still a same-solution Navier--Stokes object.

    This reframing is not a change of problem.  It keeps the original datum, velocity-pressure branch, viscosity, pressure law, incompressibility constraint, and terminal role fixed.  A failed estimate becomes useful only after it produces a record \(Q\) that can be tested as the alleged terminal record of that same branch.  The CM test then asks three concrete questions.  Does \(Q\) still have a positive same-fluid carrier or packet?  That is Pack.  Does the same pressure-viscosity-incompressibility law still participate on the derivative tower being used?  That is Part.  Does the retained data still form a coherent positive-scale velocity field?  That is Field.

    The pass side is conservative.  If Part and Field survive on one selected record, that record remains on the member-continuation side and must be paired with the continuation readout named by the proof.  The fail side is equally concrete.  The proof records the first failed face:
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    That first face failure supports
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]

    The annular endpoint is the example that keeps the distinction honest.  A radius-zero point may fail to carry a positive packet, but the singularity claim is really carried by positive-radius annular fields shrinking toward the point.  The proof follows those fields.  Gold tries to control the residual annular refill directly.  Silver receives a surviving annular residue only after it has been selected as the same-solution terminal record.  At that moment carrier is not the remaining issue.  The admitted nonsmooth annular branch must fail through Part or Field, while a branch retaining Part and Field belongs to the member-continuation side.
