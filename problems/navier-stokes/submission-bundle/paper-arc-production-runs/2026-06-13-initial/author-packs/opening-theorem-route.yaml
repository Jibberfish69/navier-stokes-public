    \section{Current Main Result and Proof Roadmap}

    The result presently written in the manuscript is a same-solution terminal classification theorem.  It does not hide the annular boundary.  The theorem says what happens once a proposed finite Clay terminal claim has selected a terminal record \(Q\) for the original Navier--Stokes branch and once that record has been admitted to the CM terminal test.  At that point there are only two outcomes:
    \[
      \Member(Q;\Owork)
      \qquad\hbox{or}\qquad
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The member outcome is the continuation side.  The exit outcome is witnessed by the first failed face in the Part/Field tree.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch.  If \(Q\) is admitted as a same-solution terminal witness, then the CM terminal test has the following alternatives.  Either \(Q\) retains the class-membership data needed for the continuation side, written
    \[
      \Member(Q;\Owork),
    \]
    or the first failed witness face gives
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the second case \(Q\) supports
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Hence one admitted same-solution terminal record cannot be both the member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The theorem has an admission clause because the CM test is not allowed to classify a detached object.  The selected record must still be the object produced by the alleged breakdown of the original solution: same datum, same velocity-pressure branch, same fixed viscosity, same pressure law, same incompressibility constraint, and the same terminal role.  A comparison packet, branch diagram, support estimate, or limiting profile can help only after it is tied back to that same branch.

    The proof route is organized around four questions.  First, what exact Navier--Stokes object is under test?  Second, what does the gold route control, and where does the present forward accounting stop?  Third, when an obstruction survives that accounting, is the survivor still a same-solution terminal record?  Fourth, if the survivor is admitted to the CM test and cannot remain on the continuation side, which witness face fails first?

    The live boundary is the annular endpoint witness.  A radius-zero point by itself is too small to carry the Clay breakdown claim.  The claim is carried by the surrounding positive-radius fields as their radii shrink toward \(0\).  The present manuscript records the gold supplier as open: the proof has not yet established scale-uniform smallness of the residual annular refill on every same-solution terminal schedule.  The silver side is also stated honestly.  Once a surviving residual annular witness is admitted as the same-solution terminal record, Pack is no longer the remaining CM argument for that annular test; selection and carrier have already been paid.  A nonsmooth admitted annular witness must then leave the class through Part or Field.

    The rest of the paper makes this route readable.  The opening sections derive the first forward obstruction from the energy and enstrophy identities.  The CM sections define membership, Part and Field.  The branch sections explain which support objects pay the proof, which are obsolete, and which remain open.  The appendices preserve the source-field material only where it helps the reader see a proof argument, obstruction, support role, or explicit continuation question.
