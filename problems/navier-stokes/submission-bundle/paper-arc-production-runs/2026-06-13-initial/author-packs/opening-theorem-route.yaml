    \section{Scope And Proof Polarity}
    \label{sec:scope-proof-polarity}

    The Navier--Stokes global regularity problem is usually approached in the positive-forward direction.  One proves estimates on the original solution and shows that those estimates prevent finite-time loss of smoothness.  That is the gold route in this paper.  It remains the strongest certification layer because it keeps the solution directly inside the continuation class.

    The present proof also uses a contrapositive layer.  It does not replace the equation with a different problem.  It begins with the same positive-forward attempts because those attempts identify the actual terminal objects that threaten continuation.  When the forward accounting leaves a precise obstruction, the proof asks whether that obstruction is still a same-solution Navier--Stokes terminal record.  If it is admitted to the CM test and cannot remain on the member-continuation side, the first failed Pack, Part, or Field face supports class exit.

    This polarity matters for reading the branch material.  A failed gold estimate is not automatically a proof of exit.  It becomes useful only when it leaves a selected terminal record tied to the original branch.  Conversely, a CM face failure is not a positive regularity estimate.  It is the reason the alleged finite nonsmooth terminal record cannot also be the same in-class Navier--Stokes member record.

    The first concrete domain is the periodic zero-force problem on \(\mathbb T^3\).  Whole-space \(\mathbb R^3\) material is tracked as its own export and exterior-source boundary.  Comparison material and Euler boundary material are included only where they pay a same-solution proof role or a smoothness-boundary role.  No branch-local result is promoted to the full Clay conclusion without the export argument that carries it there.
