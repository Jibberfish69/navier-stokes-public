    \section{Original Problem Statement}

    The Clay Navier--Stokes problem asks whether a smooth divergence-free velocity field can lose smoothness in finite time under the three-dimensional incompressible Navier--Stokes evolution.  The unknowns are the velocity \(u(x,t)\) and pressure \(p(x,t)\).  In the periodic case, and in the whole-space case with smooth rapidly decaying data, they satisfy
    \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(\cdot,0)=u_0,
    \]
    with fixed viscosity \(\nu>0\) and no forcing.  The datum \(u_0\) is smooth and divergence-free.  The pressure is not an extra unknown chosen independently; it is tied to \(u\) by incompressibility and by the elliptic pressure law that recovers the gradient part of the nonlinear term.

    A proposed finite-time counterexample is a claim about one branch of this equation.  It begins with \(u_0\), follows the classical Navier--Stokes solution on a maximal interval \([0,T_*)\), and asserts that the usual continuation readout fails at \(T_*<\infty\).  The proof in this manuscript keeps that same-branch requirement explicit.  The velocity, pressure, viscosity, pressure law, incompressibility constraint, and preterminal smooth solution all stay attached to the object under discussion.

    Two proof layers are kept visible.  The gold layer is the direct forward-positive route.  It tries to control the estimates that would continue the solution.  When that route succeeds, it proves regularity in the strongest possible way: the original solution stays in the continuation class.  The silver layer is the CM contrapositive route.  It begins only after the forward accounting has left a precise terminal obstruction.  It asks whether the selected terminal record is still a same-solution Navier--Stokes object.  That test is made through three witness faces: Pack for a positive same-fluid carrier or packet, Part for same-equation pressure-viscosity-incompressibility participation, and Field for a coherent positive-scale velocity-field readout.

    The opening point of the proof is simple.  A terminal singularity is not just the point \((x_*,T_*)\).  The singularity claim is carried by positive-radius fields that shrink toward that point.  The live unpaid boundary is the annular witness formed by those shrinking fields.  Gold would close the boundary by proving scale-uniform annular control.  Silver may close it only after a surviving annular residue has been selected as the same-solution terminal record; after that admission, carrier has already been supplied for that annular test, and the remaining CM landing is Part or Field.
