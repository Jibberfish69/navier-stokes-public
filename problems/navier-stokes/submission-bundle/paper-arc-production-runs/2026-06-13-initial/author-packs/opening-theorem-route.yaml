    \section{Reaching Obstruction}

    The first obstruction can be seen without any special terminology.  Write
    \[
      I(t)=\int (u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    By Holder's inequality,
    \[
      |I(t)|
      \le
      \|u\|_{L^6}\|\nabla u\|_{L^3}\|\Delta u\|_{L^2}.
    \]
    Sobolev gives \(\|u\|_{L^6}\lesssim \|\nabla u\|_{L^2}\), and interpolation gives
    \[
      \|\nabla u\|_{L^3}
      \lesssim
      \|\nabla u\|_{L^2}^{1/2}\|\Delta u\|_{L^2}^{1/2}.
    \]
    Therefore
    \[
      |I(t)|
      \lesssim
      \|\nabla u\|_{L^2}^{3/2}\|\Delta u\|_{L^2}^{3/2}.
    \]
    Young's inequality gives
    \[
      |I(t)|
      \le
      \frac{\nu}{2}\|\Delta u\|_{L^2}^2
      +
      C_\nu\|\nabla u\|_{L^2}^6.
    \]
    Substituting into the enstrophy identity yields
    \[
      Y'(t)\le C_\nu Y(t)^3.
    \]
    This inequality gives local control.  It does not give global control.  The comparison equation \(Z'=C_\nu Z^3\) has
    \[
      Z(t)=\frac{Z(0)}{\sqrt{1-2C_\nu Z(0)^2t}},
    \]
    so the comparison ceiling can become infinite in finite time.  Restarting the estimate at a later time \(t_0<T_*\) only gives a new interval whose length depends on \(Y(t_0)^{-2}\).  To cross \(T_*\), the proof needs pointwise control of \(Y(t_0)\) as \(t_0\uparrow T_*\).

    The energy identity gives a different kind of information:
    \[
      \sup_{0\le t<T_*}\|u(t)\|_{L^2}^2
      +
      2\nu\int_0^{T_*}\|\nabla u(t)\|_{L^2}^2\,dt
      \le
      \|u_0\|_{L^2}^2.
    \]
    This controls the total kinetic energy and the time integral of enstrophy.  It does not rule out concentration of higher derivatives near \(T_*\).  On higher rungs one obtains inequalities such as
    \[
      \frac12\frac{d}{dt}\|\nabla^m u\|_{L^2}^2
      +\nu\|\nabla^{m+1}u\|_{L^2}^2
      \le
      C_m\|\nabla u\|_{L^\infty}\|\nabla^m u\|_{L^2}^2.
    \]
    A continuation proof needs an integrable bound on \(\|\nabla u\|_{L^\infty}\), or a stronger Sobolev bound that implies it.

    The annular and funnel analysis refines this missing item.  Near a proposed terminal point \((x_*,T_*)\), the singularity claim is carried by fields on shrinking positive-radius neighborhoods, not by the endpoint alone.  Set
    \[
      \tau=T_*-t,\qquad
      y=\frac{x-x_*}{\sqrt{\tau}},
      \qquad
      s=-\log\tau,
    \]
    and
    \[
      v(y,s)=\sqrt{\tau}\,u(x,t),
      \qquad
      q(y,s)=\tau p(x,t).
    \]
    The parabolic funnel
    \[
      \mathcal F_\lambda
      =
      \{(x,t):0<T_*-t<\tau_0,\ |x-x_*|<\lambda\sqrt{T_*-t}\}
    \]
    becomes the fixed cylinder \(B_\lambda\times(s_0,\infty)\).  The scale-critical quantities in this cylinder are
    \[
      A_\lambda(s)=\int_{B_\lambda}|v(y,s)|^2\,dy,
    \]
    \[
      D_\lambda(s)=\int_s^{s+1}\int_{B_\lambda}|\nabla_y v|^2\,dy\,d\sigma,
    \]
    and
    \[
      C_\lambda(s)=\int_s^{s+1}\int_{B_\lambda}\bigl(|v|^3+|q|^{3/2}\bigr)\,dy\,d\sigma.
    \]
    Physical energy in the shrinking original ball sees a discounted version:
    \[
      \int_{B_{\lambda\sqrt{\tau}}(x_*)}|u(x,t)|^2\,dx
      =
      e^{-s/2}A_\lambda(s).
    \]
    Thus finite physical energy does not by itself force the unweighted profile \(A_\lambda(s)\) or \(C_\lambda(s)\) to decay.

    The gold annular supplier would remove this discount.  One possible form would prove
    \[
      \sup_{s\ge s_0}A_\lambda(s)
      +
      \int_{s_0}^{\infty}D_\lambda(s)\,ds
      +
      \int_{s_0}^{\infty}C_\lambda(s)\,ds
      <\infty
    \]
    with enough decay on late slabs to feed the usual local regularity readout.  In shell language, the same question appears as control of the residual refill
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds,
    \]
    read on the dyadic shells and time windows meeting a shrinking annulus.  The desired statement is scale-uniform smallness of this residual bill on every same-solution terminal annular schedule.

    The present proof does not claim that gold supplier as finished.  The hard obstruction is terminal Zeno source-refill: positive same-solution source mass can concentrate along shrinking heat-time windows with \(r_m\downarrow0\) and \(\sum_m r_m^2<\infty\).  The model \(g_m(s)=m\,1_{(-1/m,0]}(s)\) shows why bounded time-integrated source mass can still concentrate on the terminal time face.  This is the point where the opening route turns to CM.  If a residual annular witness survives and is admitted as the same-solution terminal object, Pack has been paid by the admission.  The nonsmooth admitted witness must then fail through Part or Field.
