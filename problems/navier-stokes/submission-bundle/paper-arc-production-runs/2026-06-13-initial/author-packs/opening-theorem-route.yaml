    \section{Main Result}

    The theorem presently written in the paper is a same-solution terminal classification theorem.  It is stated with the annular boundary visible because the manuscript has not yet paid that boundary by a completed gold annular supplier or by a completed silver Part/Field landing for the admitted annular residue.  This is the honest theorem-level state of the proof.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch.  If \(Q\) is admitted as a same-solution terminal witness, then either
    \[
      \Member(Q;\Owork)
    \]
    or the first failed CM witness face gives
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the failed-face cases,
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Thus one admitted terminal record cannot be both a member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The theorem is a classification theorem after admission.  Admission is the step that ties the object to the original Navier--Stokes branch.  It requires the same datum, same velocity-pressure solution, same fixed viscosity, same pressure law, same incompressibility constraint, and same terminal role.  Without that tie, the paper has only a comparison object or a diagnostic pattern, not the terminal record being classified.

    The annular boundary explains why the theorem is not yet a final Clay closure.  A proposed terminal point \((x_*,T_*)\) is only the tip.  The singularity claim is carried by positive-radius fields shrinking toward that tip.  Gold would close this boundary by proving scale-uniform control of the residual annular refill.  The manuscript records the narrowed obstruction as terminal Zeno source-refill: same-solution source mass may concentrate along shrinking heat-time windows even when the physical energy ledger is finite.

    Silver can pay the same boundary only after the surviving annular residue has been selected as the same-solution terminal record.  Once it is admitted in that way, Pack is not the remaining landing for the annular test; carrier and selection have already been paid.  A nonsmooth admitted annular witness must then fail by Part or by Field.  If Part and Field survive with the continuation readout, the record is on the member side.

    The proof skeleton is short.  First, a finite terminal claim supplies either the usual \(H^s\), \(s>5/2\), restart readout or a selected terminal record \(Q\) for the same branch.  Second, the selected record enters the CM participation-field tree only when the same-solution admission data are present.  Third, retained Part and Field feed the member-continuation side.  Fourth, a finite nonsmooth terminal branch loses its first required face and supports \(\Exit(Q;\Owork)\).  The later sections pay these steps branch by branch and mark the annular boundary until one certification layer closes it.
