    \section{The Clay-Facing CM Completion}

    A finite Clay breakdown claim is a claim about one original Navier--Stokes solution.
    It starts with smooth data, follows the maximal classical branch up to a finite time \(T_*\), and then claims that the branch has no lawful continuation past \(T_*\).
    The CM proof handles such a claim by forcing the terminal alternative to name the same-solution object it is using.
    Once that object is named, the proof asks three questions in order: is there a same-fluid packet, does the same Navier--Stokes law still participate in that packet, and is there a positive-scale field readout strong enough for the selected continuation consumer?

    \begin{definition}[CM-test-admissible Clay terminal record]
    A Clay terminal record is CM-test-admissible when it is extracted from the same original Navier--Stokes branch and carries the same datum, equation, pressure law, viscosity, preterminal fluid ancestry, terminal time, and terminal role.
    This admissibility condition puts the alleged terminal object into the CM test.
    It is a grammar and custody condition for the witness; membership in \(\Owork\) is decided only after the Part and Field requirements are read.
    \end{definition}

    For such a record the proof has the following chain:
    \[
    \begin{aligned}
    &\text{finite same-surface Clay terminal record}\\
    &\Longrightarrow \text{CM-test-admissible same-solution terminal object}\\
    &\Longrightarrow
      \text{member-side readout or first Part/Field face failure}\\
    &\Longrightarrow
      \Member(Q;\Owork)\ \text{or}\ \Exit(Q;\Owork).
    \end{aligned}
    \]
    The pass side is the ordinary smooth side of the argument.
    When the same record keeps Part and Field, it remains readable by the continuation consumer selected for that branch.
    For the Sobolev consumer used here, that readout is the \(H^s\), \(s>5/2\), endpoint control that restarts the same classical solution.
    The fail side is the class-exit side of the argument.
    The record has entered the CM test, and the first lost requirement is read as a concrete witness face.

    \begin{definition}[Terminal witness consumption]
    A finite Clay terminal witness is consumed by the CM proof when the witness has entered the same-fluid terminal packet tree and the ordered test produces one of the following outcomes:
    \begin{enumerate}[leftmargin=*]
    \item \(\Member(Q;\Owork)\): all three faces survive and the member-side readout continues the same branch.
    \item \(Field-window evidence outside CM\): the selected object has no same-fluid packet carrier.
    \item \(\neg\Part_{N,Q}\): a carrier survives without the same pressure-viscosity participation.
    \item \(\Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}\): carrier and participation survive without positive-scale coherent field readout.
    \end{enumerate}
    In the three failed cases the derived face failure is embedded as
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    \end{definition}

    \begin{theorem}[Clay-facing CM classification theorem]
    Let \(u\) be the maximal classical Navier--Stokes solution from smooth divergence-free data on the surface under discussion, and let \(Q\) be a CM-test-admissible finite terminal record extracted from that same solution.
    Then the CM test has exactly two proof outcomes for \(Q\):
    \[
      \Member(Q;\Owork)
      \quad\hbox{or}\quad
      \Exit(Q;\Owork).
    \]
    The member outcome is the same-solution continuation branch.
    The exit outcome is supported by a first failed witness face:
    \[
      Field-window evidence outside CM,\qquad
      \neg\Part_{N,Q},\qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    \end{theorem}

    \begin{proof}
    CM-test admissibility gives a terminal record from the original solution.
    A detached profile or a diagnostic object with the wrong ancestry fails this entry requirement.
    The class definition reads that record by Pack, then Part, then Field.
    If the record keeps all three requirements and reaches the continuation consumer, the selected readout is the member-side readout for the same solution, so \(Q\) is read as \(\Member(Q;\Owork)\).
    If one requirement fails first, the ordered witness test records the first failed face.
    The CM embedding reads that face failure as \(\Exit(Q;\Owork):=\neg\Member(Q;\Owork)\).
    The ordered test leaves no third in-class terminal branch: a branch that remains in \(\Member(Q;\Owork)\) has retained the witness requirements and supplied readout, while a branch carrying a first failed face has already exited the class.
    \end{proof}

    This is the silver CM completion for admitted same-solution terminal records.
    It proves that an admitted finite terminal alternative is consumed as member-side continuation or class exit.
    The public Clay conclusion still needs the original smooth-data branch to enter the same pass-or-exit CM reading: the manuscript must prove that every smooth-data finite terminal record is either read on the member side or lands at a concrete first Pack, Part, or Field face failure, equivalently installing \( \mathrm{NoGenuineExitFromSmoothData.A}\), \( \mathrm{OriginalSmoothDataPackSurvival.A}\), or an equivalent first-exit Pack-survival mechanism inside that CM engine.
    The theorem written above is the proved classification statement in this manuscript; the global Clay counterexample-exclusion theorem remains tied to that named CM branch law.

    \begin{proposition}[Torus-atlas terminal face exhaustion]
    On the periodic surface, the whole transported terminal atlas \(Q_{\mathrm{atlas}}\) gives the terminal CM test object.
    Every admitted finite terminal non-continuation on that atlas has one of the following readings:
    \[
    \begin{aligned}
    &\text{scope rejection of the proposed obstruction for the CM test,}\\
    &\text{whole-atlas admission failure: }\neg\Pack_{Q_{\mathrm{atlas}}},\\
    &\text{admitted annular or same-atlas Part failure: }
      \Pack_{Q_{\mathrm{atlas}}}\wedge\neg\Part_{N_s,Q_{\mathrm{atlas}}},\\
    &\text{admitted annular or same-atlas Field failure: }
      \Pack_{Q_{\mathrm{atlas}}}\wedge\Part_{N_s,Q_{\mathrm{atlas}}}
      \wedge\forall r>0\,\neg\Field_{N_s,r,Q_{\mathrm{atlas}}}.
    \end{aligned}
    \]
    \end{proposition}

    \begin{proof}
    The torus material-atlas theorem supplies the terminal object.
    \(Q_{\mathrm{atlas}}\) is the whole transported finite atlas.
    A selected diagnostic packet without the atlas ancestry fails the periodic entry requirement.
    The atlas fixes the readout-compatible Pack predicate.
    Loss of atlas selection is the Pack failure \(\neg\Pack_{Q_{\mathrm{atlas}}}\).
    After an annular residual has been admitted through the atlas, carrier and selection have already been paid for that residual.
    The remaining nonsmooth residual branch is then decided by same-equation participation or field readout, hence by Part or Field.
    \end{proof}

    \begin{theorem}[Periodic CM classification state]
    For smooth divergence-free zero-mean data on \(\mathbb T^3\), the same-solution CM proof classifies any admitted finite terminal witness.
    Every legitimate finite terminal witness is read through the transported atlas \(Q_{\mathrm{atlas}}\): whole-atlas admission can fail at Pack, while an annular residual already admitted through that atlas is exhausted by Part or Field.
    The failed branch is embedded as
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The retained branch gives the usual continuation readout, and the failed branch is consumed as class exit for the same working object.
    \end{theorem}

    \begin{proof}
    Assume \(T_*<\infty\).
    The whole-torus terminal atlas is readout-complete.
    The finite endpoint either retains Part and Field on the same transported atlas, or it has a first face failure.
    An annular residue surrounding the endpoint is tested through the same atlas.
    When that residue has already been admitted through the atlas, the annular test has retained carrier and selection, so the nonsmooth branch must fail Part or Field.
    The face-failure branch is consumed by the terminal witness theorem and embedded as class exit for the same working Navier--Stokes object.
    The retained branch gives the \(H^s\), \(s>5/2\), continuation norm for the same original solution.
    The failed branch is outside \(\Member(Q;\Owork)\), so it cannot serve as an in-class finite Clay continuation branch.
    \end{proof}
