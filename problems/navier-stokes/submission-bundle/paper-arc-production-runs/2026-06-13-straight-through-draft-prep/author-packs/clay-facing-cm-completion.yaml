    \section{The Closing Hinges}

    The close of the CM argument has four hinges.

    The first hinge is terminal record entry.
    A finite Clay negation concerns one maximal classical branch from one datum.
    At the alleged terminal time, the branch either has the \(H^s\), \(s>5/2\), endpoint readout that restarts it, or it must name same-branch terminal data that prevents the restart.
    That named data is the terminal record \(Q\).

    The second hinge is same-object admission.
    The record \(Q\) must carry the same datum, same equation, same pressure law, same viscosity, same preterminal ancestry, and same terminal role.
    This is the point where compactness profiles, annular residues, exterior survivors, and atlas objects are forced to remain objects from the original Navier--Stokes solution.

    The third hinge is member-side readout.
    When Part and Field survive on the same record, the record stays readable through the continuation consumer selected by the proof.
    For the classical Sobolev consumer, this produces the \(H^s\), \(s>5/2\), restart branch for the original solution.

    The fourth hinge is class exit.
    The first failed Pack, Part, or Field face gives
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    A support estimate matters only by strengthening one of these hinges while preserving the same terminal record.
    The remaining public Clay bridge is the no-genuine-exit bridge from original smooth data to the absence of a genuine first failed face.
