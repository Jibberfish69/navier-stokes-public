    \section{Participation and One-Field Coherence Witness Laws}

    The CM test is read on one witness record:
    \[
      \WitnessRecord=(u_0,\nu,u,p,Q,N,r,\Phi,T_*).
    \]
    The entries say what the proof is allowed to hold fixed.  The datum \(u_0\), viscosity \(\nu\), and velocity-pressure pair \((u,p)\) identify the original branch.  The object \(Q\) is the selected terminal record.  The integer \(N\) is the derivative depth used by the test.  The scale \(r>0\) is the positive field scale.  The carrier \(\Phi\) is transported by the same velocity field, and \(T_*\) is the alleged finite terminal time.  Pack, Part, and Field are all read on this record.

    \begin{definition}[Witness record]
    A witness record is one terminal data record
    \[
      \WitnessRecord=(u_0,\nu,u,p,Q,N,r,\Phi,T_*),
    \]
    where \((u,p)\) is the preterminal solution generated by \(u_0\), \(\nu\) is the fixed viscosity, \(Q\) is the selected terminal object, and \(\Phi\) is the transported carrier attached to the same branch.
    \end{definition}

    \begin{definition}[Participation witness law]
    The statement \(\Part_{N,Q}\) means that \(Q\) carries the same pressure-viscosity-incompressibility participation law through tower depth \(N\).  On the packet and time window under test,
    \[
      D_tU_k=K_k+B_k,
      \qquad
      K_k=-\nabla^{k+1}p+\nu\Delta U_k,
      \qquad
      0\le k\le N,
    \]
    and every term is read from the same branch \((u,p)\) and the same transported carrier \(\Phi\).
    \end{definition}

    \begin{definition}[One-field witness law]
    The statement \(\Field_{N,r,Q}\) means that, after the carrier and participation law have been fixed, one positive scale \(r>0\) carries coherent field data through depth \(N\).  One concrete model is the finite-difference bound
    \[
      \sup_{\substack{x,x+h\in Q_t\\0<|h|\le r}}
      \sum_{k=0}^{N}
      \frac{
        |U_k(x+h,t)-U_k(x,t)|
        +
        |K_k(x+h,t)-K_k(x,t)|
      }{|h|}
      <\infty
    \]
    on the time slices being tested.
    \end{definition}

    The order of the three faces is part of the proof.  Pack asks whether the same-fluid body is present.  Part asks whether the same Navier--Stokes law acts on that body.  Field asks whether the readings produced by that law fit into one positive-scale field.  A terminal branch is charged to the first face it loses.  This keeps the paper from calling a raw endpoint, a diagnostic trace, or a singular-looking quantity an exit before it has been tested as a same-solution record.
