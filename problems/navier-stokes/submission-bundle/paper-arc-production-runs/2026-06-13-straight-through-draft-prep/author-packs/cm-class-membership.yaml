    \section{Silver Standard Approach}

    The silver route is the class-membership route.  It starts with a terminal record \(Q\) selected from the original Navier--Stokes solution and asks whether that record still belongs to the same solution branch.  The route is contrapositive: the record that keeps the required class data is read on the continuation side, and the record that loses a required class datum supplies the exit witness.

    The split is
    \[
      \begin{array}{rcl}
      \text{pass} &:& \Member(Q;\Owork),\\[2mm]
      \text{fail} &:& \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
      \end{array}
    \]
    The pass line means that the selected record keeps the original datum, the fixed viscosity, the Navier--Stokes pressure law, incompressibility, the transported carrier, the participation tower, and a positive-scale field readout strong enough for the continuation criterion in force.  The fail line means that the same selected record loses one of those requirements.  The proof names the first lost requirement.

    The first lost requirement is read in Pack-before-Part audited order:
    \[
      \begin{aligned}
      \text{lost same-fluid carrier} &\longmapsto \neg\Pack_Q,\\
      \text{lost pressure-viscosity-incompressibility participation} &\longmapsto \Pack_Q\wedge\neg\Part_{N,Q},\\
      \text{lost positive-scale coherent field readout} &\longmapsto
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
      \end{aligned}
    \]
    The three lines are witness-face readings of one membership question.  Pack asks whether the selected record is carried by the same fluid body.  Part asks whether the same Navier--Stokes law acts on that body through the finite derivative tower being tested.  Field asks whether the resulting readings still live on one positive scale.

    The forward-positive work determines what \(Q\) is.  It may select the transported torus atlas, an exterior-source survivor in \(\mathbb R^3\), a high-frequency tail, a source reserve, or an annular residual branch.  After selection, the silver route holds to that exact record.  The page has to show the record, name the class data it carries, and derive the first Pack, Part, or Field loss on that record.

    This gives the closure test used below.  A branch closes on the silver side after the page makes the same-solution record readable and then shows the face failure.  A branch closes on the gold side when the direct forward estimate supplies the continuation readout.  Material that has only explained, motivated, or diagnosed a candidate obstruction remains support until it selects a same-solution terminal record.
