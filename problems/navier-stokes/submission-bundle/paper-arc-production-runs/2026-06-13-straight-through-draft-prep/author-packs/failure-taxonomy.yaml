    \section{Packet Witness Law}

    Pack is the entry face of the terminal test.  A finite-time breakdown claim cannot be tested from a bare point, a number, or a diagnostic trace.  It has to supply a same-solution carrier on which the law and the field can be read.  The carrier is the object that lets the proof ask whether the alleged terminal behavior still belongs to the original fluid.

    \begin{definition}[Packet witness law]
    \(\Pack_Q\) means that the selected terminal record has a positive same-fluid carrier.  There is a transported carrier family \(\Phi_t\) moved by the same velocity field \(u\), a finite cover with finite overlap on the terminal region under test, and a positive carrier scale for the selected record.  A terminal trace with no positive carrier, a source atom with no transported body, or a donor history outside the same flow fails Pack.
    \end{definition}

    The periodic branch uses the whole transported material atlas \(Q_{\mathrm{atlas}}\).  That atlas fixes the packet before branch examples are read, and the proof uses that fixed atlas rather than a private diagnostic packet chosen after the obstruction is known.  The whole-space branch uses the corresponding exterior-source selection.  Once the initial heat tail and the fixed compact-core far-field contribution have been removed, any surviving exterior source must still receive a same-solution material address before it can enter Part or Field.

    The law also prevents a common endpoint mistake.  A terminal source, pressure pulse, or zero-radius residue may point to the location of a problem.  Pack asks for a positive same-fluid body carrying the selected record.  A record that supplies that body moves forward to Part.  A record with no such body has first failure \(\neg\Pack_Q\).
