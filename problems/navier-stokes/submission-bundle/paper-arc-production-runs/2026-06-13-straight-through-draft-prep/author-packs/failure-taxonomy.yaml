    \section{Exhaustive Failure List}

    The forward work produces many named surfaces.  The terminal proof uses them only after they have been reduced to one object: a same-solution record offered as the terminal record of the original Navier--Stokes branch.  That record is the object under examination.  It carries the initial datum, viscosity, velocity-pressure law, pressure response, incompressibility condition, material carrier, and terminal role inherited from the branch whose breakdown is being alleged.

    The reduction has a fixed order.  A forward branch either pays a continuation readout, leaves a selected terminal record for the CM test, or remains support.  Once a record \(Q\) has been selected, the proof asks three questions in the order in which a Navier--Stokes record needs them.  Does \(Q\) have a positive same-fluid carrier?  Does the same pressure-viscosity-incompressibility law still participate on that carrier?  Do the retained readings form one positive-scale velocity field?  The answers are read as Part and Field.

    The following map tells the reader what each forward family contributes to that ordered test.  Each entry names the direct estimate, the survivor left when that estimate stops short of a continuation theorem, and the face through which the survivor can become a CM witness.  A branch with no selected same-solution terminal record remains outside the CM proof.

    \begin{enumerate}[leftmargin=2em]
    \item \textbf{Energy and enstrophy.}
    The energy identity controls \(\|u(t)\|_{L^2}\) and the time integral of \(\|\nabla u(t)\|_{L^2}^2\).  The enstrophy identity exposes the source
    \[
      \int (u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    The survivor is derivative growth left open by the energy identity.  If that derivative tower is still carried by the same positive terminal body, the carrier face has survived and the pressure moves to Part or Field.  If the tower is only a number, trace, or readout with no same-fluid body under it, the first lost face is Pack.

    \item \textbf{Global energy--enstrophy budget.}
    The quantity
    \[
      Q(t)=\|u(t)\|_{L^2}^2+\|\nabla u(t)\|_{L^2}^2
    \]
    is a visible global budget.  It can miss a concentration, source reserve, or small-scale transfer that remains below the scale read by the global quantity.  That survivor becomes CM material only after the manuscript names the same-solution terminal record carrying it and says which class datum that record loses.

    \item \textbf{Scale barrier and dyadic tail.}
    The direct route tries to make high-frequency transfer summable.  The survivor is a lower-prefix memory, high-high packet, or upper-tail leakage that keeps moving activity into dangerous shells.  A selected tail with a carrier and same-law participation reaches the Field test.  It fails there when every positive scale loses one coherent velocity field carrying the neighboring readings.

    \item \textbf{Cascade ancestry.}
    Some branches identify the parent of a dangerous packet: donor window, previous shell, pressure channel, or source history.  The survivor is an ancestry claim.  Missing donor body is Pack pressure.  A retained donor whose ancestry is no longer governed by the same pressure-viscosity-incompressibility law is Part pressure.

    \item \textbf{Pressure-source and Zeno residue.}
    The longest positive branch follows pressure sustain, source residue, no-incoming-source drain, time-face anti-atom, angular saturation, and Zeno ancestry.  The survivor is a terminal reserve whose payment is pushed to a smaller time face or a previous source parent.  Before the annular witness is admitted, the proof is still selecting the record.  After admission, the surrounding positive-radius fields pay the carrier requirement for that annular test.  The remaining nonsmooth pressure is then Part or Field.

    \item \textbf{Compactness and tensor closure.}
    The direct route needs a classical approximation family whose nonlinear tensors converge strongly enough that \(u^{(n)}\otimes u^{(n)}\) becomes \(u\otimes u\).  The survivor is a weak limit or terminal trace that keeps information without giving one classical field.  If the carrier and participation law have survived, this is Field pressure: the pieces cannot assemble into one positive-scale velocity field.

    \item \textbf{Gradient transfer and coercivity.}
    The route tries to absorb high-frequency production into viscosity plus a summable tail.  The survivor is a spill collar, lifted high-side remainder, or high-high gradient packet.  The first face is determined by the surviving object: no carrier gives Pack, broken pressure-viscosity action gives Part, and retained non-coherent readings give Field.

    \item \textbf{Comparison, export, and wrong-object support.}
    A nearby equation, filtered model, geometric estimate, or comparison branch can explain a mechanism without proving the Clay claim.  The survivor is a useful object that may have moved away from the fixed-viscosity Navier--Stokes branch.  It supports the paper after it is reattached to the original solution.  Until that reattachment is written, it is a scope boundary.
    \end{enumerate}

    \begin{lemma}[Endpoint role map]
    Every forward branch used later in the manuscript must enter the proof through one of the following roles: it supplies a continuation readout, selects a same-solution terminal record, proves a Pack failure, proves a Part failure, proves a Field failure, or remains support.
    \end{lemma}

    \begin{proof}
    A branch that supplies the continuation readout closes on the direct side.  A branch that stops short leaves only the material it has actually produced: a carrier, tower, trace, source reserve, weak limit, comparison object, or terminal readout.  Such material can affect the CM argument only after it is attached to the original branch as the selected record \(Q\).  Once \(Q\) is fixed, the class test has exactly three data it must inspect: same-fluid carrier, same-law participation, and one-field coherence.  Loss of the first data is Pack failure.  Loss of the second data after carrier survives is Part failure.  Loss of every positive coherence scale after carrier and participation survive is Field failure.  A branch with none of these payments remains support for a later branch.
    \end{proof}
