    \section{Lower-Prefix And Upper-Tail Survivor Families}
    \label{sec:lower-prefix-upper-tail-branch}

    The scale-barrier branch leaves one specific lower-side bill.  The lifted
    high-side remainder contains an active shell \(j\), the shells below it, and
    the tail above it.  The lower shells are not harmless merely because their
    frequencies are smaller.  They can carry accumulated strain into the active
    shell.  The upper shells are not harmless merely because viscosity is
    stronger there.  They can be refilled at the same heat scale.  The branch
    below is the exact lower-prefix/upper-tail branch created by those two facts.

    Let \(u_j=\Delta_j u\).  The scale variables used here are
    \[
      E_j(t)=2^{2j}\|u_j(t)\|_{L^2_x}^2,
      \qquad
      D_j(t)=2^{4j}\|u_j(t)\|_{L^2_x}^2.
    \]
    Thus \(E_j\) is the \(H^1\)-size of the \(j\)-th shell, and \(D_j\) is the
    same shell measured at one more derivative.  If \(C_1\) is the fixed
    separation in the far-corona region, define the lower-prefix energy seen by
    shell \(j\) by
    \[
      \mathcal P_j^\downarrow(t)
      =
      \sum_{k\le j-C_1}E_k(t).
    \]
    This is the amount of lower-scale \(H^1\) content that can act on shell
    \(j\) after the far-corona ordering has been imposed.

    The reason this quantity enters is the cumulative-tail stress theorem.  In
    the continuum notation, the far-corona stress object is
    \[
      T_r(t)
      =
      \int_0^{r/c_1}
      \chi_{mid}(\log\ell)\,
      \tau_\ell^{H^1}[u](t)\,\frac{d\ell}{\ell},
    \]
    and the direct far-corona square is
    \[
      \mathrm{FCTS}
      =
      \int_0^T\int
      r^{-2}\|Q_r u(t)\|_{L^2_x}^2
      \|T_r(t)\|_{L^2_x}^2\,\frac{dr}{r}\,dt .
    \]
    Cauchy--Schwarz in the \(\ell\)-integral reduces this to the cumulative-tail
    theorem
    \[
      \int_0^T\int_{\ell_{top}}^{\ell_{bot}}
      \left(
      \int_{c_1\ell}^{\ell_{hi}}
      r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\frac{dr}{r}
      \right)
      \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2\,\frac{d\ell}{\ell}\,dt
      \le
      C_{CTS}\nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \tag{CTS}
    \]
    Dyadicizing \(r\ge c_1\ell\) turns the inner \(r\)-tail into the lower
    prefix \(\sum_{k\le j-C_1}E_k\).  The inherited Euclidean estimate for the
    stress square is
    \[
      \|\tau_j^{H^1}[u](t)\|_{L^2_x}^2
      \le
      C\,2^{-j}D_j(t)^2.
    \]
    Hence the direct route from \((\mathrm{CTS})\) asks for the dyadic estimate
    \[
      \int_0^T
      \sum_{j\ge N}
      \mathcal P_j^\downarrow(t)\,
      2^{-j}D_j(t)^2\,dt
      \le
      \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \tag{LPAS}
    \]
    This is the raw lower-prefix active-square theorem.  Its left side says that
    lower-scale \(H^1\) memory is being multiplied by the square of the active
    shell's derivative drain.

    The raw theorem is too strong.  The failure is visible on an exact smooth
    Navier--Stokes solution.  On the torus, take
    \[
      u(x,t)
      =
      \left[
        a e^{-\nu2^{2k}t}\sin(2^kx_2)
        +
        b e^{-\nu2^{2j}t}\sin(2^jx_2)
      \right]e_1,
      \qquad j\gg k .
    \]
    This field is divergence-free, depends only on \(x_2\), and points in the
    \(e_1\)-direction.  Thus
    \[
      (u\cdot\nabla)u=u_1\partial_{x_1}u=0,
    \]
    so the solution is pure heat flow with constant pressure.  The high shell
    has no nonlinear source.  Yet the lower shell \(k\) contributes a fixed
    positive lower-prefix amount
    \[
      \mathcal P_j^\downarrow(t)\ge c_P2^{2k}a^2=:P_0
    \]
    on the high-shell heat window, and
    \[
      D_j(t)\simeq 2^{4j}b^2e^{-2\nu2^{2j}t}.
    \]
    The raw active-square cost has the lower bound
    \[
      \int_0^\infty
      P_0\,2^{-j}D_j(t)^2\,dt
      \gtrsim
      \frac{P_0}{\nu}2^{5j}b^4,
    \]
    while the drain available on the right is only
    \[
      \nu\int_0^\infty D_j(t)\,dt
      \lesssim
      2^{2j}b^2.
    \]
    Their ratio grows like \(2^{3j}b^2\).  The heat-decaying shear violates the
    raw active-square bound while carrying no positive nonlinear refill.  Thus
    raw active-square size is not the dangerous object.

    The corrected object is the residual same-fluid refill.  The shell equation
    gives
    \[
      \partial_t u_j-\nu\Delta u_j
      =
      -\Delta_j\mathbb P\nabla\cdot(u\otimes u).
    \]
    In \(H^1\) shell currency,
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)
      \le
      \Phi_j^+(t),
      \tag{1}
    \]
    where
    \[
      \Phi_j(t)
      =
      -2^{2j}
      \left\langle
      \Delta_j\mathbb P\nabla\cdot(u\otimes u),u_j
      \right\rangle,
      \qquad
      \Phi_j^+(t)=\max\{\Phi_j(t),0\}.
    \]
    Solving \((1)\) from an entrance time \(t_0\) gives
    \[
      E_j(t)
      \le
      e^{-c_0\nu2^{2j}(t-t_0)}E_j(t_0)
      +
      C\int_{t_0}^t
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The first term is heat inheritance.  The second term is nonlinear refill.
    Set
    \[
      R_j^{src,+}(t;t_0)
      =
      \int_{t_0}^t
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds,
      \qquad
      D_j^{res}(t;t_0)=2^{2j}R_j^{src,+}(t;t_0).
    \]
    For the exact shear solution above, \(\Phi_j=0\) and
    \(D_j^{res}=0\).  The residual ledger removes precisely the harmless heat
    mode that defeated the raw theorem.

    The gold-side theorem left by this branch is
    \[
      \int_0^T
      \sum_{j\ge N}
      \mathcal P_j^\downarrow(t)\,
      2^{-j}
      \bigl(D_j^{res}(t;t_0(j,t))\bigr)^2\,dt
      \le
      \varepsilon\nu\int_0^T D_N(t)\,dt
      +C_*2^{-2\delta N}.
      \tag{R-LPAS}
    \]
    Equivalently, one may prove the residual cumulative-tail or residual
    far-corona theorem.  The available source notes do not record this residual
    estimate as proved from the present finite-energy, local-energy, pressure,
    cutoff, transport, and first-moment inputs.  They record it as the honest
    forward support target for this branch.

    The Volterra formulation explains why this target is more than a renamed
    square estimate.  Write \(s=\log r\) and place the middle-band scale interval
    in \(I=[s_0,s_1]\).  With
    \[
      \widetilde Z(\sigma,t)=Z_{e^\sigma}(t)\in L^2_x,
      \qquad
      w(s,t)=a(e^s,t)
      =
      e^{-2s}\|Q_{e^s}u(t)\|_{L^2_x}^2,
    \]
    the one-sided scale primitive is the lower-triangular operator
    \[
      (\mathcal V_\kappa f)(s)
      =
      \int_{s_0}^{s-\kappa}f(\sigma)\,d\sigma .
    \]
    The cumulative stress square is
    \[
      \mathcal Q_w[f]
      =
      \|M_w^{1/2}\mathcal V_\kappa f\|_{L^2_s(I;L^2_x)}^2 .
    \]
    The crude Hardy step estimates the whole primitive
    \(\mathcal V_\kappa f\).  The operator calculation shows that this is too
    coarse.  In the weighted space \(L^2(I,w\,ds;L^2_x)\), the exact-in-scale
    subspace is
    \[
      \mathcal D_0
      =
      \{\partial_s S:\ S(s_0)=S(s_1)=0\}.
    \]
    Its weighted orthogonal complement is the scale-persistent profile
    \[
      m_w(s,t)
      =
      \frac{|I|\,w(s,t)^{-1}}{\int_I w(\sigma,t)^{-1}\,d\sigma},
      \qquad
      \int_I m_w(s,t)\,ds=|I|,
    \]
    whenever \(w>0\) and \(w^{-1}\in L^1(I)\).  The corresponding projector is
    \[
      (P_w f)(s,t)
      =
      m_w(s,t)\frac{1}{|I|}\int_I f(\sigma,t)\,d\sigma .
    \]
    Thus
    \[
      \mathcal V_\kappa
      =
      P_w\mathcal V_\kappa+(I-P_w)\mathcal V_\kappa
    \]
    and
    \[
      \mathcal Q_w[f]
      =
      \|M_w^{1/2}P_w\mathcal V_\kappa f\|^2
      +
      \|M_w^{1/2}(I-P_w)\mathcal V_\kappa f\|^2 .
      \tag{2}
    \]
    The persistent term is the rank-one quotient
    \[
      \|M_w^{1/2}P_w\mathcal V_\kappa f\|^2
      =
      \frac{|I|^2}{\int_I w^{-1}\,ds}
      \left\|
      \frac{1}{|I|}\int_I(\mathcal V_\kappa f)(s)\,ds
      \right\|_{L^2_x}^2 .
      \tag{3}
    \]
    This improves the reader's picture of the branch.  The obstruction is not
    the full lower-triangular mass.  It is the weighted quotient readout selected
    by the active dissipation measure, plus an exact derivative remainder.

    This structural improvement still leaves real theorem debt.  The active
    weight \(w\) may vanish.  The inverse profile \(w^{-1}\) is not controlled by
    the inherited Euclidean surface.  The exact derivative term in \((2)\) has
    been identified, yet no coercive estimate in the current stack absorbs it
    into dissipation on the classical Navier--Stokes solution.  The Volterra
    language sharpens the branch; it does not by itself prove \((\mathrm{CTS})\)
    or \((\mathrm{R\text{-}LPAS})\).

    The upper-tail view gives the same stopping point in another coordinate.
    Reindexing \((\mathrm{LPAS})\) gives
    \[
      \int_0^T
      \sum_k E_k(t)
      \left(
      \sum_{j\ge \max(N,k+C_1)}
      2^{-j}D_j(t)^2
      \right)dt .
    \]
    For a fixed lower shell \(k\), the bracket is an upper-tail active-square
    measure,
    \[
      dM_k(t)
      =
      \left(
      \sum_{j\ge \max(N,k+C_1)}
      2^{-j}D_j(t)^2
      \right)dt .
    \]
    A Carleson estimate of the form
    \[
      \int_I dM_k(t)
      \le
      \varepsilon\nu2^{2k}|I|
      +C2^{-2\delta\max(N,k)}
    \]
    would pay the upper-tail side and then the lower-prefix sum.  The conditional
    proof is simple: since \(2^{-j}D_j^2=2^{3j}E_j^2\), an active-shell amplitude
    gain strong enough to give
    \[
      2^{3j}A_jE_j(t)
      \le
      \varepsilon\nu D_j(t)+r_j(t)
    \]
    with summable reserve \(r_j\) would imply the Carleson bound.  The source
    notes record the missing point: the needed shell-amplitude gain is not
    installed.  Fixed-shell amplitude and balanced source/damping examples return
    the route to active-shell amplitude control, direct active-square Carleson, or
    residual LPAS itself.

    Now the CM use is exact.  Suppose the residual theorem fails after heat
    descendants, through-flow, legal losses, finite reserves, and already-paid
    dissipation have been removed.  Then one can select terminal heat-scale
    windows
    \[
      I_m,
      \qquad
      c_h2^{-2j_m}\le |I_m|\le C_h2^{-2j_m},
      \qquad
      j_m\to\infty,
      \qquad
      t_m\uparrow T_*,
    \]
    such that
    \[
      \int_{I_m}
      \mathcal P_{j_m}^\downarrow(t)\,
      2^{-j_m}
      \bigl(D_{j_m}^{res}(t;t_0)\bigr)^2\,dt
    \]
    carries nonzero selected normalized mass.  This is a terminal
    source-balanced active pulse,
    \[
      P_m=(Q_m^\Phi,j_m,I_m),
    \]
    with positive native nonlinear source mass.

    The forward branch and the CM branch have different jobs at this point.  A
    forward proof tries to prove \((\mathrm{R\text{-}LPAS})\), residual
    CTS/FCTS, source depletion, parent depletion, source-residue rigidity, or an
    equivalent positive supplier theorem.  The CM proof takes the selected
    terminal pulse only after that pulse survives the residual ledger.  It then
    tests the pulse as a same-solution witness.

    A positive-radius retained ancestry cannot remain simultaneously same-fluid,
    unpaid, no-incoming, retained in finite CM, and source-positive at the
    terminal strip.  It must be paid, receive incoming participation, leave
    through a legal/projected/cutoff/boundary channel, or expose a finite
    Pack/Part/Field face failure.  The terminal zero-radius case has the first
    failed face
    \[
      \neg Pack_Q.
    \]
    For an already admitted annular supplier, the carrier has already been
    selected and read out, so the remaining failures are
    \[
      \neg Part_{N,Q_{ann}}
      \quad\hbox{or}\quad
      Part_{N,Q_{ann}}\wedge
      \forall r>0\,\neg Field_{N,r,Q_{ann}}.
    \]

    This resolves the local branch organization.  Raw \((\mathrm{LPAS})\) is
    retired as a universal theorem.  Residual \((\mathrm{R\text{-}LPAS})\) and
    residual CTS/FCTS remain genuine forward support targets.  A surviving
    residual pulse is the selected terminal obstruction for the CM witness tree.
    The section's conclusion is the pass-or-exit statement
    \[
      \boxed{
      \begin{gathered}
      \text{residual lower-prefix/upper-tail theorem}\\
      \vee\\
      \text{Pack/Part/Field face failure}
      \end{gathered}}
    \]
