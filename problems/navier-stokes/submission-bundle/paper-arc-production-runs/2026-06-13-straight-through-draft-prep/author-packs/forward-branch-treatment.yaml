    \section{Forward Families As Support Examples}

    The proof has fixed the class test, so the branch families now have a narrower job.  They do not become new proof spines.  Each family has to tell the reader how it enters the same selected terminal record \(Q\):
    \[
    \begin{array}{l}
    \text{it selects the same-solution terminal record,}\\
    \text{it supplies the member-side continuation readout for that record,}\\
    \text{it proves the first failed Pack, Part, or Field face,}\\
    \text{or it remains support until one of those jobs is paid.}
    \end{array}
    \]
    This rule keeps the forward-positive material useful while preserving CM proof priority.  A branch note may explain a real obstruction, a real estimate, or a real route failure.  The manuscript spends that note only after it identifies the terminal record and the face or readout the note pays.

    The main records are already visible.  On the periodic surface, the selected terminal record is the transported whole-torus atlas \(Q_{\mathrm{atlas}}\).  On the whole-space surface, the selected record comes from the exterior Duhamel split and the dyadic survivor test.  At the annular endpoint, the selected record is the limiting same-solution behavior on shrinking positive-radius annuli.  Those annuli are live terminal witnesses until gold controls the residual load or silver admits the surviving residual obstruction and lands it in Part or Field.

    A forward estimate is proof material when it says something precise about that selected record: which carrier survives, which participation law is retained or lost, which positive-scale field readout is available, or which continuation readout follows.  It is support while that record or face is still unnamed.

    \subsection{Source Reserve And Donor Refill}

    Source reserve is the branch where a terminal packet tries to acquire fresh nonlinear source near \(T_*\).  The gold question is quantitative: can the same solution keep a positive residual refill on shrinking heat-time windows after heat descendants, legal through-flow, finite payments, and paid dissipation have been removed?  The silver question is class-theoretic: when that reserve is selected as the terminal record, which membership face does it keep or lose first?

    \begin{definition}[Source-reserve branch]
    A source-reserve branch is a selected terminal branch for which a positive source quantity \(R_N(W)\) survives on a terminal heat window \(W\) after legal losses and inherited parent mass are separated.  The branch is retained for the CM test only when the reserve is attached to the original solution branch and its terminal carrier has been identified.
    \end{definition}

    \begin{proposition}[Source-reserve routing]
    Every selected source-reserve branch is routed through the first face it can answer:
    \[
    \begin{array}{rcl}
    \neg\Pack_Q &:& \text{no same-fluid carrier},\\
    \Pack_Q\wedge\neg\Part_{N,Q} &:& \text{carrier without same participation},\\
    \Pack_Q\wedge\Part_{N,Q} &:& \text{Field/readout pressure remains.}
    \end{array}
    \]
    \end{proposition}

    \begin{proof}
    A source reserve with no positive same-fluid carrier fails Pack.  A source reserve with a carrier and no same pressure-viscosity-incompressibility tower fails Part.  A source reserve with carrier and participation has reached the retained-packet level; its remaining obstruction is a Field or continuation-readout question.  The proof force comes from the selected witness record and first failed face, not from the source-reserve label.
    \end{proof}

    Reserve creation, terminal reserve first appearance, positive remainder depletion, source-weighted angular depletion, BASAC reverse Holder production, terminal source anti-concentration, and uniform temporal source integrability all ask the same question in different coordinates:
    \[
      \text{can positive terminal source reserve be born for free on the original branch?}
    \]
    For the manuscript, those notes are support until they attach to the selected same-solution record.  Once the reserve is inherited, charged, depleted, or landed in a Pack, Part, or Field face, it becomes proof material for that record.

    \subsection{BASAC, Pressure, And Rigid Residue}

    BASAC and pressure-residue arguments search for a terminal source measure that is too rigid to be paid by the ordinary source balance.  The forward-positive route tries to rule that object out directly.  The class route asks which membership requirement the selected residue can keep.

    \begin{definition}[Rigid pressure-source residue]
    A rigid pressure-source residue is a selected terminal object whose pressure/source contribution remains after transported boundary losses, parent ancestry, and paid finite terms have been removed.  It is terminally relevant only when it is attached to the same solution branch.
    \end{definition}

    \begin{lemma}[Rigid residue requirement test]
    A rigid pressure-source residue has no independent class face.  It is Pack-side when it lacks a positive carrier, Part-side when it loses pressure participation after a carrier survives, and Field-side only after the same carrier and same participation tower both survive.
    \end{lemma}

    \begin{proof}
    Rigidity describes how a residue behaves.  The class object asks a different question: the selected residue must answer Pack, then Part, then Field on the same terminal record.  Those answers determine its proof role.  The residue is spent only after that role is certified.
    \end{proof}

    Pressure-tail Hardy controls, transported boundary tightness, pure-pressure sustain reductions, time-face anti-atom arguments, and production into rigid subclasses all narrow the selected residue.  The narrowed residue becomes proof material when it declares the first same-record requirement it cannot keep.

    \subsection{Zeno And Terminal Atoms}

    Zeno arguments describe terminal objects that appear only through infinite refinement toward \(T_*\).  They are tempting because a zero-radius object can look like the dangerous part of the singularity.  For the point-object alone, zero radius is decisive.  For the singularity claim, the proof still has to test the shrinking positive-radius fields around that point.

    \begin{proposition}[Zeno routing]
    A Zeno terminal branch with no positive terminal carrier is Pack-side as a point-object or pre-admission case.  A retained positive-scale Zeno branch has supplied carrier.  A Zeno or annular-limit branch witnessed by positive-radius fields remains live until those fields are controlled or, after admission, land in Part or Field.
    \end{proposition}

    \begin{proof}
    A zero-radius terminal atom has no positive same-fluid carrier, so it fails Pack as a point-object.  That statement handles the atom itself.  It leaves the surrounding annular witness in play.  When a Zeno branch retains positive scale, the branch has supplied the carrier requirement and must be tested for same-equation participation and coherent field readout.  Zeno names a terminal mode whose admitted positive-scale branch is decided by Part or Field.
    \end{proof}

    The temporal non-atomicity, residence lower-bound, time-face capacity, and terminal atom exclusion arguments live here.  They either prevent the point-object from being a same-solution terminal record, show that the point-object has failed Pack, or return the surrounding positive-radius annuli to the live annular witness payment.

    In the current proof state this is the terminal Zeno source-refill case named in the gold discussion.  The forward side has not proved the theorem that turns positive same-solution source mass on shrinking heat-time windows into time thickness, scale-critical source Carleson charge, diffuse-parent charge, no-incoming-flux control, or a rigid source-residue Liouville class.  The point atom's Pack failure is only the first reading of the endpoint.  The remaining source-balanced pulse is the surrounding annular witness: gold still owes \(\mathrm{TerminalTimeFaceAntiAtom.A}\) or an equivalent production theorem, and silver receives the pulse only with selection and readout-completeness premises visible.

    \subsection{Retained Amplitude, Low Strain, And Height Flux}

    Retained-amplitude and low-strain routes are hard because a branch can keep enough structure to avoid first Pack failure while still accumulating terminal field pressure.  The forward-positive route tries to prove a gain, bounded variation, or height-flux control strong enough to force readout.  The class route preserves the branch split.

    \begin{proposition}[Retained-amplitude routing]
    A retained-amplitude branch either creates Pack gain, loses Part participation or dwell, reaches a licensed Field diagnostic, or falls into a Zeno terminal subcase.
    \end{proposition}

    \begin{proof}
    Retained amplitude must live on a selected terminal record.  If it produces a positive same-fluid carrier, it is Pack support.  If the carrier survives while the same Navier--Stokes law fails to act through the retained branch, it is Part-side.  If Pack and Part both survive, the remaining retained amplitude is read as Field pressure.  If the retained object has no positive terminal scale, it is the Zeno/Pack subcase.
    \end{proof}

    Height-flux and frame-variation arguments keep a retained-amplitude branch from floating between faces.  The branch must create carrier gain, pay its dwell, enter a licensed Field readout, or collapse to a terminal atom before it can affect the terminal proof.

    \subsection{Signed Current And No-Free-Sink}

    Signed-current arguments try to turn source-current motion into a no-free-sink law.  The obstruction is that strain production has variable sign, while terminal source charge can move through scale-critical channels.  The class proof uses signed current as a face-routing tool.

    \begin{lemma}[Signed current has no independent face]
    A signed-current branch returns to Pack, Part, retained Field, Zeno, or support.  It returns to the three witness requirements.
    \end{lemma}

    \begin{proof}
    Signed current measures how the source economy moves.  The class object asks whether the selected terminal packet retains the carrier, the participation tower, and coherent field data.  Current information can prove or support one of those requirement statements.  It supplies information for one of the requirements in \(\CM_{N,r,Q}\).
    \end{proof}

    The terminal signed-saturation reduction is valuable because it makes this routing explicit.  Failed saturation is paid by retained partners, legal exits, pair-weight charge, finite donor balance, or else becomes a terminal zero-radius source residue.  Those alternatives are Pack, Part, Field, or support outcomes inside the same terminal world.

    \subsection{Endpoint, No-Pulse, And Good-Scale Readout}

    Endpoint arguments are closest to classical continuation.  They ask for a good scale, a read cover, pulse exclusion, terminal-tail control, and coherent field output.  They are essential on the pass side.  They become misleading when they are treated as the primitive class test.

    \begin{proposition}[Readout role]
    Endpoint readout proves smooth continuation from a member packet.  It certifies membership only after the Pack, Part, and Field requirements hold on one witness record.
    \end{proposition}

    \begin{proof}
    The smooth continuation readout reads a packet that already has enough coherent field control.  That packet must be carried by the same fluid, governed by the same Navier--Stokes law through the velocity tower, and coherent on a positive scale.  Those are the three requirements.  Readout is the consequence of the requirements, and the requirements remain the class test.
    \end{proof}

    This is where the silver-standard proof separates from a brute-force positive proof.  The pass branch can use any endpoint mechanism strong enough to read a member packet.  The fail branch is handled by class exit.  The selected terminal record supplies the packet, so endpoint estimates become pass-side support while the proof spine remains the Pack/Part/Field test.

