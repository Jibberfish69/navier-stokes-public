    \section{Branch-Family CM Proof Roles}
    \label{sec:branch-proof-roles}

    The forward branches are useful because they tell the paper what the terminal object might be.  They are not independent endings of the proof.  After a branch has located a possible terminal object, the manuscript asks one common question: can that object still be read as the same Navier--Stokes solution record?

    The answer is recorded through the same five outcomes used in the main proof:
    \[
    \begin{array}{ll}
    \text{member readout} &
      \Pack_Q\wedge\Part_{N,Q}\wedge\Field_{N,r,Q}
      \text{ plus the continuation norm,}\\[1mm]
    \text{Pack failure} & \neg\Pack_Q,\\[1mm]
    \text{Part failure} & \Pack_Q\wedge\neg\Part_{N,Q},\\[1mm]
    \text{Field failure} &
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q},\\[1mm]
    \text{support} &
      \text{a real estimate whose selected record or face landing is still unwritten.}
    \end{array}
    \]
    This is the bookkeeping the reader needs.  A forward argument may pay a source term, rule out a donor refill, locate a terminal atom, or sharpen an endpoint readout.  It becomes proof text only at the line where it names \(Q\), names the class data carried by \(Q\), and pays one of the outcomes above.

    \begin{center}
    \small
    \begin{tabular}{L{0.16\textwidth} L{0.23\textwidth} L{0.23\textwidth} L{0.24\textwidth}}
    \hline
    \textbf{Branch} & \textbf{Positive aim} & \textbf{Survivor or residue} & \textbf{Manuscript role}\\
    \hline
    Four-body diagnostic & Close tail, source, exact-object capture, and recovery in one circuit & Circular payment debt among the four bodies & Selects the terminal record and names the unpaid face; proof force begins at that face\\
    Energy/source & Lift energy and enstrophy information into derivative control & Vortex-stretching source reserve & Tests whether retained source reserve has same carrier, same participation, or only Field pressure\\
    Scale barrier/tail & Make high-frequency transfer summable & Lower-prefix memory and upper-tail leakage & Decides whether the selected terminal witness is Pack-side, Part-side, Field-side, or pass-side readout\\
    Compactness & Extract a terminal object from the preterminal branch & Detached or under-controlled terminal limit & Admits a candidate \(Q\) only when it remains attached to the same solution record\\
    Recovery/surface fidelity & Convert terminal control into continuation & Recovery available on the wrong surface or wrong object & Supplies member readout on the same object; otherwise leaves a face failure or support boundary\\
    Lower-prefix/upper-tail & Collapse split survivor families & Split terminal family & Tests each surviving family as its own same-solution witness\\
    Kernelized lifted band & Use scale separation to gain decay & Half-derivative lower-shell remainder & Supports the selected witness until it becomes a face landing or readout payment\\
    Shell gain/half derivative & Use active-window smallness to pay lower strain & Active-window coefficient gap & Field pressure after Pack and Part have survived on the selected record\\
    Annular-limit witness & Control the residual scale-critical load on shrinking positive-radius annuli & Terminal residual pulse surrounding a radius-zero endpoint & Gold seeks direct annular control; silver classifies the admitted pulse by Part or Field\\
    \hline
    \end{tabular}
    \end{center}

    The annular-limit row is the live boundary for the current forward branch.  The radius-zero point by itself is a point-object reading.  The singularity claim is carried by the surrounding positive-radius fields.  Gold closes that boundary by proving scale-uniform annular control.  Silver closes it only after the annular residue has been admitted as the same-solution terminal witness and the page shows the resulting Part or Field failure.  Until that line is written, the annular material remains an open forward obstruction with a precise CM counterpart.
