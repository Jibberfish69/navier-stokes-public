    \section{Original Problem Statement}

    The Clay Navier--Stokes problem asks whether a smooth divergence-free velocity field can lose smoothness in finite time under the three-dimensional incompressible Navier--Stokes evolution.  The unknowns are the velocity \(u(x,t)\) and pressure \(p(x,t)\).  In the periodic case, and in the whole-space case with smooth rapidly decaying data, they solve
    \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(\cdot,0)=u_0,
    \]
    with fixed viscosity \(\nu>0\) and no forcing.  The datum \(u_0\) is smooth and divergence-free.  The pressure is tied to \(u\) by incompressibility.  Equivalently, it is recovered by the elliptic pressure law that removes the gradient part of the nonlinear term.

    A proposed finite-time counterexample is a claim about one branch of this equation.  It starts from \(u_0\), follows the classical Navier--Stokes solution on a maximal interval \([0,T_*)\), and asserts that the usual continuation readout fails at \(T_*<\infty\).  The proof keeps that same branch fixed.  The velocity, pressure, viscosity, pressure law, incompressibility constraint, and preterminal smooth solution all remain attached to the terminal object being tested.

    The proof has two certification layers.  The gold layer is the direct forward-positive route.  It tries to control the original solution strongly enough to continue it.  A successful gold proof is the strongest certificate, because it keeps the same solution inside the continuation class.  The silver layer is the CM contrapositive route.  It begins after the forward accounting has produced a precise terminal obstruction.  It asks whether the selected terminal record is still an admissible same-solution Navier--Stokes object.  The CM test has three witness faces: Pack for a positive same-fluid carrier or packet, Part for same-equation pressure-viscosity-incompressibility participation, and Field for a coherent positive-scale velocity-field readout.

    A terminal singularity claim is larger than the point \((x_*,T_*)\).  The claim is carried by positive-radius fields that shrink toward that point.  Those surrounding fields form the annular witness.  Gold would close the annular witness by proving scale-uniform control of the residual refill on every same-solution terminal schedule.  Silver can classify that same boundary only after a surviving annular residue has been selected as the same-solution terminal record.  After that admission, carrier has already been supplied for the annular test, so a finite nonsmooth admitted residue must leave the class through Part or Field.
