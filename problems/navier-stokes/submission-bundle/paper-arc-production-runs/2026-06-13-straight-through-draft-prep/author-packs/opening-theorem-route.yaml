    \section{Current Main Result and Proof Roadmap}

    The main theorem is a same-solution terminal classification theorem after admission.  It states what the proof can certify once a proposed finite Clay terminal claim has selected a terminal record \(Q\) for the original Navier--Stokes branch and once that record has entered the CM terminal test.  At that point the selected record is on one of two sides:
    \[
      \Member(Q;\Owork)
      \qquad\hbox{or}\qquad
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The member side is the continuation side.  The exit side is witnessed by the first failed face in the Pack/Part/Field tree.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch.  If \(Q\) is admitted as a same-solution terminal witness, then the CM terminal test has the following alternatives.  Either \(Q\) retains the class-membership data needed for the continuation side, written
    \[
      \Member(Q;\Owork),
    \]
    or the first failed witness face gives
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the second case \(Q\) supports
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Hence one admitted same-solution terminal record cannot be both the member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The theorem has an admission clause because the CM test classifies the terminal object of the original equation.  The selected record must carry the same datum, same velocity-pressure branch, same fixed viscosity, same pressure law, same incompressibility constraint, and same terminal role.  A comparison packet, branch diagram, support estimate, or limiting profile helps only after it is tied back to that same branch.

    The proof route is organized around four questions.  First, what exact Navier--Stokes object is under test?  Second, what does the gold route control, and where does the present forward accounting stop?  Third, when an obstruction survives that accounting, is the survivor still a same-solution terminal record?  Fourth, if the survivor is admitted to the CM test and cannot remain on the continuation side, which witness face fails first?

    The annular endpoint witness is the first place where the route must be read carefully.  A radius-zero point by itself is too small to carry the Clay breakdown claim.  The claim is carried by surrounding positive-radius fields as their radii shrink toward \(0\).  The gold supplier remains open at the scale-uniform residual refill bound on every same-solution terminal annular schedule.  The silver side begins after selection.  Once a surviving residual annular witness is admitted as the same-solution terminal record, Pack is no longer the remaining CM argument for that annular test; selection and carrier have already been paid.  A nonsmooth admitted annular witness then leaves the class through Part or Field.

    The rest of the paper follows this order.  The opening sections derive the forward obstruction from the energy and enstrophy identities and then refine it into the annular residual refill problem.  The CM sections define membership, Pack, Part, and Field.  The branch sections explain which support objects pay the proof, which are obsolete, and which remain open.  The appendices are used only where they help the reader see a proof argument, obstruction, support role, or explicit continuation question.
