      gold as direct continuation control and CM as class-exit classification of a
      precise same-branch obstruction.
    reader_thread_attack: A reader could lose the domain and export scope. The replacement
      repairs that by naming the periodic zero-force problem as the first concrete
      domain, keeping whole-space export separate, and limiting comparison/Euler material
