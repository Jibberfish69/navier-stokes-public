    \section{Reaching Obstruction}

    The first obstruction can be seen without any special terminology.  Write
    \[
      I(t)=\int (u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    By Holder's inequality,
    \[
      |I(t)|
      \le
      \|u\|_{L^6}\|\nabla u\|_{L^3}\|\Delta u\|_{L^2}.
    \]
    Sobolev gives \(\|u\|_{L^6}\lesssim \|\nabla u\|_{L^2}\), and interpolation gives
    \[
      \|\nabla u\|_{L^3}
      \lesssim
      \|\nabla u\|_{L^2}^{1/2}\|\Delta u\|_{L^2}^{1/2}.
    \]
    Combining these two bounds gives
    \[
      |I(t)|
      \lesssim
      \|\nabla u\|_{L^2}^{3/2}\|\Delta u\|_{L^2}^{3/2}.
    \]
    Young's inequality gives
    \[
      |I(t)|
      \le
      \frac{\nu}{2}\|\Delta u\|_{L^2}^2
      +
      C_\nu\|\nabla u\|_{L^2}^6.
    \]
    Substituting into the enstrophy identity yields
    \[
      Y'(t)\le C_\nu Y(t)^3.
    \]
    This inequality gives local control.  It gives no global ceiling.  The comparison equation \(Z'=C_\nu Z^3\) has
    \[
      Z(t)=\frac{Z(0)}{\sqrt{1-2C_\nu Z(0)^2t}},
    \]
    so the comparison ceiling can become infinite in finite time.  Restarting the estimate at a later time \(t_0<T_*\) gives a new interval whose length depends on \(Y(t_0)^{-2}\).  To cross \(T_*\), the proof needs pointwise control of \(Y(t_0)\) as \(t_0\uparrow T_*\).

    The energy identity gives a different kind of information:
    \[
      \sup_{0\le t<T_*}\|u(t)\|_{L^2}^2
      +
      2\nu\int_0^{T_*}\|\nabla u(t)\|_{L^2}^2\,dt
      \le
      \|u_0\|_{L^2}^2.
    \]
    This controls total kinetic energy and the time integral of enstrophy.  Higher derivatives can still concentrate near \(T_*\).  To see what the next rung asks for, differentiate the equation \(m\) times, test the differentiated equation against \(\nabla^m u\), integrate by parts, and use incompressibility to keep the transport term off the left side.  The nonlinear commutator leaves the displayed bound
    \[
      \frac12\frac{d}{dt}\|\nabla^m u\|_{L^2}^2
      +\nu\|\nabla^{m+1}u\|_{L^2}^2
      \le
      C_m\|\nabla u\|_{L^\infty}\|\nabla^m u\|_{L^2}^2.
    \]
    A continuation proof needs an integrable bound on \(\|\nabla u\|_{L^\infty}\), or a stronger Sobolev bound that implies it.

    The annular and funnel analysis refines this missing item.  Near a proposed terminal point \((x_*,T_*)\), the singularity claim is carried by fields on shrinking positive-radius neighborhoods, not by the endpoint alone.  Set
    \[
      \tau=T_*-t,\qquad
      y=\frac{x-x_*}{\sqrt{\tau}},
      \qquad
      s=-\log\tau,
    \]
    and
    \[
      v(y,s)=\sqrt{\tau}\,u(x,t),
      \qquad
      q(y,s)=\tau p(x,t).
    \]
    The parabolic funnel
    \[
      \mathcal F_\lambda
      =
      \{(x,t):0<T_*-t<\tau_0,\ |x-x_*|<\lambda\sqrt{T_*-t}\}
    \]
    becomes the fixed cylinder \(B_\lambda\times(s_0,\infty)\).  The scale-critical quantities in this cylinder are
    \[
      A_\lambda(s)=\int_{B_\lambda}|v(y,s)|^2\,dy,
    \]
    \[
      D_\lambda(s)=\int_s^{s+1}\int_{B_\lambda}|\nabla_y v|^2\,dy\,d\sigma,
    \]
    and
    \[
      C_\lambda(s)=\int_s^{s+1}\int_{B_\lambda}\bigl(|v|^3+|q|^{3/2}\bigr)\,dy\,d\sigma.
    \]
    Physical energy in the shrinking original ball sees a discounted version:
    \[
      \int_{B_{\lambda\sqrt{\tau}}(x_*)}|u(x,t)|^2\,dx
      =
      e^{-s/2}A_\lambda(s).
    \]
    Finite physical energy controls the discounted quantity.  It leaves the unweighted profile \(A_\lambda(s)\) and the scale-critical packet \(C_\lambda(s)\) unpaid.

    The gold annular supplier would remove this discount.  One possible form would prove
    \[
      \sup_{s\ge s_0}A_\lambda(s)
      +
      \int_{s_0}^{\infty}D_\lambda(s)\,ds
      +
      \int_{s_0}^{\infty}C_\lambda(s)\,ds
      <\infty
    \]
    with enough decay on late slabs to feed the usual local regularity readout.  In shell language, the same question appears as control of the residual refill
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds,
    \]
    read on the dyadic shells and time windows meeting a shrinking annulus.  The desired statement is scale-uniform smallness of this residual bill on every same-solution terminal annular schedule.

    The gold obstruction is terminal Zeno source-refill.  Positive same-solution source mass can concentrate along shrinking heat-time windows with \(r_m\downarrow0\) and \(\sum_m r_m^2<\infty\).  The time-face model
    \[
      g_m(s)=m\,1_{(-1/m,0]}(s)
    \]
    has bounded \(L^1_s\) mass and converges weakly to a terminal atom.  It has no fixed preterminal residence, yet it keeps terminal source mass.

    The same obstruction appears in the residual heat-scale currency.  Let
    \[
      \lambda_m=2^{j_m},
      \qquad
      \tau_m=\lambda_m^{-2},
      \qquad
      I_m=[t_m-\tau_m,t_m],
      \qquad
      t_m\uparrow T_*,
    \]
    with the windows disjoint and \(j_m\to\infty\).  On the selected shell set
    \[
      \Phi_{j_m}^+(s)=a_m\,1_{I_m}(s),
      \qquad
      0<a_0\le a_m\le A.
    \]
    The unweighted source mass is summable:
    \[
      \sum_m\int_{I_m}\Phi_{j_m}^+(s)\,ds
      \le
      A\sum_m2^{-2j_m}
      <\infty.
    \]
    At the end of each heat window, the scale-critical residual refill remains bounded below:
    \[
      D_{j_m}^{\mathrm{res}}(t_m;t_m-\tau_m)
      =
      2^{2j_m}a_m
      \int_0^{2^{-2j_m}}
      e^{-c_0\nu2^{2j_m}\sigma}\,d\sigma
      =
      a_m\,\frac{1-e^{-c_0\nu}}{c_0\nu}
      \ge
      a_0\,\frac{1-e^{-c_0\nu}}{c_0\nu}.
    \]
    Finite physical source mass and heat-window localization alone leave this pulse possible.  A gold proof needs an anti-atom or time-thickness theorem that rules it out in the same-solution source accounting.

    This is the point where the opening route turns to CM.  If a residual annular witness survives this accounting and is admitted as the same-solution terminal object, Pack has been paid by the admission.  The nonsmooth admitted witness must then fail through Part or Field.
  math_reader_critic:
    claim_truth_attack: The strongest claim is that the opening reaches terminal Zeno
      source-refill as the current gold obstruction. The replacement pays this by
      deriving the local enstrophy inequality, showing why energy leaves higher derivatives
      unpaid, passing to the annular/funnel variables, and computing a heat-window
      pulse whose residual refill stays bounded below.
    reader_thread_attack: A reader could lose the transition from enstrophy to annular
      refill. The replacement repairs the thread by moving in order from I(t), to
      Y prime, to the local comparison ceiling, to shrinking parabolic coordinates,
      to discounted physical energy, to residual heat-scale currency.
    open_derivation_attack: The local estimate and model pulse calculation are paid.
      The anti-atom or time-thickness theorem that would rule out the terminal pulse
      is not paid; the text names that missing theorem and then sends an admitted
      residual annular witness to Part or Field on the CM side.
