    \section{Scope And Proof Polarity}
    \label{sec:scope-proof-polarity}

    The Navier--Stokes global regularity problem is usually approached in the positive-forward direction.  That route tries to estimate the original solution strongly enough that finite-time loss of smoothness has no room to occur.  That is the gold route in this paper.  It is the most direct certification layer because it keeps the solution itself inside the continuation argument.

    The present proof also uses a contrapositive layer.  It keeps the same equation and the same branch.  It begins with the positive-forward attempts because those attempts identify the actual terminal objects that threaten continuation.  When the forward accounting leaves a precise obstruction, the proof asks whether that obstruction is still a same-solution Navier--Stokes terminal record.  If it is admitted to the CM test and cannot remain on the member-continuation side, the first failed Pack, Part, or Field face supports class exit.

    This polarity matters for reading the branch material.  A failed gold estimate becomes useful when it leaves a selected terminal record tied to the original branch.  A CM face failure has a different job: it is the reason the alleged finite nonsmooth terminal record cannot also be the same in-class Navier--Stokes member record.

    The first concrete domain is the periodic zero-force problem on \(\mathbb T^3\).  Whole-space \(\mathbb R^3\) material is tracked as its own export and exterior-source boundary.  Comparison material and Euler boundary material are included only where they pay a same-solution proof role or a smoothness-boundary role.  A branch-local result reaches the full Clay conclusion only through the export argument that carries it there.
