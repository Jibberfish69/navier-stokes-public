    \section{Main Result}

    The main theorem is a same-solution terminal classification theorem after admission.  It keeps the annular boundary visible because the stronger gold annular supplier remains open.  The silver payment for an admitted annular residue is precise: once that residue is selected as the same-solution terminal record, Pack has already been paid, and a finite nonsmooth branch exits through Part or Field.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch.  If \(Q\) is admitted as a same-solution terminal witness, then either
    \[
      \Member(Q;\Owork)
    \]
    or the first failed CM witness face gives
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the failed-face cases,
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Thus one admitted same-solution terminal record cannot be both a member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The theorem is a classification theorem after admission.  Admission is the step that ties the object to the original Navier--Stokes branch.  It requires the same datum, same velocity-pressure solution, same fixed viscosity, same pressure law, same incompressibility constraint, and same terminal role.  Without that tie, the paper has only a comparison object or a diagnostic pattern, not the terminal record being classified.

    The annular boundary explains the present Clay-facing status.  A proposed terminal point \((x_*,T_*)\) is only the tip.  The singularity claim is carried by positive-radius fields shrinking toward that tip.  Gold would close this boundary by proving scale-uniform control of the residual annular refill.  The narrowed obstruction is terminal Zeno source-refill: same-solution source mass may concentrate along shrinking heat-time windows even while the physical energy remains finite.  In the residual currency, a source pulse on a heat window of length \(2^{-2j}\) has summable physical mass while \(D_j^{\mathrm{res}}\) stays bounded below.

    Silver can pay the same boundary only after the surviving annular residue has been selected as the same-solution terminal record.  Once it is admitted in that way, Pack is not the remaining landing for the annular test; carrier and selection have already been paid.  A nonsmooth admitted annular witness must then fail by Part or by Field.  If Part and Field survive with the \(H^s\), \(s>5/2\), continuation readout, the dyadic source production forces \(D_j^{\mathrm{res}}\to0\), so the record is on the member side and cannot be the selected nonzero pulse.

    The proof skeleton is short.  First, a finite terminal claim supplies either the usual \(H^s\), \(s>5/2\), restart readout or a selected terminal record \(Q\) for the same branch.  Second, the selected record enters the CM packet tree only when the same-solution admission data are present.  Third, retained Pack, Part, and Field feed the member-continuation side.  Fourth, a finite nonsmooth terminal branch loses its first required face and supports \(\Exit(Q;\Owork)\).  The annular section applies that skeleton to the residual heat-scale pulse: finite physical source mass leaves the gold supplier unpaid, while an admitted nonzero pulse cannot retain both Part and Field.
