author_contract:
  arc_id: comparison-transfer-boundary
  must_write:
  - finished TeX prose, not a report
  - reader-facing explanation before compressed notation
  - full derivation/proof steps available in the current repo context
  - gold status and obstruction stated without redefining gold
  - CM/silver counterpart written where the arc touches class exit
  - endpoint status stated as proved, support, obstruction, obsolete, contradiction,
    or open continuation
  must_criticize:
  - attack the replacement's strongest claim and state how the replacement now pays
