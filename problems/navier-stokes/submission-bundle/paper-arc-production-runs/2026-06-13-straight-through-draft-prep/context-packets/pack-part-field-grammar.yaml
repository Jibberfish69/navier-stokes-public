    \section{Simplifying The Witness Logic Table}

    The formal conjunction \(\Part plus Field-window evidence_{N,Q}\wedge\Field_{N,r,Q}\) has many Boolean rows.  The proof reads them through the order in which a Navier--Stokes record needs the data.  First ask for the carrier, then the same law, then the one-field readout.
    \[
    \begin{array}{ll}
    \Part plus Field-window evidence_{N,Q}\wedge\Field_{N,r,Q}
      & \text{member-side certificate},\\[1mm]
    Field-window evidence outside CM
      & \text{Part/Field failure},\\[1mm]
    \neg\Part_{N,Q}
      & \text{Part-first failure},\\[1mm]
    \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}
      & \text{Field-first failure.}
    \end{array}
    \]
    The member row also needs the branch readout.  The Pack row says there is no positive same-fluid carrier.  The Part row says the carrier is present and the same law has been lost.  The Field row says the carrier and law are present, while every positive one-field scale fails.

    The other Boolean rows collapse to the first failed face.  A field-looking trace without a carrier has already failed Pack.  A formal participation reading without a same carrier also fails Part/Field first.  A carrier whose law and field both fail is recorded at Part, because the equation law is lost before the field question can do useful work.

    Field remains a real terminal face.  Some terminal pictures first appear as jumps, incompatible neighboring traces, or unbounded tower readings.  After Pack and Part have survived on the selected record, those pictures ask whether one positive scale still carries a coherent field.  If every such scale fails, the record lands in Field.

