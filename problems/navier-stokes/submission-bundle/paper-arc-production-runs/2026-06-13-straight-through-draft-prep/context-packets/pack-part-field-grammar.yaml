  text: |
    \section{Packet Witness Law}

    Pack is the entry face of the terminal test.  The proof first asks whether the alleged terminal record is carried by the same fluid.  A point, number, source label, or diagnostic trace may identify where trouble is visible.  The CM test needs the positive body on which the Navier--Stokes law and the field readings can be evaluated.

    Let \(Q\) be the selected terminal record, and let \(Q_t\) be its time slice.  The material carrier is read through the Lagrangian map
    \[
      \Phi_t:A_Q(t)\to Q_t,
      \qquad
      A_Q(t)=\{a:\Phi(a,t)\in Q_t\},
    \]
    with deformation tensor
    \[
      F(a,t)=\nabla_a\Phi(a,t).
    \]
    The Pack gauge on \(Q\) is
    \[
      \Gamma_{\mathrm{pack},Q}(t)
      :=
      \sup_{a\in A_Q(t)}
      \max\{|F(a,t)|,\ |F(a,t)^{-1}|\}.
    \]
    It measures whether the selected record is still being carried by one finite, positive same-fluid packet.

    \begin{definition}[Packet witness law]
    \(\Pack_Q\) means that \(Q\) has a positive same-fluid carrier.  On each time slice being tested, \(\Phi_t\) restricts to one transported \(C^1\) carrier on \(A_Q(t)\), the incompressible Jacobian condition \(\det F=1\) holds there, the Pack gauge \(\Gamma_{\mathrm{pack},Q}(t)\) is finite, and the terminal region has a positive finite-overlap carrier scale.
    \end{definition}

    This definition keeps the packet question tied to the original solution.  The same \(u\) moves \(\Phi\).  The same incompressibility condition supplies the volume law.  The same positive carrier scale lets the proof pass from a terminal location to a terminal object.

    The periodic branch pays Pack by selecting the whole transported material atlas \(Q_{\mathrm{atlas}}\).  The atlas fixes the carrier before any local obstruction is read.  The whole-space branch pays Pack by giving the surviving exterior source a same-solution material address after the initial heat tail and the fixed compact-core far-field contribution have been removed.

    A terminal source, pressure pulse, donor history, or zero-radius residue becomes a Pack payment only after it supplies this positive carrier.  A record with that carrier moves to Part.  A record with no such carrier has first failure
    \[
      Field-window evidence outside CM.
    \]
