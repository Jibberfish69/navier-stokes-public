    \section{The Class-Law Proof}

    The class law turns the witness grammar into a proof.  It has two inputs.  The first input is the exact certificate theorem: retained Part and Field certify membership.  The second input is the finite-failure theorem: an admitted finite terminal obstruction cannot retain a continuation-complete packet.

    \begin{definition}[Continuation-complete packet]
    Fix \(s>5/2\), and let \(N_s\) be a tower depth high enough for the classical \(H^s\) readout.  A continuation-complete packet for \(Q\) is a packet satisfying
    \[
      \Part plus Field-window evidence_{N_s,Q}\wedge\Field_{N_s,r,Q}
    \]
    for some \(r>0\), together with the branch readout
    \[
      \sup_{t<T_*}\|u(t)\|_{H^s}<\infty.
    \]
    \end{definition}

    \begin{definition}[Terminal face-failure witness]
    A terminal face-failure witness is an admitted same-solution terminal record \(Q\) whose finite obstruction is charged to the first failed face
    \[
      Field-window evidence outside CM,
      \qquad
      \neg\Part_{N,Q},
      \qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    It is the fail-side witness for \(\Exit(Q;\Owork)\).
    \end{definition}

    \begin{proposition}[Exact witness certificate]
    For an admitted same-solution record \(Q\), the all-depth analytic witness certifies class membership:
    \[
      \forall N\ \exists r_N>0:\ \CM_{N,r_N,Q}
      \quad\Longrightarrow\quad
      \Member(Q;\Owork).
    \]
    \end{proposition}

    \begin{proof}
    Fix \(N\).  Pack gives one transported same-fluid carrier on \(Q\).  Part gives the differentiated Navier--Stokes participation law
    \[
      D_tU_k=K_k+B_k,\qquad 0\le k\le N,
    \]
    on that carrier.  Field gives a positive scale \(r_N\) on which the tower readings are readings of one field.  Since this holds at every finite depth, the local restriction to \(Q\) still inherits the data and law bundle of \(\Owork\).  That is exactly \(\Member(Q;\Owork)\).
    \end{proof}

    \begin{theorem}[Finite witness face classification]
    Let \(\mathcal F\) be an admitted finite terminal obstruction from the same smooth initial datum, and let \(Q\) be the selected terminal record.  At the continuation depth \(N_s\), \(\mathcal F\) is tested in the Part/Field decision tree:
    \[
      \mathcal F
      \Longrightarrow
      \begin{cases}
        Field-window evidence outside CM,\\
        \neg\Part_{N_s,Q},\\
        \Part plus Field-window evidence_{N_s,Q}\wedge\forall r>0\,\neg\Field_{N_s,r,Q}.
      \end{cases}
    \]
    Each branch supplies \(\Exit(Q;\Owork)\).
    \end{theorem}

    \begin{proof}
    Begin with the selected record \(Q\).  The first gate is Pack.  Either the positive same-fluid carrier exists or it fails.  Carrier failure gives \(Field-window evidence outside CM\), and the proof stops at Pack.

    Assume Field-window evidence is present.  The second gate is Part.  Either the same pressure-viscosity-incompressibility tower acts through depth \(N_s\) on the carrier, or it fails.  Participation failure gives
    \[
      \neg\Part_{N_s,Q},
    \]
    and the proof stops at Part.

    Assume Pack and Part both survive.  The final gate is Field.  If there were some positive scale \(r>0\) with \(\Field_{N_s,r,Q}\), then
    \[
      \Part plus Field-window evidence_{N_s,Q}\wedge\Field_{N_s,r,Q}
    \]
    would give a continuation-complete packet.  The attached \(H^s\), \(s>5/2\), readout would extend the classical solution past \(T_*\).  This contradicts the assumption that \(\mathcal F\) is the finite terminal obstruction for the same branch.  So every positive Field scale fails:
    \[
      \Part plus Field-window evidence_{N_s,Q}\wedge\forall r>0\,\neg\Field_{N_s,r,Q}.
    \]

    In all three cases the selected record loses a required membership face.  The loss is read as \(\Exit(Q;\Owork)=\neg\Member(Q;\Owork)\).
    \end{proof}

    \begin{theorem}[No same-record member obstruction]
    One selected terminal record cannot be both a continuation-complete member record and the finite nonsmooth obstruction for the same original Navier--Stokes branch.
    \end{theorem}

    \begin{proof}
    A continuation-complete member record supplies Part, Field, and the \(H^s\), \(s>5/2\), readout at the required depth.  The standard local theory relaunches the same classical solution from times \(t_j\uparrow T_*\) and extends it past \(T_*\).  The same record then cannot be the finite terminal obstruction blocking that continuation.
    \end{proof}

    \subsection{Annular residual specialization}

    The annular endpoint is the place where the paper must keep the gold and silver layers visible at the same time.  The radius-zero point is only the limiting point.  The finite-time singularity claim is carried by positive-radius fields on annuli shrinking toward \((x_*,T_*)\).

    Let
    \[
      A_m
      =
      \{(x,t):\alpha r_m<|x-x_*|<\beta r_m,\quad
      |t-t_m|\lesssim r_m^2\},
      \qquad
      r_m\downarrow0,\quad t_m\uparrow T_*.
    \]
    Choose \(j_m\) with \(2^{-j_m}\simeq r_m\), and write
    \[
      u_j=\Delta_j u,\qquad
      E_j(t)=2^{2j}\|u_j(t)\|_2^2,\qquad
      D_j(t)=2^{4j}\|u_j(t)\|_2^2 .
    \]
    The shell inequality is
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)\le \Phi_j^+(t),
    \]
    where \(\Phi_j^+\) is the positive nonlinear source into the shell.  The residual refill after entrance time \(t_0\) is the scale-critical quantity
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]

    Gold asks for scale-uniform vanishing of this residual on every same-solution terminal annular schedule:
    \[
      \forall \varepsilon>0\ \exists r_\varepsilon>0
      \quad\text{such that}\quad
      r_m<r_\varepsilon \Longrightarrow D_m^{\mathrm{res}}\le \varepsilon.
    \]
    A stronger form is
    \[
      \sup_{\mathcal A}\ \sum_{m\ge M}D_m^{\mathrm{res}}\to0
      \qquad(M\to\infty).
    \]
    The current paper keeps this as the unpaid gold supplier.

    The obstruction is concrete.  Put \(\lambda_m=2^{j_m}\), \(\tau_m=\lambda_m^{-2}\), and \(I_m=[t_m-\tau_m,t_m]\).  If
    \[
      \Phi_{j_m}^+(s)=a_m\,1_{I_m}(s),
      \qquad 0<a_0\le a_m\le A,
    \]
    then the physical source mass can be finite,
    \[
      \sum_m\int_{I_m}\Phi_{j_m}^+(s)\,ds
      \le A\sum_m2^{-2j_m}<\infty,
    \]
    while the scale-critical residual stays positive:
    \[
      D_{j_m}^{\mathrm{res}}(t_m;t_m-\tau_m)
      =
      2^{2j_m}a_m\int_0^{2^{-2j_m}}
      e^{-c_0\nu2^{2j_m}\sigma}\,d\sigma
      =
      a_m\frac{1-e^{-c_0\nu}}{c_0\nu}
      \ge
      a_0\frac{1-e^{-c_0\nu}}{c_0\nu}.
    \]
    This is the current gold obstruction: finite physical source mass and heat-scale localization leave room for a persistent residual refill.

    Silver receives the survivor only after the annular residue has been admitted as the same-solution terminal record.  That admission pays the carrier side for the annular test.  The remaining nonsmooth branch then lands in Part or Field.  It lands in Part when the same pressure-viscosity-incompressibility tower is lost.  It lands in Field when Part survives and every positive field scale fails.

    The Field calculation is short.  If Part survives and a positive-scale Field readout supplies an \(H^s\), \(s>5/2\), bound \(M\), then
    \[
      \|\Delta_j\mathbb P\nabla\cdot(u\otimes u)\|_2
      \le C_sM^2\,2^{-j(s-1)},
      \qquad
      \|u_j\|_2\le M\,2^{-js}.
    \]
    Thus
    \[
      \Phi_j^+(t)\le C_sM^3\,2^{(3-2s)j},
      \qquad
      D_j^{\mathrm{res}}(t;t_0)\le C_s'M^3\,2^{(3-2s)j}\to0.
    \]
    This contradicts an admitted residual pulse with \(D_{j_m}^{\mathrm{res}}\ge\eta>0\).  After annular admission, a nonzero nonsmooth residual pulse loses Part or loses Field.
