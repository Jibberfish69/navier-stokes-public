  text: "\\section{Proof Attempts And Failures To Prove Smoothness}\n\nThis appendix
    is the support record behind the main class-membership proof.\nIt records positive
    proof attempts only where they help the reader see a\nsame-solution terminal object,
    a member-side readout, a Pack/Part/Field face,\nor a support theorem still waiting
    for one of those jobs.\n\nThe order begins with the four-body attempt because
    that is where the\nsmoothness-control program first became a concrete circuit:\ncontrol
    the high scales, control energy and enstrophy, use those controls to\nproduce
    an exact object, and recover derivative control on that object.\nEvery later branch
    below is a refinement of one of those arguments.\n\nEach route is written in the
    same reader-facing order.  First it states the\npayment the route tried to make.
    \ Then it shows the calculation that made the\nroute worth trying.  Then it names
    the mathematical stopping point.  Finally it\nstates what survived into the class-membership
    argument.\n\n\\subsection{The Failure-Record Contract}\n\nThe reader has already
    seen the class test.  Pack, Part, and Field are the\nthree places where a terminal
    witness can keep or lose membership.  The\nappendix now shows why the positive
    smoothness program leaves the objects\ntested by that grammar.\n\nFor that reason
    every route below has five obligations:\nthe attempted payment, the calculation
    that was supposed to carry the route, the exact\nmathematical stopping point, the surviving
    residue, and the later CM role.\nThose obligations are the admission rule for
    this appendix.  A route belongs\nhere when it helps the reader identify a terminal
    object, a member-side readout,\na Pack/Part/Field face, or a support theorem that
    is still waiting for one of\nthose jobs.  The appendix serves the main proof by
    showing where each positive\nattempt stopped and what same-solution object or
    support burden it handed\nforward.\n\nThe order is part of the argument.\nThe
    four-body circuit comes first because it is the first complete payment\nscheme.\nThe
    modern survivor families come next because they split the old scale and\nsource
    bills into lower-prefix and upper-tail forms.\nThe shell, Volterra, signed, selector,
    source, pressure, Zeno, local-critical,\nand endpoint branches then appear in
    the order in which the unpaid object is\nsharpened.\nThe record closes after the
    branch table and the CM handoff explain how a\nfinite-time breakdown claim carries
    one of these terminal objects into the\nPack/Part/Field test.\n\n\\begin{enumerate}[leftmargin=*,label=\\arabic*.]\n\\item
    \\textbf{Four-body circuit.}\nThe attempted payment is a loop:\ntail control gives
    \\(Q(t)\\) control, those controls give compactness, compactness\ngives an exact
    object, and derivative recovery returns to tail control.\nThe route uses four real mathematical tools:\nviscous high-frequency damping,
    the energy identity, compactness of controlled\napproximations, and derivative
    recovery on a geometric carrier.\nThe stopping point is circular debt.\nEach body
    needs the hard theorem promised by the next body.\nThe residue is the first complete
    obstruction packet: scale transfer, nonlinear\nsource, exact-object capture, and
    same-surface derivative drain.\nIts CM role is architectural.\nIt explains why
    the later proof must test the same terminal object rather than\ndeclare a positive
    estimate solved.\n\n\\item \\textbf{Scale barrier.}\nThe attempted payment is
    a pointwise nonlinear transfer law strong enough to\nmake high-frequency derivative
    tails summable.\nThe calculation starts from\n\\(\\partial_tE(k,t)=T(k,t)-2\\nu
    k^2E(k,t)\\) and asks for decay of \\(T(k,t)\\)\nthat lets viscosity dominate
    above a critical scale.\nThe stopping point is that the energy identity pays\n\\(\\int\\|\\nabla
    u\\|_2^2\\,dt\\), not the pointwise cascade law.\nThe residue is high-frequency
    nonlinear transfer.\nIts CM role is to supply tail, lifted-band, lower-shell,
    and scale-memory\nwitness material after a terminal packet has been selected.\n\n\\item
    \\textbf{\\(Q(t)\\) and enstrophy.}\nThe attempted payment is a one-derivative
    extension of the kinetic energy law.\nThe calculation differentiates enstrophy
    and reaches\n\\(Y'(t)+\\nu Z(t)\\le C_0 \\|\\nabla u\\|_2^{3/2}\\|\\Delta u\\|_2^{3/2}\\),
    hence\n\\(Y'(t)\\le C_\\nu Y(t)^3\\) after absorption.\nThe stopping point is
    the vortex-stretching source.\nThe inequality is local-theory useful and still
    compatible with finite-time\ngrowth.\nThe residue is native source debt, later
    read as source reserve, terminal atom,\nor pressure-sustain residue.\nIts CM role
    is to mark source objects as terminal obstructions requiring Pack,\nPart, or Field
    landing.\n\n\\item \\textbf{Compactness.}\nThe attempted payment is exact-object
    production from controlled\napproximations.\nThe calculation is the low/high split:
    low modes are finite-dimensional once\ntime compactness is supplied, while high
    modes are small under a spectral tail.\nThe stopping point is dependency order.\nCompactness
    consumes tail and enstrophy control; it does not create them.\nThe residue is
    same-surface packet capture.\nIts CM role is to prevent a terminal object from
    being treated as proof-bearing\nuntil it is the same Navier--Stokes witness \\(Q\\).\n\n\\item
    \\textbf{Curvature or gradient recovery.}\nThe attempted payment is derivative
    drain through geometric structure.\nThe calculation uses a Riemannian carrier
    where a positive Ricci term would\ncontrol \\(|\\nabla u|^2\\).\nThe stopping
    point is surface fidelity.\nThe Clay problem is periodic and flat, so the Ricci
    drain is not a free theorem\non the required surface.\nThe residue is deformation
    geometry and commutator control.\nIts CM role is support until a same-surface
    drain theorem or a terminal face\nlanding is supplied.\n\n\\item \\textbf{Modernized
    four-body packet.}\nThe attempted payment is the same loop with modern objects:\ntail
    leakage, source reserve, terminal packet capture, and deformation\ncommutator.\nThe
    calculation is the identification of the same survivor through dyadic tail,\nvelocity
    tower, and moving-geometry lenses.\nThe stopping point is the missing contraction
    or absorption theorem.\nThe residue is one shared survivor seen from several directions.\nIts
    CM role is to stop the paper from treating new vocabulary as a new proof.\n\n\\item
    \\textbf{Two survivor families.}\nThe attempted payment is a collapse between
    the lower-prefix/affine-quotient\nfamily and the upper-tail/gap-kernel family.\nThe
    calculation shows one family as scale memory below the active shell and the\nother
    as separated upper-tail leakage.\nThe stopping point is the missing theorem that
    either makes one family pay the\nother or proves they are the same terminal object.\nThe
    residue is a split survivor.\nIts CM role is to keep lower-prefix memory and upper-tail
    leakage separate\nuntil a face landing identifies their witness role.\n\n\\item
    \\textbf{Kernelized lifted band.}\nThe attempted payment is a gap-kernel gain
    in the region \\(N+M<k<j-4\\).\nThe calculation gets the factor \\(2^{-(j-k)}\\),
    then leaves a lower-shell\nremainder with an extra \\(2^k\\) beyond the energy
    surface.\nThe stopping point is the unpaid half-derivative.\nThe residue is a
    lower-shell gain target.\nIts CM role is possible Field or tower readout only
    after terminal admission.\n\n\\item \\textbf{Shell gain and half-derivative target.}\nThe
    attempted payment is active-window suppression of low-frequency strain.\nThe calculation
    normalizes a lower-shell quantity \\(A_j(t)\\) against\n\\(\\nu2^{2j}\\) and asks
    that the active shell see a small coefficient.\nThe stopping point is that available
    estimates are integrated square budgets,\nnot pointwise active-window bounds.\nThe
    residue is a dynamic low-frequency strain theorem.\nIts CM role is support for
    retained tail and Field coherence.\n\n\\item \\textbf{Cumulative tail stress and
    LPAS.}\nThe attempted payment is a whole-tail version of lower-prefix control.\nThe
    calculation packages lower-prefix energy with active-shell square\ndissipation
    in \\(P_j^\\downarrow2^{-j}D_j^2\\).\nThe stopping point is orientation.\nUpper-tail
    estimates do not pay the lower-prefix active square.\nThe residue is active-square
    debt.\nIts CM role is support for source reserve, scale memory, and same-ledger\npayment
    questions.\n\n\\item \\textbf{Volterra and lower-triangular memory.}\nThe attempted
    payment is ordered scale memory.\nThe calculation turns the lower-prefix object
    into a Volterra operator and\nisolates affine moments \\(M_0,M_1\\).\nThe stopping
    point is a degenerate weight and lack of same-surface coercivity.\nThe residue
    is a weighted quotient mode.\nIts CM role is terminal-survivor candidate, with
    exit only after Pack, Part, or\nField failure is derived.\n\n\\item \\textbf{Signed
    descent.}\nThe attempted payment is cancellation before absolute values destroy
    sign.\nThe calculation keeps a signed scale derivative and tries to telescope
    the bad\nmajorant.\nThe stopping point is eigendirection alignment: active packets
    can follow\nexpanding strain directions.\nThe residue is missing decorrelation,
    signed-measure cancellation, or a\nnonpositive divergence identity.\nIts CM role
    is return pressure to active-square and source-reserve walls.\n\n\\item \\textbf{Persistent
    quotient kill attempts.}\nThe attempted payment is removal of the affine quotient
    left by Volterra\nmemory.\nThe calculation splits the possible kills into LPAS
    return, far-corona\ncontrol, and affine-moment cancellation.\nThe stopping point
    is respectively recycled debt, circular use of the desired\ntheorem, and a one-derivative
    shortage.\nThe residue is affine mass carried by boundary, spill, or edge terms.\nIts
    CM role is terminal quotient evidence requiring a first-face certificate.\n\n\\item
    \\textbf{Projected flow, TPS, and SG.4.}\nThe attempted payment is a parabolic
    or two-point defect equation with a\ncoercive energy identity.\nThe calculation
    gives a desired estimate\n\\(|N_1|+|N_2|\\le\\epsilon\\,\\mathrm{dissipation}+C_\\epsilon\\Psi(E_D)\\).\nThe
    stopping point is selector production.\nNorm control can lose sign, direction,
    pair membership, and one-sided growth.\nThe residue is selector-good lower-envelope
    debt.\nIts CM role is support unless it produces the selected packet or an exact\none-sided
    theorem.\n\n\\item \\textbf{Source-wall deletion cycle.}\nThe attempted payment
    is direct deletion of the nonlinear source from the\nold \\(Q(t)\\) obstruction.\nThe
    calculation repeatedly charges source pulses to native ledgers.\nThe stopping
    point is that each charge exposes a sharper source object.\nThe residue is terminal
    native source concentration.\nIts CM role is to admit source objects to the witness
    test rather than hide\nthem behind a missing forward estimate.\n\n\\item \\textbf{BASAC
    and terminal atom.}\nThe attempted payment is bounded source mass strong enough
    to prevent terminal\ntime atoms.\nThe model calculation \\(g_m=m1_{(-1/m,0]}\\)
    has bounded \\(L^1\\) mass and blows\nevery \\(L^p\\), \\(p>1\\).\nThe stopping
    point is lack of uniform integrability or anti-atom control.\nThe residue is a
    zero-thickness native source atom.\nIts CM role is zero-radius Pack or Part support
    after CM-test admission.\n\n\\item \\textbf{Pressure sustain and pure pressure
    residue.}\nThe attempted payment is reduction of pressure debt to native source
    debt.\nThe calculation separates source-carried pressure from a singular pressure\npart
    orthogonal to native source.\nThe stopping point is that Calderon--Zygmund pressure
    is spatial and tensorial;\nit does not automatically supply same-fluid source
    ancestry.\nThe residue is pure pressure sustain.\nIts CM role is Field diagnostic
    or pressure-side support after pressure exits\nare isolated.\n\n\\item \\textbf{Angular
    saturation.}\nThe attempted payment is cancellation of pressure Hessian lobes
    by angular\npartners.\nThe calculation sees that tensor trace cancellation can
    coexist with a selected\npositive terminal lobe.\nThe stopping point is partner
    legality: negative partners may diffuse, fall\nbelow threshold, leave the family,
    or miss the selected weights.\nThe residue is pressure-lobe debt.\nIts CM role
    is support for pressure tethering or pure pressure Field failure.\n\n\\item \\textbf{Transported
    boundary and no incoming flux.}\nThe attempted payment is elimination of source
    birth through same-fluid\ntransported cylinders.\nThe calculation removes artificial
    fixed-frame boundary inflow.\nThe stopping point is interior time-face concentration.\nAn
    atom can be born inside the shrinking transported cylinder.\nThe residue is no-incoming-flux
    plus interior-production debt.\nIts CM role is Pack, Part, or Field support depending
    on retained carrier and\nflux role.\n\n\\item \\textbf{Quantized parent and Zeno
    ancestry.}\nThe attempted payment is a monotone resource spent by each same-fluid
    refill.\nThe calculation tries radius, heat-time depth, energy, dissipation, labels,
    and\ndonor balance.\nThe stopping point is infinite divisibility down the terminal
    scale tree.\nThe residue is terminal Zeno ancestry.\nIts CM role is Pack-side
    zero-radius failure unless a retained positive-scale\ncarrier is separately produced.\n\n\\item
    \\textbf{Local energy and elliptic time smearing.}\nThe attempted payment is exclusion
    of terminal source atoms by local energy or\npressure ellipticity.\nThe calculation
    shows local energy gives signed terminal measures, while\nspatial elliptic operators
    act time-slice by time-slice.\nThe stopping point is that time concentration can
    survive both tools.\nThe residue is trace, flux, or anti-concentration debt.\nIts
    CM role is source-wall support.\n\n\\item \\textbf{All reduced source-wall routes.}\nThe
    attempted payment is a finite list of supplier theorems:\ntemporal source integrability,
    positive-source Carleson control, parent\nquantization, pressure-source tethering,
    pure-pressure Liouville, and terminal\npressure-strain legality.\nThe stopping
    point is that none is installed unconditionally from the original\ndata.\nThe
    residue is the reduced source-wall obstruction list.\nIts CM role is honesty:
    these are supplier doors, not completed proof arguments.\n\n\\item \\textbf{Source
    reserve birth.}\nThe attempted payment is charging first-created donor-square
    reserve to legal,\nresidual, or inherited ledgers.\nThe calculation chooses a
    first terminal same-fluid window \\(W\\) and contracts\npast reserve by minimality.\nThe
    stopping point is the first-created native reserve left on the retained\nledger.\nThe
    residue is positive-scale donor-square reserve.\nIts CM role is supplier-quarantined
    until a same-ledger payment theorem or\nCM-test face failure is supplied.\n\n\\item
    \\textbf{Zero-moment signed pair.}\nThe attempted payment is cancellation of reserve
    by zero first moment.\nThe calculation splits \\(J=J_+-J_-\\) with equal first
    moments and order-one\nmass.\nThe stopping point is that two packets can exchange
    through the same retained\nledger while moments cancel on heat subwindows.\nThe
    residue is a same-ledger signed-pair no-free-sink theorem.\nIts CM role is retained
    reserve support, not exit without a face landing.\n\n\\item \\textbf{Public \\(L^3\\),
    Duhamel, and native source.}\nThe attempted payment is a local critical translator,
    not fresh deletion.\nThe calculation splits Duhamel into heat ancestry and nonlinear
    native-source\nresponse on the same witness ledger.\nThe stopping point is not
    the local translator; it is whether the terminal\nmass is already on the same
    ledger.\nThe residue is terminal Duhamel response mass.\nIts CM role is installed
    local witness translation into Pack, Part, legal, or\nField-facing readout.\n\n\\item
    \\textbf{Terminal Leray saturation.}\nThe attempted payment is conversion of local
    retained source work into a\nsaturated square.\nThe calculation isolates the signed-partner
    defect after writing\n\\(\\widetilde w_j=w_j+\\delta_j\\).\nThe local \\(L^3\\)
    translator handles the same-family signed defect.\nThe stopping point is the independent
    pressure-Leray route, which still needs\na source or donor edge theorem.\nThe
    residue is pressure-lobe tether debt.\nIts CM role is closed only inside the local
    \\(L^3\\) family.\n\n\\item \\textbf{Critical \\(H^{1/2}\\).}\nThe attempted payment
    is a frequency-sensitive critical translator.\nThe calculation separates amplitude,
    which routes toward \\(L^3\\), from pure\noscillation, which should become a Field
    failure.\nThe stopping point is missing same-ledger extraction and oscillation-to-Field\nlemmas.\nThe
    residue is conditional \\(H^{1/2}\\) field defect.\nIts CM role is conditional
    translator only.\n\n\\item \\textbf{Synthesis and branch table.}\nThe attempted
    payment at the end is reader custody.\nThe paper must not leave the branches as
    a pile of names.\nThe common-pattern section identifies the recurring motion:
    remove legal\npieces, isolate a terminal residue, sharpen the survivor, then test
    it.\nThe branch table records each route's forward residue and later CM role.\nThe
    closure states the actual handoff: a finite-time breakdown claim must\ncarry one
    of these terminal objects, and the main proof tests that object\nthrough Pack,
    Part, and Field.\n\\end{enumerate}\n\n\\subsection{Expanded Branch Work Packets}\n\nThe
    following packets are the reader-facing expansion of the contract above.\nEach
    packet says what the route was trying to buy for a positive smoothness\nproof,
    what calculation made that purchase look available, why the purchase\ndid not
    go through, and what object the CM proof inherits.\n\n\\subsubsection{Four-body
    circuit.}\n\nThe four-body circuit was the first complete attempt to make the
    positive\nsmoothness route pay its own bills.\nIt had four bodies.\nThe first
    body was tail control.\nThe second body was a controlling quantity \\(Q(t)\\)
    built from energy and\nenstrophy.\nThe third body was compactness, which would
    turn controlled approximations into\nan exact Navier--Stokes object.\nThe fourth
    body was derivative recovery on that exact object.\n\nThe intended motion was
    circular in the useful sense.\nTail control would keep high frequencies from carrying
    uncontrolled derivative\nmass.\nThat would make \\(Q(t)\\) finite on the time
    interval under study.\nThe \\(Q(t)\\) bound would give enough compactness to select
    an exact terminal\nobject.\nThe exact terminal object would then recover the derivative
    bound needed to\nrestart the high-frequency tail estimate.\nIf all four payments
    were available on the periodic surface, the proof would\nclose by continuation.\n\nThe
    first body starts from the spectral energy balance.  Write \\(E(k,t)\\) for\nthe
    energy density at frequency \\(k\\), and write \\(T(k,t)\\) for the nonlinear\ntransfer
    into that shell.  The model identity has the form\n\\[\n  \\partial_t E(k,t)=T(k,t)-2\\nu
    k^2E(k,t).\n\\]\nThe viscous term has the right sign and the right frequency weight.\nA
    direct proof would need \\(T(k,t)\\) to be weaker than that dissipation on the\nbad
    tail, or at least weak enough after summing over the active scales.\nThat is the
    scale payment.\nIt asks the equation to turn viscosity into a summable derivative
    tail.\n\nThe second body asks the same question in physical-space energy language.\nLet\n\\[\n
    \ Y(t)=\\frac12\\|\\nabla u(t)\\|_2^2 .\n\\]\nFor a smooth solution one obtains
    the enstrophy identity\n\\[\n  Y'(t)+\\nu\\|\\Delta u(t)\\|_2^2\n
    \   = \\int_{\\mathbb T^3}(u\\cdot\\nabla)u\\cdot\\Delta u\\,dx .\n\\]\nThe left
    side is the desired derivative payment.\nThe right side is the source that has
    to be paid.\nThe standard Sobolev-interpolation route gives a local-theory inequality
    such\nas\n\\[\n  Y'(t)\\le C_\\nu Y(t)^3 .\n\\]\nThat inequality explains local
    persistence, and it also explains the global\ngap.\nThe comparison equation can
    blow up in finite time.\nThe \\(Q(t)\\) body therefore has to do more than repeat
    enstrophy control; it\nhas to find a new payment for the source term.\n\nThe third
    body is compactness.\nIf the tail and source payments were already available,
    compactness would be\nthe natural way to produce the object on which the final
    argument acts.\nOne splits an approximating sequence into low and high modes.\nLow
    modes are finite-dimensional after time regularity is supplied.\nHigh modes are
    small after a real tail estimate.\nThen strong convergence passes the quadratic
    term,\n\\[\n  u_n\\otimes u_n\\longrightarrow u\\otimes u,\n\\]\nand the limit
    remains a solution of the same equation.\nThis body is essential because the Clay
    problem is about the original\nNavier--Stokes solution, not about an auxiliary
    object that merely resembles\nit.\nThe compactness payment is therefore exact-object
    capture.\n\nThe fourth body is derivative recovery.\nOnce the exact object is
    captured, the historical route turns to derivative recovery, the body that tried
    to pay the continuation control missing from the first four-body attempt.\nIn
    the early geometric version of the route, the hoped-for drain looked like a\npositive
    curvature or deformation term in a gradient evolution law,\n\\[\n  \\partial_t|\\nabla
    u|^2\n    = -\\mathcal D(\\nabla u) + \\nu\\Delta |\\nabla u|^2\n      + \\mathcal
    N(\\nabla u),\n\\]\nwhere \\(\\mathcal D\\) would be a same-surface drain and
    \\(\\mathcal N\\) would be a\ncontrolled nonlinear remainder.\nThe periodic problem
    supplies viscosity and pressure coupling.\nIt does not automatically supply a
    positive geometric drain strong enough to\nclose this body.\nThe fourth payment
    is therefore a same-surface derivative recovery theorem.\n\nThe circuit fails
    because each body spends a theorem that another body was\nsupposed to earn.\nTail
    control needs the nonlinear source to be paid.\nThe \\(Q(t)\\) body needs a source
    estimate stronger than the local enstrophy\ncomparison.\nCompactness needs tail
    and source control before it can pass the quadratic\nterm cleanly.\nDerivative
    recovery needs the exact object and a same-surface drain.\nNo body is meaningless,
    and no body is a completed global proof.\nThe attempted loop reveals one obstruction
    packet:\n\\[\n  \\text{tail payment}\n  \\quad+\\quad\n  \\text{source payment}\n
    \ \\quad+\\quad\n  \\text{exact-object capture}\n  \\quad+\\quad\n  \\text{same-surface
    derivative recovery}.\n\\]\n\n\\paragraph{Four-body debt lemma.}\nSuppose a positive
    smoothness proof uses the four-body circuit above.\nThen the proof has to provide
    four distinct payments on the same periodic\nNavier--Stokes branch: a summable
    high-frequency tail estimate, a source\npayment strong enough to prevent the enstrophy
    comparison from becoming the\nonly available control, compactness that captures
    the same solution object, and\nderivative recovery on that same object.\nIf one
    payment is absent, the circuit leaves a terminal residue instead of a\nglobal
    continuation theorem.\n\n\\paragraph{Proof.}\nThe tail estimate is needed before
    the high modes can be treated as small.\nThe source payment is needed before the
    derivative energy can be continued by\nan ordinary differential comparison.\nThe
    compactness step is needed before the limiting object can be charged as the\nsame
    Navier--Stokes branch.\nThe recovery step is needed before the argument can return
    from the captured\nobject to the derivative bounds required by classical continuation.\nRemoving
    any one of these payments breaks the loop at the point where that\npayment is
    spent.\nThe remaining object is then a residue of the failed positive route.\n\n\\paragraph{CM
    handoff.}\nThe class-membership proof inherits the four-body failure as a discipline
    for\nterminal witnesses.\nA terminal breakdown claim cannot be accepted merely
    because it names tail\ngrowth, source concentration, a compactness limit, or a
    geometric drain.\nIt has to present the same Navier--Stokes object \\(Q\\).\nThe
    paper then asks the Pack-first questions.\nDoes the object still have a positive
    packet?\nDoes the same pressure-viscosity equation still act on that packet?\nDoes
    the branch still have a coherent field on a positive scale?\nThe old four-body
    circuit explains why those are the right questions.\nThey are the four old payments
    rewritten as membership tests on the selected\nterminal object.\n\n\\paragraph{Scale
    barrier.}\nThe scale route tried to turn the sentence ``viscosity wins at small
    scales''\ninto a summable derivative estimate.\nThe useful calculation starts
    from the spectral balance\n\\[\n  \\partial_tE(k,t)=T(k,t)-2\\nu k^2E(k,t)\n\\]\non
    the zero-force branch.\nIf the nonlinear transfer \\(T(k,t)\\) decayed fast enough,
    then above a critical\nscale the viscous term would dominate and the derivative
    tail\n\\(\\int k^2E(k,t)\\,dk\\) would stay finite.\nThat is a legitimate proof
    dream because it identifies an exact payment:\nhigh-frequency transfer must be
    weaker than viscous loss.\nThe failure is that the energy law gives an integrated
    dissipation budget, not\na pointwise cascade law with the needed exponent.\nThe
    residue is therefore not vague turbulence language.\nIt is a precise high-frequency
    nonlinear transfer packet.\nIn the later paper this packet reappears as lifted-band
    leakage, lower-shell\ngain, cumulative tail stress, and scale memory.\nIt enters
    CM only after a selected terminal object carries the tail record and\nthen loses
    Pack, Part, or Field.\n\n\\paragraph{\\(Q(t)\\) and enstrophy.}\nThe \\(Q(t)\\)
    route tried to make kinetic energy carry one more derivative.\nThe kinetic half
    is exact and harmless, but differentiating enstrophy exposes\nthe source:\n\\[\n
    \ \\frac{dY}{dt}+\\nu Z=\\int_{\\mathbb T^3}(u\\cdot\\nabla)u\\cdot\\Delta u\\,dx
    .\n\\]\nSobolev and interpolation estimate the right side by a power of\n\\(\\|\\nabla
    u\\|_2\\) and \\(\\|\\Delta u\\|_2\\), after which Young absorption leaves\n\\[\n
    \ \\frac{dY}{dt}\\le C_\\nu Y^3 .\n\\]\nThat inequality is enough for local theory
    and still permits finite-time\ngrowth.\nSo the route does not fail because the
    calculation is sloppy.\nIt fails because the nonlinear vortex-stretching source
    is exactly where the\nglobal theorem would have to be paid.\nThe old missing source
    later returns as terminal native source, source reserve,\nBASAC atom, pressure-sustain
    residue, and Duhamel response.\nThe CM use is disciplined: a source object is
    not an exit because it is\ndangerous; it is proof material only when the selected
    terminal witness loses a\nclass face.\n\n\\paragraph{Compactness.}\nThe compactness
    body tried to turn control of approximating packets into an exact solution\nobject.\nThe route
    is mathematically honest.\nSplit an approximating sequence into low and high frequencies.\nThe
    low-frequency part is finite-dimensional after time compactness is\nsupplied,
    while the high-frequency part is small if the spectral tail is small.\nStrong
    local \\(L^2\\) convergence then passes the quadratic term\n\\[\n  u_n\\otimes
    u_n\\to u\\otimes u .\n\\]\nThis is why compactness belongs in the record: it
    tells the proof how a\ncontrolled packet becomes the same Navier--Stokes object
    rather than a loose\nlimit.\nThe failure is that compactness is downstream.\nIt
    spends the scale tail and enstrophy controls; it cannot manufacture them.\nWhen
    the PDF later speaks of packet capture, the reader should hear this\nlesson.\nCapture
    is useful only after the packet is already on the correct surface.\nIn CM, this
    becomes the rule that support estimates do not enter the proof\nuntil they identify
    the same terminal witness \\(Q\\).\n\n\\paragraph{Curvature or gradient recovery.}\nThe
    curvature route tried to recover derivative control from geometry.\nOn a curved
    carrier, the branch uses a model gradient evolution with a Ricci term:\n\\[\n  \\partial_t|\\nabla
    u|^2=-\\mathrm{Ric}(g)(\\nabla u,\\nabla u)+\\nu\\Delta_g|\\nabla u|^2+C|\\nabla
    u|^3 .\n\\]\nA positive Ricci contribution would be exactly the missing derivative
    drain.\nThat is why this branch looked powerful.\nIt was trying to pay the fourth
    body of the loop and return control to the\nscale barrier.\nThe failure is not
    cosmetic.\nThe Clay problem here is periodic and flat.\nA positive-Ricci theorem
    on a different carrier is not the same-surface\nperiodic theorem the proof needs.\nThe
    survivor is a demand for a replacement theorem inside the actual\nNavier--Stokes
    geometry: deformation-gradient control, commutator drain, or\nanother same-surface
    mechanism.\nUntil that theorem exists, the curvature branch is support and motivation,
    not\na proof argument.\n\n\\paragraph{Modernized four-body packet.}\nThe modern
    packet keeps the four old jobs and replaces their vague names by\nthe objects
    that actually survived.\nScale control becomes tail leakage.\nThe \\(Q(t)\\) source
    becomes source reserve.\nCompactness becomes terminal packet capture.\nCurvature
    becomes deformation geometry and commutator control.\nThe progress is real because
    it stops treating each new vocabulary item as a\nnew proof.\nThe same obstruction
    is being read through several instruments: dyadic tail,\nvelocity tower, moving
    coordinates, and terminal source account.\nThe failure is also clearer.\nThe packet
    still needs a same-surface contraction or absorption law strong\nenough to make
    the survivor pay for itself.\nWithout that law, the packet is a sharper description
    of debt, not a discharge\nof debt.\nThe CM proof uses this section to police vocabulary.\nIf
    a later object is merely a modern name for the same unpaid survivor, the\npaper
    must carry it as residue until Pack, Part, or Field makes the proof\ndecision.\n\n\\paragraph{Two
    survivor families.}\nAfter the modern four-body pass, the residue splits into
    two large families.\nThe lower-prefix family reads the obstruction as memory from
    scales below the\nactive shell: affine quotient modes, Volterra primitives, lower-shell
    strain,\nand scale-memory terms.\nThe upper-tail family reads it as leakage from
    separated shells above or around\nthe active band: gap kernels, lifted-band packets,
    upper boundary effects, and\nkernelized tail dissipation.\nThe key point is that
    both families descend from the same old scale bill, but\nthey do not currently
    pay one another.\nThe missing theorem would show that lower-prefix memory creates
    a coercive\ndrain, that upper-tail leakage is blocked by a kernelized barrier,
    or that the\ntwo are one terminal survivor in different coordinates.\nUntil then,
    the paper must keep them separate.\nIn CM terms, neither family is automatically
    an exit.\nEach is a witness candidate waiting for a selected terminal packet and
    a first\nface failure.\n\n\\paragraph{Kernelized lifted band.}\nThe lifted-band
    route attacks a precise shell region, \\(N+M<k<j-4\\), where\noff-diagonal interactions
    have a gap.\nThe calculation gains a real kernel factor \\(2^{-(j-k)}\\).\nThat
    gain matters because it says separated shells do not interact with full\nstrength.\nAfter
    Young absorption, however, the lower shell carries a remainder with an\nextra
    \\(2^k\\) beyond the available energy surface.\nThe route therefore gets closer
    to the desired estimate but stops at an unpaid\nhalf derivative.\nThis is the
    kind of failure the PDF must preserve carefully.\nThe branch is not worthless,
    and it is not complete.\nIt gives an exact leftover object: an intermediate lower-shell
    gain target.\nIn the CM proof, that object can support Field or tower readout
    only after it\nbelongs to a selected terminal witness.\nBefore that admission,
    it is a forward-positive survivor.\n\n\\paragraph{Shell gain and half-derivative
    target.}\nThe shell-gain branch tries to pay the extra lower-shell factor left
    by the\nlifted-band calculation.\nIt normalizes a low-frequency strain quantity
    against the viscous scale\n\\(\\nu2^{2j}\\) and asks the active high shell to
    see a small coefficient.\nThe calculation has the right scaling: the high shell
    dissipates on a\n\\(2^{-2j}\\) time scale, so lower-shell strain has to be measured
    against the\nsame parabolic clock.\nThe stopping point is the difference between
    an integrated square budget and a\npointwise active-window bound.\nThe installed
    estimates say that strain is affordable on average.\nThey do not say that every
    active window sees a small enough coefficient to\nabsorb growth.\nThe survivor
    is dynamic low-frequency strain suppression.\nIn the PDF this branch should teach
    the reader why an endpoint half-derivative\ngain is a theorem target, not a rhetorical
    strengthening of viscosity.\n\n\\paragraph{Cumulative tail stress and LPAS.}\nCumulative
    tail stress tries to stop chasing one shell at a time.\nIt packages the lower
    prefix and active shell into a whole-tail object, whose\ndyadic shadow is the
    lower-prefix active square \\(P_j^\\downarrow2^{-j}D_j^2\\).\nThe attractive feature
    is that this object sees the whole lower-scale history\nthat one-shell estimates
    miss.\nThe failure is orientation.\nMany available estimates are upper-tail estimates;
    they control what happens\nabove the active index.\nLPAS asks the opposite question:
    how much lower-prefix energy is multiplying\nthe active square at the bad shell.\nA
    crude bound by total dissipation throws away the active-shell structure and\ndoes
    not close the absorption.\nThe residue is active-square debt.\nIt later reappears
    as source reserve and lower-memory pressure.\nFor CM, LPAS is support unless the
    same terminal packet carries the active\nsquare and loses one of the three class
    requirements.\n\n\\paragraph{Volterra and lower-triangular memory.}\nThe Volterra
    route recognizes that lower-prefix effects are ordered in scale.\nThey are not
    arbitrary bilinear noise.\nIn logarithmic scale the lower prefix becomes a triangular
    memory operator:\nearlier or lower scales feed the active shell in one direction.\nThat
    observation lets the proof isolate affine moments such as \\(M_0\\) and\n\\(M_1\\).\nThis
    is a real reduction.\nA broad lower-prefix obstruction becomes a small quotient
    mode.\nThe failure is that the quotient is not automatically controlled.\nThe
    weight can degenerate, and the installed estimates do not force the affine\nmoments
    to vanish on the same surface.\nThe survivor is a weighted quotient mode carried
    by the terminal branch.\nThe CM proof uses this as a warning against cheap bad-object
    language.\nAn affine quotient is not class exit until the terminal object has
    been tested\nand the first lost face has been identified.\n\n\\paragraph{Signed
    descent.}\nSigned descent tries to preserve cancellation before the proof takes
    absolute\nvalues.\nThe calculation keeps a signed scale derivative visible and
    tries to telescope\nthe dangerous term, so that a positive majorant never has
    to be paid.\nThis is the right instinct: many failed estimates become impossible
    only after\nthe proof has destroyed sign too early.\nThe stopping point is the
    strain geometry.\nThe leading form has no fixed sign, and active wave packets
    can align with\nexpanding eigendirections of the low shell.\nOne-sided weights
    do not by themselves prevent that alignment.\nThe survivor is therefore a missing
    decorrelation theorem, a signed-measure\ncancellation theorem, or a nonpositive
    divergence identity.\nWhen those are absent, the proof returns to the active-square/source-reserve\nwall.\nThe
    PDF must show this return so the reader does not mistake signed notation\nfor
    signed control.\n\n\\paragraph{Persistent quotient kill attempts.}\nThe quotient-kill
    attempts ask whether the affine mode left by Volterra memory\ncan be destroyed
    directly.\nThe first route sends the problem back to CTS/LPAS, which means it
    has not\nescaped the lower-prefix active-square wall.\nThe second route invokes
    a far-corona theorem strongly enough to be circular:\nit uses the kind of tail
    control the branch was supposed to produce.\nThe third route isolates affine moments
    and tries to spend a signed derivative,\nbut it remains one derivative short.\nThe
    important point for the reader is that these are not three independent\nfailures.\nThey
    are three tests of the same survivor.\nBoundary, spill, and edge terms all carry
    versions of the affine mass.\nThe CM role is terminal quotient evidence after
    witness admission.\nBefore that admission, the quotient is proof pressure, not
    a completed exit.\n\n\\paragraph{Projected flow, TPS, and SG.4.}\nThe projected-flow
    and TPS branch tries to put the defect into an equation\nwhere parabolic coercivity
    or two-point geometry can see it.\nThe desired projected-flow estimate has the
    form\n\\[\n  |N_1|+|N_2|\\le \\epsilon\\,\\mathrm{dissipation}+C_\\epsilon\\Psi(E_D).\n\\]\nThe
    two-point strain side has a similar hope: selected pair geometry should\nproduce
    the good lower envelope needed by SG.4.\nThe failure is selector production.\nA
    norm can bound the size of a defect while losing exactly the information the\nselector
    needs: sign, direction, membership in the selected pair family, and\none-sided
    growth.\nThat is why SG.4 cannot be promoted to route authority merely because
    it names\na sharp downstream obstruction.\nIts CM role is support or readout pressure
    until it lands the exact same\nNavier--Stokes packet in Pack, Part, or Field.\n\n\\paragraph{Source-wall
    deletion cycle.}\nThe source-wall deletion cycle is the old \\(Q(t)\\) obstruction
    made terminal.\nEach phase tries to delete or pay the nonlinear source.\nThe recurring
    pattern is stable: find a source pulse, charge it to a native\nledger, remove
    legal or inherited pieces, and discover a sharper survivor.\nThis is why the PDF
    cannot present source work as a single failed estimate.\nThe source wall is a
    machine for producing terminal objects.\nSometimes the object is a reserve.\nSometimes
    it is a zero-thickness atom.\nSometimes pressure separates off a residue that
    is not native source.\nThe stopping point is that forward deletion keeps reaching
    one more terminal\nsource object rather than a global positive bound.\nThe CM
    route uses this by admitting the terminal source object to the witness\ntest.\nIt
    asks whether the object still has Pack, Part, and Field, not whether the old\npositive
    deletion theorem has magically been proved.\n\n\\paragraph{BASAC and terminal
    atom.}\nBASAC tries to control source mass at the terminal layer.\nThe model density
    \\(g_m=m1_{(-1/m,0]}\\) explains the obstruction in one line:\nthe \\(L^1\\) mass
    stays bounded while every \\(L^p\\), \\(p>1\\), blows.\nSo finite source mass
    can converge to a terminal time atom.\nThe branch fails at uniform integrability,
    reverse Holder residence, Morrey\nanti-atom control, or a Liouville mechanism
    strong enough to rule out the\natom.\nThe survivor is a zero-thickness native
    source residue.\nThis is exactly the kind of object that makes honesty essential.\nCalling
    it impossible would import the missing anti-atom theorem.\nCalling it an exit
    before the CM face test would skip the CM face test.\nThe paper must instead say what the
    object is, why the positive deletion route\nstopped there, and how CM tests it
    as zero-radius Pack/Part support after\nterminal admission.\n\n\\paragraph{Pressure
    sustain and pure pressure residue.}\nThe pressure branch asks whether pressure
    debt can be reduced to native source\ndebt.\nThe pressure equation is elliptic
    in space and tied to quadratic gradients, so\nit is tempting to treat pressure
    as a source shadow.\nThe failure is same-fluid ancestry.\nCalderon--Zygmund structure
    acts on spatial slices and tensor components; it\ndoes not automatically say that
    the pressure lobe belongs to the same native\nsource current.\nThe branch therefore
    splits pressure into a source-carried part and a pure\npressure residue orthogonal
    to native source.\nThe missing theorem is either a pressure-source tether or a
    pure-pressure\nLiouville exclusion.\nUntil one exists, pressure sustain is a diagnostic
    survivor.\nIts CM role is usually Field-side support after pressure exits are
    isolated,\nbecause the issue is coherent readout and participation of the pressure
    lobe\ninside the selected same-solution packet.\n\n\\paragraph{Angular saturation.}\nAngular
    saturation tries to use cancellation in the pressure Hessian.\nThe trace can cancel
    over directions, and tensor structure can balance lobes\nglobally.\nThe selected
    terminal ledger, however, may keep one positive lobe with its own\nweights, cutoffs,
    and family membership.\nThe negative partners needed for cancellation may diffuse,
    fall below\nthreshold, sit outside the selected family, or arrive with incompatible\nweights.\nThat
    is the stopping point.\nGlobal tensor cancellation does not automatically pay
    the selected positive\nbill.\nThe survivor is pressure-lobe debt together with
    a partner-legality theorem\nstack: partner saturation, pair-weight defect charge,
    and collar legality.\nIn CM language this branch is not a new primitive face.\nIt
    is pressure-side support for either a source tether, pure pressure\nLiouville,
    or a Field failure once the selected pressure object is held on the\nsame witness
    record.\n\n\\paragraph{Transported boundary and no incoming flux.}\nTransported
    cylinders are the right geometry for same-fluid ancestry.\nThey remove artificial
    fixed-frame boundary inflow, so the proof no longer\ncharges source birth to a
    coordinate artifact.\nThe hoped-for theorem says that incoming positive source
    flux through the\ntransported boundary tends to zero.\nThe failure is that boundary
    control does not prevent interior time-face\nconcentration.\nA source atom can
    be born inside the transported cylinder as the terminal layer\nshrinks.\nThe local
    energy balance then still has a terminal source term to pay.\nThe missing theorem
    is a combined no-incoming-flux and interior-production\nexclusion statement.\nThe
    CM role depends on what survives.\nNo positive carrier points to Pack.\nBroken
    same-equation participation points to Part.\nA retained carrier with no coherent
    positive-scale readout points to Field.\nThe PDF needs this split because no-flux
    alone is not the proof.\n\n\\paragraph{Quantized parent and Zeno ancestry.}\nThe
    Zeno route tries to make infinite same-fluid refill spend a finite resource.\nIf
    each refill edge costs at least \\(\\eta>0\\), infinitely many refills would\ncontradict
    finite original data.\nThe proof tries several resources: radius, heat-time depth,
    energy,\ndissipation, same-fluid labels, and donor balance.\nEach one fails for
    a precise reason.\nRadii can shrink.\nHeat times can be summable.\nEnergy and
    dissipation can split over infinitely many descendants.\nLabels preserve ancestry
    without creating a decreasing finite alphabet.\nDonor balance telescopes over
    finite truncations and leaves terminal leaves.\nThe survivor is terminal zero-radius
    Zeno ancestry.\nIn CM, Zeno is not a fourth face.\nA pure zero-radius endpoint
    is Pack-side failure unless a positive-scale\ncarrier is separately retained;
    retained variants must still be routed through\nPart or Field.\n\n\\paragraph{Local
    energy and elliptic time smearing.}\nThe local-energy branch asks whether terminal
    source atoms can be excluded by\nthe local energy inequality.\nThe inequality
    gives compactness and signed terminal defect measures, but it\ndoes not by itself
    remove the selected positive native source component.\nThe elliptic branch asks
    whether pressure or Calderon--Zygmund spreading smears\nthe atom.\nThe obstruction
    is that spatial elliptic operators act one time slice at a\ntime.\nA density \\(m1_{(-1/m,0]}(s)\\rho(y)\\)
    remains concentrated in time after a\nspatial singular integral changes \\(\\rho(y)\\).\nThus
    local energy and elliptic pressure are real support tools, but neither\none supplies
    the missing time anti-concentration theorem.\nThe residue is trace, flux, or temporal
    spreading debt.\nThe CM proof uses this as source-wall support, not as a finished
    deletion of\nterminal atoms.\n\n\\paragraph{All reduced source-wall routes.}\nThe
    all-routes pass is an honesty inventory.\nIt names the finite set of supplier
    doors still available after source-wall\nreduction: uniform temporal source integrability,
    positive source Carleson or\nremainder depletion, parent quantization or minimal
    ancestry compactness,\npressure-source tethering, pure-pressure Liouville, and
    terminal pressure-strain\nlegality.\nThe important content is negative as well
    as positive.\nNone of these is installed unconditionally from the original data
    inside this\npaper.\nTherefore none may be silently used as if it has paid the
    source wall.\nThe residue is the shared terminal zero-thickness source concentration
    plus\npressure-side variants.\nThe CM role is to quarantine supplier claims until
    they either prove a real\npositive theorem or attach a selected terminal object
    to Pack, Part, or Field.\nThis section is one of the places where PDF honesty
    matters most.\n\n\\paragraph{Source reserve birth.}\nThe source-reserve branch
    chooses the first terminal same-fluid window where\ndonor-square reserve is born.\nMinimality
    is supposed to contract inherited past reserve, while legal and\nchild residual
    terms are routed to existing ledgers.\nThe calculation leaves a first-created
    native reserve on the retained ledger.\nThat survivor is sharper than the old
    source pulse because it is not merely\nmass; it is positive-scale donor-square
    reserve created on the same terminal\nwindow.\nThe direct proof stops because
    the installed ledgers do not pay this first\ncreation.\nThe branch therefore cannot
    be called deleted.\nIt is supplier-quarantined until a same-ledger payment theorem
    is proved.\nAlternatively, once admitted to the CM test, it can support a first
    face\nfailure.\nThe PDF has to preserve that fork: payment theorem on the positive
    side,\nface failure on the contrapositive side.\n\n\\paragraph{Zero-moment signed
    pair.}\nThe zero-moment branch shows why signed cancellation is not the same as\nreserve
    disappearance.\nOne can split a current as \\(J=J_+-J_-\\), arrange equal first
    moments, and\nstill retain order-one positive and negative packets on the same
    ledger.\nThe square reserve sees mass even when the signed moment cancels.\nMost
    easy cases route away: wrong carrier, shrinking terminal windows, or\nbroken participation.\nThe
    hard case is same retained ledger, positive scale, order-one reserve, and\nzero
    first moment on heat subwindows.\nThe missing theorem is a same-ledger signed-pair
    no-free-sink theorem or a\ntwo-tower donor depletion theorem.\nUntil then, zero
    moment is not deletion.\nIn CM it is retained reserve support and can become proof-bearing
    only after a\nfirst Pack, Part, or Field face failure is derived.\n\n\\paragraph{Public
    \\(L^3\\), Duhamel, and native source.}\nThe \\(L^3\\) branch is different from
    the source deletion branches because it\nis a translator.\nThe public critical
    criterion gives terminal critical mass.\nDuhamel splits the localized solution
    into heat ancestry and nonlinear\nresponse:\nthe heat side checks where the packet
    came from, and the nonlinear side is\nlocalized by adjoint heat/Leray response
    into native-source machinery.\nThe stopping point is not that the local translator
    fails.\nThe condition is that the terminal \\(L^3\\) mass must already live on
    the same\nwitness ledger.\nOnce it does, the installed local translator routes
    the mass into Pack, Part,\nlegal material, or Field-facing readout.\nThis branch
    is therefore not a fresh positive proof of smoothness.\nIt is a CM-facing translation
    rule for a selected terminal concentration.\nThe PDF should make that role explicit
    so the reader does not confuse public\ncritical theory with the source-wall deletion
    program.\n\n\\paragraph{Terminal Leray saturation.}\nTerminal Leray saturation
    sits beside the \\(L^3\\) translator.\nAfter legal commutator removal, the retained
    local source work is compared to a\nsaturated square.\nWriting \\(\\widetilde
    w_j=w_j+\\delta_j\\) isolates a signed-partner defect.\nInside the local \\(L^3\\)
    family, the signed-partner no-free-defect theorem pays\nthat defect, so the local
    translator can close its own branch.\nThe independent pressure-Leray route remains
    open.\nA pressure lobe still needs a transported source or donor-edge theorem
    before\nit can be claimed as native source work.\nThe survivor is pressure-lobe
    tether debt.\nThe CM role is narrow: terminal Leray saturation closes what belongs
    to the\nlocal \\(L^3\\) translator, while pressure-Leray material remains support
    until\nit lands a selected same-solution packet or proves its tether.\n\n\\paragraph{Critical
    \\(H^{1/2}\\).}\nThe \\(H^{1/2}\\) branch is a conditional critical translator.\nIt
    sees both size and frequency placement, so it can split terminal behavior\nmore
    finely than \\(L^3\\).\nThe amplitude reading routes toward the installed local
    \\(L^3\\) translator.\nThe pure oscillatory reading is different: amplitude remains
    controlled while\nfrequency organization destroys coherent readout.\nWith Pack
    and Part retained, that pure oscillatory branch should be Field\nfailure.\nThe
    stopping point is that the necessary lemmas are not installed:\nsame-ledger \\(H^{1/2}\\)
    extraction, oscillation-to-Field exit, and amplitude to\n\\(L^3\\) translation.\nThe
    residue is a conditional \\(H^{1/2}\\) field defect.\nThe PDF must mark it conditional.\nIt
    can guide the reader toward a possible Field landing, but it cannot be used\nas
    completed class exit.\n\n\\paragraph{Synthesis.}\nThe final synthesis is not a
    conclusion by mood.\nIt is the place where the reader should see the common form
    of the whole\nfailure record.\nEach positive branch removes the local or legal
    pieces it can remove, isolates\nan edge, collar, source, reserve, quotient, pressure,
    Zeno, or critical packet,\nand then discovers that the smaller packet still needs
    a payment theorem.\nThe CM proof does not deny those packets.\nIt changes the
    question asked of them.\nDoes the selected terminal object still carry a positive
    same-solution packet?\nDoes the Navier--Stokes law still participate on that packet?\nDoes
    the resulting field have a coherent positive-scale readout?\nThe branch table
    and closure must leave the reader with that exact handoff:\nthe failure history
    identifies what a finite-time breakdown claim would have to\ncarry; the main proof
    tests that carried object through Pack, Part, and Field.\n\n\\subsection{How The
    Record Enters The Proof}\n\nThe failure record is not an appendix of anecdotes.\nIt
    is the back half of the reader's route through the proof.\nThe main text has already
    stated the three requirements that define the working\nclass: a positive material
    packet, same-equation participation on that packet,\nand coherent positive-scale
    field readout.\nThose requirements are abstract until the reader sees what a terminal\nbreakdown
    attempt would actually carry.\nThe branch record supplies that missing concreteness.\nIt
    shows the reader the objects produced by honest positive proof attempts:\ntail
    packets, source atoms, affine quotient modes, pressure lobes, Zeno\nancestry,
    signed-pair reserve, critical Duhamel response, and conditional\n\\(H^{1/2}\\)
    oscillation.\nThe paper then asks the same question of each object.\nDoes this
    object still give the same Navier--Stokes branch, or has it lost the\nstructure
    needed to count as that branch?\nThat is why the record cannot be replaced by
    a short list of route names.\nThe reader has to see the mathematical birth of
    each object before the CM test\ncan feel like a proof \n% ... source excerpt truncated
    for packet size ...\n"
