    \section{Source-Field Reader Appendix}

    This appendix reconstructs recovered Navier-Stokes source work as reader-facing mathematical material. It keeps the parts that explain a definition, reduction, estimate, obstruction, failed attempt that changes the proof burden, or CM witness logic for Pack, Part, Field, and readout.

    \subsection*{Appendix Status Map}

    This appendix is controlled by the main proof's same-solution terminal test. A subsection is proof-bearing only where it names the same terminal record and derives a Pack, Part, or Field face, or where the main proof explicitly cites it as the source of that payment. A subsection is support-only where it explains a definition, estimate, source route, reader payment, or branch mechanism without itself deriving a terminal face. A subsection is historical where it records an earlier attempt, an earlier blocker, or a target correction that led to the current route.

    \begin{center}
    \begin{tabular}{L{0.24\textwidth} L{0.22\textwidth} L{0.42\textwidth}}
    \textbf{Material} & \textbf{Role in proof} & \textbf{Reader use} \\
    Original source stack and framework notes & support-only & Explain where the route came from; they do not replace the same-solution terminal test. \\
    Direct Pack, Part, Field, and finite-disjunction rows & proof-bearing when tied to the same terminal record & Supply branch-level face landings for the pass-or-exit proof. \\
    Failed positive smoothness attempts & historical/support-only & Show why the forward estimate route did not pay the Clay burden and what residue entered the CM test. \\
    Earlier Clay-readiness and blocker checks & historical unless used by the main proof & Preserve the development history; they are not governing proof blockers by themselves. \\
    Reader/export notes & support-only & Explain presentation context without adding a fourth terminal branch. \\
    \end{tabular}
    \end{center}

    When an older subsection says that a route did not prove the Clay problem, that sentence is read in its historical local context. The current governing question is the one in the main proof: the alleged same-solution terminal record either passes Pack, Part, and Field and continues, or it fails first at one of those faces and is not an in-class nonsmooth terminal member of the original solution.

    \subsection{Canonical Source Stack And Original Framework}

    The older source stack is part of the record because it fixes what later
    source-field work was trying to preserve. It is not an independent proof of the
    Clay conclusion. Its reader-facing use is more modest: it tells the manuscript
    which route features are source-fidelity requirements and which later features
    are replacements or upgrades.

    The original framework has four main principles. The monotone functional
    \(Q(t)\) is one of those principles; it is not anonymous energy bookkeeping. The
    compactness bridge is an Aubin--Lions-type strong-convergence claim in
    \(L^2\), but the source version relies on spectral decay together with bounded
    energy, not on an ordinary Sobolev embedding. The gradient bridge in the source
    family is curvature-based. Later Euclidean gradient-transfer packages can be
    useful, but they are theorem replacements unless they explicitly recover the
    same curvature role.

    This is why the appendix keeps the source stack separate from the main proof.
    The main proof may use later Euclidean or CM replacements, but the page must not
    pretend that those replacements were already present in the original source
    framework. A source-faithful use of this material keeps \(Q(t)\), the
    non-Sobolev compactness claim, and the curvature-based gradient bridge visible.
    A later theorem may outrank the old source route only after it pays the same
    same-solution terminal-test cost used in the main proof.


    \subsection{A1a Full-Data Euclidean Lift Coverage}

    The full-data Euclidean lift is a downstream export check. Before this check is
    meaningful, a separate CM-to-Euclidean splice has already fixed the Euclidean
    carrier/readout surface, the admissible exported datum class
