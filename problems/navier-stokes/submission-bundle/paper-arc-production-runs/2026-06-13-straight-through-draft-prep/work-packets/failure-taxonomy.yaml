    \section{Compressing The Map To Pack, Part, And Field}

    The branch map now compresses to the three faces of the selected terminal record.  The record is \(Q\).  The class object being tested is \(\Owork\), the working Navier--Stokes object determined by \(u_0\), \(\nu\), \(u\), and \(p\).  The test keeps the original datum \(u_0\), fixed viscosity \(\nu\), velocity-pressure pair \((u,p)\), pressure law, incompressibility constraint, and transported carrier fixed while it asks what survives at the terminal end.

    These tests are written as
    \[
      \Pack_Q,\qquad
      \Part_{N,Q},\qquad
      \Field_{N,r,Q}.
    \]
    Here \(\Pack_Q\) says that \(Q\) has a positive same-fluid carrier.  The statement \(\Part_{N,Q}\) says that the same Navier--Stokes pressure-viscosity-incompressibility law still acts through the derivative tower up to depth \(N\).  The statement \(\Field_{N,r,Q}\) says that the retained readings form one coherent field on some positive scale \(r\).

    The order matters.  A missing body is the first failure and is recorded before any equation or field question is asked.  A retained body with broken same-law participation has lost the equation that would make the derivative tower a Navier--Stokes tower.  A retained body with retained participation reaches the field question, where it can still lose every positive scale of coherent velocity readout.  The terminal alternatives are
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    These alternatives are the proof discipline for the rest of the paper.  A branch may describe a pulse, reserve, jump, weak limit, shear sheet, or Zeno source.  The manuscript counts it as a class-exit payment only after it names the same-solution record under test and derives one displayed alternative as the first failure.

    The annular endpoint shows the order in use.  The point \(r=0\) is too small to be the carrier by itself.  The alleged singularity is witnessed by positive-radius annular fields shrinking toward that point.  Once those annular fields are selected as the terminal record, carrier has been paid for that test.  The remaining nonsmooth annular exit is Part or Field.  Pack remains available for no-carrier or pre-admission failure.
  truncated: false
