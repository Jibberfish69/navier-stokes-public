    text: |+
      \subsection{Endpoint Selector.TTU General Test}

      The general test is the model obstruction behind the preceding facewise tests.
      The endpoint definitions give threshold-dependent witnesses:

      \[
      \Gamma_{pack,Q}(t)=\sup_{a\in A_Q}\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\},
      \]

      \[
      \mathfrak A_{N,Q}(t)=\sup_{x\in Q_t}\sum_{k=0}^{N}(|U_k(x,t)|+|K_k(x,t)|),
      \]

      \[
      \forall M\ \exists (a_M,t_M):\quad gauge(a_M,t_M)>M.
      \]

      The selector may depend on \(M\).  This supplies a threshold-dependent sequence,
      rather than one fixed finite selector set.

      Let \(A_Q=[0,1]\).  Choose disjoint label neighborhoods \(U_n\) and terminal
      time intervals \(I_n\uparrow T_*\).  Put smooth strain or tower bumps on
      \(U_n\times I_n\) with heights tending to infinity.  The endpoint supremum
      escapes every finite bound, while any fixed finite selector set misses all but
      finitely many of the \(U_n\) after refinement.

      This example shows that a terminal face can occur through moving labels without
      a fixed finite active selector carrying the whole face.

      \[
      A_Q=\{a_1,\dots,a_J\},
      \]

      then the finite selector route closes as recorded in the finite-packet reduction
      note.

      Endpoint Selector.TTU remains open in the bare continuum-label setting.  The
      required replacement is a finite-complexity theorem, a label-modulus theorem, or
      another compactness input that prevents the moving-label pattern above.


