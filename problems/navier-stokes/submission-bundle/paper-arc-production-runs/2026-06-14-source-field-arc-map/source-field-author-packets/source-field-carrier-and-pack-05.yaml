    text: |+
      \subsection{\(E_u\)-to-\(D_u/P\) Conversion Or Additive \(E_u\) Carrier Obstruction}

      The remaining component-selection escape channel for \(\mathrm{Jump}_{avg}\)
      has two possible exits: convert \(E_u\) into the controlled
      \(D_u/P\) charge, or build a genuinely additive \(E_u\) carrier.

      The local energy inequality controls local balances on same-fluid cylinders. It
      relates local velocity energy, dissipation, pressure flux, cutoff errors, and
      transport geometry.  Pack control keeps the cylinder geometry admissible.

      A local velocity-energy packet can persist as a moving terminal packet while
      preserving the global energy record unless a recurrence, decay, or local
      smoothing theorem is added.  The current surfaces record this as the
      moving-packet obstruction.

      A finite upper bound for \(\nu\mathrm{SCF}\) works because dissipation and
      local pressure are finite spacetime Radon measures.  The \(E_u\) term is a
      scale-critical local energy readout tied to time slices and cylinder scales.
      The current surfaces do not provide an additive measure whose bounded-overlap
      window sum equals or controls repeated terminal \(E_u\) threshold packets.

      The current surfaces identify the missing theorem rather than proving it.  A
      successful \(E_u\) theorem would have to give rate-level decay on the same
      separated terminal windows, for example a budget smaller than the threshold
      scale:
      \[
      \mathcal E_u^{sc}(Q_k)\le \varepsilon_k,
      \qquad
      \sum_k\varepsilon_k<\infty.
      \]
      Finite weighted mass is insufficient for that conclusion.  No such rate-level
      theorem is installed for \(E_u\) terminal packets.

      The narrowed route is explicit and still open.  \(\mathrm{Jump}_{avg}\) gives
      an SCF threshold sequence, and \(\nu\mathrm{SCF}\) has an upper bound.  The
      proof still lacks an \(E_u\) conversion or additive \(E_u\) carrier on the same
      terminal window family.


