      \subsection{\(E_u\) Additive Carrier Reduces To Active-Window Amplitude Gain}

      The proposed repair is to add the velocity-energy component \(E_u\) to the
      branch charge used in the \(\mathrm{Jump}_{avg}\) no-escape route.

      Raw finite carriers can control unweighted sums over bounded-overlap windows.
      This is the mechanism behind the installed \(\nu\mathrm{SCF}\) upper estimate.

      The branch contradiction requires more: a terminal scale-normalized upper
      estimate compatible with shrinking active windows.  Schematically, for
      terminal windows \(Q_k=Q_{r_k}(x_k,t_k)\), one needs an estimate of the form
      \[
      \sum_k \mathcal E_u^{sc}(Q_k)\le C,
      \qquad
      \mathcal E_u^{sc}(Q_k)
      :=
      r_k^{-1}\sup_{t\in I_k}\int_{B_{r_k}(x_k)}|u(x,t)|^2\,dx,
      \]
      or an equivalent scale-normalized additive bound on the same separated terminal
      window family.

      For \(E_u\), no additive carrier with this scale-normalized bounded-overlap
      estimate is installed.

      The active-window and Carleson surfaces identify the exact missing ingredient.
      Raw finite mass does not provide the missing scale factor.  To gain it, one
      needs an active-window amplitude gain or a heat-scale source theorem.  Finite
      energy permits concentration on shrinking windows, so the desired estimate
      cannot be obtained from the global energy record alone.

      Adding \(E_u\) to the charge fixes component coverage only formally.  It does
      not produce the scale-normalized upper estimate needed for a contradiction.

      \[
      \text{active-window amplitude gain}
      \]


