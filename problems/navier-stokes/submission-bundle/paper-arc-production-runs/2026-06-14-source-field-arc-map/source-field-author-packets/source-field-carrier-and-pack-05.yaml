      \subsection{Endpoint Selector.TTU Facewise Selector Test}

      The facewise test separates cell selectors from label selectors.  A fixed
      finite cell cover can locate a bad cell by pigeonhole.  A fixed label selector
      is stronger, because the bad material point can keep moving inside that cell.

      \[
      \mathfrak A_{N,Q}(t)
      \]

      If a fixed finite cell cover is already present, pigeonhole gives one cell whose
      cell-supremum tower amplitude is unbounded.  This yields a finite cell selector.

      It does not give a fixed finite label selector.  The high tower point may move
      through infinitely many labels inside that cell.

      \[
      \Gamma_{pack,Q}(t)=\sup_{a\in A_Q}\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\}
      \]

      A fixed finite cell decomposition can carry an unbounded cell-supremum pack
      gauge by pigeonhole.  A fixed finite label selector requires an additional
      theorem.

      Jump means loss of every positive terminal field or SCF-good scale.  With a
      fixed finite cell cover, if every cell retained a positive scale, the minimum
      over finitely many cells would give a positive global scale.  Hence Jump forces
      at least one bad cell.

      This gives a finite cell selector.  It does not give a fixed finite label
      selector because the bad material point can move through a continuum of labels
      inside the bad cell.


