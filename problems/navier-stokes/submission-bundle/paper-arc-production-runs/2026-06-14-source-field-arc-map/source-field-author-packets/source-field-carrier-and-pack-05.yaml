      \subsection{Endpoint Selector.TTU - Tower-Blown Finite Selector Test}

      The tower-blown face says that a finite jet tower becomes unbounded along the
      terminal approach.  The test here is whether that unboundedness gives one fixed
      finite selector, or only a different finite witness at each threshold.

      \[
      \mathfrak A_{N,Q}(t)
      :=
      \sup_{x\in Q_t}\sum_{k=0}^{N}(|U_k(x,t)|+|K_k(x,t)|).
      \]

      \[
      tower\text{-}blown
      \quad\Longleftrightarrow\quad
      \sup_{t<T_*}\mathfrak A_{N,Q}(t)=\infty.
      \]

      \[
      \sum_{k=0}^{N}(|U_k(x_M,t_M)|+|K_k(x_M,t_M)|)>M.
      \]

      If \(x_M=X(a_M,t_M)\) for an active label \(a_M\), then \(a_M\) is a finite
      selector witnessing the threshold \(M\).

      \[
      tower\text{-}blown
      \Longrightarrow
      \forall M>0\ \exists\text{ finite threshold selector carrying amplitude }>M.
      \]

      Endpoint Selector.TTU asks for a fixed finite selector subpacket carrying the
      same endpoint face through the terminal tail.  The threshold selector above may
      depend on \(M\).

      A moving-spike pattern can realize larger and larger tower values at fresh
      active labels or fresh cover cells.  Then every threshold has a finite witness,
      while no single fixed finite selector captures all thresholds.

      The threshold-selector theorem still does not prove the fixed-selector theorem.

      \[
      tower\text{-}blown
      \Longrightarrow
      \text{finite threshold selectors exist for every threshold.}
      \]

      The remaining fixed-selector step requires an added compactness input.  A
      sufficient input would be finite selector complexity, or an integrable modulus
      in the terminal label variable, strong enough to rule out moving spikes.  Tower
      blow-up alone only supplies threshold-dependent witnesses.


