      \subsection{Pack.TTU Final Obstruction}

      The final Pack.TTU obstruction is not the Gronwall step from strain to pack
      gauge.  That implication is already clear.  The obstruction is producing the
      terminal strain budget itself from original data.

      \[
      S_{pack,Q}(t)
      :=
      \sup_{a\in A_Q(t)}
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      \[
      u\in L_t^\infty L_x^2,
      \qquad
      \nabla u\in L^2_{t,x}.
      \]

      \[
      S_{pack,Q}\in L^1([t_0,T_*)).
      \]

      The obstruction is the spatial supremum along material labels.  Localized high
      strain may have a small \(L^2_{t,x}\) footprint while causing large
      singular-value growth for labels crossing that region.

      This criterion is continuation-grade and is not supplied by the current
      original-data or finite-energy packet.

      \[
      \det D_a\Phi=1,
      \]

      The determinant identity records incompressibility, but it does not control
      eccentricity.  Original data must still produce a terminal same-fluid strain
      budget strong enough to control the largest singular value of the deformation
      map and the reciprocal of its smallest singular value.


