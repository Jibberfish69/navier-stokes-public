      \subsection{Pack.TTU Continuum-Label Obstruction Audit}

      The finite-selector argument works because a maximum over finitely many labels
      can be bounded by a finite sum.  The continuum-label problem is exactly the
      failure of that step.

      \[
      s(a,t)=\|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      A_Q=\{a_1, \dots,a_J\},
      \]

      \[
      \int\sup_{a\in A_Q}s(a,t)dt
      \le
      \sum_{j=1}^{J}\int s(a_j,t)dt.
      \]

      Compactness of the label set and finite strain along each fixed label do not
      imply the continuum result.  A moving spike construction on a compact label set
      can have

      \[
      \int_{t_0}^{T_*}s(a,t)dt<\infty
      \qquad\text{for every fixed }a,
      \]

      \[
      \int_{t_0}^{T_*}\sup_{a\in A_Q}s(a,t)dt=\infty.
      \]

      The same construction defeats every fixed finite selector by moving the spikes
      away from that selector after finitely many steps.

      A successful theorem must add either a fixed finite active selector packet, an
      integrable label-continuity modulus, or a finite-complexity rule preventing
      moving terminal strain spikes.


