      \subsection{Pack.TTU Material-Line Strain Cancellation Test}

      This test asks whether cancellation along material lines can replace the
      operator-norm strain record.  It cannot, because Pack controls singular values
      of the deformation map, and singular-value growth is a two-sided magnitude
      problem.

      \[
      \int_{t_0}^{T_*}\|\nabla u(t)\|_{L^\infty}\,dt.
      \]

      \[
      S_{pack,Q}(t)
      =
      \sup_{a\in A_Q(t)}
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      \frac{d}{dt}|Fv|^2
      =2\langle S Fv,Fv\rangle.
      \]

      A signed integral of \(\langle Se,e\rangle\) along one chosen direction can
      cancel.  The Pack gauge needs uniform control over every direction and over
      both forward and inverse singular values.

      \[
      \sup_a \sup_{|e|=1}|\langle S(\Phi(a,t),t)e,e\rangle|.
      \]

      A deformation can alternate stretching directions so that signed traces cancel
      while the largest singular value and inverse singular value continue growing.

      \[
      S_{pack,Q}\in L^1([t_0,T_*)).
      \]

      The Pack-gauge theorem requires magnitude control of two-sided symmetric strain
      along the active label family.  Directional cancellation can support a
      vorticity or alignment estimate, but it does not replace the operator-norm
      record used by the Pack.TTU route.


