    text: |+
      \subsection{Pack.TTU First Upstream Blocker Record}

      The first upstream blocker is the difference between bounded pack geometry and
      good terminal analytic scale.  Bounded pack geometry keeps the material chart
      from detaching.  Field and Good Scale also need a positive SCF-good cylinder on
      the active terminal packet.

      \[
      S_{pack,Q}\in L^1
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty
      \]

      Field.TTU has the same dependence: pointwise terminal field scale requires
      bounded same-fluid geometry and full terminal SCF-good scale.

      Equivalently, every active terminal material point must have a positive
      SCF-good cylinder.  This record identifies the upstream blocker shared by Pack
      and Field: a same-fluid terminal scale has to be supplied for the whole active
      terminal packet, not merely for almost every point.


