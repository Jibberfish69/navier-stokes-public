      \subsection{Pack.TTU Energy/Enstrophy Strain Test}

      \[
      S_{pack,Q}\in L^1([t_0,T_*)),
      \]

      \[
      S_{pack,Q}(t)=
      \sup_{a\in A_Q(t)}
      \left\|\frac12(\nabla u+\nabla u^T)(\Phi(a,t),t)\right\|_{op}.
      \]

      \[
      u\in L_t^\infty L_x^2,
      \qquad
      \nabla u\in L^2_{t,x},
      \]

      \[
      \omega\in L^2_{t,x}.
      \]

      The Pack record asks for a material supremum along the active same-fluid
      packet.  The finite-energy and enstrophy records are spacetime integral
      records.  They control the square integral of \(\nabla u\), but they do not
      control the largest pointwise symmetric strain seen by an active label.

      Let \(E_r\) be a set with \(|E_r|\le C_E r^3\), and let \(u_r\) be a packet
      whose strain satisfies
      \[
      |\nabla u_r|\le C_A A_r r^{-1}\mathbf 1_{E_r}.
      \]
      Then
      \[
      \|\nabla u_r\|_{L^2_x}^2
      \le
      C_A^2C_E A_r^2 r.
      \]
      For example, \(A_r=r^{-1/4}\) gives an \(L^2_x\) strain contribution bounded by
      \(C_A^2C_E r^{1/2}\), while the pointwise strain scale
      \(C_A r^{-5/4}\) diverges as \(r\downarrow0\).

      This model makes the mismatch visible: an \(L^2_x\) strain budget can remain
      finite while the pointwise operator norm grows on a shrinking set.  A material
      label crossing that set can still see a large value of \(S_{pack,Q}(t)\).

      For divergence-free fields with the chosen zero-mode or decay convention, the
      Biot--Savart/Riesz relation is the Calderon--Zygmund transform identity
      \[
      \nabla u=\mathcal R\omega.
      \]
      Calderon--Zygmund theory maps \(L^p\) to \(L^p\) for \(1<p<\infty\).
      It does not turn \(L^2\) vorticity into an \(L^\infty\) strain bound.

      The energy/enstrophy route can control the Pack strain only after an extra
      continuation-grade input is supplied, such as a BKM-type high-norm record, a
      logarithmic strain criterion with its companion norm, or a separate
      good-scale theorem covering every active terminal label.


