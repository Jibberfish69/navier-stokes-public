    text: |+
      \subsection{Pack.TTU Original-Data Supply Test}

      The conditional second implication is already installed: a terminal
      \(L^1_t\) strain budget controls the pack gauge.  The test here concerns the
      first implication:
      \[
      \hbox{original smooth data and the installed energy packet}
      \Longrightarrow
      S_{pack,Q}\in L^1([t_0,T_*)).
      \]

      \[
      S_{pack,Q}(t)
      :=
      \sup_{a\in A_Q(t)}
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      Original smooth data gives a maximal classical solution on \([0,T_*)\).  On
      compact subintervals below \(T_*\), all retained smooth records are finite.

      \[
      u\in L_t^\infty L_x^2,
      \qquad
      \nabla u\in L^2_{t,x}.
      \]

      \(S_{pack,Q}\) is a terminal-tail supremum over material labels.  A localized
      high-strain region can have small spatial measure and finite \(L^2\) footprint
      while producing large pointwise symmetric strain along any label passing
      through that region.

      \[
      \sup_{a\in A_Q(t)}\|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}
      \]

      Compact-time classical smoothness also fails to give a uniform terminal-tail
      bound as \(t\uparrow T_*\).  That is exactly the continuation problem.

      \[
      \int_{t_0}^{T_*}\|\nabla u(t)\|_{L^\infty}\,dt<\infty
      \]

      The original-data test remains open at this point.  The installed records give
      energy, enstrophy, and compact-time smoothness; they do not produce the
      terminal \(S_{pack,Q}\)-tail needed by the Pack.TTU route.


