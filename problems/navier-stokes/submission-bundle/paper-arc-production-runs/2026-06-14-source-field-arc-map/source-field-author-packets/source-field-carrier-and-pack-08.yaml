      \subsection{Pack.TTU Strain record Conditional Control}

      The Pack.TTU row asks for a stable same-fluid geometry up to the terminal
      time.  The row is geometric: it is not asking for a new velocity estimate, but
      for enough control on the material deformation map to keep transported packets
      from becoming infinitely eccentric.

      \[
      F(a,t):=D_a\Phi(a,t),
      \qquad
      A(x,t):=\nabla u(x,t),
      \qquad
      S(x,t):=\frac12(A(x,t)+A(x,t)^T).
      \]

      \[
      S_{pack,Q}(t)
      :=
      \sup_{a\in A_Q(t)}\|S(\Phi(a,t),t)\|_{op}.
      \]

      The symmetric strain is the part of the velocity gradient that changes
      singular values.  Pure rotation can turn a packet, but it does not stretch the
      principal axes.  For a unit vector \(v\),
      \[
      \frac{d}{dt}|F(a,t)v|^2
      =2\langle S(\Phi(a,t),t)F(a,t)v,F(a,t)v\rangle.
      \]
      After taking the operator norm and applying Gronwall, one gets
      \[
      \|F(a,t)\|
      \le
      \|F(a,t_0)\|
      \exp\left(\int_{t_0}^t S_{pack,Q}(s)\,ds\right).
      \]
      The same calculation applied to \(F(a,t)^{-1}\) gives the reciprocal
      singular-value bound.  Hence
      \[
      \Gamma_{pack,Q}(t)
      \le
      \Gamma_{pack,Q}(t_0)
      \exp\left(\int_{t_0}^{t}S_{pack,Q}(s)\,ds\right).
      \]

      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty,
      \]
      is exactly the finite-integral hypothesis needed for the conditional Pack
      implication
      \[
      S_{pack,Q}\in L^1([t_0,T_*))
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]
      What remains unpaid is the original-data estimate
      \[
      \hbox{original smooth data}
      \Longrightarrow
      S_{pack,Q}\in L^1([t_0,T_*)).
      \]
      In the CM witness tree, this subsection pays only the conditional half of the
      Pack row.  The next supplier must show that energy/enstrophy, vorticity
      direction depletion, a BKM-type condition, or another original-data mechanism
      actually controls this two-sided active-label strain record.


