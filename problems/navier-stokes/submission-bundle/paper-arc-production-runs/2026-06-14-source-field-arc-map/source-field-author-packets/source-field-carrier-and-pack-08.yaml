      \subsection{Pack.TTU Vorticity-Direction Depletion Test}

      The vorticity-direction route is a natural candidate supplier for the missing
      Pack.TTU estimate, because vortex stretching is governed by the strain in the
      vorticity direction.  The Pack row needs a stronger object.

      \[
      S_{pack,Q}\in L^1([t_0,T_*))
      \]

      \[
      S_{pack,Q}(t)=
      \sup_{a\in A_Q(t)}
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      This is the full two-sided operator norm of the symmetric strain along active
      material labels.  Vorticity stretching gives only the directional scalar
      component
      \[
      \omega\cdot S\omega
      =|\omega|^2\langle S\xi,\xi\rangle,
      \qquad
      \xi:=\omega/|\omega|.
      \]

      \[
      \|S\|_{op}
      =
      \sup_{|e|=1}|\langle Se,e\rangle|.
      \]

      The scalar \(\langle S\xi,\xi\rangle\) can be small while \(S\) has large
      action on directions transverse to \(\xi\), or while the negative eigenvalue
      drives the inverse deformation.  The Pack gauge sees both effects because it
      controls \(\|F\|\) and \(\|F^{-1}\|\).

      The Biot--Savart relation expresses \(\nabla u\) as singular integrals of
      \(\omega\).  Energy/enstrophy gives \(\omega\in L^2_{t,x}\), and
      Calderon--Zygmund estimates propagate finite-\(p\) strain controls.  The Pack
      record needs a material \(L^\infty\)-type supremum over the active labels.

      At the present resolution, direction coherence plus energy/enstrophy does not
      pay the Pack.TTU row.  This records a Pack-side obstruction for the
      forward-positive route.  Its CM counterpart is precise: unless a later theorem converts
      directional depletion into the displayed two-sided active-label operator-norm
      bound, this route cannot certify the Pack face.


