    text: |+
      \subsection{Positive Carrier Absolute-value Step}

      The absolute-value branch of the lifted weighted remainder route does have a
      valid positive replacement.  This payment is narrower than the full source-wall
      problem, but it is useful because it isolates the exact reserve the replacement
      needs.

      \[
      G_N^{lift,\sigma}
      \]

      \[
      |G_N^{lift,\sigma}(t)|
      \le
      C\sum_{k>N}2^k a_k(t)U_k(t),
      \]

      \[
      a_k(t)=2^{3k/2}\|\Delta_k u(t)\|_2,
      \qquad
      U_k(t)=\sum_{\ell>k+4}D_\ell(t).
      \]

      \[
      2^ka_k^2=D_k,
      \]

      Since \(2^ka_k^2=D_k\), Cauchy--Young applied to the product
      \(2^ka_kU_k\) gives

      \[
      |G_N^{lift,\sigma}(t)|
      \le
      \varepsilon\sum_{k>N}2^kU_k(t)^2
      +C_\varepsilon\sum_{k>N}D_k(t).
      \]

      The positive carrier replacement is valid.  It shifts the proof burden to the
      active upper-tail term
      \[
      \sum_{k>N}2^kU_k(t)^2.
      \]
      That term is the residual-tail side of the current source-wall split.  The
      subsection pays the algebraic absolute-value step; it does not pay the active
      upper-tail reserve itself.


