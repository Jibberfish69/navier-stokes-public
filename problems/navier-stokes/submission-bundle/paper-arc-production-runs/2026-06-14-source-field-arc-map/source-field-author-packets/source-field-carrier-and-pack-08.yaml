      \subsection{Pack.TTU Weaker Pack-Native Substitute Test}

      This test asks whether one can replace the full Pack strain record by a weaker
      quantity that is more native to the existing energy and source ledgers.  The
      answer is negative for the substitutes tested here.

      \[
      S_{pack,Q}(t)
      :=
      \sup_{a\in A_Q(t)}\|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)dt<\infty
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      \[
      \frac{d}{dt}|Fv|^2
      =2\langle S Fv,Fv\rangle
      \le 2\lambda_+(S)|Fv|^2.
      \]

      The positive eigenvalue part \(\lambda_+(S)\) controls forward stretching.  The
      inverse Pack gauge also requires a lower singular-value bound, and that lower
      bound is governed by the negative part of the same symmetric strain.

      \[
      \Gamma_{pack,Q}(t)=\sup_a\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\}.
      \]

      \[
      \int_{A_Q}|S(\Phi(a,t),t)|\,da
      \]

      A label-average strain budget is too weak for this endpoint.  A thin packet of
      labels can carry very large stretching while the average stays finite.  The
      endpoint cover requires a uniform positive lower scale, so average label
      control cannot replace the supremum record.

      Incompressibility fixes the product of singular values.  The Pack gauge needs
      the largest singular value and the reciprocal smallest singular value.  A
      volume-preserving shear/stretch can keep determinant one while Pack eccentricity
      grows.

      Every admissible substitute for \(S_{pack,Q}\) has to control the same
      two-sided material supremum, or give a theorem that converts its weaker record
      into that supremum.  Without that conversion, localized high strain on small
      spacetime sets can preserve the \(L^2\) budget while producing large
      pointwise singular-value growth for labels crossing the set.  This is the
      Pack.TTU supplier standard that later source-field work must meet.


