    text: |+
      \subsection{Pressure Quadratic Defect Native Carrier Test}

      This test asks whether the pressure/eigenframe channel can be tied directly to
      the native one-sided source carrier.  If such a tether were available, pressure
      sustain would either pay the positive source carrier or vanish in the terminal
      limit.  The desired comparison has the form

      \[
      \begin{aligned}
      s_{\mathrm{pe},\mathrm{term}}
      &\le
      C\sum_{P\in\mathcal F_N}\int_{Q(P)}
      |w_{j_P}|^2
      \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+\,dxdt\\
      &\quad+
      L_{\mathrm{legal}}+o_N(1).
      \end{aligned}
      \]

      The carrier that has to be paid is

      \[
      |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
      \]

      The installed pressure inputs are useful signed near-band controls: terminal
      pressure-Hessian depletion and one-sided near-band material strain variation.

      They control pressure-Hessian and eigenframe sustain before the terminal
      positive-part selection.  Pressure Poisson recovery and Leray projection
      identities give elliptic and gradient-cancellation structure, but those
      identities also act before positive-part extraction and before selected terminal
      source weighting.

      The missing step is the selected positive-part comparison after terminal packet
      selection.  A one-sided pressure-source tether would have to prove that selected
      terminal pressure/eigenframe sustain pays the native positive source carrier
      through legal drain/loss, or else disappears at the terminal limit.  At the
      present resolution, the pressure/eigenframe route supplies signed near-band
      support.  It does not yet supply the source-weighted angular depletion theorem.


