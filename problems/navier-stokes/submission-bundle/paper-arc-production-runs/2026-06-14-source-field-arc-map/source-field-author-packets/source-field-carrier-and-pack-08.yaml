      \subsection{SCF Charge Upper Carrier and Remaining Jump-avg Burden}

      The \(\mathrm{Jump}_{\mathrm{avg}}\) branch needs one charge that appears on
      both sides of the argument.  The lower side must show that a terminal jump
      creates nonzero separated mass.  The upper side must show that the same charge
      has a finite bound from the original solution records.  The canonical choice is
      \[
      \mathrm{SCF}_{\mathrm{base}}=E_u+D_u+P+G_\Phi.
      \]
      Here \(E_u\) is the local velocity-energy contribution, \(D_u\) is the
      localized dissipation contribution, \(P\) is the local pressure contribution,
      and \(G_\Phi\) is the geometric price of transporting the window with the
      same-fluid flow.

      Pack stabilization controls \(G_\Phi\).  The analytic carrier is then governed
      by finite dissipation and local pressure bounds:
      \[
      \nabla u\in L^2_{t,x}([t_0,T_*)\times\mathbb T^3),
      \qquad
      -\Delta p^{loc}_\chi
      =\partial_i\partial_j(\chi u_i u_j).
      \]
      On each transported cutoff window, the Calderon--Zygmund estimate gives the
      standard local pressure class for \(p^{loc}_\chi\), and bounded overlap lets the
      window estimates be summed over the terminal atlas.

      These inputs discharge the raw upper-carrier side for the SCF-base charge.  The
      unpaid part is the matching lower side: one still has to prove that
      \(\mathrm{Jump}_{\mathrm{avg}}\) produces nonzero terminal mass and separated
      accumulation for this same scale-normalized charge.  Until that lower theorem is
      installed, the branch has an upper carrier but not a contradiction.


