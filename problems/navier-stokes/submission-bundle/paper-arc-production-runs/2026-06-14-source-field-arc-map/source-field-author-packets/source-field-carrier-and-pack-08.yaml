      \subsection{Positive-carrier Active Carleson Frontier}

      This frontier appears after the signed weighted commutator-defect route has
      lost the cancellation it wanted to use.  At that point the proof cannot keep
      arguing with a signed balance alone.  It needs a positive estimate strong
      enough to control the active upper-tail burden on the terminal same-fluid
      windows.

      The energy layer supplies first-moment dissipation control.  It controls the
      ordinary integral of shell dissipation.  The active branch asks for a stronger
      object: a scale-critical source reserve on selected terminal windows.  Direct
      absorption would need one of three inputs:
      \[
      \begin{gathered}
      \text{active-shell amplitude gain},\\
      \text{positive nonlinear shell-flux control},\\
      \text{active Carleson control on terminal windows}.
      \end{gathered}
      \]
      Those inputs are not supplied by the current source stack.

      The tail-square bypass closes the far-separated reserve by energy absorption.
      It removes the downstream far-tail reserve burden.  It does not pay the active
      upper-tail Carleson theorem.

      The scale-normalized \(\nu_{\mathrm{SCF}}\) carrier has the same obstruction.
      Raw finite mass gives only
      \[
      \nu_{\mathrm{SCF}}(\mathcal W)<\infty
      \]
      on bounded-overlap window families.  The lower route needs scale-normalized
      density control on shrinking terminal windows.  The exact target is the
      terminal weighted bound
      \[
      \sum_{Q\in\mathcal W_{\mathrm{term}}}
      w(Q)\,\nu_{\mathrm{SCF}}(Q)
      \le C_{\mathrm{term}},
      \]
      where the weight \(w(Q)\) is the same scale weight used by the lower terminal
      charge.  A finite Radon measure can have finite total mass while this weighted
      sum diverges on shrinking windows.  Raw finite mass is not enough.

      The monotone shell identity permits short active-shell pulses when the nonlinear
      flux source supplies matching input.  Flux antisymmetry organizes the signed
      source before localization and positive-part extraction.  The weighted positive
      defect and the residual tail estimate remain open.

