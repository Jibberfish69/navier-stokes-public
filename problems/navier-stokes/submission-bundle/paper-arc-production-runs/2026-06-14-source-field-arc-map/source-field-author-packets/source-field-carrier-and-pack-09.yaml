    text: |+
      \subsection{Terminal Skew Localization record.A attempt}

      Failed as an unconditional theorem. The exact conditional factorization is preserved.

      Weighted Lifted Skew Defect Legal.A fails unconditionally because one-sided weights and lifted commutator defects are not legally summable without pairwise weight flattening or a signed lifted-commutator theorem.

      Skew Saturation Admissibility.A fails unconditionally because saturating a selected terminal family by all signed partners may create an unbounded incoming donor hull.

      Off Saturation Boundary Pricing.A fails unconditionally because a missing signed partner can be a legal interior donor, not boundary flux or a legal loss.

      The signed-current source-wall route cannot yet proceed to heat-action estimates as a theorem-grade route, because the localized terminal current has not been constructed.


