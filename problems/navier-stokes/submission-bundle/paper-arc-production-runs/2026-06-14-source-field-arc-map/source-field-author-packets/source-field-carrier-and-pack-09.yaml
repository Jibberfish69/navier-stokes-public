      \]

      The periodic route uses compactness of T 3, a finite terminal cover with no spatial infinity, a periodic zero-mean pressure gauge, and periodic energy bounds. A direct positive periodic-to-R3 export route requires replacement of each of those ingredients.

      \[
      p=p_i^{loc}+h_i,
      \]

