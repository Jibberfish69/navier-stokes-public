      \subsection{Scfbase Modulus Original Pack Test}

      Original Smooth Data gives smoothness on every compact interval below T * and the terminal energy inequality.

      \[
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      Geometric comparability does not control the local velocity-pressure scale-critical packet. Compact-time smoothness gives local continuity for each T 0<T *; it does not produce a terminal integrable label-time-scale modulus as t T *.

      Energy gives a.e. good-scale information. It does not give uniform variation control over all active labels and scales.

      A sequence of bad scale-critical packets can move through fresh labels and decreasing scales near T *. Pack control can keep the coordinate geometry stable while the SCF packet itself still moves.


