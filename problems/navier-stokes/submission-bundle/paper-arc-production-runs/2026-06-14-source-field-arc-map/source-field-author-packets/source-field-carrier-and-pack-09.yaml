    text: |+
      \subsection{Uniform Strain Tail Retry: Selector And Moving-Spike Test}

      Anchored retry result. The finite selector route remains valid. The continuum selector route fails without an extra finite-complexity or integrable-modulus theorem.

      \[
      s(a,t):=
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      A_Q=\{a_1, \dots,a_J\},
      \]

      \[
      \int\sup_{a\in A_Q}s(a,t)dt
      \le
      \sum_{j=1}^{J}\int s(a_j,t)dt.
      \]

      Take a compact label set A Q=[0,1] and a terminal sequence t n T *. Choose disjoint label neighborhoods U n A Q and disjoint time intervals I n [t 0,T *) with I n T *. Let

      \[
      s(a,t)=\sum_{n}A_n\phi_n(a)\psi_n(t),
      \]

      \[
      A_n|I_n|=1/n.
      \]

      Thus Uniform Strain Tail.TTU fails under compactness and pointwise finite strain alone.

      Thus threshold-dependent labels can witness arbitrarily large supremal strain, while no fixed finite selector captures the whole terminal strain record.

      Finite active packets close. Continuum active packets require additional structure beyond compactness and labelwise finite strain.


