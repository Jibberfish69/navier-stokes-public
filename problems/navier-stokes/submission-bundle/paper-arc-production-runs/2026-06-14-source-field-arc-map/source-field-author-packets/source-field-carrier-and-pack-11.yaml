    A narrow jet or injection is the clean interior diagnostic. It supplies momentum and forces pressure to adjust, but Euler has no viscous coupling law requiring the neighboring material to join one smooth packet. In weak Euler terms, the live question is whether the flux and momentum balances hold across the chosen control surfaces. Tangential slip or a jump-like shear layer is not removed by pressure alone.

