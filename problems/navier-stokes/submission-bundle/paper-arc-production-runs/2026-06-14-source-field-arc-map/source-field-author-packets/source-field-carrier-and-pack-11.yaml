      \subsection{Selected-Packet Shared Pack Boundary Audit}

      This is the allowed shared-boundary argument, restricted to the selected packet. The shared object is flux-volume and incompressibility. The split object is participation and coherence. Navier--Stokes has a pressure-viscosity participation law and a parabolic one-field mechanism; the Euler boundary object has pressure and incompressibility compatibility.

      \[
      \boxed{
      \mathrm{EPart}^{press}_Q
      \subset
      \mathrm{EVol}_Q\wedge\mathrm{EMom}_Q,
      \qquad
      \mathrm{EPart}^{press}_Q\not\Rightarrow \mathrm{EReg}_{N,r,Q}.
      }
      \]

      In the clean selected-packet case, the Euler boundary object can obey flux-volume and pressure-momentum balance while the stronger fixed-viscosity participation or one-field coherence layer fails.

      The NS smoothness route says that if the continuation packet persists, the classical solution continues. Contrapositively, a genuine terminal failure must break one of those slots or a checked bridge into one of them.

      The same proof is read in two parts. Wherever it proves Pack in the shared flux-volume sense, a Pack failure is a class exit for both equations. Wherever it spends viscous participation or one-field coherence, it identifies an Euler nonsmoothness-compatible gap: a way for Euler to remain a weak member while failing the stronger Navier--Stokes layer.

      A narrow jet or injection is the clean interior diagnostic. It supplies momentum and forces pressure to adjust, but Euler has no viscous coupling law requiring the neighboring material to join one smooth packet. In weak Euler terms, the live question is whether the flux and momentum balances hold across the chosen control surfaces. Tangential slip or a jump-like shear layer is not removed by pressure alone.

      Supplier, source-wall, readout, export, exact-potential, selector, and manuscript surfaces inherit this rule. They do not get Euler-dual authority from vocabulary alone.

