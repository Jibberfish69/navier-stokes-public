    \subsection{Selected-Packet Shared Pack Boundary Audit}

    This is the allowed shared-boundary argument, restricted to the selected packet. The shared object is flux-volume and incompressibility. The split object is participation and coherence. Navier--Stokes has a pressure-viscosity participation law and a parabolic one-field mechanism; the Euler boundary object has pressure and incompressibility compatibility.

