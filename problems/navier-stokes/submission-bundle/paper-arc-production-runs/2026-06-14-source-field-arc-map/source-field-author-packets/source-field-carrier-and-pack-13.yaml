      \subsection{Pctp Hard Pack Detachment Absorption}

      \[
      Part_{N,Q}+Field_{N,r,Q}+\mathfrak A_{N,Q}\in L^\infty(0,T_*)
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty(0,T_*).
      \]

      \[
      packing\text{-}detached
      \Longrightarrow
      Dead\vee Jump\vee tower\text{-}blown
      \]

      \[
      \Gamma_{pack,Q}(t)
      :=\sup_{a\in A_Q(t)}\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\}.
      \]

      \[
      \mathfrak A_{N,Q}(t)\le M_A,
      \qquad 0<t<T_*.
      \]

      Take N>=1, so the tower readout includes first spatial derivatives of velocity on the coherent cover.

      By Field N,r,Q , the retained terminal material packet is covered by coherent cylinders with radius bounded below by r *. By compactness of the retained packet on each terminal tail and persistence of Part N,Q , finitely many such coherent cylinders cover the packet with no label loss.

      By the bounded tower assumption with N>=1, the velocity-gradient readout is uniformly bounded on this finite coherent cover. Hence there is a finite constant M such that for every retained material label a and every t<T *,

      \[
      \|\nabla u(X(a,t),t)\|\le M.
      \]

      where the inequalities are read in the upper Dini sense at points where the norms are nonzero. Gronwall gives

      Thus pack detachment cannot occur while Part, Field, and the tower amplitude remain controlled.

      The result here is a conditional absorption lemma. Part, Field, and bounded tower amplitude still have to be produced from Original Smooth Data on the terminal tail.


