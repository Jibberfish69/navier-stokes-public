    text: |+
      \subsection{Retained Pack/Part Critical Concentration To Field Bridge}

      Optional public-analogue import target. This is the narrow bridge worth keeping; it is not the live source-pulse supplier theorem and it is not proved here.

      Object boundary: this bridge classifies a retained concentration or residue after the supplier problem has failed to remove it. It does not classify Positive Remainder Depletion.A itself.

      In the route notes, this is the retained Pack/Part critical-concentration
      bridge for \(X\).  Its job is to say that once Pack and Part are retained, a
      remaining critical concentration is a Field failure rather than a new fourth
      face.

      \[
      \boxed{
      \begin{aligned}
      Pack_Q(\mathcal W)
      \wedge Part_{N,Q}(\mathcal W)
      \wedge CritConc_X(\mathcal W)
      &\Longrightarrow
      \neg Field_{N,r,Q}(\mathcal W).
      \end{aligned}
      }
      \]

      \[
      \boxed{
      Pack_Q(\mathcal W)
      \wedge
      Part_{N,Q}(\mathcal W)
      \wedge
      Field_{N,r,Q}(\mathcal W)
      \Longrightarrow
      \neg CritConc_X(\mathcal W).
      }
      \]

      Part keeps the terminal object inside the same Navier-Stokes participation law, with pressure and viscosity still tied to the same PDE object.

      So after Pack and Part are retained, a remaining public critical concentration is no longer a carrier failure or a participation failure. It has to be read as failure of one-field coherence, pressure/source readout, or neighboring tower compatibility. That is exactly the Field face.

      \[
      CritConc_X
      \leadsto
      CritConc_X(\mathcal W).
      \]

      \[
      Pack_Q(\mathcal W),
      \quad
      Part_{N,Q}(\mathcal W)
      \quad
      \text{remain retained}.
      \]

      \[
      Field_{N,r,Q}(\mathcal W)
      \Longrightarrow
      \text{no }X\text{-critical concentration on }\mathcal W.
      \]

      This is the place where public machinery could matter: localized smoothing, critical-element compactness, Lorentz/Besov quantitative regularity, or dynamically restricted endpoint concentration estimates.

      The public bridge is a translator. The native source-pulse problem is still the active supplier problem.


