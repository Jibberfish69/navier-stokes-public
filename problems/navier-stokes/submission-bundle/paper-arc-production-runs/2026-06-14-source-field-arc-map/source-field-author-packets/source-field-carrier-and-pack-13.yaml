      \subsection{Clay problem Pressure Endpoint Pack/Part/Field Witness Test}

      Purpose: after the exhausted pressure branch was admitted as a Field-face diagnostic, test whether any pressure endpoint supplies a genuine noncircular Pack/Part/Field witness face for the current CM discipline.

      \[
      Pack_Q,
      \qquad
      Part_{N,Q},
      \qquad
      Field_{N,r,Q}.
      \]

      A diagnostic landing is weaker. It classifies the obstruction. A witness theorem must produce usable face data or discharge the failure surface on the relevant carrier.

      If proved, this endpoint would convert pressure-sustain residue into native source residue or a finite packet source tether. That would feed the source-current branch and could support Field-side source data.

      The endpoint remains unproved. The finite packet tether still requires independent terminal Leray orientation, commutator legality, and saturation. So it supplies no present Pack/Part/Field witness.

      If proved, this endpoint would remove the pure pressure-sustain residue. The direct Liouville, rigid-class production, trace/angular saturation, legal classification, and time-spread tests all failed from installed inputs.

      Thus this endpoint supplies no present witness face. It remains a future pressure-specific theorem.

      If proved, this endpoint would create a legal pressure class for retained pure-strain pressure sustain. The legal-classification attempt showed that the existing legal pressure records cover collar, harmonic, cutoff/projector, and off-family exits only. The retained interior pure pressure residue needs a new legal class and terminal summability proof.

      It records that an uncharged retained pure pressure-sustain residue belongs on the Field/readout side of the CM record. This is useful bookkeeping. It cannot substitute for a Pack/Part/Field witness theorem.

      The source-wall root so requires a non-pressure supplier entrance or an independent proof of one of the named pressure endpoints.


