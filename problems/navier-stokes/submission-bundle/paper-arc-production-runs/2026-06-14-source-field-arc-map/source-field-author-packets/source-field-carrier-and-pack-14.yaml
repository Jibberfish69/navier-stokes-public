      \subsection{Temporal Non AtomicSCF.A carrier audit}

      The velocity and pressure pieces have plausible superlinear time control from the energy class. The dissipation carrier is only L 1 t at the installed level, and it can form a terminal atom in weak-* rescaled limits.

      \[
      \mu_D=|\nabla u|^2\,dx\,dt,
      \qquad
      \mu_{P,\chi}=|p_\chi^{loc}|^{3/2}\,dx\,dt.
      \]

      \[
      u\in L_t^4L_x^3
      \]

      \[
      d_D(t):=\int_{B_{R+1}}|\nabla u^{(n)}(y,t)|^2dy.
      \]

      \[
      \|d_D\|_{L_t^1((-1,0))}\le C_R.
      \]

      The manuscript does not upgrade this \(L_t^1\) bound to any uniform
      \(L_t^p\), \(p>1\), estimate on the selected terminal rescalings.

      \[
      d_D^{(n)}(s)\,ds
      =
      c_0\,n\,\mathbf 1_{(-1/n,0]}(s)\,ds
      \rightharpoonup
      c_0\,\delta_0.
      \]

      This model is compatible with a uniform L 1 t bound and positive terminal SCF defect measure. It is excluded only by a superlinear time integrability or by an independent dynamic law preventing first-time dissipation-carrier creation.


