      \subsection{Mediating Object: post monotone cascade carrier}

      This file formalizes the exact object that remains after the monotone bridge has been installed and marked insufficient by itself.

      Its job is not to prove the scale barrier again. Its job is to make the unresolved post-Q(t) singularity pressure exact enough that the next discharge pass can test it locally instead of reopening generic theorem search.

      The critical-scale quantity is the high-frequency tail energy together with its nonlinear transport packet.

      If that estimate holds for all large cutoffs, the post-Q(t) cascade burden is absorbed and the route passes from the monotone layer into the scale-barrier discharge family.

      This object does not itself prove the fourth bridge. It records the exact cascade channel whose suppression is later consumed by compactness and then by the curvature-first gradient route.


