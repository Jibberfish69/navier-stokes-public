      \subsection{Pack(Q) Reader Explanation from the CM Certification View}

      A point gives one value, or one limiting value. Smoothness asks for more. It asks whether there is a little open piece around that point where the velocity and pressure live together, the derivatives exist, viscosity acts through those derivatives, and nearby fluid particles are still part of one transported fluid.

      So a point can be a test location. It can tell the reader what an already existing smooth field reads there. It cannot, by itself, provide the smooth field around it.

      The same rule applies to nonsmoothness. A suspicious point value, limit, or blow-up signal is not yet a certified nonsmooth Navier-Stokes object. The proof has to thicken that point to a little neighborhood and ask what exists there: a smooth local field, a nonsmooth local field, or no same-fluid object left at all.

      The vortex version says the same thing in physical language. A vortex is not a single point. It requires radius, circulation, shear, inner and outer structure, and neighboring fluid. A zero-radius "vortex" is no longer a vortex object; it is only a collapsed trace that has to be tested through the Pack gate.

      From the CM certification point of view, Pack(Q) is not a decorative positive-radius convention. It is the first test that the terminal candidate is still a same-fluid Navier-Stokes object rather than a zero-radius residue.

      The later Field question is meaningful only after this carrier/cover question has been passed or restored. The endpoint readout layer may recover pointwise information, but it does so inside an already certified positive-radius packet.


