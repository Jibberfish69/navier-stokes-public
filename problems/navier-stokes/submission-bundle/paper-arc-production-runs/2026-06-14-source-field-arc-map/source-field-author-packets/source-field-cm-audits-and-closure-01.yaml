      \subsection{Clay Target Route Reduction Note}

      The current whole-tower route can be stated in ordinary terms.  The Clay target
      remains the whole-space smoothness statement:

      \[
      \text{for every smooth divergence-free rapidly decaying }u^0\text{ on }\mathbb R^3,\quad f=0,
      \]

      \[
      \exists\,u,p\in C^\infty(\mathbb R^3\times[0,\infty))
      \]

      \[
      \int_{\mathbb R^3}|u(x,t)|^2\,dx<C
      \qquad
      \forall t\ge 0.
      \]

      \[
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
      \qquad
      \Pi_{m,\alpha}:=\partial_t^m\partial_x^\alpha p,
      \]

      \[
      \partial_t J_{m,\alpha}
      +
      \sum_{a=0}^{m}\sum_{\beta\le\alpha}
      \binom ma\binom{\alpha}{\beta}
      (J_{a,\beta}\cdot\nabla)J_{m-a,\alpha-\beta}
      +
      \nabla \Pi_{m,\alpha}
      =
      \nu\Delta J_{m,\alpha},
      \]

      The differentiated equation displays the real closure burden.  Every rung
      \(J_{m,\alpha}\) is coupled to all lower splittings
      \((J_{a,\beta},J_{m-a,\alpha-\beta})\).  A proof using the whole derivative
      tower needs a single classical surface on which this binomial transport
      convolution can be controlled at every rung.

      The live source stack contains three candidate whole-tower packages.  Their
      accounting objects are shadow defects, pressure shadow terms, curvature shadow
      terms, tail shadow terms, coherent and remainder components, and a residual
      term:
      \[
      \begin{aligned}
      \mathcal S(X)
      :=\{&
      \mathrm{Shadow}_{\mathrm{def}}(X),\ p_{\mathrm{sh}}(X),\
      \mathrm{Curv}_{\mathrm{sh}}(X),\ \mathrm{Tail}_{\mathrm{sh}}(X),\\
      &E(X),\ E_{\mathrm{sh}}(X),\
      N_{\mathrm{coh}}(X),\ N_{\mathrm{rem}}(X),\ R(X)\}.
      \end{aligned}
      \]

