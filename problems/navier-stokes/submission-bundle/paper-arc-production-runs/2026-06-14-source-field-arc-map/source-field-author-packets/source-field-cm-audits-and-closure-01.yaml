      \subsection{Navier-Stokes Closure Execution Contract}

      The execution gates for the current closure-side support route are the gates
      below.  A reserve route contributes mathematical progress by supplying a
      positive margin on the same surface where the nonlinear term is being tested.

      \[
      \varepsilon_j^{freeze}
      \le
      c\,2^{-2j},
      \]

      The freeze error gate keeps frozen-scale error below the parabolic scale
      \(2^{-2j}\).  The signed-defect route then supplies a positive cap-graph
      margin.  The scalar gate is

      \[
      m_j^{sign}
      :=
      d_j^{diag}-C_{\mathrm{edge}}\Lambda_j\Sigma_j^{edge}.
      \]

      \[
      m_j^{sign,\rho}
      :=
      d_j^{diag}-C_{\mathrm{edge}}N_{\mathrm{cap}}\rho_j\Lambda_j.
      \]

      \[
      m_j^{sign}>0
      \qquad\text{or, on the angular carrier,}\qquad
      m_j^{sign,\rho}>0.
      \]

      The reserve dynamic route is a weighted boundary-transfer problem.  The strong
      route requires pointwise control of the transfer coefficient

      \[
      \beta_J(\eta)
      :=
      \eta(1+C_B)+C_\eta C_C\,\Gamma_J.
      \]

      The difference matters for the reader.  Pointwise control of \(J(t)\) belongs
      to the strong route through \(\Gamma_J\).  A shadow-time or occupancy argument
      supplies an averaged coefficient
      \[
      \overline J_I
      :=
      |I|^{-1}\int_I J(t)\,dt.
      \]

      The averaged route enters the manuscript as averaged support.  The pointwise
      route enters a closure claim after the coefficient \(\beta_J(\eta)\) is
      controlled on the same classical surface.


