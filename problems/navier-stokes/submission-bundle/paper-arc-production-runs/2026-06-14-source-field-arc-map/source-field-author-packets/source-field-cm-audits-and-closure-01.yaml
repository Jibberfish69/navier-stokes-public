      \subsection{Clay Closure Support Map}

      This subsection tells the reader how the source-field appendix may be cited in
      the main manuscript.  Some pieces are installed support.  Some pieces are open
      forward-positive supplier arguments.  The map keeps those roles visible while
      the whole-space Navier--Stokes target stays fixed.

      The first support layer is the projected-flow layer.  Appendix D.1 gives a
      projected Leray--Stokes form of the equation, with the source term kept on the
      same classical surface as the velocity and pressure.  This supplies equation
      language.

      The second support layer is the carrier-to-classical readout.  Sections D.24--D.39
      identify the carrier, the readout map, the fixed low-mode coefficient support,
      and the base leakage-absorption translation.  Those sections explain why the
      carrier language is allowed to talk about the classical equation.  They also name
      the remaining debts: exact readout alignment, principal transport export, and the
      stronger leakage export.

      The third support layer is the same-surface warrant.  Theorem 2.1 may be used as
      a same-surface warrant after one discharge ladder supplies the missing global
      control theorem.  At the current proof state, it is route support.


