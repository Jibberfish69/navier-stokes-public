    \subsection{Euclidean Strict-Shadow Clay Discharge Criterion}

    The criterion here is a downstream Euclidean export criterion.  It begins after
    a CM-to-Euclidean splice has already supplied the carrier and readout surface.
    It does not steer the Pack, Part, or Field exit work by itself.

    The Clay target on this exported surface is the usual whole-space statement:
    for every smooth divergence-free rapidly decaying datum \(u^0\) on
    \(\mathbb R^3\), with \(f=0\), find a smooth solution on all positive times
    with bounded energy,

    \[
    \int_{\mathbb R^3}|u(x,t)|^2\,dx<C
    \qquad
    \forall t\ge0.
    \]

    The strict-shadow readout package already records

    \[
    u=\mathcal C(X),
    \]

    \[
    \mathcal C(\partial_tX)=\partial_tu,
    \qquad
    \mathcal C(\Delta_DX)=\Delta u,
    \qquad
    \mathcal C(\mathbb P_DX)=\mathbb P_{\mathrm{Leray}}u,
    \]

    and

    \[
    \mathcal C(\mathbb P_DN_D(X))
    =
    \mathbb P_{\mathrm{Leray}}(u\cdot\nabla u),
    \qquad
    \|u\|_{H^s}\le C\|X\|_{H_D^s}.
    \]

    Under exact strict shadow the non-classical interaction has zero projected
    defect, so the readout \(u=\mathcal C(X)\) solves the exact classical
    Navier--Stokes equation on \(\mathbb R^3\).

    Fix \(s>\frac52\).  After the export splice, the downstream consumer package
    has exactly three inputs.

    \[
    \text{(A1a) full-data lift/readout coverage of the Clay datum class,}
    \]

    \[
    \text{(A1b) exact strict-shadow descent on the exported Euclidean surface,}
    \]

    \[
    \text{(A1c) global }H_D^s\text{ control of the exported carrier }X(t).
    \]

    These three inputs discharge the exported whole-space consumer branch.  Indeed,
    given \(u^0\), (A1a) gives \(X_0\) with \(\mathcal C(X_0)=u^0\).  By (A1c)
    there is a global carrier \(X(t)\) with

    \[
    \sup_{t\ge0}\|X(t)\|_{H_D^s}<\infty.
    \]

    Set \(u(t)=\mathcal C(X(t))\).  By (A1b), \(u\) solves the exact classical
    Navier--Stokes equation.  The norm comparison gives

    \[
    \sup_{t\ge0}\|u(t)\|_{H^s}
    \le
    C\sup_{t\ge0}\|X(t)\|_{H_D^s}
    <\infty.
    \]

    Since \(s>\frac52\), this is a continuation-level classical bound, and the
    classical solution extends smoothly for all time.  The datum \(u^0\) was
    arbitrary in the Clay class, so the exported Euclidean branch closes once
    (A1a)--(A1c) and the earlier splice are in place.

    The no-shadow-defect and no-remainder notes sit downstream of (A1b).  They are
    consumer corollaries after exact strict shadow has already been granted; they
    are not additional branch roots.

    There is one realized-carrier simplification.  On the classical realized
    carrier, the readout is the identity.  Then every Clay datum is already a
    carrier datum, so (A1a) is automatic with \(X_0=u^0\), and exact strict shadow
    is automatic because there is no separate projection defect.  On that realized
    subbranch, the remaining downstream burden is global carrier \(H_D^s\) control.

    The proof status is narrower: the CM-to-Euclidean splice and (A1c) remain
    separate inputs.  The displayed criterion records what the downstream Euclidean
    consumer branch would need in order to discharge the Clay whole-space statement
    without adding another classical remainder theorem.



    \subsection{Exact-Potential Residual Pairwise Closure}

    D.98 is another downstream assembly step.  Once \(D.7mr2\) supplies the angular
    ledger on the active exact-potential strip, that ledger feeds the residual
    pairwise closure slot \(RPC.3\).

    \[
    \Xi_J^{ang}
    \le C_{\mathrm{sf},5851}
    |W_J|^2+\mathrm{Err}_J,
    \]

    \[
    \mathcal E_J^{dir}+\mathcal E_J^{loop}
    \le C_{\mathrm{sf},5857}
    \mathcal E_J^{obs}+\mathrm{Err}_{J,\mathrm{pair}}.
    \]

    The assembly is useful because it carries the angular record into the branch
    readout used by \(SG.4\).  Its scope is limited.  It introduces no new
    synchronization theorem and no new selector-strain theorem.  The live upstream
    burdens remain the \(PTC\)-Lin plus \(PTC\)-Shape route into \(D.7mq\), together
    with selector-strain sufficiency on the active strip.  After \(RPC.3\), the
    chain \(SG.4\to BR.\lambda2\to\) continuation is downstream export.



    \subsection{Exact-Potential V2 Repaired Direct Closure From LL And WZ Imports}

    This is the active repaired direct closure of \(V2\) on the exact-potential
    branch.  It uses the fixed metric supplied by the F.11d static-diffusion
    readout and the lower-order absorption paid in D.99.

    \[
    \partial_t \widetilde q_k
    -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta \widetilde q_k)
    +\widetilde b_k\cdot\nabla_\zeta \widetilde q_k
    +\widetilde c_k\widetilde q_k
    =
    \widetilde f_k^{hi}+\widetilde f_k^{cut};
    \]

    The route has five inputs on each retained chart: the static-diffusion F.11d
    form above, one bounded Lipschitz chart-metric family, the uniform
    \(L^\infty\) lower-order packet \(\widetilde b_k,\widetilde c_k\), the
    Laurent--Leautaud fixed-metric Carleman / heat-observability import, and the
    Wang--Zhang measurable-time theorem in the analytic-semigroup setting.

    D.99 upgrades the fixed-metric Carleman packet from the base operator to the
    full repaired chart operator.  D.105 identifies that chartwise interval
    observability with the installed parabolic node \(PDO\)-Carleman.  D.107 then
    uses Wang--Zhang to pass from interval observability to measurable-time
    observability on the retained windows, with
    \(\widetilde f_k^{hi}+\widetilde f_k^{cut}\) handled by the same Duhamel
    forcing ledger already tracked on this branch.  That is the windowwise \(V2\)
    packet.

    With \(D.7mr2\), \(EP.11d\), \(V1\), the scheduler / boot entrance hypotheses,
    and this repaired direct \(V2\) packet, the exact-potential branch gives

    \[
    \begin{gathered}
    \text{angular ledger estimate}+\text{forcing packet}+V1+V2\\
    \Longrightarrow \text{exact-potential readout}\\
    \Longrightarrow \text{pressure-defect conclusion}.
    \end{gathered}
    \]

    Under the already-recorded selector condition

    \[
    \int_I\lambda_J(s)\,ds\ge m_J+\eta,
    \]

    the same branch supplies the installed \(SG.4B\) handoff.  This closure is local
    to the repaired direct \(V2\) leg.  The upstream \(PSJ+\) burdens
    \(PTC\)-Lin \(+\) \(PTC\)-Shape \(\Rightarrow D.7mq\) and selector-strain
    sufficiency remain upstream of this exact-potential continuation.



    \subsection{NS External Classical Validation Note}

    This note is a citation and model-identification pass. It does not add a new
    Navier--Stokes bridge. It checks that the realized-carrier facts used earlier in
    the source-field route are standard classical infrastructure on the declared
    Euclidean surface.

    The imported facts are the usual Helmholtz--Leray projection on
    \(L^2_\sigma\) and \(H^s_\sigma\), the Stokes operator
    \(A=-\mathbb P\Delta\) with its positivity, self-adjointness, and analytic
    semigroup, the standard bilinear map
    \[
    H^1_\sigma\times H^1_\sigma\longrightarrow H^{-1}_\sigma
    \]
    together with the divergence-free cancellation, pressure recovery from the
    projected equation, Aubin--Lions--Simon compactness on \(\mathbb T^3\) and
    local compactness on \(\mathbb R^3\), and positive-time Gevrey/space
    analyticity for classical solutions.

    The standard references are Leray's 1934 Acta Mathematica paper, Temam's
    \emph{Navier--Stokes Equations}, Constantin--Foias, Simon's compactness theorem,
    Boyer--Fabrie, and the Foias--Temam and Liu Gevrey regularity papers. The point
    for this appendix is simple: D.1, D.2, D.4, and D.8a may use these facts as
    classical Navier--Stokes infrastructure. They are not theorem-local inventions
    of this proof route.

    There is one presentation constraint on the whole-space side. On
    \(\mathbb R^3\), local compactness becomes global \(L^2\) compactness only
    after the admissible energy-tail bound is kept in the same hypothesis package.
    This appendix preserves that tie whenever it invokes the realized-carrier
    compactness layer.



    \subsection{Finite Low-Shell Residual Closure Result}

    The residual closure note makes the same point as a theorem. Since
    \[
    \mathcal R_{low}(X)\le M_{low}(X),
    \]
    the desired estimate
    \[
    \mathcal R_{low}(X)\le C_{low}\Phi(\mathcal E_D(X))
    \]
    is reduced to finite low-shell amplitude domination:
    \[
    M_{low}(X)\le C_{low}\Phi(\mathcal E_D(X)).
    \]
    A readout sufficient condition is
    \[
    C_{read}\sup_{r\in I_{low}}\|X(r)\|_{H_D^s}
    \le
    C_{low}\Phi(\mathcal E_D(X)),
    \qquad
    I_{low}:=\bigcup_{j\in\mathcal L}I_j.
    \]
    This closes the finite low-shell branch only under an explicit domination
    hypothesis. The finite nature of the block reduces the problem to finitely many
    scalar amplitudes; it gives no automatic smallness by itself.



    \subsection{Gradient Coercivity Lemma (Euclidean Classical Surface)}

    This is the Euclidean fourth-bridge target.  The aim is to turn
    high-frequency gradient control into a continuation theorem on the classical
    Navier--Stokes surface.

    \[
    \partial_t u + (u\cdot\nabla)u + \nabla p = \nu\Delta u,
    \qquad \nabla\cdot u = 0,
    \]

    \[
    E_N(t) := \sum_{j\ge N} 2^{2j}\|P_j u(t)\|_{L^2_x}^2,
    \qquad
    D_N(t) := \sum_{j\ge N} 2^{4j}\|P_j u(t)\|_{L^2_x}^2.
    \]

    The original bridge wanted the coefficient

    \[
    \mathcal{L}_N(t)
    :=
    1 + \sum_{k\le N-4} 2^{3k/2}\|P_k u(t)\|_{L^2_x}.
    \]

    That is the clean declared surface.  The repaired packet algebra currently
    lands on the stronger gradient coefficient

    \[
    \Lambda_N(t)
    :=
    1+\sum_{k\le N-4}2^{5k/2}\|P_ku(t)\|_{L^2_x},
    \qquad
    \Theta_N^\sharp(t)
    :=
    2^{3N}\sum_{|m-N|\le M}\|P_mu(t)\|_{L^2_x}^2.
    \]

    So the live coercivity operator is

    \[
    \widetilde{\mathfrak G}_N^\sharp[u](t)
    :=
    \frac{d}{dt}E_N(t)
    +(1-\eta)\nu D_N(t)
    -C\bigl(\Lambda_N(t)+\Theta_N^\sharp(t)\bigr)E_N(t).
    \]

    The status is conditional and exact.  If the remaining high-side remainder
    satisfies

    \[
    \mathfrak H_N^{grad}(t)
    \le
    \eta\nu D_N(t)+C_*2^{-2\delta N},
    \]

    on the same Euclidean equation surface, then

    \[
    \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
    \le
    C\bigl(\Lambda_N(t)+\Theta_N^\sharp(t)\bigr)E_N(t)
    +C_*2^{-2\delta N}.
    \]

    For fixed \(N\), the upgraded coefficient is admissible on finite intervals
    under the classical energy bound.  Gronwall then gives bounded \(E_N(t)\), and
    the low-frequency completion lemma below turns that into bounded
    \(\|\nabla u(t)\|_{L^2_x}\).

    The open part is the lifted high-side remainder in \((GC.6)\).  A separate
    low-mode strain theorem would be needed to return the bridge to the weaker
    \(\mathcal L_N\) surface.



    \subsection{Jet Substitution And Exponential Closure Note}

    This note formalizes the brute-force catalogue-and-substitute idea. Store each
    differentiated Navier--Stokes identity, substitute lower-order identities into
    higher mixed terms, and treat the still-unresolved mixed transport content as
    the defect. Its main output is that the brute-force procedure has a clean
    generating-series wrapper.

    \[
    V_n := \partial_t^n u,
    \qquad
    P_n := \partial_t^n p.
    \]

    \[
    L_n := \nu\Delta V_n - \nabla P_n,
    \]

    \[
    M_n := \sum_{k=0}^{n}\binom{n}{k}\,(V_k\cdot\nabla)V_{n-k}.
    \]

    \[
    V_{n+1} = L_n - M_n.
    \]

    After \(d\) substitution rounds at layer \(N+1\), the algorithm gives

    \[
    V_{N+1}=R_{N+1}^{(d)}+D_{N+1}^{(d)}.
    \]

    \(R_{N+1}^{(d)}\) is the resolved part, and
    \(D_{N+1}^{(d)}\) is exactly the part that still contains at least one mixed
    transport block. The defect is the recursive stored lower-order transport debt.

    The first layer is

    \[
    V_1 = L_0 - (V_0\cdot\nabla)V_0,
    \]

    and every higher layer imports lower splits through the binomial spread. The
    global wrapper is the exponential jet series

    \[
    \mathcal V_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}V_n,
    \qquad
    \mathcal P_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}P_n.
    \]

    The binomial coefficients collapse into the product law

    \[
    \sum_{n\ge0}\frac{\rho^n}{n!}
    \sum_{k=0}^n\binom{n}{k}(V_k\cdot\nabla)V_{n-k}
    =
    (\mathcal V_\rho\cdot\nabla)\mathcal V_\rho,
    \]

    So

    \[
    \partial_t\mathcal V_\rho
    +
    (\mathcal V_\rho\cdot\nabla)\mathcal V_\rho
    +
    \nabla\mathcal P_\rho
    =
    \nu\Delta\mathcal V_\rho.
    \]

    This converts the combinatorial explosion into a quadratic convolution law in
    a weighted jet Banach algebra. The theorem debt is still real: one must prove
    that the substitution defect vanishes, contracts, telescopes, or is summably
    dominated in the chosen norm. This note supplies the right algebraic wrapper;
    it does not by itself prove global domination.


