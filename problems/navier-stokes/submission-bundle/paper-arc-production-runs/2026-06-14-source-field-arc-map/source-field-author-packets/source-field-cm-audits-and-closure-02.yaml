      \subsection{NS External Classical Validation Note}

      This note is a citation and model-identification pass. It does not add a new
      Navier--Stokes bridge. It checks that the realized-carrier facts used earlier in
      the source-field route are standard classical infrastructure on the declared
      Euclidean surface.

      The imported facts are the usual Helmholtz--Leray projection on
      \(L^2_\sigma\) and \(H^s_\sigma\), the Stokes operator
      \(A=-\mathbb P\Delta\) with its positivity, self-adjointness, and analytic
      semigroup, the standard bilinear map
      \[
      H^1_\sigma\times H^1_\sigma\longrightarrow H^{-1}_\sigma
      \]
      together with the divergence-free cancellation, pressure recovery from the
      projected equation, Aubin--Lions--Simon compactness on \(\mathbb T^3\) and
      local compactness on \(\mathbb R^3\), and positive-time Gevrey/space
      analyticity for classical solutions.

      The standard references are Leray's 1934 Acta Mathematica paper, Temam's
      \emph{Navier--Stokes Equations}, Constantin--Foias, Simon's compactness theorem,
      Boyer--Fabrie, and the Foias--Temam and Liu Gevrey regularity papers. The point
      for this appendix is simple: D.1, D.2, D.4, and D.8a may use these facts as
      classical Navier--Stokes infrastructure. They are not theorem-local inventions
      of this proof route.

      There is one presentation constraint on the whole-space side. On
      \(\mathbb R^3\), local compactness becomes global \(L^2\) compactness only
      after the admissible energy-tail bound is kept in the same hypothesis package.
      This appendix preserves that tie whenever it invokes the realized-carrier
      compactness layer.


