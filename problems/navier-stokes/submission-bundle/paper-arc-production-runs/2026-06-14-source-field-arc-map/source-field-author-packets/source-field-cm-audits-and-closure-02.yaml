      \subsection{Gradient Coercivity Lemma (Euclidean Classical Surface)}

      This is the Euclidean fourth-bridge target.  The aim is to turn
      high-frequency gradient control into a continuation theorem on the classical
      Navier--Stokes surface.

      \[
      \partial_t u + (u\cdot\nabla)u + \nabla p = \nu\Delta u,
      \qquad \nabla\cdot u = 0,
      \]

      \[
      E_N(t) := \sum_{j\ge N} 2^{2j}\|P_j u(t)\|_{L^2_x}^2,
      \qquad
      D_N(t) := \sum_{j\ge N} 2^{4j}\|P_j u(t)\|_{L^2_x}^2.
      \]

      The original bridge wanted the coefficient

      \[
      \mathcal{L}_N(t)
      :=
      1 + \sum_{k\le N-4} 2^{3k/2}\|P_k u(t)\|_{L^2_x}.
      \]

      That is the clean declared surface.  The repaired packet algebra currently
      lands on the stronger gradient coefficient

      \[
      \Lambda_N(t)
      :=
      1+\sum_{k\le N-4}2^{5k/2}\|P_ku(t)\|_{L^2_x},
      \qquad
      \Theta_N^\sharp(t)
      :=
      2^{3N}\sum_{|m-N|\le M}\|P_mu(t)\|_{L^2_x}^2.
      \]

      So the live coercivity operator is

      \[
      \widetilde{\mathfrak G}_N^\sharp[u](t)
      :=
      \frac{d}{dt}E_N(t)
      +(1-\eta)\nu D_N(t)
      -C\bigl(\Lambda_N(t)+\Theta_N^\sharp(t)\bigr)E_N(t).
      \]

      The status is conditional and exact.  If the remaining high-side remainder
      satisfies

      \[
      \mathfrak H_N^{grad}(t)
      \le
      \eta\nu D_N(t)+C_*2^{-2\delta N},
      \]

      on the same Euclidean equation surface, then

      \[
      \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
      \le
      C\bigl(\Lambda_N(t)+\Theta_N^\sharp(t)\bigr)E_N(t)
      +C_*2^{-2\delta N}.
      \]

      For fixed \(N\), the upgraded coefficient is admissible on finite intervals
      under the classical energy bound.  Gronwall then gives bounded \(E_N(t)\), and
      the low-frequency completion lemma below turns that into bounded
      \(\|\nabla u(t)\|_{L^2_x}\).

      The open part is the lifted high-side remainder in \((GC.6)\).  A separate
      low-mode strain theorem would be needed to return the bridge to the weaker
      \(\mathcal L_N\) surface.


