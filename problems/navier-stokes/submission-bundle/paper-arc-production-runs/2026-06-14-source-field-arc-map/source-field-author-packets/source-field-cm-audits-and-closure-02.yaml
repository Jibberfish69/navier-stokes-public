    text: |+
      \subsection{Jet Substitution And Exponential Closure Note}

      This note formalizes the brute-force catalogue-and-substitute idea. Store each
      differentiated Navier--Stokes identity, substitute lower-order identities into
      higher mixed terms, and treat the still-unresolved mixed transport content as
      the defect. Its main output is that the brute-force procedure has a clean
      generating-series wrapper.

      \[
      V_n := \partial_t^n u,
      \qquad
      P_n := \partial_t^n p.
      \]

      \[
      L_n := \nu\Delta V_n - \nabla P_n,
      \]

      \[
      M_n := \sum_{k=0}^{n}\binom{n}{k}\,(V_k\cdot\nabla)V_{n-k}.
      \]

      \[
      V_{n+1} = L_n - M_n.
      \]

      After \(d\) substitution rounds at layer \(N+1\), the algorithm gives

      \[
      V_{N+1}=R_{N+1}^{(d)}+D_{N+1}^{(d)}.
      \]

      \(R_{N+1}^{(d)}\) is the resolved part, and
      \(D_{N+1}^{(d)}\) is exactly the part that still contains at least one mixed
      transport block. The defect is the recursive stored lower-order transport debt.

      The first layer is

      \[
      V_1 = L_0 - (V_0\cdot\nabla)V_0,
      \]

      and every higher layer imports lower splits through the binomial spread. The
      global wrapper is the exponential jet series

      \[
      \mathcal V_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}V_n,
      \qquad
      \mathcal P_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}P_n.
      \]

      The binomial coefficients collapse into the product law

      \[
      \sum_{n\ge0}\frac{\rho^n}{n!}
      \sum_{k=0}^n\binom{n}{k}(V_k\cdot\nabla)V_{n-k}
      =
      (\mathcal V_\rho\cdot\nabla)\mathcal V_\rho,
      \]

      So

      \[
      \partial_t\mathcal V_\rho
      +
      (\mathcal V_\rho\cdot\nabla)\mathcal V_\rho
      +
      \nabla\mathcal P_\rho
      =
      \nu\Delta\mathcal V_\rho.
      \]

      This converts the combinatorial explosion into a quadratic convolution law in
      a weighted jet Banach algebra. The theorem debt is still real: one must prove
      that the substitution defect vanishes, contracts, telescopes, or is summably
      dominated in the chosen norm. This note supplies the right algebraic wrapper;
      it does not by itself prove global domination.


