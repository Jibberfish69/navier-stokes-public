      \subsection{Theorem D.5: Clay Theorem Integration}

      D.5 is the projected-lane composition theorem.  It becomes a route-local final
      theorem when the preceding four slots are certified on the same surface.  The
      theorem file states the composition as
      \[
      \begin{aligned}
      &\text{local projected-flow well-posedness}\\
      &\quad\longrightarrow \text{global coercive estimate}\\
      &\quad\longrightarrow \text{exact shadow descent}\\
      &\quad\longrightarrow \text{continuation from carrier control}.
      \end{aligned}
      \]
      Under those inputs, every finite-time singularity for the projected local
      Navier--Stokes window would force blow-up of the carrier norm
      \(\|X(t)\|_{\mathcal N}\).  Every uniform \(C^1\)-bound on the projected window
      forces bounded carrier control and hence continuation.  In the theorem file's
      short form,
      \[
      \text{finite-time breakdown of the local window}
      \quad\Longrightarrow\quad
      \limsup_{t\uparrow T_*}\|X(t)\|_{\mathcal N}=\infty.
      \]

      The route-local Clay statement adds the whole-space and datum hypotheses:
      \[
      u_0\in C_c^\infty(\mathbb R^3),
      \qquad
      \nabla\cdot u_0=0,
      \]
      and draws a global smooth classical solution once D.1--D.4 and the exact lift
      package are all available on the same chain.  The live paper keeps that order
      visible:
      \[
      \text{ontic theorem first}
      \quad\longrightarrow\quad
      \text{exact lift second}
      \quad\longrightarrow\quad
      \text{classical theorem as corollary third}.
      \]

      This projected NC-flow route sits beside the source-grounded four-bridge route
      inside the main submission.  It is a second theorem track that recasts the
      anti-blowup burden in projected-flow language.  The manuscript can use it as a
      warrant by showing its same-surface hypotheses, its strict readout branch, and
      its relation to the four-bridge route.  That is the reader-facing boundary:
      D.5 packages a strong route-local theorem chain, and the public Clay-facing
      paper must explain how that chain sits beside, supports, or coincides with the
      main proof route.


