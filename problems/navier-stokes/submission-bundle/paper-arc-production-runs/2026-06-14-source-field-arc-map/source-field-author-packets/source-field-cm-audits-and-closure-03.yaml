    text: |+
      \subsection{LPAS Closure Blocked By Square-Source}

      Lower-prefix dualization reduces LPAS to active-square upper-tail Carleson.
      That theorem remains blocked because the single-shell active-square estimate
      requires the source estimate for \(F_j\), and the universal source estimate
      fails by cubic amplitude scaling.

      LPAS remains open. The live alternatives are a valid source estimate on active
      intervals, active-shell amplitude normalization, direct active-square Carleson,
      or a direct LPAS proof.


