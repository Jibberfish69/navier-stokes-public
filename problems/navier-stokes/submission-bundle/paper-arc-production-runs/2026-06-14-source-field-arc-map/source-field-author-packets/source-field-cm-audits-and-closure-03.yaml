    text: |+
      \subsection{Aact Kx Global Nojump Restart Scheduler Closure Dtc A}

      The restart scheduler closes after reanchoring. At each scheduler restart, the
      proof chooses a fresh same-fluid SCF-good cylinder from the finite
      no-\(\mathrm{Jump}_{avg}\) terminal cover and shrinks it by the \(ATD_m\)
      factor. The seed is

      \[
      X_{\alpha,j,p}(\tau_\alpha)\le\eta_X
      \]

      \[
      B_*\in L^1,\qquad F_*\in L^1.
      \]

      \[
      \left(\eta_X+\int_{I_\alpha}F_*\right)
      \exp\left(\int_{I_\alpha}B_*\right)
      \le2\eta_X.
      \]

      \[
      X_{\alpha,j,p}\in L^\infty,
      \qquad
      N_{\alpha,j,p}\in L^1,
      \qquad
      \mathcal K_{\le m,\alpha,j,p}^{avg}\in L^1.
      \]

      This supplies the good-side averaged receiver spine. It does not eliminate the
      complementary jump branch. The branch-native no-escape theorem still needs
      same-charge lower production and scale-normalized upper control.


