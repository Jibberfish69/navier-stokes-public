    text: |+
      \subsection{Avg Main Read End Pointwise Endpoint Closure}

      Once the averaged route has produced the averaged endpoint package, terminal
      readout recovers the old pointwise endpoint package on a finite positive-scale
      same-fluid cover:

      \[
      End_{NS,avg}.
      \]

      The readout cover has positive lower scale, and the SCF base is below the
      \(m\)-threshold on each cover element.  The local \(ATD_m\) theorem then applies
      on the shrunken cover elements, giving the old pointwise endpoint packet there.

      The bridge conclusion is deliberately narrow. It does not construct the cover;
      it states what the averaged route may conclude once the cover has been selected.


