    text: |+
      \subsection{LPAS Active-Square Closure Attempt}

      The direct LPAS closure attempt starts from

      \[
      \mathcal P_j^\downarrow(t)=\sum_{k\le j-C_1}E_k(t),
      \qquad
      D_j(t)=2^{2j}E_j(t).
      \]

      \[
      \mathcal P_j^\downarrow 2^{-j}D_j^2.
      \]

      \[
      \mathcal P_j^\downarrow 2^{-j}D_j\le \varepsilon\nu.
      \]

      This is an active-shell amplitude condition. Baseline energy and dissipation
      control \(D_j\) only in the integrated sense; LPAS needs \(D_j\) with the lower
      prefix as a weight.

      \[
      \mathcal P_j^\downarrow(t)\le \|\nabla u(t)\|_2^2
      \]

      \[
      \sum_{j\ge N}2^{-j}D_j^2.
      \]

      Thus the crude collapse leaves a product problem rather than an absorption estimate.

      This is a lower-prefix times active-square object. The installed upper-tail
      queues act in the opposite orientation and cannot directly absorb it.

      The far-corona closure remains conditional on LPAS, CTS, F2S, or DER+EP. The
      tail reserve and weighted carrier closure inherit this conditional state.


