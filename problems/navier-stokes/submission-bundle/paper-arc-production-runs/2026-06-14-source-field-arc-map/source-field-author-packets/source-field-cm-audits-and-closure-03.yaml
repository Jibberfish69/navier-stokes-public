      \subsection{Lifted Packet Closure Result}

      The lifted packet has now been separated into same-scale pieces and the
      large-gap far-corona piece:

      \[
      \mathfrak H_N^{grad,lift}
      \Longrightarrow
      \mathfrak B_N^{upper}
      +
      \Pi_N^{mov\text{-}spill,L}
      +
      \Pi_N^{mid,far,L}.
      \]

      The upper-boundary and moving-spill packets reduce to finite same-scale edge
      packets. On the weighted carrier route they are controlled by the same-scale
      factor

      \[
      \widetilde\Lambda_N^\sharp E_N.
      \]

      \[
      \begin{aligned}
      \mathrm{CTS}&\Longrightarrow \mathrm{FCTS}
      \Longrightarrow \mathrm{Car}
      \Longrightarrow \mathrm{FC},\\
      \mathrm{LPAS}&\Longrightarrow \mathrm{FC}
      \quad\text{on the fallback dyadic route.}
      \end{aligned}
      \]

      The \(CTS/FCTS/Car/FC/LPAS\) chain remains the external far-corona burden. The
      local result isolates the exact lifted-packet theorem left after same-scale
      reabsorption into the weighted carrier surface.


