      \subsection{Lifted Packet Three-Piece Closure Program}

      \[
      \mathfrak B_N^{upper},
      \qquad
      \Pi_N^{mov\text{-}spill,L},
      \qquad
      \Pi_N^{mid,far,L}.
      \]

      Once these three estimates are paid, the lifted packet is absorbable and the
      weighted leakage theorem closes.

      \[
      \begin{aligned}
      \text{lifted packet}
      &\Longrightarrow
      \mathfrak B_N^{upper}
      +
      \Pi_N^{mov\text{-}spill,L}
      +
      \Pi_N^{mid,far,L},\\
      \mathfrak H_N^{grad,lift}
      &\le C_{\mathrm{sf},11143}
      |\mathfrak B_N^{upper}|
      +
      \Pi_N^{mov\text{-}spill,L}
      +
      \Pi_N^{mid,far,L}.
      \end{aligned}
      \]

      The upper boundary is a finite-width frozen same-scale packet near \(N\).
      Moving spill has already been reduced to fixed-offset same-scale edge packets.
      Those two are controlled on the weighted carrier route, even though the
      stronger coefficient-free same-scale theorem remains a separate possible
      upgrade.

      The hard part is the far-corona packet:

      \[
      \Pi_N^{mid,far,L}
      \Longleftarrow
      \mathrm{Car}
      \Longleftarrow
      \mathrm{FCTS}
      \Longleftarrow
      \mathrm{CTS},
      \]

      \[
      \mathrm{CTS}
      \Longrightarrow
      \mathrm{FCTS}
      \Longrightarrow
      \mathrm{Car}
      \Longrightarrow
      \text{(FC)}.
      \]

      This is the current stop status for the lifted packet. Same-scale pieces have
      been reduced to the weighted carrier side. The only genuine large-gap theorem
      still visible here is the far-corona route, written as CTS/FCTS/Car/FC or,
      equivalently on the fallback dyadic side, LPAS.


