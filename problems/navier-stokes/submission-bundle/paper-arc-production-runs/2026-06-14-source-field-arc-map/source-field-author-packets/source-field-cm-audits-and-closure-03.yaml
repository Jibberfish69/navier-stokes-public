      \subsection{Localized Projector-Moment Dynamics And Moment Closure}

      The sharper support surface for the same branch is projector-moment dynamics.
      A direct transport comparison

      \[
      \|\widetilde S_J-S_J^N\|_{\mathrm{op}}/g_J^{str}\to 0
      \]

      is too strong as a first principle. The raw symmetric cocycle-side block is

      \[
      S_J^N=\frac12\bigl(A_J^N+(A_J^N)^*\bigr).
      \]

      The localized projector-moment tensor \(\widetilde S_J\) is instead a
      nonnegative average of rank-one pair projectors. It is positive semidefinite,
      and its trace is the local packet mass. Those projectors evolve by an averaged
      Riccati-type law, so \(\widetilde S_J\) has its own dynamics; it is not allowed
      to inherit the principal evolution of \(S_J^N\) for free.

      The correct supplier target has two parts:

      \[
      \begin{aligned}
      &\text{derive the exact averaged projector evolution of }\widetilde S_J,\\
      &\text{close the nonlinear moment term against the top slot.}
      \end{aligned}
      \]

      On a fixed transported packet window the exact PSJ+.1 construction writes

      \[
      \widetilde S_J(x,t)
      :=
      \int_{\mathcal P_J(x)}
      a_J(x,p,t)\,P_J(x,p,t)\,d\bar\nu_{J,x}(p)
      +
      \mathrm{Tail}_J(x,t),
      \]

      \[
      P_J(x,p,t)=e_J(x,p,t)\otimes e_J(x,p,t)
      \]

      \[
      m_J(x,t):=
      \int_{\mathcal P_J(x)} a_J(x,p,t)\,d\bar\nu_{J,x}(p).
      \]

      On the exact-potential subbranch using Proposition PSJ+.5, the pair separation
      law is exact, so the pair-projector transport residual
      \(E_J^{pair}\) vanishes. The remaining work is the averaged dynamics of the
      weights, the tail term, and the nonlinear moment closure recorded next.


