    text: |+
      \subsection{LPAS Closure Blocked By Active-Square Amplitude Gap}

      \[
      dM_k(t)=\left(\sum_{j\ge\max(N,k+C_1)}2^{-j}D_j(t)^2\right)dt.
      \]

      The source-mass route gives interval control of the lifted source only after the
      upper-tail carrier estimate. The active-square theorem still requires a
      shell-amplitude gain or a source estimate.

      \[
      \int_I
      \sum_{j\ge\max(N,k+C_1)}2^{-j}D_j(t)^2dt
      \le
      \varepsilon\nu2^{2k}|I|+C2^{-2\delta\max(N,k)}.
      \]

      Equivalently, the route needs either a direct LPAS theorem or a shell-amplitude
      theorem strong enough to control \(2^{-j}D_j(t)^2\).


