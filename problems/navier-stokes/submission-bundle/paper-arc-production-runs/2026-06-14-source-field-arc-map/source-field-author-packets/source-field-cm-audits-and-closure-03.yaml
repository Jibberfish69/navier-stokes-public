author_contract:
  chunk_id: source-field-cm-audits-and-closure-03
  must_write:
  - finished TeX prose for every source span in this chunk
  - plain reader-facing explanation before compressed notation
  - proof, support, obstruction, obsolete material, contradiction, or open continuation
    status for each source result
  - Pack, Part, or Field role when the source touches CM class exit
  - gold direct-route status only where the source actually supplies or obstructs
    that route
  - CM counterpart where a gold obstruction or source-field endpoint enters the class-exit
    argument
  must_criticize:
  - attack the strongest claim in the replacement
  - name the exact sentence where a reader could lose the thread
  - name any unpaid derivation that remains, or say why it is paid on the page
  - record a repair decision before integration
  must_not_write:
  - raw note dump
  - internal automation voice
  - free-running theorem search
  - confidence language that hides an open derivation
  allowed_endpoint_statuses:
  - proved in this arc
  - support for a named later proof step
  - gold obstruction
  - silver CM face payment
  - obsolete or superseded with reason
  - logical contradiction
  - open continuation with exact missing derivation
math_containment_rule: no free-running theorem pursuit; math work may enter only as
  TeX-ready derivation, exact obstruction, endpoint status, or CM counterpart for
  a named source sentence in this chunk
