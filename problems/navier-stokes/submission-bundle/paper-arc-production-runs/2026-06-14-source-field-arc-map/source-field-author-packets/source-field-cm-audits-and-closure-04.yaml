      \subsection{B ASAC Temporal-Thickness Or Rigid-Subclass Attempt}

      This is the same obstruction viewed from the two possible upgrades.  The class
      B ASAC organizes the terminal equality/tangent survivor for the ASAC defect
      measure.  The missing temporal upgrade would imply

      \[
      \mu_m^{src}(B_R\times[-\varepsilon,0])
      \le C_R\varepsilon^{1-1/p}+o_m(1),
      \]

      and hence

      \[
      \mu_*^{src}(B_R\times\{0\})=0.
      \]

      The installed axioms do not supply that gain.  A zero-thickness source atom may
      carry finite \(L_s^1\) mass while its \(L_s^p\) norm diverges for every \(p>1\).
      The pressure/eigenframe supports are near-band signed-current support; they do
      not create temporal thickness for the full source-weighted positive carrier.

      B ASAC is useful as an equality/tangent class, and it is too broad for terminal
      atom exclusion.  This branch still needs either temporal thickness inside B
      ASAC or a genuinely rigid subclass with a source-residue Liouville theorem.


