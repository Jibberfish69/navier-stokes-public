      \subsection{Direct Aact Kx Local Classical Variables}

      \[
      Q_R^\Phi=
      \{(x,t):x=c(t)+RA(t)y,\\ |y|<1,\\ |t-t_0|<R^2\},
      \]

      \[
      w_R(x,t)=u(x,t)-u_R(t)-B_R(t)(x-c(t)),
      \]

      where u R(t) and B R(t) are chosen by the usual zeroth and first moment conditions against a transported cutoff psi R. Define

      \[
      X_R(t)=R^{-2}\int |w_R|^2\psi_R(x,t)\,dx
      \]

      The affine-subtracted Navier-Stokes equation is tested against w R psi R. The transport frame is

      \[
      V_R^{frame}(x,t)=c'(t)+\dot A(t)A(t)^{-1}(x-c(t)).
      \]

      \[
      \partial_t+u\cdot\nabla
      =
      \partial_t+V_R^{frame}\cdot\nabla +(u-V_R^{frame})\cdot\nabla.
      \]

      The first two terms differentiate the moving cutoff and the affine frame; their coefficients are bounded by the frame record. The last term is controlled by the affine residual. This gives the transport/cutoff contribution


