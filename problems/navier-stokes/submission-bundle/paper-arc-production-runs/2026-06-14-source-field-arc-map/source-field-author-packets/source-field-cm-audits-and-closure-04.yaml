      \subsection{B ASAC Atom Escape Dichotomy Closure Route}

      The useful closure route is one coordinated dichotomy theorem. It would keep
      the positive source-weighted carrier through the adjoint identity and force any
      nonzero terminal source atom to show itself in one of the live exits:

      \[
      \mu_*^{src}(B_R\times\{0\})>0,
      \qquad
      \langle \mu_m^{src},\psi_m\rangle \to c_0>0,
      \]

      \[
      \langle \mu_m^{src},\psi_m\rangle
      =
      Flux_{tr,cyl,m}
      +
      Residence_{m}
      +
      P_{\mathrm{eig},m}
      +
      L_{\mathrm{legal},m}+o_m(1).
      \]

      The three nontrivial exits are

      \[
      \boxed{Flux_{tr,cyl}>0},
      \qquad
      \boxed{Residence>0},
      \qquad
      \boxed{P_{\mathrm{eig}}>0}.
      \]

      This route is sharper than the older split because a single theorem coordinates
      no-incoming source-drain, temporal residence, and pressure/eigenframe sustain.
      It is not installed yet. The current theorem target is the positive-source
      adjoint escape identity in the source-weighted positive topology.


