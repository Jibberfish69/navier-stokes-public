      \subsection{B ASAC Rigid-Subclass Or Temporal-Thickness Attempt}

      B ASAC records terminal equality/tangent organization for the ASAC defect
      measure.  To exclude a terminal source atom from that class, the route needs
      one extra structure.  One option is a rigid subclass with a residue Liouville
      theorem.  The other option is temporal thickness for the positive source
      measure.

      The temporal-thickness target is an \(L_s^p\) bound with \(p>1\):

      \[
      \left\|
      \|F_m^{src,+}(s,\cdot)\|_{\mathcal M(B_R)}
      \right\|_{L_s^p((-1,0))}
      \le C_R,
      \qquad p>1.
      \]

      Such a bound gives

      \[
      \mu_m^{src}(B_R\times[-\varepsilon,0])
      \le C_R\varepsilon^{1-1/p}+o_m(1),
      \]

      and rules out a terminal time-face atom in the limit.  The installed B ASAC
      production does not give this \(L_s^p\) gain.  It gives finite \(L_s^1\) source
      mass and terminal equality geometry, and finite \(L_s^1\) mass still permits
      terminal-face concentration.


