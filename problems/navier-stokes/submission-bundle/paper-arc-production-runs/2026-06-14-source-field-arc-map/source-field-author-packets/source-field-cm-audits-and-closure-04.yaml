      \subsection{Classical Closure Warrant Final Pass}

      The final pass is the same conditional continuation step, stated in compressed
      form. For smooth divergence-free zero-mean data on \(\mathbb T^3\), with
      zero force and \(\nu>0\), the remaining burden is the uniform \(H^s\) bound:

      \[
      \mathbb T^3,
      \qquad
      f=0,
      \qquad
      \nu>0,
      \qquad
      u_0^{\mathrm{vel}}=u_0\in C^\infty(\mathbb T^3),
      \qquad
      \nabla\cdot u_0=0,
      \qquad
      \int_{\mathbb T^3}u_0\,dx=0.
      \]

      \[
      CM_{N,r,Q}:=Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]

      Periodic Navier-Stokes local theory in \(H^s(\mathbb T^3)\) gives a lifespan
      depending only on this bound. Relaunching at times
      \(t_j\uparrow T_*\) extends the solution past any finite \(T_*\), and
      uniqueness identifies the relaunched solution with the original one on the
      overlap.

      \[
      T_* = \infty.
      \]

      This is a final-use warrant for the uniform bound, not an independent proof of
      that bound.


