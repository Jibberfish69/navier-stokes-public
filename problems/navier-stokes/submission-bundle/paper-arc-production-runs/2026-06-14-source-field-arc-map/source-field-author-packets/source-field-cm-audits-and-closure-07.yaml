      direct attempt. The cancellation-class route collapses to either weak cancellation,
      which is insufficient, or strong native cancellation, which is exactly the desired
      contradiction.\n\nAfter Zeno Compactness Extraction.A, produce a rigid cancellation
      class for the ancient source-residue limit\n\n\\[\n(u_*,p_*,\\mu_*^{src})\n\\]\n\n\\[\n\\mu_*^{src}(Q_1^-)\\ge
      c_0>0\n\\]\n\n\\[\n\\mu_*^{src}=\text{weak-* limit of positive active source
      residues}.\n\\]\n\n\\[\n\\mu_*^{src}=0.\n\\]\n\n\\[\n\\int \\varphi\\,d\\mu_*^{src}=0\n\\qquad
      \\forall \\varphi\\ge0.\n\\]\n\nIt is the contradiction itself. Treating it
      as an independently produced rigid class reverses the proof burden. Producing
      it from a surviving Zeno branch would already prove the source-pulse exclusion
      theorem.\n\nThe remaining option is to prove that the Zeno limit belongs to
      a concrete rigid class B, for example Type I, finite global ancient energy,
      critical smallness, bounded vorticity, self-similar, two-dimensional, axisymmetric,
      or another explicit class with a source-residue Liouville theorem.\n\nThe audited
      candidates are not produced by current inputs. The direct Type I attempt also
      fails: refill-Zeno geometry controls scale/time ancestry, not amplitude. Local
      energy compactness gives an ancient local suitable object and preserves nonzero
      residue. Same-fluid transport preserves carrier fidelity. These inputs supply
      no rigid ancient class.\n\n\n"
