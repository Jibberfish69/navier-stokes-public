      \subsection{Clay problem Ancestry Drain / Liouville Alternatives Direct Audit Note}

      The drain theorem would say that every legal source-parent step either spends a fixed positive amount of a finite route reserve or strictly improves a bounded terminal charge. Then an infinite same-fluid ancestry chain is impossible.

      The installed reserves do not prove this. Energy dissipation is first-moment control, not a price for every scale-normalized source-balanced step. The mixed-boundary and active- reserves were already tested in the pulse-charge and active- audits and do not price a terminal pulse whose nonlinear source refills the active shell. The source-parent axioms themselves also leave loss/charge as a theorem requirement, not an installed fact.

      Here $\mathcal B$ denotes one of the rigid classes available to the Liouville
      alternative: bounded ancient, Type I, critical-small, self-similar,
      two-dimensional, axisymmetric, or an equivalent rigidity class.

      \[
      \mathcal B
      \Longrightarrow
      \gamma_\ast\,d\mu_\ast^\sigma=0.
      \]

      The installed compactness machinery gives local suitable limits after the source-residue packet is localized. It does not provide a global bounded ancient hypothesis, Type I control, critical smallness, self-similarity, axisymmetry, or a theorem that the inherited source residue vanishes. The ancient limit is precisely allowed to carry the active source residue unless a new rigidity theorem excludes it.

      The drain and Liouville alternatives are not consequences of the installed energy, local-energy, compactness, same-fluid geometry, or source-supplier surfaces.


