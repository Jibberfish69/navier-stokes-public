    Thus minimality proves the finite/non-Zeno part of the escape theorem, which is already supplied by Local Donor Balance.A + Entrance Leaf Decay.A. The remaining case is exactly terminal Zeno refill.

    The local energy and source-residue compactness controls give finite terminal source mass on compact cylinders. They do not distinguish a diffuse near-terminal source layer from a terminal atom.

    \[
    g_m(s)=m\,1_{(-1/m,0]}(s).
    \]

    At the level of available temporal information, this has bounded L 1 s mass and converges to a terminal atom. No earlier fixed slice carries a stable amount of mass. So raw source mass and first-pulse minimality do not force an escape.

    Zero ASAC-paid defect removes the active-alignment / pair-weight charge that ASAC already controls. A nonzero terminal source atom can still remain in the native positive source carrier after that paid defect is gone.

    The pressure-Hessian and eigenframe-turnover attempts confirm the same structure: pointwise strain or pressure identities do not give a one-sided sign law on selected terminal packets. Their signed partner routes return to partner retention, legal exit, donor depletion, or terminal temporal anti-atom rigidity.

    \[
    \int \Phi_T\,d\mu_\ast^{src}.
    \]

    This is the object to be eliminated. The identity so becomes a source-parent-or-charge identity, not a homogeneous contradiction. The available first-pulse license removes selected source parents but does not remove terminal source charge.

    This is the current smallest non-circular closure target for Positive Remainder Depletion.A on the no-free-sink route.



    \subsection{Clay problem BASAC Branch-Entropy Reserve / Two-Tower Donor-Depletion Direct Attempt}

    \[
    \pi_P=\frac{1}{M}\sum_{\alpha=1}^{M}\delta_{P^-_\alpha}.
