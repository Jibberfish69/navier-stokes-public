      \operatorname{div}J(P)
      \right]_+
      =F.
      \]

      \[
      \sum_P[\operatorname{div}J(P)]_+
      \le C_{\mathrm{sf},33787}
      Flux^+_{\partial\mathcal T}
      +
      \text{heat action}
      \]

      In the Navier--Stokes packet record, the internal sink is a donor packet with negative signed exchange. The positive terminal packet can receive energy by inviscid transfer from that donor before any viscous heat edge is crossed.

      The current attempt shows that Cycle Heat Action.A also needs this kind of input. Without it, internal sink-to-source paths survive as free inviscid exchange paths and are not forced through heat action.

      First-pulse selection prunes earlier positive arrivals. It does not by itself prune an internal negative source sink that transfers stored donor energy into the terminal active packet. Charging that sink is precisely the donor-depletion / signed-saturation problem.


