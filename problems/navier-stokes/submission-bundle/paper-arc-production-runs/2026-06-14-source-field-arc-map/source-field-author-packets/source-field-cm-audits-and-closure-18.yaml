      \subsection{Clay problem Cycle Heat Action.A Direct Attempt: No-Free-Sink Obstruction}

      The obstruction is not the algebraic skew-current record. The obstruction is that positive terminal divergence can be fed by an internal source-current sink without first crossing a viscous heat edge. Thus the parabolic-current route needs a new no-free-sink / terminal signed-saturation theorem before it becomes a genuine proof of Scale Critical Tree Carleson.A.

      The intended idea was that an internal terminal positive source-current cycle must pay viscous heat action.

      Boundary-fed paths are paid by Flux + T . Cycles with a genuine temporal heat leg may be paid by D P. But a positive divergence node need not be fed by a cycle. It may be fed by a path starting at an internal sink.

