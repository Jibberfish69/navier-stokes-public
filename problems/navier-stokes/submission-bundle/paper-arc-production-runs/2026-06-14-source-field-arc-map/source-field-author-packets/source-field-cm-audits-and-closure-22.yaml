      \subsection{Clay problem Full Linearized Response Adjoint Packet.A Attempt}

      This should give Bessel, parent-kernel, and lower-frame detection for adjoint packets solving the full localized linearized response adjoint.

      \[
      u^{lo}:=u_{\le j-M}.
      \]

      \[
      R^{hi-coeff}
      =
      \mathbb P((u-u^{lo})\cdot\nabla Z+Z\cdot\nabla(u-u^{lo})).
      \]

      \[
      \mathcal C_T^{lin}(a,b)
      :=
      \int_a^b
      \left(
      r_T^2\|\nabla^2u^{lo}\|_\infty
      +r_T\|\nabla^2u^{lo}\|_\infty
      +r_T\|\nabla B^{lo}\|_\infty
      \right)dt,
      \]

      \[
      B^{lo}:=\nabla u^{lo}.
      \]

      \[
      \mathcal C_T^{lin}(t_-,t_+)\le\varepsilon_M.
      \]

      and admit the same parent-kernel decomposition and terminal lower-frame detection as the installed projected affine adjoint packets.

      In the pulled-back frame, the adjoint equation becomes anisotropic heat plus a perturbation E T whose L t 1(H 1->H -1 ) norm is bounded by C C T lin . On coefficient-good tiles this is bounded by \(C_{\mathrm{sf},36237}\varepsilon_M\). Choose epsilon M so small that the perturbation is absorbed by Duhamel.

      The stopping argument is formal once the response mass and stopped response parent relation are pinned. It does not require a new PDE estimate.

      If the high coefficient is estimated by absolute values, this can return to a mixed high-high response source wall. But the scale gap M and ordinary dissipation tail should make the high-coefficient part legal after finite-band decomposition, provided no terminal same-scale response concentration is hidden in the discarded coefficient.

      The finite-collar move is proved. Far High Beat NoReturn.A remains open unless the route upgrades all the way to a full-coefficient linearized adjoint kernel, in which case no coefficient residual remains.

      This moves the route from PDE source-wall estimates into packet calculus and finite-band high-coefficient residual control.


