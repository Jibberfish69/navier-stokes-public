      \subsection{Clay problem Full Linearized Response Principal Operator Route}

      \[
      \partial_t z+\mathbb P(u\cdot\nabla z+z\cdot\nabla u)
      =
      \nu\Delta z+\Delta u.
      \]

      So the principal response packet should not treat nonlinear response rotation as an external residual. It should put the localized linearized NS operator into the principal flow.

      \[
      b_j:=u_{<j-M},
      \qquad
      B_j:=\nabla u_{<j-M}.
      \]

      Here B jZ is the localized form of Z u <j-M and P j denotes the shell-projected Leray frame. The skew/rotational and symmetric strain pieces of B j are both part of the principal response propagator.

      \[
      L_j^{lin}z_j
      =
      P_j\Delta u
      +R_j^{lin-resp},
      \]

      \[
      (L_j^{lin})^\ast\psi_T^{lin}=0
      \]

      \[
      \mu(B_j)
      :=
      \lambda_{\max}\left(\frac{B_j+B_j^T}{2}\right).
      \]

      This absorbs every energy-increasing direction of the linearized response propagator, including orthogonal response rotation induced by B j.

      No Nonlinear Response Rotation NoGain.A is needed as an external residual theorem. It is internal to the principal linearized response propagator.

      This is the strongest route mutation from the viscosity-homotopy idea so far. It uses the fact that the viscosity derivative equation is linear in z. Once the full linearized response operator is treated as principal, response rotation is inherited dynamics, not source creation.


