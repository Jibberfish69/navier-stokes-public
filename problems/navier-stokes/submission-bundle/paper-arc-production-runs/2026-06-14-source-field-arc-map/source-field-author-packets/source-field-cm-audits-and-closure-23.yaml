      \[
      2\Gamma_T\le2h_T-\eta_0.
      \]

      \[
      g_T^2e^{-2h_T}\le e^{-\eta_0},
      \]

      \[
      \Gamma_T(t)
      :=
      \int_t^{t_+}
      \lambda_{\max}^{+}(A_k(X_T(s),s))\,ds,
      \]

      \[
      h_T(t):=\nu 2^{2j}(t_+-t),
      \]

      \[
      g_T(t):=e^{\Gamma_T(t)}.
      \]

      So the packet was already active at the earlier time T<t +. The heat cylinder centered at (X T( T), T) with scale 2 -j is an earlier active source-pulse ancestor.

      First-pulse pruning removes this case from the inherited kernel of the selected first terminal pulse.

      Thus coefficient stopping is not a discard rule. It is a routing rule: bad coefficients either expose residual creation paid by Weighted Adj Res.A, or they show that the selected child packet had earlier active ancestry and must be removed by first-pulse pruning.

      Large residual gives charge. Small residual gives earlier amplitude above threshold. That earlier amplitude defines the ancestor tile.


