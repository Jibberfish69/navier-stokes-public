      \subsection{Clay problem Jet-To-Finite-Difference Bridge Theorem}

      Role: close the exact bridge between the mixed-jet tower carried by the ontic object and the finite-difference / transported-separation language that the packet and tethering arguments actually use.

      The theorem introduces no new branch. It makes exact the translation between two already-installed languages of the same fluid.

      \[
      \mathcal T
      =
      \{J_{m,\alpha},\Pi_{m,\alpha}\}_{m,\alpha}
      \]

      \[
      h(a,r,t)=\Phi(a+r,t)-\Phi(a,t).
      \]

      \[
      Q\Subset \Omega\times[0,T).
      \]

      \[
      U_k:=\nabla^k u,
      \qquad
      K_k:=-\nabla^{k+1}p+\nu\Delta U_k.
      \]

      \[
      \Delta_r^\Phi U_k(a,t)
      :=
      U_k(\Phi(a+r,t),t)-U_k(\Phi(a,t),t),
      \]

      So the transported label-space defect and the Eulerian finite-difference defect are literally the same object once the increment is chosen to be the true transported separation.

      So the jet tower and the finite-difference tower are no longer separate languages in the route.


