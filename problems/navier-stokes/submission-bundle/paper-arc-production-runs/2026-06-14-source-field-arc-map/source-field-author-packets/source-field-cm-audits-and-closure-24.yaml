      \subsection{Clay problem Independent PRD Alternative Proof Attempts}

      Purpose: answer whether Positive Remainder Depletion.A can be proved by a route different from the post-ASAC/Zeno conditional loop.

      \[
      [\mathcal R_P^{main}]_+
      =
      \chi_P|w_j|^2
      \left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
      \]

      \[
      \partial_t\omega+u\cdot\nabla\omega-\nu\Delta\omega=S\omega.
      \]

      \[
      \frac{1}{2}\frac{d}{dt}\|\omega\|_2^2
      +\nu\|\nabla\omega\|_2^2
      =
      \int \omega\cdot S\omega.
      \]

      The tempting idea is to treat the positive stretching term as energy variation plus dissipation and then charge it to the installed drain record.

      \[
      S=\operatorname{diag}(2,-1,-1),
      \qquad
      e=(1,0,0),
      \qquad
      e\cdot Se=2>0.
      \]

      The tempting idea is that a terminal positive source pulse must show up as energy growth or heat-scale dissipation.

      The second alternative is precisely the source-pulse branch. Excluding it is an active- / source-residence theorem, not a consequence of local energy alone.

      \[
      \Phi_j^\sigma(t)=\sum_{\ell\ge j}2^{-\sigma(\ell-j)}E_\ell(t),
      \qquad
      \mathcal T_j^\sigma(t)=\sum_{\ell\ge j}2^{-\sigma(\ell-j)}D_\ell(t).
      \]

      The one-dimensional turnover/residence dichotomy is valid. Far-low strain turnover has a genuine parabolic scale-separation gain. The direct proof breaks only at the near-band material term

      and the associated frame-rotation cost. Absolute estimates of this term give the same scale-critical active coefficient bound, while signed integration by parts reintroduces the one-sided terminal source-current.

      Either one would be a genuinely new proof route if proved directly from the Navier--Stokes packet equations and original smooth data.

      Each route either loses sign after terminal positive selection or requires the same source-weighted control it was meant to prove.


