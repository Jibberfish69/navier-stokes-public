      \]

      \[
      \delta_{F(a,t)r}U_k(X(a,t),t).
      \]

      X(a,t) is the flow map; F(a,t)=D aX(a,t); U k= k u; h(a,r,t)=X(a+r,t)-X(a,t); h(a,r,t):=h(a,r,t)-F(a,t)r.

