      \subsection{Clay problem Linearized Response Residual Pair.A Discharge}

      \[
      L_j^{lin}z_j=P_j\Delta u+R_j^{lin-resp},
      \]

      \[
      \boxed{
      \begin{aligned}
      \|P_j\Delta u+R_j^{lin-resp}\|_{L_t^2H_x^{-1}}^2
      &\le C\Bigl(
      \mathrm{ordinary}_{\mathrm{diss},N}\\
      &\qquad
      +\mathrm{low}_{\mathrm{response},N}
      +\mathrm{Legal}_N
      \Bigr)
      +o_N(1).
      \end{aligned}
      }
      \]

      \[
      \Delta u.
      \]

      \[
      \|P_j\Delta u\|_{H^{-1}}^2
      \sfcomp{39209}
      2^{-2j}\|P_j\Delta u\|_2^2
      \sfcomp{39211}
      2^{-2j}2^{4j}\|u_j\|_2^2
      =
      2^{2j}\|u_j\|_2^2
      =
      D_j.
      \]

      \[
      \boxed{
      \|P_{>N}\Delta u\|_{L_t^2H_x^{-1}}^2
      \le C_{\mathrm{sf},39211}
      \int_I\sum_{j>N}D_j(t)dt.
      }
      \]

      So the linear viscosity forcing is legal in the adjoint residual pairing. It does not require the stronger height-dissipation charge.

      No Original Height Dissipation Charge.A, Response Strain Decorrel.A, or external Nonlinear Response Rotation NoGain.A remains in this route.


