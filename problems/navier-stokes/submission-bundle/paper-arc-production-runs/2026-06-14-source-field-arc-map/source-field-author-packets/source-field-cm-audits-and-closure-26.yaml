      Here means "native shell alignment on the present route," not primitive identity and not exclusivity.

      Only the first is native to Pack. The second is a mixed tower-amplitude face and does not yet isolate a unique law row.

      This is the canonical pack-side shell program already installed as a theorem surface, but not yet discharged.

      \[
      \mathfrak A_{N,Q}(t)
      :=
      \sup_{x\in Q_t}\sum_{k=0}^{N}\big(|U_k(x,t)|+|K_k(x,t)|\big).
      \]

      \[
      \mathfrak B_{N,Q}(t)
      =
      \Gamma_{\mathrm{pack},Q}(t)
      +
      \mathfrak A_{N,Q}(t).
      \]

      \[
      \text{packing-detached}
      \quad\Longleftrightarrow\quad
      \forall M<\infty,\ \exists Q,\ \exists t\text{ meeting }Q:
      \Gamma_{\mathrm{pack},Q}(t)>M,
      \]

      \[
      \text{tower-blown}
      \quad\Longleftrightarrow\quad
      \forall M<\infty,\ \exists Q,\ \exists t\text{ meeting }Q:
      \mathfrak A_{N,Q}(t)>M.
      \]

      This is the canonical one-field shell program already installed conditionally on retaining Pack and Part, but not yet discharged.

      The mixed tower-amplitude face uses A N,Q , not the deformation gauge pack ,Q . So it is not a pure Pack entry.

      And it is not yet a pure Field entry: Field N,r,Q controls neighboring differences through C N,r,Q , not the absolute tower amplitude at a basepoint.


