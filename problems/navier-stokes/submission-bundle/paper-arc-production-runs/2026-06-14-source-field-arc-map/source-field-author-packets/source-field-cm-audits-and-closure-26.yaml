      \Omega_{N,m,\rho,\psi}^{osc,\sharp}(t)
      \le
      (2R_\delta^{osc})^\alpha\,
      \mathfrak H_{N,m,\rho,\psi}^{osc,\sharp,\alpha}(t).
      \]

