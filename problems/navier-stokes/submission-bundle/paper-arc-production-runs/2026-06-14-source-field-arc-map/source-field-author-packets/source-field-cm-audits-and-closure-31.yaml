    Direct theorem-grade attempt on the missing heat-action coercivity behind Cycle Heat Action.A.

    The obstruction is sharper than the previous abstract-flow obstruction. The finite spacetime flow decomposition can be made, but the selected positive terminal current can still be fed by an internal signed sink before the flow crosses any heat edge. Proving heat-action coercivity so requires a new PDE statement tying the signed donor sink and the receiver source to the same usable parabolic record, or else charging the separated partner by heat, boundary flux, residual charge, or earlier-source arrival.

