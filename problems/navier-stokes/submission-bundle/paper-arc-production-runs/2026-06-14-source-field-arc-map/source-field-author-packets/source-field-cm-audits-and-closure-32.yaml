      \subsection{Clay problem Parabolic NoFree Sink.A Direct Attempt}

      The theorem is equivalent, on the selected terminal same-fluid record, to Terminal Signed Saturation.A / Signed Positive Balance.A. It is not a consequence of first-current selection, graph flow decomposition, or bare antisymmetric exchange.

      This is the bridge needed to turn a positive terminal source-current arrival into a payable boundary/heat/cycle object.

      The statement is false for a general antisymmetric graph current. With two internal same-time vertices A,B,

      \[
      J(A\to B)=F>0,
      \qquad
      J(B\to A)=-F,
      \]

      \[
      \operatorname{div}J(B)=F,
      \qquad
      \operatorname{div}J(A)=-F.
      \]

      There is positive terminal divergence at B, no boundary input, no heat edge, and no closed cycle. This is not a Navier--Stokes counterexample; it shows that Parabolic NoFree Sink.A is a PDE/same-witness saturation theorem, not a graph-theoretic consequence of skewness.

      Same-fluid transport keeps admissible labels for the transfer. It does not force the donor sink to remain inside the selected terminal bad family, nor does it prove that a donor outside the family is legally small.

      Heat-action estimates apply only after the path is known to cross a heat edge or close into a heat-charged parabolic cycle. The sink-to-source path above can produce terminal positive divergence before any such crossing.

      Nor do they prove that a negative donor sink outside F N is paid by the legal record. Enlarging to the saturated hull merely changes the consumer family and reintroduces the same unpaid internal sink.

      Without that primitive, the parabolic source-current route cannot close Scale Critical Tree Carleson.A; it remains a structurally sharper presentation of the source wall, not a discharge.

      So the current non-circular no-free-sink wall is the terminal Zeno source-residue rigidity atom, not a generic graph-flow obstruction.


