      \subsection{Clay problem Parabolic Edge Resistance.A Direct Attempt}

      The valid output is a conditional resistance estimate with an explicit scale-critical flux-amplitude remainder. That remainder is exactly the active / scale-critical source reserve already named by Scale Critical Tree Carleson.A.

      \[
