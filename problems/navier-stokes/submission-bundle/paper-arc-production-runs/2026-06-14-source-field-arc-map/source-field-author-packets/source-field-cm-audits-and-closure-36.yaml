    a\in\operatorname{supp}\psi,\ \theta\in[0,1]
    \big\}.
    \]

    These are exactly the reference-increment set and the bridge tube generated by the packet.

    E ref N,r, is the reference-increment comparison packet; M tube N+1,r, is the bridge-tube envelope; together with P F , they are the only residual inputs in the current quantitative control of E N,r, .



    \subsection{Clay problem Reference-Increment And Segment-Packet Reduction}

    Role: live reduction surface for the residual reference-increment and weighted-segment packet quantities.

