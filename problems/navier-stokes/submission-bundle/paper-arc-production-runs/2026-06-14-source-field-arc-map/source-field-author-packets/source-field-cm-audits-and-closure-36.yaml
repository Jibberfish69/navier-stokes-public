    \[
    \widetilde E_{N,r,\psi}(t),
    \qquad
    \mathcal R^{inc}_{N,r,\psi}(t),
    \qquad
    P_F^\ast(r,t;\psi).
    \]

    \[
    \mathcal E^{ref}_{N,r,\psi}(t)
    :=
    \sum_{k=0}^{N}\lambda_k
    \int \psi(a)^2
    \big|
    \delta_{F(a,t)r}U_k(x(a,t),t)
    \big|^2\,da
    \]

    \[
    \mathcal R_r^{ref}(t;\psi)
    :=
    \big\{
    F(a,t)r:a\in\operatorname{supp}\psi
    \big\}.
    \]

    So the first remaining object is now reduced to a genuine packetized comparison class.

    This is useful as a first theorem shape, but it is stronger than the exact packet error term really needs.

    This is an honest packet quantity: the geometry and the next-rung segment price stay inside the same integral.

    So the rigid envelope is no longer the live terminal record. It is now a stronger comparison bound for a genuine packet quantity.

    So the live bridge is now entirely packetized at its leading level, with the pointwise supremum retained only as a downstream stronger estimate.

