      \subsection{Clay problem Reference-Comparison Propagation Lemma}

      The key structural point is that this is a genuinely local packet-generated comparison problem, not merely a family of scalar fixed-increment energy bounds.

      \[
      \mathcal R_r^{ref}(t;\psi)
      :=
      \big\{
      F(a,t)r:a\in\operatorname{supp}\psi
      \big\},
      \]

      \[
      \mathfrak e^{ref}_{N,r,\psi}(a,t)
      :=
      \sup_{\eta\in\mathcal R_r^{ref}(t;\psi)}
      \sum_{k=0}^{N}\lambda_k
      \big|
      \delta_\eta U_k(X(a,t),t)
      \big|^2,
      \]

      \[
      \widehat{\mathcal E}^{ref}_{N,r,\psi}(t)
      :=
      \int \psi(a)^2\,\mathfrak e^{ref}_{N,r,\psi}(a,t)\,da.
      \]

      \[
      \mathfrak e^{ref}_{N,\rho,\psi}(a,t)
      :=
      \sup_{0<|r|\le \rho}\mathfrak e^{ref}_{N,r,\psi}(a,t),
      \]

      \[
      \widehat{\mathcal E}^{ref}_{N,\rho,\psi}(t)
      :=
      \int \psi(a)^2\,\mathfrak e^{ref}_{N,\rho,\psi}(a,t)\,da.
      \]

      Fix a compactly supported material packet , a finite depth N, a time interval I, and a scale window 0<|r| .

      The theorem above becomes concrete once one has an Eulerian-side local envelope dominating every packet-generated reference increment.

      The live burden is genuinely local. A family of scalar fixed-increment packet energies is not, by itself, the same thing.


