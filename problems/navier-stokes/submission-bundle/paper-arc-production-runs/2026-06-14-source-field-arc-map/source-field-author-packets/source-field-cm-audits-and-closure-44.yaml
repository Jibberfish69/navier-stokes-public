    Energy and first-moment dissipation do not dominate the heat-scale native positive source measure. Scheduler bad-time smallness is Lebesgue-time smallness, not absolute continuity for src,N +. Signed dyadic exchange does not dominate the positive part after weights, cutoffs, and terminal active selection. Pressure/cutoff records route legal losses but do not dominate the interior native positive source carrier. Local energy and compactness can consume a localized source-residue pulse only after localization and a residue Liouville theorem are supplied. Same-fluid transport licenses the packet; it does not provide domination or vanishing of the singular component.

    \[
    \boxed{
    \mu_{\ast}^{sing}=0
    }
    \]



    \subsection{Clay problem Source Pulse NOHOP / Transport-Chain Audit Note}

    The no-hop / transport-chain audit asks whether same-fluid transport and backward active-window chains already forbid terminal source-balanced active pulses.

    If every terminal active window either spends a finite reserve or traces back to a fixed entrance scale/time, then infinite terminal hopping is impossible and Jump avg is eliminated.

    \[
    A_\ell
    \le
    A_{\ell-1}
    +
    Charge_\ell
    +
    Reserve_\ell.
    \]

    This telescopes only if the chain reaches a fixed entrance scale/time or if the charge/reserve terms are already summable on the selected terminal schedule. In the Jump avg branch the radii can shrink, the windows can move along the same-fluid transport, and the active source can recreate the packet on adjacent heat-scale windows.

    \[
    E_j'(t)+c\nu2^{2j}E_j(t)\le F_j(t).
    \]

    A no-hop theorem must prove that the nonlinear source F j cannot keep producing predecessor pulses without spending a finite reserve. That is the same source-normalization theorem isolated by the -source, active-window Carleson, monotone-dominance, and viscous-Duhamel audits.

    Those atoms are not installed. Without them, a source-balanced pulse can be recreated through a diffuse or sign-cancelled nonlinear source aggregate, and no single predecessor pulse is forced.



    \subsection{Clay problem Source Pulse Parabolic Local-Energy / CKN Audit Note}

    The parabolic local-energy / CKN audit asks whether the local energy inequality, CKN epsilon-regularity, or the installed ATD m machinery already excludes terminal source-balanced active pulses.

    If installed, this would give a terminal good-scale cover and would eliminate the Jump avg branch without a separate source-pulse theorem.

    \[
    \frac{d}{dt}\int |u|^2\varphi
    +2\nu\int |\nabla u|^2\varphi
    \le
    \int |u|^2(\partial_t\varphi+\nu\Delta\varphi)
    +
    \int (|u|^2+2p)u\cdot\nabla\varphi.
    \]

    Those balances do not give a terminal label-time-scale modulus for the moving E u+D u+P packet. A gradient/pressure concentration can move through fresh labels and shrinking scales while preserving the global energy record.

    Parabolic local energy and CKN regularity are already used correctly as the good-scale supplier and endpoint-typing mechanism. They do not install source-pulse exclusion.


