    The root derivation surface is the whole object law read through the flow map, tower carrier family, and finite-difference tower law. It preserves incompressibility, pressure closure, the viscosity carrier, the common nonlinear cascade, and one-field finite-difference coupling; no coupling is discarded at the theorem-primitive level. This surface is constitutive, not a reduced branch object, and downstream branches become autonomous only if this root is treated as optional philosophy.

    The transported packet surface projects the whole object-law fluid onto a label family and finite tower depth. It preserves packed deformation, transported tower coherence, and the rung-1 participation source while deliberately leaving branch-specific readout geometry, such as projectors, covectors, and directional records, for later export. It is the branch-blind carrier from which later branch geometry must be exported, not just another packet.

    The nonparticipation surface projects class-membership failure onto the participation witness and rigid literal-deadness branches. It preserves the participation carrier \(P_N+\mathcal Q_N\), literal deadness, and material-tube transport semantics while leaving blown/jump branches and selector geometry to their own rows. It is a constitutive rigidity reduction, not a local zero-velocity theorem.

    The interface surface connects the branch-blind CM packet to a branch-sensitive readout packet. The CM carrier enters through \(E_J^{cm}\) and exported error records, while the branch readout remains separate until \(R_J^{branch}\) supplies the concrete branch geometry. Treating \(W_J+E_J^{cm}\) as already manufacturing the readout would smuggle geometry out of the wrong fluid.

    The exact-potential/projective surface is the branch-specific theorem that precipitates a projective readout from the CM carrier on a transported good family. Packing, coherence, and participation survive as CM-paid records into the projective branch, while direct whole-fluid semantics stop once the argument projects into branch projectors. Without this precipitating theorem, the projective branch would incorrectly look as if projector geometry were primitive.

    The normal-covector surface is the corresponding branch-specific theorem for bundle, covector, and moment readout. CM packing, transport, and participation are exported into the normal observable, while direct whole-fluid semantics stop at the projection into that observable. Without this precipitating theorem, bundle geometry and readout windows would incorrectly look primitive.

    Surface object: angular directional record on a transported good family. Projection type: branch-local consumer packet. Coupling preserved: only through whatever CM theorem eventually precipitates TCJ and the admissible transport/alignment hypotheses. Coupling discarded: whole-fluid semantics and branch-blind witness structure. Earliest admissible constitutive start: the still-open CM-to-TCJ/alignment precipitation theorem. Consumer start? Yes. Misread danger: if read as a primitive theorem start, TCJ and TEA become free miracles.

    Surface object: integrated scalar closure of a directional record. Projection type: downstream consumer/assembly. Coupling preserved: only the already-packaged directional record and branch error budgets. Coupling discarded: almost all geometry; this is scalar packaging. Earliest admissible constitutive start: a branch directional record theorem such as D.7mr2 or the normal-covector analogue. Consumer start? Yes, purely. Misread danger: if read as a place to rediscover CM semantics, the ontology is already too collapsed.

    Surface object: scalar lower-envelope/continuation consequence. Projection type: downstream consequence only. Coupling preserved: only through the scalar supplier packet. Coupling discarded: all upstream geometry and constitutive semantics. Earliest admissible constitutive start: never here; these are terminal consequence notes. Consumer start? Fully downstream. Misread danger: if treated as a place to repair ontology, one is already far too late.

    A surface with consumer start = yes may not act as a theorem root for the branch. If a surface discards CM coupling, it must name the earlier splice that already supplied for that loss. If a surface still contains a free hypothesis after CM re-rooting, that hypothesis must be labeled either: CM-exported consequence or earliest open precipitating theorem. Downstream scalar assembly surfaces are never valid places to repair the ontology of the fluid.

    for each active branch, identify the earliest row where consumer start = no and the branch becomes specific; treat that row as the real branch start; demote all later rows to consumer/consequence state unless they explicitly re-open an earlier constitutive export theorem.



