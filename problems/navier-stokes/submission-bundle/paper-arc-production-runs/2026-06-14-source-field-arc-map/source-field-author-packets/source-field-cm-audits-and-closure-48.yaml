      \subsection{Clay problem Survivor Equivalence Atlas Note}

      Role: define the invariant object that lets branch-local readouts be compared without changing the underlying same-fluid carrier.

      The atlas does not prove that all existing branches are equivalent. It supplies the relation and edge tests needed to audit whether two branch packets are different coordinate charts on the same class-exit event of M Q(u,p).

      \[
      \text{finite-time singular trace}
      \Longrightarrow
      \text{attempted departure from the same }M_Q(u,p)\text{ object.}
      \]

      The branch labels are not the invariant. The invariant is the endpoint-class violation seen through those branch labels.

      \[
      R=(F,I,\Lambda,C,W,E,\rho).
      \]

      F: the same-fluid label family; I: the still-live interval; : scale, carrier, selector, and finite-cover data; C: the carrier law being propagated; W: the witnessed defect, residue, or branch-local obstruction; E: the endpoint cell in the Pack / Part / Field matrix, with the Blown shell split into its installed pack and tower faces when needed; : the licensed readout map into M Q(u,p).

      Thus R is not just a branch theorem. It is a branch theorem plus its license for reading the branch theorem as a statement about the same local NS object.

      \[
      \Omega=(F_\ast,I_\ast,\Lambda_\ast,M_Q(u,p))
      \]

      F is a restriction or licensed refinement of the same label family used by both packets; I I 1 I 2 is still-live for the same fluid; dominates the scales, carriers, selectors, and covers needed by both packets without using either packet's conclusion; M Q(u,p) is the same local class-membership object.

      The common refinement is not allowed to recenter, relabel, or rescale by using a downstream endpoint conclusion.

      \[
      R_1\bowtie_{\mathrm{surv}}R_2,
      \]

      \[
      R_1\longrightarrow V_\Omega,
      \qquad
      R_2\longrightarrow V_\Omega,
      \]

      This definition makes surv reflexive, symmetric, and transitive as atlas bookkeeping.

      Every map between readout packets must be classified as exactly one of four edge types.

