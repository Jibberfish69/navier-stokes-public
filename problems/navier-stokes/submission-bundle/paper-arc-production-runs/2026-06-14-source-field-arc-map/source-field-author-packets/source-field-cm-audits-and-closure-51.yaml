      Role: direct transported refinement surface for the material packet after the comparison and increment-stability layers.

      What is still missing is the exact statement that these are one object in two coordinate systems.

      \[
      h(a,r,t):=X(a+r,t)-X(a,t).
      \]

      \[
      \partial_t X(a,t)=u(X(a,t),t),
      \qquad
      X(a,0)=a.
      \]

      Fix a smooth compactly supported label cutoff (a), a label increment r, and rung weights k>0. Let

      \[
      U_k(x,t):=\nabla_x^k u(x,t),
      \qquad
      k=0,1,\dots,N.
      \]

      \[
      \Delta_r^X U_k(a,t)
      :=
      U_k(X(a+r,t),t)-U_k(X(a,t),t).
      \]

      \[
      \widetilde E_{N,r,\psi}(t)
      :=
      \sum_{k=0}^{N}\lambda_k
      \int_{\mathbf R^3}\psi(a)^2\,|\Delta_r^X U_k(a,t)|^2\,da.
      \]

      So the spatial gradient is taken on the Eulerian defect field before pullback to label space.

      The label-space defect and the Eulerian finite-difference defect are the same object once the increment is taken to be the transported separation.

      So E N,r, is already the fused class-membership defect energy: it measures tower coherence along the actual transported parcel separation.

      Here A F is the exact packetwise absolute distortion record after the harmless shift needed to compare the a and a+r locations.

      This is still model. The exact content of the bridge note is that the only new geometric source term introduced by the packing side is the rung-1 transported defect.


