    ZenoBoundedClass\(_B\).A says that every terminal Zeno source-residue
    extraction belongs to a rigid ancient class \(B\).

    ZenoResidueLiouville\(_B\).A says that every ancient source-residue object in
    class \(B\) has zero source residue.

