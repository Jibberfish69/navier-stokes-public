    text: |+
      \subsection{Clay problem Positive Remainder Source-Supplier Handoff}

      The May 16 attempt does not prove Positive Remainder Depletion.A. It identifies the active object that a positive supplier theorem would have to control. For a localized same-fluid source packet \(P\), the desired estimate is

      \[
      \int_{Q(P)}[\mathcal R_P]_+
      \le
      \theta\int_{Q(P)}\mathcal D_P
      +\operatorname{Drain}_{\mathrm{parent}}(P)
      +\operatorname{Loss}_{\mathrm{legal}}(P),
      \qquad 0<\theta<1.
      \]

      Here \(\mathcal R_P\) is the positive remainder left after the localized pre-Cauchy source has been split into a time derivative, a drain term, a legal flux term, and the remaining active source production. The older RN and native-trilinear formulations are alternate presentations of this same source-control problem. They do not add the sign rule, time-spread estimate, or scale-critical Carleson control needed to absorb \([\mathcal R_P]_+\).

      The installed route pays the legal terms, ASAC alignment, projected cutoffs, boundary records, and finite or non-Zeno donor refill. Those payments explain why the obstruction has been narrowed. They do not remove the terminal positive carrier.

      This leaves two different uses of the same residue. On the forward supplier side, Positive Remainder Depletion.A would eliminate the residue by proving sign-depletion or scale-critical Carleson control. In the CM contrapositive program, the residue is used only after it has been admitted as a same-solution terminal record. At that point the paper must test the record through Pack, Part, and Field: no lawful carrier is Pack failure, no same Navier--Stokes participation is Part failure, and incompatible positive-scale source readings are Field failure.


