    text: |+
      \subsection{Clay problem Forward Source Supplier Stabilization And CM Turnover}

      The forward supplier side would close by proving a temporal non-atomicity theorem such as

      \[
      \text{\ttfamily UniformTemporalSourceIntegrability\_p.A},
      \qquad p>1.
      \]

      Such a theorem would rule out the concentrating family

      \[
      g_m(s)=m\,\chi_{(-1/m,0]}(s)
      \]

      and close the Zeno source-reserve branch by contradiction with inherited source residue.  The current installed route does not prove that theorem.  The shell scaling

      \[
      F_j(Au)=A^3F_j(u),
      \]

      shows why scale-normalized shell control needs structure beyond smooth data, energy, and preterminal compactness.  The rigid-class route has the same boundary: the minimal Zeno compactness class is too broad for a residue Liouville theorem, and the stronger rigid classes have not been produced by the installed arguments.

      The CM branch uses the remaining residue only after it has been selected as a same-solution terminal record.  If that record lacks a positive same-fluid carrier, it fails Pack.  If the carrier survives and the same Navier--Stokes participation law is lost, it fails Part.  If carrier and participation survive while the source-residue readings cannot form one positive-scale field, it is a Field-side witness.  This gives the forward obstruction a class-exit counterpart while leaving the positive supplier theorem open.


