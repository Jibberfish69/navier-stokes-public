      Terminal CM completeness is the no-fourth-face step.  Once the alleged Clay breakdown has been made canonical, its terminal obstruction has to fail through Pack, Part, or Field:
      \[
      \begin{aligned}
        \mathrm{ClayAdmissibleFiniteBreakdown}(W_*)
        &\Longrightarrow
        \neg \mathrm{Pack}_Q
        \vee \neg \mathrm{Part}_{N_s,Q}\\
        &\qquad\vee
        \forall r>0\,\neg \mathrm{Field}_{N_s,r,Q}.
      \end{aligned}
      \]

      The proof runs by putting \(W_*\) into canonical terminal form.  The five admissibility clauses give the same datum, same equation, same preterminal fluid, same terminal role, and same witness grammar.  After legal losses, non-selected branches, readout artifacts, and paid finite record terms have been stripped, the object left on the page is the same-solution terminal obstruction.

