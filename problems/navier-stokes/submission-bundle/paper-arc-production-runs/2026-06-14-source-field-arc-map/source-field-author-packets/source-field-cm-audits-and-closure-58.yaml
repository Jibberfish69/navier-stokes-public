      \subsection{Clay problem Non-Euler CM Surface Face Sweep}

      This sweep is an authority rule for the Navier-Stokes corpus.  Euler mirror material, fixed-viscosity Euler-to-NS transfer notes, and zero-viscosity comparison surfaces stay outside this pass.  Ordinary Navier-Stokes viscous estimates and Eulerian-coordinate estimates stay inside it.

      Inside the pass, a surface can affect the CM proof only through the triadic witness envelope:

      \[
      \mathrm{Pack}_Q,
      \qquad
      \mathrm{Part}_{N,Q},
      \qquad
      \mathrm{Field}_{N,r,Q}.
      \]

      The class predicate \(\Member(Q)\) is reached only after that witness has been installed.  A source-wall, pressure-Hessian, eigenframe, or endpoint-readout surface has to land in one of these faces before it can steer the CM proof.

      The May 17 refresh added eight non-Euler supplier and diagnostic notes from the PRD, local positive source Carleson, square-source, active-shell amplitude, non-Carleson Zeno, eigenframe, and pressure-Hessian attempts.  Those rows record two kinds of information: conditional supplier status, and the retained Part/Field face sorting after local alternatives have been removed.

      A row marked Field has this local meaning: on that row, the Pack and Part alternatives have already been removed, inherited, or paid, so the remaining retained failure is Field-side.  The statement is local rather than global.  The face label is theorem-role data, not a keyword count.

      The May 14 exhaustive check compared the filesystem text-surface universe against the index, diagnostic map, and certificate record.  The index and this sweep note carry the current non-Euler authority boundary.  Generated YAML, review state, release state, reader-facing manifests, and derived copies inherit their theorem role from the theorem notes they cite.  Their job is to report a Part/Field role while the theorem notes remain the authority for the face itself.


