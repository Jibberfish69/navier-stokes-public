      \subsection{Clay problem Clay Breakdown Class-Exit Inadmissibility Proof Attempt}

      This target-fidelity attempt tested a stronger shortcut: after the Part/Field CM test derives \(\Exit(Q_*):=\neg\Member(Q_*)\), can that class exit alone disqualify the object as a valid Clay breakdown counterexample witness?

      The proof would need a definition-level rule saying that every valid finite Clay breakdown counterexample must remain a CM class member at the terminal window it uses:
      \[
        \text{valid finite Clay breakdown witness}
        \Longrightarrow
        \Member(Q_*)\quad\text{at }T_*.
      \]
      The Clay target supplies the rule for the positive branch: a positive solution witness must be globally smooth.  A finite breakdown counterexample witness is the allegation that the original smooth solution fails to continue globally as such a witness.

      The installed conclusion is the narrower class-exit route:
      \[
      \begin{aligned}
        \mathrm{ClayAdmissibleFiniteBreakdown}(W_*)
        &\Longrightarrow
        \mathrm{CMTestAdmissibleTerminalObject}(W_*)\\
        &\Longrightarrow
        \text{a derived Pack, Part, or Field face failure}\\
        &\Longrightarrow
        \Exit(Q_*):=\neg\Member(Q_*).
      \end{aligned}
      \]
      Terminal class exit contradicts the smooth-solution branch.  It classifies the failure branch as outside CM after the terminal object has lawfully entered the CM test.  The failed target-fidelity shortcut tried to go further and declare the breakdown counterexample inadmissible by definition; that would redefine the counterexample as a surviving in-class terminal object and would beg the question.

      The correction is the obstruction split.  The smooth/pass branch is the branch where the CM participation-field remains a member and the continuation readout applies.  The failure/non-smooth branch enters the CM terminal test and exits through the first failed Pack, Part, or Field face.  The terminal face failure serves that classification at the terminal object itself.


