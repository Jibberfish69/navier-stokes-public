      The CM pass-or-exit branch law is not a request to replace the fail-branch work with a broad positive existence theorem. It still has a local non-vacuity requirement: for each obstruction being split, the pass side must be shown by the simplest lawful smooth / Member(Q) witness for that same obstruction. This is not the full forward bootstrap-estimate program. The CM work then acts on the fail branch: admit the obstruction to the CM terminal packet test and derive a concrete Pack/Part/Field face failure supporting

      Alleged finite Clay terminal breakdown: counterexample object under test. CM terminal packet admission: grammar-admissible test entry for that object. Pack Q, Part N,Q , Field N,r,Q : witness faces. Face failure: the actual mathematical landing, one of not Pack Q, Pack Q + not Part N,Q , or Pack Q + Part N,Q + forall r>0 not Field N,r,Q . Exit(Q):=not Member(Q): downstream class-exit conclusion supported by the face failure. Pass branch: legal smooth / Member(Q) side for the same obstruction, witnessed as simply as possible; it must be nonempty, because otherwise "all bad cases exit CM" is vacuous and signals an invalid obstruction split or a proof-model error.

      If the pass-side non-vacuity check fails in the absolute sense, then the branch split has not proved smoothness. The result is a diagnostic problem: either the obstruction was not a valid obstruction for the Clay proof program, or the CM encoding / face derivation has made a mathematical error.

