      Let \(O\) be a real obstruction produced by the ordinary positive Navier-Stokes proof program: a source-control wall, packet-carrier wall, participation tower wall, coherence/readout wall, or later same-solution obstruction.  The CM engine allows any lawful pass-side estimate to carry the route through \(O\).  It asks what happens to the same solution on the two legal branches.

