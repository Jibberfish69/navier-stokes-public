      \subsection{Clay problem No-Third-Branch Clay Closure Audit}

      The branch law starts after the ordinary positive program reaches a real same-solution obstruction \(O\) on a terminal tail.  The positive program may have found a source-control wall, a packet-carrier wall, a participation tower wall, a coherence wall, or a later obstruction of the same kind.  The CM question is how that obstruction is classified once it is offered as part of a finite terminal breakdown.

      There are two legal branches.  On the pass branch, the same terminal packet retains the services needed for continuation:
      \[
      \begin{aligned}
        O_{\mathrm{pass}}
        &\Longrightarrow
        \mathrm{Pack}_Q,\ \mathrm{Part}_{N_s,Q},\
        \mathrm{Field}_{N_s,r,Q}\\
        &\Longrightarrow \Member(Q;\mathfrak O_{NS}^{work})
        \Longrightarrow \text{smooth continuation.}
      \end{aligned}
      \]
      The continuation readout gives an \(H^s\), \(s>5/2\), norm, and local Navier-Stokes theory extends the same solution past the alleged terminal time.

      On the fail branch, the words ``capable of nonsmoothness'' only identify why the obstruction must enter the terminal CM test.  They are not the proof of class exit.  The failure branch must first be made CM-test-admissible, and then a Pack-first exhaustion theorem must derive the first failed face:
      \[
        \neg\mathrm{Pack}_Q,\qquad
        \mathrm{Pack}_Q\wedge\neg\mathrm{Part}_{N_s,Q},\qquad
        \mathrm{Pack}_Q\wedge\mathrm{Part}_{N_s,Q}
        \wedge\forall r>0\,\neg\mathrm{Field}_{N_s,r,Q}.
      \]
      Only after that face is derived does the contrapositive embedding read the branch as
      \[
        \Exit(Q;\mathfrak O_{NS}^{work})
        :=
        \neg\Member(Q;\mathfrak O_{NS}^{work}).
      \]

      This proves the no-third-branch law.  A branch that remains a legal same-solution continuation branch is a member branch and gives smooth continuation.  A branch that carries the derived Pack/Part/Field face failure is an exit branch.  The alleged Clay breakdown object is the terminal obstruction under test; the continuation candidate is the pas
