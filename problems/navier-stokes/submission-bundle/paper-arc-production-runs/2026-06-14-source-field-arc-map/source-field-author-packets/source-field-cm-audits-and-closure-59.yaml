    fail to attack that chain.  Generated blockers and release verdicts can mark the
    paper as unready, but they become mathematical objections only when they name
    a failure in the terminal Pack/Part/Field classification.  Supplier, source-wall,
    no-pulse, donor-reserve, endpoint-readout, Euler-transfer, Euler-mirror, public-critical,
    and export surfaces have the same rule: they matter to this CM route only when
    they land a theorem directly in \\(\\mathrm{Pack}_Q\\), \\(\\mathrm{Part}_{N,Q}\\),
    or \\(\\mathrm{Field}_{N,r,Q}\\).\n\nThe tempting objection says that terminal
    Pack/Part/Field class exit has classified the breakdown object without proving
    finite breakdown impossible.  That objection asks for a positive packet-survival
    theorem.  Inside the CM proof program, the terminal face failure is already the
    class-exit witness.  A further theorem deleting that witness belongs to the positive
    no-exit route unless the proof program has explicitly switched.\n\nAssume a finite
    same-surface Clay breakdown object \\(W_*\\).  The canonical-terminal-obstruction
    step makes \\(W_*\\) eligible for terminal packet capture, and the finite-failure
    witness theorem supplies the Pack-first split.  If the object has no legal positive
    same-fluid carrier, the failed face is \\(\\neg\\mathrm{Pack}_Q\\).  If a carrier
    survives while the same pressure-viscosity tower fails, the failed face is \\(\\neg\\mathrm{Part}_{N,Q}\\).
    \ If carrier and participation survive while no positive coherence scale remains,
    the failed face is \\(\\forall r>0\\,\\neg\\mathrm{Field}_{N,r,Q}\\).\n\nThe earned
    CM claim is terminal classification: every finite same-surface Clay breakdown
    object that enters the canonical terminal CM tree is classified by Pack, Part,
    or Field, so no unclassified terminal witness remains inside that typed CM test.
    \ This audit is not a full Clay-closure certificate.  It blocks stale objections
    to the CM classifier and preserves the exact remaining burden: a local proof step
    must name the concrete obstruction, its CM-test entry, and the derived Pack/Part/Field
    face.\n\n\n\n\\subsection{Clay problem Positive Obstruction Pass/Exit CM Engine}\n\nLet
    \\(O\\) be a real obstruction produced by the ordinary positive Navier-Stokes
    proof program: a source-control wall, packet-carrier wall, participation tower
    wall, coherence/readout wall, or later same-solution obstruction.  The CM engine
    allows any lawful pass-side estimate to carry the route through \\(O\\).  It asks
    what happens to the same solution on the two legal branches.\n\nOn the pass branch,
    the obstruction keeps the service needed for continuation:\n\\[\n\\begin{aligned}\n
    \ O_{\\mathrm{pass}}\n  &\\Longrightarrow \\text{retained same-fluid Pack/Part/Field
    service}\\\\\n  &\\Longrightarrow \\Member(Q;\\mathfrak O_{NS}^{work})\n  \\Longrightarrow
    \\text{smooth continuation.}\n\\end{aligned}\n\\]\nAny lawful pass-side mechanism
    may supply that service.\n\nOn the fail branch, the obstruction is offered as
    the finite nonsmooth terminal event.  The failure has to enter the CM terminal
    test and pay its first face:\n\\[\n\\begin{aligned}\n  O_{\\mathrm{fail}}\n  &\\Longrightarrow
    \\text{CM-test-admissible same-solution terminal obstruction}\\\\\n  &\\Longrightarrow
    \\text{first failed Pack, Part, or Field face}\\\\\n  &\\Longrightarrow\n  \\Exit(Q;\\mathfrak
    O_{NS}^{work})\n  :=\n  \\neg\\Member(Q;\\mathfrak O_{NS}^{work}).\n\\end{aligned}\n\\]\nThe
    words ``capable of nonsmoothness'' trigger this test; the Pack/Part/Field face
    earns the exit conclusion.\n\nFuture theorem surfaces have to preserve this four-field
    record: the obstruction reached by the positive program, the finite nonsmooth
    event claimed by the fail branch, the Pack/Part/Field landing for that fail branch,
    and the in-class service retained by the pass branch.  A surface that demands
    direct control of \\(O\\) before the CM split has changed to the positive route.
    \ A surface that labels the bad branch \\(\\Exit(Q)\\) before deriving its face
    failure has skipped the mechanism.  The noncircular continuation of this engine
    is obstruction-by-obstruction: prove CM-test entry, derive the first failed face,
    and keep the pass branch as the only in-class continuation branch.\n\n\n\n\\subsection{Clay
    problem Genuine CM Exit Equivalence}\n\nRole: answer the Clay-referee pressure
    question for the CM contrapositive program.\n\nThat converse remains too strong
    at a selected depth, scale, or cover. A single failed certificate can be a bad
    gauge, bad scale, bad cover, or missing readout choice.\n\n\\[\n\\text{smooth
    continuation through }T_*\n\\quad\\Longleftrightarrow\\quad\n\\text{no genuine
    continuation-complete CM exit at }T_*.\n\\]\n\n\\[\n\\text{finite terminal non-continuation
    at }T_*\n\\quad\\Longleftrightarrow\\quad\n\\text{genuine continuation-complete
    CM exit at }T_*.\n\\]\n\nCM=>Member is installed while the raw converse not CM=>not
    Member is not installed.\n\nLet (u,p) be the maximal classical Navier-Stokes solution
    on [0,T *), and let T *< .\n\nFix s>5/2 and choose a finite depth N s high enough
    for the installed H s continuation readout.\n\n\\[\nPack_Q(u,\\Phi)\n\\quad\\wedge\\quad\nPart_{N_s,Q}(u,p)\n\\quad\\wedge\\quad\nField_{N_s,r,Q}(u,p),\n\\]\n\n\\[\n\\sup_{t<T_*}\\|u(t)\\|_{H^s}<\\infty.\n\\]\n\nThis
    is CM as a continuation packet, not CM as an arbitrary selected certificate.\n\nGenuineCMExit(T
    *) means ContCM(T *) fails for every admissible retained same-fluid terminal cover,
    every legal positive scale choice, and every depth high enough for the classical
    readout.\n\nEquivalently, there is no surviving continuation-complete Pack/Part/Field
    witness packet on the same solution near T *.\n\nBy definition, ContCM(T *) supplies
    a retained terminal Pack/Part/Field packet through a depth N s high enough for
    the classical readout, together with the installed H s, s>5/2, readout bridge.\n\n\\[\n\\sup_{t<T_*}\\|u(t)\\|_{H^s}<\\infty.\n\\]\n\nThe
    standard classical Navier-Stokes local theory at s>5/2 gives a uniform lifespan
    from times t j T *. Relaunching the classical solution from those times extends
    (u,p) past T *.\n\nSo a continuation-complete CM packet rules out finite terminal
    non-continuation.\n\nAssume (u,p) extends classically through T *. Choose a small
    spacetime window Q around the terminal point whose closure remains inside the
    extended classical interval.\n\n\n\n\\subsection{Clay problem Completed Proof
    Surface Challenge}\n\nThe signed-pair/no-free-sink item is not certified as a
    necessary remaining burden for the CM contrapositive proof.\n\nIt was introduced
    by the zero-moment direct-attempt note as a way to prove a forward visibility/no-free-sink
    theorem. That is useful as a warning against the wrong positive reading, but it
    is not automatically a blocker for Thomas's CM contrapositive route.\n\nThe CM
    program asks a different question: if the same-witness signed-pair branch is the
    fail branch offered as a finite nonsmooth event, does its mechanism land in Pack,
    Part, or Field as Exit(Q):=not Member(Q)? If yes, the route does not also need
    a positive theorem erasing that branch.\n\nThe proof object is the CM contrapositive
    branch law applied to the Clay finite terminal witness.\n\nActive Height Flux
    Trichotomy.A as a forward discharge. That does not by itself prove the terminal
    signed branch remains an in-class nonsmooth branch.\n\nWhen a generated, packet-era,
    export-bundle, dashboard, or direct-attempt surface says Signed Pair Reserve Visibility.A
    is needed, it must prove why that is a CM necessity rather than a positive-forward
    visibility demand.\n\nIf no, it is not a third branch. It is either the pass branch
    or the exit branch. The mere absence of a positive no-free-sink estimate does
    not reopen the Clay problem under the CM contrapositive program.\n\n\n\n\\subsection{Clay
    problem CM Pass/Exit Positive-Existence Veto}\n\nThe CM pass-or-exit branch law
    is not a request to replace the fail-branch work with a broad positive existence
    theorem. It still has a local non-vacuity requirement: for each obstruction being
    split, the pass side must be shown by the simplest lawful smooth / Member(Q) witness
    for that same obstruction. This is not the full forward bootstrap-estimate program.
    The CM work then acts on the fail branch: admit the obstruction to the CM terminal
    packet test and derive a concrete Pack/Part/Field face failure supporting\n\nAlleged
    finite Clay terminal breakdown: counterexample object under test. CM terminal
    packet admission: grammar-admissible test entry for that object. Pack Q, Part
    N,Q , Field N,r,Q : witness faces. Face failure: the actual mathematical landing,
    one of not Pack Q, Pack Q + not Part N,Q , or Pack Q + Part N,Q + forall r>0 not
    Field N,r,Q . Exit(Q):=not Member(Q): downstream class-exit conclusion supported
    by the face failure. Pass branch: legal smooth / Member(Q) side for \n% ... source
    excerpt truncated for packet size ...\n"
