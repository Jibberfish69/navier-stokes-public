    text: |+
      \subsection{Clay problem Completed Proof Surface Challenge}

      The signed-pair/no-free-sink item is not certified as a necessary remaining burden for the CM contrapositive proof.

      It was introduced by the zero-moment direct-attempt note as a way to prove a forward visibility/no-free-sink theorem. That is useful as a warning against the wrong positive reading, but it is not automatically a blocker for Thomas's CM contrapositive route.

      The CM program asks a different question: if the same-witness signed-pair branch is the fail branch offered as a finite nonsmooth event, does its mechanism land in Pack, Part, or Field as Exit(Q):=not Member(Q)? If yes, the route does not also need a positive theorem erasing that branch.

      The proof object is the CM contrapositive branch law applied to the Clay finite terminal witness.

      Active Height Flux Trichotomy.A as a forward discharge. That does not by itself prove the terminal signed branch remains an in-class nonsmooth branch.

      When a generated, packet-era, export-bundle, dashboard, or direct-attempt surface says Signed Pair Reserve Visibility.A is needed, it must prove why that is a CM necessity rather than a positive-forward visibility demand.

      If no, it is not a third branch. It is either the pass branch or the exit branch. The mere absence of a positive no-free-sink estimate does not reopen the Clay problem under the CM contrapositive program.


