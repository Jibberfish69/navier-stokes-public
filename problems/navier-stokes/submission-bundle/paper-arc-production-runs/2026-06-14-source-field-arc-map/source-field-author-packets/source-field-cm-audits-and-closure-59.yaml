        O_{\mathrm{fail}}
        &\Longrightarrow \text{CM-test-admissible same-solution terminal obstruction}\\
        &\Longrightarrow \text{first failed Pack, Part, or Field face}\\
        &\Longrightarrow
        \Exit(Q;\mathfrak O_{NS}^{work})
        :=
        \neg\Member(Q;\mathfrak O_{NS}^{work}).
      \end{aligned}
      \]
      The words ``capable of nonsmoothness'' trigger this test; the Pack/Part/Field face earns the exit conclusion.

