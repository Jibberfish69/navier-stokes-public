      \begin{aligned}
        O_{\mathrm{pass}}
        &\Longrightarrow \text{retained same-fluid Pack/Part/Field service}\\
        &\Longrightarrow \Member(Q;\mathfrak O_{NS}^{work})
        \Longrightarrow \text{smooth continuation.}
      \end{aligned}
      \]
      Any lawful pass-side mechanism may supply that service.

      On the fail branch, the obstruction is offered as the finite nonsmooth terminal event.  The failure has to enter the CM terminal test and pay its first face:
