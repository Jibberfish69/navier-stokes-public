      \subsection{R3 Sobolev / H s Energy Wall To CM Face}

      Let (u,p) be a maximal smooth finite-energy Navier-Stokes solution on R 3 x [0,T *) with T * finite. Let

      \[
      SobWall_{H^s}(\mathcal W)
      \Longrightarrow
      \neg Pack_Q(\mathcal W)
      \vee
      \neg Part_{N,Q}(\mathcal W)
      \vee
      \forall \rho>0\,\neg Field_{N,\rho,Q}(\mathcal W).
      \]

      A terminal Sobolev wall means that the forward H s energy hierarchy reaches T * without producing the bounded H s continuation readout.

      \[
      \neg Pack_Q(\mathcal W).
      \]

      \[
      \neg Part_{N,Q}(\mathcal W).
      \]

      Assume Pack Q and Part N,Q survive. If there exists rho>0 with Field N,rho,Q , then the terminal record contains a positive-scale coherent derivative tower through depth N on a readout-compatible localized R 3 packet. By the Sobolev readout for N above s+2, the local tower gives

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(R^3)}<\infty.
      \]

      Classical H s local theory for s>5/2 extends the same smooth solution beyond T *. This contradicts the assumed terminal Sobolev wall. So retained Pack and retained Part force

      \[
      \forall \rho>0\,\neg Field_{N,\rho,Q}(\mathcal W).
      \]

      The three alternatives exhaust the Sobolev route: the wall is either loss of the same-fluid carrier, loss of the differentiated same-law tower, or loss of positive-scale coherent field readout. Hence the Sobolev/H s terminal wall lands in Pack, Part, or Field.


