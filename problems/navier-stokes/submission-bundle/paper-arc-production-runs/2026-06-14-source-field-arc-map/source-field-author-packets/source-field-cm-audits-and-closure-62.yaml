      \subsection{Clay problem Same-Witness Atlas Selection For H 1/2}

      Conditional supplier lemma for Same LedgerHHalf Extraction.A. The selection step is internal once the retained Pack atlas belongs to the witness record.

      \[
      \mathcal A(\mathcal W)=\{a_1,\dots,a_M\},
      \qquad
      \{\chi_a^{\mathcal W}(t)\}_{a\in\mathcal A(\mathcal W)}.
      \]

      \[
      E_a(m)
      :=
      2^{J_m}\|P_{J_m}(\chi_a^{\mathcal W}(t_m)u(t_m))\|_{L^2(\mathbb T^3)}^2.
      \]

      Let a m be the least-index maximizer of E a(m) over the fixed finite set A( W). Then the selected chart a m is a chart of the same witness record W.

      Moreover, if the atlas has bounded overlap and Transported PartitionLPCommutator.A is available at the selected shell scale, then

      The atlas A( W) is part of the retained Pack data of the same witness. The functions a W (t) are fixed before the terminal dyadic shell is selected.

      \[
      E_{a_m}(m)
      \ge
      M^{-1}
      \sum_{a\in\mathcal A(\mathcal W)}E_a(m).
      \]

      The selected index a m belongs to A( W) by definition. The tie-break rule is fixed before selection, so the chart choice uses the witness record itself and does not add an external cover.

      This lemma prevents a public critical shell from floating outside the CM witness. The chart is selected from the material atlas already carried by Pack Q. Once the commutator supplier controls localization, the shell has a material address inside W.

      The next question is participation and tower coherence. Participation is handled by Part; persistent high-frequency loss on retained Pack+Part moves to the Field analysis.

      This lemma supplies the same-witness selection step only. It does not prove the downstream HHalf Oscillation Field Exit.A theorem.


