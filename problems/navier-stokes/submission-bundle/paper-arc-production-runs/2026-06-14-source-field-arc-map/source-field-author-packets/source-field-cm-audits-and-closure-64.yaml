      \subsection{R3 Exterior Source Dyadic Escape To CM Face}

      The direct high-order route is circular when it spends int 0 T * ||nabla u|| L dt, global H s, or an equivalent continuation-grade coefficient. The method used here asks what must be true if the exterior nonlinear Duhamel source does not vanish.

      For the Duhamel piece W R , the low-frequency L 2 exterior contribution is controlled by a fixed-band source estimate. After the compact-core source has been removed, write F R = chi >=R/4 (u tensor u). On any fixed dyadic band, the heat/Leray multiplier maps F R from L 1 t L 3/2 x into the L infinity t L 2 x response. The energy class gives u in L infinity t L 2 x cap L 2 t dot H 1 x, hence u in L 4 t L 3 x. Since ||F R(t)|| L 3/2 <= ||chi >=R/4 u(t)|| L 3 ||u(t)|| L 3, the exterior factor tends to zero in L 2 t and the second factor is in L 2 t. Thus F R ->0 in L 1 t L 3/2 x, and every fixed bounded-frequency response tends to zero in L 2 and then in H s.

      This is no longer an ordinary far-field mass escape. Exterior L 2 tightness has removed that. The only surviving object is a high-frequency packet whose physical radius collapses along the terminal approach.

      In either case, the survivor is a Pack/Field face issue for the same terminal object. It is not a silent Member(Q) branch and not a whole-space continuation bridge.

      The note does not prove whole-space H s tail tightness. It prevents the remaining exterior source from being treated as an unspecified analytic fog. A surviving exterior source must now enter the CM matrix as a scale-zero Pack/Field face, or the positive tail theorem must be proved directly by a new noncircular estimate.

      The proof uses the energy-class interpolation L infinity t L 2 x cap L 2 t dot H 1 x -> L 4 t L 3 x, bounded-frequency Littlewood-Paley control, and the Duhamel split that already removed initial tail and compact-core far-kernel tail. It does not use global H s, BKM, or continuation-grade Lipschitz integrability.


