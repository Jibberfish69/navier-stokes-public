      \subsection{Clay problem Retained-Window Native Forcing Theorem}

      For the finite-energy-native branch, this route is the wrong object. The new receiver target is not

      \[
      I_a=[s_a,s_{a+1}],
      \qquad
      c_j(t)=\Phi(a^j,t),
      \]

      \[
      B(c_j(t),2r_a)\subset Q_t^{rec,+}.
      \]

      \[
      \sum_{q\le m+2}
      \|U_q\|_{L^\infty_t C_x^2(B(c_j(t),2r_a))}
      +
      \|p\|_{L^1_t C_x^{m+1,\alpha}(B(c_j(t),2r_a))}
      <\infty.
      \]

      \[
      I=\bigcup_a I_a,
      \qquad
      I_a=[s_a,s_{a+1}],
      \qquad
      c_j(t)=\Phi(a^j,t),
      \]

      \[
      B(c_j(t),2r_a)\subset Q_t^{rec,+}.
      \]

      At a retained restart time \(s_a\), reset the affine packet at the current transported center and affine frame. For every retained rung and center, the affine remainder is measured in a shrink-admissible excess slot. Since the center set, rung set, and derivative set are finite, one admissible radius \(R_a\) can be chosen for the whole retained finite family.

      For the pressure part, the local Poisson split gives the retained local response plus the finite-energy far tail. On the retained ball, for \(0\le q\le m\), the right-hand side is in \(L^1_t\) after summing over the finite center/rung set. The harmonic/far-tail contribution is bounded by the energy tail already licensed in the conditional packet.

      For the viscous part, integration by parts against the transported mollifier and retained local smoothness give the same kind of finite-cover bound. For each retained center, each finite rung, and each retained forcing component, the local smoothness assumptions make the tested field continuous in space on \(B(c_j(t),2r_a)\) for almost every \(t\), with an \(L^1_t\) dominating norm. Approximate-identity convergence gives the pointwise-in-time limit, and the same retained smoothness bounds dominate the convergence in time. Dominated convergence gives the retained forcing limit.

      The native pressure normal form defines \(p_j^{\mathrm{aff}}\) by matching the finite center-cell pressure functionals of the affine and affine-linear source modes. Linearity of the localized Poisson response then gives the pressure part of the retained forcing record.

      The viscous parts are contractions of the retained smooth tower modes \(U_{q+2}\) for the finite center-rung set, hence also lie in \(L^1(I_a)\). The bounded affine-frame conversion then gives the same conclusion for the viscous forcing part.

      This is a finite-cover readout transfer theorem; it is not a fixed-radius smallness claim.


