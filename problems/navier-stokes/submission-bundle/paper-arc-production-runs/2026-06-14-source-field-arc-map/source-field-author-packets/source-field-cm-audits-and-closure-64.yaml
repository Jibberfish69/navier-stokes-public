      \subsection{Clay problem Clay Bridge Reconciled By Finite-Obstruction Inventory}

      Let a Clay negation supply one original smooth datum, one maximal classical solution, a finite terminal time, and a same-solution terminal record. The standard continuation theorem supplies the entry record: bounded continuation readout would restart the same solution past the terminal time.

      This is the fail branch. It is not a second in-class continuation branch. The pass branch is exactly the branch where Part and Field survive and give the usual same-solution continuation readout.

      So the proof does not need the stale generic statement "Exit itself is inadmissible." That statement tries to delete the fail branch after using it. The CM route instead proves that a finite terminal obstruction is either the pass branch, which continues, or the fail branch, which is a class-exit witness and not an in-class nonsmooth continuation branch.

      No promoted proof-bearing terminal row remains outside the CM-test-entry plus Part/Field face standard.

      It is superseded as a live blocker by the corrected inventory target. Current readiness should use the corrected inventory target. Future blockers must name a concrete promoted terminal obstruction row that lacks CM-test entry or a derived Part/Field face.


