      \subsection{Clay problem Terminal Record Entry Standard PDE Hardening}

      A finite-time Clay breakdown assumption for smooth divergence-free data already supplies the same-solution terminal record needed for the CM terminal-entry test.

      More precisely, let \(u_0\) be smooth divergence-free data on the chosen domain and let \(u\) be the corresponding maximal classical Navier-Stokes solution on \([0,T_*)\), with \(T_*<\infty\) and no classical continuation past \(T_*\).

      Equivalently, there is a sequence \(t_n\to T_*\) along the same solution such that the classical readout norm diverges or the continuation criterion fails.

      Local well-posedness in \(H^s\), \(s>5/2\), gives a continuation theorem: if the same classical solution remains bounded in the continuation norm on \([0,T_*)\), then the local existence theorem can be restarted from times approaching \(T_*\) with a uniform positive lifespan. That restarts the same solution past \(T_*\).

      The finite Clay breakdown assumption says exactly that this same classical solution has no such continuation past \(T_*\). So the bounded-continuation alternative is impossible. The continuation norm must fail along times approaching \(T_*\).

      No internal CM language is needed for this entry step. The record comes directly from the standard PDE formulation of finite maximal classical breakdown.

      That is enough to remove the referee objection that the CM terminal-entry step depends on internal terminology rather than on the PDE problem statement.

      The terminal-record entry is now anchored directly in the finite-breakdown formulation. The later finite-obstruction inventory reconciles the old generic bridge demand: a promoted finite terminal row must either pass as the same-solution \(\Member(Q)\) branch or fail a named Pack, Part, or Field face supporting \(\Exit(Q):=\neg\Member(Q)\).

      The terminal-record entry hardening gap is closed at this level of the proof. A future reopening has to name a concrete promoted terminal obstruction row lacking CM-test entry, finite-failure exhaustion, or CM contrapositive embedding.


