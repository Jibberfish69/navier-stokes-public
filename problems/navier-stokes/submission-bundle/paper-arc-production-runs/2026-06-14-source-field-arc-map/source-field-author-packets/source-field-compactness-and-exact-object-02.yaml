    \subsection{Clay problem Critical-Pulse Compactness No-Pulse Attempt Note}

    The compactness route is tested by assuming the no-pulse theorem fails, rescaling the active heat-scale pulses, and trying to exclude the limiting critical object.

    The compactness extraction is route-plausible. The exclusion is not installed. The remaining theorem becomes a Liouville/depletion statement for the critical pulse profile.

    \[
    I_n=[t_n-c2^{-2j_n},t_n],
    \]

    \[
    \gamma_{j_n}(t)\sfcomp{33466} 1
    \qquad\text{on a nontrivial part of }I_n,
    \]

    Equivalently, in active-window language, the scale-critical source packet does not become small on any terminal subtail.

    \[
    r_n:=2^{-j_n},
    \qquad
    v_n(y,s):=r_n\,u(x_n+r_n y,t_n+r_n^2s),
    \]

    \[
    q_n(y,s):=r_n^2\,p(x_n+r_n y,t_n+r_n^2s).
    \]

    \[
    \partial_s v_n+v_n\cdot\nabla v_n+\nabla q_n-\nu\Delta v_n=0,
    \qquad
    \nabla\cdot v_n=0.
    \]

    The active normalization gives a nonzero critical packet in the rescaled sequence. The energy inequality supplies local suitable bounds of the standard CKN type on bounded cylinders, after passing to the same-fluid/moving coordinate chart with bounded distortion.

    Every local suitable ancient limit generated by a terminal same-fluid scale-critical source pulse, with the retained energy class and pressure normalization inherited from Original Smooth Data, has zero active source residue.

    The installed inputs give compactness and local suitability, but not a Liouville theorem strong enough for this class.

    Without one of those extra structural hypotheses, standard compactness only turns failure of no-pulse into a nontrivial ancient critical object. It does not make that object impossible.

    The CKN epsilon theorem also cannot be used backwards here. The pulse is precisely a failure of smallness of the scale-critical packet; CKN says small packets are regular, not that every nonsmall ancient packet is impossible.

    Eliminating the branch by compactness so requires a genuine exclusion of the nonzero rescaled packet. That is exactly Ancient.No Pulse.

    That object is not yet a spatial Radon measure on physical cylinders. So the blow-up extraction also needs the carrier-tether form audited in

    This is a stricter dependency list than the original Ancient.No Pulse target: ancient rigidity is only useful after Diag Dom.A preserves physical co-location and source residue through localization. Local Source.No Pulse.A is the direct pre-Cauchy source theorem and would close the no-pulse atom without passing through ancient compactness.


