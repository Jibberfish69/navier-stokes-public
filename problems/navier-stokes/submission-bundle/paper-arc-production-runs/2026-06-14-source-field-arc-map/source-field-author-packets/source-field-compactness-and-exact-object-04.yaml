    text: |+
      \subsection{R3 Compactness-Rigidity Wall To CM Face}

      A compactness-rigidity route has two phases: extract a terminal critical element, then rule it out by a rigidity or continuation argument.

      \[
      \neg Pack_Q(\mathcal W).
      \]

      \[
      \neg Part_{N,Q}(\mathcal W).
      \]

      Assume Pack Q and Part N,Q survive. If some Field N,rho,Q survives, the terminal element carries positive-scale coherent control through the required readout depth on the same witness. This gives the compact critical element enough coherence for the rigidity mechanism or for the continuation criterion consumed by the route.

      \[
      \forall\rho>0\,\neg Field_{N,\rho,Q}(\mathcal W).
      \]


