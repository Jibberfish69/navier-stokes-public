      \subsection{A1c R Direct Whole-Space Hs Control: Reduction And Obstruction}

      The realized classical carrier branch needs direct whole-space continuation
      control.

      \[
      A1c_R:
      \qquad
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb R^3)}<\infty,
      \qquad s>5/2.
      \]

      \[
      X=u,
      \qquad
      \mathcal C=Id,
      \qquad
      H_D^s=H^s_\sigma(\mathbb R^3).
      \]

      On the whole-space branch the carrier is the original solution itself:

      \[
      u\in L_t^\infty L_x^2,
      \qquad
      \nabla u\in L^2_{t,x}.
      \]

      The usual energy layer gives these bounds.
      Those bounds control total energy and dissipation. They do not provide
      \(\int_0^{T_*}\|\nabla u(t)\|_{L^\infty}\,dt<\infty\), and they do not supply a
      Serrin improvement
      \[
      u\in L^p(0,T_*;L^q(\mathbb R^3)),
      \qquad
      \frac2p+\frac3q\le1,
      \quad q>3.
      \]
      Thus the direct \(H^s\) branch is not closed by energy/enstrophy alone. It
      records the continuation-grade estimate that the rest of the route must supply.


