      \subsection{Exported Remainder Active-Shell Absorption Result}

      This subsection records the part of exported-remainder absorption that is
      actually paid.  The exported remainder has size

      \[
      C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X)).
      \]

      To absorb it into the viscous shell scale at shell \(j\), the route needs

      \[
      C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X))
      \le
      \eta\nu2^{2j}.
      \]

      For a fixed time \(t\), this is true on every shell above the active threshold

      \[
      2^{2j}\ge K\nu^{-1}C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X(t))).
      \]

      Equivalently, with

      \[
      J_{\mathrm{rem}}(t)
      :=
      \frac12\log_2
      \left(
      K\nu^{-1}C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X(t)))
      \right),
      \]

      every \(j\ge J_{\mathrm{rem}}(t)\) satisfies

      \[
      C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X(t)))
      \le \eta\nu2^{2j}.
      \]

      This is just the displayed threshold definition rearranged, with
      \(K\ge\eta^{-1}\).  The result is the correct active-shell absorption theorem:
      the exported remainder is absorbed high enough above a moving threshold.

      It does not yet give all-shell absorption up to an endpoint.  To get that
      stronger conclusion, the route still has to control the finite region below
      \(J_{\mathrm{rem}}(t)\), or prove a uniform bound on
      \(\Phi_s(\mathcal E_D^{(s)})\) that makes the threshold globally fixed.


