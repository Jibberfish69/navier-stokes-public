      \subsection{Mediating Object: gradient transfer coercivity lemma}

      This object packages the previous subsections as one theorem interface.  It is
      valid only on the classical Euclidean equation, with the Leray/divergence-free
      structure, Euclidean symmetries, and dyadic index shifts preserved.

      Its input is the scale-barrier tail budget plus same-surface nonlinear closure.
      The packet stack recorded as (GTC.1) has four entries: strict low-mode control
      on \(\Lambda_N\), spill control on \(\Theta_N^\sharp\), genuine high-high
      absorption, and the open lifted remainder.

      Its output, once the lifted remainder is paid, is the Gronwall estimate

      \[
      E_N(t)\le
      \exp\!\left(C\int_0^t\widetilde\Lambda_N^\sharp(s)\,ds\right)
      \bigl(E_N(0)+C_*t\,2^{-2\delta N}\bigr).
      \]

      This is the transfer from dangerous-scale transport to high-frequency gradient
      continuation.


