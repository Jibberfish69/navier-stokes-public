    \subsection{BridgeA Comparison Expansion Against EPF Components}

    The exact-potential balanced-frame closure separates the tensor comparison into
    finite-frame and denominator errors. The combined comparison size is

    \[
    d\left(2\|W_J^{coc}\|_{op}\rho_{J,lin}+\rho_{J,lin}^2\right).
    \]

    These are the terms that enter the EPF/Davis-Kahan estimate. BridgeA uses this
    support, while the terminal no-escape charge still requires a separate theorem.



    \subsection{BridgeA Equals Exact-Potential Comparison Record}

    BridgeA is the normalized tensor comparison packet already named in the
    balanced-frame D.7mq route. The statement is conditional on the shared simple
    top gap.

    Assume both tensors carry a shared simple-top gap floor \(\gamma_J\).
    Davis-Kahan gives

    \[
    \frac{\operatorname{Err}^{frame}_{J,cmp}}{\gamma_J}\to0
    \Longrightarrow
    \mathrm{BridgeA}.
    \]


