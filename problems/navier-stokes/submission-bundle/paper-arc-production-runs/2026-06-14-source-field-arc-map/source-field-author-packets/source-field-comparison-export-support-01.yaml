      \subsection{Gradient Transfer Operator}

      \[
      E_N(t) := \sum_{j\ge N} 2^{2j}\|P_j u(t)\|_{L^2_x}^2,
      \qquad
      D_N(t) := \sum_{j\ge N} 2^{4j}\|P_j u(t)\|_{L^2_x}^2,
      \]

      \[
      \Lambda_N(t)
      :=
      1+\sum_{k\le N-4}2^{5k/2}\|P_k u(t)\|_{L^2_x},
      \]

      \[
      \Theta_N^\sharp(t)
      :=
      2^{3N}\sum_{m=N-M}^{N+M}\|P_m u(t)\|_{L^2_x}^2,
      \]

      \[
      \widetilde\Lambda_N^\sharp(t)
      :=
      \Lambda_N(t)+\Theta_N^\sharp(t),
      \]

      \[
      \widetilde{\mathfrak{G}}_N^\sharp[u](t)
      :=
      \frac{d}{dt}E_N(t)
      + (1-\eta)\nu D_N(t)
      - C\,\widetilde\Lambda_N^\sharp(t)\,E_N(t),
      \]

      where the weaker \(\mathcal L_N\) surface remains the older declared target but
      is not the supported default candidate for Proposition \(6.1\).

      The operator is discharged when

      \[
      \widetilde{\mathfrak G}_N^\sharp[u](t)
      \le
      C_*2^{-2\delta N}
      \]

      almost everywhere, with constants independent of the approximation index and
      with no geometric surrogate.  The live operator status is:

      \[
      \text{declared weak surface open, upgraded surface coherent, lifted remainder open.}
      \]

      The asymmetry is specific to the gradient surface.  The local tail-energy
      surface has one fewer high derivative, so fixed-gap gains there do not
      automatically solve the gradient strict-low problem.


