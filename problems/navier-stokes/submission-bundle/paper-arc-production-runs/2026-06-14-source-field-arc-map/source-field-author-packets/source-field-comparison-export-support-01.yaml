    text: |+
      \subsection{BKM Conditional Comparison and SCF-Base Tower Bound}

      The BKM hypothesis is used here as a comparison input, not as a proof from
      original data. It gives

      \[
      \int_{t_0}^{T_*}\|\omega(t)\|_{L^\infty}\,dt<\infty.
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s}<\infty
      \]

      \[
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      High Sobolev control gives uniform local control of velocity derivatives and
      pressure carriers through the depth required by SCF base. With bounded
      same-fluid geometry from Pack.TTU, the tower variables obey

      \[
      \sup_{t<T_*}\sup_{Q_t}|U_k|<\infty
      \qquad(0\le k\le N+2).
      \]

      \[
      p=p^{loc}+h,
      \qquad
      -\Delta p^{loc}=\partial_i\partial_j(\chi u_i u_j).
      \]

      The comparison is useful because it identifies the exact strength that would
      supply the missing terminal local-regularity scale. It does not prove the BKM
      hypothesis from the original Navier-Stokes data.


