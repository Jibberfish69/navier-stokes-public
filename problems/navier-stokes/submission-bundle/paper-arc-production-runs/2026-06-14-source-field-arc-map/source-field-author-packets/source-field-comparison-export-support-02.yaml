      \subsection{CKN Threshold Transfer Lemma}

      Let \(Q_r^\Phi\) be a CKN-admissible same-fluid moving cylinder with distortion
      bound \(M_\sharp\). Pull the cylinder back to the unit cylinder by

      \[
      x=c(t)+rA(t)y,
      \qquad
      s=(t-t_0)/r^2.
      \]

      The bounded-distortion hypotheses give uniform comparability of spatial volume,
      parabolic measure, gradients, and cylinders. The standard normalized CKN
      quantity on \(Q_1\) is controlled by the scale-critical same-fluid quantity on
      \(Q_r^\Phi\), with constants depending only on the distortion and viscosity
      normalization. In particular,

      \[
      \iint_{Q_1}|\tilde u-\tilde u^{\mathrm{norm}}|^3
      \le
      C(M_\sharp)
      \,r^{-2}\iint_{Q_r^\Phi}|u-u^{\mathrm{norm}}|^3.
      \]

      \[
      \iint_{Q_1}|\tilde p-\tilde p^{\mathrm{norm}}|^{3/2}
      \le
      C(M_\sharp,\nu)
      \,r^{-2}\iint_{Q_r^\Phi}|p-p^{\mathrm{norm}}|^{3/2}.
      \]

      \[
      \iint_{Q_1}|\nabla_y\tilde u|^2
      \le
      C(M_\sharp)
      \,r^{-1}\iint_{Q_r^\Phi}|\nabla_x u|^2.
      \]

      This lemma is a transfer tool. It lets the manuscript use CKN threshold
      language on the same-fluid moving cylinders once the bounded-distortion
      pullback has been installed. It is not a standalone endpoint exclusion.


