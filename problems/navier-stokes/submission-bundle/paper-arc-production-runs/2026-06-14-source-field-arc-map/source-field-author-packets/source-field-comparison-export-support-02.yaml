      \subsection{Periodic Target Statement and Whole-space Export Boundary}

      \[
      u_0\in C^\infty(\mathbb T^3),\quad \nabla\cdot u_0=0,\quad \int_{\mathbb T^3}u_0=0
      \Longrightarrow
      u\in C^\infty([0,\infty)\times\mathbb T^3).
      \]

      The official Navier--Stokes target admits the periodic
      \(\mathbb T^3\) formulation.  The proof stays on the torus unless a separate
      export theorem transfers it to \(\mathbb R^3\).

      Any whole-space statement on \(\mathbb R^3\) requires a separately named export
      theorem.  The theorem statement and the manuscript should phrase the result as
      the periodic theorem until that export theorem is installed.

      This scope choice prevents a hidden branch switch. The theorem proves the torus-surface global smoothness statement and leaves whole-space export as a separately labeled item.


