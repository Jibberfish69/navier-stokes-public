      \qquad \int_{\mathbb T^3}u_0=0
      \Longrightarrow
      u\in C^\infty([0,\infty)\times\mathbb T^3).
      \]

      This historical export decision recorded the older positive-export standard: a direct periodic-to-R3 export theorem needs its own localization, decay, pressure normalization, and infinity-control hypotheses.

      It is retained as historical/direct-positive-route context, not as current submission authority. The present manuscript states the whole-space branch through the CM pass-or-exit route, and the R3 authority is the June 8 endpoint-consumption chain plus the fixed-band exterior-source estimate. The stronger direct positive export theorem remains useful future work, but its absence is not a live CM-facing blocker.


