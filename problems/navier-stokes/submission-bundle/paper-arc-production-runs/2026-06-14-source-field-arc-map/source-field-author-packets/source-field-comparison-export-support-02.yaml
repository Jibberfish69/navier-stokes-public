      \subsection{Compressed Whole-Space R3 Conditional Theorem And Analytic Gap}

      Let \(u_0\) be smooth, divergence-free, and rapidly decaying on
      \(\mathbb R^3\). Assume one of the two whole-space closure packages below.

      \[
      A1c_R:\quad
      \sup_{t<T_*}\|u(t)\|_{H^s(R^3)}<\infty,
      \qquad s>5/2.
      \]

      Under Package A, the classical \(H^s\) continuation criterion gives global
      smoothness directly.

      \[
      \text{weighted moment propagation + pressure-flux control + uniform local }H^s\text{ budgets}.
      \]

      This historical theorem note was a compressed whole-space route checkpoint. In
      the present manuscript, the whole-space branch is read through the CM
      pass-or-exit analysis rather than as an open positive-export estimate.


