    text: |+
      \subsection{Whole-Space R3 Export Theorem And Exact Remaining Burden}

      \[
      u^0\in C^\infty(\mathbb R^3;\mathbb R^3),\qquad \nabla\cdot u^0=0,
      \]

      \[
      (A1b)\quad u=\mathcal C(X)\text{ solves exact classical Navier-Stokes on }\mathbb R^3,
      \]

      \[
      (A1c)\quad \sup_{t\ge0}\|X(t)\|_{H_D^s}<\infty\quad\text{for some }s>5/2.
      \]

      Fix arbitrary Clay datum u 0. By (A1a), choose an admissible carrier datum X 0 with C(X 0)=u 0.

      \[
      u(t):=\mathcal C(X(t)).
      \]

      By (A1b), u solves the exact classical incompressible Navier-Stokes equations on R 3 with datum u 0. The strict-shadow/norm comparison gives

      \[
      \sup_{t\ge0}\|u(t)\|_{H^s}
      \le
      C\sup_{t\ge0}\|X(t)\|_{H_D^s}<\infty.
      \]

      Since s>5/2, the classical continuation criterion prevents any finite-time classical breakdown. The energy inequality supplies finite energy for all time. Thus the whole-space branch follows for the arbitrary datum u 0.

      and the carrier equation is exactly the Leray-projected classical Navier-Stokes equation.

      for arbitrary smooth rapidly decaying divergence-free data. This is precisely the global regularity control needed on R 3.

      The closed periodic branch supplies compact-domain terminal continuation. It does not automatically supply the three uniform exhaustion estimates above. Torus compactness loses exterior decay, and periodic pressure lacks the whole-space harmonic/far-field normalization unless pressure-tail convergence is proved.

      (A1c R) direct global H s( R 3) control on the realized carrier; an exhaustion theorem with uniform local H s, pressure-tail, and exterior-decay bounds; one of the classical ladder theorems (C1) or (C2) from the discharge ladder; a strict-shadow global carrier-control theorem (A1c) on a genuine Euclidean exported carrier.

      The conditional direct-positive whole-space export theorem is proved here, with the exact remaining direct-positive burden identified. Periodic closure alone is not claimed to export to R 3, and the current CM-facing R3 branch is not reopened.


