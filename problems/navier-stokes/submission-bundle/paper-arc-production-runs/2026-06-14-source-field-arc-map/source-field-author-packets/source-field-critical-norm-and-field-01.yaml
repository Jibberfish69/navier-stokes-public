      \subsection{Exact-Potential V2 Operator-Class Normalization Wall}

      The three historical \(V2\) routes failed for the same reason: the installed
      localized defect equation was still only the F.11d chart equation

      \[
      \partial_t \widetilde q_k
      -\nabla_\zeta\cdot(a_k\nabla_\zeta \widetilde q_k)
      +b_k\cdot \nabla_\zeta \widetilde q_k
      +c_k\widetilde q_k
      =
      \widetilde f_k,
      \]

      with coefficient control from the F.11d packet.  The Stokes route wanted a
      Stokes-preserving localization.  The convex product-set route wanted the
      lower-order packet (F.11g2)--(F.11g3).  The analytic route wanted a stronger
      analytic normalization.  All three asks point to one common missing object:
      upgrade the installed F.11d localization to an admissible observable operator
      class.

      That was the clean historical termination statement for the raw menu:

      \[
      \begin{gathered}
      \text{forcing packet}\\
      \Longrightarrow \text{one }V2\text{ operator-class normalization theorem}\\
      \Longrightarrow \text{exact-potential readout}\\
      \Longrightarrow \text{pressure-defect conclusion}.
      \end{gathered}
      \]

      The repaired direct branch now moves beyond that old wall by reading the F.11d
      operator in the static-diffusion form with fixed metric \(\nu G_k\), then using
      the fixed-metric route below.


