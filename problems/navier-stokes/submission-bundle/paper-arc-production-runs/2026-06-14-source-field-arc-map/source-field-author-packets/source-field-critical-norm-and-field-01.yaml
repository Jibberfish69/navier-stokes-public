      \subsection{Classical Low-Mode Coefficient Lemma}

      This lemma removes a bookkeeping worry from the scale-barrier and gradient
      bridges.  After the frequency cutoff \(N\) is fixed, the low-mode coefficient
      \(\mathcal L_N\) is controlled by the ordinary energy bound on the classical
      surface.

      \[
      \sup_{t\in[0,T]}\|u(t)\|_{L^2_x} \le M.
      \]

      \[
      \mathcal{L}_N(t) := 1 + \sum_{k\le N-4}2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}.
      \]

      The same statement holds uniformly for any classical approximation family
      \(u^{(n)}\) with a uniform \(L^\infty_tL^2_x\) bound.

      \[
      \mathcal{L}_N(t)
      \le
      1 + C\,2^{3N/2} M
      \]

      for almost every \(t\), where \(C\) depends on the dyadic partition.  Indeed,

      \[
      \|\Delta_k u(t)\|_{L^2_x} \le \|u(t)\|_{L^2_x} \le M.
      \]

      \[
      \sum_{k\le N-4}2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}
      \le
      M\sum_{k\le N-4}2^{3k/2}
      \le
      C\,2^{3N/2}M.
      \]

      Adding the constant term \(1\) gives the pointwise bound for
      \(\mathcal L_N(t)\).  The \(L^\infty_t\) and \(L^1_t\) bounds follow on every
      finite time interval.

      This lemma has a narrow proof role.  It keeps the fixed low-mode coefficient as
      support after \(N\) is chosen.  The genuine bridge burden remains the
      high-frequency transport estimate from D.35.

      On the exact \(4\to1\) tail-energy surface, the fixed-cutoff comparison is also
      benign.  The coercive high-frequency dissipation carries the scale
      \[
        2^{2N},
      \]
      while the low-mode coefficient grows only like
      \[
        2^{3N/2}.
      \]
      The damping scale dominates the fixed low-mode growth once high-frequency
      coercivity is retained.  This places \(\mathcal L_N\) in the support layer,
      separate from the continuation criterion.


