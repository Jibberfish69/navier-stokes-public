      \subsection{Theorem D.4: Shadow Continuation Theorem}

      D.4 is the continuation bridge between carrier control and the classical
      shadow.  The theorem target is
      \[
      \sup_{t<T}\|X(t)\|_{H_D^s}<\infty,
      \qquad s>5/2,
      \qquad u=\mathcal C(X),
      \]
      implies that \(u\) extends past \(T\).  The comparison recorded in the route is
      \[
      \|u\|_{H^1}+\|\nabla\times u\|_{L^2}
      \le
      C\Big(
      \|\Delta_{D,\omega}^{1/2}X\|
      +\|\Omega_D(X)\|
      \Big),
      \]
      with the stronger \(H^s\) comparison available on the torus-side proving
      ground:
      \[
      \|u\|_{H^s}\le C\|X\|_{H_D^s}.
      \]

      In the local window formulation, write \(u=\pi_f(X)\).  The exact projection
      from D.3 gives the local equation for \(u\).  The continuation transfer says
      \[
      \sup_{t<T_*}\|u(t)\|_{C^1(U)}<\infty
      \quad\Longrightarrow\quad
      \sup_{t<T_*}\|X(t)\|_{\mathcal N}<\infty
      \quad\Longrightarrow\quad
      X \hbox{ and } u \hbox{ extend.}
      \]
      The proof uses the decomposition
      \[
      X=\pi_f^\sharp u+P_\perp X,
      \qquad
      \|X\|_{\mathcal N}
      \le
      C\big(\|u\|_{C^1(U)}+\|\Omega_DX\|_H\big),
      \]
      and the D.2 commutator-tier inequality for \(\Omega_DX\).  In blow-up
      alternative form, the route states
      \[
      T_*<\infty
      \quad\Longrightarrow\quad
      \limsup_{t\uparrow T_*}\|u(t)\|_{C^1(U)}=\infty.
      \]
      The concrete realization note supplies the carrier--classical equivalence
      (\(R4\)) and the classical continuation criterion (\(R6\)).  This makes D.4 a
      transfer theorem: bounded carrier control is enough for classical
      continuation once the strict readout from D.3 is in force.


