      \subsection{Coherent Readout Low-Mode Comparison Theorem}

      The first theorem debt after the carrier ontology refactor is the comparison
      between coherent readout and the full classical low-mode band.  The readout
      splits the velocity into a coherent part and a noncoherent remainder:

      \[
      u := \rho(X),
      \qquad
      u_{\mathrm{coh}} := \rho(\mathbb H_D X),
      \qquad
      u_{\mathrm{noncoh}} := \rho((I-\mathbb H_D)X).
      \]

      \[
      u = u_{\mathrm{coh}} + u_{\mathrm{noncoh}}.
      \]

      \[
      u_{<j_0}:=P_{\le j_0}u.
      \]

      \[
      P_{\le j_0}u_{\mathrm{coh}}
      =
      \rho(\mathbb S_D(j_0)\mathbb H_D X)
      \]

      \[
      P_{\le j_0}u
      =
      P_{\le j_0}u_{\mathrm{coh}}
      +
      P_{\le j_0}u_{\mathrm{noncoh}}.
      \]

      The coherent term is the target of the carrier-side transport theorem.  The
      noncoherent term is the exported remainder.  A principal low-mode strain theorem
      proved on the coherent readout side transfers to the full classical low-mode
      band after the noncoherent readout is absorbed at the same viscous scale as the
      classical low-mode target.

      The structural theorem debt at this interface is a scale-sized \(H_D^s\)-bound
      for the noncoherent component:
      \[
      P_{\le j_0}u_{\mathrm{noncoh}}
      \quad\hbox{is lower order at the same viscous scale as}\quad
      P_{\le j_0}u.
      \]
      This is a carrier-side input.  It tells the reader exactly how coherent readout
      control becomes full classical low-mode control.  The later transport estimates
      use this comparison as their entry point.


