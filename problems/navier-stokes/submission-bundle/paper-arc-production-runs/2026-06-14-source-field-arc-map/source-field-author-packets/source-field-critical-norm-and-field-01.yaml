    splits the velocity into a coherent part and a noncoherent remainder:

    \[
    u := \rho(X),
    \qquad
    u_{\mathrm{coh}} := \rho(\mathbb H_D X),
    \qquad
    u_{\mathrm{noncoh}} := \rho((I-\mathbb H_D)X).
    \]

    \[
    u = u_{\mathrm{coh}} + u_{\mathrm{noncoh}}.
    \]

    \[
    u_{<j_0}:=P_{\le j_0}u.
    \]

    \[
    P_{\le j_0}u_{\mathrm{coh}}
    =
    \rho(\mathbb S_D(j_0)\mathbb H_D X)
    \]

    \[
    P_{\le j_0}u
    =
    P_{\le j_0}u_{\mathrm{coh}}
    +
    P_{\le j_0}u_{\mathrm{noncoh}}.
    \]

    The coherent term is the target of the carrier-side transport theorem.  The
    noncoherent term is the exported remainder.  A principal low-mode strain theorem
    proved on the coherent readout side transfers to the full classical low-mode
    band after the noncoherent readout is absorbed at the same viscous scale as the
    classical low-mode target.

    The structural theorem debt at this interface is a scale-sized \(H_D^s\)-bound
    for the noncoherent component:
    \[
    P_{\le j_0}u_{\mathrm{noncoh}}
    \quad\hbox{is lower order at the same viscous scale as}\quad
    P_{\le j_0}u.
    \]
    This is a carrier-side input.  It tells the reader exactly how coherent readout
    control becomes full classical low-mode control.  The later transport estimates
    use this comparison as their entry point.



    \subsection{Theorem D.4: Shadow Continuation Theorem}

    D.4 is the continuation bridge between carrier control and the classical
    shadow.  The theorem target is
    \[
    \sup_{t<T}\|X(t)\|_{H_D^s}<\infty,
    \qquad s>5/2,
    \qquad u=\mathcal C(X),
    \]
    implies that \(u\) extends past \(T\).  The comparison recorded in the route is
    \[
    \|u\|_{H^1}+\|\nabla\times u\|_{L^2}
    \le
    C\Big(
    \|\Delta_{D,\omega}^{1/2}X\|
    +\|\Omega_D(X)\|
    \Big),
    \]
    with the stronger \(H^s\) comparison available on the torus-side proving
    ground:
    \[
    \|u\|_{H^s}\le C\|X\|_{H_D^s}.
    \]

    In the local window formulation, write \(u=\pi_f(X)\).  The exact projection
    from D.3 gives the local equation for \(u\).  The continuation transfer says
    \[
    \sup_{t<T_*}\|u(t)\|_{C^1(U)}<\infty
    \quad\Longrightarrow\quad
    \sup_{t<T_*}\|X(t)\|_{\mathcal N}<\infty
    \quad\Longrightarrow\quad
    X \hbox{ and } u \hbox{ extend.}
    \]
    The proof uses the decomposition
    \[
    X=\pi_f^\sharp u+P_\perp X,
    \qquad
    \|X\|_{\mathcal N}
    \le
    C\big(\|u\|_{C^1(U)}+\|\Omega_DX\|_H\big),
    \]
    and the D.2 commutator-tier inequality for \(\Omega_DX\).  In blow-up
    alternative form, the route states
    \[
    T_*<\infty
    \quad\Longrightarrow\quad
    \limsup_{t\uparrow T_*}\|u(t)\|_{C^1(U)}=\infty.
    \]
    The concrete realization note supplies the carrier--classical equivalence
    (\(R4\)) and the classical continuation criterion (\(R6\)).  This makes D.4 a
    transfer theorem: bounded carrier control is enough for classical
    continuation once the strict readout from D.3 is in force.



    \subsection{Exact-Potential Analytic-Coefficient V2 Route Audit}

    The older \(V2\) analytic-coefficient import is tested here inside the
    exact-potential route.  Its role is limited: it asks whether the installed
    localization \(F.11d\) licenses the analytic-coefficient measurable-set route.

    The installed chart equation is

    \[
    \partial_t \widetilde q_k
    -\nabla_\zeta\cdot(a_k\nabla_\zeta \widetilde q_k)
    +b_k\cdot \nabla_\zeta \widetilde q_k
    +c_k\widetilde q_k
    =
    \widetilde f_k,
    \]

    with coefficient control only at the uniformly elliptic and bounded level.  An
    analytic-coefficient import needs more: the selector-chart coefficients must be
    analytic in the relevant space-time variables, the chart equation must be
    normalized into the analytic parabolic class, and the localized source ledger
    must remain admissible under that normalization.

    Escauriaza--Montaner--Zhang supply a real measurable-set observability theorem
    for analytic parabolic evolutions.  That result applies only after the local
    operator has been placed in the analytic class.  The current \(F.11d\) packet
    does not do that.

    The analytic branch remains conditional on one stronger
    analytic-normalization theorem:

    \[
    \text{installed localization packet}
    \quad\Longrightarrow\quad
    \text{analytic parabolic evolution class}.
    \]

    This is not the current active stop line for the whole exact-potential \(V2\)
    route.  The three older \(V2\) audits now collapse to a historical
    operator-class wall, and the active conservative direct continuation is the
    repaired direct route using Laurent--Leautaud fixed-metric Lipschitz Carleman
    observability together with Wang--Zhang measurable-time observability.  That
    direct branch closes \(V2\) under its explicit two-import packet and then feeds
    the installed \(EP.8\to PD.70z\) and \(SG.4B\) handoff.

    D.88 stays in the appendix as route hygiene.  It prevents the analytic
    observability import from being used prematurely, while the active
    exact-potential continuation now lives on the repaired direct branch rather
    than on this older analytic-coefficient attempt.



    \subsection{Exact-Potential Convex V2 Normalized Chart-Defect Rigidity}

    D.94 rewrites the same wall in the variables actually produced by \(F.11d\).
    On the installed chart packet the diffusion matrix has the form

    \[
    a_k(\zeta,t)=\nu G_k(\zeta)+a_k^{chart}(\zeta,t),
    \]

    where \(G_k\) is fixed by the chosen chart and the time dependence enters
    through the chart-defect term \(a_k^{chart}\).  For one retained block
    \(\Omega_k\times I_k\), set \(m=6\) and define

    \[
    B_k(\zeta,t)
    :=
    \nu^{-1}G_k(\zeta)^{-1/2}\,a_k^{chart}(\zeta,t)\,G_k(\zeta)^{-1/2},
    \]

    \[
    a_k(\zeta,t)
    =
    \nu\,G_k(\zeta)^{1/2}\bigl(I+B_k(\zeta,t)\bigr)G_k(\zeta)^{1/2}.
    \]

    \[
    \mathfrak B_k(\zeta,t)
    :=
    \bigl(\det(I+B_k(\zeta,t))\bigr)^{-1/m}\,
    \bigl(I+B_k(\zeta,t)\bigr),
    \qquad m=6.
    \]

    The normalized anisotropy of \(a_k\) is
    \[
    (\det a_k)^{-1/m}a_k
    =
    (\det G_k)^{-1/m}
    G_k^{1/2}\,
    \mathfrak B_k\,
    G_k^{1/2}.
    \]

    Since \(G_k\) is time-independent, the common conformal-structure condition is
    equivalent to time-rigidity of the normalized chart defect:

    \[
    \mathfrak B_k(\cdot,t)\equiv \mathfrak B_k(\cdot,t')
    \qquad\text{for all }t,t'\in I_k.
    \]

    This is the sharp installed form of the convex-wall debt.  The debt is the
    determinant-normalized matrix \(I+B_k\), built from the pair-drift contribution
    \(a_k^{chart}\), staying fixed in time on each retained chart.  That theorem is
    not supplied by \(F.11d\); \(F.11d\) supplies the localized operator and
    coefficient bounds.



    \subsection{Exact-Potential V2 Operator-Class Normalization Wall}

    The three historical \(V2\) routes failed for the same reason: the installed
    localized defect equation was still only the F.11d chart equation

    \[
    \partial_t \widetilde q_k
    -\nabla_\zeta\cdot(a_k\nabla_\zeta \widetilde q_k)
    +b_k\cdot \nabla_\zeta \widetilde q_k
    +c_k\widetilde q_k
    =
    \widetilde f_k,
    \]

    with coefficient control from the F.11d packet.  The Stokes route wanted a
    Stokes-preserving localization.  The convex product-set route wanted the
    lower-order packet (F.11g2)--(F.11g3).  The analytic route wanted a stronger
    analytic normalization.  All three asks point to one common missing object:
    upgrade the installed F.11d localization to an admissible observable operator
    class.

    That was the clean historical termination statement for the raw menu:

    \[
    \begin{gathered}
    \text{forcing packet}\\
    \Longrightarrow \text{one }V2\text{ operator-class normalization theorem}\\
    \Longrightarrow \text{exact-potential readout}\\
    \Longrightarrow \text{pressure-defect conclusion}.
    \end{gathered}
    \]

    The repaired direct branch now moves beyond that old wall by reading the F.11d
    operator in the static-diffusion form with fixed metric \(\nu G_k\), then using
    the fixed-metric route below.


