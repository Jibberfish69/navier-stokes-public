      \subsection{Classical \(H^1\) Continuation Lemma}

      Let \(u\) be a classical solution of the three-dimensional incompressible
      Navier--Stokes equation on its maximal interval
      \[
        [0,T_*)\times \mathbb R^3.
      \]
      Assume the continuation norm used on this manuscript surface is bounded:

      \[
      \sup_{0\le t<T_*}\|u(t)\|_{H^1(\mathbb R^3)}<\infty.
      \]

      Set
      \[
      M:=\sup_{0\le t<T_*}\|u(t)\|_{H^1(\mathbb R^3)}.
      \]
      The local continuation theorem gives a time \(\tau(M)>0\), depending on this
      bound alone.  Every datum with \(H^1\)-norm at most \(M\) launches a unique
      classical solution for time \(\tau(M)\).

      Choose \(t_n\uparrow T_*\).  Then
      \[
      \|u(t_n)\|_{H^1(\mathbb R^3)}\le M.
      \]
      For \(n\) large enough,
      \[
      t_n+\tau(M)>T_*.
      \]
      Let \(v_n\) be the local classical solution on
      \([t_n,t_n+\tau(M)]\) with initial data \(u(t_n)\).  Since \(u\) is already a
      classical solution on \([0,T_*)\), uniqueness in the same classical class gives

      \[
      v_n(t)=u(t)
      \qquad\text{for }t\in[t_n,T_*).
      \]
      Define the extended field by \(u\) on \([0,T_*)\) and by \(v_n\) on
      \([T_*,t_n+\tau(M)]\).  This extends the same classical solution past \(T_*\),
      contradicting maximality.

      Finite-time breakdown on this classical surface requires
      \[
      \limsup_{t\uparrow T_*}\|u(t)\|_{H^1(\mathbb R^3)}=\infty.
      \]
      This lemma isolates the final continuation step.  A bounded \(H^1\) continuation
      norm gives an extension of the same classical solution.  The scale-barrier and
      warrant material above can close a Euclidean route only after it supplies this
      bounded continuation norm on the same solution surface.


