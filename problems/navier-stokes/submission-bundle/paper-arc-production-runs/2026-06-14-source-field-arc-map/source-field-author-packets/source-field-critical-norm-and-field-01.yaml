      \subsection{Exact-Potential Convex V2 Normalized Chart-Defect Rigidity}

      D.94 rewrites the same wall in the variables actually produced by \(F.11d\).
      On the installed chart packet the diffusion matrix has the form

      \[
      a_k(\zeta,t)=\nu G_k(\zeta)+a_k^{chart}(\zeta,t),
      \]

      where \(G_k\) is fixed by the chosen chart and the time dependence enters
      through the chart-defect term \(a_k^{chart}\).  For one retained block
      \(\Omega_k\times I_k\), set \(m=6\) and define

      \[
      B_k(\zeta,t)
      :=
      \nu^{-1}G_k(\zeta)^{-1/2}\,a_k^{chart}(\zeta,t)\,G_k(\zeta)^{-1/2},
      \]

      \[
      a_k(\zeta,t)
      =
      \nu\,G_k(\zeta)^{1/2}\bigl(I+B_k(\zeta,t)\bigr)G_k(\zeta)^{1/2}.
      \]

      \[
      \mathfrak B_k(\zeta,t)
      :=
      \bigl(\det(I+B_k(\zeta,t))\bigr)^{-1/m}\,
      \bigl(I+B_k(\zeta,t)\bigr),
      \qquad m=6.
      \]

      The normalized anisotropy of \(a_k\) is
      \[
      (\det a_k)^{-1/m}a_k
      =
      (\det G_k)^{-1/m}
      G_k^{1/2}\,
      \mathfrak B_k\,
      G_k^{1/2}.
      \]

      Since \(G_k\) is time-independent, the common conformal-structure condition is
      equivalent to time-rigidity of the normalized chart defect:

      \[
      \mathfrak B_k(\cdot,t)\equiv \mathfrak B_k(\cdot,t')
      \qquad\text{for all }t,t'\in I_k.
      \]

      This is the sharp installed form of the convex-wall debt.  The debt is the
      determinant-normalized matrix \(I+B_k\), built from the pair-drift contribution
      \(a_k^{chart}\), staying fixed in time on each retained chart.  That theorem is
      not supplied by \(F.11d\); \(F.11d\) supplies the localized operator and
      coefficient bounds.


