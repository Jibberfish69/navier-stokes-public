      \subsection{Coefficient-Bearing HFG Variant Conditional}

      This branch tries to absorb a high-frequency coefficient directly into the tail
      energy inequality.  It becomes usable when the coefficient-bearing product
      estimate is available on the same surface.

      \[
      \widetilde\Lambda_N^\sharp E_N\le \varepsilon\nu D_N+C_\varepsilon R_N
      \]

      \[
      \frac{d}{dt}E_N(t)+c\nu D_N(t)
      \le C\widetilde\Lambda_N^\sharp(t)E_N(t)+R_N(t).
      \]

      This is the finite-threshold tail energy inequality.  The pointwise absorbable
      form is stronger:

      \[
      \frac{d}{dt}E_N(t)+c'\nu D_N(t)
      \le C_\varepsilon R_N(t).
      \]

      \[
      \sum_{j\ge N}2^{3j/2}\|\Delta_j\omega\|_{L_t^1L_x^2}<\infty.
      \]

      The installed weighted carrier result leaves that product-control estimate
      unpaid.  This branch stays conditional until the displayed high-frequency gain
      is proved on the same classical surface.


