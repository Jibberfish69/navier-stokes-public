      \subsection{Affine-Excess Coefficient-Dependence Audit}

      This audit explains why the local affine-excess absorption constants are
      scale-normalized rather than radius-dependent.  The coefficient bundle is

      \[
      B_R=1+A_R+V_R+P_R.
      \]

      The physical radius \(R\) enters through the normalized quantities
      \(A_R,V_R,P_R\).  After parabolic scaling, the local inequality has
      radius-free constants:

      \[
      \left(\eta_X+\int_I F_R\right)
      \exp\left(\int_I B_R\right)\le2\eta_X,
      \]

      along with the nonlinear absorption condition for the \(X_R^{1/2}N_R\) term.
      The support supplied here is local: \(L^1_t\) control and absolute continuity
      on a finite cover make the coefficient-demotion step lawful.  This does not
      create the global restart seed by itself.


