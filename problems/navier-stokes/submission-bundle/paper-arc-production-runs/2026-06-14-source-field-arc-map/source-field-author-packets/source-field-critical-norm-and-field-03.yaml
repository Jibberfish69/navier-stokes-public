    text: |+
      \subsection{Augmented Coefficient Admissibility For N}

      This is a scheduler-local admissibility result for the coefficient in the
      repaired gradient cascade estimate.  The point is modest: after the scheduler
      chooses a fixed threshold \(N_a\), the coefficient that drives the cascade is
      integrable on that scheduler interval.  The statement does not give a
      uniform-in-threshold bound.

      \[
      \Lambda_{N_a}(t):=\|\nabla S_{N_a-4}u(t)\|_{L^\infty},
      \]

      \[
      \Theta_{N_a}^\sharp(t):=
      \sum_{m=N_a-M}^{N_a+M}2^{3m}\|\Delta_m u(t)\|_2^2,
      \]

      \[
      \widetilde\Lambda_{N_a}^\sharp(t):=\Lambda_{N_a}(t)+\Theta_{N_a}^\sharp(t).
      \]

      \[
      \widetilde\Lambda_{N_a}^\sharp\in L^1(I_a).
      \]

      The integral is finite with an explicit bound depending only on the fixed
      threshold, the collar width, the length of the scheduler interval, and the route
      energy/enstrophy budget.  The low-frequency part is estimated by Bernstein:

      \[
      \|\nabla S_{N_a-4}u(t)\|_\infty
      \le
      C\sum_{k\le N_a-4}2^{\frac52k}\|\Delta_k u(t)\|_2.
      \]

      The near-threshold part is the finite shell sum
      \(\Theta_{N_a}^\sharp\), so it is controlled on \(I_a\) by the same
      energy/enstrophy budget used by the scheduler.  Since \(N_a\) is fixed on the
      interval, the scheduler can subdivide \(I_a\) into pieces on which

      \[
      \int_J\widetilde\Lambda_{N_a}^\sharp(t)\,dt
      \]

      has any prescribed finite budget.  This supplies fixed-threshold admissibility
      on each scheduler interval.  It makes no uniform-in-threshold claim and spends
      no scale-critical velocity control.



