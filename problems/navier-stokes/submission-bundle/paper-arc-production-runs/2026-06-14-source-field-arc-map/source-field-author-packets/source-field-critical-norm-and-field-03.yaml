    text: |+
      \subsection{Field avg / Jump avg Definition Integrity}

      Equivalently, Field avg means a terminal positive-scale SCF-good same-fluid cover exists.

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T)
      \Longleftrightarrow
      \forall T'\subset T\text{ terminal},\quad
      \inf_{(a,t)\in T'}r_{\mathrm{good}}(a,t)=0.
      \]

      If Field avg holds, a terminal subtail has a positive lower SCF-good radius. Compactness and bounded same-fluid distortion extract a finite positive-scale SCF-good cover on that subtail. Thus terminal radius loss fails.

      If Field avg fails, every terminal subtail has arbitrarily small SCF-good radius somewhere. This includes both direct bad-set contact and sequence collapse toward T *. By definition this is Jump avg.

      The two alternatives are complementary because the radius characterization splits
      the terminal subtail into positive lower radius and arbitrarily small lower
      radius.

      This prevents both endpoint-face definition drift and averaged/pointwise type leakage.


