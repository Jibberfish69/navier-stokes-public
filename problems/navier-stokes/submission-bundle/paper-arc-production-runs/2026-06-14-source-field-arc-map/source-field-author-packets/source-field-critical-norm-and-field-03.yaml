    text: |+
      \subsection{Active-shell source normalization - failed discharge}

      This failed discharge tests active-shell source normalization strong enough to
      prevent nonlinear shell flux from maintaining source-balanced active pulses.

      The shell flux \(F_j\) is a trilinear expression in the Littlewood-Paley
      components of \(u\). A universal normalization derived only from smooth
      divergence-free original data fails the fixed-shell amplitude test: scaling a
      smooth finite-mode divergence-free profile by amplitude \(A\) makes \(F_j\)
      scale like \(A^3\), so \(|F_j|^2\) scales like \(A^6\) on short intervals.

      Finite energy and preterminal smoothness bound the amplitude only by
      data-dependent quantities. They do not produce the scale-normalized smallness
      required by the active interval theorem. The active interval itself may occur
      near the terminal time and drift to higher shells.

      The heat-scale source and amplitude-gain routes remain conditional on this
      source normalization or an equivalent source-control replacement.


