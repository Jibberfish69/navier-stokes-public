      \subsection{Field avg Terminal Good-Cover Equivalence}

      Let T be a bounded-distortion same-fluid terminal approach tail. For (a,t) T, define the local SCF-good radius

      \[
      \mathcal B_{\varepsilon_m}^{\Phi}:=\{(a,t):r_{\mathrm{good}}(a,t)=0\}.
      \]

      Equivalently, after passing to a terminal subtail, every point admits an SCF base good same-fluid cylinder at a common positive scale.

      This definition includes both pointwise bad-set contact and terminal radius degeneration.

      \[
      \exists T'\subset T,\ \exists\{Q_{r_j}^{\Phi}(a_j,t_j)\}_{j=1}^{J},\ \exists r_*>0
      \]

      Suppose Field avg(T) holds. Then there is a terminal subtail T' and r *>0 such that r good(a,t) r * on T'. For each (a,t) T', choose a same-fluid SCF-good cylinder with radius at least r */2. These cylinders form an open cover of the route-relevant material tail. The material cross-section is compact after passing to the retained terminal subtail, and bounded same-fluid distortion preserves finite overlap after shrinking if necessary. Hence finitely many selected cylinders cover T', all with radius at least r */2 and all satisfying SCF base m.

      Conversely, suppose such a finite positive-scale cover exists. For every point of the covered terminal tail, the containing cover cylinder supplies a positive SCF-good scale bounded below by a geometric fraction of the cover radius. Since the finite cover has minimum radius at least r *, there is a common positive lower bound for r good on a terminal subtail. Hence Field avg(T) holds.

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T)
      \Longleftrightarrow
      \forall T'\subset T\text{ terminal},\quad
      \inf_{(a,t)\in T'}r_{\mathrm{good}}(a,t)=0.
      \]

      \[
      \inf_{(a,t)\in T'}r_{\mathrm{good}}(a,t)=0.
      \]

      Thus terminal radius collapse is a genuine Field avg failure, not a fifth endpoint face.


