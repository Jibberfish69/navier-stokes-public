      \subsection{Active-shell amplitude gain - equivalence to source normalization}

      Since \(D_j=2^{2j}E_j\), the gain
      \[
      2^{-j}D_j(t)^2\le \varepsilon\nu D_j(t)+r_j(t)
      \]
      is equivalent to an active-shell amplitude restriction on \(E_j\), or
      equivalently to a source normalization strong enough to prevent nonlinear shell
      flux from maintaining high active amplitude.

      The active-shell amplitude gain is a source-normalization theorem in another
      form.

      Original Smooth Data gives finite energy, finite dissipation, and smoothness on
      every compact preterminal interval. It does not give uniform decay on moving
      active shells approaching \(T_*\). A terminal active shell can drift to higher
      frequencies while preserving finite raw energy/dissipation.

      The active upper-tail Carleson route remains conditional on this gain or one of
      its equivalent source-control replacements.


