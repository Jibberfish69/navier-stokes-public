    text: |+
      \subsection{Field Read And Dtc Read Invocation Read End}

      \[
      Q^\Phi(I,A_\sharp)
      \subset
      \bigcup_{i=1}^{M}Q_{r_i}^{\Phi}(a_i,t_i),
      \qquad
      r_*:=\min_i r_i>0,
      \]

      The positive lower scale and finite cover convert averaged field coherence into old pointwise field coherence. Finite chain connectivity and local ATD m supply the fixed-scale control needed to read Field avg as the old Field row.

      The velocity tower readout is a finite-cover calculation. On each shrunken cover element, the local averaged tower packet supplies the required finite-order Sobolev control. Local Sobolev/Morrey then turns that bound into a pointwise velocity-tower bound on the smaller element. Since the cover has finitely many elements and \(r_*=\min_i r_i>0\), the maximum over the cover gives one old Field-row velocity tower at the same positive scale.

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q,
      \]

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      \[
      \|\nabla^{q+1}p_i^{loc}\|_{L^\infty(B_i')}
      \le
      C_{q,\alpha,i}\|\nabla^q(\chi_i u\otimes u)\|_{C^{0,\alpha}(2B_i)}.
      \]

      \[
      \|\nabla^{q+1}h_i\|_{L^\infty(B_i')}
      \le
      C_{q,i}\|u_0\|_{L^2(T^3)}^2.
      \]

      ATD m supplies the product-source carrier on the finite cover, and the periodic energy bound supplies the harmonic tail. So the pressure part of K q is available.


