    x=X_T(t)+J_T(t)y.
    \]
    Taylor expansion around the center leaves only the curvature of the drift and
    the variation of the affine matrix.  The coefficient-good packet estimate is
    \[
    \|\mathcal E_T(t)u(t)\|_{\mathcal P_N}
    \le
    \beta_T(t)\|u(t)\|_{\mathcal P_N}.
    \]

    Terms generated outside the strict tube are handled by the Gaussian weight.
    Polynomial factors are harmless inside the packet space because, for each
    fixed \(m\),
    \[
    \left(1+\frac{|y|}{r_T}\right)^m e^{a'|y|^2/r_T^2}
    \le C_{m,a,a'} e^{a|y|^2/r_T^2}
    \qquad (0<a'<a).
    \]

    The affine heat kernel is spatially Gaussian and maps \(\mathcal P_N\) to
    itself, losing only the derivative already accounted for in the packet norm.
    Combining center cancellation, coefficient goodness, and Gaussian-tail control
    gives
    \[
    \|H_T(t,s)\mathcal E_T(s)u(s)\|_{\mathcal P_N}
    \le
    C\beta_T(s)\|u(s)\|_{\mathcal P_N}.
    \]

    This is an affine-metric packet estimate.  It proves the packet-space error
    bound under Coeff Good Pse.A.  It does not by itself convert the final Gaussian
    packet into a physical isotropic packet; that conversion still needs the
    metric-comparability and distortion controls attached to the same terminal
    packet.



    \subsection{Averaged Route Reduction and the Active-coefficient Gap}

    \[
    Dead,\qquad packing\text{-}detached,\qquad tower\text{-}blown,\qquad Jump.
    \]

    The averaged branch is the production branch for this part of the route.
    Pointwise readout is used only after the averaged endpoint package has supplied
    a terminal positive-scale cover.

    Let \((u,p)\) be the maximal smooth periodic solution on \([0,T_*)\).  On a
    same-fluid terminal approach tail, either one of the endpoint faces is realized,
    or the branch retains the finite class-membership data needed to run the
    averaged route.

    On the face-free branch, finite energy and local suitability give
    material-a.e. SCF-base good cylinders on bounded-distortion same-fluid charts.

    \[
    u\in L_t^\infty L_x^2,
    \qquad
    \nabla u\in L^2_{t,x},
    \qquad
    u\in L^3_{loc},
    \qquad
    p\in L^{3/2}_{loc},
    \]

    On every SCF-base good same-fluid cylinder with admissible distortion,
    ATD\(_m\) gives a finite-depth averaged affine tower packet on a smaller
    cylinder.

    The moving-cylinder gain theorem gives CKN epsilon regularity in the moving
    frame, derivative bounds through depth \(m+2\), pressure/viscous readout for
    the \(K_q\) rungs, and the averaged affine seed

    \[
    X_{\theta r}(s_a)\le\eta_X.
    \]

    \[
    X_{\theta r}\in L^\infty,
    \qquad
    N_{\theta r}\in L^1,
    \qquad
    \mathcal K_{\le m}^{avg,\theta r}\in L^1.
    \]

    The local ATD\(_m\) theorem supplies the small seed and the finite local
    coefficient records on each shrunken good cylinder.  Absorption works on a
    single cylinder when the scheduler interval makes the accumulated coefficient
    budget smaller than the fixed absorption threshold:
    \[
    \int_I N_{\theta r}(t)\,dt
    +\int_I \mathcal K_{\le m}^{avg,\theta r}(t)\,dt
    \le \varepsilon_{\mathrm{abs}}.
    \]

    The remaining issue is a finite-cover scheduler theorem.  The terminal
    same-fluid cover must be selected so that the averaged budget can be summed
    over the required finite parameter set with a common overlap bound and a common
    scheduler partition.


