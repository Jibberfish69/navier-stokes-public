      \subsection{Strict Low-Mode Gradient Packet Estimate}

      Theorem-facing discharge for the strict low-high and strict high-low packets in the gradient cascade split.

      \[
      a_N(t):=S_{N-4}u(t),
      \qquad
      \Lambda_N(t):=\|\nabla a_N(t)\|_{L^\infty}.
      \]

      \[
      u_j:=\Delta_j u,
      \qquad
      E_N(t):=\sum_{j\ge N}2^{2j}\|u_j(t)\|_2^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|u_j(t)\|_2^2.
      \]

      \[
      LH_j:=\left\langle [\Delta_j,a_N\cdot\nabla]u_{\sfcomp{25660} j},-\Delta u_j\right\rangle,
      \]

      where u j denotes the finite shell collar around j. Define the strict high-low packet by

      \[
      HL_j:=\left\langle \Delta_j(u_{\sfcomp{25666} j}\cdot\nabla a_N),-\Delta u_j\right\rangle.
      \]

      \[
      \sum_{j\ge N}|LH_j|+\sum_{j\ge N}|HL_j|
      \le
      C\Lambda_N(t)E_N(t).
      \]

      The strict low-high contribution is the commutator term. The dyadic commutator bound used here is

      The strict low-mode portion of the gradient cascade is controlled entirely by N(t)E N(t). The dissipative fractions displayed in the target estimates are available as reserve terms.

      The strict low-mode packets LH j and HL j are discharged. The threshold-spill collar and genuine high-high packet remain separate slots in the reassembled commutator theorem.


