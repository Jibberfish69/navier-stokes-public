      \subsection{Source Weighted Terminal Angular Depletion.A continuation}

      Failed unconditional discharge from installed inputs. The source-weighted angular route advances to a precise signed no-free-sink subtheorem, and then to the terminal Zeno refill atom.

      \[
      \sum_{P\in\mathcal F_N}\int_{Q(P)}
      \chi_P |w_{j_P}|^2
      \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+dxdt
      \le
      \theta\sum_P\int_{Q(P)}\mathcal D_P
      +Legal_N(\mathcal F_N)+o_N(1),
      \quad 0<\theta<1.
      \]

      The material eigenframe split decomposes the coefficient into threshold-small, far-low turnover, near-band turnover, and source-residence components.

      The threshold-small term is drain-absorbable. Far-low turnover has parabolic scale separation and routes into legal records. The installed ASAC assembly pays the active-alignment and one-sided pair-weight defect component.

      ASAC pays retained partner pair-weight mismatch. Legal records pay legal exits. Local Donor Balance.A and Entrance Leaf Decay.A pay finite donor trees.

      \[
      r_m\downarrow0,
      \qquad
      \sum_m r_m^2<\infty.
      \]

      \[
      ZenoBoundedClass_B.A+ZenoResidueLiouville_B.A,
      \]

      The direct reverse-Holder attempt failed because current same-fluid ancestry supplies L 1 t source mass and route fidelity, while the terminal atom model keeps the source marginal within that information.


