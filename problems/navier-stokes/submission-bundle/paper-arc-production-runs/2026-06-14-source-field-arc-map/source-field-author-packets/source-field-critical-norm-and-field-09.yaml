      The finite collar is not automatically harmless. Since it reaches the terminal scale, the coefficient budget

      With smooth Littlewood-Paley cutoffs, the product has Fourier support in the Minkowski sum of annuli | | 2 q and | | 2 . If q>j+C and q-K for K larger than the cutoff overlap constant, the sum is supported at frequency comparable to 2 q, hence disjoint from shell j. Thus the projection P j vanishes. Symmetrically, if q+K, the output is comparable to 2 , again disjoint from shell j. The only output-visible region satisfies \(|q-j|\le C_{\mathrm{col},37133}\).

      Even after pairing in H -1 against a shell-j adjoint packet, this is not paid by the ordinary dissipation tail of u alone. It also contains the unknown high response field Z q. Spending a raw Z norm would reintroduce a response-height assumption and undo the full-linearized adjoint gain.

      Thus High Coefficient Response Residual.A is not a one-line scale-gap theorem. The scale gap kills low-high and high-low far terms, but the high-high beat survives.

      The live correction is to stop calling the finite near-collar a residual. It belongs in the principal operator. The remaining coefficient obstruction is precisely the far-high beat channel, or else the need for a full-coefficient linearized adjoint kernel theorem.


