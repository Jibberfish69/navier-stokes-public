      \subsection{Clay problem Heat Linear Remainder No Terminal Critical Mass Direct Attempt}

      Bounded direct attempt on the heat-remainder half of Terminal Critical Duhamel Source Extraction.A.

      This does not close the public-critical bridge by itself. It shows that the linear heat remainder is not an independent source wall: it reduces to a same-witness heat-ancestor localization lemma already aligned with the retained Pack / no-earlier-slice bookkeeping.

      \[
      u_m = v_m+w_m,
      \qquad
      v_m(t)=e^{(t-t_{m,0})\nu\Delta}u_m(t_{m,0}),
      \]

      where v m is the linear heat remainder from the earlier selected slice and w m is the nonlinear Duhamel source contribution.

      \[
      \ell_m^{-2}
      \int_{t_m-\ell_m^2}^{t_m}
      \int_{B_{\ell_m}(x_m)}
      |v_m|^3\,dxdt
      \ge c_0>0.
      \]

      The heat kernel at time depth comparable to m 2 is concentrated on a spatial parent ball of radius C m. Splitting the kernel into the same-witness parent and its complement gives two alternatives.

      \[
      \int_{B_{C\ell_m}(x_m)}|u_m(s_m)|^3\,dx
      \ge c_1>0.
      \]

      If the off-parent contribution dominates, the terminal mass entered through heat-kernel tails from outside the selected same-fluid parent. That is not a new retained heat atom; it is loss of the retained carrier localization and so selects the Pack face.

      This is a heat-kernel localization lemma, not a nonlinear Navier-Stokes source estimate. Its constants must be written against the selected terminal cover and the Pack carrier radius so that the off-parent heat tail is charged to Pack failure rather than hidden as a public readout.

