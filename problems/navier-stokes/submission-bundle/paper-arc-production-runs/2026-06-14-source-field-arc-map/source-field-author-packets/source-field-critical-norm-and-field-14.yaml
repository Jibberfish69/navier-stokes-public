    text: |+
      \subsection{Shadow-Error Gronwall Continuation Criterion}

      Instead of a quartic energy inequality, it uses the standard transport commutator estimate to put the shadow remainder into a direct Gronwall form.

      \[
      \partial_t u+\mathbb P_{\mathrm{Leray}}((u\cdot\nabla)u)
      =
      \nu\Delta u+F,
      \qquad
      \nabla\cdot u=0.
      \]

      \[
      \sigma:=s-1>\frac32.
      \]

      \[
      \big|
      \langle \Lambda^\sigma((u\cdot\nabla)u),\Lambda^\sigma u\rangle
      \big|
      \le
      C_\sigma \|\nabla u\|_{L^\infty}\|u\|_{H^\sigma}^2.
      \]

      \[
      \frac12\frac{d}{dt}\|u\|_{H^\sigma}^2
      +
      \nu\|\nabla u\|_{H^\sigma}^2
      \le
      C_\sigma \|\nabla u\|_{L^\infty}\|u\|_{H^\sigma}^2
      +
      \|F\|_{H^\sigma}\|u\|_{H^\sigma}.
      \]

      \[
      Y(t):=\|u(t)\|_{H^\sigma}.
      \]

      By continuity, the same inequality holds in upper Dini derivative form at times when Y(t)=0.

      This is the cleanest classical continuation bridge for the weaker projection route.

      It proves only that once those two quantities are controlled, the classical Sobolev norm stays finite by the exact Gronwall bound (10).


