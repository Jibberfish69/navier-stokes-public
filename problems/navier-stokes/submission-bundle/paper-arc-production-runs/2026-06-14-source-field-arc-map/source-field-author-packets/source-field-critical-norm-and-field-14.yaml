    Sobolev norm stays finite by the exact Gronwall bound (10).\n\n\n\n\\subsection{Terminal-Window
    Finite-Mode Coefficient Measure}\n\n\\[\nd\\nu_N^{low}(t)=\\big(\\Lambda_N^{lin}(t)+\\Lambda_N^{low-low}(t)\\big)dt.\n\\]\n\n\\[\n\\Lambda_N^{lin}(t)+\\Lambda_N^{low-low}(t)\n\\le
    B_N(C_E,T),\n\\]\n\n\\[\n\\nu_N^{low}([a,b])\\le B_N(C_E,T)(b-a).\n\\]\n\n\\[\n\\nu_N^{low}(I)\\le
    \\kappa.\n\\]\n\n\\[\ndE_N(t)+(1-\\eta)\\nu D_N(t)dt\n\\le\nC E_N(t)d\\nu_N^{low}(t)+R_N(t)dt,\n\\]\n\nThis
    is the needed finite-mode coefficient theorem for the low-mode Duhamel product
    route on shrinking terminal windows.\n\nThe theorem is terminal-window local.
    A global interval statement would require a partition into finitely many windows
    with controlled entrance tails or a uniform-in-time coefficient theorem.\n\n\n\n\\subsection{TPS
    Shadow Barrier Formal Closure Packet}\n\nThe closure packet is deliberately conditional.
    It does not discharge the original selector-local transverse lower-bound theorem,
    and it does not promote the route past the current unsafe-overclaim guard. It
    proves only the formal implications already used by the coarse barrier, the SG
    bridge factorization, and the weak averaged shadow-time packet.\n\n\\[\nd_c(t):=|X_{\\le
    J}(a,t)-X_{\\le J}(b,t)|,\n\\qquad\nd(t):=|X(a,t)-X(b,t)|.\n\\]\n\n\\[\n\\widetilde\\sigma_J:=\\sigma_J+2\\|\\delta_J\\|_{L_t^\\infty},\n\\]\n\n\\[\nI_J:=[\\widetilde\\sigma_J,2\\widetilde\\sigma_J].\n\\]\n\n\\[\n\\mathcal
    A_J(t,a,\\theta)\n:=\n\\log s_{\\min}\\!\\big(W_J(t,b)D_\\theta\\Theta_{J,a}(\\theta)\\big).\n\\]\n\n\\[\n\\widetilde{\\mathcal
    A}_J(t,a,\\theta)\n:=\n\\mathcal A_J(t,a,\\theta)-\\log(c_\\Theta \\ell_J).\n\\]\n\nSo
    the coarse barrier theorem applies to the true shadow tube once the enlarged radius
    J is used.\n\nThus the selector-facing derivative lower bound is controlled by
    the same additive observable as the Cauchy-Green packet. .\n\nSo the selector
    coherence issue is no longer a conceptual gap. The remaining open issue is quantitative:
    one still has to prove enough positive margin to make the strip repulsion or renewal
    budget effective on an asymptotically full good family.\n\nIn particular, the
    current theorem stack does not prove that each isolated entry carries a fixed
    positive quantum of defect. What it proves is the weaker and exact statement that
    the total pair-time spent in the shadow tube is the relevant averaged defect record.\n\nThis
    is the exact place where the strong and weak routes couple without being confused:
    strong route gives no-entry; weak route gives vanishing averaged entry time.\n\nIf,
    in addition, the barrier subfamily has asymptotically full active-pair mass, then
    the good-pair contribution to the strong bad set vanishes.\n\n\n"
