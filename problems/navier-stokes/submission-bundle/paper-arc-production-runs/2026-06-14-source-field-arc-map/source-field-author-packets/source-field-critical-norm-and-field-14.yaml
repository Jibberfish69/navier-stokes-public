      \subsection{Readout-Preserving Normalization Obstruction}

      Let Z=Ae, where e is a fixed coherent selected mode. If N j preserves readout exactly on the selected coherent range, then

      On a faithful readout surface this forces the readout amplitude to remain order A. Hence the classical coefficient still scales like

      For fixed j, choosing A large violates the viscous-scale bound. Thus exact readout preservation cannot coexist with amplitude normalization at fixed shell.

      \[
      \mathcal N_j(Ae)=\lambda(A,j)Ae,
      qquad \lambda(A,j)A\le C_{\mathrm{sf},57687} \nu2^{2j},
      \]

      For large A, this defect has order A, so it is not lower order relative to the original selected coherent contribution.

      A readout-preserving normalization cannot be the missing theorem unless the route first proves an amplitude bound placing the selected coherent block already inside the active viscous scale.

      The existing weighted-carrier surface absorbs same-scale coefficient terms into N E N, but it does not produce a coefficient-free all-shell normalization.


