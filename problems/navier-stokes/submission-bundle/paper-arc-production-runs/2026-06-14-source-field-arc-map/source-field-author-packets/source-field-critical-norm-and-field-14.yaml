    text: |+
      \subsection{Route B B1 Integrable Shadow Error Plus Continuation Coupling}

      The weaker Euclidean Route B burden (B1) is separated from the Clay discharge ladder.

      \[
      \partial_t u+\mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big)
      =
      \nu\Delta u+E_{\mathrm{sh}}(X),
      \qquad
      \nabla\cdot u=0
      \]

      The first integral is the shadow-error input. The second is the classical continuation coupling.

      \[
      \sup_{0\le t<T}\|u(t)\|_{H^{s-1}}<\infty.
      \]

      Consequently, the classical shadow does not blow up on [0,T), and the route reduces to whatever standard continuation theorem is being used on the classical side.

      The two finiteness assumptions in (B1.3) make the right-hand side finite on every t<T, proving (B1.4). So no classical H s-1 blowup occurs on the window, and continuation reduces to the chosen classical continuation package. .

      \[
      \text{(B1a) prove }E_{\mathrm{sh}}(X)\in L_t^1H_x^{s-1}\text{ on the window,}
      \]

      This is the precise meaning of "integrable shadow error plus classical continuation coupling."

      \[
      \frac{d}{dt}\|\nabla u\|_{L^2}^2
      +
      \nu\|\Delta u\|_{L^2}^2
      \le
      C_\nu\|\nabla u\|_{L^2}^6
      +
      C_\nu\|E_{\mathrm{sh}}\|_{H^1}^2.
      \]

      So (B1) is not vague robustness language. It is the exact forcing-plus- continuation theorem needed to make Route B a real closure path.


