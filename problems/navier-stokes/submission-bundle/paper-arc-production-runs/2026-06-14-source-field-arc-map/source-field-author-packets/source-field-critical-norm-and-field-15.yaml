      \subsection{Weighted Mixed-Jet Closure Implies Classical Continuation}

      If one really closes a weighted mixed-jet norm on an interval, then one has already produced a classical continuation norm on that interval.

      \[
      \mathfrak A_s(\tau,r,t)
      :=
      \sum_{m\ge0}\sum_{\alpha\in\mathbb N^3}
      \frac{\tau^m r^{|\alpha|}}{m!\,\alpha!}\,
      \|J_{m,\alpha}(t)\|_{H^s},
      \qquad
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u.
      \]

      \[
      \sup_{t\in[0,T)}\mathfrak A_s(\tau_0,r_0,t)<\infty.
      \]

      \[
      \|u(t)\|_{H^s}
      =
      \|J_{0,0}(t)\|_{H^s}
      \le
      \mathfrak A_s(\tau_0,r_0,t).
      \]

      \[
      \sup_{t\in[0,T)}\|u(t)\|_{H^s}<\infty.
      \]

      The route does not need a second classical continuation mechanism after the tower is closed. The tower closure itself already includes the base classical Sobolev norm.


