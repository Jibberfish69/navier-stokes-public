    \(\Pack_Q\) is retained, so the terminal object has a positive same-fluid packet and bounded transported chart geometry. \(\Part_{N,Q}\) is retained, so the same Navier-Stokes pressure-viscosity tower participates through depth \(N\). The depth \(N\) is chosen at least as large as the finite depth needed to control the components in \(\mathrm{SCF}_{\mathrm{base}}\): velocity fluctuation, local gradient energy, pressure normalization, and the same-fluid frame terms.

    This depth requirement is already the intended CM witness depth in the paper: \(\Field_{N,r,Q}\) is a finite-depth one-field witness, and the local CKN-compatible \(\mathrm{SCF}_{\mathrm{base}}\) packet uses only finitely many local velocity, pressure, and frame quantities. Depth makes the components readable; it does not by itself prove the uniform small-scale \(\mathrm{SCF}_{\mathrm{base}}\) modulus.

    By the manuscript definition, \(\Field_{N,r,Q}\) means that, after \(\Pack_Q\) and \(\Part_{N,Q}\) have fixed the packet and participation readings, one positive scale carries coherent field data through depth \(N\) on the same witness record.

    In ordinary terms, the selected terminal packet still reads as one Navier-Stokes field on a positive same-fluid scale. Neighboring velocity-tower and pressure-viscosity readings fit together instead of degenerating into incompatible terminal traces.

    The old proof step being spent here was stronger than finite-depth field coherence. It treated controlled scale-critical components as though they automatically gave a uniform small-cylinder \(\mathrm{SCF}_{\mathrm{base}}\) gain. The exact replacement is a same-tail local modulus for the \(\mathrm{SCF}_{\mathrm{base}}\) packet:
    \[
      \omega_{\mathrm{SCF}}(\rho):=\sup_{z\in T'}\mathrm{SCF}_{\mathrm{base}}(Q_\rho^\Phi(z)),
      \qquad
      \lim_{\rho\downarrow0}\omega_{\mathrm{SCF}}(\rho)=0.
    \]

    The bound is on the same terminal witness record, not on a separate readout cover. If the modulus holds, choose \(r_*\le r\) with \(\omega_{\mathrm{SCF}}(r_*)\le\varepsilon_m\). Then every point of \(T'\) has an \(\mathrm{SCF}_{\mathrm{base}}\)-good same-fluid cylinder with radius \(r_*\). Without this same-tail modulus, \(\Field_{N,r,Q}\) does not by itself imply \(\mathrm{Field}_{\mathrm{avg}}(T)\).

    For this CM face landing, the Field admission bridge replaces the stronger high-frequency survivor-measure lower-bound demand only after the same-tail \(\mathrm{SCF}_{\mathrm{base}}\) modulus is supplied. That stronger route may remain useful as a source-control or no-escape proof, but it is not required to consume \(\mathrm{Jump}_{\mathrm{avg}}\) once the same admitted averaged tail has the conditional \(\Field_{N,r,Q}+\mathrm{SCFBaseLocalModulus}_{N}\Rightarrow\mathrm{Field}_{\mathrm{avg}}\) admission bridge.

    The remaining caveat is therefore sharper than depth alone: the CM witness depth must be high enough to read the local \(\mathrm{SCF}_{\mathrm{base}}\) components, and the branch must supply the same-tail small-scale modulus above. Until that modulus is proved from \(\Field_{N,r,Q}\) or added to the Field face, the admission theorem is conditional on it.



    \subsection{Averaged Jump Field-Face Reduction}

    The averaged jump branch enters the CM exit test only as a face statement. The proof of \(\Exit(Q):=\neg\Member(Q)\) locates the first failed witness face among \(\Pack_Q\), \(\Part_{N,Q}\), and \(\Field_{N,r,Q}\). The averaged object enters this test only after it has been admitted to the same CM witness family and the Pack and Part faces have been retained.

    Let \(T\) be a terminal averaged tail in the averaged route, with fixed finite route parameter set and same-fluid atlas data.

    \(T\) is admitted to the Clay/CM witness test for the same \(Q\)-atlas. \(\Pack_Q\) and \(\Part_{N,Q}\) are retained on that admitted object. \(\mathrm{Jump}_{\mathrm{avg}}(T)\) holds in the branch-native averaged sense: every terminal subtail has \(\inf r_{\mathrm{good}}=0\).

    This is a face-complement argument inside the admitted averaged endpoint row.

    The averaged notes define \(\mathrm{Field}_{\mathrm{avg}}(T)\) as the terminal positive-scale same-fluid SCF-good cover condition, and define \(\mathrm{Jump}_{\mathrm{avg}}(T)\) as its complement: no terminal subtail carries a positive lower bound for \(r_{\mathrm{good}}\). \(\mathrm{Jump}_{\mathrm{avg}}(T)\) already says the averaged terminal object has no surviving positive same-fluid coherence scale in the averaged endpoint row.

    For the admitted averaged terminal object, \(\mathrm{Jump}_{\mathrm{avg}}(T)\) gives \(\forall r>0,\ \neg\Field_{N,r,Q}\). With \(\Pack_Q\) and \(\Part_{N,Q}\) retained, this is the first available CM face failure and supports \(\Exit(Q):=\neg\Member(Q)\).

    The one-way implication is enough. A full equivalence between \(\mathrm{Field}_{\mathrm{avg}}(T)\) and the averaged instance of \(\Field_{N,r,Q}\) would be stronger than needed.

    The high-frequency survivor-measure forcing route also remains unproved: the existing failed attempts do not show that persistent \(\mathrm{Jump}_{\mathrm{avg}}\) forces nonzero terminal survivor measure or separated positive scale-window mass. The argument here uses the CM face statement instead of that stronger claim.

    In the older averaged-route frame, the averaged blocker was narrower than proving a branch-native high-frequency defect charge for CM exit purposes.

    For the admitted averaged terminal object, the identity \(\mathrm{Jump}_{\mathrm{avg}}:=\neg\mathrm{Field}_{\mathrm{avg}}\) consumes the branch as \(\forall r>0,\ \neg\Field_{N,r,Q}\) and lands in the Field face.

    The stronger positive no-escape route asks \(\mathrm{Jump}_{\mathrm{avg}}\) to force a nonzero survivor measure with separated positive scale mass. The CM face route asks only for the admitted averaged jump to be read as failure of the \(\Field_{N,r,Q}\) face through \(\mathrm{Field}_{\mathrm{avg}}\).

    The proof must be internal to the averaged route and must not use downstream readout. A valid proof may unfold the definitions of \(\Field_{N,r,Q}\), \(r_{\mathrm{good}}\), the same-fluid SCF-good cover, and terminal subtail selection, then show that any positive CM field scale supplies a positive terminal lower bound for \(r_{\mathrm{good}}\) after passing to a terminal averaged subtail.


