      \subsection{Averaged Field-Face Admission}

      This records the averaged Jump avg admission bridge with the declared CM depth requirement and the separate same-tail \(\mathrm{SCF}_{\mathrm{base}}\) modulus requirement made explicit.

      \(\Pack_Q\) is retained, so the terminal object has a positive same-fluid packet and bounded transported chart geometry. \(\Part_{N,Q}\) is retained, so the same Navier-Stokes pressure-viscosity tower participates through depth \(N\). The depth \(N\) is chosen at least as large as the finite depth needed to control the components in \(\mathrm{SCF}_{\mathrm{base}}\): velocity fluctuation, local gradient energy, pressure normalization, and the same-fluid frame terms.

      This depth requirement is already the intended CM witness depth in the paper: \(\Field_{N,r,Q}\) is a finite-depth one-field witness, and the local CKN-compatible \(\mathrm{SCF}_{\mathrm{base}}\) packet uses only finitely many local velocity, pressure, and frame quantities. Depth makes the components readable; it does not by itself prove the uniform small-scale \(\mathrm{SCF}_{\mathrm{base}}\) modulus.

      By the manuscript definition, \(\Field_{N,r,Q}\) means that, after \(\Pack_Q\) and \(\Part_{N,Q}\) have fixed the packet and participation readings, one positive scale carries coherent field data through depth \(N\) on the same witness record.

      In ordinary terms, the selected terminal packet still reads as one Navier-Stokes field on a positive same-fluid scale. Neighboring velocity-tower and pressure-viscosity readings fit together instead of degenerating into incompatible terminal traces.

      The old proof step being spent here was stronger than finite-depth field coherence. It treated controlled scale-critical components as though they automatically gave a uniform small-cylinder \(\mathrm{SCF}_{\mathrm{base}}\) gain. The exact replacement is a same-tail local modulus for the \(\mathrm{SCF}_{\mathrm{base}}\) packet:
      \[
        \omega_{\mathrm{SCF}}(\rho):=\sup_{z\in T'}\mathrm{SCF}_{\mathrm{base}}(Q_\rho^\Phi(z)),
        \qquad
        \lim_{\rho\downarrow0}\omega_{\mathrm{SCF}}(\rho)=0.
      \]

      The bound is on the same terminal witness record, not on a separate readout
