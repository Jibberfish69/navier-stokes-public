      \subsection{Averaged Jump Field-Face Reduction}

      The averaged jump branch enters the CM exit test only as a face statement. The proof of \(\Exit(Q):=\neg\Member(Q)\) locates the first failed witness face among \(\Pack_Q\), \(\Part_{N,Q}\), and \(\Field_{N,r,Q}\). The averaged object enters this test only after it has been admitted to the same CM witness family and the Pack and Part faces have been retained.

      Let \(T\) be a terminal averaged tail in the averaged route, with fixed finite route parameter set and same-fluid atlas data.

      \(T\) is admitted to the Clay/CM witness test for the same \(Q\)-atlas. \(\Pack_Q\) and \(\Part_{N,Q}\) are retained on that admitted object. \(\mathrm{Jump}_{\mathrm{avg}}(T)\) holds in the branch-native averaged sense: every terminal subtail has \(\inf r_{\mathrm{good}}=0\).

      This is a face-complement argument inside the admitted averaged endpoint row.

      The averaged notes define \(\mathrm{Field}_{\mathrm{avg}}(T)\) as the terminal positive-scale same-fluid SCF-good cover condition, and define \(\mathrm{Jump}_{\mathrm{avg}}(T)\) as its complement: no terminal subtail carries a positive lower bound for \(r_{\mathrm{good}}\). \(\mathrm{Jump}_{\mathrm{avg}}(T)\) already says the averaged terminal object has no surviving positive same-fluid coherence scale in the averaged endpoint row.

      For the admitted averaged terminal object, \(\mathrm{Jump}_{\mathrm{avg}}(T)\) gives \(\forall r>0,\ \neg\Field_{N,r,Q}\). With \(\Pack_Q\) and \(\Part_{N,Q}\) retained, this is the first available CM face failure and supports \(\Exit(Q):=\neg\Member(Q)\).

