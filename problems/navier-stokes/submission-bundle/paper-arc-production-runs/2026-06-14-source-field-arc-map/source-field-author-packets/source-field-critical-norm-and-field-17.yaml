    text: |+
      \subsection{Clay problem Clay Field-Face Exclusion Working Pass}

      This historical working pass records the pre-final Field-face problem before the current finite-obstruction inventory and final theorem sequence. Its current role is to explain how an all-scales Field failure is typed when Pack and Part have been retained.

      The attempted smaller lemma for the retained-terminal-Part route was Clay Field Failure Realization.A, stated below.

      Let W * be a finite Clay breakdown from smooth original data, and let Q be the canonical same-solution terminal obstruction extracted from W *. At the

      \[
      \forall r>0\,\neg Field_{N_s,r,Q}
      \]

      The distinction between Part lic and Part term is load-bearing. The installed Field-to-Part collapse permits Part lic as a proof-order license; the desired contradiction needs terminal Part as an endpoint truth.

      \[
      \neg Pack_Q
      \vee
      \neg Part_{N_s,Q}
      \vee
      \forall r>0\,\neg Field_{N_s,r,Q}.
      \]

      \[
      Pack_Q\wedge Part_{N_s,Q}\wedge Field_{N_s,r,Q}
      \Longrightarrow
      \sup_{t<T_*}\|u(t)\|_{H^s}<\infty,
      \qquad s>5/2.
      \]

      At the time, the note treated the bridge as conditional on that face-exclusion theorem.

      The old edge recorded the direction correction: arbitrary failure of a CM row is not by itself the theorem-grade converse to membership. In the current Clay terminal chain, a face failure supports Exit(Q):=not Member(Q) only after terminal entry and finite-failure exhaustion.

      Retained Field ToPart Collapse.A is installed only for a realized terminal same-fluid Jump, not for absent support or quarantined readout.

      Assume Pack Q, Part N s,Q , and Field N s,r,Q for some positive r. The global material atlas / terminal completeness readout gives a bounded H s, s>5/2, norm up to T *. The \(H^s\) continuation criterion restarts the same classical solution from times approaching T * and extends it past T *.

      The missing step is the production of that positive lower cover on the same terminal tail. Pack supplies the retained carrier and readout-compatible material atlas. Part supplies the pressure-viscosity tower participation. Neither installed predicate supplies a uniform positive one-field coherence scale.

      Pure terminal scale collapse is not a Field proof. If the object has no positive carrier scale, or only a zero-radius terminal residue remains, the live edge and carrier-admissibility notes place that failure first in not Pack Q.

      With Pack Q retained, the zero-radius Pack subcase is removed. The remaining Field failure is not radius-zero carrier loss; it is failure of positive-scale one-field coherence on an already retained carrier and participation tower. The zero-radius test eliminates only a Pack-facing subcase.

      On every strict preterminal classical interval there are local positive scales where the field is smooth. A dyadic terminal selection can then produce surviving packets at scales r j>0.


