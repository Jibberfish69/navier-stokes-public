    text: |+
      \subsection{Clay problem Clay Breakdown Canonical Terminal Obstruction}

      The canonical obstruction step records the same fact from the terminal-capture side:
      \[
        \mathrm{ClayAdmissibleFiniteBreakdown}(W_*)
        \Longrightarrow
        \mathrm{SameSolutionTerminalObstruction}(W_*).
      \]
      The point is to keep the alleged Clay breakdown on the same solution surface.  By the Clay breakdown assumption, \(W_*\) comes from the maximal classical Navier-Stokes solution generated by the original smooth divergence-free datum.  On every preterminal interval \([0,T_*-\varepsilon]\), it is the original incompressible Navier-Stokes solution with the same velocity and pressure.

      A regularized equation, Euler comparison object, external approximation, or surrogate flow is outside this finite same-surface branch.  The terminal object is extracted from the preterminal same-fluid family.  If that same-fluid carrier is lost at the endpoint, the first face is
      \[
        \neg \mathrm{Pack}_Q.
      \]
      If the carrier remains, the later faces test participation and positive-scale field coherence.

      After legal boundary, cutoff, collar, non-selected, readout-only, and paid finite-record terms are removed, the remaining object is exactly the obstruction still claiming to be the finite terminal breakdown.  That is the input object of the canonical terminal packet capture theorem.  The theorem's positive content is canonical entry into the CM contrapositive grammar: the alleged finite Clay breakdown must appear as a same-solution terminal obstruction, and its terminal face failure is the contrapositive witness.


