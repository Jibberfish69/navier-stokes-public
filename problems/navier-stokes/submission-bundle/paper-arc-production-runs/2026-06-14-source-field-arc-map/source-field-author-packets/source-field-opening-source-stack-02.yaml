    text: |+
      \subsection{Clay problem Canonical Terminal Packet Capture}

      The route from a hypothetical first Navier--Stokes blow-up to the CM decision tree is not a new positive estimate. It is a terminal packet construction.

      \[
      Pack_Q,\qquad Part_{N,Q},\qquad Field_{N,r,Q}.
      \]

      So the capture theorem closes the "no fourth residue" question. It does not by itself prove that the three exits are impossible.

      Let (u,p) be a maximal smooth incompressible Navier--Stokes solution on [0,T *), with T * 5/2, readout.

      \[
      \boxed{
      \mathcal R_*
      \Longrightarrow
      \neg Pack_Q
      \vee
      \neg Part_{N_s,Q}
      \vee
      \forall r>0\,\neg Field_{N_s,r,Q}.
      }
      \]

      \[
      \boxed{
      \mathcal R_*
      \Longrightarrow
      \begin{cases}
      \neg Pack_Q,\\
      Pack_Q\wedge\neg Part_{N_s,Q},\\
      Pack_Q\wedge Part_{N_s,Q}\wedge\forall r>0\,\neg Field_{N_s,r,Q}.
      \end{cases}
      }
      \]

      \[
      \neg CM_{N_s,r,Q}
      \]

      \[
      CM_{N,r,Q}
      =
      Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      So before the terminal time, the canonical object is already the same same-fluid Pack/Part/Field packet. The only question is what survives as t T *.

      Pass to a terminal subsequence of preterminal packets carrying the selected obstruction R *.

      The first negative answer is the landing face. There is no fourth primitive CM face.

      This is exactly the capture statement needed by Any Finite Failure WitnessCMExit.A.

      The section formerly named the remaining CM work as TerminalCMNo Exit.A. That is now superseded for the CM contrapositive program.


