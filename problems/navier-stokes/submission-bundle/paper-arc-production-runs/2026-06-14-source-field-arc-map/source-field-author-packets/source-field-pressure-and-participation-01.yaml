      \subsection{Lemma 4B No-Loss Pressure Recovery Attack}

      This is the pressure side of the same bridge. The route is not to guess a
      pressure. It is to derive the differentiated pressure constraint and show that
      the top-order pressure pairing can be charged to the same Lagrangian energy
      record.

      \[
      \begin{aligned}
      \partial_t v + A^\top \nabla_a q
      &=
      \nu\,\operatorname{div}_a(G\nabla_a v),
      &G&:=AA^\top,\\
      U_\alpha&:=\partial_a^\alpha v,
      &Q_\alpha&:=\partial_a^\alpha q.
      \end{aligned}
      \]

      \[
      \begin{aligned}
      \partial_t U_\alpha
      +
      A^\top\nabla_a Q_\alpha
      &=
      \nu\,\operatorname{div}_a(G\nabla_a U_\alpha)
      +
      \mathcal C_\alpha^v,\\
      \operatorname{div}_a(AU_\alpha)&=\mathcal P_\alpha .
      \end{aligned}
      \]

      \[
      \mathcal C_\alpha^v
      =
      -\sum_{0<\beta\le \alpha}\binom{\alpha}{\beta}
      (\partial_a^\beta A^\top)\nabla_a Q_{\alpha-\beta}
      +
      \nu\sum_{0<\beta\le \alpha}\binom{\alpha}{\beta}
      \operatorname{div}_a\!\Big((\partial_a^\beta G)\nabla_a U_{\alpha-\beta}\Big).
      \]

      \(\mathcal P_\alpha\) is not an arbitrary source. It is generated by
      differentiating the constraint:

      \[
      \mathcal P_\alpha
      =
      -\sum_{0<\beta\le\alpha}\binom{\alpha}{\beta}
      \operatorname{div}_a\bigl((\partial_a^\beta A)U_{\alpha-\beta}\bigr).
      \]

      Every term in \(\mathcal P_\alpha\) contains at least one derivative of \(A\);
      there is no free top-order divergence of \(U_\alpha\). That is why this route
      can still be same-depth, provided the recursion is proved without using the
      desired pressure estimate as an input.

      The proposed no-loss test field is the variable-coefficient solution
      \(Z_\alpha\) of

      \[
      \operatorname{div}_a(AZ_\alpha)=\mathcal P_\alpha .
      \]

      The estimate still owed is

      \[
      \|Z_\alpha\|_{H^1_G}
      \le C_{\mathrm{sf},10692}
      \|\mathcal P_\alpha\|_{H^{-1}_{A,G}},
      \]

      with constants controlled by the same \(A,G\) record. The dangerous viscous
      term is then integrated by parts against \(Z_\alpha\) instead of being treated
      as an independent forcing term.

