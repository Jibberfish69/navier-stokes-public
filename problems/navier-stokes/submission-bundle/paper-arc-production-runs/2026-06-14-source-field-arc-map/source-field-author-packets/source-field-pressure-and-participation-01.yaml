    Cauchy, pressure, cutoff, and projection estimates control size or legal
    losses. They do not provide a sign-depletion mechanism for the localized
    positive part. Absolute-value estimates return to the same positive carrier.

    The source-ancestry version supplies only First Pulse.No Parent. That is weaker
    than global no-incoming control for the frozen-strain ancient tangent.

    Active Strain Alignment Cost.A cannot currently discharge Lifted Skew
    Commutator.A. Weighted Lifted Skew Defect Legal.A remains blocked at the active
    strain-alignment carrier.



    \subsection{Adjoint strain-gauge parent-kernel conditional discharge packet}

    This packet is a conditional discharge of the parent-kernel gain route.  It
    does not prove the source-pulse wall by itself.  It proves the chain after four
    inputs have been supplied: an admissible tile atlas, a strain-gauged packet
    parametrix, a residual decomposition, and first-pulse selection.  Those inputs
    are live proof obligations for an unconditional source-pulse discharge.

    \[
    L_{j,k}=\partial_t+b_k\cdot\nabla-\nu\Delta-A_k,
    \qquad b_k=u_{\le k},
    \]

    \[
    L_{j,k}w_j=R_{j,k}.
    \]

    \[
    L_{j,k}^*\psi_T=0
    \]

    The adjoint test function \(\psi_T\) is weighted by the accumulated positive
    strain along the selected tile:

    \[
    \Gamma_T=\int_{I_T}\lambda_{\max}^+(A_k(X_T(t),t))\,dt,
    \qquad g_T=e^{\Gamma_T},
    \qquad \chi_T=g_T^{-1}\psi_T.
    \]

    Pairing the packet equation with the adjoint gives the exact bookkeeping
    identity

    \[
    \langle w_j(t_+),\psi_T(t_+)\rangle
    =
    \langle w_j(t_-),\psi_T(t_-)\rangle
    +\int_{I_T}\langle R_{j,k},\psi_T\rangle\,dt.
    \]

    This identity is the point of the packet.  A high-gain stopped edge cannot be
    only a terminal event once the adjoint packet is admissible: the terminal
    coefficient is accounted for by an earlier coefficient or by the residual
    charge.  The heat cylinder centered at \(X_T(t_+)\) at scale \(2^{-j_T}\) is the
    earlier active ancestor attached to that edge.

    Under the active-threshold selection and ancestor-cylinder measurability
    hypotheses, this gives Gain Stop.A conditionally.

    After Gain Stop.A, high-gain branches are converted into residual charges or
    earlier source-pulse ancestors.  First-pulse selection removes the earlier
    source-pulse ancestor alternative in the ancient limit.  The remaining branches
    are quiet and contractive inside the same conditional packet.

    This is First Pulse Kill.A under first-pulse selection and finite local
    source-mass compactness.

    The five requested gates are conditionally linked.  The unconditional proof is
    reduced to the four obligations named at the start of this subsection.



    \subsection{Affine/Pressure Normalization Compatibility Lemma}

    On a bounded-distortion same-fluid moving cylinder, write the moving-frame
    variables in normalized coordinates.  The pressure used in the SCF base is

    \[
    p^{norm}=p-c(t)-p^{frame}_{aff}(x,t),
    \]

    where \(c(t)\) is the usual CKN pressure gauge and \(p^{frame}_{aff}\) is the
    affine potential generated by the chosen translating or accelerating frame.
    This is the pressure term appearing in the transformed local energy inequality.

    \[
    K_q=-\nabla^{q+1}p+\nu\Delta U_q.
    \]

    The time-dependent constant \(c(t)\) is the standard pressure gauge.  It leaves
    the Navier-Stokes equations unchanged and is allowed in the CKN pressure
    smallness term.

    The moving same-fluid frame introduces inertial affine terms in the transformed
    equation.  These terms are represented by the affine pressure potential
    \(p^{frame}_{aff}\), whose gradient is the frame acceleration contribution.
    After this transformation, the normalized velocity and pressure solve the
    same-fluid equation in the normalized frame with bounded lower-order
    coefficients controlled by the chart distortion constants.

    \[
    r^{-2}\iint_{Q_r^\Phi}|p-p^{norm}_{r}|^{3/2}.
    \]

    This quantity is invariant under the allowed pressure gauge and comparable to
    the standard CKN pressure smallness quantity in the normalized cylinder.

    For endpoint readout, return to the original pressure \(p\).  On each fixed
    readout cover element, use

    \[
    p=p_i^{loc}+h_i,
    \qquad
    -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
    \]

    This lemma uses gauge and frame normalization only.  It excludes amplitude
    rescaling of selected coherent modes at readout.  The obstruction recorded
    elsewhere remains: exact readout preservation and fixed-shell amplitude damping
    are incompatible without an independent amplitude bound.

    All pointwise pressure derivatives are routed through the later fixed-cover
    Poisson readout.



    \subsection{B ASAC Terminal-Source Reverse Holder And Pressure/Eigenframe Boundary}

    The reverse-Holder route would close the terminal atom by proving

    \[
    \left\|
    \|F_m^{src,+}(s,\cdot)\|_{\mathcal M(B_R)}
    \right\|_{L_s^p((-1,0))}
    \le C_R,
    \qquad p>1,
    \]

    which would again give

    \[
    \mu_m^{src}(B_R\times[-\varepsilon,0])
    \le C_R\varepsilon^{1-1/p}+o_m(1),
    \qquad
    \mu_*^{src}(B_R\times\{0\})=0.
    \]

    The named theorem surface is
    \(\operatorname{UniformTemporalSourceIntegrability}_{p}\mathrm{.A}\).

    The pressure/eigenframe route does not supply it.  Those inputs support
    near-band signed-current control and pressure-Hessian/eigenframe persistence.
    The positive source-weighted carrier is

    \[
    |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
    \]

    After the positive part is selected, signed-current support and near-band
    pressure/eigenframe structure no longer control the full positive carrier.  The
    B ASAC reverse-Holder route remains open.



    \subsection{B ASAC Pressure Elliptic Continuation}

    The pressure/elliptic route sharpens the next possible pressure theorem, while
    the B ASAC terminal atom remains the target-local obstruction. The desired
    pressure support relation is

    \[
    \mu_*^{press-sus}\ll \mu_*^{src}+\mu_*^{legal,src}.
    \]

    \[
    -\Delta p=\partial_i\partial_j(u_i u_j),
    \qquad
    \nabla^2p=\mathcal R\mathcal R(\nabla u\otimes\nabla u).
    \]

    This supplies spatial partner structure and Calderon-Zygmund bounds. It does
    not dominate the pressure quadratic-gradient carrier by the native same-fluid
    source-current carrier after localization, one-sided terminal weights, and
    positive selection.

    The installed Leray identity is algebraic before selection. The one-sided
    terminal packet record needs additional gates. Importing the existing terminal
    skew/source-current record would make the fork circular.

    Pressure recovery is elliptic and time-slice based. It can spread a pressure
    lobe across space at a fixed time. The B ASAC obstruction is concentration in
    time, so elliptic recovery alone supplies no terminal time-face anti-atom
    estimate.

    \[
    \mu_*^{press\perp src}\perp(\mu_*^{src}+\mu_*^{legal,src}).
    \]

    Existing pressure legal records cover cutoff, projector, harmonic collar,
    off-family tail, geometric collar, and boundary pressure work. The retained
    pure pressure-sustain residue is interior after those exits are removed. The
    pressure route remains open unless it supplies residue-level absolute
    continuity plus terminal time-face spread.



    \subsection{B ASAC Pressure Tether Diagnostic}

    The pressure/Leray tether remains a plausible production mechanism. The desired
    content is residue-level absolute continuity of the pressure quadratic-gradient
    residue with respect to the native source-current residue, together with a
    spread estimate that excludes pure terminal time-face concentration.

    \[
    -\Delta p=\partial_i\partial_j(u_i u_j),
    \qquad
    \nabla^2p=\mathcal R\mathcal R(\nabla u\otimes\nabla u).
    \]

    After localization, near-band projection, one-sided terminal selection, and
    positive-part extraction, the installed pressure/eigenframe material gives
    conditional signed-current support. It does not give residue-level absolute
    continuity plus terminal spread.

    The survivor is a retained same-fluid terminal native source residue after ASAC
    defect, legal exits, finite donor trees, temporal anti-concentration, active
    reserve, transported no-incoming, pressure/Leray tether, and rigid-subclass
    production have been audited.

    This survivor is a selected terminal Zeno source atom. In the current
    source-wall bookkeeping it is Pack-facing zero-radius residue support. It is not
    a retained source-wall Field defect without an added positive-scale
    retained-carrier bridge.

    \[
    CM_{N,r,Q}=Pack_Q+Part_{N,Q}+Field_{N,r,Q}.
    \]

    The pressure/source tether route stays conditional at Pressure Time Face
    Spread.A. Forward source-wall theorem closure still requires a new production
    theorem, and this diagnostic records the survivor without upgrading it into a
    positive-scale Field readout.


