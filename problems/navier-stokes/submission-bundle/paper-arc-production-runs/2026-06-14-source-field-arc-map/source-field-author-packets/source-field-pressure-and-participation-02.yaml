    text: |+
      \subsection{Full PFlux Supplier Closure From Near And Far Pressure Summability}

      \[
      \|p-c_k\|_{L^2(A_k)}
      \le C\|u\otimes u\|_{L^2(A_k^*)}+F_k.
      \]

      \[
      \sum_k2^{(2a-1)k}\int\|p-c_k\|_{L^2(A_k)}\|u\|_{L^2(A_k)}
      \]

      \[
      \le
      C\sum_k2^{(2a-1)k}\int\|u\otimes u\|_{L^2(A_k^*)}\|u\|_{L^2(A_k)}
      +
      C\sum_k2^{(2a-1)k}\int F_k\|u\|_{L^2(A_k)}.
      \]

      The first term is finite by near summability. The second is finite by far summability. The annular mean c k(t) contributes no gradient pressure flux after the pressure is represented by the normalized Riesz pressure, or is absorbed into the harmless time normalization on each annulus.

      This theorem closes the pressure-flux supplier conditionally on AnnL4.W and weighted moment control. The sharp remaining source estimate is the weighted annular L4 smoothing theorem.


