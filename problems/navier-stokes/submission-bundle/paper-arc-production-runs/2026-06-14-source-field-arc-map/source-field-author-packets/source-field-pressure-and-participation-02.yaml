      \subsection{Dtc Read Completion With Pressure Poisson Component Dtc A}

      \[
      \sup |U_q|<\infty
      \qquad (q\le N).
      \]

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q.
      \]

      The viscous component is controlled by the U q+2 readout, so the local depth includes the required q+2 slots.

      For the pressure component, use the fixed-cover pressure split. On one nested cover element (B i',B i,2B i), choose chi i=1 on B i and supported in 2B i, and write

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      \[
      \|\nabla^{q+1}p_i^{loc}\|_{L^\infty(B_i')}
      \le
      C_{q,\alpha,i}
      \|\nabla^q(\chi_i u\otimes u)\|_{C^{0,\alpha}(2B_i)}.
      \]

      ATD m epsilon supplies the fixed-cover product-source carrier by local derivative bounds and Leibniz. The harmonic tail obeys

      \[
      \|\nabla^{q+1}h_i\|_{L^\infty(B_i')}
      \le
      C_{q,i}\|u_0\|_{L^2(T^3)}^2.
      \]


