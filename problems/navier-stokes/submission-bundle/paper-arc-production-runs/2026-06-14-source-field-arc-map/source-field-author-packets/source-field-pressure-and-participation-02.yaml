      \subsection{Direct Strain Side Route Via Vorticity Alignment Depletion}

      \[
      \Gamma_{pack,Q}\in L^\infty(0,T_*).
      \]

      Let e(a,t) be a unit stretching direction for the largest singular value of the deformation gradient. The sharp packet coefficient is

      \[
      S_{align,Q}(t)=\sup_{a\in A_Q(t)}(e(a,t)\cdot S(u)(X(a,t),t)e(a,t))_+.
      \]

      \[
      S_{align,Q}(t)
      \le C\,\mathcal A_Q(t)\,\Omega_Q(t)+R_Q(t),
      \]

      where mathcal A Q measures vorticity-direction coherence or alignment on the packet, Omega Q is a packet vorticity amplitude, and R Q is an integrable far/local remainder.

      The direct strain route is reduced to an alignment-depletion estimate for the positive directional strain. This side route bypasses the averaged terminal-tail machinery and would give an independent pack-gauge proof if completed.


