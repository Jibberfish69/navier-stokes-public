    text: |+
      \subsection{Exact SCF Pressure Normalization Lemma}

      \[
      p^{norm}=p-c(t)-p^{frame}_{aff}(x,t),
      \]

      where c(t) is a spatially constant pressure gauge and p frame aff is the affine potential whose gradient equals the inertial affine force produced by the moving frame.

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q
      \]

      The spatially constant term c(t) has zero spatial gradient. It changes neither the Navier-Stokes equation nor any pressure derivative used by K q.

      The moving frame contributes an inertial affine force. Its potential p frame aff is chosen so that

      \[
      \nabla p^{frame}_{aff}=F^{frame}_{aff}.
      \]

      After subtracting this potential, the transformed local energy inequality has the CKN pressure fluctuation p norm . Thus the pressure component of SCF base is

      \[
      r^{-2}\iint_{Q_r^\Phi}|p^{norm}-(p^{norm})_{Q_r}|^{3/2},
      \]

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      The local Poisson estimate controls derivatives of p i loc , and the harmonic tail is controlled by the energy bound. The gauge term c(t) contributes zero spatial derivatives. The affine frame potential contributes only known finite-depth frame terms, already carried in the moving-frame record.

      The route uses gauge/frame normalization. It carries no amplitude-rescaling readout normalization.


