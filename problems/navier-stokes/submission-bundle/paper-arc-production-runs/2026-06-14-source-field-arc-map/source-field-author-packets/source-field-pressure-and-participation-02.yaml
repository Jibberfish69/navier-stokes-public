      \subsection{Dtc Read Kq Pressure Poisson Cover Depth}

      \[
      B_i'\Subset B_i\Subset 2B_i
      \]

      \[
      \chi_i\equiv 1\text{ on }B_i,
      \qquad
      \operatorname{supp}\chi_i\subset 2B_i.
      \]

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      \[
      \mathcal P_{q,\alpha,i}(t)
      :=\|\nabla^q(\chi_i u\otimes u)(t)\|_{C^{0,\alpha}(2B_i)}.
      \]

      \[
      \nabla^{q+1}p_i^{loc}=T_q(\nabla^q(\chi_i u\otimes u)),
      \]

      The pressure term is supplied by the preceding estimate. The viscous term is a contraction of U q+2 and is supplied by the same fixed-cover tower readout when the depth reaches at least N+2.

      and the right side is controlled by ATD m plus energy on the finite readout cover.


