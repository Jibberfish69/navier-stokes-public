    text: |+
      \subsection{Pressure Readout on a Nested Cover}

      On one nested cover element \(B_i'\Subset B_i\subset 2B_i\), choose
      \(\chi_i=1\) on \(B_i\), with \(\chi_i\) supported in \(2B_i\). Split

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      \[
      \|\nabla^{q+1}p_i^{loc}\|_{L^\infty(B_i')}
      \le C_{q,\alpha,i}\|\nabla^q(\chi_i u\otimes u)\|_{C^{0,\alpha}(2B_i)}.
      \]

      The product term is controlled by the \(\mathrm{ATD}_m(\varepsilon)\) hypothesis and the Leibniz rule. The harmonic part obeys

      \[
      \|\nabla^{q+1}h_i\|_{L^\infty(B_i')}
      \le C_{q,i}\|u(t)\|_{L^2}^2.
      \]

      Thus the pressure derivative needed in the forcing rung is controlled on the cover.

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q.
      \]

      For the field predicate, Field avg plus ATD m epsilon gives local Morrey/Sobolev readout on each cover element. The finite cover and lower radius give uniform constants, so the pointwise field predicate Field holds.


