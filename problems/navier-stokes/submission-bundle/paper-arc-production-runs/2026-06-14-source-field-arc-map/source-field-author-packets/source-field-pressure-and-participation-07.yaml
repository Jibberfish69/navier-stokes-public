      \subsection{Euler Boundary Object For Viscous Participation Exit}

      Euler is used here as the control object at one exact boundary. The same selected terminal packet keeps incompressible flux-volume balance and weak momentum-pressure fidelity, while fixed positive viscosity asks for more: pressure-viscosity participation and one coherent positive-scale field.

      A vortex-sheet picture gives the reader the model. Normal flux can match across the interface while the tangential velocity jumps. That can still be an Euler base object, because the base Euler test is \(\mathrm{EVol}+\mathrm{EMom}\). It is not a fixed-viscosity Navier--Stokes member once the same pressure-viscosity participation law and one-field coherence fail.

      This is the only nonsmooth Euler comparison admitted into the proof path. It names the escaped object after the same Navier--Stokes packet has already been selected and its first failed Pack, Part, or Field face has been typed.


