    \subsection{Clay problem Field Failure To Part Collapse}

    The Pack + Part + not-Field row is a proof-facing way to spend the last unspent CM face after Pack and Part have been retained as licenses. Once the endpoint is read as a real same-fluid terminal scenario, the Jump that broke Field also breaks terminal Part.

    The collapse theorem is precisely that a realized Field/Jump endpoint can coexist with Part lic as an assumption used to reach the Field face, but it cannot coexist with Part term as an endpoint truth.

    Fix a retained terminal carrier Q and continuation depth N. Let J Q denote a selected receiver/coherence endpoint after legal losses, non-selected branches, paid terms, and pure readout artifacts have been removed.

    Read J Q as the same object that the May 15 receiver note calls receiver escape when Pack and Part have not failed earlier.

    Because Pack Q is retained, the endpoint is not carrier loss. The receiver or coherence packet is still on one usable same-fluid carrier.

    Because Part lic N,Q is retained, the endpoint is not classified as an external forcing or dropped-law event. The differentiated tower is being read as the same pressure-viscosity NS tower through depth N.

    Now suppose some positive scale r>0 satisfies Field N,r,Q . Then the retained packet has positive-scale one-field coherence and finite local tower readout at the same depth. That is exactly the missing receiver/coherence admission: the selected endpoint is carried by the same field at positive scale. This contradicts J Q.

    \[
    \forall r>0\,\neg Field_{N,r,Q}.
    \]

    Field failure here is not the mere absence of a convenient downstream readout. It is a realized Jump: neighboring retained pieces on the same carrier cannot be organized as one positive-scale same-law field.

    Assume for contradiction that Part term N,Q holds. Then those same neighboring pieces really participate in one shared pressure-viscosity tower through depth N on the retained carrier Q. Terminal Part is not just a law written at isolated points; it includes same-law participation on the overlaps where the neighboring pieces are compared.

