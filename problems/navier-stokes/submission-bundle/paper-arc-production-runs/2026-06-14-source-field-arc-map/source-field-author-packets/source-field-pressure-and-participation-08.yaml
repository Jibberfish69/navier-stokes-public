    This is only a comparison fact. It explains why the widened collar route is sufficient, but it does not make that wider route the sharp theorem-facing object.



    \subsection{Clay problem Local Strain Depletion.A Audit Note}

    This would prove Local Source.No Pulse.A by showing that the positive part of the same-fluid active local source vanishes on terminal bad windows.

    \[
    \mathfrak G_N^{lift,\sigma}
    =
    \sum W_{j,k,\ell}^{\sigma}\mathcal R_{j,k,\ell}^{lift},
    \]

    \[
    \mathcal R_{j,k,\ell}^{lift}
    \sfcomp{39614}
    2^{2j}
    \left\langle
    \mathcal C_j(\nabla a_k,\Delta_j u),\Delta_j u
    \right\rangle.
    \]

    The signed route asks for cancellation of the full signed sum. The local depletion target is harder in the relevant direction: it asks for smallness of the positive part on the same bad active windows that define the no-pulse branch.

    \[
    \int G\ \text{small}
    \quad\not\Longrightarrow\quad
    \int G_+\ \text{small}.
    \]

    The principal strain form is sign-indefinite. If an active shell packet is aligned with an expanding eigendirection of the symmetric low/intermediate strain, then

    \[
    \left\langle
    \mathcal C_j(\nabla a_k,\Delta_j u),\Delta_j u
    \right\rangle
    >0
    \]

    So the local positive part can concentrate exactly on Bad N( ). This is not ruled out by energy inequality, incompressibility, pressure projection, or the unweighted shell-exchange antisymmetry.

    The pressure Poisson law enforces incompressibility and redistributes the trace part of the nonlinearity. It does not make the local strain-production term nonpositive. The pressure-strain attempt already isolates the missing theorem: one would need a structural depletion law tied to the active packet, not merely the pressure equation.

    Local Strain Depletion.A is not solved by the existing signed weighted commutator material. It is a genuine positive-part depletion theorem.



    \subsection{Clay problem Low Response Strain Charge.A Proof Run}

    \[
    \int\langle ZS_{<j}^{loc}u_j,u_j\rangle,
    \]

    \[
    ZS_{<j}^{loc}
    =
    \frac12(\nabla z_{<j}^{loc}+(\nabla z_{<j}^{loc})^T),
    \qquad
    z=\partial_\nu u.
    \]

    \[
    \int_W\sup_{k>N}
    2^k\sum_{\ell>k+4}
    1_{\{R_\ell>0\}}
    \left[
    \int\langle ZS_{<\ell}^{loc}u_\ell,u_\ell\rangle
    \right]_+dt
    \le
    LegalResponseCharge_N(W)+o_N(1).
    \]

    \[
    \int_W\|\nabla z(t)\|_{L^\infty}\,dt
    \le
    M_z(W)<\infty.
    \]

    \[
    \boxed{
    \int_W\sup_{k>N}
    2^k\sum_{\ell>k+4}
    \left|
    \int\langle ZS_{<\ell}^{loc}u_\ell,u_\ell\rangle
    \right|dt
    \le
    M_z(W)
    \int_W\sum_{\ell>N}2^{-\ell}D_\ell(t)\,dt.
    }
    \]

    But those are exactly high-regularity NS bounds near the candidate boundary. Using them unconditionally would import what the no-fold theorem must prove.

    The useful reduction is that the low-response-strain term is not a new native source wall. It vanishes under any finite response low-norm control because the height weight hits E l, not D l, and gains the factor 2 -l .

    That should be merged with the signed response-height packet, not tracked as a separate source-wall primitive.



    \subsection{Clay problem Low StrainBVCharge.A Direct Attempt}

    \[
    \tau_P\sfcomp{39757}(\nu2^{2j_P})^{-1},
    \]

    \[
    \sigma_P(t)
    :=
    n_P(t)\cdot S^{loc}_{<j_P}(X_P(t),t)n_P(t),
    \]

    \[
    \boxed{
    \sum_{P\in F_N(W)}
    \omega_P E_P\tau_P\,\mathrm{Var}_{I_P}(\sigma_P)
    \le
    C\mathcal P_{N,Q}^{part}(W)
    +C\mathcal L_{N,Q}^{field}(W)
    +C\mathcal Z_{N,Q}^{atom}(W)
    +o_N(1).
    }
    \]

    The point of this target is to price the only loophole left by net Pack control: fast alternation of the sampled expanding low-strain direction.

    Along the same-fluid packet path, write D t=partial t+u . Ignoring cutoff commutators for one line,

    \[
    S^{loc}_{<j}
    =
    S^{far}_{j,L}+S^{near}_{j,L},
    \]

    \[
    S^{far}_{j,L}:=\sum_{m\le j-L}S_m^{loc},
    \qquad
    S^{near}_{j,L}:=\sum_{j-L<m<j}S_m^{loc}.
    \]

    The far-low term has a genuine parabolic scale-separation gain. The near band does not; it must be routed to parabolic burst/source structure.

    This is a real gain: very low modes cannot oscillate at the high-shell heat rate without paying an explicit material-derivative source term.

    This is not the false accumulated-positive Pack claim. It is an unsigned far-low variation tail with a small scale-separation coefficient.

    Case 1 is the existing parabolic-rate strain burst branch. By Inverse Parabolic Burst.A, it forces lower/neighbor donor height. On a first-height run this is inherited, legally charged, or sent to the Zeno residue branch.

    Cases 2 and 3 are the real pressure/source and frame-transport legalizers. They are not supplied by scalar shell balance.

    This is consistent with the signed-current surfaces: rotating a retained high packet into the expanding low-strain eigendirection cannot be free.

    If these fail, the countermodel is very specific: a retained high packet samples a near-neighbor low-strain band whose direction/value oscillates at the high heat rate, while Pack remains bounded, Part remains active, Field legal loss is absent, and no Zeno atom forms.


