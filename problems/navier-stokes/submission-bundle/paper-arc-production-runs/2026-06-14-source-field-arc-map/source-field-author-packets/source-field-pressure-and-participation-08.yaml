    for a fixed finite family of universal contraction operators C ,q ; for =0 this is the identity. So on every fixed ball B(c j(t),R , press ),

    So the fixed-ball pressure sufficient route already admits a still-local zero-derivative packet one rung higher.

    This is only a comparison fact. It explains why the widened collar route is sufficient, but it does not make that wider route the sharp theorem-facing object.



