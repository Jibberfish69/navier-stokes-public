      \]

      \[
      \sigma_P(t)
      :=
      n_P(t)\cdot S^{loc}_{<j_P}(X_P(t),t)n_P(t),
      \]

      \[
      \boxed{
      \sum_{P\in F_N(W)}
      \omega_P E_P\tau_P\,\mathrm{Var}_{I_P}(\sigma_P)
      \le
      C\mathcal P_{N,Q}^{part}(W)
      +C\mathcal L_{N,Q}^{field}(W)
      +C\mathcal Z_{N,Q}^{atom}(W)
      +o_N(1).
      }
      \]

      The point of this target is to price the only loophole left by net Pack control: fast alternation of the sampled expanding low-strain direction.

      Along the same-fluid packet path, write D t=partial t+u . Ignoring cutoff commutators for one line,

      \[
      S^{loc}_{<j}
      =
      S^{far}_{j,L}+S^{near}_{j,L},
      \]

      \[
      S^{far}_{j,L}:=\sum_{m\le j-L}S_m^{loc},
      \qquad
      S^{near}_{j,L}:=\sum_{j-L<m<j}S_m^{loc}.
      \]

      The far-low term has a genuine parabolic scale-separation gain. The near band does not; it must be routed to parabolic burst/source structure.

      This is a real gain: very low modes cannot oscillate at the high-shell heat rate without paying an explicit material-derivative source term.

      This is not the false accumulated-positive Pack claim. It is an unsigned far-low variation tail with a small scale-separation coefficient.

      Case 1 is the existing parabolic-rate strain burst branch. By Inverse Parabolic Burst.A, it forces lower/neighbor donor height. On a first-height run this is inherited, legally charged, or sent to the Zeno residue branch.

      Cases 2 and 3 are the real pressure/source and frame-transport legalizers. They are not supplied by scalar shell balance.

      This is consistent with the signed-current surfaces: rotating a retained high packet into the expanding low-strain eigendirection cannot be free.

      If these fail, the countermodel is very specific: a retained high packet samples a near-neighbor low-strain band whose direction/value oscillates at the high heat rate, while Pack remains bounded, Part remains active, Field legal loss is absent, and no Zeno atom forms.


