      \subsection{Clay problem Pressure Lobe Source Tether.A Direct Attempt}

      The goal is to decide whether an interior missing pressure cancellation lobe can be converted into a native same-fluid source/donor edge without already using the source-wall theorem.

      \[
      \mathsf J^{press}(A^-\to P)<0,
      \]

      where A - is physically interior, same-fluid-admissible at the geometric level, and not a cutoff/collar/off-family pressure exit.

      If this holds, the pressure partner saturation route can use the usual no-free-sink/donor machinery.

      \[
      \mathsf J^{press}(A^-\to P)
      =
      E_P^\#\tau_P
      \int K_{n_P}(X_P-y):Q_{A^-}(y,t)\,dy\,dt,
      \]

      The Poisson equation says Q A - contributes to 2p at P. It does not say that energy, enstrophy, or same-fluid source has traveled from A - to P. It is an elliptic influence, not a material edge.

      \[
      P_{\mathrm{Leray}}(u\cdot\nabla u)
      =
      u\cdot\nabla u+\nabla p.
      \]

      \[
      \nabla(u\cdot\nabla u)+\nabla^2p
      =
      \nabla P_{\mathrm{Leray}}(u\cdot\nabla u).
      \]

      \[
      E_P^\#\tau_P\int |D_t(n_P\cdot S^{near}n_P)|\,dt.
      \]

      The compactness route does not prove this automatically. It is the limit version of the same tether problem.


