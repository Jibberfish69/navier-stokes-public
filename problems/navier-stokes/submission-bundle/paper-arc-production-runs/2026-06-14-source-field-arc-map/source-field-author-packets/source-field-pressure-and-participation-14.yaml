    text: |+
      \subsection{Pressure-Derivative Obstruction Trajectory Integration}

      The retained branch may use point-center forcing only after the retained smooth center-ball certificate supplies the needed local regularity. The finite-energy branch must use the averaged packet route, not pointwise center recovery.

      \[
      \|u\|_{L^2}<\infty
      \quad\text{and}\quad
      -\Delta p=\partial_i\partial_j(u_i u_j)
      \Longrightarrow
      \text{point-center pressure derivative bounds}
      \]

      This shrinks a false supplier burden. It prevents the trajectory from spending work on an unavailable pointwise pressure recovery from energy and Poisson data alone.


