      \subsection{Coherent High-Collar Coefficient Tail Result}

      Fix the active dyadic scale \(j\), the collar width \(M\), and the coherent
      projector fattening \(A\).  The coefficient-tail estimate uses

      \[
      \alpha_T=C_A(C_s\kappa_T+
      \kappa_R),
      \qquad
      \beta_T=C_A.
      \]

      The constants depend on the fixed selector geometry, readout Sobolev comparison,
      and probe-collar constants.

      \[
      R_{j,A,M}:=P_{>j-M}P_{\le j+A}.
      \]

      \[
      \|R_{j,A,M}f\|_{L_x^\infty}
      \le C_{A,M}\|f\|_{L_x^\infty}.
      \]

      With smooth Littlewood--Paley cutoffs, the symbol of \(R_{j,A,M}\) is supported
      in the finite annulus

      \[
      2^{j-M}\le C_{\mathrm{sf},2443} |\xi|\le C_{\mathrm{sf},2443} 2^{j+A}.
      \]

      \[
      K_{j,A,M}(x)=2^{3j}K_{A,M}(2^jx).
      \]

      This scaling gives the displayed \(L^\infty\) bound for the fixed-fattened
      projector \(P_{\le j+A}\).  The finite-collar multiplier proof is the active
      support branch.

      Fixed-fattened leakage means that the frequencies between \(j-M\) and \(j+A\)
      are included in the finite annulus multiplier \(R_{j,A,M}\).

      The collar multiplier costs one explicit factor \(2^j\), matching the amplitude
      scale \(2^j\) from the selector strain proof.

      The lower-order readout term \(E_D(X)\) stays explicit and enters the collar
      estimate as the permitted lower-order contribution.

      This result completes the coefficient side of the low-pass commutator collar
      chain under the already stated selector-persistent transport hypotheses.  It
      carries the amplitude estimate exported by the selector-localized coherent
      strain result and leaves any independent smallness source to the surrounding
      closure route.


