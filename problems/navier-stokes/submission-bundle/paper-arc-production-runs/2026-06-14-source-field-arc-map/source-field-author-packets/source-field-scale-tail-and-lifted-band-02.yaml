      \subsection{Coupled Lifted-Band Gain Target}

      After swapping the kernelized lifted-band sums, the lower shell \(k\) is paired
      with an upper-tail dissipation convolution.  The object to control is the paired
      lower-shell/upper-tail carrier

      \[
      \sum_{k>N+M}
      2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}\,
      \mathcal D_k^\uparrow(t),
      \]

      \[
      \mathcal D_k^\uparrow(t)
      :=
      \sum_{j>k+4}
      2^{-\sigma(j-k)}D_j(t).
      \]

      Here
      \[
      D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2
      \]
      is the high-shell dissipation weight, and \(2^{-\sigma(j-k)}\) is the
      spectral-gap kernel already present in the packet algebra.

      The missing theorem is a coupled theorem.  It controls the lower-shell gain when
      that gain is tested against the upper-tail dissipation carrier:

      \[
      2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}\le a_k(t),
      \]

      with \(a_k(t)\) usable only through the paired sum
      \[
      \sum_{k>N+M} a_k(t)\,\mathcal D_k^\uparrow(t).
      \]

      This target is an intermediate reduction upstream of MSI.  Its job is to control
      the lower-shell coefficient inside the exact pairing generated by the
      lifted-band packet.  A standalone shellwise high-gain estimate would be stronger
      than the packet asks for.


