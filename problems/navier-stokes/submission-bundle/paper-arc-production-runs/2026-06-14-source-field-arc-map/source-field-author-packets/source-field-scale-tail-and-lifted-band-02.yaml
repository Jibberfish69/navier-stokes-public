    2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}\le a_k(t),
    \]

    with \(a_k(t)\) usable only through the paired sum
    \[
    \sum_{k>N+M} a_k(t)\,\mathcal D_k^\uparrow(t).
    \]

    This target is an intermediate reduction upstream of MSI.  Its job is to control
    the lower-shell coefficient inside the exact pairing generated by the
    lifted-band packet.  A standalone shellwise high-gain estimate would be stronger
    than the packet asks for.



    \subsection{Cross-Scale Decorrelation Theorem}

    This is an active branch candidate for the upper-tail reductions.  Its purpose
    is to attack the cross-scale bilinear interaction directly, at the point where
    the one-sided SDS queue leaves a summed shell-exchange burden.

    The intended claim allows shell transfer and shell alignment.  It asks for a
    quantitative dissonant part as well: enough misalignment across separated
    scales to rule out fully coherent worst-case cross-scale growth.

    \[
    D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
    \]

    \[
    \mathfrak B_N^\sigma(t)
    :=
    \sum_{\substack{j\le \ell\\ j>N+M+4}}
    2^{(1+\sigma)j-\sigma\ell}\,D_j(t)\,D_\ell(t).
    \]

    The quantity \(\mathfrak B_N^\sigma(t)\) is the cross-scale reinforcement
    object produced by the current upper-tail reductions.  A successful
    decorrelation theorem would dominate this reinforcement by same-scale activity
    plus a controlled gap defect.

    The branch map is

    \[
    (SDS^\sharp)\Longrightarrow(NE^\sharp)\Longrightarrow(UTKD^\sharp)\Longrightarrow(PCI^\sharp)\Longrightarrow(MSI^\sharp).
    \]

    \[
    1-2^{-\sigma(\ell-j)}\sfcomp{3195} 1
    \]

    The current audit sharpens the boundary.  A gap-damped defect theorem improves
    the one-sided carrier to

    \[
    \sum_{k>N+M}2^k\,a_k(t)\,\mathcal D_k^{\uparrow,\beta}(t)
    \]

    The branch is useful because it upgrades the gap structure.  It remains open
    because the weighted \(j\)-summation still asks for a genuinely new
    commutator-tail theorem beyond the inherited Euclidean inputs.  At the present
    boundary, the proof has extracted the available termwise estimates.  The
    remaining question is whether the summed signed shell exchange collapses to the
    barrier scale before it is turned into a positive carrier.



    \subsection{Curvature-To-Scale Feedback Bridge}

    The curvature branch had a feedback role in the original source family.

    \[
    \partial_t |\nabla u|^2
    =
    - \mathrm{Ric}(g)(\nabla u,\nabla u)
    + \nu \Delta_g |\nabla u|^2
    + C |\nabla u|^3.
    \]

    Under the positive-curvature hypothesis
    \[
    \mathrm{Ric}(g)\ge\kappa>0,
    \]
    the source family uses this evolution law to bound the gradient quantity and
    feed that bound back into the scale-control loop.

    The source-grounded feedback role of the curvature branch belongs to the
    original four-way loop.  Its Euclidean use is governed by the pullback target
    above.



    \subsection{Theorem HFG: Dyadic High-Frequency Gain Frontier}

    HFG is the endpoint high-frequency gain for the classical vorticity route.  Its
    job is concrete: a summable dyadic vorticity tail gives the critical
    Besov-vorticity input used by the standard continuation criterion.  The
    installed part is the implication from HFG to continuation.  The production of
    HFG from the Navier--Stokes dynamics remains a frontier theorem.

    \[
    \omega := \nabla \times u.
    \]

    The packet asks for

    \[
    \sum_{j\ge 0} 2^{\frac32 j}\,\|\Delta_j\omega\|_{L^1_tL^2_x(0,T)} < \infty.
    \]

    Equivalently,

    \[
    \sum_{j\ge 0} 2^{\frac12 j}\,\|\nabla \Delta_j\omega\|_{L^1_tL^2_x(0,T)} < \infty.
    \]

    By Bernstein, this would give

    \[
    \int_0^T\|\omega(t)\|_{B^0_{\infty,1}}\,dt<\infty,
    \]

    because Bernstein turns an \(L^2_x\) vorticity shell into an \(L^\infty_x\)
    shell at cost \(2^{3j/2}\).  This is the same-surface continuation readout:
    HFG supplies the critical vorticity norm, and the classical continuation
    criterion then prevents a finite endpoint on that retained classical solution
    surface.

    \[
    \partial_t \omega + (u\cdot\nabla)\omega = (\omega\cdot\nabla)u + \nu\Delta\omega,
    \]

    \[
    \frac12\frac{d}{dt}\|\Delta_j\omega\|_{L^2_x}^2
    + \nu 2^{2j}\|\Delta_j\omega\|_{L^2_x}^2
    \le
    \langle \Delta_j((\omega\cdot\nabla)u), \Delta_j\omega\rangle
    + \mathrm{Comm}_j.
    \]

    After the low-mode and finite-band spill pieces are separated, the theorem
    critical burden is a cascade estimate of the form

    \[
    \mathrm{cascade}_j(t)
    \le
    \varepsilon\nu2^{2j}\|\Delta_j\omega(t)\|_{L^2_x}^2
    +C_\varepsilon2^{-2j}\|\nabla\omega(t)\|_{L^2_x}^2.
    \]

    There are several legitimate ways to attack this burden.  A dyadic Duhamel
    argument would need a summable forcing estimate for
    \(\Delta_j((\omega\cdot\nabla)u-(u\cdot\nabla)\omega)\).  A Bony
    decomposition route would need the strict low-mode pieces absorbed by the
    admissible coefficient \(\mathcal L_N(t)E_N(t)\), leaving the high-high packet
    inside viscosity.  A heat-kernel route would need the cascade estimate first
    and would then extract dyadic time decay.  An all-scale transfer route would
    need more than separated-frequency loss: it would also have to control the
    near-diagonal low-mode amplitude channel.

    That last point is the live obstruction.  A spectral-gap kernel pays for
    off-diagonal transfer, while the low-high channel at shell \(j\) sits near the
    diagonal and lacks a large gap to spend.  The strict low-mode strain coefficient must
    be absorbed at shell \(j\), or an equivalent mixed enstrophy-gradient primitive
    must replace that absorption.  The current all-scale notes broaden the route and
    pay real off-diagonal gain, while the diagonal/amplitude part of HFG remains
    unpaid.

    The baseline energy and enstrophy bounds are also too coarse to supply HFG by
    interpolation.  The model shell example in the theorem file has finite
    dissipation-level mass and divergent HFG-weighted sum.  That example is a scale
    counterexample to interpolation, rather than a Navier--Stokes blow-up
    construction.  D.80 records the frontier accurately: HFG would close
    the classical continuation side once proved, and the missing proof is the
    same-surface cascade gain described above.


