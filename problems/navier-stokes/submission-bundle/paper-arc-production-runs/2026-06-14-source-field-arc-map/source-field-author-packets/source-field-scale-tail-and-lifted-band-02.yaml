      \subsection{Collar Remainder Lower-Order Estimate Result}

      The lower-order collar remainder estimate lives on the readout-compatible
      carrier surface.  Two inputs feed the estimate: the
      noncoherent low-mode readout estimate, and the coherent transport bound on
      \(u_{\mathrm{coh}}\).

      The estimate is a smooth-multiplier commutator bound.  The coherent strain
      coefficient is controlled at the active shell scale.  The proof can use spectral
      alignment plus \(H_D^s\) tail decay, or the special case in which the coherent
      selector carries only subthreshold readout.

      The preliminary four-term bound is

      \[
      \|\nabla R^{collar}_{i,j}[X;Y]\|_\infty
      \le
      4\varepsilon\nu2^{2j}\|Y\|_{H_D^s}+4C_\varepsilon\Phi(\mathcal E_D(X)).
      \]

      After renormalizing constants, the usable form is

      \[
      \|\nabla R^{collar}_{i,j}[X;Y]\|_\infty
      \le
      \varepsilon\nu2^{2j}\|Y\|_{H_D^s}+C_\varepsilon\Phi(\mathcal E_D(X)).
      \]

      The proof takes one spatial derivative of the four-term expression for
      \(R^{\mathrm{collar}}_{i,j}\) and then uses the triangle inequality.  The four
      terms are charged separately, so the reader can see which payment carries which
      piece of the remainder:

      \[
      \begin{array}{ll}
      \mathrm{C1} & \text{local readout residue},\\[2pt]
      \mathrm{C2} & \text{noncoherent low-mode contribution},\\[2pt]
      \mathrm{C3} & \text{low-pass collar commutator},\\[2pt]
      \mathrm{C4} & \text{coherent high-tail contribution}.
      \end{array}
      \]

      When all four payments are present, the collar assembly has a complete
      lower-order reserve.  In the current proof state, C3 is the shortest named CM branch law
      needing theorem-grade expansion.  Its job is to control the low-pass commutator
      collar at the active coherent low-mode strain scale and make the commutator
      payment visible on the page.


