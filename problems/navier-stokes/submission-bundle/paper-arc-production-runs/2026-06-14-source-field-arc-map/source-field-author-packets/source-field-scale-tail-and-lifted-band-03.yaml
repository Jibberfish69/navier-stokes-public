      \subsection{Dyadic Shell-Tail Suppression Lemma}

      PST.A is the repaired shell-tail theorem used by the active periodic cascade
      route.  Its job is narrower than HFG.  HFG asks for
      all-threshold endpoint Besov summability.  PST.A asks for a threshold selected
      by a finite-interval scheduler and then suppresses the high tail above that
      threshold on the periodic branch.

      \[
      E_N(t):=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_2^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
      \]

      The repaired commutator route gives the differential inequality

      \[
      \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
      \le
      C_{\eta,M,\nu}\widetilde\Lambda_N^\sharp(t)E_N(t)+C_*2^{-2\delta N}.
      \]

      \[
      \widetilde\Lambda_N^\sharp\in L^1(I).
      \]

      \[
      \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho.
      \]

      The resulting high-frequency cascade flux is budget-small at that chosen
      threshold:

      \[
      |\Pi_{\ge N}(t)|
      \le
      C\widetilde\Lambda_N^\sharp(t)E_N(t)+\eta\nu D_N(t)+C_*2^{-2\delta N}.
      \]

      The proof interface is

      \[
      L_{\mathrm{mode}}+S_{\mathrm{spill}}+H_{\mathrm{abs}}
      \Longrightarrow G_{\mathrm{comm}},
      \]

      \[
      G_{\mathrm{comm}}+C_{\mathrm{coeff}}+S_{\mathrm{sched}}
      \Longrightarrow P_{\mathrm{support}}.
      \]

      The order matters.  LowMode.A, SP.A, and HH.Abs.Q build the gradient
      commutator estimate GC.A.  Coeff.A supplies fixed-threshold integrability of
      \(\widetilde\Lambda_N^\sharp\).  Sched.A chooses \(N\) and partitions the
      finite interval so Gronwall can propagate the high-tail budget.  PST.A is the
      resulting periodic support theorem.

      This support is valuable precisely because it is narrower than HFG.  It gives a
      controlled periodic shell-tail surface after the low-mode, spill, high-high,
      coefficient, and scheduling pieces are in place.  The endpoint conversion
      belongs downstream in PEnd.A, and the whole-space export belongs to its own
      surface.  The reader should use D.81 as route support and D.80 as the stronger
      open frontier.


