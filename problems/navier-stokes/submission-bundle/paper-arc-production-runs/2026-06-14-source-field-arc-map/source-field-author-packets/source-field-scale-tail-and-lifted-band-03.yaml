    E_j(t):=2^{2j}\|\Delta_j u(t)\|_2^2,
    \qquad
    D_j(t):=2^{4j}\|\Delta_j u(t)\|_2^2,
    \qquad
    D_N(t):=\sum_{j\ge N}D_j(t),
    \]
    and
    \[
    \sup_{t<T}\|u(t)\|_2^2\le C_E,
    \]
    the oriented far block
    \[
    Far_N^+(t):=
    2^{-2N}\sum_{j\ge N+C_0}E_j(t)
    \sum_{N\le k\le j-C_0}E_k(t)
    \]
    satisfies
    \[
    Far_N^+(t)\le C_{C_0}C_E2^{-2N}D_N(t).
    \]
    The symmetric orientation has the same bound, so for every \(\varepsilon>0\)
    and all sufficiently large \(N\),
    \[
    Far_N(t)\le\varepsilon\nu D_N(t).
    \]

    The far-separated tail-square bridge is paid by the global energy bound. The
