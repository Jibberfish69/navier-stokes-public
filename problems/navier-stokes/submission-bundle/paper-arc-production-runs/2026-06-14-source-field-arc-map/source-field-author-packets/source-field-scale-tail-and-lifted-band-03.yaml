      \subsection{Entrance-Tail Reserve Result}

      The square-source route has two inputs.  The first input is an entrance reserve
      at a regular time \(t_0<T\):

      \[
      E_j(t_0)^2
      \le
      c\varepsilon\nu^2 2^j|I|
      +C\nu2^{-j}2^{-2\delta j}.
      \]

      This entrance input is already supplied.  Smoothness at \(t_0\) gives, for every
      \(s>0\),

      \[
      \|\Delta_j u(t_0)\|_2
      \le C_s(t_0)2^{-sj}.
      \]

      \[
      E_j(t_0)=2^{2j}\|\Delta_j u(t_0)\|_2^2,
      \]

      So

      \[
      E_j(t_0)^2
      \le C_s(t_0)^4 2^{(8-4s)j}.
      \]

      Choose \(s\) so large that

      \[
      8-4s<-1-2\delta.
      \]

      Then the decay of \(E_j(t_0)^2\) is stronger than the required reserve rate,
      and the displayed entrance reserve holds for all sufficiently high shells,
      with the threshold depending on \(t_0\), \(I\), \(\nu\), \(\varepsilon\), and
      \(\delta\).

      The boundary is the point of the section.  D.84 gives high-shell smallness at a
      regular entrance time.  The second input is the square-source estimate
      for \(F_j\):

      \[
      \int_I |F_j(t)|^2\,dt
      \le
      c\varepsilon\nu^3 2^{3j}|I|+C\nu^2 2^j2^{-2\delta j}.
      \]

      That square-source estimate failed as a universal original-data theorem by the
      fixed-shell cubic amplitude test.  The entrance side of the route is paid; the
      active-square side needs a valid square-source theorem, a signed
      cancellation theorem for the shell flux, or a direct active-square Carleson
      theorem.


