      \subsection{Far-Corona Carleson Direct Attack}

      The exact far-corona Carleson object is the density
      \[
      \mathcal A_{\ell,r}(t)
      :=
      \chi_{\mathrm{mid}}(\log \ell)
      \int_{\mathbb R^3}
      \widetilde\Sigma_r(x,t)\,\tau_\ell^{H^1}[u](x,t)\,dx,
      \qquad r\ge c_1\ell,
      \]
      where \(\widetilde\Sigma_r\) is the far-corona strain at scale \(r\), and
      \(\tau_\ell^{H^1}[u]\) is the active-scale \(H^1\) stress density. Define
      \[
      B_r(t):=\int_0^{r/c_1}\mathcal A_{\ell,r}(t)\,\frac{d\ell}{\ell}.
      \]
      The exact Carleson target is
      \[
      \int_0^T\int_0^\infty B_r(t)^2\,\frac{dr}{r}\,dt
      \le C_{\mathrm{sf},6591}
      \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \]
      Since \(\mathcal A_{\ell,r}\ge0\), this is not a cancellation problem in
      \(\ell\). The route has to control \(B_r\).

      \[
      T_r(x,t)
      :=
      \int_0^{r/c_1}
      \chi_{\mathrm{mid}}(\log\ell)\,
      \tau_\ell^{H^1}[u](x,t)\,\frac{d\ell}{\ell}.
      \]
      Fubini gives the exact coupled pairing
      \[
      B_r(t)
      =
      \int_{\mathbb R^3}
      \widetilde\Sigma_r(x,t)\,T_r(x,t)\,dx.
      \]

      The accumulated stress has real nested-scale structure:
      \[
      r\partial_rT_r
      =
      \chi_{\mathrm{mid}}(\log(r/c_1))\,
      \tau_{r/c_1}^{H^1}[u].
      \]
      This identity is useful, but it is not a closure theorem. A Hardy or propagation
      step would still have to control \(T_r\) against the low-scale dissipation
      measure.

