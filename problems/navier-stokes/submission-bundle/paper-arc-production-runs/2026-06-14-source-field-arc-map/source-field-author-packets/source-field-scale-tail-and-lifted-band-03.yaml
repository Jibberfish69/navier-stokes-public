      \subsection{Far-Separated Tail-Square To Far-Corona Bridge Result}

      The older bridge note separates the far-separated tail-square block from the
      far-corona \(LPAS/FCTS\) packet. The current conclusion from D.118--D.120 is
      stronger: for the reserve, use the direct energy absorption of the
      far-separated block. The warning is that \(FC\) itself should not be treated as
      the whole tail-square reserve.

      \[
      Far_N(t):=2^{-2N}
      \sum_{\substack{j,k\ge N\\ |j-k|>C_0}}E_j(t)E_k(t).
      \]

      \[
      Far_N^+(t):=2^{-2N}
      \sum_{j\ge N+C_0}
      E_j(t)
      \sum_{N\le k\le j-C_0}E_k(t).
      \]

      \[
      LPAS_N(t):=
      \sum_{j\ge N}
      \left(\sum_{k\le j-C_1}E_k(t)\right)
      2^{-j}D_j(t)^2.
      \]

      \[
      D_j(t)=2^{2j}E_j(t).
      \]
      Thus
      \[
      2^{-j}D_j^2=2^{3j}E_j^2.
      \]

      Scale separation supplies the lower-prefix geometry, but it does not by itself
      turn the linear high-shell factor \(E_j\) in \(Far_N^+\) into the active-square
      factor \(2^{3j}E_j^2\) in \(LPAS_N\). This is why the old route asked for a
      linear-to-active-square bridge.

      The newer absorption result bypasses that bridge for the reserve. It controls
      the far-separated all-tail block directly by
      \[
      Far_N(t)\le \varepsilon\nu D_N(t)
      \]
      for sufficiently large \(N\). Thus the boundary statement is: near-diagonal
      tail-square absorption and direct far-separated absorption pay the tail-square
      reserve, while \(FC\) remains a lifted-packet theorem rather than a substitute
      for the whole reserve.


