      \subsection{Lemma 4 -> 1: Euclidean Scale-Barrier Recertification Packet}

      The exact return-arrow needed by the Euclidean scale-barrier branch is the
      object under test.  It is a support implication, not a new proof of regularity
      or a separate continuation criterion.  The implication is narrower: the
      exact Euclidean limit object, together with the upgraded gradient-transfer
      inequality, should recover the dyadic scale barrier used earlier in the proof
      on the same surface.

      Work on \([0,T)\times\mathbb R^3\) in the classical target class, with the
      same Littlewood--Paley notation used in the scale-barrier section.  Put

      \[
      P_{\ge N} := \sum_{j\ge N} P_j,
      \]

      \[
      T_N(t)
      :=
      \|P_{\ge N}u(t)\|_{L_x^2}^2,
      \qquad
      Q_N(t)
      :=
      \|\nabla P_{\ge N}u(t)\|_{L_x^2}^2.
      \]

      \[
      E_N(t)
      :=
      \sum_{j\ge N} 2^{2j}\|P_j u(t)\|_{L_x^2}^2,
      \qquad
      D_N(t)
      :=
      \sum_{j\ge N} 2^{4j}\|P_j u(t)\|_{L_x^2}^2.
      \]

      The scale-barrier quantity to recover is the integrated high-frequency tail

      \[
      \Pi_{\ge N}(T):=\int_0^T T_N(t)\,dt.
      \]

      The desired conclusion is the same-shape barrier

      \[
      \Pi_{\ge N}(T)\le C_*2^{-2\delta N}
      \qquad (N\ge N_*).
      \]

      The return arrow must preserve the same projector \(P_{\ge N}\), the same
      exponent \(\delta\), and the same large threshold regime.  A weaker downstream
      bound would not recertify Proposition 4.1 on the exact Euclidean surface.

