    D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
    \]

    The repaired commutator route gives the differential inequality

    \[
    \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
    \le
    C_{\eta,M,\nu}\widetilde\Lambda_N^\sharp(t)E_N(t)+C_*2^{-2\delta N}.
    \]

    \[
    \widetilde\Lambda_N^\sharp\in L^1(I).
    \]

    \[
    \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho.
    \]

    The resulting high-frequency cascade flux is budget-small at that chosen
    threshold:

    \[
    |\Pi_{\ge N}(t)|
    \le
    C\widetilde\Lambda_N^\sharp(t)E_N(t)+\eta\nu D_N(t)+C_*2^{-2\delta N}.
    \]

    The proof interface is

    \[
    L_{\mathrm{mode}}+S_{\mathrm{spill}}+H_{\mathrm{abs}}
    \Longrightarrow G_{\mathrm{comm}},
    \]

    \[
    G_{\mathrm{comm}}+C_{\mathrm{coeff}}+S_{\mathrm{sched}}
    \Longrightarrow P_{\mathrm{support}}.
    \]

    The order matters.  LowMode.A, SP.A, and HH.Abs.Q build the gradient
    commutator estimate GC.A.  Coeff.A supplies fixed-threshold integrability of
    \(\widetilde\Lambda_N^\sharp\).  Sched.A chooses \(N\) and partitions the
    finite interval so Gronwall can propagate the high-tail budget.  PST.A is the
    resulting periodic support theorem.

    This support is valuable precisely because it is narrower than HFG.  It gives a
    controlled periodic shell-tail surface after the low-mode, spill, high-high,
    coefficient, and scheduling pieces are in place.  The endpoint conversion
    belongs downstream in PEnd.A, and the whole-space export belongs to its own
    surface.  The reader should use D.81 as route support and D.80 as the stronger
    open frontier.



    \subsection{Entrance-Tail Reserve Result}

    The square-source route has two inputs.  The first input is an entrance reserve
    at a regular time \(t_0<T\):

    \[
    E_j(t_0)^2
    \le
    c\varepsilon\nu^2 2^j|I|
    +C\nu2^{-j}2^{-2\delta j}.
    \]

    This entrance input is already supplied.  Smoothness at \(t_0\) gives, for every
    \(s>0\),

    \[
    \|\Delta_j u(t_0)\|_2
    \le C_s(t_0)2^{-sj}.
    \]

    \[
    E_j(t_0)=2^{2j}\|\Delta_j u(t_0)\|_2^2,
    \]

    So

    \[
    E_j(t_0)^2
    \le C_s(t_0)^4 2^{(8-4s)j}.
    \]

    Choose \(s\) so large that

    \[
    8-4s<-1-2\delta.
    \]

    Then the decay of \(E_j(t_0)^2\) is stronger than the required reserve rate,
    and the displayed entrance reserve holds for all sufficiently high shells,
    with the threshold depending on \(t_0\), \(I\), \(\nu\), \(\varepsilon\), and
    \(\delta\).

    The boundary is the point of the section.  D.84 gives high-shell smallness at a
    regular entrance time.  The second input is the square-source estimate
    for \(F_j\):

    \[
    \int_I |F_j(t)|^2\,dt
    \le
    c\varepsilon\nu^3 2^{3j}|I|+C\nu^2 2^j2^{-2\delta j}.
    \]

    That square-source estimate failed as a universal original-data theorem by the
    fixed-shell cubic amplitude test.  The entrance side of the route is paid; the
    active-square side needs a valid square-source theorem, a signed
    cancellation theorem for the shell flux, or a direct active-square Carleson
    theorem.



    \subsection{Lemma 4 -> 1: Euclidean Scale-Barrier Recertification Packet}

    The exact return-arrow needed by the Euclidean scale-barrier branch is the
    object under test.  It is a support implication, not a new proof of regularity
    or a separate continuation criterion.  The implication is narrower: the
    exact Euclidean limit object, together with the upgraded gradient-transfer
    inequality, should recover the dyadic scale barrier used earlier in the proof
    on the same surface.

    Work on \([0,T)\times\mathbb R^3\) in the classical target class, with the
    same Littlewood--Paley notation used in the scale-barrier section.  Put

    \[
    P_{\ge N} := \sum_{j\ge N} P_j,
    \]

    \[
    T_N(t)
    :=
    \|P_{\ge N}u(t)\|_{L_x^2}^2,
    \qquad
    Q_N(t)
    :=
    \|\nabla P_{\ge N}u(t)\|_{L_x^2}^2.
    \]

    \[
    E_N(t)
    :=
    \sum_{j\ge N} 2^{2j}\|P_j u(t)\|_{L_x^2}^2,
    \qquad
    D_N(t)
    :=
    \sum_{j\ge N} 2^{4j}\|P_j u(t)\|_{L_x^2}^2.
    \]

    The scale-barrier quantity to recover is the integrated high-frequency tail

    \[
    \Pi_{\ge N}(T):=\int_0^T T_N(t)\,dt.
    \]

    The desired conclusion is the same-shape barrier

    \[
    \Pi_{\ge N}(T)\le C_*2^{-2\delta N}
    \qquad (N\ge N_*).
    \]

    The return arrow must preserve the same projector \(P_{\ge N}\), the same
    exponent \(\delta\), and the same large threshold regime.  A weaker downstream
    bound would not recertify Proposition 4.1 on the exact Euclidean surface.

    The first input is the exact Euclidean limit object supplied by the compactness
    bridge:

    \[
    u^{(n)} \to u
    \quad\text{strongly in } L^2([0,T];L^2_{\mathrm{loc}}(R^3)),
    \qquad
    u^{(n)} \otimes u^{(n)} \to u \otimes u
    \quad\text{in } \mathcal D'((0,T)\times R^3).
    \]

    The second input is the upgraded fourth-bridge inequality:

    \[
    \frac{d}{dt}E_N(t) + (1-\eta)\nu D_N(t)
    \le
    C\,\widetilde\Lambda_N^\sharp(t)\,E_N(t) + C_* 2^{-2\delta N},
    \qquad
    \widetilde\Lambda_N^\sharp \in L_t^1.
    \]

    The local tail-energy proof begins from the exact equation

    \[
    \partial_t u+\mathbb P\nabla\!\cdot(u\otimes u)=\nu\Delta u,
    \qquad
    \nabla\cdot u=0.
    \]

    Apply \(P_{\ge N}\), pair the result with \(P_{\ge N}u\), and use
    \(\nabla\cdot u=0\).  The high-tail energy identity is

    \[
    \frac12\frac{d}{dt}T_N(t)+\nu Q_N(t)
    =
    -\left\langle P_{\ge N}(u\cdot\nabla u),P_{\ge N}u\right\rangle.
    \]

    The nonlinear term is split into the same three packets used by the route:

    \[
    \mathcal N_N^{\mathrm{tail}}
    \le
    \mathcal N_{N,\mathrm{strict}}^{\mathrm{tail}}
    +\mathcal N_{N,\mathrm{spill}}^{\mathrm{tail}}
    +\mathcal N_{N,\mathrm{HH}}^{\mathrm{tail}}.
    \]

    The current proof state is partial but useful.  The spill packet is explicit and
    absorbs into \(Q_N\) by the large-cutoff factor \(2^{-N/2}K_T\).  The genuine
    high-high packet is also explicit after absorbing the fixed dyadic collar into
    the threshold budget.  The strict low-mode packet is the delicate remaining
    piece: it is reduced to an admissible coefficient \(\Gamma_N\), but the
    coefficient-preserving commutator absorption is still under audit.

    Conditional on that strict low-mode audit, the packets assemble into

    \[
    \frac12\frac{d}{dt}T_N(t)+\frac{\nu}{2}Q_N(t)
    \le
    C\,\Gamma_N(t)T_N(t).
    \]

    The proof does not use bare Gronwall on \(T_N\).  The needed gain comes from
    coercive tail damping:

    \[
    Q_N(t)\ge c_{\mathrm{LP}}\,2^{2N}T_N(t).
    \]

    Combining the coercive bound with the preceding inequality gives

    \[
    \frac12\frac{d}{dt}T_N(t)
    +
    \left(\frac{\nu c_{\mathrm{LP}}}{2}2^{2N}
    -C\Gamma_N(t)\right)T_N(t)
    \le 0.
    \]

    The low-mode coefficient estimate gives

    \[
    \Gamma_N(t)\le 1+C_0\,2^{3N/2}M
    \]

    on the same Euclidean surface.  Since \(2^{2N}\) dominates \(2^{3N/2}\) for
    large \(N\), the damping wins for all \(N\ge N_*\):

    \[
    \frac{d}{dt}T_N(t)+2\lambda\,2^{2N}T_N(t)\le0.
    \]

    The integrated inequality is

    \[
    \Pi_{\ge N}(T)\le \frac{T_N(0)}{2\lambda\,2^{2N}}.
    \]

    Smooth compactly supported initial data gives faster-than-any-fixed-rate tail
    decay, so for the project exponent \(\delta>0\),

    \[
    T_N(0)\le C_{0,*}2^{-2\delta N}.
    \]

    This yields

    \[
    \Pi_{\ge N}(T)
    \le
    C_{1,*}2^{-2(\delta+1)N}
    \le
    C_*2^{-2\delta N},
    \qquad N\ge N_*.
    \]

    This is the precise meaning of gradient-transfer recertifying the scale
    barrier.  The line is not closed merely by writing the differential inequality:
    the manuscript still owes the final strict low-mode commutator absorption audit
    and the upstream alignment between Propositions 4.1 and 6.1.



    \subsection{Far-Corona Carleson Direct Attack}

    The exact far-corona Carleson object is the density
    \[
    \mathcal A_{\ell,r}(t)
    :=
    \chi_{\mathrm{mid}}(\log \ell)
    \int_{\mathbb R^3}
    \widetilde\Sigma_r(x,t)\,\tau_\ell^{H^1}[u](x,t)\,dx,
    \qquad r\ge c_1\ell,
    \]
    where \(\widetilde\Sigma_r\) is the far-corona strain at scale \(r\), and
    \(\tau_\ell^{H^1}[u]\) is the active-scale \(H^1\) stress density. Define
    \[
    B_r(t):=\int_0^{r/c_1}\mathcal A_{\ell,r}(t)\,\frac{d\ell}{\ell}.
    \]
    The exact Carleson target is
    \[
    \int_0^T\int_0^\infty B_r(t)^2\,\frac{dr}{r}\,dt
    \le C_{\mathrm{sf},6591}
    \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
    \]
    Since \(\mathcal A_{\ell,r}\ge0\), this is not a cancellation problem in
    \(\ell\). The route has to control \(B_r\).

    \[
    T_r(x,t)
    :=
    \int_0^{r/c_1}
    \chi_{\mathrm{mid}}(\log\ell)\,
    \tau_\ell^{H^1}[u](x,t)\,\frac{d\ell}{\ell}.
    \]
    Fubini gives the exact coupled pairing
    \[
    B_r(t)
    =
    \int_{\mathbb R^3}
    \widetilde\Sigma_r(x,t)\,T_r(x,t)\,dx.
    \]

    The accumulated stress has real nested-scale structure:
    \[
    r\partial_rT_r
    =
    \chi_{\mathrm{mid}}(\log(r/c_1))\,
    \tau_{r/c_1}^{H^1}[u].
    \]
    This identity is useful, but it is not a closure theorem. A Hardy or propagation
    step would still have to control \(T_r\) against the low-scale dissipation
    measure.

    The direct \(L^\infty_x\times L^1_x\) attack gives
    \[
    B_r(t)
    \le
    \|\widetilde\Sigma_r(t)\|_{L^\infty_x}
    \int_{\mathbb R^3}T_r(x,t)\,dx,
    \qquad
    \|\widetilde\Sigma_r(t)\|_{L^\infty_x}
    \le C_{\mathrm{sf},6632} r^{-5/2}\|Q_r u(t)\|_{L^2_x}.
    \]
    After dyadicizing \(r\sfcomp{6645}2^{-k}\), \(\ell\sfcomp{6645}2^{-j}\), and
    \[
    E_j(t):=2^{2j}\|\Delta_j u(t)\|_{L^2_x}^2,
    \]
    this route lands on the quartic weighted tail
    \[
    \int_0^T
    \sum_{k>N+M}2^kD_k(t)
    \left(
    \sum_{j\ge k+C_1}2^{-2j}D_j(t)
    \right)^2dt.
    \]
    That is a sufficient overestimate for \((Car)\). It is not discharged by the
    installed one-sided Euclidean queue \(SDS^\sharp\), \(UTKD^\sharp\), and
    \(PCI^\sharp\).

    \[
    \mathrm{FCTS}:=
    \int_0^T\int_0^\infty
    r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\|T_r(t)\|_{L^2_x}^2
    \frac{dr}{r}\,dt.
    \]
    The exact \(L^2_x\times L^2_x\) attack reduces \((Car)\) to bounding
    \(\mathrm{FCTS}\) by \(\nu\int D_N+C_*2^{-2\delta N}\). That theorem is also
    not installed from the inherited Euclidean inputs. No proved orthogonality or
    factorization collapses \(\|T_r\|_{L^2_x}^2\) to a one-scale estimate already
    available elsewhere.

    There is a sharper fixed-collar shell-pair test. For \(m\le j-C_1\), set
    \[
    \mathcal C_{m,j}(t)
    :=
    2^{2j}
    \left\langle
    [\Delta_j,\Delta_m u(t)\cdot\nabla]\Delta_j u(t),
    \Delta_j u(t)
    \right\rangle.
    \]
    The commutator reduction gives two envelopes:
    \[
    |\mathcal C_{m,j}|
    \le C_{\mathrm{sf},6675}
    2^{m/2}E_m^{1/2}E_j,
    \qquad
    |\mathcal C_{m,j}|
    \le C_{\mathrm{sf},6679}
    E_m^{1/2}2^{-j/2}D_j.
    \]
    The amplitude-free version cannot hold, because \(\mathcal C_{m,j}\) is cubic
    under velocity scaling while \(D_j\) is quadratic. The coefficient-bearing
    fixed-collar packet, however, is already absorbed by the upgraded carrier:
    \[
    \sum_{m\in\mathcal B_I(N)}
    \sum_{j\in\mathcal B_J(N)}
    |\mathcal C_{m,j}(t)|
    \le
    \varepsilon\nu D_N(t)
    +
    C_{\varepsilon,\nu,I,J}\,
    \widetilde\Lambda_N^\sharp(t)E_N(t).
    \]
    Thus the coefficient-identification side of the fixed-collar route is no
    longer the main obstruction. The remaining fixed-collar question is the exact
    threading from the absorbed shell-pair family back to the endpoint or Carleson
    formulation, or a direct theorem for the bilinear envelope
    \[
    \sum_{m\in\mathcal B_I(N)}
    \sum_{j\in\mathcal B_J(N)}
    E_m(t)^{1/2}2^{-j/2}D_j(t).
    \]



    \subsection{Far-Corona Cumulative Tail Stress Theorem}

    The cumulative-tail theorem is the exact sufficient theorem for \(FCTS\). The
    inherited Euclidean inputs reduce that theorem to one precise dyadic object.

    The target is
    \[
    \begin{aligned}
    \mathrm{CTS}
    &:=
    \int_0^T\int_{\ell_{\mathrm{top}}}^{\ell_{\mathrm{bot}}}
    \left(
    \int_{c_1\ell}^{\ell_{\mathrm{hi}}}
    r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\frac{dr}{r}
    \right)
    \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2
    \frac{d\ell}{\ell}\,dt \\
    &\le
    C_{\mathrm{sf},6872}
    \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
    \end{aligned}
    \]
    Because the middle cutoff is supported on a fixed logarithmic band, the
    \(\ell\)-range inside \(T_r\) has bounded logarithmic length. Cauchy--Schwarz
    in \(d\ell/\ell\) gives

    \[
    \|T_r(t)\|_{L^2_x}^2
    \le C_{\mathrm{sf},6881}
    \int_0^{r/c_1}
    \chi_{\mathrm{mid}}(\log\ell)
    \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2
    \frac{d\ell}{\ell}.
    \]
    Substituting this into \(FCTS\) and switching the \(r\)- and \(\ell\)-integrals
    gives the \(CTS\) bound above. Thus \(CTS\Rightarrow FCTS\).

    Dyadicize
    \[
    \ell\sfcomp{6903}2^{-j},\qquad r\sfcomp{6903}2^{-k}.
    \]
    Since \(r\ge c_1\ell\), the inner \(r\)-tail corresponds to
    \(k\le j-C_1\). Define the \(H^1\)-shell energy

    \[
    E_k(t):=2^{2k}\|\Delta_k u(t)\|_{L_x^2}^2.
    \]
    Then the cumulative tail factor is
    \[
    \int_{c_1\ell}^{\ell_{\mathrm{hi}}}
    r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\frac{dr}{r}
    \sfcomp{6915}
    \sum_{k\le j-C_1}E_k(t).
    \]

    \[
    \tau_j^{H^1}[u](x,t)
    \sfcomp{6921}
    2^{2j}
    \int |\eta_j(a)|\,|\delta_a u_j(x,t)|^2\,da.
    \]

    \[
    \|u_j(t)\|_{L_x^4}\le C_{\mathrm{sf},6916} 2^{3j/4}\|u_j(t)\|_{L_x^2}.
    \]

    \[
    \|\tau_j^{H^1}[u](t)\|_{L_x^2}
    \le C_{\mathrm{sf},6921}
    2^{2j}\|u_j(t)\|_{L_x^4}^2
    \le C_{\mathrm{sf},6923}
    2^{7j/2}\|u_j(t)\|_{L_x^2}^2.
    \]

    Using \(D_j(t):=2^{4j}\|u_j(t)\|_{L^2_x}^2\), this becomes
    \[
    \|\tau_j^{H^1}[u](t)\|_{L^2_x}^2
    \le C_{\mathrm{sf},6930}
    2^{-j}D_j(t)^2.
    \]
    The inherited Euclidean reduction of \(CTS\) is exactly
    \[
    \int_0^T
    \sum_{j\ge N}
    \left(
    \sum_{k\le j-C_1}E_k(t)
    \right)
    2^{-j}D_j(t)^2\,dt
    \le C_{\mathrm{sf},6941}
    \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
    \]
    This is the lower-prefix active-square theorem surface. The installed
    Euclidean queue controls other one-sided tail and carrier objects; it does not
    currently prove this lower-prefix-times-active-square estimate.

    The far-corona route is now sharper. The continuum theorem \(CTS\) would close
    \(FCTS\), and the inherited direct attack reduces \(CTS\) to \(LPAS\). What
    remains open is no longer vague far-corona language: it is the \(LPAS\) estimate
    itself, the stronger \(F2S\) factorization route, or the finite-band endpoint
    route \(FBE/EP\) with the fixed-collar coefficient packet already absorbed.



    \subsection{Far-Corona To Tail-Square Reserve Result}

    The attempted implication in this note was
    \[
    FC
    \Longrightarrow
    \int_0^T2^{-2N}E_N(t)^2\,dt
    \le
    \varepsilon\nu\int_0^T D_N(t)\,dt+C2^{-2\delta N}.
    \]
    That reserve would pay the threshold-collar product through
    \[
    \Theta_N^\sharp(t)E_N(t)
    \le
    \varepsilon\nu D_N(t)+C_\varepsilon2^{-2N}E_N(t)^2.
    \]

    The tail square expands as
    \[
    E_N(t)^2=\sum_{j,k\ge N}E_j(t)E_k(t).
    \]
    It has three pieces: a near-diagonal part \(|j-k|\le C\), a far-separated
    upper/lower part \(j\ge k+C\), and the symmetric far-separated part
    \(k\ge j+C\).

    The far-corona theorem \(FC\) controls the coupled middle-far density used in
    the lifted packet. It does not, by itself, include the near-diagonal tail
    square, and it does not automatically identify both symmetric far-separated
    tail-square halves with the \(LPAS/FCTS\) density. The near-diagonal piece has
    no \(\ell/r\) gap to exploit.

    Thus this note is a warning about scope. Far-corona closure is useful for the
    lifted packet. The full tail-square reserve needs the near-diagonal/collar
    piece and the far-separated all-tail piece to be paid on their own terms. The
    following sections record that the far-separated all-tail piece is now paid
    directly from the global energy bound; the far-corona route remains needed for
    the lifted packet, not for this reserve.



    \subsection{Far-Separated Tail-Square Bridge Absorption}

    This is the current discharge result for the far-separated part of the
    tail-square reserve. With
