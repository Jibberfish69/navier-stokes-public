      \subsection{Far-Corona Cumulative Tail Stress Theorem}

      The cumulative-tail theorem is the exact sufficient theorem for \(FCTS\). The
      inherited Euclidean inputs reduce that theorem to one precise dyadic object.

      The target is
      \[
      \begin{aligned}
      \mathrm{CTS}
      &:=
      \int_0^T\int_{\ell_{\mathrm{top}}}^{\ell_{\mathrm{bot}}}
      \left(
      \int_{c_1\ell}^{\ell_{\mathrm{hi}}}
      r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\frac{dr}{r}
      \right)
      \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2
      \frac{d\ell}{\ell}\,dt \\
      &\le
      C_{\mathrm{sf},6872}
      \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \end{aligned}
      \]
      Because the middle cutoff is supported on a fixed logarithmic band, the
      \(\ell\)-range inside \(T_r\) has bounded logarithmic length. Cauchy--Schwarz
      in \(d\ell/\ell\) gives

      \[
      \|T_r(t)\|_{L^2_x}^2
      \le C_{\mathrm{sf},6881}
      \int_0^{r/c_1}
      \chi_{\mathrm{mid}}(\log\ell)
      \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2
      \frac{d\ell}{\ell}.
      \]
      Substituting this into \(FCTS\) and switching the \(r\)- and \(\ell\)-integrals
      gives the \(CTS\) bound above. Thus \(CTS\Rightarrow FCTS\).

