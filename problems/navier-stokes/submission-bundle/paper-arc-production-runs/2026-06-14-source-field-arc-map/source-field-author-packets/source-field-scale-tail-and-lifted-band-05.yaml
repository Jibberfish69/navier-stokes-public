      \subsection{Lifted-Band Descent-Coboundary To L-Flux Theorem}

      The mismatch/cocycle language has proof value only at the signed flux level.
      Once absolute values and shellwise positive majorants are introduced, the
      exactness information has already been discarded.

      \[
      \ell_N := c\,2^{-N},
      \qquad
      Z_N := (0,\ell_N]_\ell \times \mathbb R^3_x \times [0,T]_t.
      \]

      \[
      \text{refinement-transport mismatch}
      \quad\leadsto\quad
      \Sigma_\ell^{meso}.
      \]

      \[
      \Sigma_\ell^{meso}\,\tau_\ell^{H^1}[u]
      =
      d_{s,x,t}\Psi + E.
      \]

      Here \(E\) is the nonexact remainder, and the application requires \(E\) to be
      barrier-sized. Under that hypothesis, integration by parts telescopes the flux
      into boundary, divergence, time-derivative, and controlled tail terms.

      The status is conditional support. This note gives the mechanism by which
      descent-coboundary exactness can imply the lifted-band flux estimate; it does
      not prove that the already positivized flux measure retains that exactness.


