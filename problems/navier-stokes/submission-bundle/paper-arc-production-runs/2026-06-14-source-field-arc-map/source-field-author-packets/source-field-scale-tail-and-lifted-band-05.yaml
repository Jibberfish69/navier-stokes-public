      \subsection{Lifted-Band Gain to MSI Bridge}

      The lifted-band frontier has been narrowed to one gap above the intermediate
      transport band

      \[
      N+M<k<j-4.
      \]

      \[
      \sum_{j\ge N}\sum_{N+M<k<j-4}
      2^{-(j-k)}\,2^{3k/2}\|\Delta_k u^{(n)}\|_{L^2_x}\,
      \|\nabla \Delta_j u^{(n)}\|_{L^2_x}\,
      \|\Delta_j u^{(n)}\|_{L^2_x}.
      \]

      Here \((\mathrm{SDS}^\sharp)\) is the installed frontier theorem,
      \((\mathrm{NE}^\sharp)\) is the first direct bilinear endpoint,
      \((\mathrm{UTKD}^\sharp)\) is the upper-tail weighted estimate,
      \((\mathrm{PCI}^\sharp)\) is the paired carrier bound obtained from
      \((\mathrm{UTKD}^\sharp)\) and \(L_t^2H_x^1\), and
      \((\mathrm{MSI}^\sharp)\) is the swapped lifted-band remainder theorem.

      \[
      \begin{aligned}
      &\text{(SDS}^\sharp\text{)}
      \Longrightarrow \text{(NE}^\sharp\text{)}
      \Longrightarrow \text{(UTKD}^\sharp\text{)}\\
      &\quad\Longrightarrow \text{(PCI}^\sharp\text{)}
      \Longrightarrow \text{(MSI}^\sharp\text{)}\\
      &\quad\Longrightarrow \text{lifted high-side remainder closure}
      \Longrightarrow \text{Proposition }6.1^\sharp .
      \end{aligned}
      \]

      The gap kernel and the direct bilinear endpoint are explicit. The missing
      frontier theorem is \((\mathrm{SDS}^\sharp)\), with the weighted one-sided
      enstrophy-tail flux identity as the sharpest current mechanism candidate.
      This is not a new family of open estimates; it is one named bridge between the
      support-level kernel and the desired \((\mathrm{MSI}^\sharp)\) remainder.


