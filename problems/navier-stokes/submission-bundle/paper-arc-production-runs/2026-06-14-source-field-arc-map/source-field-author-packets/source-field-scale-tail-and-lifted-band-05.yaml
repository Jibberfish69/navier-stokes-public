    text: |+
      \subsection{Lifted-Band Mesoscopic Residual Reduction Lemma}

      After the collar reduction, the interior term is no longer an undefined
      remainder. It is one localized middle-band flux object.

      \[
      \mathfrak c_\ell
      =
      (\ell\partial_\ell)\Psi_\ell
      + \mathcal S_\ell^{spill}
      + \mathcal W_\ell.
      \]

      \[
      \mathcal W
      =
      \mathcal W^{trans}
      + \mathcal W^{prof},
      \]

      \(\mathcal W^{prof}\) comes only from differentiating scalar weights and smooth
      multiplier profiles. These pieces are folded into a modified primitive

      \[
      \widetilde\Psi := \Psi + \Psi^{prof},
      \]

      up to admissible collar errors. The transpose term has the same scalarized
      commutator geometry as the original signed density: an edge-scale commutator
      output paired with a band-pass test factor. Its target bound is

      \[
      \left|
      \int \mathcal R^{flux}_{mid}(s,t)\,ds
      \right|
      \le C_{\mathrm{sf},10925}
      \Pi_N^{mid}(t),
      \qquad
      \Pi_N^{mid}\sfcomp{10939}
      \int \Sigma_\ell^{meso}\tau_\ell^{H^1}[u]\,d\ell .
      \]

      The reduction to that middle-band flux object is proved here. The barrier
      estimate for \(\Pi_N^{mid}\) remains the separate analytic burden.


