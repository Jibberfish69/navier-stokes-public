      \subsection{High-Frequency Enstrophy Implies H 1 Lemma}

      This final step is elementary and closed.  It turns bounded high-frequency
      enstrophy into the full \(H^1\) continuation norm.

      \[
      E_N(t):=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      \[
      \sup_{0\le t<T}\|u(t)\|_{L_x^2}\le M.
      \]

      \[
      \sup_{0\le t<T}E_N(t)<\infty,
      \]

      \[
      \sup_{0\le t<T}\|\nabla u(t)\|_{L_x^2}<\infty.
      \]

      \[
      \|\nabla u(t)\|_{L_x^2}^2
      \le
      C_N\|u(t)\|_{L_x^2}^2 + E_N(t)
      \]

      because the low-frequency part has only finitely many shells below the fixed
      threshold \(N\).  Thus once the gradient-transfer bridge gives
      \(\sup_{t<T}E_N(t)<\infty\), the full \(H^1\) continuation norm is bounded.
      This lemma removes the soft frequency-completion gap; it does not pay the
      lifted remainder or HFG production gap upstream.


