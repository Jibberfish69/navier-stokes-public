    \Pi_N^{mid}\sfcomp{10939}
    \int \Sigma_\ell^{meso}\tau_\ell^{H^1}[u]\,d\ell .
    \]

    The reduction to that middle-band flux object is proved here. The barrier
    estimate for \(\Pi_N^{mid}\) remains the separate analytic burden.



    \subsection{Lifted-Band Upper-Boundary Packet}

    The upper boundary is the remaining boundary term after lower-collar and
    same-scale spill have been reabsorbed into accepted packet classes.

    \[
    \mathfrak B_N^{upper}
    \quad\text{is supported where}\quad
    \ell\sfcomp{10955} 2^{-N}.
    \]

    The needed estimate is a finite same-scale edge estimate:

    \[
    |\mathfrak B_N^{upper}(t)|
    \le C_{\mathrm{sf},10951}
    \widetilde\Lambda_N^\sharp(t)E_N(t)
    \quad
    \text{up to accepted collar errors.}
    \]

    This is an exact localization of the boundary burden. It does not identify the
    far-corona estimate, which is a separate large-gap packet.



    \subsection{Lifted Packet Signed Continuous-Scale Translation}

    \[
    \mathfrak H_N^{\mathrm{grad,lift}}[u](t)
    :=
    \sum_{j\ge N}2^{2j}\big|\mathcal C_j^{lift}(t)\big|
    \]

    The dyadic shell sum records the right support geometry, but it is the wrong
    proof language for cancellation. The signed commutator channel has to be formed
    before absolute values and shellwise positive majorants erase the refinement
    structure.

    \[
    b_j^{lift}
    :=
    (S_{j-4}-S_{N+M})u,
    \]

    \[
    N+M < k < j-4.
    \]

    \[
    P_{\le \ell}:=\varphi(\ell D),
    \qquad
    Q_\ell:=-\,\ell\partial_\ell P_{\le \ell},
    \qquad
    u_\ell:=Q_\ell u.
    \]

    At active shell \(j\), the relevant physical scale is \(2^{-j}\). The
    transport shells \(k\) are lower frequencies, hence larger scales. The same
    geometry becomes the mesoscopic band

    \[
    b_\ell^{meso}
    :=
    P_{\le c/\ell}u - P_{\le 2^{N+M}}u.
    \]

    The translation preserves the lifted-packet geometry and moves the live theorem
    from a one-scale shell carrier to the coupled two-scale density. The remaining
    object is the pair

    \[
    \mathfrak B_N^{upper},
    \qquad
    \Pi_N^{mid,far,L}.
    \]


