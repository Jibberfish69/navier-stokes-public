      \subsection{Lifted-Band Collar-Class Reduction Lemma}

      The signed continuous-scale version of the lifted packet separates collar
      bookkeeping from the genuine large-gap problem.

      \[
      P_{\le \ell} := \varphi(\ell D),
      \qquad
      Q_\ell := -\,\ell\partial_\ell P_{\le \ell},
      \qquad
      s:=\log \ell.
      \]

      \[
      b_\ell^{meso} := P_{\le c/\ell}u - P_{\le 2^{N+M}}u.
      \]

      \[
      \mathfrak c_\ell(t)
      :=
      \ell^{-2}
      \left\langle
      [Q_\ell,b_\ell^{meso}\!\cdot\nabla]u,\,
      Q_\ell u
      \right\rangle.
      \]

      \[
      \mathfrak c
      =
      -\partial_s\Psi
      + \mathcal S^{spill}
      + \mathcal W,
      \]

      The lower transition collar is finite-width:

      \[
      \mathcal T^{lower\text{-}collar}_{N+M}
      :=
      \sum_{|m-(N+M)|\le C}\mathcal T_m
      \]

      Inside that collar, smooth multipliers may be replaced by a bounded family of
      reference cutoffs. The difference is a bounded-gap perturbation and belongs to
      the accepted collar class. The same-scale spill term is also supported at the
      edge scale and reduces to a fixed same-scale packet plus a collar error.

      The status is closed as a reduction. The lower collar and same-scale spill no
      longer carry independent theorem debt on this route. The signed route is
      narrowed to one upper boundary term and one interior residual class.


