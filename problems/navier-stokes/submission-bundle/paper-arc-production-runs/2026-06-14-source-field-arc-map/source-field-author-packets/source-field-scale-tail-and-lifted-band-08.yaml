      Together with the previous note, this implies Square Charge Evolution.A and pays the Row 6 reserve.

      \[
      E_j'(t)+c\nu D_j(t)\le F_j(t),
      qquad
      D_j(t)\sfcomp{17025}2^{2j}E_j(t).
      \]

      An active pulse with amplitude D j(t) can be sustained at the scalar level whenever the source F j(t) balances the heat damping. Hence donor-tail amplitude gain requires Navier-Stokes source structure inside F j, rather than scalar damping alone.

      \[
      \mathcal J_{j\to l}+\mathcal J_{l\to j}=0.
      \]

      \[
      (W_P-W_{P'})J_e.
      \]

      On live lifted edges the one-sided terminal weights can differ by order size. Absolute-value control returns to the same reserve.

      The second gate is active strain alignment. The lifted commutator contains the principal packet carrier

      \[
      2^{2j}\sum_P\langle S_k(x_P,t)e_P,e_P\rangle |c_P(t)|^2.
      \]

      This term has the same sign-sensitive strain-alignment content as the source wall. A positive bound for it requires one of

      Thus the unconditional source proof reaches the same source-wall kernel in signed form.

      Failure of Donor Tail Amplitude Gain.A along the -reserve probability measure from the previous note yields a terminal pulse forest with three properties.

      \[
      \int S_{N_m}\,dt\ge\eta,
      \qquad
      \int\sum_{\ell>N_m}D_\ell\,dt\to0.
      \]

      Together these two theorems contradict the order-size residue above and imply Scale Critical Tree Carleson.A through the contrapositive of the extraction.

      The next executable branch is the Zeno -pulse pair, because the direct source theorem loops to the weighted lifted skew defect gate.


