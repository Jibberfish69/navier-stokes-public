    text: |+
      \subsection{Entropy Carleson.A test after diffuse-parent failure}

      Diffuse Parent Entropy Charge.A fails under the installed route inputs. The uniform diffuse parent model has

      \[
      \pi_P=\frac{1}{M}\sum_{\alpha=1}^{M}\delta_{P^-_\alpha},
      \]

      A Carleson estimate would require summing a positive packet source measure across bounded-overlap terminal packets. For each child packet in the diffuse model, the positive source may remain order one while the available charge per child tends to zero. So no summable entropy charge is available to dominate

      Bounded overlap controls the number of child packets covering a spacetime point. It does not control the number of legal predecessor parents feeding one child packet. Parent entropy is an incoming-edge complexity, while bounded overlap is an outgoing physical-cover property. Thus bounded overlap cannot convert the missing parent charge into a Carleson reserve.

      \[
      \sum_T\left|\int g_T^{-1}\langle R,\psi_T\rangle dt\right|^2.
      \]

      This is quadratic in residual amplitude. The positive source target is linear in the signed-aligned donor contribution after positive-part extraction. Diffuse amplitudes can keep the linear sum order one while the quadratic sum tends to zero.

      Local Positive Source Carleson.A remains open. The entropy path contributes a sharp obstruction and a named missing theorem, rather than a discharge.


