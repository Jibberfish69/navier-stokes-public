      \subsection{Direct active- / Carleson theorem for nu SCF - obstruction}

      This would match the lower density supplied by persistent Jump avg and would complete the branch-native no-escape argument.

      To obtain the active-/Carleson estimate, the raw mass must gain the missing factor r k alpha on each active shrinking window. That gain is equivalent to an active-window amplitude estimate: terminal active windows must carry charge below the scale-critical threshold fast enough for the weighted sum to converge.

      Finite energy and local pressure integrability allow concentration on shrinking windows. The active- target excludes such concentration. Existing source surfaces identify the same issue through shell variables: flux/source mass control permits steady or pulsed active shells unless an active-shell amplitude gain or -source theorem is added.

      The direct active-/Carleson theorem remains open. It reduces to an active-window amplitude gain or heat-scale -source estimate.

      Prove an active-shell amplitude gain strong enough to supply the missing scale factor in the nu SCF Carleson sum.


