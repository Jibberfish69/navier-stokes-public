    text: |+
      \subsection{Direct active- Carleson via monotone/source-dominance - failed discharge}

      Such a dominance theorem would turn the shell equation into a no-pulse law and then imply active- Carleson.

      The monotone flux law surface shows the scalar obstruction: for any short interval, a source can balance a chosen active pulse. So the shell identity and damping do not imply monotonicity. The proof must use nonlinear Navier-Stokes flux structure.

      The available dyadic exchange cancellation is unweighted. Once one-sided shell weights are inserted, the remaining weighted defect has variable sign and lacks a strain-sign cancellation theorem. Taking absolute values produces the positive active- burden again.

      Original Smooth Data -> nonlinear shell-flux/source control ruling out source-balanced active pulses.

      More sharply, the next exact theorem is a monotone/source-dominance or strain-sign cancellation theorem for the nonlinear shell flux.


