      Summing this over active terminal shells would give the scale-normalized upper control needed for the final Jump avg charge.

      \[
      E_j'(t)+c\nu2^{2j}E_j(t)\le F_j(t),
      \qquad
      D_j(t)=2^{2j}E_j(t).
      \]

      \[
      2^{-j}D_j(t)^2=2^{3j}E_j(t)^2.
      \]

      Original Smooth Data supplies smoothness on compact preterminal intervals plus finite raw energy and finite dissipation. These facts control fixed shells before the endpoint. The theorem target controls moving active shells whose frequency can drift upward as the terminal time is approached.

      A nonlinear source may balance damping on short active windows. Such source-balanced pulses can keep raw energy and raw dissipation finite while defeating the scale-normalized estimate.

      Equivalent live atoms are direct active- Carleson control, terminal amplitude decay, nonlinear shell-flux/source control ruling out source-balanced active pulses, or a monotone-dominance law whose dissipation controls normalized nu SCF density.


