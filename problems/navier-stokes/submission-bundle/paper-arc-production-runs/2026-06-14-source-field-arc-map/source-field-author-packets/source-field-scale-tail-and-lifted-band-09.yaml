      \subsection{Heat Scale Square Source.A direct attempt}

      Failed from current inputs. The estimate is equivalent to active-shell source normalization on selected terminal windows.

      \[
      \int_I |F_j(t)|^2dt
      \le c\varepsilon\nu^3 2^{3j}|I|+C\nu^2 2^j2^{-2\delta j}.
      \]

      This estimate would give L s 2 temporal source control after parabolic normalization and so Uniform Temporal Source Integrability.A.

      \[
      |F_j(t)|^2
      \le c\varepsilon\nu^3 2^{3j}+C\nu^2 2^j2^{-2\delta j}|I|^{-1},
      \]

      The source F j is trilinear in Littlewood-Paley pieces. On a fixed smooth finite-mode shell profile, amplitude scaling by A makes

      \[
      F_j\sfcomp{18986} A^3,
      \qquad |F_j|^2\sfcomp{18987} A^6.
      \]

      Original smooth data controls the solution through data-dependent energy and preterminal smoothness. The selected terminal active shells require a scale-normalized bound uniform along moving high-frequency windows. The current records lack that normalization.

      Cauchy/Young estimates bound the source by active- envelopes. Those envelopes are exactly the quantities controlled by Scale Critical Tree Carleson.A / Local Positive Source Carleson.A, the active source wall.


