    text: |+
      \subsection{Local Positive Source Carleson.A first reduction and obstruction audit}

      Direct theorem attempt. Result: failed as an unconditional proof from Original Smooth Data.

      Here F N is the bounded-overlap same-fluid terminal packet family selected by the source-pulse branch.

      \[
      \sum_{P\in\mathcal F_N}\int_{Q(P)}[\mathcal N_{cut/off}^{loc}]_+
      \le o_N(1)+\text{summable legal losses}.
      \]

      The term N ps loc contains the selected positive stretching / pressure-strain source on terminal heat-scale windows. Calderon-Zygmund pressure recovery controls size, while it supplies no sign depletion for the localized positive part. Global skew cancellation applies to signed unlocalized exchange. The target has localization, terminal selection, weights, and positive-part extraction, so the global signed cancellation cannot discharge this term.

      Local Positive Source Carleson.A is not discharged by this direct route. The
      remaining obstruction is the localized, terminally selected, positively
      weighted source carrier after signed cancellation has been lost.


