    \[
    |\mathcal B_{3,N}(t)|
    \le
    C\eta_N(t)\mathcal B_{2,N}(t)
    +C S_N(t)\mathcal B_{2,N}(t),
    \]
    where \(\eta_N\) is a high-frequency tail size and \(S_N\) is a selected
    active-tree low/intermediate strain or source coefficient.

    The high-tail factor can be made small.  The coefficient \(S_N\) is not
    controlled from Original Smooth Data uniformly on terminal shrinking windows.
    Even boundedness of the normal-form correction requires a terminal
    source-coherence input unless the low/intermediate coefficient is kept as part
