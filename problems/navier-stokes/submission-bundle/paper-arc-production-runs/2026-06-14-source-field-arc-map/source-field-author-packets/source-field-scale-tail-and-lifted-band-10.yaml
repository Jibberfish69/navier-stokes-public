      \subsection{Scale-normalized Carleson Upper Estimate for the SCF Charge}

      The estimate must match the Jump avg lower side.  That lower side is
      scale-normalized: on a bad terminal same-fluid cylinder
      \(Q_r^\Phi\), the packet reads
      \[
        \mathrm{SCF}_{\mathrm{base}}(Q_r^\Phi)>\varepsilon_m .
      \]

      The raw analytic carrier \(\nu_{\mathrm{SCF}}\) is already finite on
      bounded-overlap terminal window families.  The missing upgrade is stronger: it
      has to control the scale-normalized density of that same carrier across
      shrinking terminal windows.

      Schematically, the needed estimate has the form
      \[
        \sum_i r_i^{-\gamma}\,\nu_{\mathrm{SCF}}(Q_i)\le C,
        \qquad \gamma>0,
      \]
      for the exponent dictated by the chosen scale-critical SCF normalization.
      Finite raw mass alone gives no bound for this weighted sum over arbitrarily
      shrinking terminal windows.

      The existing active- and flux-source surfaces confirm the same obstruction:
      source-mass control by itself does not imply active-Carleson control.  A
      \(\rho\)-source theorem, active-shell amplitude gain, or direct
      active-Carleson estimate is required.

      The scale-normalized Carleson upper estimate remains open.  The raw
      \(\nu_{\mathrm{SCF}}\) carrier is installed; its scale-normalized Carleson
      upgrade is missing.


