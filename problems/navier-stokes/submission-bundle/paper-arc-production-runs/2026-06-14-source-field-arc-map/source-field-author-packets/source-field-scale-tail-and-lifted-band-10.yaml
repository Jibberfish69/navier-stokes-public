    \[
    \mathfrak A_{N,Q}\in L^\infty(0,T_*),
    \]



    \subsection{Terminal-tail Production from the Original Dynamics}

    This is the production theorem that the manuscript still has to pay in the
    main proof.  Starting from original smooth, divergence-free, zero-mean periodic
    data, the theorem must produce a uniform retained terminal tail with Pack, Part,
    Field, and finite tower control.

    Let \(T_*<\infty\) be a first candidate finite classical endpoint for the
    maximal periodic solution.  On every compact retained classical subinterval
    before \(T_*\), the existing route supplies retained-window hypotheses and the
    accepted endpoint certificate maps.  The missing passage is uniform in the
    terminal approach: the compact readouts must survive on endpoint-adjacent
    same-fluid tails without spending the desired endpoint conclusion as an input.



    \subsection{Terminal-tail Uniformization after the Inputs Are Supplied}

    \[
    Dead \vee packing\text{-}detached \vee tower\text{-}blown \vee Jump
    \]

    \[
    CM_{N,r,Q}(u,p,\Phi)=Pack_Q(u,\Phi)\wedge Part_{N,Q}(u,p)\wedge Field_{N,r,Q}(u,p).
    \]

    \[
    \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty,\qquad s>5/2.
    \]

    \[
    \Gamma_{pack,Q},\quad \mathfrak A_{M,Q},\quad \mathfrak P_{M,Q},\quad \mathfrak C_{M,r,Q}
    \in L^\infty(I_*).
    \]

    Once those finite terminal-tail records have been supplied, the persistence
    argument is formal.  Pack controls the retained carrier geometry, Part keeps
    the finite witness row present, Field supplies a positive local scale, and the
    tower records prevent finite-depth amplification from escaping the argument.

    The endpoint alternatives name the four ways the retained terminal tail can
    fail.  `Dead' is participation failure.  `Packing-detached' is loss of the
    retained Pack carrier.  `Tower-blown' is loss of the finite tower bound.
    `Jump' is incompatible surviving trace data.  The source files supply the
    grammar and the persistence theorem under finite records.  The direct PDE
    propagation theorem from original smooth data to the terminal endpoint remains
    the production burden.

    \[
    \Gamma_{pack,Q}(t)=\sup_{a\in A_Q(t)}\max\{|F(a,t)|,|F(a,t)^{-1}|\}.
    \]

    A terminal-tail exclusion needs an integrable Lipschitz or pack-native strain
    substitute up to \(T_*\).  The deformation equations
    \[
    \partial_tF=(\nabla u)F,
    \qquad
    \partial_tF^{-1}=-F^{-1}\nabla u
    \]
    show why volume preservation is not enough: incompressibility fixes
    \(\det F=1\), while \(\Gamma_{pack,Q}\) records stretching and inverse
    stretching.  The route still lacks a noncircular derivation of this terminal
    strain integral from original smooth data.

    This package closes after the analytic terminal-tail inputs are supplied.  Using
    the package itself to supply those inputs would be circular.

    The missing step is the uniform terminal-tail readout from original smooth data
    to a bounded \(H^s\) continuation norm.

    The ordered attempt closes the formal endpoint vocabulary and validates the
    conditional packaging.  The analytic barrier remains terminal-tail admission
    from original dynamics without using the endpoint theorem as an upstream
    supplier.



    \subsection{Periodic Endpoint Conversion from Shell-tail Suppression}

    This subsection records the conversion step on the exact periodic,
    zero-force branch.  It explains how repaired shell/tail suppression becomes an
    endpoint-control input for the class-membership route.

    Let \(u\) be a smooth periodic solution of the three-dimensional incompressible
    Navier--Stokes equations with \(f=0\) on \(\mathbb T^3\) over a finite
    classical interval \(I=[t_0,T]\).  Let \(s>5/2\) be a continuation index.

    \[
    u=P_{<N}u+P_{\ge N}u.
    \]

    \[
    \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho,
    \]

    \[
    E_N(t)=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_2^2,
    \qquad
    D_N(t)=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
    \]

    \[
    \sup_{t\in I}\|P_{\ge N}u(t)\|_{\dot H^1}^2
    =
    \sup_{t\in I}E_N(t)
    \le \rho.
    \]

    \[
    \int_I\|P_{\ge N}u(t)\|_{\dot H^2}^2dt
    =
    \int_I D_N(t)dt
    \le \rho.
    \]

    The low-frequency component \(P_{<N}u\) lies in a finite-dimensional subspace.
    On a classical interval every Fourier coefficient is smooth, so for each fixed
    \(N\) the low part has a finite \(H^s\) norm on \(I\).  The high tail is
    controlled by the two displayed bounds: it is small in \(L^\infty_t\dot H^1_x\)
    and has integrated \(\dot H^2_x\) control.

    The full solution has now been decomposed into a finite-dimensional smooth low
    part and a budget-controlled high tail.  This is the endpoint input consumed by
    the class-membership route.  The dangerous infinite-dimensional cascade can only
    live in the high tail, and the shell/tail suppression estimate keeps that tail
    inside the assigned budget.

    This is a periodic conversion theorem.  It does not export the result to
    \(\mathbb R^3\), and it does not by itself produce the terminal tail from
    original data.


