    \[
    \frac{d}{dt}\mathcal B_{2,N}(t)
    +c_0\sum_{j\ge N}2^{-j}D_j(t)^2
    \le
    \mathcal C_{3,N}(t)+\mathcal L_N(t).
    \]

    The quadratic Bellman produces the desired active density
    \[
    \sum_{j\ge N}2^{-j}D_j(t)^2.
    \]
