      \subsection{Part Row Closedness from Field Scale and Tower Control}

      This row is a conditional closedness statement for the Part witness.  It says
      that participation survives on the retained terminal tail once two inputs are
      already present: a positive Field scale and a bounded finite tower through the
      next depth.

      \[
      Field_{N,r,Q}\quad\hbox{with}\quad r(t)\ge r_*>0
      \]

      \[
      \mathfrak A_{N+1,Q}(t)\le M_A,
      \qquad 0<t<T_*.
      \]

      Under these two inputs, the exact membership witness for \(Part_{N,Q}\) is a
      finite object.  It is built from finitely many same-fluid labels, finitely many
      jet-to-difference comparisons, and finitely many neighboring-response
      predicates through depth \(N\).

      The positive Field scale keeps all witness comparisons on cylinders with radius
      bounded below by \(r_*\).  The tower bound through depth \(N+1\) controls the
      velocity, pressure readouts, spatial increments, and finite-difference data
      entering the witness.  Only finite depth and finitely many witness predicates
      are involved, so the witness quantities form an equibounded and equicontinuous
      family on the retained terminal cover.

      Compactness gives a terminal limit for each witness quantity after restricting
      to a late retained subtail.  The participation predicates are closed finite
      predicates under these limits: same-fluid label incidence,
      jet-to-difference compatibility, and neighboring-response positivity persist
      in the limit.  The terminal witness still satisfies
      \[
      Part_{N,Q}.
      \]

      The proof spends Field and tower controls as inputs.  It does not supply the
      Field row, the tower bound, or the Pack row.  Its value is narrower and useful:
      once the terminal carrier and finite readout are already retained, Part does
      not disappear by a new closedness defect.


