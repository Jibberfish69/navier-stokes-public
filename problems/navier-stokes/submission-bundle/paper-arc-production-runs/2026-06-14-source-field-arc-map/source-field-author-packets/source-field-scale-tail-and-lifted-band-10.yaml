    A formal parabolic normal form attempts to cancel \(\mathcal C_{3,N}\).  In
    Fourier variables, define a trilinear correction of the form

    \[
    \mathcal B_{3,N}(t)
    :=
    \sum_{\alpha=(j_1,j_2,j_3)}
    \int m_\alpha(\xi_1,\xi_2,\xi_3)
    \widehat u_{j_1}(\xi_1)
    \widehat u_{j_2}(\xi_2)
    \widehat u_{j_3}(\xi_3)
    \,\delta(\xi_1+\xi_2+\xi_3)\,d\xi,
    \]

