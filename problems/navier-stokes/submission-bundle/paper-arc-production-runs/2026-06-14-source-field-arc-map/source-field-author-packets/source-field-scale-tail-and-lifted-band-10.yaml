    text: |+
      \subsection{Periodic Endpoint Conversion from Shell-tail Suppression}

      This subsection records the conversion step on the exact periodic,
      zero-force branch.  It explains how repaired shell/tail suppression becomes an
      endpoint-control input for the class-membership route.

      Let \(u\) be a smooth periodic solution of the three-dimensional incompressible
      Navier--Stokes equations with \(f=0\) on \(\mathbb T^3\) over a finite
      classical interval \(I=[t_0,T]\).  Let \(s>5/2\) be a continuation index.

      \[
      u=P_{<N}u+P_{\ge N}u.
      \]

      \[
      \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho,
      \]

      \[
      E_N(t)=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_2^2,
      \qquad
      D_N(t)=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
      \]

      \[
      \sup_{t\in I}\|P_{\ge N}u(t)\|_{\dot H^1}^2
      =
      \sup_{t\in I}E_N(t)
      \le \rho.
      \]

      \[
      \int_I\|P_{\ge N}u(t)\|_{\dot H^2}^2dt
      =
      \int_I D_N(t)dt
      \le \rho.
      \]

      The low-frequency component \(P_{<N}u\) lies in a finite-dimensional subspace.
      On a classical interval every Fourier coefficient is smooth, so for each fixed
      \(N\) the low part has a finite \(H^s\) norm on \(I\).  The high tail is
      controlled by the two displayed bounds: it is small in \(L^\infty_t\dot H^1_x\)
      and has integrated \(\dot H^2_x\) control.

      The full solution has now been decomposed into a finite-dimensional smooth low
      part and a budget-controlled high tail.  This is the endpoint input consumed by
      the class-membership route.  The dangerous infinite-dimensional cascade can only
      live in the high tail, and the shell/tail suppression estimate keeps that tail
      inside the assigned budget.

      This is a periodic conversion theorem.  It does not export the result to
      \(\mathbb R^3\), and it does not by itself produce the terminal tail from
      original data.


