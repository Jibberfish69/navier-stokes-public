      current CM-exit live edge.

      The readout chain may support endpoint compatibility, but it is not the
      governing primitive \(Exit(Q):=\neg Member(Q)\).

      The proof uses the averaged production branch and keeps pointwise readout terminal.

      \[
      Dead,
      \qquad
      packing\text{-}detached,
      \qquad
      tower\text{-}blown,
      \qquad
      Jump
      \]

      \[
      \mathrm{Jump}_{\mathrm{avg}}
      \quad\vee\quad
      \neg \mathrm{Jump}_{\mathrm{avg}}.
