      \subsection{Pressure-Tail Convergence from Exterior Tightness and Local Sobolev Bounds}

      This is the pressure-tail step in the whole-space exhaustion argument.  Assume
      the sequence has exterior energy tightness,

      \[
      \lim_{R\to\infty}\sup_n\sup_{t\le T}\int_{|x|>R}|u_n(x,t)|^2dx=0,
      \]

      and uniform local \(H^s\) bounds for some \(s>5/2\) on every fixed ball.  After
      passing to a subsequence,

      \[
      u_n\to u
      \]

      locally smoothly.  Choose the additive time normalizations of the pressures so
      that the pressure gradients are compared.  The claim is

      \[
      \nabla p_n\to \nabla p,
      \qquad
      p=\mathcal R_i\mathcal R_j(u_i u_j),
      \]

      locally on every compact subset of \(\mathbb R^3\times[0,T]\).

      Fix \(K\Subset B_R\Subset B_{2R}\), and choose a cutoff \(\chi_R\) supported in
      \(B_{2R}\) and equal to one on \(B_R\).  Split the pressure into the local
      Poisson part and the harmonic tail:

      \[
      p_n=p_{n,R}^{loc}+h_{n,R},
      \qquad
      -\Delta p_{n,R}^{loc}=\partial_i\partial_j(\chi_R u_{n,i}u_{n,j}).
      \]

      Local smooth convergence gives, in every local \(C^k\) norm,

      \[
      \chi_R u_{n,i}u_{n,j}\to \chi_R u_i u_j
      \]

      on \(B_{2R}\).  Interior Calderon--Zygmund/Schauder estimates then give
      convergence of \(\nabla p_{n,R}^{loc}\) on \(K\).

      The harmonic tail is generated by the far source
      \((1-\chi_R)u_n\otimes u_n\).  For \(x\in K\) and \(|y|>R\), the far pressure
      kernel obeys

      \[
      |\nabla_x^{k+1}K(x-y)|
      \le
      C_{K,k}R^{-4-k}.
      \]

      Hence

      \[
      \|\nabla^{k+1}h_{n,R}\|_{L^\infty(K)}
      \le
      C_{K,k}R^{-4-k}
      \int_{|y|>R}|u_n(y,t)|^2dy.
      \]

      Exterior tightness makes this bound uniformly small as \(R\to\infty\).  The
      same argument controls the limiting whole-space far tail.  This proves local
      convergence of the full pressure gradients.

      This theorem upgrades the earlier pressure-tail statement under the explicit exhaustion hypotheses: exterior energy tightness and uniform local regularity.


