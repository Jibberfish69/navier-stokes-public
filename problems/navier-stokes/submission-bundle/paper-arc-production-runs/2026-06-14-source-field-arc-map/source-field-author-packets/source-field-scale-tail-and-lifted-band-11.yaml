    \]

    locally on every compact subset of \(\mathbb R^3\times[0,T]\).

    Fix \(K\Subset B_R\Subset B_{2R}\), and choose a cutoff \(\chi_R\) supported in
    \(B_{2R}\) and equal to one on \(B_R\).  Split the pressure into the local
    Poisson part and the harmonic tail:

    \[
