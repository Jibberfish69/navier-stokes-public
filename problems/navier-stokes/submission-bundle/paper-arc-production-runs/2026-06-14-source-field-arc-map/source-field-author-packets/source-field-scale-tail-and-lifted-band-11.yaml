      \subsection{Periodic Shell-tail Suppression from the Repaired Gradient Commutator}

      Let \(u\) be a smooth periodic solution on a finite classical interval
      \(I=[t_0,t_1]\), and let \(\Delta_j\) be a periodic Littlewood--Paley
      decomposition.  Define

      \[
      E_N(t):=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_2^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
      \]

      \[
      \widetilde\Lambda_N^\sharp(t):=\Lambda_N(t)+\Theta_N^\sharp(t)
      \]

      The repaired gradient-commutator estimate gives

      \[
      \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
      \le
      C_{\eta,M,\nu}\widetilde\Lambda_N^\sharp(t)E_N(t)+C_*2^{-2\delta N}.
      \]

      For fixed \(N\), the coefficient \(\widetilde\Lambda_N^\sharp\) is built from
      low and collar components of a smooth solution.  On every classical interval,

      \[
      \widetilde\Lambda_N^\sharp\in L^1(I).
      \]

      Choose \(N\) so that the initial high tail and the reserve
      \(C_*2^{-2\delta N}\) are below the assigned budget.  Subdivide \(I\) into
      finitely many cells on which the \(L^1\) mass of
      \(\widetilde\Lambda_N^\sharp\) is small enough for Gronwall absorption.  On
      each cell the differential inequality propagates the tail budget.  Summing the
      finite partition gives

      \[
      \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho.
      \]

