      \subsection{Source Pulse Exclusion.A direct heat-scale nonlinear source-pulse exclusion}

      \[
      E_j'(t)+c\nu D_j(t)\le F_j(t),
      \]

      where F j is the nonlinear shell flux/source. A no-pulse theorem must rule out heat-scale windows on which F j balances viscous drain and maintains a terminal active packet.

      Original Smooth Data gives finite energy, local energy, pressure Poisson structure, dyadic exchange cancellation before terminal selection, and smoothness on compact preterminal intervals.

      These inputs do not supply terminal heat-scale source normalization. A short active pulse can carry order-one normalized source/mixed mass while remaining compatible with first-moment dissipation. Preterminal smoothness gives finite data-dependent amplitudes before the endpoint; it does not give uniform terminal scale-normalized decay as shells drift upward and times approach T *.

      The signed weighted lifted-remainder branch fails without a new eigendirection decorrelation or signed-defect theorem. After absolute values it returns to the active- residual-tail branch.

      The active- / Scale Critical Tree Carleson branch fails without a -source estimate, active-shell amplitude gain, or localized positive pre-Cauchy source Carleson estimate. These are route-equivalent to the source-pulse theorem.

      The compact/rigidify route extracts local suitable ancient source-residue objects only after localization. It lacks a rigid ancient class and a source-residue Liouville theorem.


