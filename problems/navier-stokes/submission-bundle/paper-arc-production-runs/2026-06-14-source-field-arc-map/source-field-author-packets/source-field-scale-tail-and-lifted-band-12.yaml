    text: |+
      \subsection{Signed weighted lifted-remainder cancellation plus residual-tail control - failed discharge}

      Current surfaces do not provide the needed strain-sign cancellation. The principal lifted remainder has variable sign and can align with expanding strain directions, so one-sided shell weights alone do not enforce cancellation.

      If absolute values are inserted, the route collapses to a positive carrier whose Young inequality output contains an active- tail burden plus a residual first-moment tail. The installed full tail- reserve controls cumulative tail energy, while the active- residual requires shellwise -dissipation control.

      The residual-tail control needed here is as strong as active- upper-tail Carleson or one of its equivalent source-normalized forms.

      Current exchange algebra, energy, and tail- reserve surfaces do not provide either input.

      The source-control route still reduces to direct active- Carleson via a monotone/source-dominance theorem, or to a new cancellation theorem for the lifted signed remainder plus an active- residual estimate.


