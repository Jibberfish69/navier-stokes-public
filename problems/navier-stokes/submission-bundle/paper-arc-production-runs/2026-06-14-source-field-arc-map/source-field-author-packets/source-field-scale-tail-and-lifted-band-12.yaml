    text: |+
      \subsection{SCFBase Label/Scale Modulus Test}

      Assume Pack.TTU, so same-fluid cylinder geometry has bounded distortion. Suppose there are positive constants a, r, a finite label-scale net

      \[
      \{(a_j,r_j)\}_{j=1}^{J},
      \]

      \[
      d(a,a_j)\le\delta_a,
      \qquad
      |\log r-\log r_j|\le\delta_r,
      \]

      \[
      \int_{t_0}^{T_*}\Omega(t)\,dt<\infty.
      \]

      \[
      ATD_m^\varepsilon.
      \]

      Original smooth data gives continuity on compact subintervals. Pack.TTU makes moving cylinders geometrically comparable. These inputs do not supply an integrable terminal label-scale modulus for SCF base.

      The missing estimate is exactly a terminal control on variation of the scale-critical velocity-pressure packet across labels and scales.

      A bad SCF packet can move through fresh labels and smaller scales near T *. Each fixed finite representative can remain good while the supremum over labels/scales sees bad packets at later times.

      The integrable modulus above is precisely the condition preventing this behavior.


