      \subsection{Scale Normalized Parent Inverse.A / donor reserve from Original Smooth Data}

      The desired statement charges diffuse positive parentage by a finite scale-normalized donor reserve. In parent-measure form, broad legal parent diffusion should satisfy

      \[
      \pi_P(\mathsf{Pred}(P)\setminus\mathcal C(P))
      \le
      Charge_P+Reserve_P+o(1),
      \]

      Finite dyadic banding bounds shell type. It leaves physical packet multiplicity and triadic phase multiplicity open. A legal parent measure can spread as

      \[
      \pi_P\sfcomp{23468} M^{-1}\sum_{\alpha=1}^M\delta_{P^-_\alpha},
      \qquad M\to\infty.
      \]

      Raw orthogonality has the wrong scale. Donor amplitudes can spread across many legal predecessors with raw quadratic cost tending to zero while normalized child-feeding source mass remains order one.

      Same-fluid transport preserves legal labels after parent selection. It gives no inverse theorem selecting a bounded parent set and gives no entropy charge for diffuse parentage.

      Pressure and cutoff routing allocate legal losses. They do not price legal interior parent diffusion.

      The donor-reserve branch so reaches the same source-control wall as the active- and local positive-source Carleson branches.

      Scale Normalized Parent Inverse.A remains open from current original-data inputs. A proof requires a new scale-critical donor reserve or tree-Carleson estimate for positive source-parent edges.


