    text: |+
      \subsection{Signed commutator plus residual-tail direct loop note}

      A successful proof would feed Positive Remainder Depletion.A and then Source Pulse Exclusion.A.

      Unweighted dyadic exchange cancellation holds before terminal weights, lifted reductions, cutoffs, and active-window positive-part selection. The live weighted lifted remainder has principal form

      \[
      R_{j,k,\ell}^{lift}\sfcomp{24383}
      2^{2j}\langle C_j(\nabla a_k,\Delta_j u),\Delta_j u\rangle.
      \]

      This term can be positive when the active packet aligns with an expanding strain eigendirection. One-sided shell weights orient the sum but do not impose eigendirection cancellation. Cutoffs and projectors localize legal terms but do not change the sign of the interior strain-production carrier.

      Thus signed cancellation needs a new theorem: active eigendirection decorrelation, signed measure cancellation for G N lift,sigma , or a structural nonpositive/divergence identity for the true weighted remainder. None is installed.

      Taking absolute values returns to the positive-carrier branch. The needed estimate is active- residual-tail / Scale Critical Tree Carleson.A. Shell-amplitude gain, -source control, or localized positive source Carleson would imply it.

      Raw energy and first-moment dissipation do not control shellwise dissipation on shrinking active windows. A source-balanced pulse can keep the active shell above threshold while remaining compatible with finite energy. Direct localized positive-source estimates preserve geometry but produce the same active- residual after Cauchy/Young.

      The exact next target is localized positive-strain/source depletion, i.e. a direct positive-part theorem for the active local source mass.

      Current signed commutator and residual-tail surfaces leave Source Pulse Exclusion.A open. The exact replacement target is localized positive-strain/source depletion: a direct positive-part theorem for the active local source mass.


