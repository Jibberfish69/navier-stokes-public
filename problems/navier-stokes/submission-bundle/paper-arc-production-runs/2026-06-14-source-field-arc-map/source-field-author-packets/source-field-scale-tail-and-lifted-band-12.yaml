      \[
      \int_I\sum_{j\ge\max(N,k+C_1)}2^{-j}D_j(t)^2dt
      \le \varepsilon\nu2^{2k}|I|+C2^{-2\delta\max(N,k)}.
      \]

      The direct active- estimate needs a heat-scale -source theorem for the selected shell source. Current original-data inputs give finite raw energy and dissipation, while the target prices scale-normalized mass on shrinking terminal active windows.

      The active-shell amplitude gain route would convert 2 -j D j 2 into an absorbable viscous term plus reserve. The implication is valid; the gain remains open.

