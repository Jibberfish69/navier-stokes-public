    text: |+
      \subsection{TPS High-Frequency Tail To Coarse-Flow Deviation Bridge}

      The point is that the selector-local TPS route does not need a separate ad hoc control mechanism for J. It already receives one from any route that supplies a time-integrable high-frequency tail for the velocity.

      For the current live route, this bridge is internal to the torus-first branch. Any whole-space analogue belongs to a later export theorem, not to the primary TPS chain.

      Fix a smooth periodic solution u of three-dimensional incompressible Navier--Stokes on [0,T J] T 3, and use the same symbol for its periodic lift to R 3. For one fixed frequency cutoff J, split

      \[
      u=u_{\le J}+u_{>J}.
      \]

      \[
      \partial_t X(a,t)=u(X(a,t),t),
      \qquad
      \partial_t X_{\le J}(a,t)=u_{\le J}(X_{\le J}(a,t),t),
      \qquad
      X(a,0)=X_{\le J}(a,0)=a.
      \]

      \[
      Y_J(a,t):=X(a,t)-X_{\le J}(a,t),
      \qquad
      \delta_J(t):=\operatorname*{ess\,sup}_{a\in G_J}|Y_J(a,t)|.
      \]

      \[
      L_{\le J}(t):=\|\nabla u_{\le J}(t)\|_{L_x^\infty},
      \qquad
      U_{>J}(t):=\|u_{>J}(t)\|_{L_x^\infty}.
      \]

      \[
      \frac{d}{dt}|Y_J(a,t)|
      \le
      L_{\le J}(t)\,|Y_J(a,t)|+U_{>J}(t).
      \]

      This is the first clean interface between the selector-local TPS route and the existing dyadic high-frequency route.


