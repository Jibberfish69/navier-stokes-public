      \subsection{Tail-Energy Spill Reduction Lemma}

      The spill packet is isolated on the exact Euclidean tail-energy surface used by the 4 -> 1 recertification argument.

      \[
      K_T:=\sup_{0\le t<T}\|\nabla u(t)\|_{L_x^2}<\infty,
      \]

      \[
      T_N(t):=\|P_{\ge N}u(t)\|_{L_x^2}^2,
      \qquad
      Q_N(t):=\|\nabla P_{\ge N}u(t)\|_{L_x^2}^2.
      \]

      The spill packet S N[u] is the portion of P N (u u) in which at least one dyadic index lies in the fixed threshold strip [N-M,N+M], after the strict low-mode packet and the genuine high-high packet have been removed.

      \[
      K_T:=\sup_{0\le t<T}\|\nabla u(t)\|_{L_x^2}<\infty.
      \]

      \[
      \big|\langle \mathcal S_N[u],\,P_{\ge N}u\rangle\big|
      \le
      C_M K_T\,2^{-N/2}\,Q_N(t)
      \le
      \frac{\eta\nu}{4}\,Q_N(t).
      \]

      In particular, the tail-energy spill packet is explicit on the local 4 -> 1 surface and is absorbed directly into the tail-energy dissipation for all sufficiently large cutoffs.

      \[
      P_{\ge N}u=\sum_{j\ge N}\Delta_j u,
      \]

      Because spill is a finite-band threshold packet, only finitely many index configurations occur. Up to symmetry, each spill contribution has the form

      On the local 4 -> 1 surface, the spill packet is no longer an unresolved threshold-strip coefficient problem. It is absorbed directly into the tail-energy dissipation once the exact-solution gradient bound is available.

      It does not by itself discharge the proposition-level spill reductions in Proposition 4.1. Those still need theorem-grade alignment on the scale-side bridge. The present note is narrower: it closes the spill packet only inside the exact-solution tail-energy recertification argument.


