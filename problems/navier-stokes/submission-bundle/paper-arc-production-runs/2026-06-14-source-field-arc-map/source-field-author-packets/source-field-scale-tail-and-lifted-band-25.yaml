      Q_N(t)=\|\nabla P_{\ge N}u(t)\|_{L_x^2}^2,
      \]

      and keeps the packet on the declared T N/Q N/ L N surface without introducing any L x continuation norm.

      \[
      T_N(t)=\|P_{\ge N}u(t)\|_{L_x^2}^2,
      \qquad
      Q_N(t)=\|\nabla P_{\ge N}u(t)\|_{L_x^2}^2,
      \]

      \[
      \mathcal L_N(t)
      :=
      1+\sum_{k\le N-4}2^{3k/2}\|\Delta_k u(t)\|_{L_x^2}.
      \]

      \[
      \big|\langle P_{\ge N}(T_u\nabla u + T_{\nabla u}u),\,P_{\ge N}u\rangle\big|
      \le
      C\,\mathcal L_N(t)\,T_N(t)
      +
      \frac{\eta\nu}{4}Q_N(t).
      \]

      \[
      P_{\ge N}=\sum_{j\ge N}\Delta_j,
      \]

      So the commutator does not close by a derivative-free shell bound. It closes on the same L N surface because the fixed dyadic gap converts the low coefficient derivative into an admissible factor, and the remaining high-shell derivative is absorbed into Q N by Young.

      A naive Young step can then upgrade the declared linear coefficient surface L N to L N 2 or to a derivative-weighted coefficient. So the commutator line still needs a coefficient-preserving absorption argument before this strict low-mode note can count as fully discharged on the local tail-energy surface.


