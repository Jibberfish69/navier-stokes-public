      \subsection{Active-Square Control Blocked By Square-Source Estimate}

      This subsection records the active-square upgrade that the current source stack
      would need in order to turn shell dissipation into a Carleson-type payment.  The
      desired estimate controls the square-time size of a shell dissipation density
      from a corresponding square-source theorem for the shell source \(F_j\).

      \[
      \int_I2^{-j}D_j(t)^2dt
      \le
      \varepsilon\nu2^{2j}|I|+C2^{-2\delta j}.
      \]

      \[
      E_j(t_0)^2
      \le
      c\varepsilon\nu^2 2^j|I|+C\nu2^{-j}2^{-2\delta j}.
      \]

      \[
      \int_I |F_j(t)|^2dt
      \le
      c\varepsilon\nu^3 2^{3j}|I|+C\nu^2 2^j2^{-2\delta j}.
      \]

      The attempted universal square-source estimate runs into fixed-shell cubic
      amplitude scaling.  That scaling is the stopping point of this source route.

      The surviving support role is clear.  Active-square control becomes proof
      material after one replacement is supplied: a valid square-source theorem for
      \(F_j\), a signed cancellation theorem for the shell flux, or a direct
      active-square Carleson theorem.  Until one of those replacements is written,
      this subsection marks the missing supplier theorem for the active-window
      branch.  The Pack, Part, or Field landing remains a later step.


