      \subsection{Absorbable Weighted Form Reserve Result}

      This subsection records a support calculation for the lifted-band route.  The
      candidate reserve has the form

      \[
      A_N(t):=\Lambda_N(t)+\Theta_N^\sharp(t).
      \]

      The desired absorption would spend this reserve against the shell dissipation in the next displayed inequality.

      \[
      A_N(t)E_N(t)\le \varepsilon\nu D_N(t)+C_\varepsilon R_N(t)
      \]

      The Bernstein-scale lower bound is

      \[
      D_N(t)\ge 2^{2N}E_N(t),
      \]

      It gives the remainder inequality

      \[
      \frac{A_N^2E_N^2}{D_N}\le 2^{-2N}A_N^2E_N.
      \]

      The unpaid remainder is

      \[
      R_N(t):=2^{-2N}A_N(t)^2E_N(t).
      \]

      The proof value of the calculation is the shape of this remainder.  The route
      has separate control on the reserve factor and the energy factor: the low-mode
      estimate gives an \(L^2_t\)-type bound for \(A_N\) at fixed \(N\), and the
      energy layer controls \(E_N\) on its own energy surface.  Those separate
      controls leave the product \(A_N^2E_N\) unpaid.

      The same issue appears after finite-collar reduction.  The precise obstruction is
      that a collar or tail theorem must control the product \(A_N^2E_N\) after the
      collar structure turns \(A_N\) into a finite-band expression.

      Thus this subsection is support for the high-frequency-gain route rather than
      HFG itself.  It identifies the exact reserve product that a later theorem must
      pay before the lifted-band material can become a member-side estimate or a
      Field-side obstruction.


