      \subsection{Compressible Heat Parent To Incompressible Tower Shadow}

      The tower language is support vocabulary for the classical incompressible
      Navier--Stokes equation.  The Clay target remains that equation on
      \(\mathbb R^3\).

      The parent model records what has been frozen or constrained before the
      incompressible tower begins.  In that model, density, pressure, heat, viscosity,
      and conduction all participate explicitly:

      \[
      \partial_t \rho + \nabla\cdot(\rho u)=0,
      \]

      \[
      \rho(\partial_t u + u\cdot\nabla u)
      =
      -\nabla p + \nabla\cdot\tau + \rho f,
      \]

      \[
      \rho c_v(T)(\partial_t T + u\cdot\nabla T)
      =
      -p\,\nabla\cdot u
      +
      \tau:\nabla u
      +
      \nabla\cdot(k(T)\nabla T)
      +
      Q,
      \]

      \[
      p=p(\rho,T),
      \qquad
      \tau
      =
      \mu(T)\Big(\nabla u+\nabla u^\top-\frac23(\nabla\cdot u)I\Big)
      +
      \lambda(T)(\nabla\cdot u)I.
      \]

      This display explains the source of the tower bookkeeping.  The temperature
      \(T\) changes the pressure through \(p(\rho,T)\), the viscosity through
      \(\mu(T)\) and \(\lambda(T)\), and the conduction through \(k(T)\).  The
      compression work \(-p\,\nabla\cdot u\) couples temperature to volume change,
      while the viscous heating term \(\tau:\nabla u\) couples deformation to
      temperature.

      \[
      D^{m,\alpha}:=\partial_t^m\partial_x^\alpha,
      \]

      Applying \(D^{m,\alpha}\) to the parent equations produces lower-order Leibniz
      terms when derivatives hit \(\rho\), \(T\), \(\mu(T)\), \(\lambda(T)\), \(k(T)\),
      and the lower jets.  Those terms are the parent source of the mixed-jet tower
      bookkeeping.

      After the low-Mach incompressible reduction, the large thermodynamic pressure
      pieces reorganize into the constraint pressure enforcing
      \[
      \nabla\cdot u=0.
      \]
      The present incompressible tower keeps the momentum-diffusion channel and freezes
      the explicit thermal dependence of the constitutive law.  The pressure in the
      current tower is the constraint-shadow of the larger
      pressure/volume/temperature coupling, and the current \(J_{m,\alpha}\) jet is
      the frozen-coefficient shadow of the parent viscous law.


