      \subsection{Cycle-Exact Angular Observability Packet}

      This is the angular consumer form of the exact-potential branch.  It starts
      after the upstream witness-to-readout splice has installed the transported good
      family, and it tells the reader which angular ledger that branch consumes.

      The branch has already reduced this part of the problem to one geometric
      question: convert signless observed pair-defect data into control of an angular
      directional ledger on that transported family.  The lawful order is
      \[
      \begin{gathered}
      \text{exact-potential witness input}
      \Longrightarrow \text{exact-potential witness-to-readout family}\\
      \Longrightarrow \text{angular/readout consumer packet}.
      \end{gathered}
      \]

      In that order, the transport-coherence input belongs downstream of the same
      witness-to-readout family.  The alignment input is the geometric content: the
      branch has to explain why the transported pair direction is close to the
      expanding direction selected by the strain packet.

      \[
      S_J(t,x)
      :=
      \frac{\nabla u_{\le J}(t,x)+\nabla u_{\le J}(t,x)^\top}{2}
