      \subsection{Coherent-Laplacian Zero-Mode Obstruction Lemma}

      The relevant distinction is between a carrier that merely persists and a carrier
      that can produce a scale-resolved selector family.  The pure zero-mode carrier gives
      persistence.  The localized coherent-window carrier gives the scale structure
      needed for selector export.

      \[
      \mathbb H_D(j)=\mathbf 1_{[0,2^j]}(D_{\mathrm{coh}}).
      \]

      \[
      (I+\mathcal L_{\mathrm{coh}})^{1/2}.
      \]

      \[
      \mathcal L_{\mathrm{coh}}
      :=
      \mathbb H_D \mathbb P_D \Delta_D \mathbb P_D \mathbb H_D|_{K_D}.
      \]

      \[
      K_D
      =
      \ker(\Delta_D)\cap \ker(\delta_D)\cap \mathfrak X_D.
      \]

      On the pure zero-mode carrier \(K_D\), the induced coherent Laplacian has a
      single spectral value.  The spectral family of
      \((I+\mathcal L_{\mathrm{coh}})^{1/2}\) is zero below that value and the identity
      at or above it.  This single-jump spectrum gives the zero-mode route only a
      collapsed thresholded family.

      The localized spectral-window route replaces \(K_D\) by a nested family
      \(K_D(j)\) of coherent spectral windows.  On that carrier,
      \(\mathcal L_{\mathrm{coh}}\) has scale content, and the thresholded family can
      be realized as the spectral family of
      \((I+\mathcal L_{\mathrm{coh}})^{1/2}\).

      This is the carrier-choice obstruction.  The stronger coherent-Laplacian
      identification theorem needs the localized spectral-window upgrade before it can
      support selector export.


