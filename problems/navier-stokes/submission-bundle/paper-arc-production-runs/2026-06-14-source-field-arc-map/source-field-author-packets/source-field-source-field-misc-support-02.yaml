      \subsection{Curvature-To-Euclidean Pullback Target}

      The remaining mathematical burden in the source-faithful fourth bridge is the
      Euclidean pullback.  The original corpus contains proposition-grade curvature
      statements of the following shape:

      \[
      \partial_t u + \nabla_u u = -\mathrm{grad}_g(p) + \nu \Delta_g u
      \]

      \[
      \partial_t |\nabla u|^2
      =
      - \mathrm{Ric}(g)(\nabla u,\nabla u)
      + \nu \Delta_g |\nabla u|^2
      + C |\nabla u|^3
      \]

      \[
      \sup_{t\ge0}\|\nabla u(t)\|_{L^2(M)}<\infty.
      \]

      \[
      \partial_t |\nabla u|^2
      \le
      - \mathrm{Ric}(g)(\nabla u,\nabla u)
      + C |\nabla u|^3
      \]

      \[
      |\nabla u|^2 \le C_1 e^{-\kappa t} + C_2
      \qquad (t\ge0)
      \]

      The live target is the pullback statement.  The curvature-based fourth bridge
      must be transferred from the source-faithful carrier with positive Ricci lower
      bound to the declared classical Euclidean Navier--Stokes surface while
      preserving the declared data, the continuation surface, and the proof branch.

      This block is a precise support target.  The required statement is that the
      curvature gradient control survives the pullback as a theorem-bearing
      continuation statement on the same Euclidean surface used by the manuscript.


