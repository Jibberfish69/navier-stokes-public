      \subsection{Mediating Object: Curvature-Based Gradient Bridge Discharge}

      The original source-family fourth bridge is kept here as a precise provenance
      object.  The older curvature route stays visible, while its Euclidean theorem
      status stays separate.

      The curvature route controls the geometric gradient energy

      \[
      \Gamma_g[u](t) := \|\nabla u(t)\|_{L^2(M,g)}^2
      \]

      \[
      \partial_t |\nabla u|^2
      =
      - \mathrm{Ric}(g)(\nabla u,\nabla u)
      + \nu \Delta_g |\nabla u|^2
      + C |\nabla u|^3.
      \]

      On the curvature branch, the transfer mechanism is the Ricci-damped evolution
      itself.  Its role comes from the geometric gradient law, while the later
      Euclidean package uses dyadic coercivity and scale barriers.  This provenance
      object pays the fourth bridge inside the curvature loop.  The next subsection
      names the pullback target that would turn it into Euclidean support.


