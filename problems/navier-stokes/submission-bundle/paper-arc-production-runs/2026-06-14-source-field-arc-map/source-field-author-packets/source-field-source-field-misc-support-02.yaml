    and the lower jets.  Those terms are the parent source of the mixed-jet tower
    bookkeeping.

    After the low-Mach incompressible reduction, the large thermodynamic pressure
    pieces reorganize into the constraint pressure enforcing
    \[
    \nabla\cdot u=0.
    \]
    The present incompressible tower keeps the momentum-diffusion channel and freezes
    the explicit thermal dependence of the constitutive law.  The pressure in the
    current tower is the constraint-shadow of the larger
    pressure/volume/temperature coupling, and the current \(J_{m,\alpha}\) jet is
    the frozen-coefficient shadow of the parent viscous law.



    \subsection{Cross-Rung Matrix Under YM Heat Shadow Bridge}

    The matrix structure behind the mixed-jet tower is the object here.  Let
    \(A=(m,\alpha)\) and \(B=(n,\gamma)\), and let \(J_A,J_B\) denote the
    corresponding mixed jets.  The classical cross-rung energy entry is
    \[
    K_{A,B}(t):=\langle J_A(t),J_B(t)\rangle_{L^2_x},
    \]

    \[
    \frac{d}{dt}K_{A,B}
    +
    2\nu\langle \nabla J_A,\nabla J_B\rangle
    =
    -\langle \widetilde T_A,J_B\rangle
    -\langle J_A,\widetilde T_B\rangle.
    \]

    The carrier heat law has the model form
    \[
    \partial_t X + \mathbb P_A N_A(X)=\nu\,\mathbb P_A\Delta_A X.
    \]

    On the carrier side, the matching matrix entry is
    \[
    \mathsf X_A:=\mathsf X_{m,\alpha},
    \qquad
    \mathsf X_B:=\mathsf X_{n,\gamma},
    \]

    \[
    \mathsf K_{A,B}(t):=
    \langle \mathsf X_A(t),\mathsf X_B(t)\rangle_{\mathcal H_A}.
    \]

    \(\mathsf U_A\) denotes the skew transport piece on the physical sector,
    \(\mathsf T_A\) denotes the off-diagonal carrier interaction spread, and
    \(\mathsf E_A^{\mathrm{comm}}\) denotes the differentiated
    operator-commutator defect.

    The matrix damping is the visible shadow of the carrier heat law.  The theorem
    burden shifts from estimating visible mixed packets one by one to killing or
    absorbing the matrix shadow defect that remains after the carrier damping is
    projected onto the classical tower.

    The diagonal energies are recovered by setting \(A=B\).  The off-diagonal
    entries record the cross-rung face of the same damping law.  They are support
    structure for the tower argument, with diagonal damping and off-diagonal coupling
    visible at the same time.



    \subsection{Mediating Object: Curvature-Based Gradient Bridge Discharge}

    The original source-family fourth bridge is kept here as a precise provenance
    object.  The older curvature route stays visible, while its Euclidean theorem
    status stays separate.

    The curvature route controls the geometric gradient energy

    \[
    \Gamma_g[u](t) := \|\nabla u(t)\|_{L^2(M,g)}^2
    \]

    \[
    \partial_t |\nabla u|^2
    =
    - \mathrm{Ric}(g)(\nabla u,\nabla u)
    + \nu \Delta_g |\nabla u|^2
    + C |\nabla u|^3.
    \]

    On the curvature branch, the transfer mechanism is the Ricci-damped evolution
    itself.  Its role comes from the geometric gradient law, while the later
    Euclidean package uses dyadic coercivity and scale barriers.  This provenance
    object pays the fourth bridge inside the curvature loop.  The next subsection
    names the pullback target that would turn it into Euclidean support.



    \subsection{Curvature-To-Euclidean Pullback Target}

    The remaining mathematical burden in the source-faithful fourth bridge is the
    Euclidean pullback.  The original corpus contains proposition-grade curvature
    statements of the following shape:

    \[
    \partial_t u + \nabla_u u = -\mathrm{grad}_g(p) + \nu \Delta_g u
    \]

    \[
    \partial_t |\nabla u|^2
    =
    - \mathrm{Ric}(g)(\nabla u,\nabla u)
    + \nu \Delta_g |\nabla u|^2
    + C |\nabla u|^3
    \]

    \[
    \sup_{t\ge0}\|\nabla u(t)\|_{L^2(M)}<\infty.
    \]

    \[
    \partial_t |\nabla u|^2
    \le
    - \mathrm{Ric}(g)(\nabla u,\nabla u)
    + C |\nabla u|^3
    \]

    \[
    |\nabla u|^2 \le C_1 e^{-\kappa t} + C_2
    \qquad (t\ge0)
    \]

    The live target is the pullback statement.  The curvature-based fourth bridge
    must be transferred from the source-faithful carrier with positive Ricci lower
    bound to the declared classical Euclidean Navier--Stokes surface while
    preserving the declared data, the continuation surface, and the proof branch.

    This block is a precise support target.  The required statement is that the
    curvature gradient control survives the pullback as a theorem-bearing
    continuation statement on the same Euclidean surface used by the manuscript.



    \subsection{Cycle-Exact Angular Observability Packet}

    This is the angular consumer form of the exact-potential branch.  It starts
    after the upstream witness-to-readout splice has installed the transported good
    family, and it tells the reader which angular ledger that branch consumes.

    The branch has already reduced this part of the problem to one geometric
    question: convert signless observed pair-defect data into control of an angular
    directional ledger on that transported family.  The lawful order is
    \[
    \begin{gathered}
    \text{exact-potential witness input}
    \Longrightarrow \text{exact-potential witness-to-readout family}\\
    \Longrightarrow \text{angular/readout consumer packet}.
    \end{gathered}
    \]

    In that order, the transport-coherence input belongs downstream of the same
    witness-to-readout family.  The alignment input is the geometric content: the
    branch has to explain why the transported pair direction is close to the
    expanding direction selected by the strain packet.

    \[
    S_J(t,x)
    :=
    \frac{\nabla u_{\le J}(t,x)+\nabla u_{\le J}(t,x)^\top}{2}
    \]

    The angular ledger is
    \[
    \mathcal E_J^{dir,ang}(I)
    :=
    \int_I\!\!\int_{G_J^{pair}(I)}
    \left(
    1-\big|e_{ab}(t)\cdot n_J(t,X_{\le J}(a,t))\big|^2
    \right)
    \,d\mu_J^{pair}(a,b)\,dt.
    \]

    The direct angular hypothesis says that the transported pair direction is
    controlled by the observed signless packet plus an alignment error:
    \[
    1-\big|e_{ab}(t)\cdot n_J(t,X_{\le J}(a,t))\big|^2
    \le
    C_{\mathrm{align}}\big|W_J(a,b,t)\big|^2
    +\operatorname{err}_{J,\mathrm{align}}(a,b,t).
    \]

    The alignment error is paid by the same strip/coherence ledgers:
    \[
    \int_I\!\!\int_{G_J^{pair}(I)}
    \operatorname{err}_{J,\mathrm{align}}(a,b,t)
    \,d\mu_J^{pair}(a,b)\,dt
    \le
    C\Big(
    \mathcal E_{J,\mathrm{coh}}(I)
    +
    \mathcal E_{J,\mathrm{ang}}^{\mathrm{err}}(I)
    \Big).
    \]

    The observed packet bound is
    \[
    \int_I\!\!\int_{G_J^{pair}(I)}
    \big|W_J(a,b,t)\big|^2
    \,d\mu_J^{pair}(a,b)\,dt
    \le
    C_{\mathrm{obs}}\,
    \mathcal E_J^{obs}(I).
    \]

    Integrating the direct angular hypothesis gives
    \[
    \mathcal E_J^{dir,ang}(I)
    \le
    C_{\mathrm{align}}
    \int_I\!\!\int_{G_J^{pair}(I)}
    \big|W_J(a,b,t)\big|^2
    \,d\mu_J^{pair}(a,b)\,dt
    +
    \int_I\!\!\int_{G_J^{pair}(I)}
    \operatorname{err}_{J,\mathrm{align}}(a,b,t)
    \,d\mu_J^{pair}(a,b)\,dt.
    \]

    After the coherence and angular errors are absorbed into the installed strip
    error ledger, the packet produces the consumer estimate
    \[
    \mathcal E_J^{dir,ang}(I)
    \le
    C\Big(
    \mathcal E_J^{obs}(I)
    +
    \mathcal E_{J,\mathrm{strip}}^{\mathrm{err}}(I)
    \Big).
    \]

    This angular packet remains useful because it names the exact ledger the branch
    needs.  D.63 is the consumer target.  D.64 records the sharper projective split
    of the same burden, using the signless target
    \(1-(e_{ab}\cdot n_J)^2\).



    \subsection{Cycle-Exact Projective Synchronization Packet}

    This is the preferred signless form of the exact-potential consumer packet.  It
    keeps the same branch target as D.63 and rewrites the directional question as a
    projector question.  The signs of \(e_{ab}\) and \(n_J\) are irrelevant, so the
    missing geometric step is recovery of a line field, equivalently a rank-one
    orthogonal projector field.

    Set
    \[
    P_{ab}(t):=e_{ab}(t)\otimes e_{ab}(t),
    \qquad
    P_{J,\top}^{seg}(a,b,t):=n_J(a,b,t)\otimes n_J(a,b,t).
    \]

    Then
    \[
    1-\big(e_{ab}(t)\cdot n_J(a,b,t)\big)^2
    =
    \frac12
    \big\|
    P_{ab}(t)-P_{J,\top}^{seg}(a,b,t)
    \big\|_F^2.
    \]

    The packet has three slots:
    \[
    \begin{aligned}
    &\text{transport coherence}\\
    &\quad+\text{projector recovery from signless data}\\
    &\quad+\text{projector comparison}\\
    &\Longrightarrow \text{angular ledger}.
    \end{aligned}
    \]

    The first slot is the transport-coherence support slot.  A regular-Lagrangian
    flow on the strip gives a measurable full-measure active pair family
    \[
    G_{J,\mathrm{rlf}}^{pair}(I)\subseteq G_J^{pair}(I),
    \]
    and for almost every active pair and time it gives
    \[
    P_{ab}(t)
    :=
    e_{ab}(t)e_{ab}(t)^\top,
    \qquad
    e_{ab}(t)
    :=
    \frac{X(t,a)-X(t,b)}{|X(t,a)-X(t,b)|}.
    \]
    The flow exceptional set, pair-collision exceptional set, and asymmetric
    Lusin-Lipschitz distortion are absorbed into the strip coherence ledger
    \(\mathcal E_{J,\mathrm{coh}}(I)\).  This closes the transport-coherence role
    needed by this packet.  The synchronization role remains open.

    \[
    \widehat P_J(a,b,t)
    \qquad
    \text{for }(a,b,t)\in G_J^{pair}(I)\times I,
    \]

    The second slot is the open PSJ slot.  It asks for a measurable rank-one
    projector field, built from a synchronization observable, graph, or kernel
    attached to the signless packet, with
    \[
    \big\|
    P_{ab}(t)-\widehat P_J(a,b,t)
    \big\|_F^2
    \le
    C_{\mathrm{sync}}\big|W_J(a,b,t)\big|^2
    +\operatorname{err}_{J,\mathrm{sync}}(a,b,t).
    \]

    \[
    \int_I\!\!\int_{G_J^{pair}(I)}
    \operatorname{err}_{J,\mathrm{sync}}(a,b,t)
    \,d\mu_J^{pair}(a,b)\,dt
    \le
    C\Big(
    \mathcal E_{J,\mathrm{coh}}(I)
    +
    \mathcal E_{J,\mathrm{sync}}^{\mathrm{err}}(I)
    \Big).
    \]

    The current signless packet \(W_J\) alone underdetermines this projector.  Two
    active configurations may have the same signless scalar packet data and the
    same transport-coherence ledger while carrying different true projective pair
    fields, for instance \(e_1e_1^\top\) and \(e_2e_2^\top\) on a positive-measure
    subfamily.  A construction depending only on the identical signless scalar
    input would produce the same \(\widehat P_J\) in both configurations, while the
    two true projector fields differ.  That is the installed no-go content of
    \(PSJ.0\).  The real open theorem is \(PSJ\): recover a synchronization
    observable from the packet data, rather than merely bound a scalar defect.

    \[
    \big\|
    \widehat P_J(a,b,t)-P_{J,\top}^{seg}(a,b,t)
    \big\|_F^2
    \le
    \operatorname{err}_{J,\mathrm{top}}(a,b,t)
    \]

    The third slot is the PPCJ/Davis-Kahan comparison slot.  It becomes formal once
    a measurable symmetric observable surrogate is supplied.  On the simple-top
    branch, let \(S_J^{seg}(a,b,t)\) be the symmetric segment strain tensor with top
    spectral projector
    \(P_{J,\top}^{seg}(a,b,t)\), and let
    \[
    \gamma_J(a,b,t)
    :=
    \lambda_{J,1}^{seg}(a,b,t)-\lambda_{J,2}^{seg}(a,b,t)>0.
    \]
    Assume there is a measurable symmetric surrogate \(\widetilde S_J(a,b,t)\)
    with top spectral projector \(\widetilde N_J(a,b,t)\) and
    \[
    \big\|
    \widetilde S_J(a,b,t)-S_J^{seg}(a,b,t)
    \big\|_{\mathrm{op}}
    \le
    \varepsilon_J^{obs}(a,b,t),
    \qquad
    2\varepsilon_J^{obs}(a,b,t)\le \gamma_J(a,b,t).
    \]
    The Davis-Kahan theorem gives
    \[
    d_{\mathrm{proj}}\!\big(
    \widetilde N_J(a,b,t),P_{J,\top}^{seg}(a,b,t)
    \big)^2
    \le
    \frac{4(\varepsilon_J^{obs}(a,b,t))^2}{(\gamma_J(a,b,t))^2}.
    \]

    \[
    \int_I\!\!\int_{G_J^{pair}(I)}
    \operatorname{err}_{J,\mathrm{top}}(a,b,t)
    \,d\mu_J^{pair}(a,b)\,dt
    \le
    C\Big(
    \mathcal E_{J,\mathrm{coh}}(I)
    +
    \mathcal E_{J,\mathrm{top}}^{\mathrm{err}}(I)
    \Big).
    \]

    When the synchronized projector is itself the top projector of that observable
    surrogate, the angular ledger follows by the projector triangle inequality:
    \[
    \big\|P_{ab}-P_{J,\top}^{seg}\big\|_F^2
    \le
    2\big\|P_{ab}-\widehat P_J\big\|_F^2
    +2\big\|\widehat P_J-P_{J,\top}^{seg}\big\|_F^2.
    \]

    Together with the observed-packet bound, the output is
    \[
    \mathcal E_J^{dir,ang}(I)
    \le
    C\Big(
    \mathcal E_J^{obs}(I)
    +\mathcal E_{J,\mathrm{coh}}(I)
    +\mathcal E_{J,\mathrm{sync}}^{\mathrm{err}}(I)
    +\mathcal E_{J,\mathrm{spec}}^{\mathrm{err}}(I)
    \Big).
    \]
    After absorption into the installed strip ledger, this is the same
    cycle-exact estimate consumed by \(PD.70z\), then \(PD.70\), \(PD.70aa\), and
