      \subsection{Theorem D.1: Global Well-Posedness Of The Projected NC Flow}

      The projected NC-flow lane begins with a carrier equation.  The variable is
      the projected carrier \(X\).  The classical velocity field \(u\) enters later
      as a shadow readout, so D.1 first gives the carrier problem a stable local
      evolution.  The theorem file writes the local problem in semilinear form
      \[
      \partial_t X+A_DX+B_D(X)=0,
      \qquad
      A_D:=\nu\,\mathbb P_{D,\omega}\Delta_{D,\omega},
      \qquad
      B_D(X):=\mathbb P_{D,\omega}\big(\delta_\omega X+N_D(X)\big).
      \]
      The carrier Hilbert space is
      \[
      H:=\mathcal V_{D,\omega},
      \]
      and the projected flow stays on this sector when the projector is orthogonal,
      commutes with the generator, and the nonlinearity is admissible for the
      projected domain:
      \[
      \mathbb P_{D,\omega}^2=\mathbb P_{D,\omega},
      \qquad
      \mathbb P_{D,\omega}^*=\mathbb P_{D,\omega},
      \qquad
      [\mathbb P_{D,\omega},\delta_\omega]=0,
      \qquad
      [\mathbb P_{D,\omega},\Delta_{D,\omega}]=0.
      \]
      Under those hypotheses \(A_D\) is self-adjoint, accretive, and sectorial on
      \(H\), \(e^{-tA_D}\) is analytic, and \(B_D\) is locally Lipschitz on
