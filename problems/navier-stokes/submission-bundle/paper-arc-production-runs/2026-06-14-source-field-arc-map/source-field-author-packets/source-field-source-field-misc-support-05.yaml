      \subsection{Exact-Potential F.11d Static-Diffusion Audit}

      D.96 corrects the readout of the \(F.11d\) localization packet.  Some older
      exact-potential \(V2\) notes treated the chart equation as though the second
      order coefficient were a time-dependent variable-diffusion family.  The proof
      line of \(F.11d\) gives a smaller and sharper object: a fixed chart-metric
      diffusion with lower-order chart and drift terms.

      \[
      \partial_t \widetilde q_k
      -\nabla_\zeta\cdot(a_k\nabla_\zeta \widetilde q_k)
      +b_k\cdot \nabla_\zeta \widetilde q_k
      +c_k\widetilde q_k
      =
      \widetilde f_k,
      \]

      The source of the distinction is that the chart is time independent.  Write

      \[
      \widetilde q_k(\zeta,t):=q_k(\Theta_k^{-1}(\zeta),t).
      \]

      \[
      \partial_t q_k+V_J\cdot\nabla_{x,y}q_k-\nu\Delta_{x,y}q_k
      =
      f_k^{hi}+f_k^{cut},
      \]

      Then the pushforward has the form

      \[
      \partial_t \widetilde q_k
      -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta \widetilde q_k)
      +\widetilde b_k\cdot \nabla_\zeta \widetilde q_k
      +\widetilde c_k\widetilde q_k
      =
      \widetilde f_k^{hi}+\widetilde f_k^{cut},
      \]

      Here \(G_k\) depends only on the chart \(\Theta_k\).  The lower-order
      coefficients \(\widetilde b_k,\widetilde c_k\) depend algebraically on
      \(D\Theta_k\), \(D^2\Theta_k\), and the drift \(V_J\).  No \(V_J\)-dependent
      term enters the second-order diffusion matrix.

      The reason is elementary but important for the route.  The time derivative is
      unchanged because \(\Theta_k\) is time independent.  The drift term
      \(V_J\cdot\nabla q_k\) remains first order after composition with
      \(\Theta_k^{-1}\).  The Laplacian is the only second-order part, and its
      pushforward under a fixed \(C^2\) diffeomorphism is the usual divergence-form
      operator with coefficient matrix determined by the chart metric.

      \[
      \boxed{
      \partial_t \widetilde q_k
      -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta \widetilde q_k)
      +\widetilde b_k\cdot \nabla_\zeta \widetilde q_k
      +\widetilde c_k\widetilde q_k
      =
      \widetilde f_k^{hi}+\widetilde f_k^{cut}
      }
      \]

