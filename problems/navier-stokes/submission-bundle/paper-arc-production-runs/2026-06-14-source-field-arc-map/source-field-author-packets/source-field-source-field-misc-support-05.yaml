      then import Phung--Wang measurable-time observability.

      The repaired \(F.11d\) readout is sharper than the older variable-diffusion
      story.  Because the chart is time independent, the principal diffusion is a
      fixed chart metric.  The honest localized equation is

      \[
      \partial_t \widetilde q_k
      -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta \widetilde q_k)
      +\widetilde b_k\cdot \nabla_\zeta \widetilde q_k
      +\widetilde c_k\widetilde q_k
      =
      \widetilde f_k^{hi}+\widetilde f_k^{cut},
      \]

