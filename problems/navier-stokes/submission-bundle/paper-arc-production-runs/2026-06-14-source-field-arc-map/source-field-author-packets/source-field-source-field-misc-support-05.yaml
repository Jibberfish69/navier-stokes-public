      \subsection{Exact-Potential V2 Fixed-Metric Heat Supported, Perturbation Remaining}

      This subsection records the earlier intermediate split on the repaired direct
      \(V2\) route.  At that point the route had two local pieces: fixed-metric heat
      observability for the static chart metric, and a bounded lower-order
      perturb-transfer step.  The preceding subsection now pays the second piece, so
      this split is no longer the current stopping point.

      \[
      \partial_t u-\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta u)=0
      \]

      Laurent--Leautaud 2018 supply the relevant fixed-metric support: a uniform
      Carleman estimate for bounded families of Lipschitz metrics, with the associated
      uniform spectral inequalities and heat observability estimates.  When the
      repaired F.11d packet is read with fixed diffusion \(\nu G_k\), this external
      support covers the base heat equation above.

      The intermediate route was

      \[
      \begin{aligned}
      &\text{fixed-metric heat observability}
      \Longrightarrow
      \text{bounded lower-order transfer},\\
      &\text{bounded lower-order transfer}
      \Longrightarrow
      \text{PDO-Carleman}
      \Longrightarrow
      \text{windowwise }V2.
      \end{aligned}
      \]

      D.99 tightens that route: the bounded lower-order packet is absorbed directly
      once the fixed-metric Carleman estimate is imported.  The live local status is
      now simpler.  The repaired direct branch needs the fixed-metric Lipschitz import
      and the already-recorded Wang--Zhang measurable-time step; the lower-order
      perturb-transfer wall is no longer a separate branch-local debt.


