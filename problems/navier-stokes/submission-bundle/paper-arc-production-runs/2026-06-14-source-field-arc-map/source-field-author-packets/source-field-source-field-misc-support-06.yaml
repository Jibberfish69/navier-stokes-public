      \subsection{Exact-Potential V2 Static-Diffusion Wang--Zhang Route}

      This subsection explains why the measurable-time step is support rather than a
      new branch-local obstruction.  The repaired F.11d chart equation is

      \[
      \partial_t \widetilde q_k
      -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta \widetilde q_k)
      +\widetilde b_k\cdot \nabla_\zeta \widetilde q_k
      +\widetilde c_k\widetilde q_k
      =
      \widetilde f_k^{hi}+\widetilde f_k^{cut}.
      \]

      Let \(H_k=L^2(\Omega_k)\), let \(A_k\) be the realized homogeneous operator, and
      let \(B_k\) be restriction to the observation set \(\omega_k\).  D.106 supplies
      the analytic-semigroup and observation-admissibility parts of the
      Wang--Zhang packet.  Once interval observability is available for the pair
      \((A_k,B_k)\), Wang--Zhang gives observability from every measurable time set
      \(E_k\subset I_k\) with \(|E_k|>0\).

      The source term
      \(\widetilde f_k^{hi}+\widetilde f_k^{cut}\) is handled by the same Duhamel
      forcing packet already carried on the exact-potential branch.  The
      measurable-time theorem is support for the repaired direct route.  The sharp
      local burden is the interval observability theorem for the repaired fixed-metric
      chart operator, already identified with \(PDO\)-Carleman above and paid through
      the fixed-metric Carleman import plus the D.99 lower-order absorption.

      Thus the repaired direct \(V2\) leg closes inside the exact-potential route
      under the explicit \(LL+WZ\) support packet recorded in D.103.


