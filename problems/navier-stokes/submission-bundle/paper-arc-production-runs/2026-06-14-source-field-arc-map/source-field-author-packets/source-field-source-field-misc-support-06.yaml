      \subsection{Exact-Potential V2 Static-Diffusion Heat-Plus-Perturbation Split}

      This subsection records the split that made D.99 possible.  The repaired
      bounded-chart operator has one fixed principal diffusion and bounded lower-order
      terms:

      \[
      \mathcal L_k u
      =
      \underbrace{\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta u)}_{\mathcal L_k^{heat}u}
      +\,
      \underbrace{\bigl(-\widetilde b_k\cdot\nabla_\zeta u-\widetilde c_k u\bigr)}_{\mathcal P_k u}.
      \]

      At this intermediate level the local \(PDO\)-Carleman wall factors into two
      classical parabolic tasks:

      \[
      \text{fixed-metric heat observability}
      \qquad+\qquad
      \text{bounded lower-order transfer}.
      \]

      Laurent--Leautaud 2018 supply the fixed-metric heat side for bounded Lipschitz
      metric families.  D.99 pays the bounded lower-order side once that fixed-metric
      estimate is imported in Carleman form.  This split remains in the manuscript so
      the reader can see why the lower-order wall has been paid rather than ignored.


