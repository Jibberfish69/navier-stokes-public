      \subsection{Exact Potential V2 Import Menu After Ep11D}

      This subsection preserves the older stopping point after the fixed forcing
      packet \(EP.11d\).  At that stage the forcing side of the stronger adiabatic
      exact-potential route had been frozen, and the remaining branch-specific debt
      was \(V2\).

      \[
      \begin{gathered}
      \text{angular ledger estimate}+\text{forcing packet}+V1+V2\\
      \Longrightarrow \text{exact-potential readout}\\
      \Longrightarrow \text{pressure-defect conclusion}.
      \end{gathered}
      \]

      The older \(V2\) menu had three possible import routes:

      \[
      \begin{gathered}
      \text{Stokes observable localization},\\
      \text{lower-order convex-chart parabolic localization},\\
      \text{analytic-coefficient normalization}.
      \end{gathered}
      \]

      Proposition F.11g is the reason those three routes appear here.  It identifies
      the localized operator-class wall: either reduce the localized defect equation
      from (F.11g1) to the lower-order convex packet (F.11g2)--(F.11g3), or prove
      measurable-time observability directly for the coefficient class produced by
      F.11d.

      This menu is historical route evidence.  The audits above explain why the
      Stokes, convex product-set, and analytic routes remain conditional.  The active
      conservative continuation is the repaired direct route recorded below: fixed
      chart metric, bounded lower-order absorption, and the Laurent--Leautaud plus
      Wang--Zhang import packet.


