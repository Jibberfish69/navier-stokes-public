      \subsection{Far-Corona CTS-FCTS-Car-FC Result}

      The far-corona packet is controlled through the conditional continuum chain
      \[
      CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
      \]
      Here \(FC\) is the far-corona packet estimate
      \[
      \int_0^T\Pi_N^{\mathrm{mid,far},L}(t)\,dt
      \le
      \eta_{\mathrm{far}}\nu\int_0^T D_N(t)\,dt
      +C_{\mathrm{far}}2^{-2\delta N}.
      \]
      Together with the same-scale weighted-carrier side, this would close the lifted
      packet.

      \[
      LPAS\Rightarrow CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
      \]
      That is the inherited local theorem engine: the continuum cumulative-tail
      stress theorem \(CTS\) reduces to the dyadic lower-prefix active-square surface
      \(LPAS\).

      There are two sharper sufficient routes. A factorized two-scale theorem
      \[
      \mathcal A_{\ell,r}(t)\le U(\ell,t)V(r,t),\qquad r\ge c_1\ell,
      \]
      with the corresponding square estimates in \(\ell\) and \(r\), gives \(FC\)
      directly by the Hardy--Schur step. The operator route gives
      \[
      DER+EP\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
      \]
      There the survivor is a finite-band endpoint theorem rather than the full
      moving lower-prefix theorem.

      \[
      LPAS\quad\text{or}\quad F2S\quad\text{or}\quad DER+EP
      \quad\Longrightarrow\quad CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
      \]

      The result is a conditional reduction, not a finished far-corona closure.
      None of \(LPAS\), \(F2S\), or \(DER+EP\) is currently installed from the
      inherited Euclidean inputs. The far-corona packet remains the live lifted-packet
      debt. The concrete next surfaces are \(LPAS\), the factorized two-scale route
      \(F2S\), or the fixed-band endpoint route \(FBE/EP\) exposed by the operator
      reduction.


