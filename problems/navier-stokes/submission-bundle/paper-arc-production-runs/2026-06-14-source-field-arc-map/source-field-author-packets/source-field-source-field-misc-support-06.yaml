      \subsection{Exterior Algebra Extraction For NS Route}

      This subsection is an extraction note, not a closure theorem.  Its job is to
      separate the parts of exterior algebra that actually sharpen the current
      Navier--Stokes route from the parts that are only side attractions.

      The useful material falls into five route packages:

      \[
      \begin{gathered}
      \text{alternating/exact channels},\qquad
      \text{metric forms},\qquad
      \text{rank and decomposability},\\
      \text{exact sequences and filtrations},\qquad
      \text{shuffle/coalgebra structure}.
      \end{gathered}
      \]

      The lower-priority sidecars are Lie algebra homology, currents, and
      Clifford/Weyl or superspace language.  They may be useful later, but they are
      not the current closure engine.

      The alternating package starts from the basic identity

      \[
      \alpha\wedge\beta = \operatorname{Alt}(\alpha\otimes\beta).
      \]

      For the Navier--Stokes route, this is the intrinsic language for antisymmetric
      and exact channels.  One writes

      \[
      \alpha := u^\flat;
      \]

      \[
      \omega := d\alpha;
      \]

      \[
      \delta\alpha = 0
        \quad\text{or}\quad
        d\star\alpha = 0;
      \]

      \[
      \mathcal L_u,\quad i_u;
      \]

      and Cartan-type formulas then tell the route which packets are exact,
      Lie-dragged, or boundary-like rather than genuine growth sources.

      The metric package enters through the Hodge star, the codifferential
      \(\delta\), and the Hodge Laplacian
      \[
      \Delta_H=d\delta+\delta d.
      \]
      This does not replace the deformation tensor \(G=AA^\top\).  It separates two
      roles: forms carry the exact and antisymmetric side, while \(G\) remains the
      symmetric deformation object on the strain side.

      The rank/decomposability package is the first serious classifier.  A surviving
      mixed packet may be a simple blade after the right quotient, or it may be an
      irreducibly mixed higher-rank object.  Plucker-type decomposability relations
      would test whether a cross-rung or cross-channel bivector really comes from one
      geometric plane of interaction.  A positive simplicity test could expose sign
