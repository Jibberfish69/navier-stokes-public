    \(\Theta_N^\sharp\) is the threshold-collar coefficient, and \(E_N\) is the
    gradient tail energy.

    The energy layer by itself does not close these products.  Separate time
    integrability of a coefficient and a tail is weaker than integrability of their
    product.  The model example is

    \[
    a(t)=b(t)=(T-t)^{-1/2},
    \]

    \[
    ab=(T-t)^{-1}
    \]

    where \(a\) and \(b\) are each integrable on \((0,T)\), while \(ab\) is not.
    That is exactly the risk here: a proof that controls the coefficient side and
    the tail-energy side only separately still leaves the weighted shell product
    unpaid.

    The obstruction closes by any one of three stronger payments.  The first is the
    product theorem itself:

    \[
    \int_0^T \Lambda_N E_N\,dt
    +
    \int_0^T \Theta_N^\sharp E_N\,dt
    <\infty.
    \]

    The second is a pointwise coefficient theorem at the viscous shell scale:

    \[
    \Lambda_N\le c\nu2^{2N},
    \qquad
    \Theta_N^\sharp\le c\nu2^{2N}.
    \]

    The third is an absorbable inequality with a summable remainder:

    \[
    (\Lambda_N+\Theta_N^\sharp)E_N
    \le
    \varepsilon\nu D_N+C_\varepsilon R_N
    \]

    with \(R_N\) summable in the shell and tail summation.  Until one of these
    three payments is proved, the weighted carrier is only a correct coefficient
    interface.  It is not an unconditional shell absorption theorem.



    \subsection{Exterior Algebra Extraction For NS Route}

    This subsection is an extraction note, not a closure theorem.  Its job is to
    separate the parts of exterior algebra that actually sharpen the current
    Navier--Stokes route from the parts that are only side attractions.

    The useful material falls into five route packages:

    \[
    \begin{gathered}
    \text{alternating/exact channels},\qquad
    \text{metric forms},\qquad
    \text{rank and decomposability},\\
    \text{exact sequences and filtrations},\qquad
    \text{shuffle/coalgebra structure}.
    \end{gathered}
    \]

    The lower-priority sidecars are Lie algebra homology, currents, and
    Clifford/Weyl or superspace language.  They may be useful later, but they are
    not the current closure engine.

    The alternating package starts from the basic identity

    \[
    \alpha\wedge\beta = \operatorname{Alt}(\alpha\otimes\beta).
    \]

    For the Navier--Stokes route, this is the intrinsic language for antisymmetric
    and exact channels.  One writes

    \[
    \alpha := u^\flat;
    \]

    \[
    \omega := d\alpha;
    \]

    \[
    \delta\alpha = 0
      \quad\text{or}\quad
      d\star\alpha = 0;
    \]

    \[
    \mathcal L_u,\quad i_u;
    \]

    and Cartan-type formulas then tell the route which packets are exact,
    Lie-dragged, or boundary-like rather than genuine growth sources.

    The metric package enters through the Hodge star, the codifferential
    \(\delta\), and the Hodge Laplacian
    \[
    \Delta_H=d\delta+\delta d.
    \]
    This does not replace the deformation tensor \(G=AA^\top\).  It separates two
    roles: forms carry the exact and antisymmetric side, while \(G\) remains the
    symmetric deformation object on the strain side.

    The rank/decomposability package is the first serious classifier.  A surviving
    mixed packet may be a simple blade after the right quotient, or it may be an
    irreducibly mixed higher-rank object.  Plucker-type decomposability relations
    would test whether a cross-rung or cross-channel bivector really comes from one
    geometric plane of interaction.  A positive simplicity test could expose sign
    or telescoping structure.  A negative test would turn a vague structural
    obstruction into a precise rank obstruction.

    The exact-sequence package gives a cleaner way to define the survivor.  Instead
    of naming the survivor rhetorically, the route can try to build a filtration
    \[
    0
    \longrightarrow
    \text{exact or Lie-dragged channels}
    \longrightarrow
    \text{full tower package}
    \longrightarrow
    \text{residual survivor package}
    \longrightarrow
    0.
    \]
    That is the right setting for comparing the historical lower-prefix family with
    the current lifted high-side family, and for comparing Eulerian packets with
    their Lagrangian pullback forms.

    The shuffle/coalgebra package is the combinatorial branch.  The mixed-jet tower
    already spreads by binomial and convolution laws.  Exterior coalgebra suggests
    that this may be a shuffle or Hopf-algebra structure rather than an ad hoc
    Leibniz expansion.  The possible gain is a sharper split between primitive
    packets and composite packets in the prolonged tower.

    The pullback identities
    \[
    f^*(\omega\wedge\eta)=f^*\omega\wedge f^*\eta,
    \qquad
    f^*(d\omega)=d(f^*\omega)
    \]
    are already aligned with the Lagrangian bridge.  They say that the form package
    is carried functorially into the comoving frame, while deformation geometry
    records what survives that bridge.

    The status of this extraction is support and route sharpening.  It does not
    close a Navier--Stokes branch by itself.  It says that the survivor dictionary
    should be formulated as a filtration, cohomology, and rank-classification
    problem on the prolonged Navier--Stokes package, with the geometry-evolving
    parabolic law still responsible for killing any residual class that survives
    those classifications.



    \subsection{Far-Corona CTS-FCTS-Car-FC Result}

    The far-corona packet is controlled through the conditional continuum chain
    \[
    CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
    \]
    Here \(FC\) is the far-corona packet estimate
    \[
    \int_0^T\Pi_N^{\mathrm{mid,far},L}(t)\,dt
    \le
    \eta_{\mathrm{far}}\nu\int_0^T D_N(t)\,dt
    +C_{\mathrm{far}}2^{-2\delta N}.
    \]
    Together with the same-scale weighted-carrier side, this would close the lifted
    packet.

    \[
    LPAS\Rightarrow CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
    \]
    That is the inherited local theorem engine: the continuum cumulative-tail
    stress theorem \(CTS\) reduces to the dyadic lower-prefix active-square surface
    \(LPAS\).

    There are two sharper sufficient routes. A factorized two-scale theorem
    \[
    \mathcal A_{\ell,r}(t)\le U(\ell,t)V(r,t),\qquad r\ge c_1\ell,
    \]
    with the corresponding square estimates in \(\ell\) and \(r\), gives \(FC\)
    directly by the Hardy--Schur step. The operator route gives
    \[
    DER+EP\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
    \]
    There the survivor is a finite-band endpoint theorem rather than the full
    moving lower-prefix theorem.

    \[
    LPAS\quad\text{or}\quad F2S\quad\text{or}\quad DER+EP
    \quad\Longrightarrow\quad CTS\Rightarrow FCTS\Rightarrow Car\Rightarrow FC.
    \]

    The result is a conditional reduction, not a finished far-corona closure.
    None of \(LPAS\), \(F2S\), or \(DER+EP\) is currently installed from the
    inherited Euclidean inputs. The far-corona packet remains the live lifted-packet
    debt. The concrete next surfaces are \(LPAS\), the factorized two-scale route
    \(F2S\), or the fixed-band endpoint route \(FBE/EP\) exposed by the operator
    reduction.


