      \subsection{Exact-Potential V2 Static-Diffusion Semigroup Reduction}

      This subsection isolates the routine part of the Wang--Zhang route.  On a
      retained chart write

      \[
      \mathcal L_k u
      :=
      \nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta u)
      -\widetilde b_k\cdot \nabla_\zeta u
      -\widetilde c_k u,
      \]

      \[
      \partial_t u + \mathcal L_k u = 0.
      \]

      Uniform ellipticity and \(G_k\in W^{1,\infty}\) give the coercive principal
      form.  The first-order and zeroth-order terms are bounded form perturbations on
      the bounded chart.  After the usual large positive scalar shift, the full form
      is closed and sectorial, so the realized operator \(A_k\) generates an analytic
      semigroup on \(H_k:=L^2(\Omega_k)\).

      \[
      B_k:H_k\to L^2(\omega_k),
      \qquad
      B_k u := u|_{\omega_k}.
      \]

      The observation map is restriction to the open observation set
      \(\omega_k\subset\Omega_k\).  Its \(L^2\) norm is bounded by the \(L^2\) norm
      on \(\Omega_k\), so it is admissible once the semigroup exists:

      \[
      \int_0^T\|B_ke^{-tA_k}u_0\|_{L^2(\omega_k)}^2\,dt
      \le
      T\sup_{0\le t\le T}\|e^{-tA_k}u_0\|_{L^2(\Omega_k)}^2.
      \]

      The Wang--Zhang route now has one genuine local theorem left at this level:
      interval observability for the repaired bounded-chart operator.  D.105 names
      that theorem as the existing \(PDO\)-Carleman node.


