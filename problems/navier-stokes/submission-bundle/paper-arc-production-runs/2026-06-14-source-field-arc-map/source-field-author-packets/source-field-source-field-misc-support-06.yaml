      \subsection{Exact-Potential V2 Static-Diffusion Reduces To PDO-Carleman}

      This subsection identifies the repaired bounded-chart observability theorem
      with the existing pair-defect parabolic node \(PDO\)-Carleman.  The homogeneous
      chart equation is

      \[
      \partial_t u
      -\nu\,\nabla_\zeta\cdot(G_k\nabla_\zeta u)
      +\widetilde b_k\cdot\nabla_\zeta u
      +\widetilde c_k u
      =0.
      \]

      The inhomogeneous ledger on the same chart is

      \[
      \widetilde f_k^{hi}+\widetilde f_k^{cut}.
      \]

      An interval observability estimate for the homogeneous chart equation, together
      with the Duhamel/source ledger for the displayed forcing, is exactly the
      route-local realization of \(PDO\)-Carleman for the localized pair-defect
      packet.  Summing over the finite-overlap chart family gives the installed
      parabolic node.

      The repaired \(V2\) branch is one bounded-chart realization of the existing
      pair-defect PDE program.


