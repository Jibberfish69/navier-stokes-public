      \subsection{Fourth Bridge Source-Fidelity Note}

      The original source family and the later live lane do not use the same fourth
      bridge. The original bridge is curvature-based: it uses a Riemannian
      Navier--Stokes reformulation, Laplace--Beltrami diffusion, Ricci-curvature
      damping, and a cubic gradient growth term. The later package is Euclidean: it
      uses dyadic Littlewood--Paley decompositions, high-frequency enstrophy tails, a
      coercivity object, and a continuation estimate.

      The Euclidean package may become a theorem upgrade that replaces the original
      curvature bridge, or it may remain an auxiliary reinterpretation. The current
      record has not integrated it as the same source bridge. So fourth-bridge
      discharge remains open at the authority level until the replacement is declared
      and supplied on the page.


