      \subsection{Frame-Recovery Wall Theorem Candidate Note}

      This note belongs to the Lagrangian pressure wall.  The Route A pressure
      reduction has already removed the naked principal viscous-pressure term.  The
      remaining coefficient window is

      \[
      \boxed{
      G\nabla_aA,\qquad \nabla_a(G\nabla_aA)\in L^\infty .
      }
      \]

      Here

      \[
      F:=\nabla_a X,\qquad
      A:=F^{-1},\qquad
      G:=AA^\top .
      \]

      The metric \(G\) records symmetric stretch.  It does not by itself determine
      the full inverse frame \(A\), since algebraically one may write

      \[
      A=G^{1/2}R,\qquad R(a,t)\in SO(3).
      \]

      The Navier--Stokes frame is still much more constrained than an arbitrary
      choice of \(R\).  It comes from a true deformation and satisfies

      \[
      F=\nabla_aX,\qquad
      \det F=1,\qquad
      \partial_t A=-A(\nabla_xu)(X,t)=-A(\nabla_av)A,
      \]

      together with the Piola and integrability identities

      \[
      \operatorname{div}_aA^\top=0,\qquad
      \partial_{a_j}F_{ik}=\partial_{a_k}F_{ij}.
      \]

      The bridge has two inputs: metric deformation data and the native frame
      compatibility package.  In formula form it is

      \[
      \boxed{
      \mathcal L_r[G]+\mathcal T_r[A;v]
      \Longrightarrow
      G\nabla_aA,\ \nabla_a(G\nabla_aA)\in L^\infty ,
      }
      \]

      where \(\mathcal T_r[A;v]\) is built from the exact frame equations
      \((FR.4)\)--\((FR.5)\).  The geometric-rigidity and Korn analogies explain why
      metric data should almost fix a frame, but the installed route still needs the
      Navier--Stokes compatibility package carried by \(A\) and \(F\).

