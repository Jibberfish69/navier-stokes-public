      \subsection{Frozen Threshold-Vs-Linearization Synchronization}

      A sharper supply route for the geometric frozen wall is threshold--linearization
      synchronization.  The qualitative selector-good route gives a
      differentiability-exception packet; the frozen route needs the threshold
      schedule to synchronize with the frozen linearization error.

      \[
      \mu_{J,\tau}^{diff}(a)
      :=
      \mu_{J,\varepsilon}^{pair}
      \bigl(E_{J,\varepsilon,\vartheta_{J,\tau}^{lin}(a)}^{diff}(\tau,a)\bigr).
      \]

      \[
      \eta_{J,\tau}^{lin}(a)
      \le
      C_{\tau}^{th,sync}\,
      \bigl(\vartheta_{J,\tau}^{lin}(a)\bigr)^2
      \qquad\text{for every }a\in\pi_a(\mathcal G_J).
      \]

      \[
      \mu_{J,\tau}^{diff}(a)
      \le
      c_{\mathrm{sel}}^{-2}\,
      \bigl(C_{\tau}^{th,sync}\bigr)^2\,
      \bigl(\vartheta_{J,\tau}^{lin}(a)\bigr)^2.
      \]

      On the exceptional set, the error is at least
      \(\vartheta_{J,\tau}^{lin}(a)|\xi_{ab}|\).  The active-pair lower scale bound
      \(|\xi_{ab}|\ge c_{\mathrm{sel}}\) gives

      \[
      c_{\mathrm{sel}}^2
      \bigl(\vartheta_{J,\tau}^{lin}(a)\bigr)^2
      \mu_{J,\tau}^{diff}(a)
      \le
      \eta_{J,\tau}^{lin}(a)^2 .
      \]

      Thus the displayed synchronization hypothesis implies the quadratic modulus
      bound above.  This is a real implication, and it identifies the stop line:
      the installed notes do not yet expose a lower theorem that proves
      \(\eta_{J,\tau}^{lin}\le C_{\mathrm{sf},8224}(\vartheta_{J,\tau}^{lin})^2\) automatically.


