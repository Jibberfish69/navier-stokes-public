      \subsection{Gradient Commutator Remainder Lemma}

      The dyadic enstrophy identity splits the nonlinear term as

      \[
      \left\langle \Delta_j((u\cdot\nabla)u),-\Delta\Delta_j u\right\rangle
      =LH_j+HL_j+SP_j+HH_j.
      \]

      Here \(LH_j\) and \(HL_j\) are the strict low-mode packets, \(SP_j\) is the
      finite threshold-spill collar created by freezing the low cutoff at \(N\), and
      \(HH_j\) is the genuine near-diagonal high-high packet.

      \[
      \sum_{j\ge N}\bigl(|LH_j|+|HL_j|\bigr)
      \le
      C\Lambda_N(t)E_N(t),
      \]

      \[
      \sum_{j\ge N}|SP_j|
      \le
      C_{\varepsilon,M,\nu}\Theta_N^\sharp(t)E_N(t)
      +\varepsilon\nu D_N(t),
      \]

      \[
      \sum_{j\ge N}|HH_j|
      \le
      \frac{\eta\nu}{2}D_N(t)
      \]

      after the near-diagonal reduction and cubic-tail absorption.  Thus strict
      low-mode and spill are paid on the upgraded coefficient

      \[
      \widetilde\Lambda_N^\sharp(t):=\Lambda_N(t)+\Theta_N^\sharp(t).
      \]

      This is the important correction to the old summary.  The route has not
      rescued the weaker \(\mathcal L_N\) statement.  The repaired strict-low and
      spill notes instead show that the gradient package is coherent after upgrading
      the coefficient.  The remaining proposition-level burden is the lifted
      high-side remainder.


