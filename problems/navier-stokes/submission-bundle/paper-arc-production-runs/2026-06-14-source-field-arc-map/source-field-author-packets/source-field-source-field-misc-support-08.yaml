      \subsection{Frozen Cap-Pair Bilinear-Form Theorem Candidate}

      This note isolates the local same-depth capwise bilinear form in the frozen
      operator branch.  Work on one resonant shell and let

      \[
      \mathcal R_j
      :=
      \{(\omega,\omega'):\angle(\omega,\omega')\le C_{\mathrm{sf},8010} \rho_j\},
      \qquad
      f_{j,\omega}:=\Delta_{j,\omega}f,\quad
      g_{j,\omega'}:=\Delta_{j,\omega'}g.
      \]

      The active cap graph has bounded valence:

      \[
      \sup_\omega \#\{\omega':(\omega,\omega')\in\mathcal R_j\}
      +
      \sup_{\omega'} \#\{\omega:(\omega,\omega')\in\mathcal R_j\}
      \le N_{\mathrm{cap}}.
      \]

      For each active pair freeze the main symbol at a packet base point:

      \[
      b^{frozen}_{G,j,\omega,\omega'}(\xi,\eta)
      :=
      \chi_j(\xi)\chi_j(\eta)\chi_j(\xi+\eta)
      \psi_{j,\omega}(\xi)\psi_{j,\omega'}(\eta)
      b_{G,j}^{main}(a_{j,\omega,\omega'},\xi,\eta),
      \]

      and define the bilinear form

      \[
      \Lambda^{frozen}_{j,\omega,\omega'}(f_{j,\omega},g_{j,\omega'})
      :=
      \iint b^{frozen}_{G,j,\omega,\omega'}(\xi,\eta)
      \widehat{f_{j,\omega}}(\xi)
      \widehat{g_{j,\omega'}}(\eta)\,d\xi d\eta .
      \]

      The same-depth main contribution splits into the frozen cap sum plus a
      freezing remainder:

      \[
      \mathcal B_{G,main}^{res,j}(f_j,g_j)
      =
      \sum_{(\omega,\omega')\in\mathcal R_j}
      \Lambda^{frozen}_{j,\omega,\omega'}(f_{j,\omega},g_{j,\omega'})
      +\mathcal R_j^{freeze}(f_j,g_j).
      \]

      The graph summation itself is paid.  A pairwise bound of the form

