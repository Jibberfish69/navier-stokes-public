      \subsection{Global Signed LP Balance Reduction Note}

      This reduction is the algebraic companion to the previous identity note.  It
      proves that the route is globally posed from one multiplier family, while the
      full signed theorem still requires an explicit rewrite of the transpose and
      weight terms.

      \[
      P_{\le \ell}:=\varphi(\ell D),
      \qquad
      Q_\ell:=-\,\ell\partial_\ell P_{\le \ell},
      \qquad
      u_\ell:=Q_\ell u,
      \qquad
      u_{\le \ell}:=P_{\le \ell}u.
      \]

      \[
      b_\ell^{meso}
      :=
      P_{\le c/\ell}u - P_{\le 2^{N+M}}u.
      \]

      \[
      \mathfrak c_\ell
      :=
      \ell^{-2}\,
      \big\langle
      u_\ell,\,
      [Q_\ell,b_\ell^{meso}\!\cdot\nabla]u
      \big\rangle.
      \]

      \[
      \Psi_\ell^{raw}
      :=
      \ell^{-2}\,
      \big\langle
      [P_{\le \ell},b_\ell^{meso}\!\cdot\nabla]u,\,
      u_{\le \ell}
      \big\rangle.
      \]

      All objects in this display are globally defined for
      \(0<\ell\le\ell_N\).  The raw scale derivative identity is

      \[
      \ell\partial_\ell \Psi_\ell^{raw}
      =
      \mathfrak c_\ell
      +
      \mathfrak c_\ell^{transpose}
      +
      \mathfrak s_\ell^{edge}
      +
      \mathfrak w_\ell,
      \]

      where \(\mathfrak w_\ell\) comes from the scalar profile and
      \(\mathfrak s_\ell^{edge}\) is supported only at the upper edge of the
      mesoscopic band.  The lower cutoff is fixed in \(\ell\), which is why the edge
      term belongs to the spill-collar geometry.

      The remaining algebraic move is concrete:

      \[
      \mathfrak c_\ell^{transpose}+\mathfrak w_\ell
      \rightsquigarrow
      \nabla_x\cdot J_\ell+\partial_tR_\ell+\mathcal E_\ell
      \]

      using the low-pass Navier--Stokes equation

      \[
      \partial_t u_{\le\ell}
      +P_{\le\ell}\big((u\cdot\nabla)u\big)
      +\nabla p_{\le\ell}
      =
      \nu\Delta u_{\le\ell}.
      \]

      The representation question is now settled: the remaining algebraic content is
      the explicit symbolic rewrite.  The full \((L\hbox{-}Signed)\) theorem still
      needs that rewrite.


