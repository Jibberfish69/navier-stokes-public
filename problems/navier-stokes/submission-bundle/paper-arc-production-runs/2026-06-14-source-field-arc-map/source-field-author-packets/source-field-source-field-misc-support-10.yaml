      \subsection{H2: Standalone Half-Derivative Bound}

      This is the critical-energy target attached to the low-mode strain problem.  It
      does not prove the bound.  It states the same-surface coercive estimate needed
      to make the critical closure non-circular.

      \[
      E_{1/2}(t) := \|\omega(t)\|_{\dot H^{1/2}_x}^2
      = \int_{\mathbb R^3} |\xi|\,|\widehat{\omega}(\xi,t)|^2\,d\xi.
      \]

      \[
      \frac12\frac{d}{dt}E_{1/2}(t)
      + \nu \|\omega(t)\|_{\dot H^{3/2}_x}^2
      = \mathcal N_{1/2}(t),
      \]

      \[
      \mathcal N_{1/2}(t)
      :=
      \big\langle \Lambda^{1/2}(\omega\cdot\nabla u),
      \Lambda^{1/2}\omega\big\rangle.
      \]

      The transport part cancels by divergence-free structure after the standard commutator rewrite. The remaining term is the stretching channel.

      \[
      \mathcal N_{1/2}(t)
      \le
      (1-\delta)\nu \|\omega(t)\|_{\dot H^{3/2}_x}^2
      + C_\delta \|\omega(t)\|_{\dot H^{1/2}_x}^2
      \]

      would give

      \[
      \sup_{t\in[0,T]} \|\omega(t)\|_{\dot H^{1/2}_x}^2
      \le
      C(T)\,\|\omega_0\|_{\dot H^{1/2}_x}^2.
      \]

      The dyadic reduction identifies the exact open object:

      \[
      A_{j-1}(t)
      :=
      \sum_{k\le j-1}2^{5k/2}\|\Delta_k\omega(t)\|_{L^2_x}
      \le
      c\nu2^{2j}.
      \]

      Finite-shell truncation does not make \((H2.2)\) automatic.  The low shells
      still need pointwise strain suppression at the viscous scale.  This is the
      same missing low-mode theorem seen by the gradient strict-low audit.


