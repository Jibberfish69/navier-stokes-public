    V_{n+1}
    +
    \sum_{k=0}^{n}\binom{n}{k}\,(V_k\cdot\nabla)V_{n-k}
    +
    \nabla P_n
    =
    \nu\Delta V_n.
    \]

    \[
    L_n:=\nu\Delta V_n-\nabla P_n,
    \qquad
    M_n:=\sum_{k=0}^{n}\binom{n}{k}\,(V_k\cdot\nabla)V_{n-k},
    \]

    \[
    V_{n+1}=L_n-M_n.
    \]

    \[
    J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u.
    \]

    The pressure part and the base transport part belong to the exact or skew
    channels already visible in jet pairings. The remaining mixed source matrix is

    \[
    \mathcal R_{A,B}
    :=
    \langle \widetilde T_A,J_B\rangle
    +
    \langle J_A,\widetilde T_B\rangle.
    \]

    Recentring on material transport writes the visible nonlinear defect as

    \[
    L_uU_\alpha+\widetilde T_\alpha+\nabla P_\alpha=\nu\Delta U_\alpha,
    \qquad
    L_u:=\partial_t+u\cdot\nabla,
    \qquad
    U_\alpha:=\partial_x^\alpha u,
    \]

    \[
    \widetilde T_\alpha
    :=
    \partial^\alpha(u\cdot\nabla u)-u\cdot\nabla(\partial^\alpha u)
    =
    [\partial^\alpha,u\cdot\nabla]u.
    \]

    The relevant quotient is

    \[
    0\to
    \mathcal E_{\mathrm{exact}}
    \to
    \mathcal T_{\mathrm{full}}
    \to
    \mathcal S_{\mathrm{surv}}
    \to 0.
    \]

    Here \(\mathcal T_{\mathrm{full}}\) is the prolonged tower packet,
    \(\mathcal E_{\mathrm{exact}}\) collects pressure-null, Lie-dragged, and
    contact-null channels, and \(\mathcal S_{\mathrm{surv}}\) is the genuine
    survivor. The section's mathematical status is support architecture: it
    explains why the next algebraic theorem should classify the survivor quotient
    before any drain theorem is claimed.

    The remaining bills are exact. The route still needs a theorem-grade definition
    of \(\mathcal E_{\mathrm{exact}}\), a quotient or filtration comparing the old
    lower-prefix survivor with the lifted upper-tail survivor, and a coproduct or
    coaction theorem proving that the surviving packet is primitive, coideal, or
    otherwise isolated after exactness reduction. Once that survivor is identified,
    the analytic route is expected to export it to deformation geometry. That
    export theorem is not installed here.



    \subsection{Hopf / Shuffle -> Survivor -> Drain Program}

    This program is the same route written as a usable proof sequence:

    \[
    \begin{aligned}
    &\text{tower}\\
    &\quad\to \text{transport recentering}\\
    &\quad\to \text{exactness / filtration classifier}\\
    &\quad\to \text{shuffle-Hopf survivor extraction}\\
    &\quad\to \text{deformation-geometry export}\\
    &\quad\to \text{drain inequality}.
    \end{aligned}
    \]

    It is currently an endgame program, not a closed proof. Its value is that it
    keeps the tower algebra, survivor dictionary, and deformation drain in the
    right order.

    The tower still has the form

    \[
    V_{n+1}=L_n-M_n.
    \]

    The exponential generating series

    \[
    \mathcal V_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}V_n,
    \qquad
    \mathcal P_\rho:=\sum_{n\ge0}\frac{\rho^n}{n!}P_n
    \]

    collapses the binomial spread exactly:

    \[
    \partial_t\mathcal V_\rho
    +
    (\mathcal V_\rho\cdot\nabla)\mathcal V_\rho
    +
    \nabla\mathcal P_\rho
    =
    \nu\Delta\mathcal V_\rho.
    \]

    This is the reason the shuffle/Hopf language belongs in the middle of the
    route: the binomial tower is a coproduct-like spread, and the real question is
    which part of that spread is composite and which part survives in the quotient.

    On the signed lifted-band side, the live packet is already concrete. The
    mesoscopic commutator density has the form

    \[
    \mathfrak c_\ell(x,t)
    :=
    \ell^{-2}u_\ell(x,t)
    [Q_\ell,b_\ell^{meso}(t)\cdot\nabla]u(x,t),
    \]

    \[
    b_\ell^{meso}:=P_{\le c/\ell}u-P_{\le 2^{N+M}}u,
    \qquad
    N+M<k<j-4.
    \]

    The current theorem surface reduces the middle-band far-corona portion to a
    one-sided square / Carleson problem on a coupled two-scale density. In the
    notation of the six-lemma mainline, this is the far-corona theorem
    \((19n8)\), equivalently the cumulative-tail stress theorem \((CTS)\) or its
    local engine \((LPAS)\). The same-scale and upper-boundary sides are already
    on the weighted carrier route modulo local frozen-family packaging.

    Thus this program contributes the correct route topology. It does not close the
    global theorem until the survivor quotient is identified, exported into the
    deformation package, and the far-corona theorem is paid.



    \subsection{HWY Instability Attack Packet}

    This packet is an external stress test against the live TPS strong route. It
    does not validate or refute the Hou--Wang--Yang construction. It factors the
    route's possible contradiction against that public claim into local theorem
    slots that can be checked inside this manuscript's machinery.

    The audit packet records the following public input: the Hou--Wang--Yang
    preprint claims infinitely many suitable Leray--Hopf solutions with one compactly
    supported divergence-free datum, produced from a self-similar unstable branch,
    with positive-time smoothness and a location near the Prodi--Serrin uniqueness
    boundary. For this manuscript, the useful test route is

    \[
    \begin{aligned}
    &\text{positive fresh angular }\lambda_{2,J}^+\text{ feed}\\
    &\quad\Longrightarrow \text{strain gain}\\
    &\quad\Longrightarrow \text{branch readout}\\
    &\quad\Longrightarrow \text{same-datum uniqueness in the entry class}.
    \end{aligned}
    \]

    The first downstream implication is theorem-grade on the route: a positive
    fresh angular \(\lambda_{2,J}^+\) feed enters \(SG.4\), and \(SG.4\) gives the
    coarse/true shadow exclusion once the required barrier or renewal hypotheses
    are present.

    One local formulation is:

    Fix one branch \(u\), one dyadic scale \(J\), and one strip
    \(I=[t_0,t_1]\). Suppose a refined good-pair family carries fresh angular
    sub-arcs \(I_{ab}^{ang}(t)\), a transported expanding bundle, and a lower
    envelope \(\underline\lambda_J(t)\) with

    \[
    |I_{ab}^{ang}(t)|
    \ge
    \mu_J^{ang}(t)\chi_{ab}^{fresh}(t),
    \]

    \[
    \lambda_{2,J}^+(\gamma_{ab}(\theta,t),t)
    \ge
    \underline\lambda_J(t),
    \]

    and with the angular alignment defect absorbed into the coarse angle-defect
    ledger. Then

    \[
    g_J^{fresh,\angle}(t)
    \ge
    c_\angle\,\mu_J^{ang}(t)\,\underline\lambda_J(t),
    \]

    So the branch enters the fresh-angle feed packet. A one-sided defect route can
    also enter the same bridge when

    \[
    \int_I\lambda_J(s)\,ds\ge m_J+\eta.
    \]

    The conditional contradiction theorem then has a clear shape. Let
    \(u^{(1)}\) and \(u^{(2)}\) be Leray--Hopf solutions with the same datum
    \(u_0\), smooth on positive-time compact intervals. If both branches enter the
    same \(BR.\lambda2\) continuation class on an initial window and the datum has
    uniqueness inside that entry class, then the two branches agree on the window
    and classical positive-time uniqueness propagates equality afterward.

    The exact initial-window class recorded by the packet is

    \[
    \mathcal X_{\lambda_2}^0(u_0,\tau)
    \]

    consisting of Leray--Hopf solutions on \([0,\tau]\) with datum \(u_0\), smooth
    on every compact subinterval of \((0,\tau]\), and satisfying

    \[
    \lambda_2^+(u)\in L_t^2\dot B^{-1}_{\infty,\infty}((0,\tau]).
    \]

    Two gaps remain on this attack surface. First, the manuscript has not proved
    that the public self-similar unstable branch supplies positive-measure fresh
    angular sub-arcs carrying the lower envelope for \(\lambda_{2,J}^+\). Second,
    outside known Barker-type datum classes, the manuscript still needs a
    zero-time uniqueness-entry theorem inside
    \(\mathcal X_{\lambda_2}^0(u_0,\tau)\), or a proved embedding of that class into
    a known weak-strong uniqueness class. This stress test is useful because it
    locates those exact theorem slots; it is not a closed contradiction to the
    external construction.


