      The attempted replay

      \[
      \text{HFG}\Rightarrow
      \text{Pack+Part+Field+\(\mathfrak A_{N,Q}\)}
      \Rightarrow
      \text{six-burden production}
      \]

      requires weighted carrier closure.  That closure is still blocked by
      LPAS/active-square Carleson.  The square-source branch fails because the
      universal square-source estimate for \(F_j\) has fixed-shell cubic amplitude
      scaling.

      The replacement input is one of:

      \[
      \begin{gathered}
      \text{square-source estimate under active-interval normalization,}\\
      \text{active-shell amplitude theorem,}\\
      \text{direct active-square Carleson,}\\
      \text{direct LPAS.}
      \end{gathered}
      \]

      Until one of these is paid, this branch cannot promote HFG.

