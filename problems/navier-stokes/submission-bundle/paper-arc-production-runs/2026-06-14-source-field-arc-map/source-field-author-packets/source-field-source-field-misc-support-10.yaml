      \subsection{Holonomy-Refinement Projector Spectral Realization Theorem}

      This theorem pays one precise structural bill in the readout/export route. It
      turns the finite-scale holonomy/refinement selectors already present in the
      direct-limit carrier package into an honest spectral truncation family on the
      persistent carrier.

      Let \(K_D(j)\) be the closed image in \(K_D\) of the dyadic scale carrier
      \(K_{2^j}\), and let
      \[
      \mathbb H_D(j):K_D\to K_D(j)
      \]
      be the orthogonal projector. The finite-scale refinement package gives the
      nested carrier relation

      \[
      K_D(j) \subseteq K_D(j+1),
         \qquad
         \mathbb H_D(j)\mathbb H_D(j+1)=\mathbb H_D(j);
      \]

      and carrier completeness gives strong convergence

      \[
      \mathbb H_D(j)Y \to Y
         \qquad
         \forall Y\in K_D;
      \]

      Define the orthogonal slices
      \[
      S_j:=\mathbb H_D(j)-\mathbb H_D(j-1).
      \]
      The slices are mutually orthogonal projections and sum strongly to
      \(I_{K_D}\). The coherent generator is the spectral-series operator

      \[
      D_{\mathrm{coh}}Y:=\sum_j 2^jS_jY,
      \qquad
      \operatorname{Dom}(D_{\mathrm{coh}})
      :=
      \Big\{Y\in K_D:\sum_j 2^{2j}\|S_jY\|^2<\infty\Big\}.
      \]

      Then \(D_{\mathrm{coh}}\) is positive self-adjoint on \(K_D\), and the
      original threshold projectors are exactly its spectral cutoffs:

      \[
      \mathbb H_D(j)=\mathbf 1_{[0,2^j]}(D_{\mathrm{coh}}).
      \]

      This closes the thresholded selector-realization problem used by the export
      route. The closed claim is deliberately local: it concerns the refinement-indexed
      family on \(K_D\). It does not identify every unthresholded abstract occurrence
      of \(\mathbb H_D\) with an ambient whole-space spectral projector.


