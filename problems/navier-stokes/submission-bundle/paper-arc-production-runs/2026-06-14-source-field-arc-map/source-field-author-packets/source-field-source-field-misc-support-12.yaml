      \subsection{Localized Projector Coarse Overlap Is an F.1 Consumer}

      The coarse normalized-kernel overlap route consumes only the retained-cover /
      bounded-overlap side governed by (F.1). It does not consume the whole retained
      family packet V3.

      \[
      \frac{16N_\Lambda^2M_{\mathrm{sub}}}{\overline\gamma_\ast^2}
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k).
      \]

      This quantity belongs to the F.1 side of the retained-family packet, not to the
      observation/error series (F.6)--(F.7).

      \[
      \sum_k\int_{\mathcal J_k}\mathcal B_{J,\beta}^{force}(a,b;I_k)\,d\mu_J^{pair}
      \le
      N_{\mathrm{ov}}
      \int_{\mathcal J}\int_I
      \frac{\beta_J(a,b,t)^2}{g_J(a,b,t)}
      \,dt\,d\mu_J^{pair}(a,b).
      \]

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k).
      \]

      \[
      \mathrm{Overlap}_{J,\mathrm{coarse}}
      \le
      \frac{16N_\Lambda^2M_{\mathrm{sub}}}{\overline\gamma_\ast^2}
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k).
      \]

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k)
      \le
      N_{\mathrm{ov}}\,|I|\,\mu_J^{pair}(\mathcal J),
      \]

      Fine mode keeps the kernel geometry and pays one localizer-modulus /
      center-spacing theorem. Coarse mode normalizes the kernels and hands the
      overlap price to the retained-cover / bounded-overlap side. The status is a
      routing reduction only: (F.1) is still an upstream theorem wall, and V3 remains
      available downstream where the full retained-family packet is needed.


