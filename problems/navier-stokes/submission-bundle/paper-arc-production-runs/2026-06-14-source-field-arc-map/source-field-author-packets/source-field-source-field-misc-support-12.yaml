      \subsection{Localized Projector Coarse Route Bypasses Force-Ceiling Via Angular-Forcing Record}

      The older exact-potential synchronization packet used a force-ceiling wall. On
      the installed localized-projector packet, the drift side has a sharper
      angular-forcing reduction:

      \[
      \varepsilon_\ell
      \le
      e^{-\frac{\gamma_\ast}{2}\tau_\ell}X_\ell
      +
      \varepsilon_\ell^{force},
      \]

      \[
      \sum_\ell m_\ell\varepsilon_\ell^{force}
      \le
      \frac{2N_{\mathrm{cov}}}{\gamma_\ast}
      \int_I\int_{\mathcal J}\frac{\beta_J(a,b,t)^2}{g_J(a,b,t)}
      \,d\mu_J^{pair}(a,b)\,dt,
      \]

      \[
      \int_I\int_{\mathcal J}\mathcal M_\Lambda X\,d\mu_J^{pair}\,dt
      +
      \int_I\int_{\mathcal J}\frac{\beta_J(a,b,t)^2}{g_J(a,b,t)}
      \,d\mu_J^{pair}(a,b)\,dt
      \le
      C\bigl(\mathcal E_J^{obs}(I)+\mathrm{Err}_{J,\mathrm{pair}}(I)\bigr)
      \]

      This bypasses the separate force-ceiling theorem on the coarse localized route.
      The route still needs the entrance envelope, pair-family angular-forcing
      record, and coverage/summability packet. Its gain is that the drift side is
      charged in the sharper \(\beta_J^2/g_J\) currency.


