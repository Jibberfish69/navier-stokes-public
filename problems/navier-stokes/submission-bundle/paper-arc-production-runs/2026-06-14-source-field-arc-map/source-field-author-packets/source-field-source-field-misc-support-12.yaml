      \subsection{Localized Projector Coarse Overlap Is a Familywise Summability Consumer}

      The coarse normalized-kernel overlap route consumes the same scalar summability
      wall that prices the retained drift windows against
      \(\mathcal E_J^{obs}+\mathrm{Err}_{J,\mathrm{pair}}\).

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k).
      \]

      \[
      \mathrm{Overlap}_{J,\mathrm{coarse}}
      \le
      \frac{4N_\Lambda^2M_{\mathrm{sub}}}{\gamma_\ast^2}
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k),
      \]

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k)
      \le
      C\bigl(\mathcal E_J^{obs}+\mathrm{Err}_{J,\mathrm{pair}}\bigr).
      \]

      \[
      \mathrm{Overlap}_{J,\mathrm{coarse}}
      \le
      C'\bigl(\mathcal E_J^{obs}+\mathrm{Err}_{J,\mathrm{pair}}\bigr),
      \]

      The status is a scalar-wall identification. Coarse overlap carries no
      independent geometric wall after this reduction; the live burden is the same
      familywise summability theorem already isolated by the older exact-potential
      synchronization packet after local force-ceiling.


