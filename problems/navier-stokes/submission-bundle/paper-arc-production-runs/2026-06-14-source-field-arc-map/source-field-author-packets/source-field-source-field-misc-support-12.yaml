      \le
      C\bigl(\mathcal E_J^{obs}(I)+\mathrm{Err}_{J,\mathrm{pair}}(I)\bigr).
      \]

      Fine mode pays a maximal-envelope entrance theorem, D.7ie1/D.7ie3, and a
