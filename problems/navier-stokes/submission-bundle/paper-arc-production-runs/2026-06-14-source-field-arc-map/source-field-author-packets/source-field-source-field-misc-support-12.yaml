      \subsection{Live Frontier Honest-Cut Reduction}

      The older TPS / exact-potential honest-cut survives as branch-local
      downstream/readout context. It is not the current argument-wide frontier.

      On the Euclidean strict-shadow branch, the exact strict-shadow hypotheses make
      both \(\mathrm{ShadowDef}(X)\) and \(E^{sh}(X)\) vanish. The remaining Route A
      burdens are full-data lift coverage, exact Euclidean strict shadow, and global
      Euclidean carrier control. On the realized classical carrier, the first two
      collapse, leaving the carrier control burden on that realized subbranch.

      The one TPS-local theorem wall is the selector-adapted defect-to-strain
      theorem. Inside the preserved exact-potential branch, this splits into the
      cycle-exact polarization/alignment theorem that turns signless \(W_J\) into a
      one-sided directional deficit, and the normal-covector sufficient upgrades
      recorded by the PSJ+ and PSJ+.1 refinements.

      The status is historical support. These refinements remain valid theorem
      material, but under the current class-membership edge they are downstream
      readout context rather than seven independent live frontier lemmas.


