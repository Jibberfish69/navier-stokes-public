    On the installed localized-projector packet, the sharpest coarse-route endpoint
    is the retained-cover counting theorem

    \[
    \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k);
    \]

    \[
    \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k)
    \le
    C\bigl(\mathcal E_J^{obs}(I)+\mathrm{Err}_{J,\mathrm{pair}}(I)\bigr).
    \]

    This is the scalar theorem whose proof would close the minimal coarse route.
    The paper keeps it separate from the stronger fine route so the reader can see
    which theorem is actually being used.


