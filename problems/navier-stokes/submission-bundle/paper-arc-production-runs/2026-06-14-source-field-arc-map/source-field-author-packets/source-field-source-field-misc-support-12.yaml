      \subsection{Localized Projector Angular-Forcing Record Reduction}

      The localized-projector forcing side is sharpened by replacing the coarse
      time-dependent linear \(J\)-forcing convolution with the exact angular-forcing
      density

      \[
      \frac{\beta_J(a,b,s)^2}{g_J(a,b,s)},
      \]

      \[
      g_J(a,b,s)\ge \gamma_\ast>0;
      \]

      \[
      \varepsilon_{J,\mathrm{sync}}^{loc}(x,t)
      \le
      e^{-\frac{\gamma_\ast}{2}\tau_{x,t}}\,q_\ast(x,t)
      +
      \frac{1}{m_J(x,t)}
      \int
      w_{J,x,t}(a,b)
      \int_{t-\tau_{x,t}}^{t}
      e^{-\frac{\gamma_\ast}{2}(t-s)}
      \frac{\beta_J(a,b,s)^2}{g_J(a,b,s)}
      \,ds\,
      d\mu_J^{pair}(a,b).
      \]

      \[
      g_J(a,b,s)\ge \gamma_\ast>0
      \qquad\text{on every }\Lambda_\ell.
      \]

      \[
      \varepsilon_{\ell}^{force}
      :=
      \frac{1}{m_\ell}
      \int
      w_\ell(a,b,t)
      \int_{t-\tau_\ell}^{t}
      e^{-\frac{\gamma_\ast}{2}(t-s)}
      \frac{\beta_J(a,b,s)^2}{g_J(a,b,s)}
      \,ds\,
      d\mu_J^{pair}(a,b)\,dt.
      \]

      The adiabatic localized forcing side is then charged to the installed record
      D.7ie3. There are two entrance routes. On the material-gap route, the remaining
      globalization wall is the entrance envelope \(q_J^{mat}\), the pair-family
      forcing record D.7ie1, and the coverage packet. On the auxiliary-projector
      route, the same role is played by \(q_J^{aux}\), D.7ie1, and the coverage
      packet.

      The status is reduction-closed for the local forcing expression. The remaining
      forcing debt is not a new local theorem; it is the already recognized
      pair-family forcing budget plus the coverage packet that transports local
      window estimates into the global synchronization channel.


