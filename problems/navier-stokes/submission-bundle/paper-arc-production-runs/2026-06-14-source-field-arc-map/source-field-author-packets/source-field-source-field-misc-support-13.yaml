      \subsection{Localized Projector Coarse Route Reduces to Force-Ceiling Plus Familywise Summation}

      Viewed from the older exact-potential synchronization packet, the same coarse
      route reduces to two upstream walls: the force-ceiling/entrance side and the
      familywise source summation side.

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k);
      \]

      \[
      \sum_\ell
      \bigl(\mathbf B_{\ell,\mathrm{proj}}^{ent}+\kappa_\ell\bigr)\,
      \nu_J(\Lambda_\ell)
      +
      \frac{1}{\gamma_\ast^2}
      \sum_{(\ell,\ell')\in\mathcal O_\Lambda}
      \Bigl(
      \operatorname*{ess\,sup}_{\Lambda_\ell\cap\Lambda_{\ell'}}
      \varepsilon_{\ell\ell'}^{sur}
      \Bigr)^2
      \nu_J(\Lambda_\ell\cap\Lambda_{\ell'})
      \le
      C\bigl(\mathcal E_J^{obs}(I)+\mathrm{Err}_{J,\mathrm{pair}}(I)\bigr);
      \]

      Overlap no longer survives as an independent scalar geometry burden. This
      section records the older-packet view of the same route: the remaining theorem
      content is exactly that two-part wall, and the current localized-projector
      branch has not paid those packets here.


