      \subsection{Localized Projector-Moment Concentration Implies Pair Suppliers}

      This is a support reduction on the exact-potential simple-top branch. Its job is
      to say what the pair supplier would need from the localized projector-moment
      surrogate. The earlier scalar top-direction test is useful as a diagnostic, but
      it is not a separate theorem wall once the surrogate is normalized
      operator-close to the cocycle-side strain block.

      \[
      \Pi_J^{pair}
      :=
      \Pi_{\max}\!\bigl(T_J^{pair}\bigr),
      \]

      \[
      \tau_{J,1}^{pair}:=\lambda_1(T_J^{pair}).
      \]

      \[
      \rho_J^{pair}:=\operatorname{tr}(\Pi_J^{pair}S_J^N),
      \qquad
      \mathcal B_J^{pair}:=(I-\Pi_J^{pair})S_J^N\Pi_J^{pair},
      \]

      \[
      \delta_J^{sur}
      :=
      \frac{\|S_J^N-T_J^{pair}\|_{\mathrm{op}}}{g_J^{str}},
      \qquad
      g_J^{str}:=\lambda_{J,1}^{top}-\lambda_{J,2}^{top}.
      \]

      The desired supplier is the weighted smallness of \(\delta_J^{sur}\). By the
      Davis-Kahan projector estimate, this controls the top pair projector on the
      simple-gap region:

      \[
      d_{\mathrm{proj}}\!\bigl(
      \Pi_J^{pair},\Pi_{\max}(S_J^N)
      \bigr)
      \le
      C\,\delta_J^{sur}.
      \]

      It also controls the off-diagonal and Rayleigh defects

      \[
      \delta_{J,\mathrm{pair}}^{off}
      :=
      \frac{\|\mathcal B_J^{pair}\|_F}{g_J^{str}},
      \qquad
      \delta_{J,\mathrm{pair}}^{ray}
      :=
      \frac{
      \bigl[\kappa_0 g_J^{str}-(\rho_J^{pair}-\lambda_{J,2}^{top})\bigr]_+
      }{
      g_J^{str}
      }.
      \]

      For the Rayleigh side, choose a measurable unit vector
      \(e_J^{pair}\in\operatorname{ran}\Pi_J^{pair}\). Then
      \(\rho_J^{pair}=\langle S_J^N e_J^{pair},e_J^{pair}\rangle\). The spectral
      gap converts the same operator error into a deficit estimate for
      \(\delta_{J,\mathrm{pair}}^{ray}\). Thus this subroute reduces the pair-level
      supplier wall to one normalized operator-concentration theorem for
      \(T_J^{pair}\) against \(S_J^N\). This is a sufficient reduction only; it does
      not replace the later averaged projector dynamics and moment-closure supplier.


