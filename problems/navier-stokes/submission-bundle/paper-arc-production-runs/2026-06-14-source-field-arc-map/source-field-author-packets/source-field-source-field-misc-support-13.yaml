      \subsection{Localized Projector Kernel Mismatch Implies Overlap Surrogate}

      The overlap-mismatch box is abstract until it is tied to the actual localized
      projector. On this route, each local positive-semidefinite section is a
      positive weighted average of the same rank-one projectors. The mismatch is a
      kernel-mismatch problem, not a new spectral phenomenon.

      Fix one active overlap point \(z=(a,b,t)\). On the overlap of two active local
      windows \(\ell\) and \(\ell'\), assume one common packet space
      \(\mathcal P_J(z)\), one fixed reference measure \(\bar\nu_{J,z}\), and one
      common measurable rank-one projector field

      \[
      P_J(z,p),
      \qquad
      \|P_J(z,p)\|_{\mathrm{op}}=1
      \qquad
      \text{for }\bar\nu_{J,z}\text{-a.e. }p\in\mathcal P_J(z).
      \]

      \[
      \widetilde S_{J,\ell}(z)
      =
      \int_{\mathcal P_J(z)}
      \lambda_{J,\ell}(z,p)\,P_J(z,p)\,d\bar\nu_{J,z}(p),
      \]

      \[
      \widetilde S_{J,\ell'}(z)
      =
      \int_{\mathcal P_J(z)}
      \lambda_{J,\ell'}(z,p)\,P_J(z,p)\,d\bar\nu_{J,z}(p),
      \]

      \[
      m_{J,\ell}(z)
      :=
      \int_{\mathcal P_J(z)}\lambda_{J,\ell}(z,p)\,d\bar\nu_{J,z}(p),
      \qquad
      m_{J,\ell'}(z)
      :=
      \int_{\mathcal P_J(z)}\lambda_{J,\ell'}(z,p)\,d\bar\nu_{J,z}(p),
      \]

      \[
      \vartheta_{J,\ell}(z,p):=\frac{\lambda_{J,\ell}(z,p)}{m_{J,\ell}(z)},
      \qquad
      \vartheta_{J,\ell'}(z,p):=\frac{\lambda_{J,\ell'}(z,p)}{m_{J,\ell'}(z)},
      \]

      Normalize the two sections by their masses. Then

      \[
      \left\|
      \frac{\widetilde S_{J,\ell}(z)}{m_{J,\ell}(z)}
      -
      \frac{\widetilde S_{J,\ell'}(z)}{m_{J,\ell'}(z)}
      \right\|_{\mathrm{op}}
      \le
      \int_{\mathcal P_J(z)}
      \bigl|
      \vartheta_{J,\ell}(z,p)
      -
      \vartheta_{J,\ell'}(z,p)
      \bigr|
      \,d\bar\nu_{J,z}(p).
      \]

      On the exact PSJ+.1 realization, the overlapping packets use the same selector,
      pair-length window, and confidence weight. Their difference comes from the
      spatial kernels. This reduces overlap mismatch to a kernel-weight comparison,
      which is handled by the localizer-modulus estimate in the next section.


