      \subsection{Aact Global Promotion Audit}

      On each selected cylinder, \(ATD_m\) supplies the finite-depth averaged affine
      tower packet. The local averaged budget audit gives

      \[
      X_R\in L^\infty,
      \qquad
      N_R\in L^1,
      \qquad
      \mathcal K_{\le m}^{avg,R}\in L^1.
      \]

      The promotion uses only the local moving-frame, pressure, cutoff, core,
      top-viscous, tower, and nonlinear records supplied by \(ATD_m\) and
      \(SCF^{avg}_m\).

      \[
      B_*:=\sum_{j,p}\mathbf 1_{I_j}B_{j,p},
      \qquad
      F_*:=\sum_{j,p}\mathbf 1_{I_j}F_{j,p}
      \]

      \[
      \mathrm{Jump}_{\mathrm{avg}}.
      \]

      The audit result is narrow: no hidden circular dependency remains inside the
      cover, scheduler, and globalization chain once the no-\(\mathrm{Jump}_{avg}\)
      cover and restart seeds are available.


