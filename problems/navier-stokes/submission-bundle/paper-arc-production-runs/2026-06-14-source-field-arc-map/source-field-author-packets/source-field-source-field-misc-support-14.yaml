      \subsection{Aact Global Finite Cover Scheduler Attempt}

      The averaged ACT globalization starts from local data. On each SCF-good moving
      cylinder \(Q_R^\Phi\), the installed local packet gives

      \[
      X_R\in L^\infty(I_R),
      \qquad
      N_R\in L^1(I_R),
      \qquad
      \mathcal K_{\le m}^{avg,R}\in L^1(I_R).
      \]

      \[
      \mathcal G_{\varepsilon_m}^{\Phi}
      :=Q^\Phi\setminus\mathcal B_{\varepsilon_m}^{\Phi}.
      \]

      \[
      \mathcal B_{\varepsilon_m}^{\Phi}\cap\mathcal T\ne\varnothing
      \Longrightarrow
      \mathrm{Jump}_{\mathrm{avg}}(\mathcal T)
      \]

      On a no-\(\mathrm{Jump}_{avg}\) branch, this gives a positive SCF-good radius
      at each terminal-tail point.

      \[
      [t_0,T_0]\subset [t_0,T_*),
      \]

      Pointwise good-cylinder existence is weaker than the needed terminal scheduler.
      The proof must control the whole half-open approach window

      \[
      [t_0,T_*).
      \]

      The inputs in this attempt do not give a finite cover of that window, a uniform
      positive lower radius, or a summable scheduler majorant. That is the failure
      record for the first finite-cover attempt.


