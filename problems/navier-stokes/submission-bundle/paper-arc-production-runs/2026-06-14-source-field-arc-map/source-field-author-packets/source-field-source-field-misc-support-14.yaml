      \subsection{Aact Global From Tgc A Discharge}

      The \(Tgc.A\) input strengthens pointwise good-cylinder existence into the
      strict terminal cover/scheduler form needed on the no-\(\mathrm{Jump}_{avg}\)
      branch. It supplies finitely many retained moving cylinders with a uniform
      lower radius and finite overlap.

      \[
      X_j(s_j)\le\eta_X,
      \qquad
      X_j\in L^\infty(I_j),
      \qquad
      N_j\in L^1(I_j),
      \qquad
      F_j\in L^1(I_j),
      \qquad
      \mathcal K_{\le m,j}^{avg}\in L^1(I_j).
      \]

      \[
      D^+X_{j,p}+cN_{j,p}
      \le
      B_{j,p}X_{j,p}+C_{j,p}X_{j,p}^{1/2}N_{j,p}+F_{j,p},
      \]

      \[
      B_{j,p}=1+A_{j,p}+V_j+P_j\in L^1(I_j),
      \qquad
      F_{j,p}\in L^1(I_j).
      \]

      \[
      B_*(t):=\sum_{j,p}\mathbf 1_{I_j}(t)B_{j,p}(t),
      \qquad
      F_*(t):=\sum_{j,p}\mathbf 1_{I_j}(t)F_{j,p}(t).
      \]

      \[
      B_*,F_*\in L^1([t_0,T_*)).
      \]

      This discharges the scheduler structure on the good branch. It does not remove
      \(\mathrm{Jump}_{avg}\); that endpoint face remains downstream.


