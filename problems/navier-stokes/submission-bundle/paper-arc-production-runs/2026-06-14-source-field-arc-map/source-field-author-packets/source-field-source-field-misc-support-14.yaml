      \subsection{Lower-Prefix Active-Square Theorem}

      If CTS is not proved directly in its continuum form, the inherited Euclidean
      inputs reduce it to one precise dyadic weighted object. LPAS packages that
      object as its own theorem target.

      \[
      D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2,
      \qquad
      E_j(t):=2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      Fix the separation constant \(C_1\) coming from the far-corona lower bound
      \(r\le C_{\mathrm{sf},12348} 2^{-j-C_1}\). Define the lower-prefix \(H^1\) energy by

      \[
      \mathcal P_j^{\downarrow}(t)
      :=
      \sum_{k\le j-C_1}E_k(t).
      \]

      This is the exact cumulative lower-frequency \(H^1\) energy seen by the active
      shell \(j\) in the direct CTS reduction. LPAS asks that

      \[
      \text{lower-prefix }H^1\text{ energy cannot accumulate against the active-shell square.}
      \]

      SDS controls upper-tail queues, UTKD controls upper-tail kernelized dissipation
      queues, and PCI controls paired upper-tail carriers. LPAS has the opposite
      orientation:

      \[
      \mathcal P_j^{\downarrow}(t)\cdot 2^{-j}D_j(t)^2.
      \]

      \[
      \mathcal P_j^{\downarrow}(t)\,2^{-j}D_j(t)^2
      =
      \sum_{k\le j-C_1}
      2^{-2k-j}D_k(t)D_j(t)^2.
      \]

      This is a lower-prefix/active-square interaction. The installed SDS queue and
      the downstream UTKD/PCI packets control upper-tail objects in which the active
      index is paired with shells above it. They do not change the orientation of the
      interaction and do not discharge LPAS.

      LPAS is not a vague Carleson stand-in. It is the exact dyadic weighted
      object left by the direct CTS reduction.


