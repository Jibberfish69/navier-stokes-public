    text: |+
      \subsection{Material-Derivative Tower Preliminary Algebra Note}

      \[
      D_t:=\partial_t+u\cdot\nabla.
      \]

      The material derivative is useful bookkeeping, but it does not remove the
      source of the derivative tower. It absorbs the visible transport term at the
      base level and then returns the same difficulty through commutators.

      \[
      D_t u + \nabla p = \nu\Delta u.
      \]

      This is the bottom-level absorption. The price reappears when spatial
      derivatives are taken:

      \[
      [D_t,\partial_i]f
      =
      -(\partial_i u)\cdot\nabla f.
      \]

      \[
      [D_t,\partial^\alpha]f
      =
      -\!\!\!\sum_{0<\beta\le\alpha}
      c_{\alpha,\beta}\,
      (\partial^\beta u\cdot\nabla)\partial^{\alpha-\beta}f.
      \]

      \[
      [D_t,\nabla]f
      =
      -(\nabla u)^\top \nabla f,
      \]

      Spatial differentiation brings it back through this commutator.
      Iterating \(D_t\) through spatial derivatives, viscosity, and pressure produces
      strain-weighted commutator terms. This reformulation can clarify that the
      active source is a strain/commutator interaction rather than bare transport,
      but it does not simplify the full proof. The binomial derivative tower becomes
      a commutator tower, and the viscous rung no longer appears as a clean linear
      input without the extra commutator records.


