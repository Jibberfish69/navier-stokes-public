      \subsection{Low-Shell Amplitude Domination Assessment Result}

      \[
      X_A:=Ae.
      \]

      A record that measures only higher-order defects, collar errors, or normalized
      residuals has no automatic control of \(M_{\mathrm{low}}\).

      The sharper domination theorem \(M_{\mathrm{low}}\le C_{\mathrm{sf},12326} C\) is available
      exactly when the original lower-order record already controls finite low-shell
      amplitude. The finite nature of the block reduces the burden to finitely many
      amplitudes; it does not create amplitude domination on its own.

      If the original record already contains or dominates low-shell amplitude, keep
      the original record. Otherwise the route uses the extended low-shell record.


