      \subsection{Aact Global Nojump Finite Cover Scheduler Theorem Avg End A}

      This is the theorem-facing hardening of the averaged ACT globalization step on
      the no-\(\mathrm{Jump}_{avg}\) branch. Assume a finite terminal cover

      \[
      \mathcal Q_j=Q_{r_j}^{\Phi}(a_j,t_j),
      \qquad 1\le j\le J,
      \]

      \[
      X_{j,p}(s_{j,p})\le\eta_X,
      \qquad
      F_{j,p},B_{j,p}\in L^1(I_j),
      \]

      \[
      D^+X_{j,p}+cN_{j,p}
      \le
      B_{j,p}X_{j,p}+C_X X_{j,p}^{1/2}N_{j,p}+F_{j,p}.
      \]

      \[
      X_{j,p}\in L^\infty,
      \qquad
      N_{j,p}\in L^1,
      \qquad
      \mathcal K_{\le m,j,p}^{avg}\in L^1.
      \]

      \[
      B_*,F_*\in L^1([t_0,T_*)).
      \]

      With the restart seeds in place, the first-exit inequality closes on each cell.
      Integrating the local inequality gives the averaged receiver bounds on the
      whole retained terminal window. The theorem is a good-side scheduler theorem,
      not a proof that the jump branch is absent.


