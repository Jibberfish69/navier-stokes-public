      \subsection{Navier-Stokes Main Theorem Draft}

      The appendix is aimed at the standard whole-space Clay statement: for smooth
      divergence-free rapidly decaying initial data \(u_0\) on \(\mathbb R^3\), with
      no forcing, the classical solution of
      \[
      \partial_tu+u\cdot\nabla u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(0)=u_0
      \]
      continues smoothly for all positive time. The proof surface is the original
      Euclidean equation. Filtered flows, geometric reformulations, compactness
      carriers, and regularized branches count only after they return to this same
      PDE without adding coercive structure that the original equation does not have.

      The present proof route separates the ingredients. Energy and enstrophy are
      necessary background controls, but they do not by themselves rule out
      concentration at shrinking scales. The missing scale input is a dyadic tail or
      flux estimate on the original equation strong enough to stop a persistent
      high-frequency cascade. In this route that missing input is the scale-cubic
      tail absorption lemma. Its reduction is explicit, while the strict low-mode,
      spill, and genuine high-high packet steps still require theorem-grade payment.

      Once the scale input is supplied, it feeds two consumers. First, it upgrades the
      classical approximation carrier to the local strong compactness needed to pass
      the nonlinear tensor \(u^{(n)}\otimes u^{(n)}\to u\otimes u\). Second, it feeds
      the Euclidean gradient mechanism used by the continuation readout. The
      compactness package is now a fixed consumer of that upstream scale input, not
      an independent proof frontier.


