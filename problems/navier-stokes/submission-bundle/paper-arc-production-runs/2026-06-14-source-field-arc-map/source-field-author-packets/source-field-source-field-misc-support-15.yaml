      \subsection{Aact Kx Local Absorption Repaired Bootstrap Lemma Aact Kx}

      Let \(X_R(t)\) denote the averaged affine-excess control variable and \(N_R(t)\)
      its dissipative term on an averaged ACT interval \(I\). Assume the repaired
      local budget has the form
      \[
      D^+X_R+cN_R
      \le
      B_RX_R+C_*X_R^{1/2}N_R+F_R,
      \qquad
      B_R,F_R\in L^1(I).
      \]

      If \(X_R(s)\le\eta\), \(2C_*\eta^{1/2}\le c/4\), and the scheduler cell makes
      the Gronwall factor and forcing contribution small enough, the bootstrap
      improves from \(\sup_JX_R\le4\eta\) to \(\sup_JX_R\le2\eta\).

      Inside the bootstrap region, \(X_R^{1/2}\le2\eta^{1/2}\). The choice of
      \(\eta\) controls the \(N_R\)-coefficient pointwise. The remaining inequality
      has only \(L_t^1\) coefficients multiplying \(X_R\) or entering additively, so
      Gronwall applies without pointwise bounds on \(B_R\) or \(F_R\). The scheduler
      condition supplies the bootstrap improvement, and continuity closes the local
      interval.

      This repairs the specific audit defect: \(L_t^1\) smallness is no longer used
      to absorb a coefficient multiplying \(N_R\). Absorption is obtained from
      pointwise smallness of \(X_R\), produced by the restart seed plus continuity
      bootstrap.


