    text: |+
      \subsection{Active-shell amplitude gain from Original Smooth Data - failed discharge}

      This failed discharge tests whether Original Smooth Data alone gives the
      active-shell amplitude gain needed upstream of the scale-normalized
      \(\nu\)-SCF Carleson estimate.

      Original Smooth Data gives smoothness on every compact interval before the
      terminal time. Each fixed shell amplitude is finite on \([0,T]\) for every
      \(T<T_*\), and the energy inequality gives finite raw energy and finite
      dissipation. These facts control fixed shells before the endpoint. The needed
      gain controls moving active shells whose frequencies may drift to infinity as
      \(t\uparrow T_*\). Finite raw energy and compact-before-terminal smoothness do
      not force decay on those moving active shells.


