      \subsection{Active ASAC work plan after No Incoming audit}

      The No Incoming License global.A input was separated and left open. Terminal
      selection alone does not provide full no-incoming parabolic boundary control
      for direct ancient backward uniqueness.

      Anisotropic Backward Uniqueness.A was tested and left as a reserve route requiring

      \[
      \boxed{
      \sum_T g_T^{-2}
      \left|\int_{I_T}\langle R_{j,k},\psi_T\rangle\,dt\right|^2
      \le
      C\int\sum_{q>N}D_q+o_N(1).
      }
      \]

      \[
      \|R\|_{L_t^2H_x^{-1}}^2
      \le C\int\sum_{q>N}D_q+o_N(1)
      \]

      \[
      \left\|\sum_T c_T g_T^{-1}\psi_T\right\|_{L_t^2H_x^1}^2
      \le C\sum_T|c_T|^2.
      \]

      The cleaner support target is Residual Pair.A, because its terms are pressure,
      commutator, cutoff, and off-packet bookkeeping. Weighted Adj Bessel.A is deeper
      packet calculus involving the strain-gauged parametrix.

      \[
      R_{j,k}=R^{comm}+R^{press}+R^{cut}+R^{off}.
      \]

      \[
      \begin{aligned}
      \|R^{comm}\|_{H^{-1}}^2\le C_{\mathrm{sf},13342} D_j,
      &\qquad
      \|R^{press}\|_{H^{-1}}^2\le C_{\mathrm{sf},13344} D_j,
      \\
      \|R^{cut}\|_{H^{-1}}^2\le C_{\mathrm{sf},13346} \nu\|\nabla w_j\|_2^2,
      &\qquad
      \sum_{j>N}\|R_j^{off}\|_{H^{-1}}^2=o_N(1).
      \end{aligned}
      \]

      This support target would supply the dissipation side of Weighted Adj Res.A.
      A failure identifies the exact residual component preventing the drain proof.

      It does not by itself bridge into a licensed Pack/Part/Field face. The CM
      contrapositive program still needs the witness-face integration bridge after
      the source-pulse branch is eliminated.


