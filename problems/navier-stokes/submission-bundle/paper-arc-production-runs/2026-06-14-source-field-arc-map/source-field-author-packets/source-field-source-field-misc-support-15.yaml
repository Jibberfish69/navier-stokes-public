      \subsection{Aact Kx Scheduler Seed Obstruction Aact Kx}

      Local closure from the prior note needs intervals \(J_k\) with
      \[
      X_R(s_k)\le\eta,
      \qquad
      \exp\!\left(\int_{J_k}B_R\right)
      \left(X_R(s_k)+\int_{J_k}F_R\right)\le2\eta.
      \]

      The finite-coverage portion is formal once the seed exists: integrability of
      \(B_R\) and \(F_R\) on a finite retained tail gives a finite partition with
      small Gronwall packets.

      The obstruction is the seed. Carrying forward the previous interval gives only
      a bounded value of \(X_R\). The absorption lemma needs a fresh small averaged
      affine-excess value in the restart frame. The current route needs an added
      seed theorem from \(SCF^{avg}_m\), transported-frame minimization, or a
      finite-cover small-excess selection principle.


