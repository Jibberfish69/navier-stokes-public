      \subsection{Aact Kx Global Nojump Restart Seed Scheduler Dtc A Avg Repair}

      This repair states exactly where the restart seed comes from inside the
      no-\(\mathrm{Jump}_{avg}\) scheduler argument.

      \[
      X_R(s_k)\le\eta_X
      \]

      \[
      \neg \mathrm{Jump}_{\mathrm{avg}}(\mathcal T).
      \]

      \[
      D^+X_{j,p}+cN_{j,p}
      \le
      B_{j,p}X_{j,p}+C_X X_{j,p}^{1/2}N_{j,p}+F_{j,p},
      \]

      \[
      B_{j,p},F_{j,p}\in L^1.
      \]

      \[
      \mathcal T'
      \subset
      \bigcup_{j=1}^{J}Q_{r_j}^{\Phi}(a_j,t_j),
      \qquad
      r_j\ge r_*>0,
      \qquad
      \operatorname{ovlp}\le\Omega.
      \]

      Shrink and color the cover once. The shrunken cover still has a common lower
      radius \(r_*>0\).

      This interior refinement gives room for scheduler restarts. Each restart
      material-time point lies inside a shrunken SCF-good cylinder whose radius is at
      least \(r_*\).

      At a restart time \(\tau_\alpha\), for each active cover element and route
      parameter, choose the fresh same-fluid SCF-good cylinder centered at the
      restart material-time point and shrink it by the \(ATD_m\) factor
      \(\theta_m\).

      This is the restart seed. The seed is produced in the newly chosen restart frame. The previous scheduler cell contributes only completed local packets to the finite-overlap sum.

      The finite scheduler uses the common pair \(B_*,F_*\), so the partition works
      simultaneously for every active cover element and every route parameter.

      The affine pressure, viscous, cutoff, source, and far-pressure records are
      already included in the local \(F_{\alpha,j,p}\) and
      \(\mathcal K^{avg}_{\le m,\alpha,j,p}\) packets. Finite summation preserves
      their \(L^1\) bounds.


