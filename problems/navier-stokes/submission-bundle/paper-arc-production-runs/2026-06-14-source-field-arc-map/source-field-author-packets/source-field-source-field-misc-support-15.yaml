      \subsection{Aact Kx Restart Seed Theorem Hard Obstruction Aact Kx}

      The remaining restart input is the small seed
      \[
      X_R(s_k)\le\eta_X
      \]
      at each scheduler restart. The previous scheduler note reduced finite
      terminal-tail coverage to this seed.

      A valid seed theorem needs a source-backed mechanism: scale selection from
      \(SCF^{avg}_m\), transported-frame minimization, or a finite-cover
      small-excess selection lemma. The current surfaces provide bounded averaged
      control and integrable coefficients, while the absorption repair requires
      small pointwise-in-time averaged affine excess in the chosen restart frame.


