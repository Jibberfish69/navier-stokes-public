    text: |+
      \subsection{Aact Kx Local Averaged Budget Audit}

      \[
      D^+X_R+cN_R
      \le
      B_R X_R+C X_R^{1/2}N_R+F_R
      \]

      \[
      Q_R^\Phi=Q_R^\Phi(a_0,t_0)
      \]

      \[
      \begin{aligned}
      X_R(t)&=\text{averaged affine-subtracted excess},\\
      N_R(t)&=\text{averaged dissipative packet},\\
      A_R(t)&=\text{averaged affine core}.
      \end{aligned}
      \]

      \[
      B_R(t):=1+A_R(t)+V_R(t)+P_R(t),
      \]

      Here \(V_R\) carries moving-frame, cutoff, and viscous-coefficient records,
      while \(P_R\) carries pressure-response coefficients. The forcing packet \(F_R\)
      contains source, residual, harmonic/far-pressure, cutoff, and finite-frame
      remainder records.

      Because the affine mode is subtracted in \(SCF^{base}\), pure center and pure
      affine transport cancel. The remaining frame terms are legal only when the
      scale-normalized frame record is included in \(V_R\) and the residual velocity
      is measured relative to the same affine frame.

      Spatial and temporal derivatives of the transported cutoff produce only bounded
      same-fluid distortion factors and the expected powers of \(R\). Those cutoff
      terms are part of \(F_R\) or lower-order coefficient records.

      The pressure normalization is also bookkeeping, not a new equation. The
      constant gauge has zero gradient, and the affine frame potential has
      finite-depth frame derivatives already carried by the moving-frame record.
      Decompose

      \[
      p=p_R^{loc}+h_R+p_R^{far}.
      \]

      Original-pressure derivatives are later recovered by the fixed-cover Poisson
      readout. The averaged affine core is chosen by the local moment equations and
      is included in \(B_R\). The middle-block estimate comes from the local averaged
      tower packet, not from the desired global conclusion. The viscous rung supplies
      the coercive portion of \(N_R\), and top-viscous data are used as readout/buffer
      data through the \(m+2\) depth provided by \(ATD_m\).


