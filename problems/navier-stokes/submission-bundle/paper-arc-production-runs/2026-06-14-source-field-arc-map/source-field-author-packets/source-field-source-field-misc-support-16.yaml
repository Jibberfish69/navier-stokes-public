    text: |+
      \subsection{Active Direction Equipartition: selected angular mixing attempt}

      The angular-mixing attempt follows the selected-window sign comparison.  The
      question is whether a one-sided positive source carrier can be forced to lose
      alignment by sampling contracting strain directions along the same terminal
      packet family.

      The first mechanism is eigenframe motion.  If the expanding eigenspace rotates
      fast relative to the active packet direction, persistent positive alignment
      should lose coherence.  The installed inputs do not supply source-weighted BV
      or comparable variation control for the eigenframe on the selected terminal
      family.  Preterminal smoothness controls fixed compact intervals; it does not
      give a uniform terminal angular record on the shrinking active windows.

      The second mechanism is coherent-vorticity depletion.  Beltrami-style or
      Constantin-Fefferman-style structure can deplete nonlinear stretching when the
      selected packet enters the required direction-coherent class.  No installed
      theorem produces that class from original smooth data, ASAC, or B ASAC on the
      terminal layer.

      ASAC pays active alignment in the signed/current presentation, and B ASAC gives
      terminal equality and tangent organization.  Those payments do not give
      source-weighted angular equipartition for the one-sided positive carrier.

      The angular route is useful as support because it identifies what a positive
      source pulse would have to evade: rotation of the expanding frame, loss of
      coherence, and Beltrami or vorticity-direction depletion.  It is not a discharge
      of the source wall.  At this resolution, the same live object returns as the
      need for measurable active-shell amplitude gain, temporal thickness, or a
      source-normalized depletion theorem.


