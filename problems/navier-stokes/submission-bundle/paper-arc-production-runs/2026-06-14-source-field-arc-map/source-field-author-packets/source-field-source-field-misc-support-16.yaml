    text: |+
      \subsection{Active-window amplitude gain - hard obstruction}

      This is the window version of the same obstruction. The route needs
      active-window amplitude gain, or an equivalent heat-scale source estimate,
      strong enough to give scale-normalized upper control for the final charge in
      the \(\mathrm{Jump}_{avg}\) branch.

      Under shell-to-window comparison, heat-scale dissipation tail control, and
      summable reserves, the gain converts the active term into the scale-normalized
      Carleson estimate needed for terminal windows.

      Current surfaces supply finite raw mass, finite dissipation, local pressure
      integrability, and source/flux control. These controls allow short active-shell
      pulses or persistent active amplitudes at shrinking scales. Such pulses can
      preserve raw finite mass while breaking the scale-normalized Carleson sum.


