    text: |+
      \subsection{Active shell amplitude gain: zero-thickness pulse attempt}

      Active-shell amplitude gain is tested against the terminal source layer
      selected by the source-pulse branch.  On shell \(j\), the useful one-sided
      inequality has the model form

      \[
      E_j'(t)+c\nu D_j(t)\le F_j(t).
      \]

      If the terminal layer has positive heat-time thickness, persistent stretching
      has to show up as amplitude gain, reserve spend, or drain expenditure.  That is
      the good case for this route: the carrier remains visible long enough for the
      shell ledger to measure what the source did.

      The hard case is a source-balanced pulse on a shrinking terminal layer.  The
      nonlinear source \(F_j\) may balance viscous damping over windows whose
      heat-time length tends to zero.  The pulse can then leave terminal mass while
      the shellwise reserve stays unavailable at the scale needed by the argument.
      This is a thickness problem, not merely a missing name for the source.

      B ASAC supplies equality and tangent organization.  Same-fluid packet
      accounting supplies lineage and legal routing.  Neither input normalizes the
      trilinear source amplitude or creates a positive shellwise reserve on the
      zero-thickness sequence.

      Active-shell amplitude gain remains open.  The blocking model is the
      zero-thickness source-balanced terminal pulse: source and damping can balance on
      thinner and thinner heat-time windows, leaving a terminal residue without a
      measured amplitude-gain payment.


