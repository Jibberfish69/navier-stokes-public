    text: |+
      \subsection{Active-shell amplitude gain from Original Smooth Data - frontier-loop failure note}

      The desired gain would imply scale-normalized \(\nu\)-SCF Carleson control and
      would feed the \(\mathrm{Jump}_{avg}\) branch-elimination route.

      The fixed-shell version also fails as a universal consequence of smooth data:
      large smooth divergence-free data can have a large component in any fixed
      shell, so no data-independent amplitude bound of the desired size follows.

      The energy layer supplies first-moment control. The active route needs a
      scale-normalized second-moment control. Short active-shell pulses remain
      compatible with the shell identity whenever the nonlinear flux source supplies
      matching input. The missing theorem is a heat-scale source theorem, a signed
      weighted commutator-defect theorem, a direct active-Carleson theorem, or a
      monotone-dominance functional preventing short terminal active-shell pulses.

      Those inputs are not installed here.


