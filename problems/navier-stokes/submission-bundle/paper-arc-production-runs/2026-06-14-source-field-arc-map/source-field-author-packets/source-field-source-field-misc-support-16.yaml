    text: |+
      \subsection{Affine Gainstop Parentkernel Discharge}

      This subsection is the affine-metric version of the gain-stop packet.  It gives
      the local dichotomy used by the parent-kernel route once the affine packet
      metric and selection hypotheses are in force.

      \[
      \Gamma_T(t)=\int_t^{t_+}\lambda_{\max}^+(A_k(X_T(s),s))ds,
      \qquad
      h_T(t)=\nu r_T^{-2}(t_+-t),
      \qquad
      g_T(t)=e^{\Gamma_T(t)}.
      \]

      \[
      a_T(t)=g_T(t)^{-1}|\langle w_j(t),\psi_T(t)\rangle|.
      \]

      \[
      2\Gamma_T>2h_T-\eta_0,
      \]

      \[
      2\Gamma_T\le2h_T-\eta_0.
      \]

      \[
      \sum_{T:P\prec T}g_T^2S(P\to T)
      \le(1-\delta)S(P).
      \]

      The affine heat cylinder centered at \(X_T(t_+)\) with scale \(r_T\) is the
      earlier active source-pulse ancestor.  Under the selection and measurability
      hypotheses from D.266, this is the affine form of Gain Stop.A.

      The same representation gives the coefficient-stop dichotomy: coefficient-stopped
      tiles enter the residual charge record or the earlier ancestor record.

      The quiet parent-kernel contraction is the contraction alternative
      \[
      \sum_{T:P\prec T}g_T^2S(P\to T)\le(1-\delta)S(P).
      \]
      The remaining payment is the choice of packet thresholds and atlas constants
      that make this contraction uniform on the retained family.


