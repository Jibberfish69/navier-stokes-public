      The direct loop restates the same target in proof-search form: prove from
      original smooth data that selected terminal bad active windows carry enough
      vorticity-direction coherence to deplete positive active source production.

      \[
      \omega\cdot S\omega.
      \]

      The attempted loop does not add a new payment beyond the previous paragraph.
      It names the next proof-search surfaces: Reverse Holder Parent Concentration.A,
      Anti Beltrami Carleson.A, and Native SourceAC.A.  Those surfaces remain support
      routes for the same source-pulse wall until one of them supplies the missing
      terminal direction modulus or a replacement source-control theorem.


