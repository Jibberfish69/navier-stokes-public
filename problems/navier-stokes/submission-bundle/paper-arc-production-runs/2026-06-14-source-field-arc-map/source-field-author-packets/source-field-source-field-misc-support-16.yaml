    text: |+
      \subsection{Active-Shell Amplitude Gain Loop Audit}

      \[
      2^{-j}D_j(t)^2\le \varepsilon\nu D_j(t)+r_j(t)
      \]

      Original Smooth Data gives finite energy, finite dissipation, and smoothness on
      every compact preterminal interval. These facts control fixed shells before the
      endpoint.

      The desired gain controls moving active shells whose frequencies can drift
      upward as the terminal time is approached. For the scalar shell model

      \[
      E_j'+c\nu D_j\le F_j,
      \qquad D_j=2^{2j}E_j,
      \]
      the missing point is source normalization: \(F_j\) may maintain a pulse unless
      some signed, monotone, or source-size theorem prevents it.


