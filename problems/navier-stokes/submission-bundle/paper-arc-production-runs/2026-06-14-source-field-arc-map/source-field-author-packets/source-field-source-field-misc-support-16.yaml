    text: |+
      \subsection{Active Vorticity Coherence.A from Original Smooth Data}

      The desired theorem says that terminal bad active windows carry enough
      vorticity-direction coherence to deplete their positive active source.  The
      stretching term is

      \[
      \omega\cdot S\omega.
      \]

      A Constantin-Fefferman style mechanism can deplete stretching when a suitable
      vorticity-direction modulus is available.  Current original-data inputs give
      smoothness on compact preterminal intervals.  They do not supply a uniform
      terminal direction modulus on the shrinking active windows selected by the
      source-pulse branch.

      Even with a direction-coherence hypothesis, the bridge must control the exact
      route carrier.  The active source packet also includes transverse strain
      eigenvalues, low-vorticity/high-strain portions, shellwise mixed bilinear
      dissipation, and weighted lifted remainders after cutoffs and one-sided weights.
      Direction coherence of \(\omega/|\omega|\) alone does not cover all of those
      carriers.

      Active Vorticity Coherence.A remains open and route-equivalent to the source-pulse wall at current resolution.


