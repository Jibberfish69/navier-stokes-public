      \subsection{Aligned Residual Square-Budget Reduction}

      This is the non-circular synchronization target left by the previous subsection.
      The desired statement compares the aligned residual square budget to the current
      CG residual square budget without invoking BridgeA.

      The installed \(\eta_{\mathrm{mb}}\) and Boot Square packets control the
      current CG residual.  They do not supply the aligned residual budget
      automatically, because the aligned projector has its own variation and gap
      costs.  The remaining input is a square-budget estimate for those costs on the
      retained aligned family.


