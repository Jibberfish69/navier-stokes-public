    text: |+
      \subsection{Aligned Variation Gap Lp Control Reduction}

      Let \(F^{\mathrm{al,var}}_J\) denote the aligned derivative/gap source density
      from the variation reduction.  Schematically, this density records the
      projector-motion and top-direction-motion costs:

      \[
      F^{\mathrm{al,var}}_J
       \sfcomp{14304}
      |\partial_t Q_{\mathrm{al}}|
      +
      g_{\mathrm{al}}^{-1}|\partial_t n_{\mathrm{top}}|.
      \]

      The source estimate required by this reduction is

      \[
      \|F^{\mathrm{al,var}}_J\|_{L^1_tL^p(d\nu_J)}<\infty
      \]

      with the corresponding smallness or summability on the retained aligned strip.
      This is the exact analytic bill for replacing the entrance-time alignment
      shortcut.

