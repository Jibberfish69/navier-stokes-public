      \subsection{Affine Heat Packet Bound Ahp A 20260504 001}

      Packet stability is the input needed before the Cotlar /\(TT^*\) Bessel step.
      The packet is transported in the affine frame

      \[
      \dot X_T(t)=b_k(X_T(t),t),
      \qquad
      \dot J_T(t)=(\nabla b_k)(X_T(t),t)J_T(t),
      \qquad
      J_T(t_+)=I,
      \]

      \[
      y=J_T(t)^{-1}(x-X_T(t)).
      \]

      The packet is followed over a bounded heat-time interval:

      \[
      0\le t_+-t\le \Lambda r_T^2.
      \]

      The affine chart is assumed to have bounded distortion:

      \[
      \|J_T(t)\|+\|J_T(t)^{-1}\|\le \Lambda_J,
      \qquad
      \lambda I\le B_T(t)\le \Lambda I.
      \]

      The terminal packet has the Gaussian bounds

      \[
      |\partial_y^\alpha \varphi_T(t_+,y)|
      \le C_\alpha r_T^{-3/2-|\alpha|}
      \exp(-c_0|y|^2/r_T^2).
      \]

      The constants depend on the route depth, viscosity, cutoff bounds, affine
      distortion constants, and terminal packet constants.  They are uniform in
      \(T\) after the packet scale parameter is chosen large enough.

      After the scaling \(y=r_Tz\), each first-order, zero-order, and
      cutoff-commutator term contributes perturbatively to the packet norm after the
      affine heat kernel is applied.  The Gaussian weight absorbs the polynomial
      factors generated by derivatives and commutators.

      The energy-form estimate supplies the perturbative part of the argument in
      \(L^1_t(H^1,H^{-1})\).  The pointwise Gaussian estimate also uses the fact that
      the error term is the coefficient-good affine-flow and strain remainder.  An
      arbitrary operator with the same abstract \(H^1\to H^{-1}\) size need not
      preserve the Gaussian packet class.

      The argument supplies affine heat-packet stability.  The stronger isotropic
      physical-space Gaussian bound requires the stated uniform affine ellipticity, or
      a separate aspect-ratio theorem.


