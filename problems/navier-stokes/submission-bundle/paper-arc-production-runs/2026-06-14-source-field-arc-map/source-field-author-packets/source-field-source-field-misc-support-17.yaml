    text: |+
      \subsection{Aligned Variation Gap Rate Reduction}

      The variation/gap contribution is the part of \(\partial_t m_{\mathrm{al}}\)
      coming from the motion of \(Q_{\mathrm{al}}\) and the true top-strain direction
      \(n_{\mathrm{top}}\).  The rate split is in model form

      \[
      |\partial_t m_{\mathrm{al}}|
      \le C_{\mathrm{sf},14317}
      |\partial_t Q_{\mathrm{al}}|
      +
      g_{\mathrm{al}}^{-1}|\partial_t n_{\mathrm{top}}|
      + \text{lower-order retained-family terms}.
      \]

      The first term is aligned projector motion, controlled by a differential
      Davis-Kahan estimate after a protected simple gap is available.  The second term
      is motion of the actual top-strain direction and needs the same gap protection.
      Thus the aligned route reduces to three linked inputs on the same retained
      family: aligned gap persistence, segment gap protection, and regular-window
      derivative control.  Until those are supplied, the aligned variation branch is
      support for the source-pulse wall rather than an independent closure.


