      \subsection{Affine Metric Replacement For Isotropic Packet Bound}

      The correct unconditional packet statement is affine-metric.  The isotropic
      physical Gaussian is a stronger shortcut and requires a separate aspect-ratio
      theorem.

      \[
      \dot X_T=b_k(X_T,t),
      \qquad
      \dot J_T=(\nabla b_k)(X_T,t)J_T,
      \qquad
      J_T(t_+)=I,
      \]

      \[
      y=J_T(t)^{-1}(x-X_T(t)).
      \]

      \[
      (-\partial_t-\nu\nabla_y\cdot(B_T(t)\nabla_y))\varphi_T
      =\mathcal E_T\varphi_T.
      \]

      \[
      |\partial_y^\alpha\varphi_T(t,y)|
      \le C_\alpha r_T^{-3/2-|\alpha|}
      \exp(-c|y|^2/r_T^2).
      \]

      \[
      |\partial_y^\alpha\varphi_T(t,J_T(t)y+X_T(t))|
      \le C_\alpha r_T^{-3/2-|\alpha|}
      \exp(-c|y|^2/r_T^2).
      \]

      The affine coordinate map is the exact central linear-flow normalization.  The
      heat kernel for the spatially constant affine operator has a covariance matrix
      determined by \(B_T(t)\).  Gaussian kernel estimates hold directly in that
      covariance or affine metric.  No conversion to a Euclidean ball is needed for
      the packet argument.

      For the incompressible affine chart, \(\det J_T(t)=1\).  Hence the affine
      coordinate change preserves \(L^2\) normalization and the Gaussian packet
      volume scale.  The physical packets are ellipsoids of volume comparable to
      \(r_T^3\).

      For two packets, the product estimate is performed in the affine variable of
