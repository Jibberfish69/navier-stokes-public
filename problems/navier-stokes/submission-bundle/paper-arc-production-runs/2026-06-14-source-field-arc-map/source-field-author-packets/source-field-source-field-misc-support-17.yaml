    text: |+
      \subsection{Aligned Entrance Alignment Rate Obstruction}

      The literal entrance-time alignment theorem fails in the normalization where
      the top eigenspace has multiplicity two.  In the model spectrum

      \[
      1,1,0.
      \]

      the top eigenspace is two-dimensional.  A rank-one aligned projector
      \(P_{\mathrm{al}}(t_0)\) has no canonical definition at the entrance time, and
      the simple-top gap is

      \[
      \lambda_1(t_0)-\lambda_2(t_0)=0.
      \]

      The source theorem cannot be an entrance-time estimate that assumes a canonical
      simple top direction.  The aligned branch has to start after a protected
      simple-gap selection, or replace the rank-one direction by a two-dimensional
      top-eigenspace statement.


