    text: |+
      \subsection{Aligned Alpha Thresholded Mass Collapse Boundary}

      The aligned route needs the mass above the selected threshold to disappear on
      the retained aligned family.  The target statement is

      \[
      \nu_J(\{\alpha_J>\theta_J\})\to0.
      \]

      This is weighted convergence in measure of \(\alpha_J\) to zero at the selected
      threshold scale \(\theta_J\).  A direct \(L^2(d\nu_J)\) estimate stronger than
      \(\theta_J^2\) is enough:

      \[
      \int \alpha_J^2\,d\nu_J=o(\theta_J^2),
      \]

      \[
      \nu_J(\{\alpha_J>\theta_J\})
      \le
      \theta_J^{-2}\int \alpha_J^2\,d\nu_J
      \to0.
      \]

      The point of this subsection is the direction of the burden.  Finite weighted
      mass and the threshold schedule alone do not force collapse.  For example,
      \(\alpha_J=1\) on a fixed set of positive weighted measure while
      \(\theta_J\to0\) leaves that set above threshold for every large \(J\).  The
      route needs a genuine decay estimate for the aligned quantity, not only a
      finite-mass ledger.


