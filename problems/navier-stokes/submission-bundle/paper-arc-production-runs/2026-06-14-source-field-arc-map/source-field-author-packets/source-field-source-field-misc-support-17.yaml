      \subsection{Aligned D7mb Residual Recomputation Attempt}

      This is a conditional bridge note for the aligned reference convention.  The
      aligned residual can be defined so that it controls the aligned projector
      motion.  The installed \(\eta_{\mathrm{mb}}\) packet controls the current
      CG-projector residual, so it does not automatically control the aligned
      projector residual.

      The comparison cannot use BridgeA as its input, because BridgeA is the object
      being compared.  The aligned route needs an independent residual theorem or an
      independent synchronization theorem between the current CG projector and the
      aligned projector.

      Once that independent input is supplied, the aligned reference convention
      removes the frame comparison error:

      \[
      \operatorname{Err}^{\mathrm{frame}}_{\mathrm{cmp}}=0.
      \]

      At the current resolution the aligned reference convention gives a clean
      reduction, while the closed comparison theorem still needs the independent
      input named above.


