      \subsection{Anisotropic Backward Uniqueness Transform Test}

      This reserve route asks whether the frozen principal-strain flow can be tested
      by backward uniqueness after an anisotropic change of variables.  On a frozen
      tangent tile, the model equation is

      \[
      \partial_s v+(Sy)\cdot\nabla_y v+Sv+\nabla_y\pi=\nu\Delta_y v,
      \qquad
      \nabla_y\cdot v=0,
      \qquad \operatorname{tr}S=0.
      \]

      For the transform test, freeze \(S=S_T\) as a constant trace-free strain matrix
      on that tile.  Set

      \[
      E(s)=e^{sS},
      \qquad
      z=E(s)^{-1}y,
      \qquad
      w(z,s)=E(s)v(E(s)z,s).
      \]

      \[
      \partial_s w
      =\nu\nabla_z\cdot(A(s)\nabla_z w)-\nabla_z q,
      \]

      \[
      A(s)=E(s)^{-1}E(s)^{-T}=e^{-sS}e^{-sS^T}.
      \]

      \[
      \nabla_z\cdot(A(s)w)=0,
      \]

      The transformed object is not scalar heat backward uniqueness.  It is backward
      uniqueness for an anisotropic Stokes system with a time-dependent metric
      \(A(s)\) and the anisotropic divergence constraint above.

      On each finite slab \([-R,0]\), \(A(s)\) is smooth and uniformly elliptic.  A
      finite-slab unique-continuation argument is plausible only after the pressure
      and divergence system are handled in that anisotropic form.

      The ancient half-line is the hard part.  As \(s\to-\infty\), the metric
      \(A(s)\) can become anisotropically singular or unbounded along the
      eigendirections of \(S\).  Contracting directions for the original strain flow
