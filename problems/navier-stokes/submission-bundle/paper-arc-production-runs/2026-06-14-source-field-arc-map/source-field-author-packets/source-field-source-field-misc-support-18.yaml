      \subsection{Analytic record Smallness Scheduler For Sg 4 Tps Retained Family Ep A}

      This is a conditional scheduler theorem.  It does not supply a source-pulse
      estimate by itself.  It records how the retained-family losses become small
      after the corresponding analytic records have been supplied.

      For the stopped-family oscillation loss, the scheduler has two legal paths.  A
      density-adapted stopping choice can remove the bad oscillation subfamily, at the
      cost of discarded mass.  On a fixed parent family, an \(L^p\) normalized
      oscillation record gives the same smallness without discarding that family.

      \[
      A_{\mathrm{stop}}\to0.
      \]

      For fixed-width shells, \(A_{\mathrm{shell}}\) is different.  It is an
      equidistribution theorem, not a selection consequence: choosing a subfamily does
      not by itself make shell mass spread correctly.

      \[
      \Lambda_{C2}(a)=H(a)\tau(a)e^{2M(a)\tau(a)}.
      \]

      \[
      R_{C2}(a)=h_J\Lambda_{C2}(a).
      \]

      \[
      h_J\Lambda_{C2}\to0
      \]

      \[
      \int (h_J\Lambda_{C2})^p d\mu\to0.
      \]

      \[
      A_{C2}:=\|R_{C2}\|_{L^p(G)}\to0.
      \]

      Thus the \(C2\) record becomes small when the independent exact-potential tensor
      comparison theorem supplies \(h_J\Lambda_{C2}\to0\) in the displayed \(L^p\)
      sense.

      The gap record has a selection version.  On a retained subfamily satisfying
      \[
      g_0\ge \kappa_*,
      \]
      the corresponding gap loss vanishes:
      \[
      A_{\mathrm{gap}}(\kappa_*)=0.
      \]
      The price is exactly the mass lost by selecting that subfamily.  In this role,
      the scheduler converts supplied records into small retained-family losses; it
      does not prove the source-pulse record itself.


