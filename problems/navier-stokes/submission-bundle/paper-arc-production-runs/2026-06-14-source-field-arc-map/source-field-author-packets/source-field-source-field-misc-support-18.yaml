    The reserve route still needs two supplier inputs.  No Incoming Flux
    Global.A has to rule out incoming mass from spatial infinity in the transformed
    coordinates.  Anisotropic Stokes Carleman.A has to apply to the exact
    transformed Stokes system with the anisotropic constraint.

    The source-tree no-parent license obtained from first-pulse selection feeds
    Parent OrCharge.A.  It does not by itself give the global ancient boundary
    condition needed here.

    Anisotropic Backward Uniqueness.A is not discharged.  The finite-slab transform
    is valid, while the ancient no-incoming boundary and exact anisotropic Stokes
    Carleman theorem remain missing.  This route stays as a reserve; the
    principal-flow adjoint drain route remains the active path.



    \subsection{Anisotropic Stokes Carleman.A finite-slab reduction}

    This subsection records the part of the anisotropic route that is actually paid.
    The finite-slab reduction is discharged conditionally on the existing
    fixed-metric parabolic Carleman packet.  The ancient half-line theorem remains a
    separate global-uniform problem.

    \[
    A(s)=e^{-sS}e^{-sS^T}.
    \]

    On each finite slab \([-R,0]\), \(A(s)\) is smooth, spatially constant, and
    uniformly elliptic.

    \[
    \mathcal H_A(s)=\{w:\nabla_z\cdot(A(s)w)=0\}.
    \]

    Since \(A(s)\) is spatially constant and uniformly elliptic on \([-R,0]\), the
    associated anisotropic Leray projection is an order-zero Fourier multiplier.
    Its symbol constants depend on the slab ellipticity ratio and finitely many time
    derivatives of \(A\).

    \[
    \partial_s w-
    \nu\nabla_z\cdot(A(s)\nabla_z w)+B_R(s,D)w=0,
    \]

    Here \(B_R(s,D)\) is a bounded time-dependent order-zero multiplier on the
    finite slab.  It accounts for the time variation of the anisotropic constraint
    bundle and the projected pressure response.

    \[
    P_{R,0}w=
    \partial_s w-
    \nu\nabla_z\cdot(A(s)\nabla_z w)
    \]

    The order-zero multiplier \(B_R\) is lower order relative to the Carleman bulk.
    The lower-order absorption theorem applies as in the bounded-chart packet: for
    Carleman parameter large enough depending on the finite-slab bounds,

    \[
    \mathcal I_{R,\tau}[w]
    \le C_R\|e^{\tau\phi}(
    \partial_s-
    \nu\nabla\cdot(A\nabla)+B_R)w\|_2^2
    +Obs_{R,\tau}[w].
    \]

    This gives finite-slab backward uniqueness for the exact transformed
    anisotropic Stokes system, conditional on the fixed-metric Carleman packet and
    the lower-order absorption step.

    The constants depend on the ellipticity ratio of \(A(s)\) on \([-R,0]\).  For
    mixed-sign trace-free strain, this ratio may grow exponentially with \(R\).  The
    finite-slab theorem does not automatically pass to
    \((-\infty,0]\).

    The exact transformed Stokes structure is handled on finite slabs.  The live
    blocker is the global half-line upgrade: control of incoming flux plus Carleman
    weights whose constants remain usable under the strain anisotropy as the
    backward slab length tends to infinity.



    \subsection{ATD Tower Bootstrapping Depth Lemma}

    This lemma is local bookkeeping after a CKN-good normalized cylinder has already
    been obtained.  It explains why the tower carries two more velocity
    derivatives than the displayed forcing depth.

    \[
    U_0,\dots,U_{N+2},
    \qquad
    \nabla p,\dots,\nabla^{N+1}p.
    \]

    \[
    K_q=-\nabla^{q+1}p+\nu\Delta U_q,
    \qquad 0\le q\le N,
    \]

    CKN epsilon regularity gives boundedness and smoothness on a shrunken normalized cylinder. Interior parabolic estimates applied to the differentiated equations then give, for every finite k in the route depth,

    \[
    \sup_{Q_{1/2}}|\nabla^k u|
    +
    \sup_{Q_{1/2}}|\nabla^{k+1}p|
    \le C_k.
    \]

    For every \(0\le q\le N\), the velocity tower readout includes \(U_q\).  The
    viscous part of \(K_q\) is

    \[
    \nu\Delta U_q,
    \]

    So it reads from the \(q+2\) velocity slot.  The pressure equation and interior
    elliptic/Schauder estimates supply \(\nabla^{q+1}p\) after the same CKN
    regularity gain.  Every \(K_q\) for \(q\le N\) is controlled once the local
    tower includes \(U_0,\ldots,U_{N+2}\) and the pressure slots through
    \(\nabla^{N+1}p\).

    This is a local bootstrapping statement.  It does not create the CKN-good
    cylinder and does not supply terminal coverage.



    \subsection{ATD m Depth Bookkeeping Lemma}

    The depth rule is the same statement written as the ATD packet requirement.  The
    packet includes enough velocity derivatives for the viscous slot in every
    forcing rung.

    \[
    0\le q\le N,
    \]

    \[
    K_q=-\nabla^{q+1}p+\nu\Delta U_q.
    \]

    The velocity part requires \(U_q\) for all \(q\le N\).  The viscous part requires
    two additional velocity derivatives, because

    \[
    \Delta U_q
    \quad\text{is read from}\quad
    U_{q+2}.
    \]

    The finite packet carries the slots

    \[
    U_0,\dots,U_{N+2},
    \qquad
    \nabla p,\dots,\nabla^{N+1}p.
    \]

    In packet language,

    \[
    m_{\mathrm{ATD}}\ge N+2.
    \]

    The pressure slot requires depth \(N+1\), while the viscous slot already forces
    the stronger \(N+2\) velocity depth.  This is bookkeeping for a local completion
    packet, not a global terminal theorem.



    \subsection{ATD m epsilon CKN-Admissible Local Completion}

    This theorem is the local completion supplied by CKN epsilon regularity inside a
    bounded same-fluid chart.  It begins only after the selected cylinder is already
    CKN-admissible and small in the normalized critical quantities.

    \[
    \Gamma_\sharp(Q_r^\Phi)\le M_\sharp,
    \]

    Assume the same-fluid chart is CKN-admissible: after rescaling by \(r\) and
    pulling back by the moving frame, the cylinder is uniformly comparable to a
    standard parabolic cylinder and the local energy inequality is preserved with
    constants depending only on \(M_\sharp\) and \(\nu\).

    The SCF base uses the CKN-compatible moving-frame velocity normalization and
    pressure normalization.  Choose \(\varepsilon_m\) below the CKN epsilon threshold
    for the bounded-distortion frame.

    \[
    Q_{\theta_m r}^\Phi(a_0,t_0)
    \]

    \[
    ATD_m(Q_{\theta_m r}^\Phi).
    \]

    Rescale to \(r=1\) and pull back by the same-fluid moving frame.  Bounded
    distortion gives a uniformly elliptic/parabolic chart whose constants depend
    only on \(M_\sharp\).  The normalized smallness becomes

    \[
    \iint_{Q_1}|u-u_1^{norm}|^3
    +
    \iint_{Q_1}|p-p_1^{norm}|^{3/2}
    +
    \iint_{Q_1}|\nabla u|^2
    \le\varepsilon_m.
    \]

    The pressure normalization is the CKN-compatible one for the moving frame;
    affine pressure modes are absorbed into that normalization.  With
    \(\varepsilon_m\) below the corresponding epsilon-regularity threshold, the CKN
    theorem gives local boundedness and smoothness on \(Q_{1/2}\).

    \[
    \sup_{Q_{1/2}}|\nabla^k u|+
    \sup_{Q_{1/2}}|\nabla^{k+1}p|
    \le C_{m,M_\sharp,\nu}.
    \]

    These estimates control every tower rung \(U_q\) for \(q\le m+2\) and every
    pressure derivative needed for the forcing rungs.  Since the ATD packet contains
    only finitely many slots at the chosen depth, \(\theta_m\) can be chosen so that
    all those slots are read on the shrunken cylinder \(Q_{\theta_m r}^\Phi\).

    This is a local theorem.  It supplies no global terminal coverage by itself.  The
    global route remains the retained terminal-family selection problem: enough
    CKN-admissible same-fluid cylinders are needed along the approach tail.



    \subsection{ATD m epsilon Moving Same-Fluid Cylinder Gain}

    This is the moving-cylinder version of the previous local completion.  Its role
    is to license the affine/moving normalization used by the route, while keeping
    the terminal coverage problem outside the local theorem.

    \[
    \Gamma_\sharp\le M_\sharp.
    \]

    The SCF base uses the CKN-compatible velocity and pressure normalization for the
    moving frame.  Then there are constants

    \[
    \theta_m\in(0,1/2),
    \qquad
    C_m<\infty,
    \]

    \[
    Q_{\theta_m r}^\Phi(a_0,t_0)
    \]

    \[
    ATD_m(Q_{\theta_m r}^\Phi).
    \]

    Rescale the moving cylinder to unit size.  Bounded same-fluid distortion makes
    the transformed cylinder uniformly comparable to a standard parabolic cylinder,
    with constants depending only on \(M_\sharp\).  The CKN-compatible normalization
    gives

    \[
    \iint_{Q_1}|u-u_1^{norm}|^3
    +
    \iint_{Q_1}|p-p_1^{norm}|^{3/2}
    +
    \iint_{Q_1}|\nabla u|^2
    \le \varepsilon_m.
    \]

    Choose \(\varepsilon_m\) below the CKN epsilon-regularity threshold for this
    bounded-distortion frame.  The local epsilon-regularity theorem gives smoothness
    on a smaller cylinder, and parabolic bootstrapping gives all derivative depths
    needed by the route.

    Thus the finite-depth averaged affine tower packet \(ATD_m\) holds on
    \(Q_{\theta_m r}^\Phi\).

    This theorem is local.  It gives no terminal approach-tail coverage by itself.
    Global coverage remains the separate task of selecting retained terminal
    same-fluid cylinders that satisfy the CKN-admissible smallness hypothesis.

    The affine normalization is licensed only through the CKN-compatible same-fluid frame and pressure normalization used in SCF base.


