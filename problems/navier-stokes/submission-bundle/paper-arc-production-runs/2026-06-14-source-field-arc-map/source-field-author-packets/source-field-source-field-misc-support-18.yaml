      \subsection{Ancestry Drain.A - direct loop note}

      This direct route asks for a monotone cost along a same-fluid source ancestry
      chain:

      \[
      \cdots\to P^{-2}\to P^{-1}\to P^0,
      \]

      \[
      Reserve(P^{-m}\to P^{-m+1})\ge c_0>0,
      \]

      \[
      \mathcal R(P^{-m})\le \mathcal R(P^{-m+1})-\delta.
      \]

      A source-balanced edge is the hard case: nonlinear source refills the child
      pulse while the chain moves to another heat-scale window.  Heat-scale
      normalization allows comparable source/mix mass on shrinking windows with no
      fixed raw dissipation spend per edge.  The raw energy ledger gives no quantized
      edge cost.

      \[
      j_{P^-}\in[j_P-M,j_P+M]
      \]

      Same-fluid and endpoint-fibre coherence preserve legal ancestry after an edge is
      selected.  They supply fidelity.  The target needs a monotone drain, a reserve
      spend, or another generation rank that strictly decreases along source-balanced
      parentage.

      A source-generation rank would have to be bounded below and would have to drop
      whenever a source-balanced parent feeds the next pulse:
      \[
      \mathcal G(P^{-m})\ge \mathcal G(P^{-m+1})+c_0.
      \]
      The current route has no such functional.

      Ancestry Drain.A remains open under installed inputs.  The exact replacement
      target is a bounded source-generation rank or monotone reserve functional for
      source-balanced parentage.  Until that target is supplied, ancestry fidelity is
      only support; it is not a drain proof.


