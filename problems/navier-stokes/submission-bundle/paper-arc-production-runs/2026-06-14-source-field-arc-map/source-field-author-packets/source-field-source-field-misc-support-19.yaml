      \subsection{Avg Rcv A Completion Lci A}

      This is the averaged lower-carrier completion estimate.  The inputs are the
      averaged analogues of the EOC and RCF quantities:

      \[
      \Omega_{\mathfrak p}^{avg}\in L^2(I),
      \]

      \[
      \mathfrak A_{\mathfrak p}^{ctr,avg}\in L^2(I).
      \]

      \[
      \frac{d}{dt}\mathcal G_{\mathfrak p}^{avg}
      +c\mathcal D_{\mathfrak p}^{avg}
      \le
      \mathfrak B_{\mathfrak p}^{avg}(t)\mathcal G_{\mathfrak p}^{avg},
      \]

      with coefficient

      \[
      \mathfrak B_{\mathfrak p}^{avg}
      =
      C_{\mathfrak p}
      \left[
      (1+\Gamma_\sharp)(1+
      \mathfrak A_{\mathfrak p}^{ctr,avg}
      +
      \Omega_{\mathfrak p}^{avg})
      +1+(
      \mathfrak A_{\mathfrak p}^{ctr,avg})^2
      +(
      \Omega_{\mathfrak p}^{avg})^2
      \right].
      \]

      The coefficient is integrable because

      \[
      \Gamma_\sharp\in L^\infty(I),
      \qquad
      \mathfrak A_{\mathfrak p}^{ctr,avg}\in L^2(I),
      \qquad
      \Omega_{\mathfrak p}^{avg}\in L^2(I),
      \]

      and the required parameter set is finite.  The sum of all coefficient functions
      gives a single \(L^1\) majorant.  Gronwall yields

      \[
      \sup_{t\in I}\mathcal G_{\mathfrak p}^{avg}(t)
      +c\int_I\mathcal D_{\mathfrak p}^{avg}(t)\,dt
      \le
      C_I\mathcal G_{\mathfrak p}^{avg}(t_0),
      \]

      Here \(C_I\) depends on the \(L^1\) coefficient budget.  The conclusion is
      typed to averaged objects.  Pointwise lower-carrier data enters only through the
      later readout layer where it is required.


