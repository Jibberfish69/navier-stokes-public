      \subsection{Averaged Finite-Energy Route And Terminal Readout Completion}

      The finite-energy route stays averaged until the terminal readout layer is
      available.  The attempted repair by finite frozen increments fails to control
      the fixed-radius Holder carrier: a finite increment family cannot control

      \[
      [U_q]_{C^{0,\alpha}(B(c_j,5\Lambda))}.
      \]

      The averaged route keeps the endpoint data in averaged packets:

      \[
      ATD_m^\varepsilon.
      \]

      \[
      X_R\in L^\infty(I_R),
      \qquad
      N_R\in L^1(I_R),
      \qquad
      \mathcal K_{\le m}^{avg,R}\in L^1(I_R).
      \]

      The pressure/source supplier is also kept in averaged form.  The local
      source-pressure records imply the retained averaged pressure record:

      \[
      \left[\mathfrak Q_{N,\eta^\ell}^{press,loc,src,RR,\alpha}\in L^1(I)\ \text{for every }\ell\right]
      \Longrightarrow
      \mathfrak Q_{N,\rho,\psi}^{press,RR,\varepsilon,\alpha}\in L^1(I).
      \]

      Terminal readout enters only after the averaged package has selected a finite
      same-fluid cover

      \[
      Q_t\subset\bigcup_{i=1}^{J_Q}B(c_i(t),R_i/2).
      \]

      At that point the reader is allowed to pass from averaged records to the local
      pointwise endpoint package on the cover elements.  Before that readout step,
      the paper should not cite the averaged route as a pointwise endpoint theorem.


