      \subsection{Averaged-to-Pointwise Typed Transition record}

      Averaged objects do not enter the old pointwise endpoint matrix until the named
      readout bridge has been applied.  The averaged Field object is a coherence
      record before the bridge; it is not yet the pointwise \(Field_{N,r,Q}\) face.

      The bridge is the place where the pressure-viscosity forcing slots become
      pointwise readouts on the selected cover:

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q.
      \]

      After the bridge, the same finite cover supplies the \(U_{q+2}\) and
      \(\nabla^{q+1}p\) slots needed by \(K_q\).  Before the bridge, those slots remain
      averaged support data.


