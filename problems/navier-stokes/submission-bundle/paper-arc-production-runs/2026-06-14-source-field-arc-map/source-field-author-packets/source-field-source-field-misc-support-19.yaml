      \subsection{Averaged Route Solve Path Mainline}

      The local input is a CKN-admissible same-fluid cylinder.  On the shrunken
      cylinder, local epsilon regularity and parabolic bootstrapping give the finite
      averaged tower packet:

      \[
      Q_{\theta_m r}^\Phi(a_0,t_0)
      \]

      \[
      ATD_m(Q_{\theta_m r}^\Phi).
      \]

      Interior parabolic bootstrapping supplies every finite tower rung required by
      the route, including the averaged seed, excess packet, dissipation packet,
      pressure readout, and mollified center-forcing records.  The global averaged
      quantity \(X_R\) then satisfies the retained differential inequality

      \[
      D^+X_R+c_\nu N_R
      \le
      (1+A_R+V_R+P_R)X_R
      +C_\ast(X_R^{1/2}+V_R^{1/3}+P_R^{2/3})N_R
      +F_R.
      \]

      On scheduler subintervals where the nonlinear coefficient is small,

      \[
      C_\ast(X_R^{1/2}+V_R^{1/3}+P_R^{2/3})\le c_\nu/2.
      \]

      The \(N_R\) term is absorbed:

      \[
      D^+X_R+(c_\nu/2)N_R
      \le
      (1+A_R+V_R+P_R)X_R+F_R.
      \]

      Gronwall gives the averaged \(L^\infty\)-in-time control for \(X_R\) and the
      \(L^1\)-in-time control for \(N_R\) on each scheduled interval, with forcing
      paid by \(F_R\).  This is the main finite-energy solve path for this branch.
      Pointwise endpoint objects enter only after the terminal readout bridge.


