      \subsection{B ASAC No-Incoming Or Transported-Cylinder No-Flux Attempt}

      This attempt tests whether the B ASAC tangent class already gives a
      no-incoming or no-flux theorem for the terminal source residue.  It does not.
      The available first-pulse information says that no earlier selected threshold
      source pulse appears on fixed earlier slices.  That is weaker than zero flux
      through every transported cylinder boundary, and weaker than zero global
      incoming source flux for the equality tangent class.

      A zero-thickness terminal source atom can satisfy the no-fixed-earlier-selected
      pulse condition while still appearing as a terminal weak-limit layer.  This is
      compatible with B ASAC because B ASAC supplies terminal tangent/equality
      organization, not temporal thickness.

      The no-flux route remains open.  The next internal test is whether B ASAC gives
      a terminal source reverse Holder or temporal-thickness statement.


