      \subsection{B ASAC Atom Escape Dichotomy Direct Proof Test}

      The proposed atom-escape dichotomy is tested against the installed inputs by
      starting with a terminal source atom:

      \[
      \mu_*^{src}(B_R\times\{0\})>0,
      \qquad
      \langle \mu_m^{src},\psi_m\rangle\to c_0>0.
      \]

      The desired adjoint escape identity would decompose the positive terminal
      source pairing as

      \[
      \begin{aligned}
      \langle \mu_m^{src},\psi_m\rangle
      &=
      \mathrm{Flux}_{tr,cyl,m}
      +\mathrm{Residence}_m\\
      &\quad
      +\mathrm{Pressure}_{\mathrm{eig},m}\\
      &\quad
      +L_{\mathrm{legal},m}
      +A_{\mathrm{def},m}
      +o_m(1).
      \end{aligned}
      \]

      The paid exits would satisfy

      \[
      L_{\mathrm{legal},m}+A_{\mathrm{def},m}=o_m(1).
      \]

      The needed identity is not installed in the right topology. Current
      adjoint/pressure/eigenframe tools control signed-current or near-band
      presentations. The forward source supplier needs the positive source-weighted
      carrier

      \[
      |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
      \]

      After positive-part extraction, signed cancellation and near-band
      pressure/eigenframe support no longer pay the full carrier. Boundary source
      flux can also concentrate on terminal transported-cylinder faces, so
      \(Flux_{tr,cyl}\) needs its own no-incoming/source-drain theorem before it can
      be treated as legal.


