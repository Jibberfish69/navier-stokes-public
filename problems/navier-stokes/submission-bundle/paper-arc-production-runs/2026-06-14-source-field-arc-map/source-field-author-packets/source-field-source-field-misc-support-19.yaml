    \subsection{B ASAC Remaining Production Gates}

    The remaining B ASAC gates form an obstruction inventory, not a final proof
    claim.  At this resolution, the all-doors survivor is a zero-radius terminal
    source-residue obstruction. It is Pack-facing unless a positive-scale
    retained-carrier bridge later licenses Field readout.

    Temporal anti-concentration would follow from a Holder gain in time.  The
    installed inputs supply finite local \(L_s^1\) source mass only, and the
    terminal-layer profile

    \[
    g_m(s)=m\,\chi_{(-1/m,0]}(s)
    \]

    shows why finite \(L_s^1\) mass does not rule out a terminal atom.

    A branch-entropy gate is also open.  A diffuse legal parent cloud can split
    unit source mass among \(M\) parents.  Every bounded selected parent subfamily
    captures at most \(B/M\), while the linear source remains order one.  Available
    quadratic costs scale like \(M^{-1}\), and no installed record carries a
    positive \(M\)-branch entropy charge.

    The transported no-flux gate is open because lateral transported no-flux can
    coexist with a compact terminal time-face atom.  The missing component is the
    time-face anti-atom theorem.

    The rigid-subclass gate is open because the current equality-class production
    gives finite local \(L_s^1\) mass, zero ASAC defect, paid-exit removal, and
    terminal Zeno support, all compatible with the terminal-layer model.  A
    subclass Liouville theorem can be used only after a rigid subclass has actually
    been produced.

    The pressure/Leray tether gate is open.  Pressure recovery and Leray projection
    act spatially at each time slice.  They can bind or redistribute spatial
    carriers while preserving support inside a shrinking terminal time layer.  A
    spread estimate for terminal strips still needs temporal residence or
    pressure-source absolute continuity.

    The pure pressure-sustain residue is also not yet legal.  Existing pressure
    legal records cover collar/boundary work, harmonic tails, cutoff/projector
    commutators, off-family pressure tails, and packets outside the retained
    family.  The retained interior pressure residue would need a new legal class
    and terminal-weight summability theorem:

    \[
    \mu_*^{press\perp src}\perp(\mu_*^{src}+\mu_*^{legal,src}).
    \]

    Finally, the one-sided Leray recombination gate is open.  The localized Leray
    identity recombines convection and pressure before terminal positive selection.
    After one-sided selection, an independent proof needs orientation, commutator
    pricing, and saturation gates.  Importing the existing terminal
    skew/source-current record would make the proof circular.

    The branch now has a precise obstruction placement: progress requires one
    genuinely new production theorem from the gates above, or a later bridge that
    moves the survivor into a positive-scale retained-carrier readout.



    \subsection{B ASAC Atom Escape Dichotomy Direct Proof Test}

    The proposed atom-escape dichotomy is tested against the installed inputs by
    starting with a terminal source atom:

    \[
    \mu_*^{src}(B_R\times\{0\})>0,
    \qquad
    \langle \mu_m^{src},\psi_m\rangle\to c_0>0.
    \]

    The desired adjoint escape identity would decompose the positive terminal
    source pairing as

    \[
    \begin{aligned}
    \langle \mu_m^{src},\psi_m\rangle
    &=
    \mathrm{Flux}_{tr,cyl,m}
    +\mathrm{Residence}_m\\
    &\quad
    +\mathrm{Pressure}_{\mathrm{eig},m}\\
    &\quad
    +L_{\mathrm{legal},m}
    +A_{\mathrm{def},m}
    +o_m(1).
    \end{aligned}
    \]

    The paid exits would satisfy

    \[
    L_{\mathrm{legal},m}+A_{\mathrm{def},m}=o_m(1).
    \]

    The needed identity is not installed in the right topology. Current
    adjoint/pressure/eigenframe tools control signed-current or near-band
    presentations. The forward source supplier needs the positive source-weighted
    carrier

    \[
    |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
    \]

    After positive-part extraction, signed cancellation and near-band
    pressure/eigenframe support no longer pay the full carrier. Boundary source
    flux can also concentrate on terminal transported-cylinder faces, so
    \(Flux_{tr,cyl}\) needs its own no-incoming/source-drain theorem before it can
    be treated as legal.



    \subsection{B ASAC Atom Forces Escape}

    This is the class-specific Liouville target for a nonzero terminal source atom.
    The desired statement is: a nonzero B ASAC terminal source charge forces an
    earlier selected source parent, a legal/donor escape, or an ASAC-paid escape.
    Those alternatives are exactly the exits removed in the closed B ASAC class, so
    the statement would make the terminal source residue vanish.

    The installed inputs do not force that escape. First-pulse source-parent
    minimality removes fixed earlier selected source parents and finite/non-Zeno
    ancestry. It does not remove a sequence of source layers whose heat scales
    shrink to zero at the terminal time.

    Local energy and raw source compactness provide finite source mass on compact
    cylinders. They do not separate diffuse near-terminal source from a terminal
    atom. The model marginal is

    \[
    g_m(s)=m\mathbf 1_{(-1/m,0]}(s).
    \]

    Zero ASAC defect removes the active-alignment / one-sided pair-weight charge
    already supplied by ASAC. It does not imply that the native positive source-residue
    measure

    \[
    \int \Phi_T\,d\mu_*^{src}
    \]

    vanishes. The escape theorem remains open; the next non-circular closure target
    is the no-incoming source-drain theorem.


