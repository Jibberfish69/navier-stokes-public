      \subsection{Eigendirection Source Control Solver Pass}

      Active Eigendirection Decorrel.A. Solve by proving selected terminal high-shell packets spend vanishing weighted time aligned with expanding low-strain eigendirections.

      Nonlinear Shell Flux Control.A. Solve from eigendirection decorrelation, signed lifted-remainder cancellation, monotone shell-flux dominance, or direct active- Carleson.

      Active Shell Source Normalize.A, Heat Scale Square Source.A, and temporal non-atomicity. Solve from Nonlinear Shell Flux Control.A.

      \[
      2^{2j}\langle S_k e_P,e_P\rangle |c_P|^2.
      \]

      Positive production occurs when the polarization e P aligns with an expanding eigendirection of the symmetric strain S k.

      Incompressibility gives tr S k=0, while trace-free symmetric matrices can have positive eigenvalues. Same-fluid transport preserves the packet label and supplies no angular mixing rate. Pressure recovery routes elliptic errors and supplies no sign law for the interior strain term. Global dyadic skew symmetry applies before one-sided weights, terminal localization, and positive-part selection.

      Current inputs so permit selected terminal packets aligned with expanding strain eigendirections. This leaves Active Eigendirection Decorrel.A open.

      \[
      \int_I\sum_{j>N,k<j-M} W_{j,k}^\sigma A_{j,k}(t)dt
      \le
      \theta\int_I\sum_{q>N}D_q(t)dt+o_N(1).
      \]

      \[
      \partial_s v+(Sy)\cdot\nabla v+Sv+\nabla\pi=\nu\Delta v,
      \qquad \nabla\cdot v=0.
      \]

      for the exact frozen-strain tangent system, or an independent terminal angular-mixing theorem proving Active Eigendirection Decorrel.A.


