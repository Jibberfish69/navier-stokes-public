    text: |+
      \subsection{Endpoint Contradiction Theorem In Standard Form}

      Let (u,p) be a maximal classical periodic Navier-Stokes solution on [0,T *). Suppose the averaged class package and endpoint certificates are installed on a terminal same-fluid approach tail. Then a first finite endpoint cannot occur.

      Mixed failures reduce to unions of these four primitive failures by the cross row.

      Thus every possible first endpoint face is excluded. This contradicts the existence of a first finite endpoint.

      \[
      End_{NS,avg}.
      \]

      This theorem is the endpoint contradiction only. The final continuation step is supplied by the periodic continuation readout theorem.


