      \subsection{Dtc Read Pointwise Transported Center Recovery Dtc A}

      On every fixed cover element, ATD m and the averaged tower packet give local H 2 control at the required rungs. In three dimensions,

      \[
      H^2\hookrightarrow L^\infty.
      \]

      \[
      \sup |U_q|
      \]

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q.
      \]

      The viscous part is supplied by the U q+2 tower readout. Hence the ATD m depth is chosen large enough to include the required q+2 rungs.

      For the pressure part, use the fixed-cover local Poisson split. On a cover element (B i',B i,2B i), choose i=1 on B i and supported in 2B i, then write

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

      \[
      \|\nabla^{q+1}p_i^{loc}\|_{L^\infty(B_i')}
      \le
      C_{q,\alpha,i}\|\nabla^q(\chi_i u\otimes u)\|_{C^{0, \alpha}(2B_i)}.
      \]

      The product-source carrier is supplied by ATD m on the fixed cover. The harmonic tail satisfies

      Thus the pressure component of K q is controlled. Combining the pressure and viscous halves gives pointwise control of K q for all required q.


