      \subsection{Enlarged SCF charge with E u - upper-bound obstruction}

      Repair component selection by enlarging the final branch charge to include the velocity-energy component E u.

      Pack control handles G Phi, and nu SCF handles D u plus local pressure. A threshold SCF packet can still be carried by E u. Adding E u would formally close that component gap.

      The scale-critical velocity-energy packet E u is different. It is a local energy size/readout tied to time slices or local cylinder energy, controlled globally by the energy record and locally by the local energy inequality. The current surfaces do not install an additive terminal Radon measure whose values equal the scale-critical E u packet and whose bounded-overlap sum is finite.

      Global energy gives size control per time. It does not give summability of repeated terminal E u threshold packets over a separated terminal schedule. The local energy inequality supplies balances, yet it does not convert repeated E u thresholds into a finite upper sum without an additional decay, recurrence, or dissipation/pressure conversion theorem.

      The enlarged-charge route is open. Adding E u fixes component selection only at the level of notation. It loses the installed finite upper-carrier theorem.

      for the same separated or bounded-overlap terminal windows used by the lower accumulation route.

      Prematurely enlarging the final charge loses the installed upper-carrier theorem.
      The current route remains: prove an \(E_u\) to \(D_u/P\) conversion, or install
      a genuine additive finite upper carrier for \(E_u\).


