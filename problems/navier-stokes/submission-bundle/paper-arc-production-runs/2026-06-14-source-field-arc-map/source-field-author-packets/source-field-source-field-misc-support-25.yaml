      \subsection{E u conversion: conditional route and obstruction}

      The moving-frame local energy inequality is available on pack-stabilized same-fluid cylinders. Its frame terms are controlled by affine-relative velocity, pressure components, and scale-normalized frame records.

      Under BKM or an equivalent high-regularity terminal record, the needed velocity-gradient and local-pressure moduli are available. In that conditional setting, terminal E u threshold packets cannot persist as uncontrolled moving packets.

      A Poincare conversion would need a zero-mode-free or affine-relative E u normalization strong enough to remove local mean or affine energy. That theorem is not installed as an unconditional component-selection rule.

      Adding E u to the charge also remains unavailable, because no additive finite carrier for repeated scale-critical E u terminal packets is installed.

      The E u channel is conditionally controlled under BKM/high regularity and remains open on the original-data route.


