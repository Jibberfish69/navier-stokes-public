      \subsection{Final Theorem Statement: Periodic 3D Navier-Stokes Global Smoothness}

      \[
      u_0\in C^\infty(\mathbb T^3;\mathbb R^3),
      \qquad \nabla\cdot u_0=0,
      \qquad \int_{\mathbb T^3}u_0(x)\,dx=0.
      \]

      \[
      u\in C^\infty([0,\infty)\times\mathbb T^3),
      \qquad p\in C^\infty([0,\infty)\times\mathbb T^3),
      \]

      Let \((u,p)\) be the maximal classical solution on \([0,T_*)\). Suppose that,
      for some \(s>5/2\),
      \[
      \sup_{0\le t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty .
      \]

      The periodic \(H^s\) local theory gives a time \(\tau>0\), depending only on
      that displayed bound, \(\nu\), and the torus. Choose \(t_j\uparrow T_*\) with
      \(T_*-t_j<\tau/2\). Relaunching the equation from \(u(t_j)\) gives a classical
      solution on \([t_j,t_j+\tau]\), and uniqueness identifies the relaunched
      solution with \((u,p)\) on the overlap. Since \(t_j+\tau>T_*\), the maximal
      solution extends past \(T_*\), a contradiction. Thus no finite endpoint remains
      under the displayed \(H^s\) bound, and \(T_*=\infty\).

      Smoothness for all positive time and preservation of smoothness follow from the classical periodic Navier-Stokes regularity theory applied on each finite interval.

      This final theorem is explicitly the periodic T 3 theorem. The whole-space R 3 statement requires a separately named export theorem.


