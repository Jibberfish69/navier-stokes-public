    text: |+
      \subsection{Jump avg threshold SCF concentration extraction}

      Extract an epsilon-threshold SCF concentration sequence from Jump avg on a same-fluid terminal tail.

      Assume Jump avg(T). Then there are points (a n,t n) in T with t n tending to T * and radii rho n tending to zero such that

      \[
      rho_n = 1/n
      \]

      Also t n lies in the terminal subtail and rho n tends to zero. This proves the extraction.

      The threshold compactness surface applies to this extracted sequence. Under pack-stabilized same-fluid compactness, a subsequence produces an epsilon-level terminal SCF defect.

      The direct route still needs separated lower accumulation for nu SCF before the finite upper-bound lemma can produce a contradiction.


