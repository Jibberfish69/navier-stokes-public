    text: |+
      \subsection{Jump avg lower accumulation for an equivalent shared full-SCF charge}

      Discharged for the stated alternative: positive terminal lower accumulation for an equivalent shared charge.

      \[
      \nu_{\mathrm{fullSCF}}:=\mu_E+\mu_D+\sum_\chi\mu_{P,\chi}+\mu_G.
      \]

      This charge carries every component appearing in the normalized SCF base packet.

      Assume Jump avg( T) on a bounded-distortion same-fluid terminal tail. Then there exists a separated or bounded-overlap terminal family of admissible same-fluid windows Q k such that

      \[
      \nu_{\mathrm{fullSCF}}(Q_k)\ge c_m>0
      \]

      for every k. Hence the Jump avg branch has positive terminal lower accumulation for the equivalent shared full-SCF charge.

      A Vitali/Besicovitch extraction in the bounded-distortion same-fluid atlas gives a separated or bounded-overlap terminal subfamily. Passing to this subfamily preserves terminal recurrence.

      where the components are represented by the additive measures in fullSCF . Since the threshold is fixed, at least one represented component is bounded below. After absorbing atlas constants into c m,

      \[
      \nu_{\mathrm{fullSCF}}(Q_k)
      =
      \mu_E(Q_k)+\mu_D(Q_k)+\sum_\chi\mu_{P,\chi}(Q_k)+\mu_G(Q_k)
      \ge c_m>0.
      \]

      \[
      \liminf_k \nu_{\mathrm{fullSCF}}(Q_k)\ge c_m>0.
      \]

      This proves positive terminal lower accumulation for the equivalent shared charge.

      The lower side of the Jump avg no-escape route is closed after replacing the
      narrow SCF by \(\mathrm{fullSCF}\). The remaining upper-side theorem is exactly
      active-window amplitude gain, or an equivalent heat-scale source estimate, for
      the \(E_u\) component of \(\mathrm{fullSCF}\).

      Only the lower side is closed. The upper side and the full Jump avg
      contradiction remain open.


    truncated: false
