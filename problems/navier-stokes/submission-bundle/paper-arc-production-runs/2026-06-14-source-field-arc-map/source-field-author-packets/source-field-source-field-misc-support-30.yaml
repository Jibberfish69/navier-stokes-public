      \subsection{Final Jump avg elimination audit after threshold extraction}

      The proof uses the definition of r good: terminal collapse of r good lets one choose radii just above the local good-radius supremum, forcing SCF base above epsilon m on terminal shrinking cylinders.

      First, component selection is open. The threshold SCF sequence may be carried by the velocity-energy component E u, while nu SCF carries the dissipation and local-pressure components. The current surfaces do not prove an E u terminal threshold converts into D u or local pressure mass on the same schedule.

      Second, separated lower accumulation is open. Even after a positive terminal charge is available, the contradiction needs infinitely many separated or bounded-overlap windows with uniform positive nu SCF charge. A nested reuse of one terminal defect does not pair with the bounded-overlap upper estimate.

      This is a failed final discharge audit. It records genuine progress and the exact remaining theorem pair. It does not promote the proof-burden table row to grounded.


