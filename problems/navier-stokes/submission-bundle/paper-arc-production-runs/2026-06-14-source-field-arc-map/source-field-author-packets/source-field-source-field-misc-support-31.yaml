    text: |+
      \subsection{Lifted Skew Commutator.A attempt}

      \[
      \mathcal R^{lift}_{j,k,\ell}
      =
      \sum_{P'}J(P'\to P)+L^{lift}_P,
      \qquad
      J(P\to P')=-J(P'\to P),
      \]

      \[
      \mathcal R_{j,k,\ell}^{lift}(t)
      =
      2^{2j}\left\langle
      [\Delta_j,a_k(t)\cdot\nabla]\Delta_\ell u(t),
      \Delta_j u(t)
      \right\rangle,
      \]

      The transport cancellation term vanishes by incompressibility before the commutator replacement. The remaining commutator has principal paraproduct form

      \[
      2^{2j}\langle \mathcal C_j(S_k,u_j),u_j\rangle,
      \qquad
      S_k=\frac{1}{2}(\nabla a_k+\nabla a_k^T).
      \]

      \[
      2^{2j}\sum_P
      \langle S_k(x_P,t)e_P,e_P\rangle |c_P(t)|^2.
      \]

      This leading carrier is a real strain-production term. Packets aligned with expanding eigen-directions of S k contribute positive source. Packets aligned with contracting directions contribute negative source. The commutatorized object so carries variable-sign local production rather than a pure edge divergence with an exact signed partner in the same terminal record.

      The bare dyadic skew exchange lives before the commutator replacement. After the lift, the leading term is a packet-local strain alignment functional. Algebraic incompressibility gives trace zero for S k; trace zero still permits positive eigendirection stretching on selected packets.

      A formal decomposition into positive and negative eigendirection packets can be written, but the negative branch may lie outside the selected terminal same-fluid record. Bringing it back requires Terminal Signed Saturation.A; charging it by magnitude requires Scale Critical Tree Carleson.A.

      The live lifted commutator contains the same positive active strain-alignment carrier that defines the source wall. The first-gate route so still needs an independent active-strain or signed-saturation theorem.


