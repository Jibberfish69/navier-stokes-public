      \subsection{Moving-Cylinder CKN Admissibility Lemma}

      Let Q r Phi(a 0,t 0) be a same-fluid moving cylinder generated by the flow map Phi. Assume the chart satisfies the bounded distortion condition

      \[
      \Gamma_\sharp(Q_r^\Phi)
      =
      \sup_{Q_r^\Phi}\max\{|D_a\Phi|,|D_a\Phi^{-1}|\}
      \le M_\sharp,
      \]

      and the moving frame coefficients used in SCF base have the corresponding scale-normalized bounds on the cylinder.

      Then, after rescaling by r and pulling back to material/moving coordinates, Q r Phi is CKN-admissible: it is uniformly comparable to a standard parabolic cylinder, the local energy inequality pulls back with constants depending only on M sharp,nu, and the normalized SCF base packet is comparable to the usual CKN scale-critical packet.

      \[
      x=\Phi(a_0,t)+rA(t)y,
      \qquad
      s=(t-t_0)/r^2,
      \]

      where A(t) is the bounded same-fluid frame from the packet. The assumptions give uniform bounds for A, A -1 , the Jacobian, and the metric tensor in the pulled-back cylinder. Hence spatial volumes, gradients, and parabolic cylinders are comparable with constants depending only on M sharp.

      \[
      \varphi(x,t)=\phi(y(x,t),s(t)).
      \]

      The chain rule writes partial t varphi, nabla varphi, and Delta varphi as finite sums of normalized derivatives of phi multiplied by bounded frame coefficients and the expected powers of r. Inserting varphi into the Eulerian local energy inequality gives the same inequality in the normalized cylinder, with lower-order frame terms controlled by the bounded distortion constants. These terms are exactly the moving-frame contributions included in the normalized SCF base convention.

