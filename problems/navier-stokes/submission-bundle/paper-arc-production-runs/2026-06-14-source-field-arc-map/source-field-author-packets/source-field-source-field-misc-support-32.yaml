    \lim_{s\to-\infty}\int_{B_R}|v(y,s)|^2\,dy=0
    \qquad (R<\infty).
    \]

    \[
    \lim_{s\to-\infty}\int_{\mathbb R^3}|w(z,s)|^2\Omega(z,s)\,dz=0,
    \]

    Proof: choose the bad source-residue tile minimal with respect to the same-fluid backward parent relation. If an earlier parent with positive normalized source-residue mass existed, the selected tile would not be first. Hence the inherited source-residue parent term vanishes in the first-pulse limit.

    \[
    S(T)
    \le
    \theta D(T)+\sum_{P\prec T}\kappa(P,T)S(P)+Err(T).
    \]

    \[
    S(T_0)\le \theta D(T_0)+Err(T_0).
    \]

    \[
    \lim_{s\to-\infty}\int_{B_R}|v(y,s)|^2dy=0
    \]

    This decay would have to be paired with enough global boundary control to
    exclude mass entering from spatial infinity.

    Under the frozen strain flow, contracting directions can transport mass from spatial infinity into fixed compact regions as s increases. Thus local compact decay is not a complete no-incoming condition for the transformed ancient problem.

    The direct backward-uniqueness route remains a reserve route requiring an additional global no-incoming boundary theorem.

    No Incoming License src.A is installed as a logical consequence of first-pulse minimality once the parent relation is fixed. Strong No Incoming License global.A remains open.



    \subsection{No Incoming Flux global.A direct attempt}

    Upgrade first-pulse no-parent information to a global no-incoming flux condition for the frozen-strain tangent field. A usable form would be a transported-cylinder or weighted condition such as

    \[
    \lim_{R\to\infty}\limsup_{s_0\to-\infty}
    \int_{\partial\mathcal C_R(s_0,0)} |w|^2\,d\Phi_{A,S}=0,
    \]

    \[
    z=e^{-sS}y,
    \qquad
    w(z,s)=e^{sS}v(e^{sS}z,s).
    \]

    When S has mixed signs, some directions are contracting in the original variables as time advances. Field energy initially located far from the origin at large negative times can enter a fixed compact observation region at later times through those contracting directions.

    Local compact decay on each fixed ball so controls only mass already inside that ball at early times. It gives no boundary-flux control through the transported parabolic boundary from spatial infinity.

    First-pulse no-parent excludes earlier selected same-fluid source-residue parents. It gives no estimate for full-field kinetic energy, pressure energy, or nonselected packets entering through the global transformed boundary. Thus it supplies the correct input for the adjoint parent-or-charge route, while falling short of the global incoming-flux condition needed for direct backward uniqueness.


