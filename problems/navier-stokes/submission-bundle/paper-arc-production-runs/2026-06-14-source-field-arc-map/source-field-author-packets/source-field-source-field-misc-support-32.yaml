      \subsection{Manuscript-Grade Periodic Theorem Sequence: Final Order}

      For every smooth divergence-free zero-mean datum on T 3, the unforced three-dimensional incompressible Navier-Stokes equations have a global smooth solution.

      The high-frequency cascade is controlled on every finite classical interval. The proof splits the nonlinear transfer into low-mode, threshold-spill, and high-high packets; absorbs the high-high packet by the enstrophy half-tail; and applies the fixed-threshold scheduler.

      The averaged terminal-tail route produces the terminal readout cover. The no-jump branch gives a finite positive-scale SCF-good cover and averaged transported-center control. The complementary averaged jump face is removed downstream by the averaged endpoint theorem. After averaged endpoint closure, the readout layer supplies the pointwise transported-center and field inputs.

      The pointwise endpoint matrix removes every first terminal face: dead participation, pack detachment, tower blowup, field jump, and cross entries.

      Let [0,T *) be the maximal classical interval. If T * is finite, Lemma 1 rules out cascade-driven terminal failure. Lemma 2 supplies the terminal readout inputs. Lemma 3 removes every endpoint face. The maximality assumption has no remaining terminal obstruction. Hence T *=infinity.

      This historical theorem is the periodic branch. It is not the current R3 authority; the present submission reads the whole-space branch through the June 8 CM endpoint-consumption chain.


