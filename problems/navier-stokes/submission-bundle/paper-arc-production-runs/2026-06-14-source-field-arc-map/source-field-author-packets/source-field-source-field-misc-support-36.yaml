      \subsection{Positive Source Adjoint Escape Identity Attempt}

      Direct discharge fails at the positive-source adjoint escape identity.  The
      attempted identity is the formula needed for BASAC Atom Escape Dichotomy.A.

      \[
      \langle \mu_m^{src},\psi_m\rangle\to c_0>0.
      \]

      \[
      \langle \mu_m^{src},\psi_m\rangle
      =
      \mathrm{Flux}_{tr,cyl,m}
      +\mathrm{Residence}_m
      +\mathrm{Pressure}_{\mathrm{eig},m}
      +L_{\mathrm{legal},m}
      +o_m(1).
      \]

      \[
      |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
      \]

      The available adjoint identities are effective in signed-current or near-band
      presentations.  They allow projected pressure cancellation, cutoff record
      routing, and ASAC-style alignment payments.

      A terminal source atom can pair positively with \(\psi_m\) while having no
      temporal residence.  Boundary flux through transported cylinders may
      concentrate on the terminal time face.  Pressure/eigenframe sustain controls
      only conditional near-band signed-current structure.

      The unresolved comparison is the same positive-carrier comparison:
      \[
      A_{\mathrm{def},m}^{+,src}
      \le C_{\mathrm{PAD}}
      \sum_P\int_{Q(P)}
      |w_{j_P}|^2
      \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+dxdt.
      \]

      The identity is not installed.  The next sharper target is Positive Adjoint
      Defect Depletion.A, equivalent to proving that the positive source-weighted
      adjoint defect has no fourth escape channel.


