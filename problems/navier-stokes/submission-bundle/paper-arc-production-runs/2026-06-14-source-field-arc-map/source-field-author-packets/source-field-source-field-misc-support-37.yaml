      \subsection{Quantitative defect-charge lower-bound and separation theorem - hard obstruction record}

      Target: prove the lower-bound/separation theorem needed for direct Jump avg elimination.

      The required statement is: persistent B epsilon Phi cells generate defect charges D k with a uniform lower contribution and enough separation to force a divergent or globally excessive total charge.

      The current route supplies bad-set persistence and candidate charge language. It does not supply the quantitative separation, quasi-orthogonality, or lower-flux inequality needed to convert persistence into contradiction.

      Result: the quantitative defect-charge theorem remains the hard remainder inside Jump avg elimination. The branch is reduced to this exact theorem plus the pressure/source upper-bound estimates.


