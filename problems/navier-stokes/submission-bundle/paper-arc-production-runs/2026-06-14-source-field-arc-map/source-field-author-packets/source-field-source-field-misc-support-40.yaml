      \subsection{SCFBase Modulus Failure To Epsilon Defect}

      Here SCF base is the nonnegative scale-critical packet on pack-stabilized same-fluid cylinders.

      Failure of a label-time-scale modulus can occur by subcritical oscillation. For example, values may oscillate across labels, times, and scales while remaining strictly below the CKN threshold m.

      Such a failure gives no epsilon-level defect. So the bare implication is too strong.

      \[
      Q_{r_n}^{\Phi}(a_n,t_n),
      \qquad
       t_n\uparrow T_* ,
      \]

      By Pack.TTU, the same-fluid geometry is compactly comparable. Passing to a subsequence gives

      \[
      (a_n,t_n,r_n)\to(a_*,T_*,r_*),
      \qquad
      r_*\in[0,r_0].
      \]

      If r *=0, this is a terminal blow-up density. If r *>0, this is a positive-scale terminal SCF defect.

      \[
      \mathrm{Jump}_{\mathrm{avg}}.
      \]

      \[
      tower\text{-}blown.
      \]

      Thus threshold concentration supplies the defect object needed for the endpoint routes, while full Jump avg typing still requires the stronger bad-at-all-scales condition.

      The next step is endpoint-face exclusion. The defect has already been typed into Jump avg under the bad-at-all-scales strengthening, and into tower-blown under tower/readout compatibility.


