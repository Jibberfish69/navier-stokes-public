      \subsection{Separated lower accumulation for nu SCF - obstruction}

      The missing prior step is component selection. The threshold SCF sequence may still be carried by the velocity-energy component E u, while the selected charge nu SCF carries dissipation and local pressure. Thus the route has no theorem producing even one positive terminal nu SCF defect from the extracted SCF threshold sequence.

      A second obstruction appears after component selection. A finite terminal defect alone gives a positive charge at a limit object or a nested packet. To contradict the finite upper bound, the proof needs a separated or bounded-overlap schedule with repeated positive lower charge. Nested repeats do not qualify for the same bounded-overlap upper estimate.

      This failed attempt preserves the useful progress: the upper side is installed and Jump avg produces a threshold SCF sequence. Full branch elimination still requires the lower schedule theorem for the same charge.


