      \subsection{Selected Source Dissipation Tether.A direct attempt}

      Failed direct proof. The attempt gives a sharper obstruction: tethering the selected source to CKN dissipation is not enough unless the CKN dissipation measure itself has a terminal-strip modulus on the selected B ASAC windows.

      \[
      \mu_m^{src,+}\ll \mathcal D_m^{CKN}
      \]

      \[
      \mu_m^{src,+}(B_R\times[-\varepsilon,0])
      \le \omega_R(\varepsilon)+o_m(1),
      \qquad \omega_R(\varepsilon)\downarrow0.
      \]

      \[
      [\langle S_{<j}^{loc}w_j,w_j\rangle]_+.
      \]

      \[
      \mathcal D^{CKN}=\nu |\nabla u|^2\,dxdt.
      \]

      \[
      [\langle S_{<j}^{loc}w_j,w_j\rangle]_+
      \le |S_{<j}^{loc}| |w_j|^2.
      \]

      The second term is the -source / active-reserve carrier. Controlling it is route-equivalent to Local Positive Source Carleson.A, Scale Critical Tree Carleson.A, or Positive Remainder Depletion.A.

      Thus the pointwise tether does not close without importing the existing source-reserve wall.

      The second statement is a no-terminal-dissipation-atom property for the rescaled selected sequence. It is stronger than finite total dissipation. Bounded L 1 families of densities can converge to time atoms.

      Energy-measure concentration theory can rule out some terminal concentration under extra L q tL p x, Type-I, or density hypotheses. The current B ASAC production does not yield those hypotheses. So this route also requires a new production theorem.

      The first input fails by a -source remainder unless an active reserve is added. The second input is not supplied by finite energy/dissipation alone. Hence the route remains open at a sharper pair of analytic atoms.


