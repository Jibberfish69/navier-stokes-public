    If Zeno Square Cancellation Class Production.A is proved, the extracted Zeno limit has nonzero inherited residue by compactness and zero residue by rigid-class Liouville, a contradiction. Thus failure of Scale Critical Tree Carleson.A becomes impossible, and the reserve becomes legal.

    Without the class-production theorem, the Zeno branch halts at compact ancient local suitable limits carrying possible positive source residue.



