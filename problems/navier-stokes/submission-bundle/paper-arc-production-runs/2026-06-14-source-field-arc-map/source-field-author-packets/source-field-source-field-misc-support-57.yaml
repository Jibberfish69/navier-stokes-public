      :=
      \nu\sum_{j=1}^{J}
      \big|
      \Delta U_1(c_j(t),t)
      \big|,
      \]

      \[
      \mathfrak F_{1,\rho,\psi}^{aff,sup}(t)
      :=
      \mathfrak T_{1,\rho,\psi}^{press,far}(t)
      +
      \mathfrak K_{1,\rho,\psi}^{visc,ctr}(t).
      \]

      \[
      \mathfrak E_I^{vel}<\infty.
      \]

      \[
      \mathfrak F_{1,\rho,\psi}^{aff,sup}\in L^1(I)
      \Longleftrightarrow
      \mathfrak K_{1,\rho,\psi}^{visc,ctr}\in L^1(I).
      \]

      \[
      \mathfrak K_{1,\rho,\psi}^{visc,ctr}(t)
      \le
      C_{\rho,\psi}\,\nu\,
      \mathfrak A_{3,\rho,\psi}^{ctr}(t).
      \]

      So the viscous first-rung record is algebraically a third-rung center readout. It is not a pressure-tail or geometry-side datum.

      No new route is introduced. The exact remaining same-fluid supplier still needed on the installed one-field receiver branch is fixed here.

