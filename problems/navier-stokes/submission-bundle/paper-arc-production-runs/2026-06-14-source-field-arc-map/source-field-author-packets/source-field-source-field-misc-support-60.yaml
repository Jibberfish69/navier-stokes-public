      \subsection{Pctp Hard Matrix Readable Discharge}

      \[
      pctp\text{-}hard\text{-}terminal\text{-}tail\text{-}uniformization.
      \]

      The proof uses the averaged production branch first, then the terminal pointwise readout layer.

      \[
      \text{strict averaged-good finite cover}\quad\vee\quad \mathrm{Jump}_{\mathrm{avg}}.
      \]

      On the strict averaged-good branch, there is a finite SCF-good same-fluid cover with radii bounded below and bounded overlap. On each shrunken cylinder, ATD m supplies the local finite-depth averaged affine tower packet.

      \[
      B_{i,p}=1+A_{i,p}+V_i+P_i,
      \qquad
      G_{i,p}=F_{i,p}.
      \]

      SCF base and ATD m give B i,p ,G i,p L 1. The cover and parameter set are finite, so

      \[
      B:=\sum_{i,p}B_{i,p}\in L^1,
      \qquad
      G:=\sum_{i,p}G_{i,p}\in L^1.
      \]

      The Jump avg branch from the terminal cover dichotomy is removed at this stage as an averaged endpoint face.

      On the resulting finite positive-scale cover, ATD m gives the pointwise readout inputs. The field readout gives

      The pressure component uses the local Poisson split plus energy far-tail control, and the viscous component uses the U q+2 rung.

      \[
      Dead,
      \qquad
      packing\text{-}detached,
      \qquad
      tower\text{-}blown,
      \qquad
      Jump.
      \]

      The previous face-reduction notes also show that every non-tower first face reduces to tower-blown, and the readout layer supplies the pointwise tower package. Thus a first finite classical endpoint has no remaining endpoint face.

      The retained \(H^s\) bound with \(s>5/2\) triggers the periodic continuation criterion and extends the solution past T *, contradicting maximality.

      It should be read together with the listed source surfaces as the direct theorem-facing discharge packet for that obligation.


