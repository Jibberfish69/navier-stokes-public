      \sup_{t<T_*}\sup_i\sup_{0\le q\le N}\|\nabla^{q+1}p(t)\|_{L^\infty(B_i')}
      <\infty.
      \]

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q,
