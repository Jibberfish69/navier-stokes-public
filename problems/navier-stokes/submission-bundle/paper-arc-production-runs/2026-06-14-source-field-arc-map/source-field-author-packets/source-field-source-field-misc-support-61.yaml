    Terminal Promotion Bridge}\n\nLet \\(u_0\\in C^\\infty(\\mathbb T^3;\\mathbb R^3)\\)
    be divergence-free and\nmean-zero, and let \\((u,p)\\) be the corresponding maximal
    classical solution of\nthe unforced incompressible Navier--Stokes equation on
    \\([0,T_*)\\).\n\nAssume that the Theorem 2.1 class-membership closure warrant
    holds on every\nretained same-fluid approach window generated by this maximal
    classical\nsolution.  Then \\(T_*<\\infty\\) is impossible.  Equivalently, the\nclass-membership
    warrant excludes every first finite classical endpoint on the\nperiodic branch.\n\nAssume
    for contradiction that \\(T_*<\\infty\\).  Classical local well-posedness\nand
    the continuation criterion give the following endpoint alternative: if all\nrequired
    classical norms remain bounded on compact subintervals approaching\n\\(T_*\\),
    then the solution extends past \\(T_*\\).  Hence a nonextendable finite\nendpoint
    forces the loss of one route-visible continuation witness on a\nsame-fluid approach
    window.\n\nA first nonextendable classical endpoint must so appear to the class-membership
    vocabulary as failure of one of these witnesses, or as a tower/pack endpoint face
    detected by the endpoint matrix. By endpoint exhaustiveness, the first endpoint
    has one of the faces\n\n\\(\\mathrm{End}_{NS}\\) removes each endpoint face, so
    the assumed first finite\nclassical endpoint has no remaining face on which it
    can land.  This\ncontradiction excludes \\(T_*<\\infty\\).\n\nSince the argument
    uses only the original periodic Navier--Stokes solution, its flow, its pressure,
    and the installed class-membership witness vocabulary, no regularized or projected
    substitute equation enters the bridge. The HFG/MEG side primitive is not used
    in this terminal bridge.\n\nOn the periodic branch, Theorem 2.1 supplies the class-membership
    closure\nwarrant on each retained same-fluid approach window.  With that warrant
    in\nplace, the endpoint-exclusion argument above gives global continuation of
    the\nmaximal smooth solution.\n\n\n\n\\subsection{Positive Budget Upper Control.A
    / Source Upper Control.A Expansion}\n\n\\[\n\\int_I\\sum_{j\\ge \\max(N,k+C)}2^{-j}D_j(t)^2\\,dt\n\\le\n\\varepsilon\\nu
    2^{2k}|I|+C2^{-2\\delta\\max(N,k)}\n\\]\n\n\\[\nD_n(t)=n\\mathbf 1_{[0,1/n]}(t).\n\\]\n\nThus
    a fixed positive first-moment budget gives no -source upper bound. In particular,
    a lower budget condition is compatible with unbounded active- mass on shrinking
    windows.\n\n\\[\nE_j'(t)+c\\nu D_j(t)\\le F_j(t),\n\\]\n\n\\[\n\\int_{I_j}F_j(t)\\,dt\n\\ge\nc\\nu\\int_{I_j}D_j(t)\\,dt
    - o(1).\n\\]\n\n\\[\nE_j(b_j)-E_j(a_j)+c\\nu\\int_{I_j}D_j(t)\\,dt\n\\le\n\\int_{I_j}F_j(t)\\,dt.\n\\]\n\nThe
    active- and -source notes identify their estimates with upper control of the terminal
    active-window source mass. Active Shell Amplitude Gain.A supplies the missing
    scale factor on those windows and implies the active- Carleson form. Scale Critical
    Tree Carleson.A is the tree-carleson reserve version of the same upper-control
    statement. Each so gives Source Pulse Exclusion.A by the existing source-pulse
    route reductions. The downstream arrows are the installed source-pulse consumer
    chain.\n\nLemma 1 blocks this implication at the scalar level: lower first-moment
    budget permits unbounded mass on shrinking active windows. Lemma 2 shows the PDE
    version of the same issue: the nonlinear source term F j can balance viscous drain
    unless a source-pulse exclusion theorem controls it on the selected windows.\n\n\n\n\\subsection{Positive
    Remainder Depletion Object-Type Correction}\n\nPositive Remainder Depletion.A
    is a positive supplier estimate. It is not a Pack/Part/Field witness and it has
    no Dead/Blown/Jump endpoint type.\n\n\\[\n\\mu_\\ast^{sing}>0\n\\quad\\text{or
    another retained positive source residue.}\n\\]\n\nThat residue then needs its
    own routing. Loss of same-fluid carrier is Pack-facing. Loss of the pressure-viscosity
    participation law is Part-facing. Retained Pack Q + Part N,Q plus surviving native
    positive source residue is the Field-side source-residue diagnostic.\n\nThat classification
    is not a proof of the supplier theorem and not an endpoint contradiction by itself.\n\nSay
    instead: Positive Remainder Depletion.A is the positive supplier burden; a surviving
    positive source residue after supplier failure can be routed to Field/Jump only
    after retained Pack and Part and the named source-residue bridge.\n\n\n\n\\subsection{R3
    Exterior Cascade Theorem Final state}\n\nwhere E s tail controls the commutator,
    cutoff, pressure, and high-frequency exterior flux terms in the localized H s
    energy identity.\n\n\\[\nu\\in L_t^\\infty L_x^2,\n\\qquad\n\\nabla u\\in L^2_{t,x},\n\\]\n\nThese
    inputs do not imply exterior H s tightness. Exterior L 2 tightness controls mass,
    not high-frequency derivative concentration.\n\n\\[\n\\frac d{dt}\\|\\eta_R\\Lambda^s
    u\\|_2^2\n+\\nu\\|\\eta_R\\nabla\\Lambda^s u\\|_2^2\n\\le\nC_s\\|\\nabla u\\|_{L^\\infty}\\|\\eta_R\\Lambda^s
    u\\|_2^2\n+C_{s,\\nu}\\mathcal E_s^{tail}(R,t).\n\\]\n\n\\[\n\\sup_{t<T_*}\\|u(t)\\|_{H^s(R^3)}.\n\\]\n\nThe
    available finite-energy and compact-core estimates do not control the exterior
    high-frequency commutator terms. A high-frequency packet can move to spatial infinity
    with small L 2 mass and non-small H s tail. Thus the desired cascade estimate
    is not a consequence of the current inputs.\n\nThe unconditional R3 theorem requires
    a new noncircular proof of Ext Cascade s R3 or a different theorem eliminating
    Tail Face R3 Hs.\n\nThe periodic T 3 branch remains the completed theorem surface.
    The whole-space R 3 branch is organized but conditional at the spatial-infinity
    high-frequency tail. It must not be promoted through the periodic matrix.\n\n\\[\nT^3\\text{
    branch: closed in theorem-program matrix},\n\\]\n\n\n\n\\subsection{R3 Exterior
    High-Order Dissipation Obstruction}\n\nThe exterior high-order energy identity
    below identifies the missing record needed to prove the stronger direct-positive
    theorem Tail.Hs R3.\n\n\\[\neta_R=0\\quad |x|\\le R,\n\\qquad\neta_R=1\\quad |x|\\ge
    2R,\n\\qquad\n|\\nabla^k eta_R|\\le C_{k,46359} R^{-k}.\n\\]\n\n\\[\n\\mathcal
    H_s^{tail}(R,t)\n:=\\|eta_R\\Lambda^s u(t)\\|_2^2\n\\]\n\n\\[\n\\sup_{t<T_*}\\mathcal
    H_s^{tail}(R,t)\to0\n\\qquad(R\\to\\infty).\n\\]\n\nApply Lambda s to the equation
    and test against eta R 2 Lambda s u. After integration by parts,\n\n\\[\n\\frac12\\frac
    d{dt}\\|eta_R\\Lambda^s u\\|_2^2\n+\\nu\\|eta_R\\nabla\\Lambda^s u\\|_2^2\n\\le\n\\mathcal
    C_R+\n\\mathcal B_R+\n\\mathcal P_R.\n\\]\n\n\\[\n\\mathcal C_R\n=\\left|\\int
    eta_R^2\\Lambda^s u\\cdot\n[\\Lambda^s,u\\cdot\\nabla]u\\,dx\\right|.\n\\]\n\nwhere
    C R ann is supported in the annulus R<|x|<2R and contains cutoff commutators.\n\nwhere
    P s tail is an exterior pressure commutator record controlled by local product-source
    bounds plus far-field pressure tail estimates.\n\nThus Tail.Hs R3 follows under
    this added exterior high-order coefficient record.\n\nSo the current direct-positive
    tail-control inputs prove only the conditional statement above. They do not derive
    the exterior high-order dissipation record from Original Smooth Data R3.\n\nThe
    direct positive R3 Tail.Hs branch must either prove the exterior high-order coefficient
    record directly from original data, or add Tail Face R3 Hs to the endpoint matrix
    and eliminate it by a separate theorem.\n\nThe exterior high-order dissipation
    route is conditionally valid, with an explicit Gronwall record. The noncircular
    derivation of that record from Original Smooth Data R3 remains open.\n\n\n"
