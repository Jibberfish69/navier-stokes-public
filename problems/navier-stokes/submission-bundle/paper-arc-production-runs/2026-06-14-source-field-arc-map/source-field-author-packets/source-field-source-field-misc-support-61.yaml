    text: "\\subsection{R3 Exterior High-Order Dissipation Obstruction}\n\nThe exterior
      high-order energy identity below identifies the missing record needed to prove
      the stronger direct-positive theorem Tail.Hs R3.\n\n\\[\neta_R=0\\quad |x|\\le
      R,\n\\qquad\neta_R=1\\quad |x|\\ge 2R,\n\\qquad\n|\\nabla^k eta_R|\\le C_{k,46359}
      R^{-k}.\n\\]\n\n\\[\n\\mathcal H_s^{tail}(R,t)\n:=\\|eta_R\\Lambda^s u(t)\\|_2^2\n\\]\n\n\\[\n\\sup_{t<T_*}\\mathcal
      H_s^{tail}(R,t)\to0\n\\qquad(R\\to\\infty).\n\\]\n\nApply Lambda s to the equation
      and test against eta R 2 Lambda s u. After integration by parts,\n\n\\[\n\\frac12\\frac
      d{dt}\\|eta_R\\Lambda^s u\\|_2^2\n+\\nu\\|eta_R\\nabla\\Lambda^s u\\|_2^2\n\\le\n\\mathcal
      C_R+\n\\mathcal B_R+\n\\mathcal P_R.\n\\]\n\n\\[\n\\mathcal C_R\n=\\left|\\int
      eta_R^2\\Lambda^s u\\cdot\n[\\Lambda^s,u\\cdot\\nabla]u\\,dx\\right|.\n\\]\n\nwhere
      C R ann is supported in the annulus R<|x|<2R and contains cutoff commutators.\n\nwhere
      P s tail is an exterior pressure commutator record controlled by local product-source
      bounds plus far-field pressure tail estimates.\n\nThus Tail.Hs R3 follows under
      this added exterior high-order coefficient record.\n\nSo the current direct-positive
      tail-control inputs prove only the conditional statement above. They do not
      derive the exterior high-order dissipation record from Original Smooth Data
      R3.\n\nThe direct positive R3 Tail.Hs branch must either prove the exterior
      high-order coefficient record directly from original data, or add Tail Face
      R3 Hs to the endpoint matrix and eliminate it by a separate theorem.\n\nThe
      exterior high-order dissipation route is conditionally valid, with an explicit
      Gronwall record. The noncircular derivation of that record from Original Smooth
      Data R3 remains open.\n\n\n"
