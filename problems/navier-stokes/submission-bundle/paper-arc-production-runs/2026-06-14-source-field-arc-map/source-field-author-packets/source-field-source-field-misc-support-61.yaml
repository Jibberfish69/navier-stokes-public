      \subsection{Periodic Terminal Promotion Bridge}

      Let \(u_0\in C^\infty(\mathbb T^3;\mathbb R^3)\) be divergence-free and
      mean-zero, and let \((u,p)\) be the corresponding maximal classical solution of
      the unforced incompressible Navier--Stokes equation on \([0,T_*)\).

      Assume that the Theorem 2.1 class-membership closure warrant holds on every
      retained same-fluid approach window generated by this maximal classical
      solution.  Then \(T_*<\infty\) is impossible.  Equivalently, the
      class-membership warrant excludes every first finite classical endpoint on the
      periodic branch.

      Assume for contradiction that \(T_*<\infty\).  Classical local well-posedness
      and the continuation criterion give the following endpoint alternative: if all
      required classical norms remain bounded on compact subintervals approaching
      \(T_*\), then the solution extends past \(T_*\).  Hence a nonextendable finite
      endpoint forces the loss of one route-visible continuation witness on a
      same-fluid approach window.

      A first nonextendable classical endpoint must so appear to the class-membership vocabulary as failure of one of these witnesses, or as a tower/pack endpoint face detected by the endpoint matrix. By endpoint exhaustiveness, the first endpoint has one of the faces

      \(\mathrm{End}_{NS}\) removes each endpoint face, so the assumed first finite
      classical endpoint has no remaining face on which it can land.  This
      contradiction excludes \(T_*<\infty\).

      Since the argument uses only the original periodic Navier--Stokes solution, its flow, its pressure, and the installed class-membership witness vocabulary, no regularized or projected substitute equation enters the bridge. The HFG/MEG side primitive is not used in this terminal bridge.

      On the periodic branch, Theorem 2.1 supplies the class-membership closure
      warrant on each retained same-fluid approach window.  With that warrant in
      place, the endpoint-exclusion argument above gives global continuation of the
      maximal smooth solution.


