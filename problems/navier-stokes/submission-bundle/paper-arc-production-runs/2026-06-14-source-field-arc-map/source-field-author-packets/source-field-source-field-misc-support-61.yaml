      \subsection{Positive Remainder Depletion Object-Type Correction}

      Positive Remainder Depletion.A is a positive supplier estimate. It is not a Pack/Part/Field witness and it has no Dead/Blown/Jump endpoint type.

      \[
      \mu_\ast^{sing}>0
      \quad\text{or another retained positive source residue.}
      \]

      That residue then needs its own routing. Loss of same-fluid carrier is Pack-facing. Loss of the pressure-viscosity participation law is Part-facing. Retained Pack Q + Part N,Q plus surviving native positive source residue is the Field-side source-residue diagnostic.

      That classification is not a proof of the supplier theorem and not an endpoint contradiction by itself.

      Say instead: Positive Remainder Depletion.A is the positive supplier burden; a surviving positive source residue after supplier failure can be routed to Field/Jump only after retained Pack and Part and the named source-residue bridge.


