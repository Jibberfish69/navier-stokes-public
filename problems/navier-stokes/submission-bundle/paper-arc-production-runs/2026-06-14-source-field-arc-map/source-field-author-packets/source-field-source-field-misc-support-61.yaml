      \]

      \[
      D_n(t)=n\mathbf 1_{[0,1/n]}(t).
      \]

      Thus a fixed positive first-moment budget gives no -source upper bound. In particular, a lower budget condition is compatible with unbounded active- mass on shrinking windows.

      \[
      E_j'(t)+c\nu D_j(t)\le F_j(t),
      \]

      \[
      \int_{I_j}F_j(t)\,dt
      \ge
      c\nu\int_{I_j}D_j(t)\,dt - o(1).
      \]

      \[
      E_j(b_j)-E_j(a_j)+c\nu\int_{I_j}D_j(t)\,dt
      \le
      \int_{I_j}F_j(t)\,dt.
      \]

      The active- and -source notes identify their estimates with upper control of the terminal active-window source mass. Active Shell Amplitude Gain.A supplies the missing scale factor on those windows and implies the active- Carleson form. Scale Critical Tree Carleson.A is the tree-carleson reserve version of the same upper-control statement. Each so gives Source Pulse Exclusion.A by the existing source-pulse route reductions. The downstream arrows are the installed source-pulse consumer chain.

      Lemma 1 blocks this implication at the scalar level: lower first-moment budget permits unbounded mass on shrinking active windows. Lemma 2 shows the PDE version of the same issue: the nonlinear source term F j can balance viscous drain unless a source-pulse exclusion theorem controls it on the selected windows.


