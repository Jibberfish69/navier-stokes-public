      \subsection{Terminal Signed Saturation.A or donor-depletion hard stop}

      Terminal Signed Saturation.A asks that every selected terminal positive source edge has its signed counter-edge either inside the usable same-fluid record or paid by a named legal record.

      Current inputs supply the bare dyadic skew current before one-sided weights, lifted commutators, and terminal selection. After those operations, the selected positive edge can lose its counter-edge outside the usable terminal record. The residue is a real active strain-alignment source.

      Parabolic NoFree Sink.A asks that every source-current path feeding terminal positive divergence is boundary-fed, heat-action charged, legal-loss charged, or earlier-forbidden.

      \[
      J(A\to B)=F>0,
      \qquad
      \operatorname{div}J(B)=F,
      \qquad
      \operatorname{div}J(A)=-F.
      \]

      The receiver has terminal positive divergence. The donor is an internal negative sink. First-current pruning acts on earlier positive arrivals, while the donor is negative. Boundary and cutoff records price genuine exits and localization losses. A legal same-fluid donor inside the packet system needs a donor reserve.

      Raw energy, local energy, finite shell banding, and same-fluid transport do not produce the scale-normalized donor reserve.

      Current installed inputs reduce every branch to this same source-wall object. A new theorem must either establish signed positive-source balance on selected terminal windows or supply a scale-normalized donor reserve for legal internal same-fluid donor sinks.


