      \subsection{Terminal Defect Persistence.A measure split}

      The stronger statement that the limiting velocity-pressure pair itself has large SCF base remains open unless the route supplies strong convergence of all SCF components or a Liouville theorem that accepts the residual defect measure.

      \[
      \nu_n
      :=
      \nu_{E,n}+\nu_{D,n}+\nu_{P,n}+\nu_{\Phi,n}.
      \]

      Here $\nu_{D,n}$ is the rescaled $|u^{(n)}|^2$ carrier and $\nu_{P,n}$ is
      the rescaled local-pressure $|p_{\mathrm{loc}}^{(n)}|^{3/2}$ carrier in the
      compatible pressure gauge. The energy and geometric terms are included with
      the same normalization used by the SCF base.

      \[
      \sup_n \nu_n(Q_R^-)<\infty
      \qquad\text{for every fixed }R.
      \]

      \[
      \int \psi\,d\nu_n\ge c_0
      \qquad\text{for all large }n.
      \]

      \[
      \nu_n\stackrel{*}{\rightharpoonup}\nu_*
      \]

      \[
      \nu_*(Q_1^-)>0.
      \]

      Thus the extracted terminal tangent carries a nonzero terminal SCF defect measure.

      This proves the measure-valued persistence statement. It is weaker than strong
      persistence of the velocity-pressure pair itself: weak suitable compactness can
      place part of the dissipation or local-pressure mass in the defect measure
      instead of in a strong limiting field.


