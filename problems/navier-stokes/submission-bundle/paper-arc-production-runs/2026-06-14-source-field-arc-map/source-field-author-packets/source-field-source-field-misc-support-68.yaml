      \subsection{Restricted CG Reference-Gap Persistence}

      The first selector-strain discharge surface on the exact-potential Cauchy--Green branch is the Cauchy--Green reference-gap theorem. Its interaction with the three residual budgets from D.7mb is made explicit below.

      Keep one exact-potential selector-good atom-free window I 0=[t 0,t 1], one transported good base point a, and one active pair (a,b). Let

      \[
      \mathcal C_J^N(t,a):=(W_J^N(t,a))^*W_J^N(t,a)
      \]

      \[
      g_0
      :=
      \lambda_1\!\bigl(\mathcal C_J^N(t_0,a)\bigr)
      -
      \lambda_2\!\bigl(\mathcal C_J^N(t_0,a)\bigr)
      >0.
      \]

      Write P J CG (t,a) for the top spectral projector of C J N(t,a) and P J,t 0 CG (a):=P J CG (t 0,a).

      \[
      E_{J,t_0}^{CG}(t,a)
      :=
      2\int_{t_0}^t
      \bigl|W_J^N(s,a)\bigr|_{\mathrm{op}}^2\,|S_J^N(s,a)|\,ds,
      \]

      \[
      \eta_{J,0}^{mb}(a,b)
      :=
      |m_J(t_0,a,b)|,
      \]

      \[
      \eta_{J,\mathrm{off}}^{mb}(t,a,b)
      :=
      2\int_{t_0}^t
      \Bigl|
      Q_J^{top}(s)\,(W_J^N(s,a))^*S_J^N(s,a)W_J^N(s,a)\,n_J(a,b,s)
      \Bigr|\,ds,
      \]

      That is stricter than the informal slogan "small D.7mb budgets preserve the CG gap," but it is the mathematically justified theorem supported by the current on-disk reductions.


