    \left|
    \left\langle
    \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big),
    \Delta u
    \right\rangle
    \right|
    \le
    \|(u\cdot\nabla)u\|_{L^2}\,\|\Delta u\|_{L^2}.
    \]

    \[
    \|(u\cdot\nabla)u\|_{L^2}
    \le
    \|u\|_{L^6}\,\|\nabla u\|_{L^3}
    \le
    C\|\nabla u\|_{L^2}^{3/2}\|\Delta u\|_{L^2}^{1/2},
    \]

    if the shadow remainder vanishes, (10) reduces to the ordinary classical continuation channel; if the shadow remainder does not vanish, the price paid by Route B is exactly an H 1 forcing term.

    Since the current shadow notes place E sh in H s-1 with s> 52, this is the correct classical norm level for turning the robustness branch into a genuine continuation estimate.

    It proves only that the Route B shadow remainder enters the classical continuation problem through the forced H 1 inequality (10).



    \subsection{Shadow Remainder H s Forcing Estimate}

    The weaker shadow-remainder branch becomes an exact classical forcing estimate.

    It does not prove the weaker branch closes. It proves that if the projected equation carries a remainder term, then the classical question becomes a standard forced H s continuation problem.

    \[
    \partial_t u + \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big)
    =
    \nu\Delta u + E,
    \]

    where E is a divergence-free forcing term or, more generally, where any gradient part of the forcing has already been absorbed into pressure.

    \[
    E = \mathbb P_{\mathrm{Leray}}E_{\mathrm{sh}}(X).
    \]

    \[
    \frac12\frac{d}{dt}\|u\|_{H^s}^2
    +
    \nu\|\nabla u\|_{H^s}^2
    \le
    C_s\|u\|_{H^s}^3
    +
    \|E\|_{H^{s-1}}\|u\|_{H^{s+1}}.
    \]

    \[
    \frac{d}{dt}\|u\|_{H^s}^2
    +
    \nu\|\nabla u\|_{H^s}^2
    \le
    C_s\|u\|_{H^s}^3
    +
    C_{\nu,s}\|E\|_{H^{s-1}}^2.
    \]

    \[
    \frac12\frac{d}{dt}\|u\|_{H^s}^2
    +
    \nu\|\nabla u\|_{H^s}^2
    =
    -\big\langle \Lambda^s\mathbb P_{\mathrm{Leray}}((u\cdot\nabla)u),\Lambda^s u\big\rangle
    +
    \big\langle \Lambda^s E,\Lambda^s u\big\rangle.
    \]

    So the weaker branch is no longer only narrative. It has a concrete classical energy inequality attached to it.



    \subsection{Shell-Amplitude Gain Active-Interval Result}

    \[
    E_j(t)\le C_{\mathrm{sf},59655} \nu^{1/2}2^{-j/2}
    \]

    \[
    2^{-j}D_j(t)^2=2^{3j}E_j(t)^2.
    \]

    For any fixed shell j, choose smooth divergence-free initial data with a nonzero component in that shell and amplitude A. Then

    \[
    E_j(0)=A^2E_j(e)
    \]

    \[
    E_j(0)\le C_{\mathrm{sf},59669} \nu^{1/2}2^{-j/2}.
    \]

    Thus the fixed-shell amplitude theorem cannot follow from smoothness, divergence-free structure, or shell localization alone.

    \[
    E_j'(t)+c\nu2^{2j}E_j(t)\le F_j(t).
    \]

    then the steady state E j(t)=A is compatible with the scalar inequality. Hence damping does not impose the desired amplitude bound without a source-amplitude theorem.

    This is much weaker than the desired decay. A useful statement must so be a dynamic threshold theorem: shells above a data-dependent smoothness tail may have small E j, while arbitrary fixed shells do not.

    Propagating that smallness to an active interval requires the active-/source control already under discussion.

    The shell-amplitude gain is not available from current inputs. It is equivalent to a new active-shell amplitude theorem or to the active- Carleson theorem itself.



    \subsection{Signed Weighted Commutator-Defect Theorem Attempt}

    \[
    |\langle [\Delta_j,a_k\cdot\nabla]\Delta_\ell u,\Delta_j u\rangle|
    \le C_{\mathrm{sf},59820}
    2^{-c(\ell-j)}2^{3k/2}\|\Delta_k u\|_2D_\ell
    \]

    For fixed compact Littlewood-Paley projectors, choose the separation collar M larger than the projector support width. In the geometry

    \[
    j+M<k<\ell-4,
    \]

    \[
    a_k\cdot\nabla\Delta_\ell u
    \]

    \[
    \Delta_j(a_k\cdot\nabla\Delta_\ell u)=0.
    \]

    \[
    \Delta_j\Delta_\ell u=0,
    \]

    This proves that the bare separated commutator is the wrong live terminal record. The support audit in the weighted signed shell-exchange surface already identifies this: the bare pairwise exchange vanishes once the shell geometry is truly separated.

    The live theorem must instead concern the true commutatorized lifted remainder created after the weighted tail summation and projector/cutoff reductions.

    where R j,k, lift is the surviving commutatorized lifted remainder, rather than the vacuous bare pairwise flux.

    The exact unweighted exchange antisymmetry remains useful, yet the outer one-sided weights create an order-size mismatch. The tail weight gives direction, while the gap decay must come from a signed remainder theorem.

    This is the positive active-/tail burden already known to exceed the inherited Euclidean inputs.


