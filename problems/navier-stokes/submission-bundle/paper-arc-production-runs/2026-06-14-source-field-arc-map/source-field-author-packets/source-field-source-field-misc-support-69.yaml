      \subsection{Shadow Remainder Forced H 1 Bridge}

      It does not prove that the shadow remainder is small. It proves what estimate is needed if the shadowed equation has a remainder term.

      \[
      \partial_t u
      +
      \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big)
      =
      \nu\Delta u
      +
      E_{\mathrm{sh}},
      \qquad
      \nabla\cdot u=0.
      \]

      \[
      E_{\mathrm{sh}}\in H^1(\mathbb R^3).
      \]

      Take the L 2 inner product of (1) with - u. Using incompressibility and Leray orthogonality,

      \[
      \frac12\frac{d}{dt}\|\nabla u\|_{L^2}^2
      +
      \nu\|\Delta u\|_{L^2}^2
      =
      \left\langle
      \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big),
      \Delta u
      \right\rangle
      -
      \langle E_{\mathrm{sh}},\Delta u\rangle.
      \]

      \[
      \left|
      \left\langle
      \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big),
      \Delta u
      \right\rangle
      \right|
      \le
      \|(u\cdot\nabla)u\|_{L^2}\,\|\Delta u\|_{L^2}.
      \]

      \[
      \|(u\cdot\nabla)u\|_{L^2}
      \le
      \|u\|_{L^6}\,\|\nabla u\|_{L^3}
      \le
      C\|\nabla u\|_{L^2}^{3/2}\|\Delta u\|_{L^2}^{1/2},
      \]

      if the shadow remainder vanishes, (10) reduces to the ordinary classical continuation channel; if the shadow remainder does not vanish, the price paid by Route B is exactly an H 1 forcing term.

      Since the current shadow notes place E sh in H s-1 with s> 52, this is the correct classical norm level for turning the robustness branch into a genuine continuation estimate.

      It proves only that the Route B shadow remainder enters the classical continuation problem through the forced H 1 inequality (10).


