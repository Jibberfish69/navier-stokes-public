      It is not a strict-shadow theorem root and it is not the CM-to-Euclidean export splice. It sits downstream of that splice and, more specifically, downstream of the exact strict-shadow input (A1b) on the exported Euclidean surface.

      \[
      \mathcal C(\nabla_X X)=(u\cdot\nabla)u,
      \qquad
      \mathcal C(\iota_X\Omega_D^{\mathrm{nc}}(X))=0.
      \]

      \[
      N_D(X)=\nabla_X X+\iota_X\Omega_D^{\mathrm{nc}}(X),
      \]

      \[
      \mathcal C(N_D(X))=(u\cdot\nabla)u
      \]

      \[
      \partial_t u+\mathbb P_{\mathrm{Leray}}(u\cdot\nabla u)=\nu\Delta u.
      \]

      \[
      \partial_t u+u\cdot\nabla u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0.
