      \subsection{Transport-Assisted Dissipation Target Note}

      Record the exact sign target suggested by the current tower and matrix analysis, after the deformation-geometry correction.

      The point is not merely that viscosity has one extra derivative. The stronger target would be a functional for which the nonlinear mixed source becomes sign-definite and negative.

      \[
      \frac12\frac{d}{dt}\|J_{m,\alpha}\|_{L^2}^2
      +
      \nu\|\nabla J_{m,\alpha}\|_{L^2}^2
      =
      -\sum_{\substack{0\le a\le m,\ \beta\le\alpha\\(a,\beta)\neq(0,0)}}
      \binom ma\binom{\alpha}{\beta}\,
      I_{a,\beta}^{m,\alpha},
      \]

      \[
      I_{a,\beta}^{m,\alpha}
      :=
      \langle (J_{a,\beta}\cdot\nabla)J_{m-a,\alpha-\beta},J_{m,\alpha}\rangle.
      \]

      \[
      \frac{d}{dt}K_{A,B}
      +
      2\nu\langle \nabla J_A,\nabla J_B\rangle
      =
      -\langle \widetilde T_A,J_B\rangle
      -\langle J_A,\widetilde T_B\rangle.
      \]

      \[
      \mathcal R_{A,B}
      :=
      \langle \widetilde T_A,J_B\rangle
      +
      \langle J_A,\widetilde T_B\rangle.
      \]

      \[
      \frac{d}{dt}\mathcal F
      +
      \nu\,\mathcal D
      \le
      -c\,\mathcal M,
      \]

      D is the viscous Dirichlet part, M is a nonnegative quantity strong enough to control the blowup-threatening defect, and the mixed nonlinear part has been converted into a negative or nonpositive quantity.

      But the corrected route says this target should probably be *induced* rather than found in isolation.


