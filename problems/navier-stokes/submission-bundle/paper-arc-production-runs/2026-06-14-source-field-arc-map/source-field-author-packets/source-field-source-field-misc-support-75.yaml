      \subsection{UTKD to NE Reduction Lemma}

      The direct algebraic reduction carries the upper-tail kernelized dissipation theorem (UTKD) to the one-sided weighted bilinear dissipation-tail theorem (NE).

      \[
      D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2,
      \qquad
      \mathcal D_k^\sigma(t):=\sum_{j>k+4}2^{-\sigma(j-k)}D_j(t),
      \]

      \[
      \mathcal T_j^\sigma(t):=\sum_{\ell\ge j}2^{-\sigma(\ell-j)}D_\ell(t).
      \]

      \[
      \sum_{k>N+M}2^k\big(\mathcal D_k^\sigma(t)\big)^2
      \le C_{\mathrm{sf},62609,\sigma}
      \sum_{j>N+M+4}2^j D_j(t)\,\mathcal T_j^\sigma(t).
      \]

      \[
      \sum_{k>N+M}2^k\big(\mathcal D_k^\sigma(t)\big)^2
      =
      \sum_{k>N+M}2^k
      \sum_{j,\ell>k+4}
      2^{-\sigma(j-k)}2^{-\sigma(\ell-k)}D_j(t)D_\ell(t).
      \]

      \[
      \sum_{k>N+M}2^k\big(\mathcal D_k^\sigma(t)\big)^2
      =
      \sum_{j,\ell>N+M+4}
      D_j(t)D_\ell(t)
      \sum_{\substack{k>N+M\\k<j-4\\k<\ell-4}}
      2^k2^{-\sigma(j-k)}2^{-\sigma(\ell-k)}.
      \]

      It does not prove (NE). That theorem remains the first genuinely new theorem after the formal reductions.


