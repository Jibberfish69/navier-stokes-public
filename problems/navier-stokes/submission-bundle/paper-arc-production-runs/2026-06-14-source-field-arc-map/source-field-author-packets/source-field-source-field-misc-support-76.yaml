      \subsection{Weighted Mixed-Jet Radius-Loss Energy Reduction}

      The next exact classical theorem extracted from the weighted mixed-jet package is a radius-loss energy reduction.

      So the classical mixed-jet route is not blocked by raw combinatorics anymore. It now has the shape of a weighted scale-of-spaces problem.

      \[
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
      \qquad
      \Pi_{m,\alpha}:=\partial_t^m\partial_x^\alpha p.
      \]

      \[
      a_{m,\alpha}(t):=\|J_{m,\alpha}(t)\|_{H^s},
      \qquad
      d_{m,\alpha}(t):=\|\nabla J_{m,\alpha}(t)\|_{H^s}.
      \]

      \[
      c_{m,\alpha}(t)
      :=
      \sum_{a=0}^{m}\sum_{\beta\le\alpha}
      \binom ma \binom{\alpha}{\beta}\,
      \|J_{a,\beta}(t)\|_{H^s}\,
      \|J_{m-a,\alpha-\beta}(t)\|_{H^s}.
      \]

      \[
      \partial_t J_{m,\alpha}
      +
      (u\cdot\nabla)J_{m,\alpha}
      +
      \widetilde T_{m,\alpha}
      +
      \nabla\Pi_{m,\alpha}
      =
      \nu\Delta J_{m,\alpha},
      \]

      \[
      \|\widetilde T_{m,\alpha}\|_{H^{s-1}}
      \le
      C_s\,c_{m,\alpha}.
      \]

      It is not yet closed, because the coefficient still contains the 1 weighted norm A s. But it is an exact reduction of the tower to a scale-of-spaces energy problem.

      So the weighted 1 tower norm at a smaller radius is controlled by the squared-weight energy at a strictly larger radius.

      Hence bounded control at a slightly larger weight pair propagates the energy at any strictly smaller weight pair.

      Once the factorial weights are squared, the nonlinear tower becomes an ordinary discrete convolution in 2.

      The unresolved issue is no longer raw binomial combinatorics. It is whether the weighted energy scale can be closed without losing all radius.

      No no-loss or globally propagated weighted slice is proved here, so (C1) remains open.


