      J:=[s_0,s_1].
      \]

      \[
      \frac{\ell}{r}=e^{s-\rho},
      \qquad
      \rho\ge s+L.
      \]

      \[
      (\mathcal K_L f)(s)
      :=
      \int_{s+L}^{s_1} e^{s-\rho} f(\rho)\,d\rho.
      \]

      This is the exact one-sided operator naturally attached to the gap-kernel family.

      \[
      \partial_s(\mathcal K_L f)(s)
      =
      \int_{s+L}^{s_1} e^{s-\rho} f(\rho)\,d\rho
      - e^{-L}f(s+L).
      \]

      So the gap-kernel route is not arbitrary transport geometry. It is the one-sided resolvent of a first-order scale operator.

      This is the exact place where the signed route and the far-gap flux route meet: both are naturally first-order in logarithmic scale.

      Because is affine, the affine functional annihilates exact second derivatives, not merely first derivatives.

      The affine quotient route is naturally second-order because its readout kills only exact second derivatives.

      So the bridge failure is not just "one more trick missing." It is an operator order mismatch.

      The correct bridge theorem, if it exists, has to raise the signed route from first-order to effective second-order exactness.

      Since ''=0, every interior contribution from G vanishes, and under the stated boundary conditions only C [R] survives.

      This is stronger than the earlier slogan "one derivative short," because it identifies the exact native operator on the signed/gap-kernel side.


