      \subsection{Positive Source Supplier Cycle: Temporal Anti-Concentration Target}

      The supplier cycle has one clean time-measure target.  If the positive source marginal had a super-\(L^1_s\) bound on each fixed ball, namely

      \[
      \left\|
      \|F_m^{src,+}(s,\cdot)\|_{\mathcal M(B_R)}
      \right\|_{L_s^p((-1,0))}
      \le C_R,
      \qquad p>1.
      \]

      then Holder in time would give

      \[
      \mu_m^{src}(B_R\times[-\varepsilon,0])
      \le C_R\varepsilon^{1-1/p},
      \]

      and the terminal source atom would vanish in the limit:

      \[
      \mu_*^{src}(B_R\times\{0\})=0.
      \]

      The current inputs give only finite \(L^1_s\) source mass on fixed cylinders.  Terminal-layer concentration remains compatible with that level of control.  The required super-\(L^1_s\) temporal gain is the missing source-residence theorem.

      The shell bookkeeping shows the same issue in energy form.  With

      \[
      D_j=2^{2j}E_j,
      \]

      and

      \[
      E_j' + c\nu D_j \le F_j
      \]

      the drain term controls the shell energy only after the source term \(F_j\) has been normalized.  Thus the separate downstream supplier branch stays outside CM at two sufficient entrances: temporal anti-concentration of the native source residue, or active-shell amplitude gain on moving terminal shells.


