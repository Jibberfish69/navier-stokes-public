      \neg Part_{N,Q}(\mathcal W)
      \vee
      \forall\rho>0\,\neg Field_{N,\rho,Q}(\mathcal W).
      \]

      The cases exhaust Forward Wall R3 listed by the definition of the listed route family. Hence the umbrella implication holds.

