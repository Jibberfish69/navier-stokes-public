    text: |+
      \subsection{Averaged Terminal Cover / Common Scheduler Reentry}

      This historical reentry note moved the old blocker from a generic "prove the cover" demand to the exact averaged branch split.

      At the time, it also recorded the failure: finite energy plus a.e. good-cylinder production does not itself give a uniform positive terminal finite cover, because the good radius may shrink to zero along a terminal sequence.

      In that historical branch analysis, the bad branch was Jump avg: persistent terminal loss of positive SCF-good same-fluid scale, or terminal radius degeneration to zero. The branch could not be erased by pointwise terminal readout and had to be eliminated or consumed inside the averaged endpoint route.

      In that older averaged-route frame, the sharp missing theorem was not another generic finite-cover theorem. It was a branch-native Jump avg discharge/consumption theorem.

      \[
      \mathrm{Jump}_{\mathrm{avg}}
      \Longrightarrow
      \text{nonzero terminal }h/F\text{ survivor measure with separated positive scale-window mass},
      \]

      The historical work order was to attack the branch-native Jump avg lower/nontriviality theorem without spending readout objects upstream. In the current manuscript, this material is support-only unless the main proof or current appendix status map promotes the averaged branch as a named terminal obstruction row.


