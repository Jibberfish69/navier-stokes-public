      If it is an admissible Besov/Lorentz wall, apply R3Besov Lorentz Wall ToCMFace.A. The Besov dyadic branch reduces by Bernstein to the repaired H 1/2 route, while the Lorentz amplitude branch reduces to the installed local L 3 route.

      If it is a compactness-rigidity wall, apply R3Compactness Rigidity Wall ToCMFace.A.

      If it is a Lagrangian/deformation wall, apply R3Lagrangian Deformation Wall ToCMFace.A.

