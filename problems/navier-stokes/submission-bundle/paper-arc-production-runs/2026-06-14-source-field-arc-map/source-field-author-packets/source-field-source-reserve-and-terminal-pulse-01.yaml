      \subsection{Annular Pressure Product-Source Estimate}

      This estimate is a pressure-localization support theorem.  It says that the
      pressure seen on one annulus is controlled by the velocity product on the
      neighboring annuli, plus a far-field tail summed separately.  It
      does not by itself prove the missing source-pulse estimate.

      \[
      p=\mathcal R_i\mathcal R_j(u_i u_j)
      \]

      \[
      A_k=\{2^k\le |x|\le 2^{k+1}\},
      \qquad
      A_k^*=\bigcup_{|j-k|\le2}A_j,
      \]

      \[
      \|p(t)-c_k(t)\|_{L^2(A_k)}
      \le
      C\|u(t)\otimes u(t)\|_{L^2(A_k^*)}+F_k(t),
      \]

      \[
      F_k(t)\le C|A_k|^{1/2}
      \sum_{|\ell-k|>2}2^{-3\max\{k,\ell\}}\|u(t)\otimes u(t)\|_{L^1(A_\ell)}.
      \]

      Choose a smooth annular cutoff \(\chi_k\) equal to one on \(A_k\) and supported
      in \(A_k^*\).  Split

      \[
      \begin{aligned}
      p_k^{near}&=\mathcal R_i\mathcal R_j(\chi_k u_i u_j),\\
      p_k^{far}&=\mathcal R_i\mathcal R_j((1-\chi_k)u_i u_j),\\
      p&=p_k^{near}+p_k^{far}.
      \end{aligned}
      \]

      The near part is controlled by Calderon-Zygmund boundedness on the fat annulus:

      \[
      \|p_k^{near}(t)-c_k^{near}(t)\|_{L^2(A_k)}
      \le
      C\|u(t)\otimes u(t)\|_{L^2(A_k^*)}.
      \]

      For the far part, the pressure kernel is smooth on \(A_k\) against every annulus
      outside \(A_k^*\).  After subtracting the annular mean \(c_k(t)\), the kernel
      difference gains one annular derivative on \(A_k\), and the separated annulus
      contribution is bounded by the displayed \(F_k(t)\).

      This theorem pays the annular pressure decomposition.  Weighted summability of
      the tail remains a separate input, supplied by local smoothing and exterior-tail
      bounds when those are available in the active route.


