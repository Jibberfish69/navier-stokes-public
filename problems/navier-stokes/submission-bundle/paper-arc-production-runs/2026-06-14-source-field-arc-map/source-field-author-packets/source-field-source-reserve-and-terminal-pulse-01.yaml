      \subsection{Clay problem Source Reserve Birth Charge.A Direct Attempt}

      After the no-genuine-exit reduction, this is the first concrete wall for preventing GenuineCMExit(T *) from original smooth data.

      Pack gain / legal packing payment; Part participation failure; licensed Field source charge; terminal Zeno residue already sorted as Pack/Part exit.

      The charge cannot be a free new positive source budget. It must either be paid by installed same-witness structure or become a Pack/Part/Field exit witness.

      The inherited term is not new at W, so minimality and Past Window Reserve Separation.A can only leave the contracted piece (1-delta)R N(Past(W)) plus legal losses. The child residual term is the normalized-adjoint / weighted residual already isolated by the reserve-chain audits. Legal, boundary, cutoff, and non-selected terms belong to Loss legal(W).

      At this point the proof needs a real source-charge theorem. The installed records do not prove that this first-created native reserve is automatically paid. The scalar short-pulse obstruction from the earlier reserve audits still survives: first moment can go to zero while the scale-critical reserve stays order one.

      So the direct proof does not close Source Reserve Birth Charge.A from the current installed inputs.

      So the only surviving Pack no-exit subcase is retained positive-scale native source-reserve birth.

      This is real progress in the proof search because it removes the ambiguity around the Pack wall. The open theorem is no longer "some source-wall thing." It is the retained positive-scale first-created native reserve surplus.

      It is not a Clay-ready proof. Calling the Clay problem solved here would be circular: the missing charge theorem is exactly the analytic content needed to prevent the first Pack exit from original smooth data.


