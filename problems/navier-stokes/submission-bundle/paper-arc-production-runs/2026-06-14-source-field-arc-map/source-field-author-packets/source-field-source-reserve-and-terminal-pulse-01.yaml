      \subsection{Terminal Zeno source-refill closure playbook}

      This is not a closed reduction. It is the Carleson-side presentation of the remaining Zeno source-refill wall.

      \[
      r_m\downarrow0,
      \qquad
      \sum_m r_m^2<\infty.
      \]

      for every bounded-overlap same-fluid terminal family selected by the source-pulse branch.

      The proof must stay on the pre-Cauchy localized source carrier. It should avoid global absolute-value envelopes because those erase parent-child geometry.

      \[
      [\mathcal R_P]_+.
      \]

      \[
      \int_{Q(P)}[\mathcal R_P]_+
      \le
      \theta\int_{Q(P)}\mathcal D_P
      +\text{parent-edge drain}
      +\text{legal loss},
      \qquad 0<\theta<1.
      \]

      This is the real analytic statement. It says a terminal active positive source can persist only by spending drain or by creating a legal parent edge. Refill edges then telescope by the donor-balance identity.

      \[
      \|d\pi_P\|_{\text{parent }L^q}
      \le C\|d\pi_P\|_{\text{parent }L^1},
      \qquad q>1,
      \]

      \[
      \text{uncharged Zeno refill ancestry}
      \Longrightarrow
      \text{ancient limit belongs to rigid class }\mathcal B.
      \]

      This is the smallest new analytic mechanism that can close the current wall. It counts only if it supplies the localized positive source Carleson estimate on every bounded-overlap same-fluid terminal family; otherwise it is just a branch-local estimate and does not close Refill Tree Well Founded.A.


