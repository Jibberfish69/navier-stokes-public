      before later export estimates can be read as support for the classical
      Navier--Stokes equation.  It is not a smoothness proof.  It gives the local
      well-posedness and continuation grammar for the retained carrier sector, so
      later rows can say precisely what they still owe.  The carrier is a persistent
      sector, and the projection onto that sector has to preserve the Sobolev scale
      used by the local theory:
      \[
      P_D(H_D^1)\subset H_D^1,
      \qquad
      P_D(H_D^s)\subset H_D^s\quad (s\ge 1),
      \]
      and it has to commute with the carrier generator on the stated domains,
      \[
      [P_D,D]=0\quad\text{on }H_D^1,
      \qquad
      [P_D,D]=0\quad\text{on }\operatorname{Dom}(D).
      \]
