      \subsection{Carrier Low-Mode Export Reopen Blocked By Amplitude}

      This row records the amplitude obstruction in the carrier export path.  The
      direct coefficient theorem runs into fixed-shell amplitude scaling.  The
      normalization route keeps the same obstruction: exact readout preservation
      leaves the amplitude unchanged, while amplitude clipping creates a same-order
      readout defect.

      The missing supplier is a separate amplitude theorem for the finite
      low-threshold block, for example
      \[
      \sup_{t<T}\|X(t)\|_{H_D^s}<\infty.
      \]

      This row is a support boundary.  It records the exact reason the low-mode export
      path reopens, and it prevents the carrier route from being read as a completed
      low-mode theorem.  The unresolved amplitude supplier is a gold-side obstruction
      for this carrier-export path unless a later CM same-solution test turns the
      residue into a Pack, Part, or Field face.


