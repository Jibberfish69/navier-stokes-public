      \subsection{Active Coherent Readout Carrier Localization Result}

      This support lemma says where the active readout is allowed to live.  Its proof
      role is Pack-side: before a Part or Field claim can be read on one terminal
      object, the readout has to remain attached to a controlled carrier region.  The
      lemma applies after the active test class has already been restricted to the
      carrier-localized family \(\mathcal A^{\mathrm{car}}_{j,i}(t)\).

      Under that carrier-localized reading the minimal active support lies inside the
      fixed collar enlargement described by the next inclusion.

      \[
      \mathcal K_{j,i}^{min}(t)
      \subseteq
      \Gamma_j(t)^{+M}.
      \]

      Thus a controlled proper collar \(\Gamma_j(t)^{+M}\) gives a controlled proper
      global selector plateau core.

      The hypothesis is essential. If the active class is enlarged to all coherent
      readouts in the carrier space, support localization becomes a further theorem.
      Smooth low-pass readouts can have tails, and active test readouts can move their
      localized support across the ambient domain unless the class definition fixes
      carrier support. In that broader class the minimal active support can degenerate
      to the full ambient space,

      \[
      \mathcal K_{j,i}^{min}(t)=\mathbb R^3.
      \]

      That gives only the algebraic full-space selector \(w_j\equiv1\), and it loses
      the geometric localization used by the plateau route.

      So the localization claim is discharged only for the carrier-localized active
      class \(\mathcal A^{\mathrm{car}}_{j,i}(t)\). For any broader active class, the
      route still owes a separate support-localization theorem.

      The local fixed-collar selector remains valid for individual collar supports in
      either case; what changes is whether those local supports assemble into a
      global proper selector core.  Thus the result supplies Pack support only for
      the carrier-localized active class; it records an open support-localization debt
      for broader active classes.


