      \subsection{Carrier Coherence Defect To Low-Mode Strain Suppression}

      The export target for the strongest current carrier route is strict low-mode
      strain suppression.  The classical proof needs that suppression at the
      active cutoff:

      \[
      \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
      \le
      c\,\nu\,2^{2j_0}
      \]

      The carrier route can pay that classical requirement only by exporting the
      coherent carrier mechanism to the same low-frequency band.  Fix a classical
      dyadic cutoff \(j_0\), and let \(u=\rho(X)\) be the classical readout of the
      carrier solution.

      The first payment is readout alignment:

      \[
      \rho(\mathbb S_D(j_0)\mathbb H_D X)=P_{\le j_0}u_{\mathrm{coh}},
         \qquad
         u_{\mathrm{coh}}:=\rho(\mathbb H_D X).
      \]

      The second payment is a carrier-side operator bound at the same cutoff:

      \[
      \|B_i(X)\mathbb S_D(j_0)\mathbb H_D\|_{\mathrm{op}}
         \le
         c\,\nu\,2^{2j_0}.
      \]

      The third payment is the exported classical estimate after the readout map has
      been applied:

      \[
      \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
      \le
      c'\,\nu\,2^{2j_0}
      +
      C'\Psi(\mathcal E_D(X(t))).
      \]

      Absorption of the defect term then gives the strict form:

      \[
      \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
      \le
      \tilde c\,\nu\,2^{2j_0},
      \]

      The proof burden is now precise.  The manuscript needs a faithful export
      theorem from the persistent carrier to the classical low-mode band.  Until that
      export theorem is paid, the carrier route remains support for the gold side and
      supplies CM material only after a selected same-solution residue is tested at
      Pack, Part, Field, or readout.  In the present manuscript this row is an open
      support debt, not a completed low-mode closure theorem.


