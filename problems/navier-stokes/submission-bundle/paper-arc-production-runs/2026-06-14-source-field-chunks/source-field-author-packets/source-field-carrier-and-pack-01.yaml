      \subsection{Carrier Low-Mode Strain Export Assembly}

      This assembly records how the carrier export theorem would be consumed after
      the amplitude and collar remainders are paid.

      \[
      \|\nabla R^{collar}_{i,j}[X;Y]\|_{L^\infty}
      \le \varepsilon\nu2^{2j}\|Y\|_{H_D^s}+C_\varepsilon\Phi(\mathcal E_D^{(s)}(X)).
      \]

      \[
      \|\nabla P_{\le j}u\|_{L^\infty}
      \le c\nu2^{2j}+C\Phi(\mathcal E_D^{(s)}(X)).
      \]

      \[
      \|\nabla P_{\le j}u\|_{L^\infty}
      \le c_*\nu2^{2j}.
      \]

      The first displayed estimate controls the collar remainder after readout.  The
      second estimate is the exported low-mode strain statement with the carrier
      defect still visible.  The third estimate is the strict viscous-scale form
      after the carrier energy inequality absorbs that defect term.

      This is the carrier-export version of strict low-mode strain suppression on the
      active shell range.  Its proof role is open gold support: it names the low-mode
      input that the HFG dyadic cascade would consume after the export debts above
      are paid.  The assembly should be read as a use-pattern for later estimates,
      not as an assertion that the export debts have already been discharged.


