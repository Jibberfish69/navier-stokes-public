      \subsection{Carrier Ontology And Selector Correction Note}

      This note fixes the object hierarchy used by the export program.  The carrier
      is one persistent coherent support object derived from the ontic transport
      geometry.  Thresholds, windows, refinements, and low-pass projectors are
      selector machinery acting on top of that support.

      The carrier is written \(\mathcal K_D\).  It comes from global coherent
      realizations of the holonomy and overlap data.  A thresholded family such as
      \(\mathbb H_D(j_0)\) may exist on that carrier, and it may be useful for
      localization, readout, or theorem control, while the carrier itself remains the
      persistent support object.

      \(\mathcal K_D\) is the persistent coherent support object. Any thresholded
      family on \(\mathcal K_D\) is selector machinery.  The classical low-mode target
      is formulated on the readout side, starting from
      \[
      u_{\mathrm{coh}}=\rho(\mathbb H_DX).
      \]
      A spectral realization of a selector family is useful only as a theorem-control
      layer above the carrier.

      This correction keeps the export route honest.  It lets the manuscript ask
      three separate questions: how the selector compares with the persistent carrier,
      how the selected carrier readout controls the classical low modes, and how the
      remaining carrier defect is exported.  Those are proof debts, while the
      persistent carrier itself is the support object on which those debts are posed.
      That separation is what keeps the carrier rows from being misread as an
      independent closure of the Navier--Stokes theorem.


