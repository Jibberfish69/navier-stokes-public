    \subsection{Carrier Frequency-Aligned Readout Theorem}

    This theorem is the structural prerequisite for the low-mode export program.  It
    places the carrier selector and the classical low-pass operator inside the same
    functional-calculus statement.

    \[
    P_{\le j_0} := \chi_{\le j_0}(\Lambda_{\mathrm{cl}}).
    \]

    \[
    \mathbb H_D(j_0) := \chi_{\le j_0}(D_{\mathrm{coh}})\mathbb H_D,
    \]

    \[
    \rho(D_{\mathrm{coh}}X)=\Lambda_{\mathrm{cl}}\rho(X)
       \qquad
       \forall X\in \mathcal C_0.
    \]

    The compatibility condition is

    \[
    \rho\big(m(D_{\mathrm{coh}})X\big)=m(\Lambda_{\mathrm{cl}})\rho(X)
    \]

    for the multipliers used by the selector family.  Applying this to
    \(\chi_{\le j_0}\) gives

    \[
    \rho(\mathbb H_D(j_0)X)=P_{\le j_0}u_{\mathrm{coh}},
    \qquad
    u_{\mathrm{coh}}=\rho(\mathbb H_D X).
    \]

    This is the first export step because it decides whether the carrier program is
    aiming at the same low-frequency object as the Euclidean route.  The theorem
    pays the readout identity in the spectral case.  The remaining identification
    problem is the comparison between the route's active abstract selector family
    and this carrier-restricted spectral selector on the persistent carrier.  That
    comparison is the next support debt before transport estimates can become
    classical low-mode estimates.  Thus the row is proof-bearing only for the
    spectral readout identity; it remains support for the active abstract selector
    route until that comparison theorem is supplied.



    \subsection{Carrier Low-Mode Export Reopen Blocked By Amplitude}

    This row records the amplitude obstruction in the carrier export path.  The
    direct coefficient theorem runs into fixed-shell amplitude scaling.  The
    normalization route keeps the same obstruction: exact readout preservation
    leaves the amplitude unchanged, while amplitude clipping creates a same-order
    readout defect.

    The missing supplier is a separate amplitude theorem for the finite
    low-threshold block, for example
    \[
    \sup_{t<T}\|X(t)\|_{H_D^s}<\infty.
    \]

    This row is a support boundary.  It records the exact reason the low-mode export
    path reopens, and it prevents the carrier route from being read as a completed
    low-mode theorem.  The unresolved amplitude supplier is a gold-side obstruction
    for this carrier-export path unless a later CM same-solution test turns the
    residue into a Pack, Part, or Field face.



    \subsection{Carrier Low-Mode Strain Export Assembly}

    This assembly records how the carrier export theorem would be consumed after
    the amplitude and collar remainders are paid.

    \[
    \|\nabla R^{collar}_{i,j}[X;Y]\|_{L^\infty}
    \le \varepsilon\nu2^{2j}\|Y\|_{H_D^s}+C_\varepsilon\Phi(\mathcal E_D^{(s)}(X)).
    \]

    \[
    \|\nabla P_{\le j}u\|_{L^\infty}
    \le c\nu2^{2j}+C\Phi(\mathcal E_D^{(s)}(X)).
    \]

    \[
    \|\nabla P_{\le j}u\|_{L^\infty}
    \le c_*\nu2^{2j}.
    \]

    The first displayed estimate controls the collar remainder after readout.  The
    second estimate is the exported low-mode strain statement with the carrier
    defect still visible.  The third estimate is the strict viscous-scale form
    after the carrier energy inequality absorbs that defect term.

    This is the carrier-export version of strict low-mode strain suppression on the
    active shell range.  Its proof role is open gold support: it names the low-mode
    input that the HFG dyadic cascade would consume after the export debts above
    are paid.  The assembly should be read as a use-pattern for later estimates,
    not as an assertion that the export debts have already been discharged.



    \subsection{Carrier Ontology And Selector Correction Note}

    This note fixes the object hierarchy used by the export program.  The carrier
    is one persistent coherent support object derived from the ontic transport
    geometry.  Thresholds, windows, refinements, and low-pass projectors are
    selector machinery acting on top of that support.

    The carrier is written \(\mathcal K_D\).  It comes from global coherent
    realizations of the holonomy and overlap data.  A thresholded family such as
    \(\mathbb H_D(j_0)\) may exist on that carrier, and it may be useful for
    localization, readout, or theorem control, while the carrier itself remains the
    persistent support object.

    \(\mathcal K_D\) is the persistent coherent support object. Any thresholded
    family on \(\mathcal K_D\) is selector machinery.  The classical low-mode target
    is formulated on the readout side, starting from
    \[
    u_{\mathrm{coh}}=\rho(\mathbb H_DX).
    \]
    A spectral realization of a selector family is useful only as a theorem-control
    layer above the carrier.

    This correction keeps the export route honest.  It lets the manuscript ask
    three separate questions: how the selector compares with the persistent carrier,
    how the selected carrier readout controls the classical low modes, and how the
    remaining carrier defect is exported.  Those are proof debts, while the
    persistent carrier itself is the support object on which those debts are posed.
    That separation is what keeps the carrier rows from being misread as an
    independent closure of the Navier--Stokes theorem.


