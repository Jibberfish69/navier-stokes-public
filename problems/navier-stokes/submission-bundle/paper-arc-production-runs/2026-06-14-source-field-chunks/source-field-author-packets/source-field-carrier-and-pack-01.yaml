    text: |+
      \subsection{Active-Readout Subordination To Persistent Carrier Core Result}

      This result is the companion Pack-side support statement for smooth readouts.
      A smooth low-pass cutoff can have rapid tails, so the useful claim is not
      literal compact support.  The useful claim is a core/tail statement: the
      principal part stays inside the persistent carrier core, and the smooth tail is
      lower-order.

      Assume the physical localizer is contained in the carrier core,

      \[
      \operatorname{supp}\widetilde Q_i(t)
      \subseteq
      \mathfrak C_j(t).
      \]

      The low-pass readout decomposes into its carrier-core and tail pieces as follows.

      \[
      P_{\le j}v=(P_{\le j}v)_{core}+(P_{\le j}v)_{tail},
      \]

      The core support obeys

      \[
      \operatorname{supp}\big(\widetilde Q_i(P_{\le j}v)_{core}\big)
      \subseteq
      \mathfrak C_j(t),
      \]

      and the tail obeys

      \[
      \|\widetilde Q_i(P_{\le j}v)_{tail}\|_{W^{1,\infty}}
      \le
      C\Phi_*(\mathcal E_D(X)),
      \]

      These two estimates make every active readout subordinate to the persistent
      carrier core modulo the lower-order tail.

      For standard smooth Littlewood--Paley cutoffs the kernel has rapid tails, so the
      exact global support statement is replaced by the core/tail statement

      \[
      \text{principal support inside }\mathfrak C_j(t)
      \quad+
      \quad
      \text{tail in }\Phi_*.
      \]

      This is the support role of the result.  The global plateau selector acts on
      the carrier core, while the smooth kernel tail is absorbed into the already
      named \(\Phi_*\) remainder.  The result does not close the low-mode export
      route by itself; it identifies the carrier region on which later export and
      Field estimates have to be paid.


