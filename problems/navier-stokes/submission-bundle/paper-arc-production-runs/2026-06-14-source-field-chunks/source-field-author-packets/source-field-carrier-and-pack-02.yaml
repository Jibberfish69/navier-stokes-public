      \subsection{NS Carrier Realization And Classical Identification}

      The abstract carrier sheet is realized here on the standard divergence-free
      Euclidean model.  The note tells the reader which
      familiar Navier--Stokes facts supply the semigroup, bilinear map, projection,
      pressure recovery, and compactness steps used by the earlier source-field
      appendix.

      The status is deliberately limited.  The realization identifies the standard
      classical structures that a carrier model must match.  It does not prove that a
      new global carrier estimate has already been exported to the original classical
      solution.

      Let
      \[
        H=L^2_\sigma(\mathbb R^3),
        \qquad
        P:L^2(\mathbb R^3)^3\to L^2_\sigma(\mathbb R^3)
      \]
      be the Leray projector, and let
      \[
        A=-P\Delta,
        \qquad
        \operatorname{Dom}(A)=H^2(\mathbb R^3)^3\cap L^2_\sigma(\mathbb R^3).
      \]
      On the Fourier side \(A\) has multiplier \(|\xi|^2\) on the divergence-free
      sector.  Thus \(A\) is self-adjoint and nonnegative on \(H\), and \(e^{-tA}\)
      is the analytic Stokes semigroup used by the carrier sheet.

      The nonlinear term is
      \[
        B(u,v)=P((u\cdot\nabla)v).
      \]
      For divergence-free \(u,v,w\in H^1(\mathbb R^3)^3\),
      \[
        |\langle B(u,v),w\rangle|
        \le C_{\mathrm{sf},1695}
        \|u\|_{H^1}\|v\|_{H^1}\|w\|_{H^1},
      \]
      so \(B:H^1\times H^1\to H^{-1}\) continuously.  The usual skew cancellation
      gives
      \[
        \langle B(u,u),u\rangle=0.
      \]
      This is the realized bilinear and energy-cancellation block required by the
      carrier sheet.

      The projection and Stokes operator commute on the realized model:
      \[
        PA=AP=A.
      \]
      Both are Fourier multipliers on the divergence-free sector.  This supplies the
      exact commutator identity used when the abstract carrier equations are read as
      classical Navier--Stokes equations.

