      \subsection{Carrier Ontology Refactor Obligations}

      The corrected carrier-side bridge starts from one persistent coherent support
      object derived from cocycle, holonomy, and refinement persistence.  Thresholded
      families such as \(\mathbb H_D(j_0)\) are derived selector machinery acting on
      that support or on its readout.

      The refactor leaves three theorem debts.

      First, the old threshold package needs comparison with the persistent carrier
      through a quantitative remainder theorem:
      \[
        \mathbb H_D(j_0)X
        =
        \Pi_{\le j_0}^{\mathcal K_D}X
        +
        R_{j_0}(X),
        \qquad
        \rho(R_{j_0}(X)) \hbox{ controlled in the low-mode norm used below.}
      \]

      Second, the principal transport on the persistent support has to export to the
      classical low-mode strain target:
      \[
        \|\nabla P_{\le j_0}\rho(\Pi_{\le j_0}^{\mathcal K_D}X(t))\|_{L^\infty_x}
        \le c\,\nu\,2^{2j_0}
      \]
      on the active range where the route wants to consume low-mode suppression.

      Third, the noncoherent remainder needs its own classical low-mode export bound:
      \[
        \|\nabla P_{\le j_0}\rho(R_{j_0}(X(t)))\|_{L^\infty_x}
        \le C\,\Psi(\mathcal E_D(X(t))).
      \]

      Those are the remaining carrier/export obligations in the corrected language.
      They replace the old diffuse phrases ``off-block'', ``threshold leakage'', and
      ``carrier leakage'' with one comparison theorem and two export theorems.  The
      debt stack consists of that comparison theorem and those two export theorems;
      they remain open here.  In the manuscript these debts are gold-side support
      debts.  They become CM proof material only after a same-solution residue is
      selected and the failed face is read as Pack, Part, or Field.


