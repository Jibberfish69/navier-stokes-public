      \subsection{Carrier-To-Classical Low-Mode Export Theorem}

      The missing bridge runs between the internal carrier mechanism and the
      Euclidean low-mode control required by the classical route.  It tells
      the reader exactly what has to be proved before the carrier route becomes a
      classical Navier--Stokes mechanism.

      The target is the low-mode strain bound
      \[
      \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
      \le
      c\,\nu\,2^{2j_0},
      \qquad
      u_{<j_0}:=P_{\le j_0}u.
      \]
      The carrier-side coherent low-mode readout is
      \[
      u_{\mathrm{coh},\le j_0}
      :=
      \rho(\mathbb S_D(j_0)\mathbb H_D X),
      \]
      \[
      u_{\mathrm{coh}}:=\rho(\mathbb H_DX).
      \]

      The first required subclaim is exact readout alignment:
      \[
      \rho(\mathbb S_D(j_0)\mathbb H_D X)=P_{\le j_0}u_{\mathrm{coh}}.
      \]

      The second subclaim is principal transport export on the persistent
      support:
      \[
      \|B_i(X)\mathbb S_D(j_0)\mathbb H_D\|_{\mathrm{op}}
         \le
         c_0\,\nu\,2^{2j_0},
      \]
      where \(B_i(X)\) is the localized carrier transport operator on persistent
      coherent support.  This gives the coherent low-mode strain bound for
      \(u_{\mathrm{coh},\le j_0}\).

      The third subclaim is leakage export:
      \[
      \|\nabla P_{\le j_0}(u-u_{\mathrm{coh}})(t)\|_{L^\infty_x}
      \le
      C\,\Psi(\mathcal E_D(X(t))).
      \]
      This is the place where the off-support carrier remainder must be paid after
      the readout map \(\rho\) is applied.  Carrier-side leakage control has to
      survive as a classical low-mode estimate.

      Together, the three subclaims export the needed classical estimate:
      \[
      \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
      \le
      C\,\nu\,2^{2j_0}
        + C\,\Psi(\mathcal E_D(X(t))).
      \]
      After the carrier energy inequality absorbs the defect term, this is the
      low-mode suppression statement consumed by the Euclidean route.

      The theorem statement above is also a support boundary.  The three subclaims
      remain the live carrier-to-classical support debts.  In the CM layer, a
      failure of one of these debts becomes proof material only after the manuscript
