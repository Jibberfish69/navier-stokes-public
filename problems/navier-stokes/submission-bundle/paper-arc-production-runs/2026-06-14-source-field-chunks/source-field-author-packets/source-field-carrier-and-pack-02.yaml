      \subsection{Carrier Ontology Authority Decision}

      The carrier/export hierarchy is fixed as follows.  The carrier is the persistent
      coherent support object \(\mathcal K_D\).  The
      map \(\rho\) is the coherent readout from the carrier side to the classical
      velocity side.  Thresholds, windows, and low-pass projectors are selector
      machinery acting above that support/readout layer.

      The proof role is Pack-side.  This subsection fixes the object that later
      claims are allowed to use; it does not by itself prove participation, field
      coherence, or a classical low-mode estimate.  If the carrier cannot be kept as
      one persistent support object, the failure is a carrier failure before the Part
      or Field faces are even tested.

      A selector localizes the carrier.  The selected object still sits on top of the
      persistent carrier rather than replacing it.

      \[
      u_{\mathrm{coh}} := \rho(\mathbb H_D X),
      \qquad
      \rho(\mathbb S_D(j_0)\mathbb H_D X)=P_{\le j_0}u_{\mathrm{coh}}.
      \]

      On the classical side, the selector-localized target is simply the low-mode band
      \(P_{\le j_0}u_{\mathrm{coh}}\).

      The coherent-Laplacian route is retained only as selector-realization machinery
      on top of persistent coherent support.  Once the export target is chosen, the
      carrier remains \(\mathcal K_D\), and the spectral selector is a theorem-control
      layer on that carrier.  This keeps the paper from replacing the same carrier by
      a thresholded selector object mid-proof.


