    on the periodic auxiliary model, and the corresponding decay/normalization
    condition is used on \(\mathbb R^3\).

    The compact periodic variant \(L^2_\sigma(\mathbb T^3)\) is used only as an
    auxiliary compactness model.  On \(\mathbb T^3\), the embedding
    \[
      H^1(\mathbb T^3)\hookrightarrow L^2(\mathbb T^3)
    \]
    is compact, so Aubin--Lions gives strong convergence in
    \[
      L^2(0,T;L^2(\mathbb T^3)).
    \]
    On \(\mathbb R^3\), the same argument gives local strong convergence in
    \[
      L^2(0,T;L^2_{\mathrm{loc}}(\mathbb R^3)),
    \]
    and the admissible energy-tail bound is the extra input that globalizes the
    limit on the fixed data class.

    The classical realization supplies the standard carrier-sheet facts:
    sectorial Stokes flow, bilinear continuity, energy cancellation, projection
    commutation, pressure recovery, and compactness.  The low-mode export theorem
    from the preceding sections remains the live carrier-to-classical support debt.
    This row is support for the carrier framework and for the pass-side classical
    reading; it is not a standalone Clay closure.



    \subsection{Carrier-Selector Structural Audit}

    After the carrier ontology correction, the audit starts from
    \(\mathcal K_D\) as the carrier.  Each note then has to respect the stack
    \[
      \mathcal K_D
      \quad\longrightarrow\quad
      \rho(\mathcal K_D)
      \quad\longrightarrow\quad
      P_{\le j_0}\rho(\mathcal K_D)
    \]
    and keep the persistent support distinct from thresholded selector machinery.

    The live theorem work splits into three debts: quantitative comparison of the
    old threshold package with the persistent carrier, principal transport export
    from the persistent carrier to the classical low-mode band, and noncoherent
    leakage export for the remainder.  The audit's proof role is to keep later
    carrier notes sorted into those three debts.  The audit is not a fourth proof
    branch; it is a sorting rule that keeps all later carrier claims attached to the
    same Pack-side object and the same export problem.



    \subsection{Carrier-To-Classical Low-Mode Export Theorem}

    The missing bridge runs between the internal carrier mechanism and the
    Euclidean low-mode control required by the classical route.  It tells
    the reader exactly what has to be proved before the carrier route becomes a
    classical Navier--Stokes mechanism.

    The target is the low-mode strain bound
    \[
    \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
    \le
    c\,\nu\,2^{2j_0},
    \qquad
    u_{<j_0}:=P_{\le j_0}u.
    \]
    The carrier-side coherent low-mode readout is
    \[
    u_{\mathrm{coh},\le j_0}
    :=
    \rho(\mathbb S_D(j_0)\mathbb H_D X),
    \]
    \[
    u_{\mathrm{coh}}:=\rho(\mathbb H_DX).
    \]

    The first required subclaim is exact readout alignment:
    \[
    \rho(\mathbb S_D(j_0)\mathbb H_D X)=P_{\le j_0}u_{\mathrm{coh}}.
    \]

    The second subclaim is principal transport export on the persistent
    support:
    \[
    \|B_i(X)\mathbb S_D(j_0)\mathbb H_D\|_{\mathrm{op}}
       \le
       c_0\,\nu\,2^{2j_0},
    \]
    where \(B_i(X)\) is the localized carrier transport operator on persistent
    coherent support.  This gives the coherent low-mode strain bound for
    \(u_{\mathrm{coh},\le j_0}\).

    The third subclaim is leakage export:
    \[
    \|\nabla P_{\le j_0}(u-u_{\mathrm{coh}})(t)\|_{L^\infty_x}
    \le
    C\,\Psi(\mathcal E_D(X(t))).
    \]
    This is the place where the off-support carrier remainder must be paid after
    the readout map \(\rho\) is applied.  Carrier-side leakage control has to
    survive as a classical low-mode estimate.

    Together, the three subclaims export the needed classical estimate:
    \[
    \|\nabla u_{<j_0}(t)\|_{L^\infty_x}
    \le
    C\,\nu\,2^{2j_0}
      + C\,\Psi(\mathcal E_D(X(t))).
    \]
    After the carrier energy inequality absorbs the defect term, this is the
    low-mode suppression statement consumed by the Euclidean route.

    The theorem statement above is also a support boundary.  The three subclaims
    remain the live carrier-to-classical support debts.  In the CM layer, a
    failure of one of these debts becomes proof material only after the manuscript
    selects the same terminal record and tests the resulting residue at Pack, Part,
    Field, or readout.  Until then this theorem statement is an open gold-side
    bridge, not a completed low-mode closure.



    \subsection{Euclidean Same-Surface Warrant Carrier}

    This subsection records the downstream Euclidean warrant as support.  Its job is
    to keep every Euclidean package on one fixed theorem surface: one equation, one
    approximation scheme, one limiting object, and one continuation criterion.

    The warrant is a consistency requirement, not an extra regularity theorem.  It
    prevents support packages from being assembled across different solutions or
    different approximation surfaces.

    Define \(\mathcal W_{\mathrm{Euc}}[u]\) to mean that the following packages all
    hold on the same classical solution surface:
    \[
    \begin{array}{ll}
    S1,S2 & \text{scale-barrier and high-frequency tail/flux control},\\
    M1,M2 & \text{the named } Q(t) \text{ bridge and cascade handoff},\\
    K1,K2,K3 & \text{compactness and nonlinear limit passage},\\
    G1,G2 & \text{continuation control and the }4\to1\text{ recertification arrow},\\
    C1,C2 & \text{same-surface and provenance audits}.
    \end{array}
    \]
    The warrant claim is the single implication
    \[
      \mathcal W_{\mathrm{Euc}}[u]
      \Longrightarrow
      \begin{gathered}
      \text{the downstream Euclidean} \\
      \text{same-surface closure statement.}
      \end{gathered}
    \]

    This is a provenance claim about the Euclidean support stack.  The entries above
    have to refer to the same \(u\), the same approximation surface, and the same
    classical continuation step.  The old pullback target remains a historical
    comparison point.  The live warrant is the same-surface package displayed here.

    This warrant is secondary to the active object-law route.  It keeps stale
    Euclidean closure language from re-entering the paper as hidden proof authority.
    The warrant can support a later closure only when the cited packages all refer
    to the same \(u\) and the same continuation step.



    \subsection{Theorem D.6: Global Carrier A Priori Bound}

    D.6 gives the carrier a priori bound used by the compactness and global
    projected-flow steps.  It gathers the lower route
    \[
    \text{lower bound}
    \longrightarrow \text{intermediate carrier estimates}
    \longrightarrow \text{coercive absorption}
    \longrightarrow \text{global carrier bound}
    \]
    on the single carrier surface
    \[
    (\mathfrak R,D,\mathbb P_D),
    \qquad
    \mathfrak R=\mathcal V_D.
    \]
    The source theorem records the carrier constants, the active-channel spectral
    gap, and the slaving estimate on this same surface.  The reader-facing
    statement is:
    \[
    \partial_tX+A_DX+B_D(X)=0,
    \qquad
    X(0)=X_0\in\mathcal N,
    \]
    and the carrier energy satisfies a bound that prevents escape of
    \(\|X(t)\|_{\mathcal N}\).

    This is a projected-carrier estimate.  Its proof force stays on the carrier
    surface until D.3--D.5 supply the strict readout and composition steps that
    connect that carrier bound to the classical Navier--Stokes field.

    The two concrete payments are the \(H\)-tier decay and the cubic absorption.
    First, for some internal constants \(\lambda_*>0\) and \(C_\delta\),
    \[
    \frac{d}{dt}\|X(t)\|_H^2
    \le
    -2(\nu\lambda_*-C_\delta)\|X(t)\|_H^2.
    \]
    Second, with
    \[
    D(X):=\|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2,
    \]
    the carrier slaving estimate gives
    \[
    C_1\|X\|_{\mathcal N}^3
    \le
    \varepsilon D(X)+C_\varepsilon\|X\|_{\mathcal N}^2.
    \]
    This is the point where projected nonlinear growth is absorbed by the
    dissipative carrier quantity.  D.6 is a global projected-carrier theorem.  Its
    classical use passes through the strict readout and composition slots in
    D.3--D.5.  Thus D.6 is support for the carrier route; it is not the same claim
    as a global classical \(H^s\) bound for the original solution.



    \subsection{Exact PSJ+.1 Construction Eliminates Localization Tail}

    This subsection records a real local simplification in the localized-projector
    exact-potential branch.  The earlier notes carried a localization-tail supplier,
    but that tail is not forced by the exact \(PSJ+.1\) construction.  It appears
    only after the localized projector moment is rewritten with an auxiliary
    remainder tensor.

    The exact \(PSJ+.1\) surrogate is already the localized pair-projector moment

    \[
    \widetilde S_J(x,t)
    =
    \int_{G_{J,\mathrm{rlf}}^{pair}(I)}
    w_{J,x,t}(a,b)\,P_{ab}(t)\,d\mu_J^{pair}(a,b).
    \]

    Kept in this form, the object has no additive tail.  The tail-free realization
    is

    \[
    \mathrm{Tail}_J\equiv 0,
    \qquad
    R_J^{tail}\equiv 0.
    \]

    \[
    \int_I\!\!\int_{\Omega_J}
    w_J(x,t)\,\|R_J^{tail}(x,t)\|_{\mathrm{op}}^2\,dx\,dt
    =
    0.
    \]

    This pays the localization-tail slot on the exact localized-projector route.
    The remaining local wall is smaller and more explicit:

    \[
    \text{coefficient drift}
    \quad+\quad
    \text{weighted theorem-safe entrance}
    \quad+\quad
    \text{weighted corotational drift}.
    \]

    The coefficient-drift slot remains open under the current bounded-measurable
    selector packet.  The weighted entrance slot is routed through the installed
    \(D.7ic\) or \(D.7ig\) entrances, and the weighted corotational slot is routed
    through the \(PSJ+.35\) packet.  The supplier notes also record a sharper
    optional realization: on the frozen transported packet, coefficient drift
    disappears, and the angular-forcing reduction identifies the corotational slot
    with \(D.7ie1\) or \(D.7ie3\), modulo the usual weighted
    coverage/globalization packet.  The status is support with one paid local slot:
    the localization tail is removed in this exact realization, while the remaining
    coefficient and weighted-drift slots still need their own payments before the
    branch can enter a closure argument.


