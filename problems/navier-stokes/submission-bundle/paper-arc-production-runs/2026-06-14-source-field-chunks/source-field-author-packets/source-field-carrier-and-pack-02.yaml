      \subsection{Euclidean Same-Surface Warrant Carrier}

      This subsection records the downstream Euclidean warrant as support.  Its job is
      to keep every Euclidean package on one fixed theorem surface: one equation, one
      approximation scheme, one limiting object, and one continuation criterion.

      The warrant is a consistency requirement, not an extra regularity theorem.  It
      prevents support packages from being assembled across different solutions or
      different approximation surfaces.

      Define \(\mathcal W_{\mathrm{Euc}}[u]\) to mean that the following packages all
      hold on the same classical solution surface:
      \[
      \begin{array}{ll}
      S1,S2 & \text{scale-barrier and high-frequency tail/flux control},\\
      M1,M2 & \text{the named } Q(t) \text{ bridge and cascade handoff},\\
      K1,K2,K3 & \text{compactness and nonlinear limit passage},\\
      G1,G2 & \text{continuation control and the }4\to1\text{ recertification arrow},\\
      C1,C2 & \text{same-surface and provenance audits}.
      \end{array}
      \]
      The warrant claim is the single implication
      \[
        \mathcal W_{\mathrm{Euc}}[u]
        \Longrightarrow
        \begin{gathered}
        \text{the downstream Euclidean} \\
        \text{same-surface closure statement.}
        \end{gathered}
      \]

      This is a provenance claim about the Euclidean support stack.  The entries above
      have to refer to the same \(u\), the same approximation surface, and the same
      classical continuation step.  The old pullback target remains a historical
      comparison point.  The live warrant is the same-surface package displayed here.

      This warrant is secondary to the active object-law route.  It keeps stale
      Euclidean closure language from re-entering the paper as hidden proof authority.
      The warrant can support a later closure only when the cited packages all refer
      to the same \(u\) and the same continuation step.


