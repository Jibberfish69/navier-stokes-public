      \subsection{Finite-Frame Linearization On Selector-Good Strips}

      This note replaces the full selector-good pair-average linearization burden by
      a finite-frame theorem on the exact-potential branch. On a selector-good strip,
      choose a balanced entrance frame
      \[
      \sum_{\ell=1}^m
      w_\ell\,\omega_{J,0}^\ell(a)\otimes\omega_{J,0}^\ell(a)
      =
      \Pi_{N_a},
      \qquad
      w_\ell>0,
      \qquad
      \omega_{J,0}^\ell(a)\in S(N_a).
      \]
      Define the entrance points and transported pair vectors by
      \[
      x_{\pm}^\ell(a,t_0):=
      a\pm h_J\,\omega_{J,0}^\ell(a),
      \]
      \[
      z_J^\ell(t,a):=
      \frac{X_t(x_+^\ell(a,t_0))-X_t(x_-^\ell(a,t_0))}{2h_J}.
      \]
      The finite-frame linearization hypothesis is
      \[
      \max_{1\le\ell\le m}
      \bigl|
      z_J^\ell(t,a)-W_J^{coc}(t,a)\omega_{J,0}^\ell(a)
      \bigr|
      \le
      \varepsilon_{J,\mathrm{lin}}^{frame}(t,a),
      \qquad
      \varepsilon_{J,\mathrm{lin}}^{frame}\to0.
      \]
      Under this hypothesis, the finite-frame tensor
      \[
      \mathcal K_J^{frame}(t,a):=
      \sum_{\ell=1}^m w_\ell z_J^\ell(t,a)\otimes z_J^\ell(t,a)
      \]
      converges to
      \[
      W_J^{coc}(t,a)\Pi_{N_a}(W_J^{coc}(t,a))^\ast
      \]
      with an operator-norm error controlled by the displayed linearization error.
      Thus the balanced-frame packet plus finite-frame linearization closes the
      tensor-level content of \(PTC\text{-}Lin+PTC\text{-}Shape\). The exact-potential
      route still carries the comparison packet, the Cauchy--Green gap, and downstream
      assembly before it reaches the \(D.7mq\) branch.

      For the reader, the reduction is this: the route no longer has to average over
      an uncontrolled continuum of pair directions.  It may use a finite set of
      entrance directions whose weighted second moments already give the normal-plane
      projector.  The only analytic price is the displayed error
      \(\varepsilon_{J,\mathrm{lin}}^{frame}\), which must go to zero on the same
      selector-good strip.

