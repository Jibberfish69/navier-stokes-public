      \subsection{H.1 Carrier-Leakage Direct Completion}

      This is a carrier-side support result for the projected \(NC\)-flow route.  It
      closes the \(H.1\) commutator-leakage estimate used in the \(D.2\) bilinear
      hinge:

      \[
      \|[\Delta_D,Q_i]\mathbb P_DN_D(X)e_\beta\|
      +
      \|Q_i\mathbb P_D[\Delta_D,N_D(X)]e_\beta\|
      \le
      \varepsilon\bigl(\|\Delta_DX\|+\|\Delta_D^{1/2}\Omega_D(X)\|\bigr)
      +C_{\varepsilon,i,\beta}\mathcal E_D(X)^{1/2}.
      \]

      The proof expands the localization commutator with the connection Laplacian,
      expands \([\Delta_D,N_D(X)]e_\beta\), and absorbs lower-order graph-norm terms.
      This pays a linear carrier leakage hinge.  It does not discharge the Euclidean
      gradient lifted remainder or the HFG low-mode residual by itself.

      The proof role is narrow and important.  When a localized carrier projection is
      commuted past the connection Laplacian and the projected nonlinear operator,
      the error has to stay below the graph norm already being controlled.  The
      displayed estimate gives exactly that: an \(\varepsilon\)-small piece of the
      principal graph norm plus a lower-order energy contribution.

      This is why the result belongs in the carrier support chain.  It makes the
      projected \(NC\)-flow route stable under one commutator leakage step.  The
      Euclidean gradient lifted remainder, the low-mode HFG residual, and the final
      classical continuation argument still require their own payments.


