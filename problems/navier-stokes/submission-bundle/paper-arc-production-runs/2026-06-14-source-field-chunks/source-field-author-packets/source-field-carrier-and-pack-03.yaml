      \subsection{Four-Body Survivor to Selector Readout Dictionary}

      This subsection is a dictionary, not a new proof program. Its job is to prevent
      the reader from thinking that \(PSJ+\), \(PD.70\), or \(SG.4\) replaced the old
      four-body survivor. They are newer readouts of the same survivor.

      The proof role is source fidelity.  The manuscript has several selector-side
      names for the dangerous packet.  This dictionary says how to read them without
      changing the underlying field.  The survivor is the compactness-limit object on
      the exact solution \(u\); the selector quantities are measurements of that
      object after the later readout choices have been made.

      The compactness/extraction body says that the dangerous packet survives the
      limit passage on the same exact field:
      \[
      u^{(n)}\to u,
      \qquad
      \mathcal E_{\mathrm{live}}^{(n)}\to \mathcal E_{\mathrm{live}}[u].
      \]

      The selector-side readout then uses the one-sided deficit
      \[
      \eta_J(a,b,t)
      :=
      \big[\lambda_J(t)-\mathfrak s_J(a,b,t)\big]_+.
      \]

      \[
      \mathfrak E_{J,2}^{SG}(I)\le \mathfrak F_J^{def}(I),
      \]

      \[
      \boxed{
      \mathcal E_J^{dir}(I)+\mathcal E_J^{loop}(I)
      \le C_{\mathrm{sf},7826}
      \mathcal E_J^{obs}(I).
      }
      \]

      \[
      \boxed{
      \mathcal E_J^{dir}(I)\le C_{\mathrm{sf},7833} \mathcal E_J^{obs}(I).
      }
      \]

