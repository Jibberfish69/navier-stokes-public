      \subsection{Final Global Selector Plateau Theorem}

      The global selector theorem supplies one \(v_{coh}\)-independent plateau weight
      for every active collar support at shell \(j\). The input is carrier-localized
      active readout,
      \[
      \operatorname{supp}(\widetilde Q_iP_{\le j}v_{coh})
      \subseteq
      \Gamma_j(t),
      \]
      together with a proper persistent carrier collar,
      \[
      \Gamma_j(t)^{+M}
      \subsetneq \mathbb R^3.
      \]
      Define
      \[
      \mathcal K_j(t):=\Gamma_j(t)^{+M},
      \qquad
      \mathcal P_j(t):=\mathcal K_j(t)^{+L2^{-j}},
      \]
      where \(L\) dominates the fixed collar constants. Choose \(w_j\) by the
      regularized-distance construction so that
      \[
      w_j=1\text{ on }\mathcal P_j(t),
      \qquad
      \operatorname{supp}w_j\subseteq \mathcal K_j(t)^{+2L2^{-j}}.
      \]

      For the active collar support
      \[
      K_{i,j}(t):=
      \operatorname{supp}(\widetilde Q_iP_{\le j}v_{coh})^{+M},
      \]
      the inclusions are
      \[
      K_{i,j}(t)
      \subseteq\mathcal P_j(t),
      \qquad
      w_j=1\text{ on }K_{i,j}(t).
      \]
      This closes the weighted-branch selector requirement from one construction. If
      the proper collar input fails, the algebraic full-space plateau \(w_j\equiv1\)
      is still available, but geometric localization is then absent.

      This is the point of the construction.  Every active collar term is measured
      against the same plateau, so the proof is not secretly changing localizers from
      one term to the next.  The selector branch can then charge collar errors to one
      geometric object, namely \(\Gamma_j(t)^{+M}\) and its fixed dyadic
      fattening.

      The result pays the plateau part of the selector localization bill.  Its input
      is still a proper persistent collar.  When only the algebraic full-space choice
      \(w_j\equiv1\) is available, the multiplier identity survives, while the
      localized Pack-side support information has not been supplied.  In the paper
      this theorem should be read as a support theorem for the carrier route, not as a
      standalone continuation theorem.


