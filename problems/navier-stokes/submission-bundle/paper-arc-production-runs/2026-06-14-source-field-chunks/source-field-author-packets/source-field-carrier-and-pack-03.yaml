      \subsection{Frozen Exceptional-Set Measure Localization}

      The geometric half of the frozen linearization bill is localization and
      \(L^{p/2}\) control of the thresholded differentiability exceptional-set
      measure on the standard selector-scale branch.  With the frozen
      threshold schedule \(\vartheta_{J,\tau}^{lin}(a)\), define

      \[
      \mu_{J,\tau}^{diff}(a)
      :=
      \mu_{J,\varepsilon}^{pair}
      \bigl(E_{J,\varepsilon,\vartheta_{J,\tau}^{lin}(a)}^{diff}(\tau,a)\bigr).
      \]

      \[
      \Theta_{J,\tau}^{diff}(a)
      \le
      \bigl(R_{J,\tau}^{frz}(a)\bigr)^2\,\mu_{J,\tau}^{diff}(a).
      \]

      \[
      \sup_{a\in\pi_a(\mathcal G_J)}R_{J,\tau}^{frz}(a)
      \le
      R_{J,\tau}^{frz,\ast}<\infty,
      \]

      \[
      \operatorname{supp}\bigl(\mu_{J,\tau}^{diff}\bigr)
      \subseteq
      B_J^{diff,meas,\tau},
      \qquad
      \mu_J^{pair}(B_J^{diff,meas,\tau})=o_J(1),
      \]

      \[
      \bigl\|\mu_{J,\tau}^{diff}\bigr\|_{L^{p/2}(d\mu_J^{pair})}
      \le
      C_{p/2,\tau}^{diff,meas}.
      \]

      Then the weighted geometric price satisfies

      \[
      \bigl\|\Theta_{J,\tau}^{diff}\bigr\|_{L^{p/2}(d\mu_J^{pair})}
      \le
      \bigl(R_{J,\tau}^{frz,\ast}\bigr)^2
      C_{p/2,\tau}^{diff,meas}.
      \]

      This is a proof under the stated frozen-measure localization inputs.  Its
      meaning for the paper is precise: the geometric part of the frozen
      linearization price is a frozen-time exceptional-set localization theorem.
      The note does not supply the underlying \(\mu_{J,\tau}^{diff}\) localization
      from original data.

      The calculation is deliberately small.  The exceptional set is first measured
      by \(\mu_{J,\tau}^{diff}\).  The radius bound
      \(R_{J,\tau}^{frz,\ast}\) then converts that measure into the geometric price
      \(\Theta_{J,\tau}^{diff}\).  The \(L^{p/2}\) estimate follows because the
      radius has been made uniform on the frozen slice.

      This pays the geometric half only after the exceptional-set measure has already
      been localized.  In the manuscript route, it should be cited as a frozen-time
      price conversion.  The upstream production of the localized exceptional-set
      measure remains a named theorem debt.


