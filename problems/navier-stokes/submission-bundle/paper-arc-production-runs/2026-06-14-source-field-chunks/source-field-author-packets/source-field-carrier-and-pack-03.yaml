      \subsection{Frozen Tolerance Localization Packet}

      The scalar half of the frozen linearization bill packages the chosen frozen
      tolerance schedule into a localized \(L^p\) packet.  The geometric
      exceptional-set content stays in the preceding localization theorem.

      \[
      \vartheta_{J,\tau}^{lin}(a)\ge 0
      \qquad
      \text{on }\pi_a(\mathcal G_J).
      \]

      \[
      \Xi_{J,\tau}^{tol}(a)
      :=
      \bigl(\vartheta_{J,\tau}^{lin}(a)\bigr)^2.
      \]

      \[
      \operatorname{supp}\bigl(\vartheta_{J,\tau}^{lin}\bigr)
      \subseteq
      B_J^{tol,\tau},
      \qquad
      \mu_J^{pair}(B_J^{tol,\tau})=o_J(1),
      \]

      \[
      \bigl\|\vartheta_{J,\tau}^{lin}\bigr\|_{L^p(d\mu_J^{pair})}
      \le
      C_{p,\tau}^{tol}.
      \]

      \[
      \bigl\|\Xi_{J,\tau}^{tol}\bigr\|_{L^{p/2}(d\mu_J^{pair})}
      =
      \bigl\|\vartheta_{J,\tau}^{lin}\bigr\|_{L^p(d\mu_J^{pair})}^2
      \le
      \bigl(C_{p,\tau}^{tol}\bigr)^2.
      \]

      So the scalar side is paid once the support-localized \(L^p\) tolerance
      schedule is paid.  This packet is auxiliary.  The intrinsic frozen geometric
      content still sits in the exceptional-set measure and synchronization
      statements above.

      Together with the preceding section, this separates the frozen linearization
      bill into two prices a reader can audit.  The scalar price is the size of the
      tolerance schedule.  The geometric price is the size and support of the
      exceptional set.  The synchronization theorem is the bridge that lets the two
      prices be compared on the same frozen slice.

      This packet pays only the scalar bookkeeping.  It is useful because it prevents
      the paper from blending the tolerance choice with the geometric exceptional-set
      claim.  The reader should see the tolerance estimate here, then look back to
      the exceptional-set section for the geometric payment.

      If a later branch allows global scalar smallness without bad-set support, this
      packet can be weakened to direct global \(L^p(d\mu_J^{pair})\) smallness of
      \(\vartheta_{J,\tau}^{lin}\).


