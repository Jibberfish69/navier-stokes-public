      \subsection{Heat-Governed Carrier Synthesis For Tower And Shadow Route}

      This is an auxiliary carrier synthesis note.  It does not add a temperature
      equation to the classical incompressible Navier--Stokes system.  The claim is
      that the derived carrier evolution is heat-law type, and the visible variables
      \((u,p)\) are readouts after projection into the commutative incompressible
      sector.

      \[
      (u,p),
      \qquad
      \Phi,
      \qquad
      F:=\nabla_a\Phi,
      \qquad
      \nabla\cdot u=0,
      \qquad
      \nu.
      \]

      Any carrier object is auxiliary and derived from this same MPP source object.
      The note belongs on the survivor/supplier side of the route.  It is not the
      CM endpoint-exclusion argument and it is not the Euclidean gradient closure.

      The reader should treat the tower as a derivative bookkeeping device for the
      same Navier--Stokes equation.  Differentiating the equation creates a heat-loss
      term, a pressure correction, and lower-order nonlinear routing terms.  The
      equation remains the classical incompressible system; \(\Phi\), \(F\), and the
      carrier variables are derived coordinates for reading the same solution.

      \[
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
      \qquad
      \Pi_{m,\alpha}:=\partial_t^m\partial_x^\alpha p,
      \]

      \[
      \partial_t J_{m,\alpha}
      +
      \sum_{a=0}^{m}\sum_{\beta\le\alpha}
      \binom ma \binom{\alpha}{\beta}
      \big(J_{a,\beta}\cdot\nabla\big)J_{m-a,\alpha-\beta}
      +
      \nabla \Pi_{m,\alpha}
      =
      \nu\Delta J_{m,\alpha}.
      \]

      \[
      \frac12\frac{d}{dt}\|J_{m,\alpha}\|_{L^2}^2
      +
      \nu\|\nabla J_{m,\alpha}\|_{L^2}^2
      =
      -\!\!\!\sum_{\substack{0\le a\le m,\ \beta\le\alpha\\(a,\beta)\neq(0,0)}}
      \binom ma\binom{\alpha}{\beta}\,
      I_{a,\beta}^{m,\alpha},
      \]

      \[
      \nu\Delta J_{m,\alpha}
      \]

      is the unambiguous heat-loss channel in the raw derivative tower.

      The pressure family is the anti-compression correction that keeps the visible
      readout in the incompressible sector.  The mixed terms are the routing law that
