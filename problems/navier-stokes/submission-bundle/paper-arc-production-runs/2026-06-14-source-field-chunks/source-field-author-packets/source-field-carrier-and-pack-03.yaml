      \subsection{HFG Continuation, All-Scale, And Carrier Export Result}

      HFG is a sufficient continuation packet in the present route.  Once it is
      available, the vorticity criterion below prevents breakdown on the retained
      classical surface.  The appendix has not proved HFG from original data.

      \[
      \omega:=\nabla\times u.
      \]

      Assume the HFG summability displayed below is available on the same classical
      surface.  Bernstein's inequality then places the vorticity in the critical
      Besov class used by the standard continuation criterion.  Under that hypothesis
      the retained classical solution cannot break down at time \(T\) through this
      surface.

      \[
      \|\Delta_j\omega(t)\|_{L^\infty_x}
      \le
      C\,2^{3j/2}\|\Delta_j\omega(t)\|_{L^2_x}.
      \]

      Thus

      \[
      \sum_j2^{3j/2}\|\Delta_j\omega\|_{L_t^1L_x^2}<\infty
      \Longrightarrow
      \int_0^T\|\omega(t)\|_{B^0_{\infty,1}}\,dt<\infty,
      \]

      and the standard critical vorticity continuation criterion applies.

      The open direction is producing HFG from the original data.  A pure spectral-gap
      kernel does not produce it, because the low-high channel still contains

      \[
      A_{j-1}(t):=\|\nabla S_{j-1}u(t)\|_{L^\infty_x},
      \]

      \[
      A_{j-1}(t)\|\Delta_j\omega(t)\|_2^2.
      \]

      The safe route logic is

      \[
      \text{diagonal/amplitude control}
      \Longrightarrow
      HFG
      \Longrightarrow
      \text{classical continuation}.
      \]

      Carrier export can attack the diagonal/amplitude control, but it still has to
      land on the same classical dyadic surface and handle the residual
      low-threshold summation.  The downstream export \((HFG.1)\) is proved above,
      and unconditional HFG remains upstream.

      The endpoint is the implication from HFG to classical continuation.  HFG gives
      the critical vorticity integrability needed by the continuation criterion, so a
      solution with HFG on the retained dyadic surface continues through \(T\).  The
      unresolved upstream problem is the production of HFG from active low-mode
      strain control, a mixed enstrophy-gradient replacement, direct LPAS, or an
      equivalent same-surface reserve
