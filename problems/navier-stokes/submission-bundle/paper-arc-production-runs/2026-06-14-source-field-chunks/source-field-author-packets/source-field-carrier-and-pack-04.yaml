      \subsection{Lifted Carrier Energy Threshold Uniformization And HFG Replay}

      The uniformization step is the Osgood version of the previous energy argument.

      \[
      \frac{d}{dt}E(t)+c_D\Xi(t)\le C\Phi_s(E(t)),
      \qquad E(t):=\mathcal E_D^{(s)}(X(t)).
      \]

      \[
      \int_{E_0}^{\infty}\frac{dr}{C\Phi_s(r)}=\infty.
      \]

      \[
      \sup_{0\le t<T}E(t)<\infty
      \]

      \[
      Z'(t)=C\Phi_s(Z(t)),\qquad Z(0)=E(0).
      \]

      \[
      \int_{E(0)}^{E(t)}\frac{dr}{C\Phi_s(r)}\le t.
      \]

      The divergent Osgood integral keeps \(E(t)\) finite for each finite
      \(t<T\). If \(\Phi_s(r)\) grows superlinearly like \(r^p\) with \(p>1\), this
      argument permits finite-time scalar escape and does not close the carrier route.
      The remaining burden is then a sharper structure theorem for \(\Phi_s\).

      This is the threshold-uniform version of lifted carrier control.  Gronwall is
      enough when the right side is linear or subcritical.  Osgood is the correct
      replacement when the route only knows the growth function \(\Phi_s\).  The
      HFG replay may use this result only after the same lifted energy threshold is
      uniform on the active terminal approach.


