      \subsection{Direct Pack-Native Strain Estimate: Sharpened Target}

      The direct pack-route attempt sharpens the strain estimate needed to control
      terminal pack gauge without passing through the averaged route.

      \[
      \frac{d}{dt}F(a,t)=\nabla u(X(a,t),t)F(a,t),
      \]

      \[
      \frac{d}{dt}F(a,t)^{-1}=-F(a,t)^{-1}\nabla u(X(a,t),t).
      \]

      \[
      \sup_{a\in A_Q(t)}\|\nabla u(X(a,t),t)\|\le S_{pack,Q}(t)
      \]

      \[
      S_{pack,Q}(t)=\|\nabla u(t)\|_{L^\infty}.
      \]

      \[
      S_{pack,Q}(t)
      \le C_{\mathrm{sf},16936}
      1+\|\omega(t)\|_{L^\infty}\log\left(e+\|u(t)\|_{H^s}\right).
      \]

      That estimate is again continuation-grade unless the logarithmic factor is controlled by a separate tower route.

      The sufficient pack-native target is
      \[
      S_{pack,Q}\in L^1_{\mathrm{loc}}([t_0,T_*)).
      \]
      This is the sharpest pack-native coefficient because only the symmetric strain
      changes singular values of the deformation gradient.  Pure rotation changes
      orientation but does not enlarge the pack gauge.

      This coefficient controls the largest singular value along the actual stretching direction. A proof would require a closed equation for the direction field and an integrable bound for the positive part of the aligned strain.


