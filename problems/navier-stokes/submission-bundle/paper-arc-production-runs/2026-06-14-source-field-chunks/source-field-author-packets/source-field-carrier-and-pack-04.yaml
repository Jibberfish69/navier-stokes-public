      \subsection{Lifted Carrier Energy Absorption Result}

      The weighted route can absorb carrier energy only after its nonlinear part is
      split into a small dissipative piece and a controlled energy function.

      \[
      \frac{d}{dt}\mathcal E_D^{(s)}(X)+c_D\Xi_D^{(s)}(X)
      \le C\Phi_s(\mathcal E_D^{(s)}(X)).
      \]

      \[
      \mathcal E_D^{(s)}(X):=\|X\|_{H_D^{s+1}}^2+\|\Omega_D(X)\|_{H_D^s}^2
      \]

      \[
      \frac{d}{dt}\mathcal E_D^{(s)}(X)+2\nu\Xi_D^{(s)}(X)
      \le \mathcal N_s(X),
      \]

      \[
      |\mathcal N_s(X)|
      \le \varepsilon\Xi_D^{(s)}(X)+C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X)).
      \]

      \[
      \frac{d}{dt}\mathcal E_D^{(s)}(X)+(2\nu-\varepsilon)\Xi_D^{(s)}(X)
      \le C_\varepsilon\Phi_s(\mathcal E_D^{(s)}(X)).
      \]

      The absorption mechanism is the familiar one.  The nonlinear term
      \(\mathcal N_s(X)\) may use a small part of the dissipative quantity
      \(\Xi_D^{(s)}(X)\), and the remaining part is charged to a function of the
      lifted carrier energy.  After this split, the left side still contains a
      positive amount of dissipation.

      If \(\Phi_s\) is linear or subcritical on the active interval, Gronwall gives a
      finite lifted carrier-energy bound. The bound supplies the dynamic threshold
      for persistent-support coherent estimates and controls exported remainders.

      The conditional input is the lifted commutator package.  The base \(D.2\)
      energy estimate controls the lower carrier energy.  A bound for
      \(\mathcal E_D^{(s)}\) requires the higher-order commutator terms to obey the
      displayed small-plus-controlled split.


