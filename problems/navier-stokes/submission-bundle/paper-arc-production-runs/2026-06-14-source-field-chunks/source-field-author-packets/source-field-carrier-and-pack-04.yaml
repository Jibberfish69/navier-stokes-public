      \subsection{Classical Closure Warrant Carrier}

      \[
      \nu>0,
      \qquad
      u_0^{\mathrm{vel}}=u_0\in C^\infty(\mathbb T^3),
      \qquad
      \nabla\cdot u_0=0,
      \qquad
      \int_{\mathbb T^3}u_0\,dx=0,
      \qquad
      f=0.
      \]

      \[
      [0,T_*).
      \]

      \[
      CM_{N,r,Q}=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]

      The warrant is the final classical-theory step for the periodic zero-force
      branch.  It begins with a uniform \(H^s(\mathbb T^3)\) bound, with \(s>5/2\),
      up to the alleged terminal time.  Standard local classical Navier--Stokes
      theory then gives a lifespan depending only on that bound.  For any sequence
      \(t_j\uparrow T_*\), the solution relaunched from \(u(t_j)\) exists on a
      common interval of length \(\tau>0\). For large \(j\),

      \[
      t_j+\tau>T_*.
      \]

      Uniqueness identifies the relaunched solution with the original solution on
      their overlap, extending the original solution past \(T_*\). A finite terminal
      time is impossible once the uniform \(H^s\) bound is available.

      The warrant converts an already supplied \(H^s\) bound into continuation.  The
      analytic route still has to supply that bound from the Part/Field or
      classical dyadic packages.  The branch remains the periodic zero-force branch:
      whole-space data and nonzero forcing require their own export warrants.


