    text: |+
      \subsection{Endpoint Selector Or Uniform Strain Tail Theorem Audit}

      The audit isolates the continuum-label obstruction behind the full direct
      Pack.TTU route.  One route is to prove an integrable supremal strain tail:

      \[
      s(a,t)=\|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}.
      \]

      \[
      \int_{t_0}^{T_*}\sup_{a\in A_Q}s(a,t)dt<\infty.
      \]

      Current endpoint definitions supply threshold selectors: for each threshold
      there may be a label witnessing large strain or pack distortion.  The open
      selector theorem must turn those threshold witnesses into one finite family, or
      replace them by a uniform strain-tail estimate.

      \[
      \exists C_1, \dots,C_J,
      \quad
      \sup_{a\in C_j}s(a,t)
      \le C s(a_j,t)+e_j(t),
      \qquad
      \sum_j\int e_j(t)dt<\infty.
      \]

      Then a fixed finite selector controls the supremal strain integral.  This
      theorem is not supplied by the current endpoint definitions.

      An integrable label modulus is also sufficient.  If for some finite
      \(\delta\)-net \(\{a_j\}\),

      \[
      |s(a,t)-s(b,t)|\le\omega_t(\delta)
      \qquad d(a,b)\le\delta,
      \]

      \[
      \int_{t_0}^{T_*}\omega_t(\delta)dt<\infty,
      \]

      Equivalently, full direct Pack.TTU remains open for continuum active label families.


