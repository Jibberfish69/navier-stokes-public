      \subsection{A1c R Via Strain-Control Criterion And Pack-Local Substitute}

      The whole-space continuation criterion can be reached through a strain
      integral.  The target \(A1c_R\) is a uniform \(H^s\) bound up to the alleged
      terminal time:

      \[
      A1c_R:\quad \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb R^3)}<\infty,
      \qquad s>5/2.
      \]

      \[
      \frac12\frac d{dt}\|u\|_{H^s}^2+
      \nu\|\nabla u\|_{H^s}^2
      \le
      C_s\|\nabla u\|_{L^\infty}\|u\|_{H^s}^2.
      \]

      If the strain integral is finite on \([0,T_*)\), Gronwall gives a finite
      \(H^s\) bound. Since \(s>5/2\), Sobolev embedding gives uniform \(C^1_x\)
      control, and local \(H^s\) well-posedness can be restarted from
      \(t_j\uparrow T_*\) with a lifespan depending only on that bound. For \(j\)
      large, the restarted interval crosses \(T_*\).

      The pack-local substitute asks for less than a global strain integral.  It
      tracks the strain seen by the active packet labels and uses that strain to
      control the deformation gauge along those labels.

      \[
      \sup_{a\in A_Q(t)}\|S(u)(X(a,t),t)\|\le S_{pack,Q}(t),
      \qquad
      S(u)=\frac12(\nabla u+\nabla u^T).
      \]

      \[
      \frac d{dt}F=\nabla u(X,t)F.
      \]

      \[
      \frac d{dt}\log\max\{\|F\|,\|F^{-1}\|\}\le S_{pack,Q}(t).
      \]

      The bound controls the packet deformation gauge
      \(\Gamma_{pack,Q}\). With the endpoint tower and field readout, that packet
      control prevents pack detachment, tower blowup, field jump, and dead
      participation on the selected branch.

      Only the continuation implications are proved here. The open analytic work is
      to derive either the full strain integral or the packet strain integrals from
      original whole-space data.


