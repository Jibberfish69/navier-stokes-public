    energy/enstrophy layer does not supply it.

    \[
    \Gamma_{pack,Q}(t):=\sup_{a\in A_Q(t)}\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\}.
    \]

    \[
    \frac{d}{dt}F(a,t)=\nabla u(X(a,t),t)F(a,t),
    \]

    \[
    \frac{d}{dt}F(a,t)^{-1}=-F(a,t)^{-1}\nabla u(X(a,t),t).
    \]

    \[
    \sup_{a\in A_Q(t)}\|\nabla u(X(a,t),t)\|\le S_{pack,Q}(t)
    \]

    \[
    \det F(a,t)=1.
    \]

    The direct pack-native target is
    \[
    \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty.
    \]
    That estimate would give the Gronwall control of \(F\) and \(F^{-1}\) needed by
    the pack gauge.

    This controls the product of singular values.  It gives no bound for the
    largest singular value or the reciprocal of the smallest singular value.
    Volume-preserving maps may stretch one axis and compress another while keeping
    determinant one.  Determinant preservation does not prove the required
    \(L^1_t\) pack-strain bound.

    Any direct derivation of that endpoint strain integral would already be a continuation-grade theorem.

    The conditional pack-Gronwall lemma is proved.  A direct pack-native discharge
    remains open and is equivalent to finding a noncircular \(L^1_t\) terminal
    strain budget below full \(\|\nabla u\|_{L^1_tL^\infty_x}\) continuation
    strength.

    The averaged route stays the current noncircular terminal-tail route.  The
    direct pack-native route is a stronger independent side target.



    \subsection{Pack.TTU Implies the Pack Witness}

    The finite-selector retained tail route closes because a finite maximum of
    integrable labelwise strain records is integrable.  The continuum active-label
    case remains governed by the separate uniform selector / uniform strain-tail
    target.

    For the retained terminal tail, \(Pack_Q\) is the bounded same-fluid packing
    witness on \(Q\): the terminal pack gauge remains finite on the retained tail.

    \[
    \int_{t_0}^{T_*}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op}\,dt<\infty.
    \]

    \[
    S_{pack,Q}(t)
    =\max_{1\le j\le J}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op},
    \]

    \[
    \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt
    \le
    \sum_{j=1}^{J}\int_{t_0}^{T_*}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op}\,dt<\infty.
    \]

    \[
    \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty
    \Longrightarrow
    \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
    \]

    \[
    \Gamma_{pack,Q}\in L^\infty([t_0,T_*))
    \Longrightarrow Pack_Q.
    \]

    For a continuum active-label family, labelwise strain-tail integrability gives
    pointwise-in-label information.  The Pack witness needs the uniform pack gauge.

    The finite-selector Pack row is complete.  The general active-label Pack row
    remains conditional on Endpoint Selector.TTU or Uniform Strain Tail.TTU.

    This is the exact Pack witness payment: once the terminal pack gauge is bounded,
    the Pack face has not failed on the retained tail.  Any remaining obstruction
    must move to Part, Field, Good Scale, or another named packet, rather than being
    reported as unresolved Pack detachment.



    \subsection{BKM Route Check for Pack.TTU}

    The BKM route is a valid conditional shortcut to the Pack.TTU route.  It begins
    with the continuation-grade vorticity integral:

    \[
    \int_{t_0}^{T_*}\|\omega(t)\|_{L^\infty}\,dt<\infty.
    \]

    \[
    \sup_{t<T_*}\|u(t)\|_{H^s}<\infty
    \]

    \[
    H^s(T^3)\hookrightarrow W^{1,\infty}(T^3).
    \]

    \[
    \|\nabla u(t)\|_{L^\infty}
    \le C_s\|u(t)\|_{H^s},
    \]

    \[
    \int_{t_0}^{T_*}\|\nabla u(t)\|_{L^\infty}\,dt<\infty.
    \]

    The BKM hypothesis is continuation-grade.  The current original-data /
    finite-energy packet supplies energy and local balance information, but it does
    not supply the BKM integral or a uniform terminal \(H^s\) bound.

    BKM gives a valid conditional route to the Pack.TTU route.  It leaves the
    original-data theorem open because the needed continuation-grade norm is not
    produced from the installed original-data package.

    The next search target is a pack-native substitute weaker than the Lipschitz
    integral and supplied by the dynamics.  Until such a substitute is proved, BKM
    is a conditional check, not an original-data proof.


