      \subsection{Pack-native Strain Bound and the Remaining Obstruction}

      This side route tries to control the terminal pack gauge directly.  It isolates
      the exact estimate needed for a pack-native proof and records why the current
      energy/enstrophy layer does not supply it.

      \[
      \Gamma_{pack,Q}(t):=\sup_{a\in A_Q(t)}\max\{\|F(a,t)\|,\|F(a,t)^{-1}\|\}.
      \]

      \[
      \frac{d}{dt}F(a,t)=\nabla u(X(a,t),t)F(a,t),
      \]

      \[
      \frac{d}{dt}F(a,t)^{-1}=-F(a,t)^{-1}\nabla u(X(a,t),t).
      \]

      \[
      \sup_{a\in A_Q(t)}\|\nabla u(X(a,t),t)\|\le S_{pack,Q}(t)
      \]

      \[
      \det F(a,t)=1.
      \]

      The direct pack-native target is
      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty.
      \]
      That estimate would give the Gronwall control of \(F\) and \(F^{-1}\) needed by
      the pack gauge.

      This controls the product of singular values.  It gives no bound for the
      largest singular value or the reciprocal of the smallest singular value.
      Volume-preserving maps may stretch one axis and compress another while keeping
      determinant one.  Determinant preservation does not prove the required
      \(L^1_t\) pack-strain bound.

      Any direct derivation of that endpoint strain integral would already be a continuation-grade theorem.

      The conditional pack-Gronwall lemma is proved.  A direct pack-native discharge
      remains open and is equivalent to finding a noncircular \(L^1_t\) terminal
      strain budget below full \(\|\nabla u\|_{L^1_tL^\infty_x}\) continuation
      strength.

      The averaged route stays the current noncircular terminal-tail route.  The
      direct pack-native route is a stronger independent side target.


