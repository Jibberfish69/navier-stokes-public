      \subsection{Pack from finite physical same-fluid cover}

      This is a theorem-grade Pack-row replacement for the continuum
      fixed-selector obstruction.  Instead of asking one finite label set to follow a
      moving supremal escape, the proof uses a finite physical same-fluid cover of
      the retained approach region.

      \[
      Q^\Phi(I,A_\sharp)
      \subset
      \bigcup_{i=1}^M Q_{r_i}^{\Phi}(a_i,t_i),
      \qquad
      r_*:=\min_i r_i>0,
      \]

      By local CKN completion, each shrunken cylinder carries \(ATD_m\).  Choose
      \(m\) high enough to control \(u\) and the transported chart distortion
      constants.

      \[
      \sup_{Q_{\theta r_i}^{\Phi}(a_i,t_i)}\|\nabla u\|_{op}
      \le C_i.
      \]

      \[
      C_*:=\max_{1\le i\le M}C_i<\infty.
      \]

      \[
      \|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}
      \le C_*.
      \]

      \[
      S_{pack,Q}(t)
      :=\sup_{a\in A_Q(t)}\|\operatorname{sym}\nabla u(\Phi(a,t),t)\|_{op}
      \le C_*.
      \]

      The continuum selector problem asks for one fixed finite label set
      carrying a supremal moving-label escape.  This proof uses a finite physical
      same-fluid cover instead.  The cover supplies a uniform local strain bound over
      the whole retained approach window, so moving-label spikes cannot evade it.

      The payment is Pack-side only.  The finite cover controls deformation geometry
      and prevents packing detachment.  It does not also prove Good Scale.TTU or the
      SCF velocity-pressure packet bound.


