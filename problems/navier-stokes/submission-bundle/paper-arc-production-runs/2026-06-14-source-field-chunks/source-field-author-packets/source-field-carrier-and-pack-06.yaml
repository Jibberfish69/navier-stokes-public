      \subsection{Original-data \(E_u\) Conversion and Additive-carrier Obstruction}

      The moving-frame local energy inequality supplies local balances on admissible
      same-fluid cylinders.  In affine-relative coordinates, frame terms are
      controlled by the SCFBase packet and frame records.

      A Poincare route would convert local energy to gradient mass once the
      \(E_u\) packet is known to be zero-mode-free, or affine-relative with the local
      mean and affine modes removed.

      The current original-data surfaces do not install that normalization theorem.
      The local energy inequality gives balance information, while a terminal
      \(E_u\) packet can move through labels and scales without a same-schedule
      \(D_u/P\) lower bound.

      The missing conversion theorem would have to say that a terminal
      scale-critical \(E_u\) packet forces, on the same selected cylinders, either
      dissipation mass or local pressure mass:
      \[
      E_u(Q_k)\ge\eta
      \Longrightarrow
      D_u(Q_k)+P(Q_k)\ge c(\eta)
      \quad\hbox{on the same terminal schedule.}
      \]
      No original-data theorem in the current surfaces supplies this implication.

      The additive-carrier route also remains open.  Global energy gives time-slice
      size control, while repeated scale-critical \(E_u\) terminal packets require a
      bounded-overlap summability theorem.  No finite additive \(E_u\) carrier with
      that property is installed.

      BKM or equivalent high regularity supplies terminal gradient and pressure
      moduli, giving a conditional closure of the \(E_u\) channel.  This does not
      discharge the original-data branch.


