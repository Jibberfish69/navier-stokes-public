      \subsection{Pressure-source Tether and the One-sided Carrier}

      The direct pressure route tests whether pressure and eigenframe sustain can be
      tethered directly to the native one-sided positive source carrier.

      The installed identities control pressure-Hessian and eigenframe sustain in a
      signed-current presentation.  The positive supplier needs the selected
      one-sided carrier

      \[
      |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
      \]

      The Leray projection and pressure Poisson identities act before positive-part
      extraction.  They do not yield a theorem-grade one-sided comparison after
      terminal packet selection.

      The pressure/eigenframe route remains useful support.  It does not yet close
      the native source-weighted angular depletion.  The next alternate must attack
      the selected positive carrier through geometry or ancestry rather than through
      signed pressure support alone.

      The proof status is support, not discharge.  The pressure identities explain
      where the signed pressure and eigenframe terms enter, but they do not provide a
      positive-part inequality for the selected carrier
      \(|w_j|^2[e_j\cdot S_{<j}^{loc}e_j]_+\).


