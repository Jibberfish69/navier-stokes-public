      \subsection{Pack.TTU Implies the Pack Witness}

      The finite-selector retained tail route closes because a finite maximum of
      integrable labelwise strain records is integrable.  The continuum active-label
      case remains governed by the separate uniform selector / uniform strain-tail
      target.

      For the retained terminal tail, \(Pack_Q\) is the bounded same-fluid packing
      witness on \(Q\): the terminal pack gauge remains finite on the retained tail.

      \[
      \int_{t_0}^{T_*}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op}\,dt<\infty.
      \]

      \[
      S_{pack,Q}(t)
      =\max_{1\le j\le J}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op},
      \]

      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt
      \le
      \sum_{j=1}^{J}\int_{t_0}^{T_*}\|\operatorname{sym}\nabla u(\Phi(a_j,t),t)\|_{op}\,dt<\infty.
      \]

      \[
      \int_{t_0}^{T_*}S_{pack,Q}(t)\,dt<\infty
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      \[
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*))
      \Longrightarrow Pack_Q.
      \]

      For a continuum active-label family, labelwise strain-tail integrability gives
      pointwise-in-label information.  The Pack witness needs the uniform pack gauge.

      The finite-selector Pack row is complete.  The general active-label Pack row
      remains conditional on Endpoint Selector.TTU or Uniform Strain Tail.TTU.

      This is the exact Pack witness payment: once the terminal pack gauge is bounded,
      the Pack face has not failed on the retained tail.  Any remaining obstruction
      must move to Part, Field, Good Scale, or another named packet, rather than being
      reported as unresolved Pack detachment.


