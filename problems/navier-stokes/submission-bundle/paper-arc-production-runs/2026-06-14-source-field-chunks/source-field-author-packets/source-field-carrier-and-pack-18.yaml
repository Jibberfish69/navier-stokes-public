      \subsection{WIZARD Bridge II: Gap-Flux-To-Carrier Attempt}

      \[
      \ell\sfcomp{63556} 2^{-j},
      \qquad
      r\sfcomp{63558} 2^{-k},
      \qquad
      k<j-L_0.
      \]

      \[
      \Pi_N^{mid,far,L}(t)
      \rightsquigarrow
      \sum_{j\ge N}\sum_{k<j-L_0}
      2^{-(j-k)}\,\mathfrak S_k(t)\,\mathfrak T_j(t),
      \]

      S k is the low-shell strain readout coming from r, T j is the active-shell stress readout coming from H 1 [u].

      \[
      \mathcal C_N^\sigma(t)
      =
      \sum_{k>N+M}
      2^{3k/2}\|\Delta_k u(t)\|_{L_x^2}\,
      \mathcal D_k^\sigma(t),
      \]

      \[
      \mathcal D_k^\sigma(t)
      :=
      \sum_{j>k+4}2^{-\sigma(j-k)}D_j(t),
      \qquad
      D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      By contrast, the continuum flux route pairs the low-shell strain with the H 1-band stress H 1 . Its natural active-shell mass is

      \[
      \int \tau_j^{H^1}[u](x,t)\,dx
      \sfcomp{63592}
      2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      This is better than saying only "they look related." It identifies the exact part of the bridge that is already proved and the exact part that still fails.

      So the missing bridge theorem is not another orientation theorem. It is a high-shell derivative upgrade theorem on the far-gap flux side.


