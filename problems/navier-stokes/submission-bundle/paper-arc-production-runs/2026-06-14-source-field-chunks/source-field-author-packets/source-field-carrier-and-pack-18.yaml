      \subsection{Weighted Spectral Carrier-Floor-Leakage Reduction}

      Fix a dyadic threshold K=2 N and let u (n) be the fixed classical approximation family on the Euclidean theorem surface.

      \[
      T_1^{(n)}(K,t)
      :=
      \||\nabla|P_{\ge K}u^{(n)}(t)\|_{L_x^2}^2,
      \qquad
      Q_1^{(n)}(K,t)
      :=
      \||\nabla|^2P_{\ge K}u^{(n)}(t)\|_{L_x^2}^2.
      \]

      \[
      E_N^{(n)}(t)
      :=
      \sum_{j\ge N}2^{2j}\|\Delta_j u^{(n)}(t)\|_{L_x^2}^2,
      \qquad
      D_N^{(n)}(t)
      :=
      \sum_{j\ge N}2^{4j}\|\Delta_j u^{(n)}(t)\|_{L_x^2}^2,
      \]

      \[
      T_1^{(n)}(K,t)\sfcomp{63409} E_N^{(n)}(t),
      \qquad
      Q_1^{(n)}(K,t)\sfcomp{63411} D_N^{(n)}(t).
      \]

      The current packet algebra does not support the old L N carrier on the derivative-weighted surface.

      \[
      \Lambda_N^{(n)}(t)
      :=
      1+\sum_{k\le N-4}2^{5k/2}\|\Delta_k u^{(n)}(t)\|_{L_x^2},
      \]

      \[
      \Theta_N^{\sharp,(n)}(t)
      :=
      2^{3N}\sum_{m=N-M}^{N+M}\|\Delta_m u^{(n)}(t)\|_{L_x^2}^2,
      \]

      where the lifted packet is the exact open remainder created by (S j-4 -S N+M )u (n) .

      The derivative-weighted spectral carrier-floor-leakage theorem so reduces exactly to the lifted high-side packet.

      So the current theorem-primary s=1 burden is not the strict low packet, not the spill collar, and not the genuine high-high packet. It is the lifted packet alone, in exactly that three-piece form.

      The weighted lifted packet is not supposed to be closed by pretending the old L N surface still survives.

      Those are the recorded sufficient ways to turn (19) into a theorem, without overclaiming a return to the old L N carrier.

      The full derivative-weighted carrier-floor-leakage theorem is not proved here.

      Returning from N to the old L N surface would require a new low-mode strain suppression theorem, not just further repackaging of the existing shell algebra.


