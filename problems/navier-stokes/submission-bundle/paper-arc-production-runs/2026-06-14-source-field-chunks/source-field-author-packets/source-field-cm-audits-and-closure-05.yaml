      \subsection{Final CM conjunction and Member row}

      The theorem-grade conjunction row combines the three separately typed CM witness
      faces after the source-pulse supplier route has been spent through the Field
      row.

      \[
      CM_{N,r,Q}(u,p,\Phi)
      :=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      From the Pack row, obtain Pack Q. From the Part row, obtain Part N,Q . From the Field row, obtain Field N,r,Q . By conjunction introduction,

      \[
      Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      \[
      Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}
      \Longrightarrow CM_{N,r,Q}(u,p,\Phi).
      \]

      where Pack Row.A includes the finite-selector Pack row, and Part Row.A includes the terminal participation closedness row.

      Final CM conjunction complete conditional on the row theorems. The remaining theorem-level blockers are exactly the conditional row-input gaps named above, not the conjunction itself.


