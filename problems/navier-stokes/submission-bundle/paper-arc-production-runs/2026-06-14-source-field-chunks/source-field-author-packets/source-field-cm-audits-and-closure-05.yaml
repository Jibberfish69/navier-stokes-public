    \subsection{Minimal Zeno Ancient Residue B class-production and Liouville attempt}

    Failed direct discharge. The terminal Zeno compactness argument does produce a natural minimal ancient class B min, but that class is not rigid enough to prove a source-residue Liouville theorem. Strengthening the class enough to force residue zero requires hypotheses not produced by the Zeno extraction, or it assumes the desired source-drain conclusion.

    \[
    ZenoBoundedClass_B.A\Longrightarrow ZenoResidueLiouville_B.A.
    \]

    Then the terminal Zeno branch would close by contradiction with the inherited nonzero source residue.

    \[
    r_m\downarrow0,
    \qquad
    \sum_m r_m^2<\infty.
    \]

    Rescale around the selected source-pulse windows. The compactness package yields a local suitable ancient source-residue object

    \[
    (v,q,\nu_*)\quad\text{on }(-\infty,0]\times\mathbb R^3\text{ locally},
    \]

    \[
    \nu_*(Q_1(0,0))\ge \eta>0.
    \]

    \[
    \nu_*(\text{threshold source-pulse class in }s<-a)=0
    \qquad\forall a>0.
    \]

    The no-incoming property controls threshold source-pulse residue on fixed slices s<-a. It does not exclude positive residue concentrating in a terminal layer s 0. Thus it permits a measure scenario of the form

    The local energy inequality is compatible with such a positive terminal source measure. It gives no sign contradiction and no backward uniqueness because * is an allowed positive source-residue measure.

    But terminal Zeno compactness from Original Smooth Data does not produce any of them. Local energy is local, Type I and bounded-vorticity are endpoint amplitude controls, critical smallness conflicts with the retained nonzero residue, and self-similarity/symmetry is not imposed by the selected same-fluid ancestry.

    A source-cancellation class would force *=0, but producing it is exactly the source-wall theorem and hence circular.

    This class is too weak for a Liouville theorem because terminal-time Zeno residue concentration remains allowed. Every stronger known rigid class is not produced by the route.


