      \subsection{Periodic Clay Terminal Promotion from the Theorem 2.1 Warrant}

      The installed Theorem 2.1 class-membership warrant promotes only the periodic
      \(\mathbb T^3\), zero-force Clay branch. It does not assert an independent
      \(\mathbb R^3\) export theorem.

      Let \(u_0\) be smooth, divergence-free, and zero-mean on \(\mathbb T^3\).  Let
      \((u,p)\) be the maximal classical solution of the three-dimensional
      incompressible Navier--Stokes equations with \(f=0\) on \([0,T_*)\).

      The promotion statement has the following form: once the installed Theorem 2.1
      warrant supplies the required endpoint class-membership exclusion for this
      periodic branch, the maximal time is infinite,
      \[
      T_*=\infty.
      \]
      This discharges the periodic Clay branch with \(f=0\) on the original periodic
      Navier--Stokes surface.

      Local classical well-posedness gives a maximal interval \([0,T_*)\).  Suppose,
      for contradiction, that \(T_*<\infty\).

      By maximality, a finite terminal obstruction occurs at \(T_*\).  On the
      installed class-membership route, every such obstruction is typed through the
      class vocabulary

      \[
      M_Q(u,p)=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}
      \]

      The Theorem 2.1 warrant excludes that typed terminal obstruction for the
      periodic zero-force branch.  This contradicts the existence of the first finite
      terminal obstruction at \(T_*\).  Hence no finite \(T_*\) exists, and
      \(T_*=\infty\).

      The solution remains classical for all finite time on the original periodic
      Navier--Stokes equation with \(f=0\), so the periodic Clay branch is discharged
      inside the stated warrant.


