      \subsection{Scfbase Finite Complexity Moving Bad Packets Test}

      \[
      \mathcal B_{\varepsilon_m}^{\Phi}
      \cap Q^\Phi([t_0,T_*),A_\sharp)=\varnothing.
      \]

      A continuum active label family can support a moving bad packet pattern. At terminal times t n T *, the bad scale-critical packet may concentrate near fresh labels a n, while every fixed finite label selector avoids all but finitely many bad packets.

      It is incompatible with a fixed finite selector theorem unless an additional finite-complexity rule prevents the labels a n from escaping through the continuum.

      Pack.TTU gives bounded same-fluid distortion and stable comparison of moving cylinders. It does not bound the number of active label cells where SCF base can become bad. It also does not impose a fixed finite selector for the bad set.

      Equivalently, a fixed finite selector must capture all terminal bad SCF packets.


