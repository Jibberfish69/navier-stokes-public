      \subsection{Clay problem Any Finite Failure Witness CM Exit}

      Let F be an alleged finite-time Navier--Stokes failure witness at a terminal time T *: a same-solution terminal obstruction after legal losses, boundary exits, non-selected branches, and readout-only artifacts have been removed.

      \[
      \boxed{
      \mathcal F
      \Longrightarrow
      \neg Pack_Q
      \vee
      \neg Part_{N,Q}
      \vee
      \forall r>0\,\neg Field_{N,r,Q}.
      }
      \]

      \[
      \boxed{
      \mathcal F
      \Longrightarrow
      \begin{cases}
      \neg Pack_Q,\\
      Pack_Q\wedge\neg Part_{N,Q},\\
      Pack_Q\wedge Part_{N,Q}\wedge\forall r>0\,\neg Field_{N,r,Q}.
      \end{cases}
      }
      \]

      \[
      CM_{N,r,Q}=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q},
      \]

      \[
      Pack_Q,\qquad Part_{N,Q},\qquad Field_{N,r,Q}.
      \]

      \[
      Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}
      \Longrightarrow
      \sup_{t<T_*}\|u(t)\|_{H^s}<\infty,
      \qquad s>5/2,
      \]

      so an alleged finite-time failure witness cannot retain all three slots on the same terminal packet. We now sort the failed slot in Pack-before-Part audited order.

      This is the correct landing face for zero-scale packets and unpaid donor-refill ancestry. The installed Pack-side notes give

      So a zero-radius Zeno terminal residue and a selected unpaid scale-critical donor-refill tree are Pack exits. They do not need to be converted into retained Field/Jump objects.

      This is where shared participation failure, pressure-viscosity participation failure, and tower-residence failure belong. The branch has kept a carrier, but the carrier no longer supports the same Navier--Stokes participation law through the required depth.

      Thus a retained source/readout residue is not a Field object by name alone. It lands in Field only after the carrier and participation rows have survived.


