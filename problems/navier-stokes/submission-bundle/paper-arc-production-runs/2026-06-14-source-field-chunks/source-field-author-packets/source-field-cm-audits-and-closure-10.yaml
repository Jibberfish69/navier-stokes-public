      \subsection{Clay problem Ancestry Drain.A Direct Attempt Note}

      Assume the parent-measure layer has already produced a lawful same-fluid source ancestry chain. The question is whether the installed finite reserves force that chain to terminate.

      \[
      \cdots \to P^{-2}\to P^{-1}\to P^0
