      Reserve(P^{-m}\to P^{-m+1})\ge c_0>0,
      \]

      \[
      \mathcal R(P^{-m})\le \mathcal R(P^{-m+1})-\delta.
      \]

      The installed finite records include raw energy dissipation, pressure/cutoff records, mixed-boundary records, and already-separated active- reserves. They do not currently assign a positive cost to every legal parent step.

      The local energy inequality gives a one-sided balance on each packet, but a source-balanced parent step is exactly the case where the child source is recreated by the predecessor rather than paid by a visible drop of local energy. Iterating the balance backward telescopes only if a fixed entrance scale/time is reached or if each step has an installed quantized cost. Neither is supplied by the current terminal shrinking schedule.

      \[
      \mathcal R(P)
      \]

      Thus there is no installed function that must strictly decrease on every legal parent edge.

      Ancestry Drain.A is not installed by current finite reserves, local energy, same-fluid transport, or shell scheduler data.

      That note also records why the usual tower-flux identity is not enough: it does not produce a finite scale-normalized donor reserve for every positive source-parent edge.

      \[
      \pi(P^-\to \mathrm{child}(P^-))
      \le C_{\mathrm{sf},30089}
