      \subsection{Clay problem B ASAC Terminal Atom CM Face Labeling}

      Conditional diagnostic theorem. The exits forced by a B ASAC closed terminal atom are assigned to the Pack, Part, and Field witness faces.

      Here J in is incoming participation flux, M CM is the finite shared-participation/source-current envelope, and Exit denotes paid legal/projected/cutoff/boundary exits.

      \[
      CM_{N,r,Q}=Pack_Q+Part_{N,Q}+Field_{N,r,Q}.
      \]

      The primary geometric reading is Pack-first: a terminal atom is an attempted order-one source-current accumulation inside a volume-preserving transported packet. It lands on another face only when the compensation is explicitly carried by that face.

      If Exit>0, the branch exits B ASAC closed directly. This is already a named paid-exit channel.

      \[
      \Gamma_{pack,Q}=\infty
      \Longrightarrow
      \neg Pack_Q.
      \]

      \[
      \mathfrak P_{N,Q}=\infty
      \Longrightarrow
      \neg Part_{N,Q}.
      \]

      \[
      \mathfrak C_{N,r,Q}=\infty
      \Longrightarrow
      \neg Field_{N,r,Q}.
      \]

      Apply BASACClosed Terminal AtomCMExit Classification.A. A positive terminal atom forces incoming participation flux, CM envelope blowout, or paid exit.

      Incoming participation flux must either cross a failed transported control-volume boundary, giving Pack, or cross retained geometry as source-current mismatch, giving Field.

      Mixed cases can still carry multiple labels. The priority only prevents a Pack-native incompressible balance failure from being prematurely re-described as a Field jump or Part carrier defect without a specific bridge.

      This theorem gives at least one valid face label. It does not force uniqueness. Mixed failures can be recorded on multiple faces; the canonical priority above is only the default diagnostic reading when a single label is needed.


