      \subsection{Clay problem BASAC Transported No-Flux Time-Face Anti-Atom Reduction}

      The conditional reduction is proved. The terminal anti-atom theorem is not discharged from installed inputs.

      The lateral flux-localization attempt showed that a compact terminal Zeno layer can create a terminal source atom with zero lateral transported-cylinder flux. so any usable no-flux theorem for the B ASAC residue class must include an explicit terminal time-face anti-atom clause.

      \[
      \mu_*^{src}(B_R\times[-R^2,-a])=0
      \qquad
      \forall R<\infty,\ a>0.
      \]

      It is not needed for the final measure-theoretic collapse once BASACTime Face Anti Atom.A is assumed.

      \[
      [-R^2,0]
      =
      \left(\bigcup_{n\ge1}[-R^2,-1/n]\right)
      \cup
      \{0\}.
      \]

      \[
      \mu_*^{src}(B_R\times[-R^2,-1/n])=0.
      \]

      \[
      \mu_*^{src}(B_R\times\{0\})=0.
      \]

      \[
      \mu_*^{src}(B_R\times[-R^2,0])=0.
      \]

      Thus lateral no-flux plus B ASAC clauses do not produce BASACTime Face Anti Atom.A.


