      \subsection{Clay problem Constitutive-First Re-Derivation Note}

      Role: state the stronger correction that class membership must enter before the branch-start hypotheses and consumer equations, not merely as a later supplier header.

      The earlier constitutive-import patches were not yet sharp enough. They made the branches acknowledge the class-membership carrier, but they still left too much of the branch-start algebra looking semantically autonomous.

      \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0.
      \]

      \[
      \text{Assume }TCJ,\ TEA,\ \mathrm{Err}_{J,\mathrm{id}},\ \text{etc.}
      \]

      \[
      \begin{aligned}
      \mathrm{CM}_{NS}
      &\Longrightarrow \text{earliest admissibility consequences}\\
      &\Longrightarrow \text{branch readout packet}\\
      &\Longrightarrow \text{consumer equation}\\
      &\Longrightarrow \text{downstream closure}.
      \end{aligned}
      \]

      That is the sense in which the old branch starts are not "still valid under the new assumptions." The identities may remain true, but their role as autonomous starting points is no longer valid.

      \[
      \mathrm{Err}_{J,\mathrm{id}}
      =
      \mathrm{Err}_{J,\mathrm{pack}}^{cm}
      +
      \mathrm{Err}_{J,\mathrm{tc}}^{cm}
      +
      \mathrm{Err}_{J,\mathrm{cal}}^{branch}.
      \]

      So the abstract projector-identification surface is no longer an admissible semantics start by itself.

      So if a branch currently begins too late, the repair is not "mention CM in the introduction." The repair is "move the branch start upstream until the CM doctrine has already constrained the admissible hypotheses."

      That is the exact formal meaning of injecting class membership into the start of the branches.


