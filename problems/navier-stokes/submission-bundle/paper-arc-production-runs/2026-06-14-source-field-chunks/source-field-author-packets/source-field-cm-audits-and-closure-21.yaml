      \subsection{Clay problem Finite Low Response Control.A Proof}

      \[
      \sup_{\nu\in J}
      \int_W\|\nabla P_{\le M}\partial_\nu u^\nu(t)\|_{L^\infty}dt
      <\infty
      \]

      \[
      z=\partial_\nu u,
      \qquad
      z_{\le M}:=P_{\le M}z.
      \]

      \[
      L_u z=\Delta u
      \]

      \[
      \partial_t z_{\le M}
      =
      A_M(t)z_{\le M}
      +F_M(t)
      +R_M^{hi}(t),
      \]

      \[
      \|\nabla z_{\le M}\|_{L^\infty}
      \le C_M\|z_{\le M}\|_2.
      \]

      This is exactly why finite-low response control was separated from high response-height creation.

      This is not a high-regularity assumption. It is a finite-dimensional low-mode estimate plus the already installed high-response-height drain. The argument would be circular only if P >M z leakage were estimated by assuming smoothness; here that leakage is charged by Response Height Creation Control.A.


