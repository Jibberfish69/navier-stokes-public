      \subsection{Clay problem Finite-Net Reference-Envelope Discharge}

      Role: corrected common-object discharge surface for the Eulerian reference envelope side of the standalone class-membership branch.

      The moving-net issue is corrected by fixing the finite net on the whole interval I. The fixed-increment packet law can then be applied without introducing extra time-derivative terms for the increments.

      \[
      \Lambda_{\rho,\psi}^{ref}(t)
      :=
      \sup_{\eta\in\mathcal R_{\rho}^{ref}(t;\psi)}
      |\eta|.
      \]

      \[
      \Lambda_{\rho,\psi}^{ref}(I)
      :=
      \sup_{t\in I}\Lambda_{\rho,\psi}^{ref}(t),
      \]

      \[
      \mathbb B_{\rho,\psi}^{ref}(I)
      :=
      \big\{
      \eta\in\mathbf R^3:|\eta|\le \Lambda_{\rho,\psi}^{ref}(I)
      \big\}.
      \]

      \[
      \Xi_{\rho,\psi}^{\varepsilon}(I)
      :=
      \big\{\eta^\ell\big\}_{\ell=1}^{M_\varepsilon}
      \subset \mathbb B_{\rho,\psi}^{ref}(I),
      \]

      \[
      \forall \eta\in \mathbb B_{\rho,\psi}^{ref}(I)
      \quad
      \exists \eta^\ell\in \Xi_{\rho,\psi}^{\varepsilon}(I)
      \text{ such that }
      |\eta-\eta^\ell|\le \varepsilon.
      \]

      It isolates only the corrected finite-net discharge of the Eulerian reference envelope.


