    \subsection{Clay problem Formal Ontic Object Package}

    Role: define the full working ontic package that can actually be carried forward when restarting the Navier--Stokes logic from one single fluid object.

    The role is definitional: fix the object together with the live laws and induced structures that later arguments are allowed to use.

    Fix one theorem surface T 3, R 3 , one lifetime [0,T), one viscosity >0, and one divergence-free initial datum u 0.

    \[
    \boxed{
    \mathfrak O_{\mathrm{NS}}^{\mathrm{work}}
    :=
    (\Omega,[0,T),\nu,u_0,u,p,\Phi;\ F,h,\mathcal T;\ \mathcal L_{\mathrm{NS}}).
    }
    \]

    \[
    u:\Omega\times[0,T)\to\mathbf R^3,
    \qquad
    p:\Omega\times[0,T)\to\mathbf R,
    \]

    \[
    \Phi:\Omega\times[0,T)\to\Omega,
    \qquad
    F:=\nabla_a\Phi,
    \]

    \[
    h(a,r,t):=\Phi(a+r,t)-\Phi(a,t),
    \]

    \[
    \mathcal T
    :=
    \{J_{m,\alpha},\Pi_{m,\alpha}\}_{m,\alpha},
    \qquad
    J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
    \qquad
    \Pi_{m,\alpha}:=\partial_t^m\partial_x^\alpha p.
    \]

    The first block is the realized fluid state. The second block is the canonical induced structure carried explicitly because later proofs actually use it. The third block is the live law-bundle that makes this a genuine one-fluid object rather than a flat tuple of symbols.

    This is the first-order material deformation law. It governs how infinitesimal label displacements are transported by the same fluid.

    This is the exact law for the separation of two material particles. It is not a second deformation object; it is the finite-separation form of the same material geometry.

    So neighboring geometry is carried as true finite separation evolution inside the same fluid, while F is its infinitesimal first-order form.

    So the full derivative tower is carried inside the object as one coupled differential hierarchy of the same field.

    This is the canonical neighboring-response law already carried by the same object. It makes cross-rung and cross-neighbor coupling formal rather than semantic only.

    This identity is part of the carried object because it is the exact rung-level place where viscosity acts as dissipative conduction through the tower, with pressure already absorbed by the incompressible structure.

    A local tower, transported region, collar, segment, or packet is admissible on the current route only if it is induced from O NS work and obeys the same law-bundle on its window.

