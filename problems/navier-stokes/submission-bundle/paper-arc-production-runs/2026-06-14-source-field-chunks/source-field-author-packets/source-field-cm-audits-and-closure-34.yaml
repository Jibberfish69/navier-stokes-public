      \subsection{Clay problem Positive Residual Reserve.A Direct Attempt Note}

      Bounded direct attempt on the first hidden assumption inside Signed Local Source.A.

      This is stronger than the signed commutator estimate. It is not installed by the current exchange algebra.

      \[
      \int_{Bad_N(\eta)}
      \bigl(G_N^{lift,\sigma}\bigr)_+(t)\,dt=o_N(1).
      \]

      A small signed integral does not imply small positive part. The positive mass can concentrate on Bad N( ) and be cancelled by negative mass on other times, other packets, or contracting strain windows.

      Thus the missing reserve is not cosmetic. It is exactly the theorem that would prevent the active selector from choosing expanding-strain source production.

      \[
      \mathcal R_{j,k,\ell}^{lift}
      \sfcomp{44718}
      2^{2j}
      \left\langle
      \mathcal C_j(\nabla a_k,\Delta_j u),\Delta_j u
      \right\rangle.
      \]

      The symmetric part of a k has expanding and contracting directions. An active packet aligned with an expanding eigendirection contributes to the positive part. The one-sided shell weights and cutoff/lifted packet geometry do not impose a sign reversal tied to that eigendirection.

      The unweighted exchange antisymmetry cancels the bare exchange, but Positive Residual Reserve.A concerns the post-weight, post-lift positive part on the bad-window selector. That object is no longer controlled by the bare antisymmetry.

      Positive Residual Reserve.A is not proved from the current signed weighted commutator theorem, energy inequality, pressure projection, or dyadic exchange identity.

      The remaining theorem must either decorrelate active packets from expanding strain directions or provide a positive active- / Carleson replacement.


