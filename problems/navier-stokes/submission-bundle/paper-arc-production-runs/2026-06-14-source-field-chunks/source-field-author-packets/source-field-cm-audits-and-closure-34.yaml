      \subsection{Clay problem Primitive Class Laws Note}

      The primitive surface for the current class-membership contradiction program is route-faithful. It records the primitive class laws for the classical incompressible Navier--Stokes equations while preserving the live selector/defect route.

      \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      \nu>0.
      \]

      \[
      \partial_t\Phi(a,t)=u(\Phi(a,t),t),
      \qquad
      \Phi(a,0)=a.
      \]

      \[
      \det D_a\Phi(a,t)=1
      \]

      The packing law has two lawful readings, and the proof has to keep them distinct.

      The fixed-box reading is Eulerian: keep a spatial control volume in place and use incompressibility as flux balance through its faces. This is the clean local control-volume meaning of "a cube stays a cube." It records that the field is not creating or destroying volume inside the box.

      The material-packet reading is Lagrangian: follow the same fluid labels by t and use D a t only as finite-window coordinate bookkeeping for the same fluid parcel. This is useful for identity and comparison of the same carried packet, but it is not a demand that a tracked blob keep a nice shape for all time.

      So Pack should not be narrated as "the material cube must remain a cube." It should be narrated as the incompressible packing / control-volume law remaining usable in the proof.

      This is the route's exact reading of "kept in motion." It does not mean every point has large speed. It means the point has not dropped out of the same pressure-viscosity carrier that is acting on the surrounding field.

      Equivalently, there is one common smooth velocity/pressure field whose local towers are compatible from point to point.

      The source class-membership claim names dead / jump / runaway as visible non-smooth examples and explicitly leaves room for "any other genuinely non-smooth situation." The three visible labels are examples, not a closed primitive ontology.

      \[
      u(x,t)=0
      \not\Rightarrow
      \text{dead endpoint.}
      \]

