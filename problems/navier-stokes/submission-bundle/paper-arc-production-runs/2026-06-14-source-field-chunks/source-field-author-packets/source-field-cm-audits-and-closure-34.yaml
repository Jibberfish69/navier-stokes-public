    text: |+
      \subsection{Clay problem Positive Rotation Detects Full Adjoint Mass.A Note}

      This is not a sign-preservation theorem. It is a terminal packet-frame detection theorem: positive response-rotation mass must have nonzero projection onto the normalized terminal traces of the full-linearized response adjoint frame.

      \[
      L_u z
      =
      \partial_t z+\mathbb P(u\cdot\nabla z+z\cdot\nabla u)-\nu\Delta z
      \]

      \[
      L_u^*\Psi_{T,a}^{full}=0
      \]

      \[
      \chi_{T,a}^{full}
      :=
      (g_{T}^{full})^{-1}\Psi_{T,a}^{full}.
      \]

      \[
      \Lambda_T(z)
      :=
      2\int_{Q_T}
      \left\langle S_{<j}^{loc}u_j,z_j^\perp\right\rangle
      \,\omega_T\,dxdt,
      \]

      \[
      [\Lambda_T(z)]_+\ge \eta,
      \]

      Combining and absorbing constants yields the claimed -mass lower bound. The full-linearized evolution is not used to preserve sign; it is used only to define the legal adjoint packet traces. The no-free-create identity and ordinary dissipation payment are separate steps in the full-linearized response route.


