    \subsection{Clay problem Principal-Flow Adjoint Parent-Or-Charge Note}

    The refinement of Lemma B's no-free-creation sublemma is the treatment of positive strain alignment. Positive strain alignment belongs to the principal linear packet flow. In that form it can amplify inherited packet mass, but it cannot create packet mass from zero. Any genuinely new positive source mass must enter through residual terms, and those residual terms must be charged to dissipation.

    \[
    S_k=\frac12(\nabla u_k+\nabla u_k^T),
    \]

    and R j,k contains commutators, pressure errors, cutoffs, and off-packet interactions.

    \[
    L_{j,k}u_j
    :=
    (\partial_t+b_k\cdot\nabla-\nu\Delta-A_k)u_j
    =
    R_{j,k}.
    \]

    Here b k=u k and A k is the symmetric strain-production matrix with the sign convention chosen so that -A ku j equals the retained principal strain term. Equivalently one may take A k=-S k in the model display above.

    This is the decisive bookkeeping move. Positive strain alignment is no longer an external source term; it is part of the packet propagator.

    \[
    L_{j,k}^*\psi_T
    =
    -\partial_t\psi_T-b_k\cdot\nabla\psi_T-\nu\Delta\psi_T-A_k^*\psi_T
    =0
    \]

    \[
    \frac{d}{dt}\langle u_j,\psi_T\rangle
    =
    \langle R_{j,k},\psi_T\rangle.
    \]

    Thus the principal positive strain disappears from the forcing identity. It only changes the backward propagation and normalization of T.

