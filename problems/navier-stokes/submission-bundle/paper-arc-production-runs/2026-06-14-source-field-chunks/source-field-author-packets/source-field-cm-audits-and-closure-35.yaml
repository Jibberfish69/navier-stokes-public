      \subsection{Qdrain Source No Pulse Closure Note}

      \[
      Y(t)=\|\nabla u(t)\|_2^2,
      \qquad
      Z(t)=\|\Delta u(t)\|_2^2.
      \]

      \[
      \frac12Y'(t)+\nu Z(t)
      =
      -\int_{\mathbb T^3}
      \partial_k u_i\,\partial_i u_j\,\partial_k u_j\,dx.
      \]

      The cubic term is the strain/vortex-stretching production. It has no installed sign. A one-sided drain theorem would need

      \[
      -\int
      \partial_k u_i\,\partial_i u_j\,\partial_k u_j
      \le
      (1-\delta)\nu Z(t)+L(t)Q(t),
      \qquad L\in L^1(0,T_\ast).
      \]

      The identity alone does not prove it: the cubic can be positive on expanding strain configurations.

      \[
      \left|\int
      \partial_k u_i\,\partial_i u_j\,\partial_k u_j
      \right|
      \le
      C\|\nabla u\|_2^{3/2}\|\Delta u\|_2^{3/2}
      \le
      \frac{\nu}{2}Z(t)+C_\nu Y(t)^3.
      \]

      \[
      Y'(t)\le C_\nu Y(t)^3.
      \]

      The first presentation is narrower but stronger; the second preserves the installed class-membership route without importing a global continuation norm as the upstream supplier.


