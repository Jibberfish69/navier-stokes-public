    \chi_T^{resp}:=g_T^{-1}\psi_T^{resp},
    \]

    where g T is the same strain/response gain normalization used by the source-drain packet calculus.

    The response parent-or-charge theorem should be stated for M resp(T), not for a raw positive signed source integral.

    \[
    \left[
    2\int\langle S_{<j}^{loc}u_j,z_j^\perp\rangle
    \right]_+
    \ge \eta,
    \]

    This is a packet testing/detection theorem. It is lower than raw sign control: it only asks the terminal positive rotation functional to have nonzero projection onto the packet frame.

    \[
    L_T^{resp} z_j^\perp = R_T^{resp},
    \]

    where L T resp is the projected affine heat/transport operator on the same-fluid response tile and R T resp contains nonlinear response source, pressure, cutoff, and off-tile residuals.

    If Positive Rotation Detects Adjoint Mass.A supplies M resp(T 0) c 0>0 and the response charge is absorbable, the first response pulse is impossible.

    That is better. It asks for packet-frame detection of a positive terminal functional, not sign preservation through a vector heat/Leray kernel.

    But Response Kernel Sign Control.A is no longer the right primitive. The response drain should proceed through squared adjoint mass.



    \subsection{Clay problem Response Flux Derivative Control.A Direct Attempt}

    \[
    \int_W\sup_{k>N}
    2^k\sum_{\ell>k+4}
    1_{\{R_\ell(t)>0\}}[\partial_\nu N_\ell(t)]_+\,dt
    \le
    LegalResponseCharge_N(W)+o_N(1).
    \]

    \[
    R_\ell(t):=\partial_\nu E_\ell(t)
    =2\langle u_\ell(t),z_\ell(t)\rangle,
    \qquad
    z=\partial_\nu u,
    \]

    \[
    N_\ell(u)
    =
    -\langle P_\ell\mathbb P(u\cdot\nabla u),u_\ell\rangle
    \]

    The response-positive restriction is essential. The signed shell response identity only asks for partial nu N l where viscosity is trying to increase the shell energy.

    \[
    N_j^{lh}
    \sfcomp{47473}
    \int \langle S_{<j}^{loc}u_j,u_j\rangle\,dx,
    \]

    \[
    S_{<j}^{loc}
    :=
    \frac12(\nabla u_{<j}+\nabla u_{<j}^{T})
    \]

    This is the first actual gain of the viscosity-homotopy route: the component of z j that tries to increase shell energy is damped at parabolic rate and cannot feed the source unless the low strain reaches the same parabolic rate.

    Interpretation: if the low/intermediate strain is strong enough to beat the viscous response damping at shell ell, then the event itself must be charged as an active strain burst. Otherwise the aligned response part is absorbed.

    This asks for the viscosity response of the low strain to be legal when tested against the active high-shell density.

    That estimate is not enough unless ZS <j loc has a response Carleson or finite-dimensional low-mode control on the same active windows. Otherwise it is just the old coefficient-multiplier problem with z replacing u.

    The response damping controls the component of z parallel to u . It does not control rotation of the active shell direction. A positive orthogonal response can rotate the shell toward an expanding strain eigendirection while leaving the shell energy derivative positive but not large enough to absorb the strain term by scalar damping alone.

    This is still progress over the old source wall because the aligned energy-increasing response component is no longer part of the obstruction. It is paid by positive viscosity itself whenever the low strain is below parabolic rate.

    Reason: it attacks the only place where the aligned response absorption fails. If parabolic-rate strain bursts are legal or impossible on the terminal Field-face packet, then the new viscosity-homotopy route removes the largest piece of the old native positive source wall.

    So the parabolic-burst branch is no longer an independent primitive; it is folded into First Height Creation Dichotomy.A.

    So the live response-flux burden is no longer low-response strain or orthogonal response rotation. It is the native first-height/height-flux dichotomy reached through the parabolic-rate strain burst branch.



    \subsection{Clay problem Response Height Creation Control.A Proof Run}

    \[
    H_k^z(t):=2^k\sum_{j>k+4}D_j^z(t).
    \]

    \[
    \left[
    H_N^z(W)-H_N^z(Past(W))-Loss_N^z(W)
    \right]_+
    \le
    ResponseCharge_N(W)+o_N(1).
    \]

    \[
    \partial_t z+\mathbb P(u\cdot\nabla z+z\cdot\nabla u)
    =
    \nu\Delta z+\Delta u.
    \]

    \[
    \frac12\frac{d}{dt}E_j^z
    +c\nu2^{2j}E_j^z
    \le
    M_j^{uz}
    +M_j^{zu}
    +|\langle P_j\Delta u,Z_j\rangle|
    +L_j^z,
    \]

    \[
    M_j^{uz}
    :=
    |\langle P_j\mathbb P(u\cdot\nabla z),Z_j\rangle|,
    \qquad
    M_j^{zu}
    :=
    |\langle P_j\mathbb P(z\cdot\nabla u),Z_j\rangle|.
    \]

    Low Response Strain Charge.A is reduced to finite response-norm / response height control. Response Strain Decorrel.A is the response analogue of ASAC: active z j packets cannot stay positively aligned with low strain unless they pay response-height charge or terminal no-incoming rigidity.

    This shows that response-height creation is not a free new wall. Its linear forcing comes directly from original high-shell dissipation, and its nonlinear part is a response-copy of the active strain/decorrelation problem.

    The new idea has narrowed the problem, but unconditional closure still requires a structural decorrelation/rigidity theorem.

    Thus Original Height Dissipation Charge.A is superseded for this response-side branch.



    \subsection{Clay problem Response Height record Supports Discharge}

    \[
    \partial_\nu D_j
    =
    2\langle\nabla u_j,\nabla z_j\rangle
    \ge
    c2^{2j}R_j-Err_j^{width}
    \]

    \[
    R_j=2\langle u_j,z_j\rangle>0.
    \]

    \[
    \langle\nabla u_j,\nabla z_j\rangle
    =
    2^{2j}\langle u_j,z_j\rangle
    =
    2^{2j}R_j/2.
    \]

    \[
    2\langle\nabla u_j,\nabla z_j\rangle
    =
    2^{2j}R_j
    +2\langle \rho_j(D)u_j,z_j\rangle.
    \]

    On R j>0, choose the heat-matched packet width so width 0 and legal width error.

    \[
    \boxed{
    BoundaryResp_N(W)\le LegalBoundary_N(W)+o_N(1).
    }
    \]

    At the upper endpoint b, the positive boundary term is the selected first height itself. Moving it to the left side is exactly the first-height selection identity used in First Height Selection.A. Any discrepancy caused by smooth maximum regularization, finite-depth truncation, or packet refinement is o N(1) plus the already declared legal boundary loss.

    so the boundary response term is not an independent theorem burden. It is a bookkeeping consequence of first-height window selection.

    The no-fold route now has no response-specific support atoms left. Its live mathematical wall is the native first-height/height-flux or terminal rigidity-residue branch.



    \subsection{Clay problem Response No Incoming Flux Direct Attempt}

    \[
    \boxed{
    NoIncomingFlux_{global,resp}.A.
    }
    \]

    It should rule out incoming original and orthogonal-response mass through the ancient parabolic boundary of the transformed coupled anisotropic system.

    \[
    P_j\mathbb P(u\cdot\nabla z+z\cdot\nabla u).
    \]

    Choose T 0 minimal in the same-fluid response ancestry order among tiles carrying nonzero normalized terminal orthogonal response-rotation mass. If an earlier parent P with positive response source mass existed, T 0 would not be minimal. Thus every normalized parent contribution vanishes in the first-pulse limit. This is the same minimality proof as the installed No Incoming License src.A, with the source relation replaced by the response Duhamel ancestry relation.

    \[
    \partial_s V+\nabla q_v
    =
    \nu\nabla\cdot(A\nabla V),
    \]

    \[
    \partial_s W+\nabla q_w
    =
    \nu\nabla\cdot(A\nabla W)
    +\nabla\cdot(A\nabla V)
    -\mathcal B_\Sigma[V].
    \]

    The same obstruction as the single-field route remains: under mixed-sign trace-free strain, transported cylinders can receive mass from spatial infinity along contracting channels. First-pulse minimality blocks selected same-fluid response parents, not arbitrary incoming kinetic or response energy.

    \[
    \lim_{s\to-\infty}
    \int_{\mathbb R^3}
    \bigl(|V(z,s)|^2+|W^\perp(z,s)|^2\bigr)
    \Omega_S(z,s)\,dz
    =0.
