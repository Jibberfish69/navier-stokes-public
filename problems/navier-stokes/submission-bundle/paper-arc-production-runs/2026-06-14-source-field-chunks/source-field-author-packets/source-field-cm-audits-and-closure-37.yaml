      To imply Terminal Time Face Anti Atom.A, the estimate would need a lower bound independent of the terminal scale, or a compensating decay of source mass with scale. The latter is exactly a parent-charge quantum or active- reserve theorem.

      Residence Lower Bound.A fails from the installed packet and ancestry data. Same-fluid ancestry gives lineage and scale-local residence. It supplies no terminal time-slab modulus.


