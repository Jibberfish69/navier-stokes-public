      The error is the same projection/cutoff error used in the terminal lower-frame packet record.

      All detection inputs are now installed as response-packet geometry and terminal-slice selection.

      This does not prove any global ancient no-incoming theorem. It only handles the local tether required to detect a positive response-rotation tile by terminal full-adjoint mass. That is exactly the tether needed by the full-coefficient response drain.


