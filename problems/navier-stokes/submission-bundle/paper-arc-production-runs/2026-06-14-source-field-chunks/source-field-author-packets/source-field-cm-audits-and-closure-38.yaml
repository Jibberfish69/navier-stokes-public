      \omega_T(x,t)\,dxdt.
      \]

      \[
      [\Lambda_T(Z)]_+\ge \eta.
      \]

      \[
      \lambda_T(t)
      :=
      2\int_{Q_T(t)}
      \langle S_{<j}^{loc}u_j(x,t),Z_j^\perp(x,t)\rangle
      \omega_T(x,t)\,dx.
      \]

      \[
      \Lambda_T(Z)=\int_{I_T}\lambda_T(t)dt.
      \]

      \[
      \left[
      \lambda_{T_+}(t_+)
