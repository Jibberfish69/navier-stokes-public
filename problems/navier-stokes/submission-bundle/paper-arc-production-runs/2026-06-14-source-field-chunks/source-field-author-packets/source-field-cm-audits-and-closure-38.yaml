    \exists\mathcal C(P)\subset\mathsf{Pred}(P),
    \qquad
    |\mathcal C(P)|\le B,
    \qquad
    \pi_P(\mathcal C(P))\ge c\,\pi_P(\mathsf{Pred}(P)),
    \]

    \[
    \pi_P\sfcomp{48254} \frac{1}{M}\sum_{\alpha=1}^M\delta_{P^-_\alpha},
    \qquad
    M\to\infty.
    \]

    Then every bounded subfamily carries mass at most \(C_{\mathrm{sf},48259}B/M\). Thus finite dyadic banding does not prove reverse-Holder concentration.

    \[
    \sum_{\alpha=1}^M\|a_\alpha\|_2^2\sfcomp{48262} M^{-1},
    \]

    \[
    \sum_{\alpha}
    \|\text{normalized donor edge}_\alpha\|^2
    \le C_{\mathrm{sf},48257}
    \mathcal R_{\mathrm{sc}},
    \]

    Same-fluid transport preserves labels after a parent is chosen. It does not reduce the number of legal parents, force a lower bound on one predecessor, or price entropy of the positive parent measure. Carrier fidelity is not an inverse theorem.


