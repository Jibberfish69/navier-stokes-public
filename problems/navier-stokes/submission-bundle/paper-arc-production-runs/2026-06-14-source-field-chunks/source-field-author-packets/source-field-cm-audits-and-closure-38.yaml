      \subsection{Clay problem Response Parent OrCharge Direct Attempt}

      At a first response pulse, the parent sum vanishes, giving response source drain.

      \[
      \mathcal R_j^{rot}(t)
      =
      -\int_{-\infty}^t e^{\nu(t-s)\Delta}P_j\mathbb P
      (u\cdot\nabla z+z\cdot\nabla u)(s)\,ds.
      \]

      \[
      \Psi_T(s)
      =
      e^{\nu(t_T-s)\Delta}P_{j_T}\mathbb P^\ast \psi_T.
      \]

      provided the adjoint kernel is positive/flattened enough that bad sign changes and off-tree pieces are legal.

      \[
      \int |u\cdot\nabla z+z\cdot\nabla u|\,|\Psi_T|.
      \]

      so the parent-or-charge theorem is not closed by heat-kernel positivity alone. It needs a signed/positive adjoint tree structure for the response source.

      After normalizing S resp(T 0)=1, choosing theta below the response absorption margin, and sending legal errors to zero, this contradicts a nonzero terminal response pulse.

      This is the response analogue of the principal-flow adjoint drain route. The remaining primitive is not global backward uniqueness; it is signed response adjoint parent-or-charge.


