      \subsection{Clay problem Shared Packing Exact Predicate Draft}

      The first primitive class law formalized here is the shared packing law. The shared participation law and shared one-field law still have to be formalized separately.

      The route burden is to turn each primitive class law into an exact analytic predicate without replacing the route by a generic substitute.

      \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      \nu>0.
      \]

      \[
      \partial_t\Phi(a,t)=u(\Phi(a,t),t),
      \qquad
      \Phi(a,0)=a.
      \]

      \[
      F(a,t):=D_a\Phi(a,t).
      \]

      \[
      \Gamma_{\mathrm{pack}}(t):=
      \max\Big\{
      \|F(t)\|_{L^\infty_a},
      \|F(t)^{-1}\|_{L^\infty_a}
      \Big\}.
      \]

      \[
      \det D_a\Phi(a,t)=1
         \quad\text{for all }a\in\Omega;
      \]

      This is not a new closure theorem. It is the exact analytic restatement of what the shared packing law means on this route.

      This predicate is a good first formalization step because it stays close to the live terminal record.

      It uses the common motion map directly. It uses incompressibility directly through D =1. It names collapse/blowout as failure of the deformation class itself. It does not require a generic witness bundle. It does not yet collapse the route into the classical continuation wall.

      It also does not prove that every candidate singularity must first fail the packing predicate rather than the participation or one-field predicate.


