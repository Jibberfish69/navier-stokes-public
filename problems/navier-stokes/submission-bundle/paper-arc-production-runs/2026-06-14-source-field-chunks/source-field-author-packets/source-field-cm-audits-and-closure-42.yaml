      \subsection{Clay problem Source Parent.Measure Formal Definition Note}

      This is the formal version of the old tower-transfer intuition: a child active pulse cannot blow up for free. It must either spend a finite reserve or have a lawful same-fluid parent packet that fed it.

      \[
      P=(Q_P^\Phi,j_P,I_P,\mu_P^{src},\mu_P^{mix},\gamma_P,\mathfrak F_P),
      \]

      Q P is a same-fluid heat-scale cylinder; j P is the active shell, with r P 2 -j P ; I P is a time interval with |I P| r P 2; P src is the localized active nonlinear source-residue measure; P mix is the localized mixed bilinear / active- measure; P is the inherited bad active coefficient; F P is the same-fluid label family and endpoint fibre.

      \[
      \mu_P^{src,+}(P)
      \not\le
      Charge_P+Reserve_P+o(1).
      \]

      \[
      \mathsf{Pred}(P),
      \]

      \[
      I_{P^-}\subset[t_P-Cr_P^2,t_P-c r_P^2],
      \]

      \[
      j_{P^-}\in[j_P-M,j_P+M]
      \quad\text{or in an explicitly licensed lower-feed band};
      \]

      Source Parent.Measure is the theorem asserting that every source-balanced localized bad pulse P admits such a measure satisfying the following axioms.

      Edges violating any of these are illegal carrier changes and cannot be used in the ancestry chain.

      This prevents the parent relation from splitting a child pulse into infinitely many negligible ancestors with no comparable predecessor.

      Thus a source-balanced child has either a legal parent or pays a finite reserve.

      This is the precise theorem-facing replacement for the informal claim that one tower must drain so another can blow up.


