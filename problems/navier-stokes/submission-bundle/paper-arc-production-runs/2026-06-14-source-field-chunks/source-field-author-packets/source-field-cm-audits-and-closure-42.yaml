      Here P is the same-fluid cutoff and the factors are the active dyadic or packet components feeding the child shell.

      The key point is that this object is spatially local. It still knows the child cylinder and same-fluid label family.

      \[
      \mathcal N
      =
      \sum_{\alpha\in\mathcal A(P)}
      \mathcal N_\alpha(P^-\to P).
