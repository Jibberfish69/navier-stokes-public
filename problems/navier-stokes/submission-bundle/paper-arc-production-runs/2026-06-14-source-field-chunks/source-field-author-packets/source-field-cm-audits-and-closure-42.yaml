      provided the source packet is the localized pre-Cauchy source, not the global post-Cauchy mixed-shell product.

      The edge rule also preserves same-fluid fidelity: only predecessor packets
      inside the licensed same-fluid predecessor region \(\operatorname{Pred}(P)\) are
      legal edges.
