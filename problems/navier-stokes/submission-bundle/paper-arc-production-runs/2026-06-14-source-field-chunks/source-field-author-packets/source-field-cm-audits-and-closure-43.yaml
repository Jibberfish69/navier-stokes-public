    Part_{N,Q_n}(u,p).
    \]

    The source-pulse packets are route-local terminal active windows. Their spatial label footprints are bounded finite-overlap packet footprints on each I n. Write the label footprint as A n, so

    \[
    (Q_n^\Phi)_t=\Phi_t(A_n)
    \qquad (t\in I_n).
    \]

    For each endpoint-depth transported-center parameter required by DTC-to-Tower Bound, let R p TC >0 denote the transported-center radius on the corresponding source-pulse scale.

    \[
    (Q_n^\Phi)_t
    \subset
    \bigcup_{\ell=1}^{J_{n,\mathfrak p}}
    B(c_\ell(t),R_{\mathfrak p}^{TC}/2),
    \qquad
    c_\ell(t)=\Phi_t(a_\ell),
    \qquad
    a_\ell\in A_n,
    \]

    \[
    \Gamma_{\mathrm{pack},Q_n}
    :=
    \sup_{a\in A_n,\ t\in I_n}
    \max\{|F(a,t)|,\ |F(a,t)^{-1}|\}
    <\infty.
    \]

    Bounded overlap follows by applying a standard finite Vitali subcover or bounded-multiplicity lattice thinning on the label net and pushing it forward by the bi-Lipschitz map t; the multiplicity changes by a constant depending only on the pack distortion and dimension. Incompressibility preserves packet volume, so no extra density loss is introduced.



    \subsection{Clay problem Source PulseDTCCover.A Extraction Theorem}

    Theorem-facing discharge of the source-side geometric half of Source PulseDTCPlacement.A.

    The target is geometric and selection-facing. It asks only for the finite same-family cover. It does not include Morrey, pressure, viscous, center forcing, affine-excess, or residual forcing estimates.

    \[
    \mathcal P_n=(Q_n^\Phi,j_n,I_n)
    \]

    \[
    Pack_{Q_n}(u,\Phi).
    \]

    \[
    Q_{n,t}
    \subset
    \bigcup_{\mathfrak p\in\mathcal P_n}
    B(c_{\mathfrak p}(t),R_{\mathfrak p,n})
    \qquad (t\in I_n)
    \]

    P n finite for each n; bounded overlap depending only on dimension and the local pack gauge on Q n; centers transported by the same flow map ; radii chosen at the DTC heat/packet scale required for the terminal active shell j n; all cover elements belonging to the same source-pulse family, not to a downstream readout cover.

    \[
    \Gamma_{\mathrm{pack},Q_n}(t)<\infty
    \qquad (t\in I_n).
    \]

    \[
    c_{\mathfrak p}(t)=\Phi_t(a_{\mathfrak p}).
    \]

    Because Pack gives finite distortion of the transported carrier on Q n, the transported balls with a fixed dimensional enlargement still cover Q n,t for every t I n, while a fixed shrink supplies the interior balls consumed by the DTC readout. The overlap constant is multiplied only by the local distortion constant and the dimension. Since the initial subcover is finite, the transported family remains finite for the whole interval.

    so the only unproved input is the analytic transported-center packet on each extracted cover element.



    \subsection{Clay problem Source Pulse Tower-Readout Closure}

    Theorem-facing closure note for the mixed tower residue left by the Source PulseCMExit.A tower-residue audit.

    Let P * be a terminal source-pulse packet used as a genuine non-smooth occurrence on an approaching same-fluid family Q *.

    \[
    U_k=\nabla^k u,
    \qquad
    K_k=-\nabla^{k+1}p+\nu\Delta U_k.
    \]

    Pack Q supplies a finite same-family transported-center cover of the terminal source-pulse family.

    The pack predicate says that the restricted flow map is one incompressible C 1 diffeomorphic same-fluid motion with finite distortion gauge on the approaching family. Work in label space. The label support of a retained source-pulse packet is compact after the standard finite packet localization. Choose finitely many label balls of radius comparable to the retained field scale divided by the pack distortion bound. Transporting them by t gives balls

    \[
    B(c_a(t),R_a)
    \]

    Assume Field C N+2,r,Q holds on a fixed cover ball and u(t) L 2 is bounded by the energy inequality. Then

    \[
    \sup_{B(c_a(t),r/4)}
    \sum_{k=0}^{N+2}|U_k(\cdot,t)|
    <\infty
    \]

    The finite-difference field predicate gives a uniform fixed-scale modulus for each tower component U k, 0<=k<=N+2, and the compatibility relations U k= k u on the same field.

    For k=0, the U 0 modulus and the energy bound anchor the absolute value of u: if |u(x 0,t)|=M, then u remains comparable to M on a fixed subball unless M is already bounded by the modulus-scale product, and the energy inequality forbids arbitrarily large M.

    For k>=1, argue by descending polynomial anchoring. If U k were arbitrarily large at a point while the Field C N+2,r,Q modulus stayed bounded, then U k would remain large on a fixed-scale subball. Integrating the compatible tower relations downward along line segments in that subball forces a polynomial-sized variation in U k-1 , then in U k-2 , and after k steps in u itself. The already anchored lower rung and ultimately the energy bound rule this out. This uses only the finite-difference moduli for the rungs already present in Field C N+2,r,Q ; it does not require a new N+3 u input.

    Thus every finite tower amplitude U k, 0<=k<=N+2, is bounded on the inner cover balls. This is the standard finite-order polynomial/Poincare anchoring argument: a positive coherence scale plus compatibility prevents a high derivative from appearing as a pure unanchored constant mode.

    \[
    \sup_{B(c_a(t),r/4)}
    \sum_{k=0}^{N}|K_k(\cdot,t)|
    <\infty
    \]

    The participation predicate is exactly the shared pressure-viscosity carrier law through finite depth, together with finite carrier envelope. If that envelope escapes every finite bound on the approaching family, the branch has a Part failure and Source PulseCMExit.A is already closed. On the retained branch, no such failure occurs, so the finite K k envelope is bounded on the cover elements through the required depth.

    \[
    K_k=-\nabla^{k+1}p+\nu\Delta U_k,
    \]

    By Lemma 1, Pack Q supplies a finite same-family transported-center cover. By Lemma 2, retained Field C N+2,r,Q plus finite energy gives the finite U k tower amplitude on each cover element. By Lemma 3, retained Part N+2,Q gives the finite K k carrier amplitude on the same cover.

    That statement remains a stronger sufficient theorem and is nonblocking for the class-membership route.



