      |I_n|\sfcomp{51287} 2^{-2j_n},
      \qquad
      t_n\uparrow T_\ast,
      \]

      \[
      \int_{I_n}
      \mathfrak S_{j_n,loc}^{active}(t)\,dt
      \longrightarrow0,
      \]

      \[
      \liminf_{n\to\infty}
      \int_{I_n}
