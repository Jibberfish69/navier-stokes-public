      It does not impose a sign on the active nonlinear source, nor does it control the positive part of the shellwise source on heat-scale bad windows.

      Pressure Poisson recovery gives elliptic estimates and local pressure packets, but it does not change the sign of vortex stretching or of the weighted lifted source remainder.

      Unweighted dyadic exchange cancels only before the active weights, cutoffs, and same-fluid localization are inserted. The live active source is the weighted one-sided packet, and the installed commutator material does not prove its positive part is depleted.

      Vorticity-direction, Beltrami/helical, and pressure-vortex depletion are possible languages for this slot, but the corresponding audits show that none is derived from Original Smooth Data on the terminal bad windows.


