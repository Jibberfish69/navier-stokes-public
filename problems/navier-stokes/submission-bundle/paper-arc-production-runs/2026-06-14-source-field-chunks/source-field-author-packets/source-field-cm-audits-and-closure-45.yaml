      \subsection{Clay problem Source Pulse Two-Tower Zeno Refinement}

      Source Pulse Exclusion.A remains open. The result here removes the remaining coarse donor-depletion wording from the live attack and leaves one real terminal branch for the two-tower route: Zeno source-refill.

      The first says that a donor tower feeds a child only by donor drain, legal loss, or refill from its own parents. The second says that any refill branch reaching a fixed preterminal entrance surface has vanishing high-frequency leaf energy as the terminal threshold goes to infinity.

      Let T N(P 0) be a legal source-refill tree rooted at a terminal source-pulse child packet. If every infinite branch of T N(P 0) has parabolic time length

      \[
      \sum_m r_m^2=\infty,
      \]

      Apply Local Donor Balance.A to a finite truncation. Interior refill terms telescope, leaving boundary leaf energy plus legal losses. On a non-Zeno branch the backward heat-time sum reaches a fixed preterminal entrance surface. Entrance Leaf Decay.A makes the boundary leaf energy o N(1). The legal losses are already summable in the source-parent packet. The right side is so o N(1) plus legal loss, while the source-pulse child requires a fixed normalized lower mass. For terminal threshold N large enough, this is a contradiction.

      \[
      \cdots -> P^{-2} -> P^{-1} -> P^0
      \]

      \[
      \sum_m r_m^2<\infty,
      \]

      If Local Positive Source Carleson.A holds, the selected Zeno branch is a bounded-overlap same-fluid terminal family, and its inherited positive pre-Cauchy source mass is bounded by o N(1) plus legal losses. This contradicts the source-pulse lower bound.

      If Zeno Bounded Class B.A+Zeno Residue Liouville B.A holds, compactness places the same Zeno branch in the named rigid class B, and the Liouville theorem forces the inherited source residue to vanish. This also contradicts the source-pulse lower bound.

      Thus either package rules out the only branch left by donor-balance telescoping, proving Source Pulse Exclusion.A.

