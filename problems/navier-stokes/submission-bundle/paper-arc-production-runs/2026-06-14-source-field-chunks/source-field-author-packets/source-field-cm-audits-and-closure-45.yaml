      \subsection{Clay problem Source Pulse Viscous-Duhamel No-Pulse Audit Note}

      The viscous-Duhamel audit asks whether heat-scale damping or the Stokes semigroup already forbids terminal source-balanced active pulses.

      \[
      \frac{d}{dt}E_j(t)+c\nu 2^{2j}E_j(t)\le F_j(t),
      \]

      \[
      E_j(t)
      \le
      e^{-c\nu2^{2j}(t-s)}E_j(s)
      +
      \int_s^t e^{-c\nu2^{2j}(t-\tau)}F_j(\tau)\,d\tau.
      \]

      Thus viscosity kills inherited shell energy on heat-scale intervals unless the nonlinear source refills the shell.

      \[
      \text{old shell energy damped by }e^{-c\nu2^{2j}(t-s)}
      \]

      \[
      \text{new shell energy supplied by }F_j.
      \]

      For Navier-Stokes, F j is not an arbitrary external force; it is the nonlinear cascade/readout source. But the current route has not installed a theorem showing that this nonlinear source obeys a Carleson, -source, sign, or monotone-dominance bound on the terminal bad windows.


