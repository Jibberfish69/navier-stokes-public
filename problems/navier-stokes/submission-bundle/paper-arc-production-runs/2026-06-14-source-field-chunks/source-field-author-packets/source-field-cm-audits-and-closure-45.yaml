      Source Pulse Exclusion.A remains unproved. The exact single survivor after the three terminal slots is recorded here.

      The normal-form audit proves that if Source Pulse Exclusion.A fails, the failed sequence may be selected as a terminal same-fluid active packet whose native positive active source mass is not paid by any installed energy, scheduler, pressure/cutoff, signed-reserve, local-energy, compactness, or same-fluid transport record.

      \[
      \mu_{\ast}^{src,+}
      =
      f\,\rho_{\ast}^{inst}
      +
      \mu_{\ast}^{sing},
      \qquad
      \mu_{\ast}^{sing}\perp\rho_{\ast}^{inst}.
      \]

      Here inst is the terminal limit of the sum of installed nonnegative route records, and sing is the native positive active source component singular to those records.

      The installed route does not supply this. Energy and local energy do not impose a sign on the active nonlinear source; pressure recovery does not deplete the positive part; dyadic cancellation occurs before active weights, cutoffs, and positive-part selection; and coherence/alignment variants remain uninstalled.

      Equivalently this is Native SourceAC.A. The installed route does not supply it: the normal-form packet may be selected precisely after every currently installed finite reserve has been spent, absorbed as legal loss, or shown irrelevant to the native positive active source carrier.

      \[
      \boxed{
      \mu_{\ast}^{sing}.
      }
      \]

      Remove kills the whole native positive source measure. Charge proves that no component singular to installed records exists. Rigidify allows a singular component to exist long enough to localize it, then forbids the corresponding source-residue limit.

      That direct attempt finds no installed discharge from incompressibility, energy/enstrophy, Calderon-Zygmund pressure/strain bounds, signed commutator compensation, pressure projection, finite-band orthogonality, same-fluid transport, or compact preterminal smoothness.

