      \subsection{Clay problem Two-Tower Donor Balance Modulo Refill Note}

      The local algebraic part of the two-tower idea is the donor balance. A donor tower cannot feed a child tower for free: the feed is paid either by donor energy drop, by licensed error, or by a refill source feeding the donor. The remaining open theorem is the exclusion of an infinite source-refill ancestry tree, not the local balance identity itself.

      Let P - be a legal same-fluid donor packet feeding a child pulse P. On the localized donor shell/window write the shell energy balance in the form

      \[
      \frac{d}{dt}E(P^-;t)+\nu D(P^-;t)
      =
      \mathsf{In}(P^-;t)-\mathsf{Out}(P^-;t)+\mathsf{Err}(P^-;t),
      \]

      \[
      \mathsf{Out}^+(P^-;t)
      \]

      \[
      \mathsf{In}^+(P^-;t)
      \]

      \[
      \mathsf{Out}^+(P^-;t)
      \le
      -\frac{d}{dt}E(P^-;t)
      +\mathsf{In}^+(P^-;t)
      +|\mathsf{Err}(P^-;t)|.
      \]

      \[
      \int_{I(P^-)}\mathsf{Out}^+(P^-;t)\,dt
      \le
      E(P^-;t_-)-E(P^-;t_+)
      +\int_{I(P^-)}\mathsf{In}^+(P^-;t)\,dt
      +\int_{I(P^-)}|\mathsf{Err}(P^-;t)|\,dt .
      \]

      The interior refill terms cancel by parent-child matching. Bounded overlap of the localized packets absorbs Boundary overlap into the same legal-loss record whenever the tree is finite and scheduler-compatible.

      Refill Tree Well Founded.A, the drain package, or the compact-Liouville package is proved from Original Smooth Data.


