      \subsection{Viscosity-Class Boundary: Current Reader Use}

      The old viscosity-class program is not a proof branch in this manuscript. The reader-facing use is the clean special case: a selected terminal packet keeps the inviscid flux-volume and weak momentum-pressure readings, while the fixed-positive-viscosity participation or one-field requirement fails.

