      \subsection{Clay problem Positive Obstruction Pass/Exit CM Engine}

      Let O be an obstruction produced by the ordinary positive Navier-Stokes proof program: a source-control wall, a packet-carrier wall, a participation tower wall, a coherence/readout wall, or any later same-solution obstruction.

      Equivalently, the CM route does not need to know which particular positive estimate ultimately supplies the pass-side control. It does need the fail side to do real work: the failure branch must enter the CM terminal test and its first Part/Field face failure must be derived. "Capable of nonsmoothness" is a trigger for that test, not the proof of Exit(Q).

      That is a positive-program burden. It may be useful support, but it is not the governing CM contrapositive engine.

      The CM statement is sharper: terminal exit is the lawful classification of the failure branch. Once the branch is classified as exit, it is no longer a legal in-class Clay continuation branch. The in-class branch is the pass branch.

      If a surface skips the fail-branch CM landing and demands direct control of the positive obstruction, it has drifted out of the CM proof engine.

      If a surface skips the fail-branch CM landing and simply says "bad enough to be nonsmooth, so Exit(Q)", it has also drifted. The Part/Field face is the mechanism that earns the exit conclusion.

      That is the correct branch law. The remaining Clay-level burden is not to control one favorite positive estimate. It is also not the theorem-sized slogan Original Smooth Data => not GenuineCMExit(T *) inserted as a local lemma.

      The noncircular continuation of this engine is obstruction-by-obstruction: prove CM-test entry, derive the first Part/Field face failure on the fail branch, and keep the pass branch as the only in-class continuation branch. That is the route that preserves Thomas's pass/fail idea without smuggling the whole Clay problem into a renamed "remaining burden."


