      \subsection{Euler Boundary Class-Membership Edge}

      The retained edge is simple. Part carries the differentiated Navier--Stokes pressure-viscosity tower. Field carries positive-scale one-field coherence for that tower. Euler base membership carries only the inviscid flux-volume and weak momentum-pressure law, written here as \(\mathrm{EVol}+\mathrm{EMom}\).

      This gives the useful boundary object. When the same selected terminal packet still carries \(\mathrm{EVol}+\mathrm{EMom}\) but loses the fixed-positive-viscosity Part or Field requirement, the packet has left the Navier--Stokes class and can be read as a base Euler object. That is a class-exit/class-entrance reading, not a proof of Euler smoothness and not an import of the Navier--Stokes Pack/Part/Field row into Euler.

      The smooth bridge is separate. A smooth Euler scenario can support the smooth side of the comparison, but the nonsmooth class-exit side is carried by the selected packet and its first failed Navier--Stokes face.


