      \subsection{Compactness Upgrade Lemma (Classical Euclidean Surface)}

      This lemma is the formal compactness statement behind the preceding package.
      It stays on the classical 3D incompressible Navier--Stokes equation on
      \((0,T)\times\mathbb R^3\).  The equation, data surface, pressure law, and
      viscosity regime stay fixed throughout the upgrade.

      Let \((u^{(n)},p^{(n)})\) be smooth classical Navier--Stokes solutions on a
      common interval \((0,T)\times\mathbb R^3\), all coming from the same fixed
      approximation scheme.  Assume the uniform energy bounds
      \[
      \sup_n\|u^{(n)}\|_{L_t^\infty L_x^2}<\infty,
      \qquad
      \sup_n\|u^{(n)}\|_{L_t^2 H_x^1}<\infty,
      \]
      and assume the scale-barrier tail input on that same scheme:
      \[
      \forall R>0,\ \forall\varepsilon>0,\ \exists N\ge N_*
      \quad\text{such that}\quad
      \sup_n
      \|P_{\ge N}u^{(n)}\|_{L^2(0,T;L^2(B_R))}
      \le\varepsilon.
      \]

      Then for every \(R>0\), after passing to a subsequence,
      \[
      u^{(n)}\to u
      \quad\text{strongly in }L^2(0,T;L^2(B_R)),
      \]
      and the usual weak limits also hold:
      \[
      u^{(n)}\rightharpoonup^\ast u
      \quad\text{in }L_t^\infty L_x^2,
      \qquad
      u^{(n)}\rightharpoonup u
      \quad\text{in }L_t^2 H_x^1.
      \]

      The proof is the low/high recombination from D.53.  At fixed \(N\), the
      low-frequency sequence \(P_{<N}u^{(n)}\) is compact by Aubin--Lions.  The
      tail input makes \(P_{\ge N}u^{(n)}\) uniformly small in local \(L^2\) after
      \(N\) is chosen large.  Passing \(n\to\infty\) first at fixed \(N\), and only
      then sending \(N\to\infty\), gives the strong local convergence.

      This convergence is strong enough to pass the quadratic term.  For every
      \[
      \Phi\in C_c^\infty((0,T)\times\mathbb R^3;\mathbb R^{3\times3}),
      \]
      \[
      \int_0^T\!\!\int_{\mathbb R^3}
      (u^{(n)}\otimes u^{(n)}):\Phi\,dx\,dt
      \to
      \int_0^T\!\!\int_{\mathbb R^3}
      (u\otimes u):\Phi\,dx\,dt.
      \]
      Equivalently,
      \[
      u^{(n)}\otimes u^{(n)}
      \to
      u\otimes u
      \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3).
      \]

