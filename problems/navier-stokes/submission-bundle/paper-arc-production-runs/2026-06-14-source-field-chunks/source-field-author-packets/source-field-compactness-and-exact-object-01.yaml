    \le
    2r_J\sum_{\ell,\ell'}w_{\ell,\ell'}(z,p).
    \]

    The remaining hypothesis is the one the reader should see.  The overlap weights
    must be summable on the same localized-projector surface, and the chosen radius
    \(r_J\) must make the right side harmless.  The geometric part of the localizer
    argument is paid by the support-ball calculation above.  The weighted
    small-radius budget remains the
    support input still owed by the PSJ+.1 route.



    \subsection{Compactness Limit-Order Cleanup Lemma}

    The nonlinear compactness bridge depends on the order of limits.  The reader
    needs to see three moves in order: first freeze the frequency cutoff, then take
    the compactness subsequence, then remove the high-frequency tail using the
    scale-barrier estimate.  Written this way, tensor closure comes from
    low-mode compactness plus high-mode smallness, with the \(N\to\infty\) step
    visible.

    \[
    \sup_n \|u^{(n)}\|_{L_t^\infty L_x^2}<\infty,
    \qquad
    \sup_n \|u^{(n)}\|_{L_t^2 H_x^1}<\infty,
    \qquad
    \sup_n \|\partial_t u^{(n)}\|_{L_t^2 H_x^{-1}}<\infty,
    \]

    \[
    u^{(n)}\to u
    \quad\text{strongly in }L^2([0,T];L^2(B_R)),
    \]

    \[
    u^{(n)}\otimes u^{(n)}\to u\otimes u
    \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3).
    \]

    \[
    u^{(n)}=P_{<N}u^{(n)}+P_{\ge N}u^{(n)}.
    \]

    Assume the high-mode tail estimate has been supplied on this same approximation
    surface: for every \(R>0\) and every \(\varepsilon>0\), there exists
    \(N\ge N_*\) such that
    \[
    \sup_n
    \|P_{\ge N}u^{(n)}\|_{L^2(0,T;L^2(B_R))}
    \le \varepsilon.
    \]

    For fixed \(N\), Aubin--Lions applies to \(P_{<N}u^{(n)}\) on \(B_R\).  The
    fixed low-frequency projector preserves the uniform
    \[
    L_t^2H_x^1(B_R)
    \qquad\text{and}\qquad
    L_t^2H_x^{-1}(B_R)
    \]
    bounds, so after passing to a subsequence,

    \[
    P_{<N}u^{(n)}\to v_N
    \quad\text{strongly in }L^2([0,T];L^2(B_R)).
    \]

    Diagonalizing over \(N=N_*,N_*+1,\ldots\), one subsequence works for every
    fixed \(N\ge N_*\).

    Now fix \(R\) and \(\varepsilon>0\).  Choose \(N\ge N_*\) so that the two
    high-mode tails are each at most \(\varepsilon/4\) in
    \[
    L^2(0,T;L^2(B_R)).
    \]
    For this fixed \(N\), low-mode strong convergence gives \(n_0\) such that for
    all \(m,n\ge n_0\),
    \[
    \|P_{<N}(u^{(n)}-u^{(m)})\|_{L^2(0,T;L^2(B_R))}
    \le \varepsilon/2.
    \]
    Combining the high-tail estimate with low-mode strong convergence gives
    \[
    \|u^{(n)}-u^{(m)}\|_{L^2(0,T;L^2(B_R))}
    \le \varepsilon.
    \]

    The sequence is Cauchy in \(L^2(0,T;L^2(B_R))\).  Since that space is complete,
    there exists \(u_R\) such that
    \[
    u^{(n)}\to u_R
    \quad\text{strongly in }L^2(0,T;L^2(B_R)).
    \]

    Compatibility for nested balls gives one field \(u\) on
    \((0,T)\times\mathbb R^3\) satisfying the same strong local \(L^2\)
    convergence.

    To pass to the tensor limit, let
    \[
    \Phi\in C_c^\infty((0,T)\times\mathbb R^3;\mathbb R^{3\times3})
    \]
    and choose \(R\) so that
    \(\operatorname{supp}\Phi\subset(0,T)\times B_R\).  Then
    \[
    \begin{aligned}
    &\left|
    \int_0^T\!\!\int_{\mathbb R^3}
    \bigl(u^{(n)}\otimes u^{(n)}-u\otimes u\bigr):\Phi\,dx\,dt
    \right|\\
    &\qquad\le
    \|\Phi\|_\infty
    \|u^{(n)}-u\|_{L^2(0,T;L^2(B_R))}
    \left(
    \|u^{(n)}\|_{L^2(0,T;L^2(B_R))}
    +\|u\|_{L^2(0,T;L^2(B_R))}
    \right),
    \end{aligned}
    \]
    which tends to zero.  Hence
    \[
    u^{(n)}\otimes u^{(n)}
    \to
    u\otimes u
    \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3).
    \]

    This is the compactness architecture used in Proposition 5.1, now written as a
    reader-facing proof order:
    \[
    \hbox{fix }N
    \quad\longrightarrow\quad
    n\to\infty
    \quad\longrightarrow\quad
    N\to\infty \hbox{ using the high-mode tail estimate.}
    \]



    \subsection{Navier-Stokes Compactness Package}

    This package states what the compactness side contributes after the classical
    scale-barrier tail estimate is available on the same approximation family.  It
    is a downstream proof package on the classical equation.  The scale-barrier
    theorem remains the upstream input.

    The theorem surface is fixed as follows.  Use one smooth-data
    Leray-projected approximation scheme, one pressure normalization, and the same
    Euclidean Navier--Stokes equation throughout the compactness and nonlinear
    closure steps.  On that fixed surface, the compactness work has three jobs:
    \[
    \begin{array}{ll}
    \mathrm{K1}: & \text{low-frequency compactness on each }B_R,\\
    \mathrm{K2}: & \text{high-frequency suppression from the scale-barrier tail
    input},\\
    \mathrm{K3}: & \text{recombination into strong local spacetime }L^2
    \text{ convergence.}
    \end{array}
    \]

    With K1--K3 in place, the tensor products satisfy
    \[
    u^{(n)}\otimes u^{(n)}
    \to
    u\otimes u
    \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3),
    \]
    so the quadratic nonlinear term passes to the limit in the classical weak
    formulation.

    Once the scale-barrier tail estimate is supplied on the same approximation
    scheme, the compactness bridge has a precise downstream role.  It turns K1--K3
    into passage of the nonlinear term.  The open upstream burden remains the
    classical scale-barrier tail estimate itself.  Pressure recovery and
    divergence-free limit bookkeeping still have to be written in the final
    manuscript, and they sit downstream of the same fixed scheme.



    \subsection{Compactness Upgrade Lemma (Classical Euclidean Surface)}

    This lemma is the formal compactness statement behind the preceding package.
    It stays on the classical 3D incompressible Navier--Stokes equation on
    \((0,T)\times\mathbb R^3\).  The equation, data surface, pressure law, and
    viscosity regime stay fixed throughout the upgrade.

    Let \((u^{(n)},p^{(n)})\) be smooth classical Navier--Stokes solutions on a
    common interval \((0,T)\times\mathbb R^3\), all coming from the same fixed
    approximation scheme.  Assume the uniform energy bounds
    \[
    \sup_n\|u^{(n)}\|_{L_t^\infty L_x^2}<\infty,
    \qquad
    \sup_n\|u^{(n)}\|_{L_t^2 H_x^1}<\infty,
    \]
    and assume the scale-barrier tail input on that same scheme:
    \[
    \forall R>0,\ \forall\varepsilon>0,\ \exists N\ge N_*
    \quad\text{such that}\quad
    \sup_n
    \|P_{\ge N}u^{(n)}\|_{L^2(0,T;L^2(B_R))}
    \le\varepsilon.
    \]

    Then for every \(R>0\), after passing to a subsequence,
    \[
    u^{(n)}\to u
    \quad\text{strongly in }L^2(0,T;L^2(B_R)),
    \]
    and the usual weak limits also hold:
    \[
    u^{(n)}\rightharpoonup^\ast u
    \quad\text{in }L_t^\infty L_x^2,
    \qquad
    u^{(n)}\rightharpoonup u
    \quad\text{in }L_t^2 H_x^1.
    \]

    The proof is the low/high recombination from D.53.  At fixed \(N\), the
    low-frequency sequence \(P_{<N}u^{(n)}\) is compact by Aubin--Lions.  The
    tail input makes \(P_{\ge N}u^{(n)}\) uniformly small in local \(L^2\) after
    \(N\) is chosen large.  Passing \(n\to\infty\) first at fixed \(N\), and only
    then sending \(N\to\infty\), gives the strong local convergence.

    This convergence is strong enough to pass the quadratic term.  For every
    \[
    \Phi\in C_c^\infty((0,T)\times\mathbb R^3;\mathbb R^{3\times3}),
    \]
    \[
    \int_0^T\!\!\int_{\mathbb R^3}
    (u^{(n)}\otimes u^{(n)}):\Phi\,dx\,dt
    \to
    \int_0^T\!\!\int_{\mathbb R^3}
    (u\otimes u):\Phi\,dx\,dt.
    \]
    Equivalently,
    \[
    u^{(n)}\otimes u^{(n)}
    \to
    u\otimes u
    \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3).
    \]

    C-U1 and C-U2 are downstream consequences of the same classical scale-barrier
    tail input.  Before that tail input is supplied, this compactness upgrade
    remains conditional support.  After that input is installed, the remaining
    bookkeeping is pressure recovery and the divergence-free limit on the same
    classical scheme.



    \subsection{Ancestry Compact Bound.A + Source Residue Liouville.A - direct loop note}

    This direct route tries to close the source-pulse branch through compactness and
    Liouville rigidity.  The ancestry chain is

    \[
    \cdots\to P^{-2}\to P^{-1}\to P^0
    \]

    and the failure scenario carries nonzero inherited source residue along that
    chain.  The hoped-for pair is:

    \[
    \text{compact ancestry limit}
    \qquad\text{and}\qquad
    \text{Liouville vanishing of the inherited source residue}.
    \]

    Together those two statements would contradict the nonzero residue required by a
    failure of Source Pulse Exclusion.A.

    The installed compactness machinery supplies local suitable ancient limits after
    localized packets and uniform local energy bounds are available.  That produces
    an ancient source-residue object.  Same-fluid ancestry preserves carrier/fibre
    coherence, but it gives no global boundedness, no Type I scale control, no
    critical-norm smallness, and no symmetry reduction for that ancient limit.

    A broad Liouville theorem for arbitrary local suitable ancient source-residue
    limits is not installed.  Smooth coherent ancient packets and cancellation
    profiles may carry local energy and source structure.  The current compactness
    output has no theorem forcing

    \[
    \gamma_*\,d\mu_*^\sigma=0.
    \]

    Classical consumers such as BKM, Prodi-Serrin, Type I, and critical smallness
    would be valid after their hypotheses are supplied.  Those hypotheses are absent
    on the terminal ancestry limit produced by the current route.

    The precise obstruction is this: local suitable compactness gives an ancient
    source-residue object without a rigid ancient class, and the route has no
    Liouville theorem for source residue outside such a class.

    The remaining theorem package is
    \[
    \text{ancestry compact bound}
    \quad+\quad
    \text{source-residue Liouville theorem on a rigid ancient class}.
    \]
    Together with the donor-depletion and drain attempts that remain open, this
    leaves Source Pulse Exclusion.A open at the source-pulse wall.



    \subsection{B ASAC Source Ancestry Compactness}

    This is the compactness form of the missing bridge between first-pulse
    no-parent and global no-incoming source flux for B ASAC. The target is that a
    nonzero terminal native source charge in the produced B ASAC class cannot be
    represented by a diffuse legal same-fluid parent cloud invisible to every
    bounded earlier selected source family. The desired conclusion is a fixed
    negative-time selected source parent, or a legal/donor/ASAC escape.

    Order-one terminal source charge gives order-one mass in shrinking terminal
    layers. Pigeonholing can select a high-density layer, but the layer may lie in
    \((-1/m,0]\) with \(m\to\infty\). This gives no fixed preterminal gap.

    \[
    g_m(s)=m\mathbf 1_{(-1/m,0]}(s)
    \]

    A selected-parent compactness theorem would require a bounded selected family
    capturing fixed mass. A diffuse cloud can have many legal near-terminal parents
    with total charge order one while every bounded subfamily captures vanishing
    mass.

    \[
    \pi_P=\frac{1}{M}\sum_{\alpha=1}^{M}\delta_{P^-_\alpha}
    \]

    A natural entropy \(H(P;M)\) would price this diffusion, but installed energy,
    local energy, pressure/cutoff, donor-balance, residual-, and ASAC records carry
    no positive entropy coefficient.

    \[
    \sum_{\alpha=1}^{M}M^{-2}=M^{-1},
    \]

    Bounded overlap controls selected child coverage, not the incoming legal parent
    count for one child. Source-ancestry compactness remains open. The hard
    obstruction is legal diffuse parent-cloud concentration at zero terminal heat
    time.



    \subsection{Compact Endpoint Matrix Formalization}

    This is the compact endpoint matrix for the pointwise class-membership route.
    It records how endpoint failures are typed after the analytic suppliers have
    been provided.

    \[
    CM_{N,r,Q}:=Part_{N,Q}\wedge Field_{N,r,Q}.
    \]

    \[
    Dead\vee packing\text{-}detached\vee tower\text{-}blown\vee Jump.
    \]

    The Part row removes the Dead face: an active participation witness cannot
    terminate as Dead while the retained class witness is still propagated.

    \[
    \Gamma_{pack,Q}(t)\le C_Q,
    \]

    \[
    \mathfrak A_{N,Q}\in L^\infty(I),
    \]

    The Pack row uses the bounded packing gauge. The Field row uses the retained
    tower bound. The matrix formalizes endpoint algebra; it consumes its analytic
    suppliers and does not prove them.


