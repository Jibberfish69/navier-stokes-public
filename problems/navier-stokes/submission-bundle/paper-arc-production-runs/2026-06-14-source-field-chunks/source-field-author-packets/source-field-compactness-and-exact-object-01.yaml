      The nonlinear compactness bridge depends on the order of limits.  The reader
      needs to see three moves in order: first freeze the frequency cutoff, then take
      the compactness subsequence, then remove the high-frequency tail using the
      scale-barrier estimate.  Written this way, tensor closure comes from
      low-mode compactness plus high-mode smallness, with the \(N\to\infty\) step
      visible.

