      \subsection{Compact-Support Localizer With Shrinking Radius Implies Center Spacing}

      This is a support reduction for the exact PSJ+.1 localized-projector route.  The
      claim has a geometric job: when the localizers all come from one compactly
      supported prototype, overlap already forces the packet centers to be close.  The
      weighted center-spacing burden can then be reduced to a support-radius estimate
      plus a small-radius budget.

      Assume the exact PSJ+.1 localizer profile is generated from one bounded
      Lipschitz prototype by

      \[
      \phi_{r_J}(y):=\phi(y/r_J),
      \]

      \[
      \operatorname{supp}\phi\subset B(0,1),
      \qquad
      \operatorname{Lip}(\phi)\le L_\phi.
      \]

      \[
      \operatorname{supp}\phi_{r_J}\subset B(0,r_J),
      \qquad
      \operatorname{Lip}(\phi_{r_J})\le \frac{L_\phi}{r_J}.
      \]

      \[
      \phi_\ell(z,p)=\phi_{r_J}\!\bigl(c_{J,\ell}(z)-m_p(t)\bigr).
      \]

      If
      \[
      \phi_\ell(z,p)\neq 0,
      \qquad
      \phi_{\ell'}(z,p)\neq 0,
      \]
      then both centers lie in the same support ball around \(m_p(t)\):
      \[
      c_{J,\ell}(z),\,c_{J,\ell'}(z)\in B(m_p(t),r_J).
      \]
      Hence
      \[
      |c_{J,\ell}(z)-c_{J,\ell'}(z)|\le 2r_J.
      \]

      Consequently, any weighted overlap ledger supported on simultaneous nonzero
      localizers satisfies the model bound
      \[
      \sum_{\ell,\ell'}w_{\ell,\ell'}(z,p)
       |c_{J,\ell}(z)-c_{J,\ell'}(z)|
      \le
      2r_J\sum_{\ell,\ell'}w_{\ell,\ell'}(z,p).
      \]

      The remaining hypothesis is the one the reader should see.  The overlap weights
      must be summable on the same localized-projector surface, and the chosen radius
      \(r_J\) must make the right side harmless.  The geometric part of the localizer
      argument is paid by the support-ball calculation above.  The weighted
      small-radius budget remains the
      support input still owed by the PSJ+.1 route.


