      \subsection{Affine-Survivor Quotient Compactness Interface Note}

      The quotient-compactness argument is tested one step deeper on the actual
      scale-memory route.

      It identifies the first exact point where the current Navier-Stokes input stack
      runs out.

      \[
      F^{(n)}(s,t):=(\mathcal V_\kappa \widetilde Z^{(n)})(s,t),
      \qquad
      w^{(n)}(s,t):=a^{(n)}(e^s,t).
      \]

      \[
      H_{w^{(n)}}(t):=\frac{|I|^2}{\int_I (w^{(n)}(s,t))^{-1}\,ds},
      \qquad
      c_{F^{(n)}}(t):=\frac1{|I|}\int_I F^{(n)}(s,t)\,ds.
      \]

      \[
      c_{F^{(n)}}(t)
      =
      \int_J \theta_\kappa(\sigma)\,\widetilde Z^{(n)}(\sigma,t)\,d\sigma,
      \]

      \[
      \Pi_{\mathrm{aff}}\widetilde Z^{(n)}
      :=
      \big(M_0^{(n)},M_1^{(n)}\big),
      \]

      \[
      M_0^{(n)}(t):=\int_J \widetilde Z^{(n)}(\sigma,t)\,d\sigma,
      \qquad
      M_1^{(n)}(t):=\int_J \sigma\,\widetilde Z^{(n)}(\sigma,t)\,d\sigma.
      \]

      On each fixed time slice, \(Q_{\mathrm{aff}}\) is two-dimensional over the
      ambient \(L_x^2\) coefficient space.

      This route has reduced the moving scale-memory obstruction to a
      finite-codimension quotient.

      The full scale source \(\widetilde Z^{(n)}\) only has to be controlled through
      its image in the finite-dimensional quotient \(Q_{\mathrm{aff}}\).

      That is a real reduction, and it is still support rather than closure.  Pairing
      with the active weight sends the problem back to the lower-prefix active-square
      geometry.

      The current route runs out at the first place where the proof needs an
      autonomous theorem on the affine survivor class.  That survivor is the object a
      later CM branch may test; this subsection records the object and the missing
      theorem while keeping the quotient reduction outside the class-exit claim.


