    text: |+
      \subsection{B ASAC Source Ancestry Compactness}

      This is the compactness form of the missing bridge between first-pulse
      no-parent and global no-incoming source flux for B ASAC. The target is that a
      nonzero terminal native source charge in the produced B ASAC class cannot be
      represented by a diffuse legal same-fluid parent cloud invisible to every
      bounded earlier selected source family. The desired conclusion is a fixed
      negative-time selected source parent, or a legal/donor/ASAC escape.

      Order-one terminal source charge gives order-one mass in shrinking terminal
      layers. Pigeonholing can select a high-density layer, but the layer may lie in
      \((-1/m,0]\) with \(m\to\infty\). This gives no fixed preterminal gap.

      \[
      g_m(s)=m\mathbf 1_{(-1/m,0]}(s)
      \]

      A selected-parent compactness theorem would require a bounded selected family
      capturing fixed mass. A diffuse cloud can have many legal near-terminal parents
      with total charge order one while every bounded subfamily captures vanishing
      mass.

      \[
      \pi_P=\frac{1}{M}\sum_{\alpha=1}^{M}\delta_{P^-_\alpha}
      \]

      A natural entropy \(H(P;M)\) would price this diffusion, but installed energy,
      local energy, pressure/cutoff, donor-balance, residual-, and ASAC records carry
      no positive entropy coefficient.

      \[
      \sum_{\alpha=1}^{M}M^{-2}=M^{-1},
      \]

      Bounded overlap controls selected child coverage, not the incoming legal parent
      count for one child. Source-ancestry compactness remains open. The hard
      obstruction is legal diffuse parent-cloud concentration at zero terminal heat
      time.


