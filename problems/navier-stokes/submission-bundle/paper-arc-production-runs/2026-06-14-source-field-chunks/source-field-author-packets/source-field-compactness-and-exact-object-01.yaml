      \subsection{Navier-Stokes Compactness Package}

      This package states what the compactness side contributes after the classical
      scale-barrier tail estimate is available on the same approximation family.  It
      is a downstream proof package on the classical equation.  The scale-barrier
      theorem remains the upstream input.

      The theorem surface is fixed as follows.  Use one smooth-data
      Leray-projected approximation scheme, one pressure normalization, and the same
      Euclidean Navier--Stokes equation throughout the compactness and nonlinear
      closure steps.  On that fixed surface, the compactness work has three jobs:
      \[
      \begin{array}{ll}
      \mathrm{K1}: & \text{low-frequency compactness on each }B_R,\\
      \mathrm{K2}: & \text{high-frequency suppression from the scale-barrier tail
      input},\\
      \mathrm{K3}: & \text{recombination into strong local spacetime }L^2
      \text{ convergence.}
      \end{array}
      \]

      With K1--K3 in place, the tensor products satisfy
      \[
      u^{(n)}\otimes u^{(n)}
      \to
      u\otimes u
      \quad\text{in }\mathcal D'((0,T)\times\mathbb R^3),
      \]
      so the quadratic nonlinear term passes to the limit in the classical weak
      formulation.

      Once the scale-barrier tail estimate is supplied on the same approximation
      scheme, the compactness bridge has a precise downstream role.  It turns K1--K3
      into passage of the nonlinear term.  The open upstream burden remains the
      classical scale-barrier tail estimate itself.  Pressure recovery and
      divergence-free limit bookkeeping still have to be written in the final
      manuscript, and they sit downstream of the same fixed scheme.


