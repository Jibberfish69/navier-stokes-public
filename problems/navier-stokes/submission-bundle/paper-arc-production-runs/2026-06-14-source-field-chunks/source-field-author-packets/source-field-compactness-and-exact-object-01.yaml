      \subsection{Ancestry Compact Bound.A + Source Residue Liouville.A - direct loop note}

      This direct route tries to close the source-pulse branch through compactness and
      Liouville rigidity.  The ancestry chain is

      \[
      \cdots\to P^{-2}\to P^{-1}\to P^0
      \]

      and the failure scenario carries nonzero inherited source residue along that
      chain.  The hoped-for pair is:

      \[
      \text{compact ancestry limit}
      \qquad\text{and}\qquad
      \text{Liouville vanishing of the inherited source residue}.
      \]

      Together those two statements would contradict the nonzero residue required by a
      failure of Source Pulse Exclusion.A.

      The installed compactness machinery supplies local suitable ancient limits after
      localized packets and uniform local energy bounds are available.  That produces
      an ancient source-residue object.  Same-fluid ancestry preserves carrier/fibre
      coherence, but it gives no global boundedness, no Type I scale control, no
      critical-norm smallness, and no symmetry reduction for that ancient limit.

      A broad Liouville theorem for arbitrary local suitable ancient source-residue
      limits is not installed.  Smooth coherent ancient packets and cancellation
      profiles may carry local energy and source structure.  The current compactness
      output has no theorem forcing

      \[
      \gamma_*\,d\mu_*^\sigma=0.
      \]

      Classical consumers such as BKM, Prodi-Serrin, Type I, and critical smallness
      would be valid after their hypotheses are supplied.  Those hypotheses are absent
      on the terminal ancestry limit produced by the current route.

      The precise obstruction is this: local suitable compactness gives an ancient
      source-residue object without a rigid ancient class, and the route has no
      Liouville theorem for source residue outside such a class.

      The remaining theorem package is
      \[
      \text{ancestry compact bound}
      \quad+\quad
      \text{source-residue Liouville theorem on a rigid ancient class}.
      \]
