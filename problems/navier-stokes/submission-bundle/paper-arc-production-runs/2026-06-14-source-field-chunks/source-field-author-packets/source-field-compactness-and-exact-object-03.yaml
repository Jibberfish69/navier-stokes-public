    \{(s,\rho): s \in \mathbb R,\ \rho \in [\kappa,\infty)\}.
    \]

    The point is the same in all three cases: the moving mesoscopic band becomes a fixed region in the relative variable .

    The lifted profile should not be measured directly. It should be measured modulo the directions already shown to be irrelevant.

    This is the right analogue of the old compactness defect K R,N , but now on the moving mesoscopic profile rather than on the raw velocity field.

    This quotient theory should not be ordered primarily by integer derivative count.

    Ordinary Sobolev compactness measures regularity of u by derivative order. The old non-Sobolev compactness package improves that by adding absolute high-frequency suppression.

    So this is not "a stronger Sobolev space on u." It is a quotient compactness theory on the survivor profile that the moving mesoscopic band actually leaves behind.



    \subsection{Survivor Compactness / Coercivity Theorem Shape Note}

    It does not prove such a theorem. It isolates what the theorem would have to mean, what class it would act on, and how it would discharge the live Family A survivor route.

    The precise mathematical interface is survivor compactness or coercivity on the quotient coordinates that remain after exact and collar-null directions have been removed.

    Let u (n) be a classical approximation or would-be concentrating sequence for the original 3D incompressible Navier-Stokes equation on (0,T) R 3.

    \[
    \mathcal Z^{(n)}=\mathcal Z[u^{(n)}]
    \]

    \[
    \Pi_{\mathrm{surv}}:\mathcal Z \to \mathcal Q_{\mathrm{surv}}
    \]

    \[
    \mathcal Q_{\mathrm{surv}}
    :=
    \mathcal Z/\ker \Pi_{\mathrm{surv}}
    \cong
    \operatorname{Im}(\Pi_{\mathrm{surv}}).
    \]

    \[
    \Pi_{\mathrm{surv}}=\Pi_{\mathrm{aff}},
    \qquad
    \Pi_{\mathrm{aff}}\widetilde Z=(M_0,M_1).
    \]

    The right theorem should not act on arbitrary smooth solutions. It should act on sequences already normalized to expose the survivor.

    \[
    \mathcal Y_{I,J}
    :=
    L^2\big((0,T);L_x^2\times L_x^2\big)
    \]

    Condition (B3) means we have already thrown away the bulk and are looking at the first nontrivial survivor scale.

    The compactness statement concerns the survivor coordinates, not the whole
    sequence \(u^{(n)}\) in total space. All exact and collar-null directions have
    already been quotiented out.

    So coercivity is stronger than mere boundedness. It says the survivor coordinates are controlled by a defect budget already known or expected to vanish.

    Compactness alone does not kill the survivor. It only produces a strong limit. To finish the argument one also needs a rigidity statement.

    This contradicts any blowup-normalization in which the persistent weighted quotient term remains nontrivial.

    The current NS stack does not prove (SC-1), (SC-2), (SC-2R), (ASC-1), or (ASC-2).

    Not compactness of the whole field. Not another crude estimate on the full source. Compactness or coercivity of the survivor coordinates themselves.


