      \subsection{Persistent-Support Transport Export Theorem}

      Its job is not to re-derive the classical low-mode strain theorem from shell algebra. Its job is to state the exact operator-level bridge by which coherent transport on persistent support produces the principal classical low-mode transport term after selector localization and readout.

      \[
      u_{\mathrm{coh}}:=\rho(\mathbb H_D X).
      \]

      \[
      \mathcal T^{\mathrm{coh}}_{i,j_0}[X]Y
      :=
      B_i(X)\,\mathbb S_D(j_0)\mathbb H_D Y.
      \]

      The correct transport target is not a raw equality with u coh . The selector/localizer has to survive on the classical side. So the exact bridge surface is

      \[
      \rho(\mathcal T^{\mathrm{coh}}_{i,j_0}[X]Y)
      =
      \widetilde Q_i P_{\le j_0}\big((u_{\mathrm{coh},i}\partial_i)v\big)
      +
      R^{\mathrm{collar}}_{i,j_0}[X;Y],
      \]

      where Q i is the classical image of the carrier localizer Q i and R collar i,j 0 [X;Y] is a selector-collar remainder.

      \[
      \rho(\mathcal T^{\mathrm{coh}}_{i,j_0}[X]Y)
         =
         \widetilde Q_i P_{\le j_0}\big((u_{\mathrm{coh},i}\partial_i)v\big)
         +
         R^{\mathrm{collar}}_{i,j_0}[X;Y].
      \]

      \[
      \|\rho(Z)\|_{H^s(\mathbb R^3)}
         \le
         C_s\|Z\|_{H_D^s}.
      \]

      In particular, if the collar remainder is lower-order on the same bridge surface, then selector-localized coherent transport exports to the classical side at the viscous scale.

      It shows that once selector-localized coherent transport is correctly intertwined with the classical transport channel, the inherited readout Sobolev comparison is already enough to turn a carrier-side viscous-scale bound into the corresponding classical W 1, bound.


