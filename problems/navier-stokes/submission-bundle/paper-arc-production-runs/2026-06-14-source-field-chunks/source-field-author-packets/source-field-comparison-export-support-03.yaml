      \subsection{Euler-Smooth To Navier-Stokes-Smooth Support Bridge}

      The smooth-side Euler bridge has only a support role in this reader-facing paper. For the same smooth datum and the same time window, a smooth Euler scenario is evidence that the inviscid transport-pressure side is not the source of a singular picture. The Navier--Stokes solution still has to carry its own fixed-positive-viscosity tower, pressure-viscosity participation, and continuation norm.

      In short, the bridge can reassure the smooth side of the boundary. It is not the mechanism that proves a nonsmooth Navier--Stokes branch has left the class.


