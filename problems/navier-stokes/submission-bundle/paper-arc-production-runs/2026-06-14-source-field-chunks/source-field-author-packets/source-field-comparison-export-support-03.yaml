      \subsection{Noncoherent Leakage Export Theorem}

      The exact carrier leakage identity reduces the classical readout bound to a precise carrier commutator theorem on the same support/readout/selector stack.

      \[
      L_{i,\beta}(X)
      :=
      P_\perp Q_i\mathbb P_D N_D(X)e_\beta.
      \]

      \[
      L_{i,\beta}(X)
      =
      (\Delta_D-\lambda_\beta)^{-1}P_\perp
      [\Delta_D,\;Q_i\mathbb P_D N_D(X)]e_\beta.
      \]

      \[
      \|\rho(Z)\|_{H^s(\mathbb R^3)}
         \le
         C_s\|Z\|_{H_D^s}
      \]

      \[
      \|(\Delta_D-\lambda_\beta)^{-1}P_\perp Z\|_{H_D^s}
         \le
         g_{\beta,s}^{-1}\|Z\|_{H_D^s}.
      \]

      \[
      \|\nabla \rho(L_{i,\beta}(X))\|_{L^\infty_x}
      \le
      C_s g_{\beta,s}^{-1}
      \|P_\perp[\Delta_D,\;Q_i\mathbb P_D N_D(X)]e_\beta\|_{H_D^s}.
      \]

      Leakage export is reduced exactly to the carrier commutator theorem on the readout-compatible Sobolev scale.

      The remaining work is to lift the already-existing carrier commutator package to the readout-compatible H D s scale strongly enough to make the remainder lower-order at the classical viscous scale.


