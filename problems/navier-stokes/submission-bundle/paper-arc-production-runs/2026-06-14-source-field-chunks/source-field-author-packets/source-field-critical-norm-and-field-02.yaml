      \subsection{Gradient Stronger-Coefficient Interface Audit}

      \[
      \mathcal L_N(t)
      :=
      1+\sum_{k\le N-4}2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}
      \]

      \[
      \Lambda_N(t)
      :=
      1+\sum_{k\le N-4}2^{5k/2}\|\Delta_k u(t)\|_{L^2_x},
      \]

      \[
      \Theta_N^\sharp(t)
      :=
      2^{3N}\sum_{m=N-M}^{N+M}\|\Delta_m u(t)\|_{L^2_x}^2,
      \]

      \[
      \mathcal K_N(t)
      :=
      \sum_{m=N-M}^{N+M}2^{3m}\|\Delta_m u(t)\|_{L^2_x}^2,
      \]

      \[
      \widetilde\Lambda_N^\sharp(t):=\Lambda_N(t)+\Theta_N^\sharp(t).
      \]

      The upgraded interface changes only the gradient bridge:

      \[
      \frac{d}{dt}E_N(t)+(1-\eta)\nu D_N(t)
      \le
      C\,\widetilde\Lambda_N^\sharp(t)E_N(t)+C_*2^{-2\delta N}.
      \]

      The scale-barrier proposition, compactness proposition, and continuation
      endpoint stay the same.  The local \(4\to1\) tail-energy recertification also
      keeps its packet structure after \(E_N\) has been bounded.

      The manuscript cost is local and visible.  Any place that still says the
      gradient bridge closes with only \(\mathcal L_N\) is too strong.  The current
      honest surface is \(\widetilde\Lambda_N^\sharp\) unless a new low-mode strain
      theorem returns the bridge to \(\mathcal L_N\).


