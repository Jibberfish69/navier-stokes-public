      \subsection{Localized Projector Coarse Route Stronger Adiabatic Continuation}

      Once the minimal coarse localized-projector route has been reduced to the
      retained-cover counting endpoint, there is a stronger continuation that switches
      back to the older exact-potential adiabatic packet.

      \[
      \sum_k |I_k|\,\mu_J^{pair}(\mathcal J_k)
      \le
      C\bigl(\mathcal E_J^{obs}(I)+\mathrm{Err}_{J,\mathrm{pair}}(I)\bigr).
      \]

      The extra hypotheses place the proof back on the older exact-potential
      retained-window chain. This route switch leaves the scalar endpoint for the
      installed minimal coarse packet unpaid.


