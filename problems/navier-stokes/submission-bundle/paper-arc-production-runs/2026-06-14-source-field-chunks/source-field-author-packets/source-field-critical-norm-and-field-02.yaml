      \subsection{Frozen Transported Localized Projector Packet Eliminates Coefficient Drift}

      This note is a local redesign result for the exact-potential localized
      projector subbranch.  The coefficient-drift term appeared because the
      localized projector moment was written with a time-dependent density.  On the
      frozen transported realization, all selector and localization weights are
      absorbed into a time-independent packet weight.

      Fix the transported strip \(\Omega_J\times I\), a fixed local packet space
      \(\mathcal P_J(x)\), and a fixed reference measure \(d\bar\nu_{J,x}\).  Choose

      \[
      \lambda_J(x,p)\ge 0,
      \qquad
      \lambda_J\in L^\infty(\Omega_J\times\mathcal P_J),
      \]

      \[
      \widetilde S_J^{fr}(x,t)
      :=
      \int_{\mathcal P_J(x)}
      \lambda_J(x,p)\,P_J(x,p,t)\,d\bar\nu_{J,x}(p).
      \]

      \[
      m_J^{fr}(x)
      :=
      \int_{\mathcal P_J(x)}\lambda_J(x,p)\,d\bar\nu_{J,x}(p).
      \]

      \[
      \partial_t\widetilde S_J^{fr}(x,t)
      =
      \int_{\mathcal P_J(x)}
      \lambda_J(x,p)\,\partial_t P_J(x,p,t)\,d\bar\nu_{J,x}(p),
      \]

      \[
      R_{J,\mathrm{coeff}}^{fr}\equiv 0.
      \]

      The coefficient-drift slot vanishes identically because the packet weight and
      packet measure are time independent.  The remaining local error is the
      moment-closure term controlled by localized projector concentration.  Under the
      exact-segment and tail-free realizations, the sharp forcing side becomes the
      installed pair-family record \(D.7ie1\), or the adiabatic record \(D.7ie3\),
      plus the usual weighted coverage/globalization packet.

      This result is narrower than a new projector theorem.  It gives a route
      choice: pay coefficient drift on the moving-weight realization, or adopt the
      frozen transported packet realization and remove coefficient drift from the
      local wall.


