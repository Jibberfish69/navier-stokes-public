    \alpha'(W_J)\,\partial_t W_J.
    \]

    The status is exact reduction. The coefficient-drift theorem is now the
    weighted \(L^2\) control of these four chain-rule terms. Without that
    time-regularity packet, the localized-projector route remains open.



    \subsection{Low-Mode Duhamel Product Reduction}

    The next group leaves the localized-projector branch and records the low-mode
    product side of the same tail/feedback problem. Set

    \[
    \Lambda_N(t)=\|\nabla S_{N-4}u(t)\|_{L^\infty}.
    \]

    \[
    S_{N-4}u(t)=e^{\nu(t-t_0)\Delta}S_{N-4}u(t_0)
    -
    \int_{t_0}^t e^{\nu(t-s)\Delta}S_{N-4}\mathbb P\nabla\cdot(u\otimes u)(s)ds.
    \]

    \[
    \Lambda_N(t)\le \Lambda_N^{lin}(t)+\Lambda_N^{nl}(t).
    \]

    The high-high and low-high feedback pieces contain at least one tail factor.
    After Bernstein and the heat-kernel bound, their product with \(E_N\) is
    controlled by

    \[
    \varepsilon\nu D_N+C_\varepsilon 2^{-2N}E_N^2.
    \]

    The linear piece and the low-low nonlinear piece depend only on finitely many modes below N. They produce a coefficient measure

    \[
    d\nu_N^{low}(t):=\left(\Lambda_N^{lin}(t)+\Lambda_N^{low-low}(t)\right)dt.
    \]

    The conversion is conditional on a terminal-window coefficient-measure theorem
    for this low-mode measure. The tail terms can be absorbed by the high-frequency
    reserve; the finite low-mode coefficient still needs its own terminal-window
    control.



    \subsection{Low-Mode Product Channel Result}

    The naive product channel fails for a precise endpoint integrability reason.

    \[
    \Lambda_N(t)=\|\nabla S_{N-4}u(t)\|_{L^\infty},
    \]

    \[
    \Lambda_N(t)
    \le C_N\|\nabla u(t)\|_2.
    \]

    \[
    \Lambda_N\in L^2_t
    \]

    \[
    E_N\in L^1_t
    \]

    These two facts do not imply \(\Lambda_N E_N\in L^1_t\). The model pair

    \[
    a(t)=(T-t)^{-1/3},
    \qquad
    b(t)=(T-t)^{-2/3}.
    \]

    has \(a\in L^2\) and \(b\in L^1\), while \(ab=(T-t)^{-1}\) is not integrable at
    the endpoint. The missing ingredient is exactly the low-mode strain suppression
    theorem already isolated.

    Product channel A does not close from the fixed low-mode coefficient time
    estimate plus baseline energy. It reduces to \(E_N^2\)-integrability,
    endpoint boundedness of \(E_N\), or low-mode strain suppression.



    \subsection{Aact Kx Local Absorption Discharge Via Coefficient Demotion}

    The local absorption obligation is discharged by demoting the dangerous terms
    into the coefficient record. The audit defect was specific: the previous local
    proof tried to absorb
    \((V_R^{1/3}+P_R^{2/3})N_R\) using only \(L_t^1\) smallness of \(V_R\) and
    \(P_R\). The repaired proof removes those terms from the dissipation
    coefficient.

    Work on one shrunken same-fluid moving cylinder \(Q_R^\Phi\) where
    \(SCF^{avg}_m\) holds after the \(ATD_m\) shrink. Let \(X_R(t)\) be the
    averaged affine-subtracted excess and \(N_R(t)\) the corresponding dissipative
    packet. The repaired local inequality has the form
    \[
    D^+X_R+c_1N_R
    \le
    \bar B_RX_R+C_0X_R^{1/2}N_R+\bar F_R,
    \]
    with \(c_1>0\), \(C_0<\infty\), and \(\bar B_R,\bar F_R\in L^1(I)\) on the
    scheduler cell \(I\). Here \(\bar B_R\) contains the lower-order affine, frame,
    cutoff, pressure-response, viscous-commutator, and finite-rung coefficient
    records, while \(\bar F_R\) contains source, residual, harmonic/far-pressure,
    cutoff, and finite-frame remainder records.

    Let \(J\subset I\) be the maximal first-exit interval from \(s\) on which
    \(X_R(t)\le4\eta_X\). On \(J\), choose \(\eta_X\) so that
    \[
    C_0X_R^{1/2}N_R\le \frac{c_1}{2}N_R.
    \]

    The scheduler condition gives \(\sup_JX_R\le2\eta_X\), improving the
    first-exit bound \(4\eta_X\). Continuity extends the estimate through the whole
    scheduler cell. Integrating the absorbed inequality gives \(N_R\in L^1(I)\);
    the averaged tower record then gives
    \(\mathcal K_{\le m}^{avg,R}\in L^1(I)\).

    The direct-variable local calculation is the authority for this repaired
    inequality. Frame, cutoff, pressure-response, affine-core,
    viscous-commutator, harmonic/far-pressure, source, and finite-frame packets are
    estimated before first-exit absorption and placed into
    \(\bar B_RX_R+\bar F_R\), with fixed small fractions of \(N_R\) already spent in
    the term audit.

    The genuine affine-excess nonlinear term is the only coefficient still
    multiplying \(N_R\). It has the form \(C_0X_R^{1/2}N_R\), and it is absorbed by
    pointwise bootstrap smallness of \(X_R\).

    The local proof spends no \(L_t^1\) smallness of \(V_R\) or \(P_R\) to absorb a
    pointwise coefficient multiplying \(N_R\).

    These boundaries belong to the other live Navier-Stokes frontier items. They do not reopen the local absorption mechanism proved here.



    \subsection{Act Kx Affine Normalized Conditional Discharge Rscb Nkf}

    \[
    \mathcal K_{\le m}^{ctr}
    \le
    C((\mathcal X^{exc})^{1/2}\mathcal N^{1/2}+\mathcal X^{exc})+F_K.
    \]

    The native affine pressure cell removes the affine and affine-linear center
    modes. The remaining quadratic pressure cell is controlled by affine excess and
    dissipation, while the harmonic far tail is controlled by the energy record.

    The top-viscous and pressure records are readout/buffer data. Only
    \(\mathcal X^{exc}\) is the small absorption variable.

    \[
    \eta_X=\left(\frac{c_\nu}{4C_X}\right)^2.
    \]

    \[
    \mathcal X^{exc}(s_a;R_a)\le\eta_X.
    \]

    \[
    C_X(\mathcal X^{exc})^{1/2}\mathcal N
    \le
    \frac{c_\nu}{2}\mathcal N.
    \]

    \[
    (\mathcal X^{exc})^{1/2}\mathcal N^{1/2}
    \le
    \delta\mathcal N+C_\delta\mathcal X^{exc}.
    \]

    The scheduler budget keeps the Gronwall factor and forcing integrals below the
    fixed absorption threshold. The first-exit argument then gives the conditional
    centered affine tower bound. This packet is conditional on the restart seed and
    the scheduler smallness already named above.


