      \subsection{Localized Projector Coefficient Drift Chain-Rule Reduction}

      The coefficient-drift slot is the honest local blocker on the localized
      projector route.

      \[
      \int_I\!\!\int_{\Omega_J}
      w_J
      \int_{\mathcal P_J(x)}
      |\partial_t a_J(x,p,t)|^2\,d\bar\nu_{J,x}(p)\,dx\,dt
      =
      o_J(1)
      \]

      This estimate is not supplied by the static localized-projector packet. It
      requires time-regularity for the coefficients in the packet selector.

      \[
      a_J(x,p,t)
      =
      \chi_J(x,p,t)\,
      \phi_r\!\bigl(x-m_J(x,p,t)\bigr)\,
      \psi_\rho\!\bigl(\ell_J(x,p,t)\bigr)\,
      \alpha\!\bigl(W_J(x,p,t)\bigr),
      \]

      Assume \(\chi_J\) is absolutely continuous in time for
      \(\bar\nu_{J,x}\)-almost every packet point, \(\phi_r\), \(\psi_\rho\), and
      \(\alpha\) are Lipschitz on their active ranges, and the pair midpoint
      \(m_J\), pair length \(\ell_J\), and confidence observable \(W_J\) have time
      derivatives on the active packet.

      \[
      \partial_t a_J
      =
      T_J^{sel}+T_J^{mid}+T_J^{len}+T_J^{conf},
      \]

      \[
      T_J^{sel}
      :=
      (\partial_t\chi_J)\,
      \phi_r(x-m_J)\,
      \psi_\rho(\ell_J)\,
      \alpha(W_J),
      \]

      \[
      T_J^{mid}
      :=
      -\chi_J\,
      \nabla\phi_r(x-m_J)\!\cdot\!\partial_t m_J\,
      \psi_\rho(\ell_J)\,
      \alpha(W_J),
      \]

      \[
      T_J^{len}
      :=
      \chi_J\,
      \phi_r(x-m_J)\,
      \psi_\rho'(\ell_J)\,\partial_t\ell_J\,
      \alpha(W_J),
      \]

      \[
      T_J^{conf}
      :=
      \chi_J\,
      \phi_r(x-m_J)\,
      \psi_\rho(\ell_J)\,
      \alpha'(W_J)\,\partial_t W_J.
      \]

      The status is exact reduction. The coefficient-drift theorem is now the
      weighted \(L^2\) control of these four chain-rule terms. Without that
      time-regularity packet, the localized-projector route remains open.


