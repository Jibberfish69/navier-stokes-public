      \subsection{Conditional Continuation after Terminal Readout}

      This is the standard continuation step after the terminal readout has produced
      a bounded \(H^s\) norm.  It is not the proof of terminal-cover production.

      Let \((u,p)\) be the maximal classical solution on \([0,T_*)\).  Work on a
      terminal same-fluid approach tail.

      If the averaged field object gives a finite positive-scale SCF-good same-fluid
      cover on a terminal subtail, the terminal readout can produce a bound of the
      form

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]

      Periodic \(H^s\) local theory gives a time \(\tau>0\), depending only on the
      displayed bound, \(\nu\), and \(\mathbb T^3\). Choose \(t_j\uparrow T_*\) with
      \(T_*-t_j<\tau/2\). Relaunching from \(u(t_j)\) gives a classical solution on
      \([t_j,t_j+\tau]\), and uniqueness identifies it with the original solution on
      the overlap. Since \(t_j+\tau>T_*\), the original maximal solution extends past
      \(T_*\). Hence the maximal time satisfies

      \[
      T_*=\infty.
      \]


