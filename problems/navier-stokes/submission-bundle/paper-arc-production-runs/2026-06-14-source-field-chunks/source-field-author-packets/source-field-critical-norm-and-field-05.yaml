      \subsection{Pointwise Class Readout to an \(H^s\) Continuation Norm}

      \[
      M_Q(u,p)
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]

      \[
      CM_{N,r,Q}=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      This is a readout statement after the class witness has been supplied.  Pack
      supplies a finite retained cover with bounded deformation and bounded overlap.
      Part supplies finite tower participation and the forcing law through depth
      \(N\).  Field supplies one-field coherence.  The local tower packets then patch
      as a single velocity field on \(\mathbb T^3\).

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q
      \]

      Choose \(N\) so that the pointwise tower contains all spatial derivatives needed
      for \(H^s\), with \(s>5/2\).  On each cover element, the local tower readout
      bounds the \(H^s\) norm.  Finite overlap and the shared Field coherence allow
      summation over the retained cover, giving the uniform global bound

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]


