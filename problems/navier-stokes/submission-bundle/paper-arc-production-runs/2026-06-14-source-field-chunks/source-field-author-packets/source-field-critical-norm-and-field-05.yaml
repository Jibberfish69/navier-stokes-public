    text: |+
      \subsection{Periodic Terminal Continuation from the Endpoint Conversion}

      Let \(u_0\) be smooth, divergence-free, and zero-mean on \(\mathbb T^3\), and
      let \((u,p)\) be the maximal classical solution of the unforced
      three-dimensional incompressible Navier--Stokes equations on \([0,T_*)\).

      \[
      T_*=+\infty.
      \]

      Assume toward contradiction that \(T_*<\infty\).  Classical maximality gives a
      first finite terminal obstruction at \(T_*\).  On the periodic zero-force branch,
      the endpoint conversion supplies the cascade-suppression input

      \[
      \sup_I E_N+
      \int_I D_N\le\rho,
      \]

      and the repaired packet split supplies

      \[
      |\Pi_{\ge N}|
      \le
      C\widetilde\Lambda_N^\sharp E_N+
      \eta\nu D_N+C_*2^{-2\delta N}.
      \]

      Those inputs are exactly the periodic cascade controls consumed by the installed
      class-membership endpoint matrix.  The matrix excludes the typed first terminal
      obstruction on this branch.  This contradicts the assumed finite \(T_*\), so
      \(T_*=\infty\).

      The periodic zero-force Navier--Stokes branch on \(\mathbb T^3\) continues
      globally for smooth divergence-free zero-mean data under the installed
      class-membership endpoint matrix and the repaired cascade route.

      This theorem proves the terminal periodic continuation implication only.  It
      does not assert a whole-space \(\mathbb R^3\) export theorem.


