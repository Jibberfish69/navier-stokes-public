      \subsection{Periodic Continuation Readout to a Uniform \(H^s\) Bound}

      Let \((u,p)\) be a maximal classical solution on \([0,T_*)\) for the periodic
      three-dimensional Navier--Stokes equation.  Assume the pointwise endpoint
      package and the pointwise class witness at depth \(N\), with \(N\) chosen to
      dominate a Sobolev index

      \[
      s>5/2.
      \]

      \[
      \sup_{0\le t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}<\infty.
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}\le M_s<\infty.
      \]

      \[
      \tau=\tau(\nu,s,M_s)>0
      \]

      for data with \(H^s\) norm at most \(M_s\).  Choose \(t_j\uparrow T_*\) with
      \(T_*-t_j<\tau/2\).  The local solution launched from \(u(t_j)\) exists on
      \([t_j,t_j+\tau]\), which extends past \(T_*\).  Uniqueness on the overlap
      identifies it with the original solution.  A finite \(T_*\) contradicts
      maximality.


