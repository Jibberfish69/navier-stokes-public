    text: |+
      \subsection{Quantitative Field avg Cover Theorem}

      Let T be a bounded-distortion same-fluid terminal tail with distortion bound M sharp. Assume

      \[
      \sum_{j=1}^J 1_{Q_{\theta_m r_j}^{\Phi}}\le \Omega_4(M_\sharp),
      \]

      \[
      J\le C_4(M_\sharp)\left(1+\frac{D_T}{r_*}\right)^4,
      \]

      where D T is the parabolic diameter of the retained material tail in same-fluid coordinates.

      The radius floor r * is supplied by Field avg; it is not manufactured by endpoint readout.

      \[
      r_{\mathrm{good}}(a,t)\ge 2r_*
      \qquad ((a,t)\in T').
      \]

      For each point select an SCF-good same-fluid cylinder of radius in [r *,2r *]. The selected cylinders cover T'. Apply the parabolic Vitali-Besicovitch selection theorem in the pulled-back same-fluid coordinates. Bounded distortion transfers the standard parabolic overlap bound to the physical moving cylinders, giving

      \[
      J\le C_4(M_\sharp)(1+D_T/r_*)^4.
      \]

      The shrunken cylinders remain SCF-good by the monotonicity/stability built into the strict epsilon m margin. Thus the finite cover is scheduler-ready.

      \[
      B_*:=\sum_{j,p}1_{I_j}B_{j,p},\qquad F_*:=\sum_{j,p}1_{I_j}F_{j,p},
      \]


