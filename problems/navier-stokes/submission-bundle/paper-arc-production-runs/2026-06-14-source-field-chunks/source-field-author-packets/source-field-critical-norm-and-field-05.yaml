    text: |+
      \subsection{Periodic Continuation Sobolev Standard Audit}

      For \(s>5/2\), the periodic Navier--Stokes equation is locally well posed in
      \(H^s(\mathbb T^3)\).  The lifespan depends on

      \[
      \nu,
      \quad s,
      \quad \|u(t_0)\|_{H^s(\mathbb T^3)}.
      \]

      \[
      \sup_{t<T_*}\|u(t)\|_{H^s(\mathbb T^3)}\le M_s<\infty,
      \]

      \[
      \tau=\tau(\nu,s,M_s)>0.
      \]

      Choose \(t_j\uparrow T_*\) with \(T_*-t_j<\tau/2\).  The solution launched from
      \(u(t_j)\) exists past \(T_*\); uniqueness identifies it with the original
      solution on the overlap.  Finite \(T_*\) is impossible under the displayed
      uniform bound.

      The pointwise endpoint package gives the terminal cover and pointwise
      Field/tower control at depth \(N\), chosen to dominate \(s\).  Finite overlap
      and periodic compactness give the global \(H^s\) bound.


