      \subsection{Mixed-Jet Generating Field H s Energy}

      So the tower route is not alien to classical Sobolev theory. If the factorially weighted series converges as a genuine field, it falls back onto the same a priori mechanism as the ordinary equation.

      \[
      \mathcal J(\tau,\zeta)
      :=
      \sum_{m\ge0}\sum_{\alpha\in\mathbb N^3}
      \frac{\tau^m\zeta^\alpha}{m!\,\alpha!}\,
      J_{m,\alpha},
      \qquad
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u.
      \]

      \[
      \mathcal \Pi(\tau,\zeta)
      :=
      \sum_{m\ge0}\sum_{\alpha\in\mathbb N^3}
      \frac{\tau^m\zeta^\alpha}{m!\,\alpha!}\,
      \Pi_{m,\alpha}.
      \]

      \[
      \partial_t \mathcal J
      +
      (\mathcal J\cdot\nabla)\mathcal J
      +
      \nabla \mathcal \Pi
      =
      \nu\Delta \mathcal J,
      \qquad
      \nabla\cdot \mathcal J=0.
      \]

      \[
      \partial_t \mathcal V + (\mathcal V\cdot\nabla)\mathcal V + \nabla\mathcal P
      =
      \nu\Delta \mathcal V.
      \]

      \[
      \langle \Lambda^s\Delta \mathcal J,\Lambda^s\mathcal J\rangle
      =
      -\|\nabla \mathcal J\|_{H^s}^2.
      \]

      This is exactly the ordinary H s Navier--Stokes energy inequality, now applied to the mixed-jet generating field.

      then the tower route is not using a new PDE. It is using the same H s energy mechanism on a larger field that stores the derivative tower.

      Convergence of the generating series (1)--(2) is not proved here for generic smooth Clay data.


