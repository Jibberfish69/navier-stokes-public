      \subsection{Clay problem Full Coefficient Response Height Drain}

      The full-coefficient adjoint route tests terminal response mass by dual packets. In H -1 , the forcing Delta u is paid by ordinary dissipation, not by height-dissipation.

      \[
      M_Z(T)
      :=
      |\langle z_j(t_+),\chi_T^{full}(t_+)\rangle|^2,
      \]

      where Chi T full is the full-coefficient adjoint packet with terminal data in the shell-j response packet frame.

      \[
      H_k^z(t_+)
      =
      2^k\sum_{j>k+4}2^{2j}E_j^z(t_+).
      \]

      \[
      L_u z=\Delta u.
      \]

      \[
      \langle z(t_+),\chi_T^{full}(t_+)\rangle
      =
      \langle z(\sigma_T),\chi_T^{full}(\sigma_T)\rangle
      +\int_{\sigma_T}^{t_+}\langle\Delta u,\chi_T^{full}\rangle dt.
      \]

      \[
      M_Z(T)
      \le
      \sum_{P\prec_Z^{full}T}\kappa(P,T)M_Z(P)
      +Charge_{\Delta u}(T)
      +Err(T).
      \]

      The old Original Height Dissipation Charge.A input is superseded for response height creation by the full-coefficient adjoint H -1 drain.


