      \subsection{R3 Exterior Dyadic Survivor Field Incompatibility}

      Let Q be the terminal CM test object selected by that survivor. If Q and M,Q are retained, then no fixed positive field scale >0 can satisfy M, ,Q .

      The only point to prove is that fixed positive field scale is incompatible with the dyadic survivor.

      Assume, toward contradiction, that M, ,Q holds for some fixed >0 and some M>s+2 . In the CM route, this means that the selected terminal packet has a positive-scale same-fluid readout window with a finite derivative tower through depth M . After choosing a smooth partition of unity subordinate to the retained -scale field windows, each localized piece f of the selected packet satisfies a uniform finite-depth bound

      The bounded-frequency lemma has already removed the fixed-band response, so the branch under consideration is the selected high-frequency packet. If a surviving piece is outside the retained material address, Q has failed. If it is detached from the same Navier--Stokes equation, pressure, viscosity, and source ancestry, M,Q has failed. On the branch currently under consideration, Pack and Part are retained, so the survivor must be seen inside the finite -scale Field windows.

      This closes the previous gap where the dyadic survivor was only described as a possible Pack/Field reading. It is now a first-face CM landing: no material address gives Pack failure; no same-fluid participation gives Part failure; retained Field-window evidence+Part forces Field failure.

      This argument does not use global H s , a BKM integral, or a continuation-grade Lipschitz bound. It uses only the installed exterior L 2 tightness, the prior dyadic-survivor reduction, the local meaning of retained Field-window evidence and Part, and the finite-depth derivative control supplied by the assumed Field face. The Field assumption is used only to reject the Field branch; it is not used to prove positive smoothness.


