    \subsection{Averaged Field-Face Admission}

    This records the averaged Jump avg admission bridge with the CM depth requirement and the separate same-tail SCF base modulus requirement made explicit.

    Pack Q is retained, so the terminal object has a positive same-fluid packet and bounded transported chart geometry. Part N,Q is retained, so the same Navier-Stokes pressure-viscosity tower participates through depth N. N is chosen at least as large as the finite depth needed to control the components in SCF base: velocity fluctuation, local gradient energy, pressure normalization, and the same-fluid frame terms.

    This depth requirement is already the intended CM witness depth in the paper: Field N,r,Q is a finite-depth one-field witness, and the local CKN-compatible SCF base packet uses only finitely many local velocity/pressure/frame quantities. Depth makes the components readable; it does not by itself prove the uniform small-scale SCF base modulus.

    By the manuscript definition, Field N,r,Q means that, after Pack Q and Part N,Q have fixed the packet and participation readings, one positive scale carries coherent field data through depth N on the same witness record.

    In ordinary terms, the selected terminal packet still reads as one Navier-Stokes field on a positive same-fluid scale. Neighboring velocity-tower and pressure-viscosity readings fit together instead of degenerating into incompatible terminal traces.

    The old proof step being spent here was stronger than finite-depth field coherence: it treated controlled scale-critical components as though they automatically gave a uniform small-cylinder SCF base gain. The exact replacement is a same-tail local modulus. On a retained terminal subtail T', define omega_SCF(rho) := sup_{z in T'} SCF_base(Q_rho^Phi(z)) and require lim_{rho downarrow 0} omega_SCF(rho)=0.

    The bound is on the same terminal witness record, not on a separate readout cover. If the modulus holds, choose r_* <= r with omega_SCF(r_*) <= epsilon_m. Then every point of T' has an SCF base-good same-fluid cylinder with radius r_*. Without this same-tail modulus, Field N,r,Q does not by itself imply Field avg(T).

    For this CM face landing, the Field admission bridge replaces the stronger h/F survivor-measure lower-bound demand only after the same-tail SCF base modulus is supplied. The h/F route may remain useful as a source-control or no-escape proof, but it is not required to consume Jump avg once the same admitted averaged tail has the conditional Field N,r,Q + SCFBaseLocalModulus_N => Field avg admission bridge.

    The remaining caveat is sharper than depth alone: the CM witness depth must be high enough to read the local SCF base components, and the branch must supply the same-tail small-scale modulus above. Until that modulus is proved from Field N,r,Q or added to the Field face, the admission theorem is conditional on it.


