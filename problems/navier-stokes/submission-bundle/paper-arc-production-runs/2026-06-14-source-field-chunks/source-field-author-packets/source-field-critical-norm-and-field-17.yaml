      \subsection{Clay problem Field Failure Realization Proof-Method Audit}

      Logical skeleton: contradiction by terminal same-fluid ontology, or direct positive-scale compactness.

      Historical failure mode: the noncollapse route asked for a positive readout scale, which is essentially the endpoint continuation readout. The realization route was smaller because it only had to prove that the all-scales Field failure is a real terminal trace incompatibility, so the installed Field-to-Part collapse can fire.

      That is a powerful positive theorem. A positive Field scale at depth N s, together with retained Pack and Part, feeds the H s, s>5/2, continuation readout. Proving this directly from original data would be continuation-strength unless the proof supplies a new compactness mechanism that is strictly weaker than the final readout.

      The historical check did not supply that mechanism. Dyadic survivors can remain at scales r j -> 0; endpoint compatibility theorems apply only after a positive readout cover exists; and downstream readout cannot be spent upstream to create the Field predicate.

      It does not try to produce a positive Field scale. It asks whether the already assumed all-scales Field failure is a realized same-fluid terminal Jump on the retained carrier, rather than a missing support theorem or unselected readout artifact.

      That contradicts the retained terminal Part hypothesis and excludes the retained-Pack/retained-Part Field face without proving a full positive-scale readout theorem.

      The historical proof-method instruction was to use the retained Pack carrier and retained Part tower to force the all-scales Field failure to be an actual incompatibility of neighboring terminal traces on one participating field record.

      This historical check prevents the proof from spending endpoint readout to manufacture the positive Field scale that endpoint readout needs. Its role here is support-only unless a named promoted row calls for this exact Field theorem.


