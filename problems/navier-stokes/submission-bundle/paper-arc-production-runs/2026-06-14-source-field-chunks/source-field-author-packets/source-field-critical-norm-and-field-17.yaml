      \subsection{Averaged Jump avg Field-Face Reduction Attempt}

      CM program target: prove Exit(Q):=not Member(Q) by landing the first failed witness face among Pack Q, Part N,Q , and Field N,r,Q . The retained averaged Jump avg branch is attacked only after the averaged object is admitted to the same CM test and the Pack/Part faces have not already failed.

      Let T be a terminal averaged tail in the averaged route, with fixed finite route parameter set and same-fluid atlas data.

      T is admitted to the Clay/CM witness test for the same Q atlas. Pack Q and Part N,Q are retained on that admitted object. Jump avg(T) holds in the branch-native averaged sense: every terminal subtail has inf r good = 0.

      The attempt uses a face-complement argument rather than a positive endpoint theorem.

      The averaged notes define Field avg(T) as the terminal positive-scale same-fluid SCF-good cover condition, and define Jump avg(T) as its complement: no terminal subtail carries a positive lower bound for r good. so Jump avg(T) already says the averaged terminal object has no surviving positive same-fluid coherence scale in the averaged endpoint row.

      so Jump avg(T) gives forall r > 0, not Field N,r,Q . With Pack and Part retained, this is the first available CM face failure and supports Exit(Q):=not Member(Q).

      The one-way implication is enough. A full equivalence between Field avg(T) and the averaged instance of Field N,r,Q would be stronger than needed.

      The h/F survivor-measure forcing route also remains unproved: the existing failed attempts do not show that persistent Jump avg forces nonzero terminal h/F survivor measure or separated positive scale-window mass. The argument avoids that stronger claim.

      In the older averaged-route frame, the averaged blocker was narrower than "prove branch-native h/F defect charge" for CM exit purposes.

      for the admitted averaged terminal object. Then Jump avg := not Field avg consumes the branch as forall r > 0, not Field N,r,Q and lands in the Field face.

      Strong positive no-escape burden: Jump avg forces nonzero h/F survivor measure with separated positive scale mass. Minimal CM face burden: Jump avg is admissible as failure of the Field N,r,Q face through Field avg.

