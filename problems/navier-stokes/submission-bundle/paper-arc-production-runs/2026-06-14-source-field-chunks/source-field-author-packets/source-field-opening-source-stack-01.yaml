      \subsection{Canonical-Center Atlas Admissibility Reduction}

      The stronger canonical-center localized-projector route needs one comparison
      before it can use a canonical projector field.  The installed PSJ+.22 estimates
      live on the original local packet windows, so the proof has to show that those
      windows are admissible for the canonical-center packet.  The missing input is
      exactly that admissibility theorem.

      \[
      \frac1{m_\ell}
      \int_{\Lambda_\ell}
      w_\ell(z)\,
      d_{\mathrm{proj}}\!\bigl(P_J(z),\widehat P_{J,\ell}(z)\bigr)^2
      d\mu_J(z)
      \le
      \varepsilon_\ell.
      \]

      \[
      \mathfrak a_{J,\ell}(z)
      :=
      d_{\mathrm{proj}}\!\bigl(
      \widehat P_{J,\ell}(z),\widehat P_J^{can}(z)
      \bigr)^2.
      \]

      \[
      \frac1{m_\ell}
      \int_{\Lambda_\ell}
      w_\ell(z)\,
      d_{\mathrm{proj}}\!\bigl(P_J(z),\widehat P_J^{can}(z)\bigr)^2
      d\mu_J(z)
      \le
      2\varepsilon_\ell
      \,
      \frac{2}{m_\ell}
      \int_{\Lambda_\ell}
      w_\ell(z)\,\mathfrak a_{J,\ell}(z)\,d\mu_J(z).
      \]

      \[
      d_{\mathrm{proj}}\!\bigl(P_J,\widehat P_J^{can}\bigr)^2
      \le
      2\,d_{\mathrm{proj}}\!\bigl(P_J,\widehat P_{J,\ell}\bigr)^2
      +
      2\,d_{\mathrm{proj}}\!\bigl(\widehat P_{J,\ell},\widehat P_J^{can}\bigr)^2.
      \]

      \[
      \int
      d_{\mathrm{proj}}\!\bigl(P_J(z),\widehat P_J^{can}(z)\bigr)^2
      d\mu_J(z)
      \le
      2\sum_\ell m_\ell\varepsilon_\ell
      +
      2\sum_\ell
      \int_{\Lambda_\ell}w_\ell(z)\,\mathfrak a_{J,\ell}(z)\,d\mu_J(z).
      \]

      The displayed inequalities show the reduction: canonical-center admissibility
      follows once the atlas controls the comparison defect \(\mathfrak a_{J,\ell}\).
      A Davis--Kahan projector comparison can supply this comparison from an
      operator-gap estimate between the local and canonical symmetric surrogates.
      That operator-gap estimate is the actual missing theorem.  The reduction pays
      carrier-selection support for the stronger atlas route.  Scalar source closure
      requires its own source packet and payment.


