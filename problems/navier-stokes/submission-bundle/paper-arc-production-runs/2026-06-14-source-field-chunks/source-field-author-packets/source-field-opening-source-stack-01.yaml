      \subsection{Canonical-Center Localized Projector Atlas Eliminates Overlap Mismatch}

      This is the stronger sufficient realization note for the localized-projector
      exact-potential branch. It explains what the canonical center-field atlas would
      buy and what it would leave untouched.

      The overlap wall comes from allowing the local atlas to carry different local
      PSD sections on overlapping windows.

      There is a stricter packet realization in which all overlapping windows use the same localized-projector section, built from one canonical measurable center field. On that realization, overlap mismatch vanishes identically.

      \[
      c_J:Z_J\to \mathbf R^3.
      \]

      \[
      w_{J}^{can}(z,p)
      :=
      \chi_J(z,p)\,
      \phi_r\!\bigl(c_J(z)-m_p(t)\bigr)\,
      \psi_\rho(z,p)\,
      \alpha(z,p),
      \]

      \[
      m_J^{can}(z)
      :=
      \int_{\mathcal P_J(z)} w_J^{can}(z,p)\,d\bar\nu_{J,z}(p),
      \]

      \[
      \widetilde S_J^{can}(z)
      :=
      \int_{\mathcal P_J(z)}
      w_J^{can}(z,p)\,P_J(z,p)\,d\bar\nu_{J,z}(p),
      \]

      \[
      \widehat P_J^{can}(z):=\Pi_{\max}\bigl(\widetilde S_J^{can}(z)\bigr).
      \]

      The redesign fixes the projector atlas rather than the scalar entrance/forcing
      packets.

      On this realization, the overlap-mismatch wall disappears for the projector
      atlas. The scalar entrance and forcing packets still keep their own burdens.
      Thus the localized-projector globalization channel closes only for the
      projector-overlap problem.  The scalar source route still needs its own packet,
      readout, or first-face payment.


