    text: |+
      \subsection{Clay problem Clay Breakdown Canonical Terminal Obstruction}

      Every finite same-surface Clay breakdown object from original smooth data is a canonical same-solution terminal obstruction eligible for Canonical Terminal Packet Capture.A.

      By the Clay breakdown assumption, W * comes from the maximal classical Navier-Stokes solution generated by the original smooth divergence-free datum. So the terminal object is attached to the same initial datum, not to a surrogate or replacement flow.

      On every preterminal interval [0,T *- ], the object is the original incompressible Navier-Stokes solution with the same velocity and pressure. Any regularized equation, altered force law, Euler comparison object, or external approximation is outside the finite same-surface Clay breakdown branch.

      \[
      \neg Pack_Q.
      \]

      The object left after removing legal boundary/cutoff/collar losses, non-selected branches, readout-only artifacts, and paid finite record terms is exactly the obstruction still claiming to be the finite terminal breakdown. That is the input object of Canonical Terminal Packet Capture.A.

      This theorem does not rule out the terminal exit. It proves that the alleged finite Clay breakdown cannot remain outside the CM contrapositive grammar. The terminal face failure is the contrapositive witness.


