    text: |+
      \subsection{Formal Part Closedness Lemma}

      \[
      \begin{aligned}
      Field_{N,r,Q}
      &+\mathfrak A_{N+1,Q}\in L^\infty\\
      &+Part_{N,Q}\text{ on compact preterminal subintervals}\\
      &\Longrightarrow
      Part_{N,Q}\text{ on the retained terminal tail.}
      \end{aligned}
      \]

      \[
      U_k=\nabla^k u,
      \qquad
      K_k=-\nabla^{k+1}p+\nu\Delta U_k,
      \qquad
      0\le k\le N,
      \]

      \[
      r(t)\ge r_*>0
      \]

      \[
      \mathfrak A_{N+1,Q}(t)
      \le M_A.
      \]

      The positive field scale keeps all finite-difference comparisons on cylinders
      whose radii are bounded below by \(r_*\).  The tower bound through depth
      \(N+1\) controls every velocity and pressure derivative entering the witness
      and every spatial increment needed for the jet-to-difference bridge.

      The witness data form an equibounded and equicontinuous finite family on the
      retained terminal cover.  By Arzela--Ascoli compactness, each witness quantity
      has a terminal-tail limit after passing to a late retained subtail.  Since
      \(Part_{N,Q}\) is a finite predicate in these witness quantities, it persists
      under this limiting operation.


