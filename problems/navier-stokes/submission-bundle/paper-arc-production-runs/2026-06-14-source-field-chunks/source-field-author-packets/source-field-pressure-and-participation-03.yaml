    text: |+
      \subsection{One-sided Negative-part Comparison and the Zeno Branch}

      The unconditional comparison is not discharged by the installed inputs.  ASAC
      advances the one-sided comparison past the old pair-weight obstruction, but the
      remaining no-free-sink branch is the terminal Zeno source-refill atom.

      This would give the negative-part comparison needed to turn signed cancellation into positive-source depletion.

      \[
      J_{e^*}=-J_e.
      \]

      \[
      (W_P-W_{P^-})J_e.
      \]

      The absolute flattening target is stronger than the positive source consumer needs. The needed one-sided positive pair-weight defect is

      \[
      \sum_e\int (W_P-W_{P^-})_+[J_e]_+dt.
      \]

      The pair-weight mismatch is no longer the live obstruction for the positive
      branch.

      After ASAC, projected-cutoff and boundary records, and finite donor/refill
      telescoping, the remaining bad case is an internal legal same-fluid donor sink
      feeding the terminal receiver.  That case is the Zeno source-refill branch, so
      the requested one-sided comparison follows conditionally from Zeno Source
      Residue Rigidity.A.

      The unconditional proof of the comparison would need to rule out a terminal
      source-refill branch with no earlier negative partner and no finite donor
      depletion.  Current inputs reduce that branch to the Zeno source-residue
      rigidity problem; they do not prove the rigidity theorem itself.

      The unconditional installation fails from current materials. The remaining route is active- / scale-critical tree Carleson reserve, or a new non-Carleson temporal anti-concentration theorem for the Zeno source residue.


