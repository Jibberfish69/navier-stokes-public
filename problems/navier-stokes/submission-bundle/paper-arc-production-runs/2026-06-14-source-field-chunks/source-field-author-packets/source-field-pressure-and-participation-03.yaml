      \subsection{Localized positive-strain depletion on selected active windows}

      This would imply Local Source.No Pulse.A and feed the source-pulse closure chain.

      The active local source has a principal strain-production form. On a selected active packet, positive contribution occurs when the active shell aligns with an expanding eigen-direction of the symmetric strain. The installed energy, pressure, incompressibility, and dyadic exchange identities do not prevent that alignment on the same terminal bad windows.

      \[
      \int G\text{ small} \nRightarrow \int G_+\text{ small}
      \]

      \[
      S_{pack,Q}\in L^1(0,T_*)\Longrightarrow \Gamma_{pack,Q}\in L^\infty(0,T_*).
      \]

      This is a valid consequence after an L 1 tL x positive-strain bound is known. The missing theorem is exactly that bound, or a directional version along the active stretching vector.

      Local Strain Depletion.A is not discharged from current materials. The branch advances to the coherence theorem Terminal Source Coherence.A, which is the precise next supplier for positive-source depletion.


