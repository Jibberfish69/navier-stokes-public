      \subsection{Pressure-source Upper Bound for the SCF Charge}

      This subsection records the installed upper-bound side for the final analytic
      charge in the Jump avg no-escape route.

      Let
      \[
        \mu_D:=|\nabla u|^2\,dx\,dt,
        \qquad
        \mu_{P,\chi}:=|p^{\mathrm{loc}}_\chi|^{3/2}\,dx\,dt,
      \]
      where \(\chi\) ranges over the finite transported cutoff atlas.  The analytic
      charge used here is
      \[
        \nu_{\mathrm{SCF}}:=\mu_D+\sum_\chi \mu_{P,\chi}.
      \]

      The \(h/F\) survivor charge remains a separate candidate object until a
      comparison theorem relates it to \(\nu_{\mathrm{SCF}}\).  The present upper
      bound uses only \(\nu_{\mathrm{SCF}}\).

      \[
        \int |\nabla u|^2\,dx\,dt<\infty.
      \]

      On each transported cutoff chart, split the pressure into a local part and a
      harmonic tail.  The local part solves the standard localized pressure equation
      driven by the localized quadratic velocity tensor.  Calderon-Zygmund estimates
      and finite-energy bounds give
      \[
        \int |p^{\mathrm{loc}}_\chi|^{3/2}\,dx\,dt<\infty.
      \]
      Hence \(\nu_{\mathrm{SCF}}\) is a finite positive Radon measure on the terminal
      atlas domain.  If the terminal windows \(\{Q_i\}\) have overlap at most
      \(\Omega\), measure subadditivity with bounded overlap gives
      \[
        \sum_i \nu_{\mathrm{SCF}}(Q_i)
        \le
        C_{\mathrm{atlas}}
        \left(\mu_D(\Omega_T)+\sum_\chi\mu_{P,\chi}(\Omega_T)\right)<\infty.
      \]
      Atlas and geometry constants are absorbed into \(C_{\mathrm{atlas}}\).  This is
      the pressure/source upper bound for the final chosen analytic charge.

      The upper side for the final \(\nu_{\mathrm{SCF}}\) charge is installed
      conditionally on the standard finite-atlas, bounded-overlap, local-pressure
      setup.

      The existing lower-attempt note remains open because Jump avg is a full
      SCFBase radius-collapse object, while \(\nu_{\mathrm{SCF}}\) tracks only
      analytic pressure-dissipation mass.


