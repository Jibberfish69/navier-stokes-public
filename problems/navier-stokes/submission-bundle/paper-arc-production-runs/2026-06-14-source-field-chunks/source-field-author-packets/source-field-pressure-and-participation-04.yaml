      \subsection{Pressure Readout Through All Endpoint Rungs}

      The endpoint readout has to control both pieces of the forcing rung

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q,
      \qquad 0\le q\le N.
      \]

      The velocity part is the easier half.  The term \(\Delta U_q\) is read from the
      \(U_{q+2}\) slot of the same finite-depth tower.  This is the reason the
      readout depth is chosen with two spare derivatives:

      \[
      m\ge N+2.
      \]

      The pressure part is local after the readout cover has been produced.  Fix one
      cover element

      \[
      \overline{B_i'}\subset B_i\subset 2B_i,
      \]

      and choose a cutoff \(\chi_i\in C_c^\infty(2B_i)\) with \(\chi_i=1\) on
      \(B_i\).  On this element split the pressure into a local Poisson part and a
      harmonic remainder:

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b).
      \]

