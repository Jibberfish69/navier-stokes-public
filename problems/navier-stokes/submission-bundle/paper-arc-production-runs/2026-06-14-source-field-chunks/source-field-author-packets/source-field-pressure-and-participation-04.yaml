      \subsection{Pressure Source Time-Face Spread Test}

      This test asks whether pressure/eigenframe sustain forces the native source
      residue to occupy a genuine time slab before the terminal face.  A useful spread
      estimate would have the form

      \[
      \mu_m^{src}(B_R\times[-\varepsilon,0])
      \le
      \omega_R(\varepsilon)+o_m(1),
      \qquad
      \omega_R(\varepsilon)\downarrow0
      \quad(\varepsilon\downarrow0),
      \]

      or any equivalent super-\(L^1_t\) source-marginal gain strong enough to rule out
      a terminal atom.

      Pressure recovery is elliptic at each time.  It sees the instantaneous terminal
      source geometry, while carrying no automatic time-spreading information.  The
      model concentration

      \[
      d\mu_m^{src}(y,s)
      =
      \rho(y)m\mathbf 1_{(-1/m,0]}(s)\,dy\,ds
      \]

      can have a nontrivial pressure/eigenframe trace while its time marginal converges
      to \(\rho(y)\,dy\otimes\delta_{s=0}\).  Even an absolute-continuity relation
      \(\mu_*^{press}\ll\mu_*^{src}\) only binds the pressure residue to the same
      carrier; it does not create temporal residence.

      The installed pressure-Hessian and eigenframe tools control signed near-band
      sustain.  They do not imply super-\(L^1_t\) time integrability of the native
      positive source measure.  Pressure-source time-face spreading remains a named
      open requirement rather than a discharged pressure route.


