      \subsection{Pressure Source Supplier, Line by Line}

      The pressure supplier used in the previous bridge is the concrete estimate for
      that bridge.  On each annular or packet element, the pressure oscillation is
      split into a local quadratic source and a far-field/gauge remainder:

      \[
      \|p-c_k\|_{L^2(A_k)}
      \le C\|u\otimes u\|_{L^2(A_k^*)}+F_k.
      \]

      The mixed shell contribution is summable by Cauchy--Schwarz:

      \[
      \sum_k2^{(2a-1)k}\|u\|_{L^4(A_k^*)}^2\|u\|_{L^2(A_k)}
      \le
      \left(\sum_k2^{2ak}\|u\|_{L^4(A_k^*)}^4\right)^{1/2}
      \left(\sum_k2^{(2a-2)k}\|u\|_{L^2(A_k)}^2\right)^{1/2}.
      \]

      The finite readout net records the pressure-reduced piece and the pressure force
      piece at each selected center:

      \[
      \mathcal N_{N,\rho,\psi}^{src,\varepsilon,press}(t;I)
      =
      \sum_{\ell=1}^{M_\varepsilon}
      \Big(|\mathcal P_N^{red}(\eta^\ell,t;\psi)|+|\mathcal F_N^{press}(\eta^\ell,t;\psi)|\Big).
      \]

      The corresponding returned-receiver pressure carrier is

      \[
      \mathfrak Q_{N,\rho,\psi}^{press,RR,\varepsilon,\alpha}(t;I)
      =
      \sum_{\ell=1}^{M_\varepsilon}
      \mathfrak Q_{N,\eta^\ell}^{press,loc,src,RR,\alpha}(t).
      \]

      The local pressure estimate, the finite overlap of the net, and the widened
      collar companion give the pointwise bound

      \[
      \mathfrak Q_{N,\rho,\psi}^{press,RR,\varepsilon,\alpha}(t;I)
      \le
      C\big(1+\mathfrak C_{N+1,\rho,\psi}^{\delta+4\Lambda_{\delta,\rho}^{halo}}(t)\big)
      \big(M_\varepsilon+
      \mathfrak H_{N,\rho,\psi}^{press,loc,4\Lambda,\varepsilon,\alpha}(t;I)
      \big).
      \]

      This line-by-line supplier is the accounting step that lets the pressure bridge
      use the returned receiver collar.  The nonpressure source terms have their own
      direct estimates, and the pressure terms above are the additional payment needed
      to put the selected source route under the strengthened closure.


