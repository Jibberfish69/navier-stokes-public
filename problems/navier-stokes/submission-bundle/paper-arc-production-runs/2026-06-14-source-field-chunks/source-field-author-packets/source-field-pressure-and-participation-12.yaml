      \subsection{Clay problem Source Pulse Pressure-Vortex Depletion Final Audit Note}

      The pressure/vortex-stretching audit asks whether the Navier-Stokes pressure and stretching structure already forbids terminal source-balanced active pulses.

      If this were installed, it would supply the missing positive-part strain depletion needed by Source Pulse Exclusion.A.

      \[
      \partial_t\omega + u\cdot\nabla\omega - \nu\Delta\omega = S\omega,
      \]

      \[
      \frac12\frac{d}{dt}\|\omega\|_2^2
      +\nu\|\nabla\omega\|_2^2
      =
      \int \omega\cdot S\omega.
      \]

      Pressure has already disappeared after curl. The pressure Poisson equation recovers nonlocal Calderon-Zygmund control of the strain/pressure Hessian, but it does not impose a sign on the local stretching term.

      \[
      S=\mathrm{diag}(2,-1,-1),
      \qquad
      \omega=(1,0,0),
      \]

