      \[
      \neg Pack_Q(\mathcal W).
      \]

      Assume Pack Q survives. The pressure must remain the pressure of the same Navier-Stokes solution. The local Poisson equation, harmonic tail, velocity source, viscosity, and time ancestry must all remain in the same participation record. If this pressure law detaches from the selected packet, then

      \[
      \neg Part_{N,Q}(\mathcal W).
      \]

      \[
      \forall\rho>0\,\neg Field_{N,\rho,Q}(\mathcal W).
      \]

      If some Field N,rho,Q survives, the local Poisson pressure and admissible far-field harmonic tail are controlled in the same terminal packet. The continuation readout survives, contradicting the pressure terminal wall.


