      \subsection{Finite Energy Point-Pressure Derivative Obstruction}

      \[
      \text{finite energy}
      +
      -\Delta p=\partial_i\partial_j(u_i u_j)
      \quad\not\Longrightarrow\quad
      \text{point-center pressure derivative bounds.}
      \]

      It is not a statement about every possible Navier-Stokes upgrade. It only rules out the estimate whose only inputs are finite kinetic energy and the pressure Poisson equation.

      \[
      -\Delta p=\partial_i\partial_j(u_i u_j),
      \]

      \[
      |\nabla p(0)|\le F(\|u\|_{L^2(T^3)}).
      \]

      \[
      u_N(x_1,x_2,x_3)
      =
      (\cos(Nx_2),\ \sin(Nx_1),\ 0).
      \]

      \[
      \nabla\cdot u_N
      =
      \partial_{x_1}\cos(Nx_2)+\partial_{x_2}\sin(Nx_1)
      =0.
      \]

      Thus u N L 2 stays fixed while | p N(0)| tends to infinity. No estimate of point pressure derivatives can follow from finite energy and the pressure Poisson equation alone.


