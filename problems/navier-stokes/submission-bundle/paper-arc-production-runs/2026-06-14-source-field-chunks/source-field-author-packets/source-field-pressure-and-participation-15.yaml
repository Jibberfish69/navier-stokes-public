    text: |+
      \subsection{Clay problem Generic Part-Face Exclusion Work Order Demotion}

      The later referee audit is the controlling local authority for the current CM referee gate. It says the active gate is finite-obstruction inventory coverage, not a generic proof that Exit(Q) or a first Part face is inadmissible.

      An alleged finite terminal obstruction O is the object under test. CM-test entry means that O has been put into the same-solution terminal packet tree after legal losses, readout artifacts, non-selected branches, and paid finite records have been removed.

      It is not itself a contradiction with the finite-breakdown branch. In the CM pass/fail engine, the fail branch is supposed to become a typed exit branch once a concrete Pack/Part/Field face failure has been derived.

      Thus the old generic Part work order is too broad. It asks for a continuation-strength no-defect theorem when the current CM referee standard only requires a named promoted obstruction row to be certified at its correct first face.

      That is a certified face failure for that selected row. The raw terminal source residue row is also certified at Pack/Part: when the carrier survives, an unpaid native residue is a participation defect, hence a Part face. The retained pressure package note gives the same placement rule: a pressure package is either a Part failure, pass-side receiver support after Part survives, or a Field issue after Pack and Part have already been licensed.

      The June 5 finite-obstruction row audit then split the local L 3 Duhamel-mass branch from generic public-critical support and recorded the local row as seated in Pack/Part/legal alternatives, with a Field row only after retained Pack and Part.

      So, on the currently promoted finite-obstruction inventory, there is no generic uncovered Part theorem row. There are named rows, and the named rows that carry proof mass have either been certified at Pack/Part/Field or demoted from proof-bearing state.

      Future Part checks remain possible only after a named row creates them. The burden must be named.

      Retained Pack Original Ancestry Part Survival.A remains a failed generic no-defect theorem, not the current local proof target. The current Part standard is row-level certification: named promoted obstruction rows must either land at not Part N,Q after Pack Q, pass through Part N,Q and continue to the next face, or be demoted as non-proof support. Under the newer referee audit, no current promoted surface leaves a generic Part face-exclusion blocker open.

      This historical authority-conflict note records why the old generic Part face-exclusion work order is stale relative to the June 3 target correction and the current finite-obstruction inventory referee audit.


