    text: |+
      \subsection{Global Tail Branch Decision Result}

      Global selector statements using smooth Littlewood--Paley cutoffs need an
      explicit convention for the off-core kernel tail.  The tail estimate is

      \[
      \|(P_{\le j}v)_{tail}\|_{W^{1,\infty}}
      \le
      C_{N,s}2^jR^{-N}\|Y\|_{H_D^s}.
      \]

      For arbitrary active readout size, the default branch folds the tail into the
      ledger:

      \[
      \Phi_{tail,*}
      :=
      \Phi_*
      +\theta_{tail}C_{N,s}2^jR^{-N}\|Y\|_{H_D^s},
      \]

      and the final global amplitude/speed and collar theorems use
      \(\Phi_{final}:=\Phi_{tail,*}\).

      There are two specializations.  For bounded active tests with
      \(\|Y\|_{H_D^s}\le B_Y\), one may choose \(R\) so that

      \[
      C_{N,s}2^jR^{-N}B_Y
      \le
      C\Phi_*(\mathcal E_D(X)).
      \]

      For a theorem that allows a test-dependent selector radius, choose

      \[
      R_j(Y,X)^N
      \ge
      C_{N,s}2^j\|Y\|_{H_D^s}\Phi_*(\mathcal E_D(X))^{-1}.
      \]

      Thus the default manuscript route is explicit tail-ledger inclusion, with
      bounded-test and active-radius branches recorded as narrower alternatives.


