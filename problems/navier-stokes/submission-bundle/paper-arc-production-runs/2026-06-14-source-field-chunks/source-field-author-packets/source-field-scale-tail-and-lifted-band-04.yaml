      \subsection{Flux-Source Carleson Bound Result}

      The source estimate needed here would make the nonlinear shell flux small
      relative to dissipation on the selected interval.  Its desired form is
      \[
      \int_I |F_j(t)|dt
      \le
      \varepsilon\nu\int_I D_j(t)dt+C2^{-2\delta j},
      \]
      where \(F_j\) is the nonlinear shell flux in
      \[
      dE_j(t)+c\nu D_j(t)dt\le F_j(t)dt.
      \]

      The unweighted dyadic exchange has exact antisymmetry:
      \[
      \langle \Delta_j(a_k\cdot\nabla\Delta_\ell u),\Delta_j u\rangle
      +
      \langle \Delta_\ell(a_k\cdot\nabla\Delta_j u),\Delta_\ell u\rangle=0.
      \]

      After shell weights are inserted, that cancellation leaves a weighted exchange
      defect. A source-Carleson proof would need a signed commutator estimate together
      with a residual-tail summation:
      \[
      \big|\langle [\Delta_j,a_k\cdot\nabla]\Delta_\ell u,\Delta_j u\rangle\big|
      \le C_{\mathrm{sf},7726}
      2^{-c(\ell-j)}2^{3k/2}\|\Delta_k u\|_2D_\ell,
      \]

      \[
      \sum_j2^j\mathcal R_{j,lift}^\sigma
      \le C_{\mathrm{sf},7732}
      \varepsilon\sum_k2^k(\mathcal D_k^{\uparrow,\beta})^2
      +C_\varepsilon\sum_{k>N}D_k.
      \]

      The current source-control notes reduce four branches to the same atom.  The
      commutator route, the residual-tail route, monotone source dominance, and direct
      active-shell normalization all ask for \(SOURCE.NO\text{-}PULSE.A\).  In this
      branch language, that atom says that original smooth data rules out a nonlinear
      shell-flux pulse balanced exactly against active shell dissipation.  The present
      inputs do not prove that atom.  This subsection is support
      and diagnosis: it identifies the source wall; it is not an installed
      flux-source Carleson theorem.


