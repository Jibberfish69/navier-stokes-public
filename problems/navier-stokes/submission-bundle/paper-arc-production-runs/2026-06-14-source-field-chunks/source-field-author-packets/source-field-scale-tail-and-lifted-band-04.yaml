    text: |+
      \subsection{Flux-Source To Active-Square Carleson Result}

      The next attempted implication asks whether source mass control already gives
      active-square control:
      \[
      \int_I |F_j(t)|dt
      \le
      \varepsilon\nu\int_I D_j(t)dt+C2^{-2\delta j}
      \]

      \[
      \int_I2^{-j}D_j(t)^2dt
      \le
      \varepsilon\nu2^{2j}|I|+C2^{-2\delta j}.
      \]

      \[
      2^{-j}D_j^2=2^{3j}E_j^2.
      \]

      \[
      E_j^2\le C_{\mathrm{sf},7771} \nu2^{-j}
      \]

      \[
      E'(t)+c\nu2^{2j}E(t)=F(t).
      \]

      The source estimate has the same scale as the dissipation term. In the scalar
      damped model, a steady state \(E(t)=A\) is maintained by
      \[
      F(t)=c\nu2^{2j}A,
      \qquad
      D(t)=2^{2j}A.
      \]
      The source budget can allow a fixed amplitude \(A\), while the active-square
      term demands
      \[
      A^2\le C_{\mathrm{sf},7788} \nu2^{-j}
      \]
      on active heat-scale intervals.

      This is the reason the implication fails at this resolution. Source mass control
      does not by itself supply a shell-amplitude gain, a heat-scale \(L^2_t\) gain for
      \(F_j\), or a direct active-square Carleson theorem. LPAS remains blocked at the
      active-square level unless one of those stronger inputs is proved.


