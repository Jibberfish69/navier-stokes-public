      \subsection{Fixed-Collar Shell-Shift Lemma}

      This lemma is only bookkeeping, but it prevents a common false shortcut. A fixed
      collar width \(M\) shifts the dyadic tail from \(N\) to \(N-M\). That shift is
      finite, but the finite strip still carries threshold-scale weights.

      \[
      E_N(t):=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      \[
      E_{N-M}(t)
      \le
      E_N(t)+\sum_{N-M\le j<N}2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2,
      \]

      \[
      D_{N-M}(t)
      \le
      D_N(t)+\sum_{N-M\le j<N}2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      This is just the definition of the shifted tails. The useful warning is the
      boundary: the finite strip \([N-M,N)\) is not automatically lower-order. Any
      absorption of that strip into a threshold budget has to come from the surrounding
      packet argument on the theorem surface where the collar arises.


