    text: |+
      \subsection{Gradient Cubic-Tail Absorption Lemma}

      The cubic-tail absorption pays the genuine high-high slot.  After the low-mode
      and spill pieces are separated, the near-diagonal high-high packet satisfies

      \[
      D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
      \]

      \[
      \|\nabla u(t)\|_2^2\le Q_1
      \qquad\text{for a.e. }t.
      \]

      \[
      \mathfrak H_N^{grad,HH}[u](t)
      \le
      C_M\sum_{j\ge N-M}2^{\frac92j}\|\Delta_j u(t)\|_2^3.
      \]

      The enstrophy component of \(Q(t)\) gives

      \[
      2^{\frac12j}\|\Delta_j u(t)\|_2
      \le
      2^{-\frac12(N-M)}Q_1^{1/2},
      \qquad j\ge N-M.
      \]

      Choosing \(N\) large enough absorbs the cubic packet:

      \[
      \mathfrak H_N^{grad,HH}[u](t)
      \le
      \frac{\eta\nu}{2}D_N(t).
      \]

      So the genuine high-high packet is closed.  This does not close the lifted
      high-side remainder, because that remainder has different shell geometry.


