      \subsection{Active-shell amplitude gain for nu SCF Carleson - hard obstruction}

      This is the hard obstruction behind the direct active-Carleson theorem for
      \(\nu\)-SCF on terminal same-fluid windows.

      In shell language, the shell energy amplitude must decay at the active scale
      fast enough to make the active density summable.

      Energy dissipation gives finite raw mass. Flux/source estimates give source
      mass or signed exchange control. Those estimates still allow short pulses or
      steady active-shell amplitudes at shrinking scales. Such amplitudes preserve
      finite raw mass while breaking the scale-normalized Carleson sum.

      The active-shell amplitude gain remains open. The obstruction is structural:
      finite energy, dissipation, and source-mass bounds allow active-scale
      concentration unless an additional heat-scale source, amplitude-decay, or
      monotone-dominance theorem is proved.

      This is the deepest exposed analytic target for deriving that Carleson estimate
      from Original Smooth Data.


