      \subsection{Aact Kx Constants Scale Bookkeeping}

      Fix the endpoint depth N required by the endpoint matrix and the continuation readout. Choose

      \[
      m\ge N+2.
      \]

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q,\qquad q\le N.
      \]

      Fix the finite route parameter set \(P_{req}\) and a same-fluid distortion
      bound \(M_{sharp}\) on the terminal cover.

      \[
      C_*(2\eta_X)^{1/2}\le c_\nu/4.
      \]

      \[
      X_{\theta_m R}(s)\le \eta_X.
      \]

      \[
      r_*:=\min_i r_i>0.
      \]

      This lower radius belongs to terminal readout and finite-cover uniformity. It
      is chosen after \(Field_{avg}\) and before global summation.

      The quantities \(SCF^{base}\), \(X_R\), \(N_R\), \(B_R\,dt\), and \(F_R\,dt\)
      are scale-normalized. All local estimates use radius-free constants after
      parabolic normalization.

      Finiteness of the cover and of \(P_{req}\) gives \(B_*,F_*\in L^1\). Absolute
      continuity then gives a common scheduler partition.

      All local estimates are scale-invariant, and all terminal-cover constants enter
      only through finite-cover summation and readout.


