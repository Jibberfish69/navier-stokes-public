      \subsection{Littlewood-Paley Tail Control Choice Result}

      The tail estimate has three bookkeeping choices. The analytic decay is standard;
      the real issue is what the proof wants to keep fixed.

      \[
      \|(P_{\le j}v)_{tail}\|_{W^{1,\infty}}
      \le
      C_{N,s}2^jR^{-N}\|Y\|_{H_D^s}.
      \]

      \[
      \|(P_{\le j}v)_{tail}\|_{W^{1,\infty}}
      \le
      C\Phi_*(\mathcal E_D(X)).
      \]

      \[
      \|Y\|_{H_D^s}\le B_Y
      \]

      \[
      C_{N,s}2^jR^{-N}B_Y
      \le
      C\Phi_*(\mathcal E_D(X)),
      \]

      \[
      R_j(Y,X)^N
      \ge
      C_{N,s}2^j\|Y\|_{H_D^s}\Phi_*(\mathcal E_D(X))^{-1}.
      \]

      Branch A keeps the lower-order record clean and pays by letting the collar
      radius depend on the active test. Branch B keeps a fixed radius for arbitrary
      amplitudes by putting the tail size into the record. Branch C is the stable
      global selector choice: it fixes the selector independently of \(Y\) and
      records the tail contribution explicitly.

      The status is bookkeeping support. The local collar route may use Branch A for
      normalized or bounded tests. The global arbitrary-amplitude readout uses Branch
      B or Branch C, with Branch C preferred when the selector has to remain fixed.


