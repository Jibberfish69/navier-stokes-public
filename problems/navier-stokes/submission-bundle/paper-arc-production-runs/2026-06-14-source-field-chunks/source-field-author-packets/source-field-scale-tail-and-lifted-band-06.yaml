      \subsection{Low-Pass Commutator Collar Closure Result}

      The coherent coefficient side of the low-pass commutator collar estimate closes
      through the selector-persistent amplitude/speed gate and its supplier hierarchy.

      \[
      \boxed{
      \|\nabla C_{i,j}[X;Y]\|_\infty
      \le
      \varepsilon\nu2^{2j}\|Y\|_{H_D^s}
      +
      C_\varepsilon\Phi_*(\mathcal E_D(X)).
      }
      \]

      \(\Phi_\star\) is either the original lower-order record or the extended
      low-shell record \(\Phi_{\mathrm{low}}\).

      The estimate is the product of three already named inputs: the amplitude bound,
      Bernstein strain conversion, and finite high-collar multiplier conversion:

      \[
      \|\nabla C_{i,j}[X;Y]\|_\infty
      \le
      \varepsilon\nu2^{2j}\|Y\|_{H_D^s}
      +
      C_\varepsilon\Phi_*(\mathcal E_D(X)).
      \]

      \[
      K_{i,j}(t)\subseteq\mathcal P_j(t),
      \qquad
      w_j=1\text{ on }\mathcal P_j(t).
      \]

      The weighted branch supplies either the unweighted speed conversion or the
      weighted-principal collar closure with zero residual.

      The remaining global choices are the superlinear non-Osgood energy branch and
      the original-versus-low record decision.


