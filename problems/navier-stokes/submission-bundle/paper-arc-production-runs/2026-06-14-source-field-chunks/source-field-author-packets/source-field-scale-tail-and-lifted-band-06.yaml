    text: |+
      \subsection{Littlewood-Paley Tail Estimate For Active Readout Result}

      The active-readout tail estimate is the kernel calculation behind the previous
      choice.

      \[
      \|\widetilde Q_i(P_{\le j}v)_{tail}\|_{W^{1,\infty}}
      \le
      C\Phi_*(\mathcal E_D(X)).
      \]

      \[
      P_{\le j}f(x)=\int 2^{3j}K(2^j(x-y))f(y)\,dy,
      \qquad K\in\mathcal S.
      \]

      Let \(\mathfrak C_j(t)\) be the persistent carrier core, and assume the active
      input \(v\) is supported in \(\mathfrak C_j(t)\). Let

      \[
      \mathfrak C_{j,R}(t):=\mathfrak C_j(t)^{+R2^{-j}}.
      \]

      \[
      (P_{\le j}v)_{tail}
      :=(1-\mathbf 1_{\mathfrak C_{j,R}})P_{\le j}v.
      \]

      \[
      |K(z)|+|\nabla K(z)|\le C_N(1+|z|)^{-N}.
      \]

      Multiplication by the bounded localizer \(\widetilde Q_i\) changes only the
      fixed constant when the \(W^{1,\infty}\) size of \(\widetilde Q_i\) is
      controlled at the active scale.

      A fixed-radius core gives uniform tail smallness only for a bounded active
      class. Full arbitrary-amplitude readouts require normalized testing, an
      active-radius choice, or an explicit tail-size term in the lower-order record.
      This proves the tail estimate used by the bookkeeping choice; it does not
      change the lifted-band obstruction.


