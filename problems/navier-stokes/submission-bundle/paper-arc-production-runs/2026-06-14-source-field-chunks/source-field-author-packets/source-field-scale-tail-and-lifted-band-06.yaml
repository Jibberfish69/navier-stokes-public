      \subsection{Low-Mode Product Closure From Duhamel And Installed Tail-Square}

      This is the conditional closure once the two missing suppliers are present.

      \[
      \Lambda_N=\Lambda_N^{tail}+\Lambda_N^{low},
      \qquad
      \Lambda_N^{low}:=\Lambda_N^{lin}+\Lambda_N^{low-low}.
      \]

      \[
      \Lambda_N^{tail}E_N
      \le
      \varepsilon_1\nu D_N+C_{\varepsilon_1}2^{-2N}E_N^2.
      \]

      \[
      2^{-2N}E_N^2\le \varepsilon_2\nu D_N.
      \]

      \[
      \int_I E_N(t)\Lambda_N^{low}(t)dt
      \le
      \varepsilon_3\nu\int_I D_N(t)dt+C\,2^{-2\delta N}.
      \]

      \[
      \int_I\Lambda_N(t)E_N(t)dt
      \le
      \varepsilon\nu\int_I D_N(t)dt+C_\varepsilon2^{-2\delta N}.
      \]

      Choose the tail-square constants so the high-frequency contribution consumes at
      most half of the available dissipation budget. The finite-mode part consumes
      the remaining half through the terminal coefficient-measure theorem.

      The low-mode product closes on terminal windows after the installed tail
      reserve and the finite-mode coefficient-measure theorem are both available.


