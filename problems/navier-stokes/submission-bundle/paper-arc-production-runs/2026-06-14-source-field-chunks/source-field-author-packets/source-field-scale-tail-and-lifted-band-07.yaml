      \subsection{Active shell source normalization: onward commutator tail split}

      This continuation from Active Shell Source Normalize.A reduces the branch to two
      source-wall obligations.  The lifted commutator tail has the form

      \[
      G_N^{lift,\sigma}=\sum W_{j,\ell}^{\sigma}R_{j,k,\ell}^{lift}.
      \]

      The first obligation is signed partner or donor-sink depletion along the
      terminal source-current edges.  In packet notation this is the active strain
      source

      \[
      2^{2j}\sum_P\langle S_k(x_P,t)e_P,e_P\rangle |c_P(t)|^2.
      \]

      The second obligation is the shellwise active residual tail.  The target ledger
      is

      \[
      \int_I\sum_{j\ge k}2^{-j}D_j(t)^2\,dt,
      \]

      with the local absorption form

      \[
      2^{-j}D_j(t)^2\le \varepsilon\nu D_j(t)+r_j(t)
      \]

      and a summable residual \(r_j\).  The first obligation pays the signed-partner
      loss.  The second obligation pays the shellwise active residual tail.

      The branch remains open because both obligations meet the same terminal source
      wall.  The visible atoms are terminal signed-partner saturation and active-shell
      amplitude gain.  Source normalization has clarified the bill; it has not paid
      it.


