      \subsection{Anti Beltrami Carleson.A from Original Smooth Data}

      A pure Beltrami or single-helicity packet can have strong cancellation. Its projected self-interaction can collapse to a pressure gradient or to a non-active contribution.

      That cancellation example does not give a theorem for arbitrary terminal active
      windows.  The live branch concerns active packets that remain non-Beltrami
      enough to feed source while evading signed reserve and active- records.

      Original Smooth Data gives no theorem forcing selected same-fluid terminal active packets into Beltrami or single-helicity alignment.

      Helical decomposition alone also fails as a sign theorem. Mixed helical interactions can transfer energy between shells, and current route inputs have no quantitative bridge making the anti-Beltrami defect Carleson-small on Jump avg bad windows.

      Anti Beltrami Carleson.A remains a possible proof language only.  The missing
      theorem would have to say that, on the retained same-fluid terminal family, the
      non-Beltrami active part has a Carleson-small contribution to the source
      carrier.  No installed input supplies that statement from original smooth data.

      The Beltrami/helical branch remains open and route-equivalent to Source Pulse Exclusion.A at current resolution.


