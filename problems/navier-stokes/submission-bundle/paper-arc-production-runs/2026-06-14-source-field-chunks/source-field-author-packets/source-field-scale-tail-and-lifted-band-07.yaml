      \subsection{Active residual-tail theorem - failed discharge}

      This failed discharge tests active residual-tail control strong enough to close
      the positive-carrier fallback and the nonlinear shell-flux route.

      The estimate is useful for threshold-collar products and cumulative tail
      estimates, but it is not the same as shellwise active control.

      The active residual asks for dissipation density on each active shell.
      First-moment dissipation and cumulative tail reserve permit short
      high-amplitude active-shell pulses. The residual-tail theorem must exclude
      those pulses, which requires source normalization, monotone source domination,
      active-shell amplitude gain, or direct active control.

      Thus the missing input remains nonlinear shell-flux/source control strong
      enough to rule out source-balanced active pulses.


