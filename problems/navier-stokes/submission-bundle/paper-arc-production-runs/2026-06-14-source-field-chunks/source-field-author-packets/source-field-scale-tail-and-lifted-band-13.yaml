    where mathcal N R is the localized nonlinearity and mathcal C m,R contains cutoff commutators. The nonlinear terms are controlled by the already established lower-order bounds and the high-tail dissipation. The pressure terms are controlled by local Calderon-Zygmund/Schauder estimates plus the pressure-tail theorem. The cutoff commutators are supported in B 2R B R and are bounded by the localized shell-tail and exterior-tail budgets.

    \[
    \sup_{t\le T}\|u(t)\|_{H^s(B_R)}<\infty.
    \]

    The local H s estimate is reconstructed from the whole-space shell-tail theorem, pressure-tail control, and finite low-mode parabolic bootstrap.

    This theorem is local in space. The exhaustion theorem supplies the passage from local estimates and exterior tightness to a global whole-space solution.


