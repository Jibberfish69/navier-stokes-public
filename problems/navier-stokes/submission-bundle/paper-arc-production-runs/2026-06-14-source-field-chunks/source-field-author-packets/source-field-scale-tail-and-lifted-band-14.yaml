    \int_I 2^{-j}D_j(t)^2\,dt.
    \]

    First moment does not control density on shrinking active intervals. A model pulse with height A/h on an interval of length h has first moment A, while its moment is A 2/h. Thus short source-balanced active pulses are invisible to first-moment dissipation but fatal to active- control.

    \[
    2^{-2N}E_N(t)^2\le C_{\mathrm{sf},29780} \nu D_N(t).
