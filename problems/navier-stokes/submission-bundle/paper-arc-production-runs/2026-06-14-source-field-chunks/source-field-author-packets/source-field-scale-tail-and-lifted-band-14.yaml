    That reserve is useful for threshold-collar and cumulative-tail products. It does not control the shellwise -dissipation measure

    \[
    \sum_{j\ge N}2^{-j}D_j(t)^2\,dt.
    \]

    So the reserve cannot be promoted into Active Square Residual Tail.A without an additional active-shell amplitude gain or -source theorem.

