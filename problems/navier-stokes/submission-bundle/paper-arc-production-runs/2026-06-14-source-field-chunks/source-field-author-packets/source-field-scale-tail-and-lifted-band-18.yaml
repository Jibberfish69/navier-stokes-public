    Conclusion: Pressure Tail Hardy Transported Shells.A remains an external geometric pressure-tail theorem. The next component is terminal time-face anti-atom control, which is independent of spatial transported-boundary tightness.



    \subsection{R3 Exterior L2 Tightness And No Energy-Tail Face}

    Discharged theorem for the L 2 exterior-energy component of the whole-space tail problem.

    The remaining item on the direct positive whole-space-continuation route is the higher-order H s tail needed for global continuation.

    \[
    p=\mathcal R_i\mathcal R_j(u_i u_j)
    \]

    \[
    \lim_{R\to\infty}\sup_{0\le t<T_*}\int_{|x|>R}|u(x,t)|^2\,dx=0.
    \]

    \[
    TailFace_{R^3}^{L^2}:
    \text{finite-energy mass escapes to spatial infinity at }T_*
    \]

    \[
    chi_R=0\quad |x|\le R,
    \qquad
    chi_R=1\quad |x|\ge 2R,
    \]

    \[
    |\nabla chi_R|\le C/R,
    \qquad
    |\Delta chi_R|\le C/R^2.
    \]

    The initial term tends to zero because u 0 in L 2(R 3). The first error term is bounded by

    so the exterior annular integral of |u| 3 tends to zero as R->infty, and the extra factor R -1 preserves convergence to zero.

    Since |A R (0,T *)| 1/10 R 3/10 , multiplying by R -1 gives a term bounded by \(C_{\mathrm{sf},46448}R^{-7/10}\), which tends to zero.

    The whole-space branch has no finite-energy mass escape face at spatial infinity. Pressure tails on compact readout balls can use this exterior tightness together with local tower bounds, as recorded in the pressure-tail convergence theorem.

    The direct positive continuation theorem on R 3 needs more than exterior L 2 tightness. It needs uniform exterior H s tail control, or a replacement theorem converting local tower/readout control plus energy tightness into a global H s bound. That is the next frontier for the stronger positive route, not a reopened CM-facing blocker.


