      \subsection{Scale-normalized nu SCF Carleson estimate - audit}

      The estimate is the bounded-overlap measure count:
      \[
      \sum_i \nu_{SCF}(Q_i)
      \le
      C_{atlas}\left(\mu_D(\Omega_T)+\sum_\chi \mu_{P,\chi}(\Omega_T)\right)<\infty.
      \]
      Finite dissipation pays \(\mu_D\), packet-local pressure integrability pays each \(\mu_{P,\chi}\), and the finite transported atlas supplies the overlap constant.

      The Jump avg lower argument is not raw. It comes from the scale-critical threshold

      Raw finite measure does not imply the normalized estimate. A model finite measure can satisfy

      \[
      \nu(Q_k)\sfcomp{48656} r_k^{\alpha}
      \]

      \[
      \sum_k \nu(Q_k)<\infty,
      \]

      \[
      \sum_k r_k^{-\alpha}\nu(Q_k)=\sum_k 1=\infty.
      \]

      Bounded overlap does not fix this: it controls repeated raw counting of the same measure, not the scale weights created by the normalized SCF base threshold.

      Carleson sc(nu SCF) is not proved from finite energy, pressure Poisson structure, bounded pack gauge, and same-fluid geometry alone.


