      \]

      Integrate (11) in time and apply (SS - model) termwise over the finite set A ub . Since the family has cardinality at most \(C_{\mathrm{sf},58257}\), all packet constants are absorbed into a single coefficient C , . Then use (13) to obtain (UB ).

      The moving-spill estimate is identical: integrate (12), apply (SS - model) over the finite set A sp , and then use (14) to obtain (MS ).

      That is the missing strengthening from the currently proved model estimate to the coefficient-free theorem (SS), and so to the final same-scale bounds (UB) and (MS).


