      \big|
      \le C_{\mathrm{sf},58234}
      \|b_{\ell,a}(t)\|_{L_x^\infty}\,E_j(t)^{1/2}D_j(t)^{1/2}.
      \]

      \[
      \|b_{\ell,a}(t)\|_{L_x^\infty}
      \le C_{a,58240}
      \sum_{|m-N|\le C_a}2^{3m/2}\|\Delta_m u(t)\|_{L_x^2}
