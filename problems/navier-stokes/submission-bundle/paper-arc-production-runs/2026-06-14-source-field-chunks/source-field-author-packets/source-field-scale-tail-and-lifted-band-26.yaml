      \subsection{Clay problem Good Scale Failure To Field Exit For The H 1/2 Route}

      Conditional CM failure-classification theorem. The proof is direct under the Field row used by the Good Scale / Field.TTU surfaces.

      Let Good Scale.TTU( W *) mean that there exists an active terminal material point

      \[
      (a_*,t_*)\in Q^\Phi([t_0,T_*),A_\sharp)
      \]

      Pack Q keeps the active terminal point inside the same material packet and supplies the retained material address. The point is so still being tested inside the CM witness record.

      Part N,Q keeps the same pressure-viscosity participation law attached to that retained material point. The active terminal point remains inside the same Navier--Stokes participation row.

      The Good Scale failure gives an active terminal material point with no positive SCF-good cylinder at any radius. Hence no positive local Field scale exists at that point. With Pack and Part retained, the remaining failed CM face is Field coherence.

      Thus the branch lands in the Field face. In the averaged endpoint grammar, the same obstruction appears as Jump avg.

      The material point still has an address. The same pressure-viscosity law still participates. Yet no positive neighborhood around that material point supports coherent same-fluid field readout. The flow has retained a material carrier and a governing law while losing local tower coherence. That is the Field exit.

      So the route no longer needs a positive proof of Good Scale.TTU on every branch. The Good Scale failure branch is a CM Field exit.


