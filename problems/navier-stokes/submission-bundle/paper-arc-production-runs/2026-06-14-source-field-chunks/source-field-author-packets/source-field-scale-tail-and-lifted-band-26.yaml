      \subsection{Clay problem Good Scale.TTU state Audit For The H 1/2 Route}

      Audit note. Good Scale.TTU is open as a positive production theorem. Its failure is usable as a CM Field/Jump exit branch.

      This means every active terminal material point has a positive SCF-good cylinder.

      So positive Good Scale.TTU supplies the retained Field readout needed for matched finite-difference control.

      On the failure branch, there is an active terminal material point with no positive SCF-good cylinder. The Good Scale test surface identifies this as the bad material set and records it in the averaged endpoint grammar as Jump avg. Pointwise, this is loss of every positive local coherence scale, hence a Field-side exit.

      This theorem should formalize that an active terminal material point with no positive SCF-good cylinder is exactly a Field/Jump exit in the Pack/Part/Field grammar.


