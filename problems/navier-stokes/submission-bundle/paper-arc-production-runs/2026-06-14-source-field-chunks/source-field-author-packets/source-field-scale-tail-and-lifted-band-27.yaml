    text: |+
      \subsection{R3 Exterior Tail CM Endpoint Consumption}

      The CM route does not need to prove this stronger positive theorem when the only surviving alternative is already forced into Pack, Part, or Field failure on the same terminal object. The object to consume is the surviving exterior high-order Duhamel source after the initial tail and compact-core source have already been removed.

      H s tail into initial ancestry, compact-core far-kernel source, and the genuinely exterior nonlinear source. The first two parts vanish at infinity.

      Thus the R3 exterior high-order tail face is consumed by the CM endpoint matrix. It is not a live fourth branch and not a separate class-member continuation candidate.

      The initial-data tail and compact-core far-kernel source are already removed by the Duhamel reduction. If the genuinely exterior nonlinear source also vanishes in exterior H s , then the positive tail input Tail.Hs R3 is supplied.

      Let Q be the terminal CM test object selected by this survivor. If the packet has no retained material address in the same terminal object, then the Field-window evidence fails: Field-window evidence outside CM. If the packet is detached from the same Navier-Stokes equation, pressure, viscosity, and source ancestry, then the Part face fails: not Part M,Q .

      It remains to consider the retained Field-window evidence+Part branch. On that branch the survivor is attached to the same terminal object and must be visible inside the retained Field windows. If a fixed positive Field scale >0 held through depth M>s , each localized Field-window piece would have a uniform finite-depth derivative bound. Littlewood-Paley cancellation above the retained Field depth then gives the high-frequency tail bound needed for the exterior source test.

      The surviving exterior high-order source is so a Pack, Part, or Field face failure. The direct positive theorem Tail.Hs R3 remains useful as a stronger export theorem, but it is not required for the CM-facing whole-space R3 branch.

      No active generic Clay-closing bridge remains after the finite-obstruction inventory reconciliation. A future R3 reopening has to name a concrete whole-space terminal obstruction row that lacks same-solution CM entry or a derived Pack, Part, or Field face.


