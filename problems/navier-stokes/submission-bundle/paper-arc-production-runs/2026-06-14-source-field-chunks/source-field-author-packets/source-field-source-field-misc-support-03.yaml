      \subsection{Theorem D.3: Commutative Shadow Theorem}

      D.3 is the readout theorem.  It says when the carrier solution \(X\) descends
      to a classical Navier--Stokes velocity field.  The theorem note keeps two
      readout branches separate.  The strict branch is remainder-free:
      \[
      \mathcal C(\partial_t X)=\partial_t u,
      \qquad
      \mathcal C(\Delta_DX)=\Delta u,
      \qquad
      \mathcal C(\mathbb P_DX)=\mathbb P_{\mathrm{Leray}}u,
      \]
      \[
      \mathcal C(\mathbb P_DN_D(X))
      =
      \mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big),
      \qquad
      \|u\|_{H^s}\le C\|X\|_{H_D^s}.
      \]
      On that strict branch the commutative shadow \(u:=\mathcal C(X)\) satisfies
      \[
      \partial_t u+\mathbb P_{\mathrm{Leray}}\big((u\cdot\nabla)u\big)
      =\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \]
      equivalently
      \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0.
      \]

      The weaker branch carries an explicit shadow defect:
      \[
      \mathcal C(\mathcal L_D(X))
      =
      \mathrm{classical}_{\mathrm{NS}}(u)
      +\mathrm{Shadow}_{\mathrm{def}}(X),
      \]
      where
      \[
      \mathrm{Shadow}_{\mathrm{def}}(X)
      =
      \nabla p_{\mathrm{shadow}}
      +\mathrm{Curv}_{\mathrm{sh}}(X)
      +\mathrm{Tail}_{\mathrm{sh}}(X).
      \]
      The pressure-like part belongs to the exact channel, the curvature part belongs
      to the persistent carrier package, and the tail belongs to the continuation
      argument.  The strict remainder-free branch is the branch consumed by the
      clean D.5 composition.  The weak branch has use in the D.4 absorption setting,
      where the tail is absorbed and the classical equation claimed by the paper
      stays unchanged.


