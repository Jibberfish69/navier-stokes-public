      \subsection{D.6c - Global low-tier coercivity under uniform H-control}

      D.6c turns the slaving estimate into a single decay inequality.  Start from the
      projected energy identity
      \[
      \frac{d}{dt}\|X\|_H^2
      +\nu\Big(\|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2\Big)
      \le C_1\|X\|_{\mathcal N}^3.
      \]
      The global carrier bound supplies
      \[
      \|X\|_{\mathcal N}
      \le
      C_{\mathrm{slv}}\|X\|_H^{1/2}
      \Big(\|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2\Big)^{1/4}.
      \]
      The low-tier coercivity assumption is
      \[
      \|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2
      \ge C_\Lambda\|X\|_H^2,
      \]
      and the \(H\)-tier bound gives
      \[
      \|X(t)\|_H\le M_H.
      \]
      The quantitative threshold is
      \[
      C_1C_{\mathrm{slv}}^3M_H<\nu C_\Lambda^{1/2}.
      \]
      Under that threshold the energy inequality becomes
      \[
      \frac{d}{dt}\|X(t)\|_H^2
      \le
      -c_{\mathrm{glob}}\|X(t)\|_H^2,
      \qquad
      c_{\mathrm{glob}}
      :=
      C_\Lambda^{1/2}\big(\nu C_\Lambda^{1/2}
      -C_1C_{\mathrm{slv}}^3M_H\big)>0.
      \]
      Gronwall gives
      \[
      \|X(t)\|_H^2\le e^{-c_{\mathrm{glob}}t}\|X(0)\|_H^2.
      \]
      This is the explicit low-tier decay payment.  The threshold is part of the
      proof because it turns the nonlinear carrier term into an absorbable term
      inside the dissipative block.


