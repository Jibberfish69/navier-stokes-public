    argument.  The strict remainder-free branch is the branch consumed by the
    clean D.5 composition.  The weak branch has use in the D.4 absorption setting,
    where the tail is absorbed and the classical equation claimed by the paper
    stays unchanged.



    \subsection{D.6b' - Global coercive decay in H}

    D.6b' is the scalar decay estimate behind the global carrier bound.  Split the
    drift term as
    \[
    \delta_\omega=S_\omega+K_\omega,
    \qquad
    S_\omega:=\tfrac12(\delta_\omega+\delta_\omega^*),
    \qquad
    K_\omega:=\tfrac12(\delta_\omega-\delta_\omega^*).
    \]
    The skew part \(K_\omega\) has zero \(H\)-growth.  The symmetric part is bounded
    by \(C_\delta\), and the active carrier supplies an effective coercive gap
    \(\lambda_*^{\mathrm{eff}}\).  The threshold is
    \[
    \nu\lambda_*^{\mathrm{eff}}>C_\delta.
    \]
    Under that threshold,
    \[
    \frac12\frac{d}{dt}\|X(t)\|_H^2
    +\nu\|\nabla_DX(t)\|_H^2
    +(\nu\lambda_*^{\mathrm{eff}}-C_\delta)\|X(t)\|_H^2
    \le 0.
    \]
    Thus, with \(c:=\nu\lambda_*^{\mathrm{eff}}-C_\delta>0\),
    \[
    \|X(t)\|_H\le e^{-ct}\|X(0)\|_H.
    \]
    This is the scalar decay input.  It says that the dissipative spectral gap
    dominates the symmetric drift on the carrier surface.



    \subsection{D.6c - Global low-tier coercivity under uniform H-control}

    D.6c turns the slaving estimate into a single decay inequality.  Start from the
    projected energy identity
    \[
    \frac{d}{dt}\|X\|_H^2
    +\nu\Big(\|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2\Big)
    \le C_1\|X\|_{\mathcal N}^3.
    \]
    The global carrier bound supplies
    \[
    \|X\|_{\mathcal N}
    \le
    C_{\mathrm{slv}}\|X\|_H^{1/2}
    \Big(\|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2\Big)^{1/4}.
    \]
    The low-tier coercivity assumption is
    \[
    \|\nabla_DX\|_H^2+\|\nabla_D\Omega_DX\|_H^2
    \ge C_\Lambda\|X\|_H^2,
    \]
    and the \(H\)-tier bound gives
    \[
    \|X(t)\|_H\le M_H.
    \]
    The quantitative threshold is
    \[
    C_1C_{\mathrm{slv}}^3M_H<\nu C_\Lambda^{1/2}.
    \]
    Under that threshold the energy inequality becomes
    \[
    \frac{d}{dt}\|X(t)\|_H^2
    \le
    -c_{\mathrm{glob}}\|X(t)\|_H^2,
    \qquad
    c_{\mathrm{glob}}
    :=
    C_\Lambda^{1/2}\big(\nu C_\Lambda^{1/2}
    -C_1C_{\mathrm{slv}}^3M_H\big)>0.
    \]
    Gronwall gives
    \[
    \|X(t)\|_H^2\le e^{-c_{\mathrm{glob}}t}\|X(0)\|_H^2.
    \]
    This is the explicit low-tier decay payment.  The threshold is part of the
    proof because it turns the nonlinear carrier term into an absorbable term
    inside the dissipative block.



    \subsection{D.8a - Strong convergence of the approximating family}

    D.8a is the compactness bridge for approximating carrier solutions.  The input
    family satisfies
    \[
    X_n \hbox{ bounded in } L^\infty(0,T;H)\cap L^2(0,T;\mathcal N),
    \]
    and
    \[
    \partial_tX_n \hbox{ bounded in } L^2(0,T;\mathcal N^*).
    \]
    On \(\mathbb T^3\), the compact embedding
    \[
    H^1_\sigma\Subset L^2_\sigma
    \]
    gives strong convergence by Aubin--Lions.  On \(\mathbb R^3\), the same lemma
    first gives local convergence in \(L^2(0,T;L^2(B_R))\), and the admissible tail
    estimate promotes the local convergence to the full carrier space:
    \[
    \sup_n\int_0^T\int_{|x|>R}|X_n(t,x)|^2\,dx\,dt\le \varepsilon
    \]
    for \(R\) large.  The output is a subsequence and a limit \(X\) with
    \[
    X_n\to X
    \qquad\hbox{strongly in }L^2(0,T;H).
    \]
    This strong convergence lets the projected nonlinear term pass to the limit on
    the certified approximation route.  The carrier realization file records this
    as Theorem \(R5\); D.4 uses Proposition \(R6\) as the continuation criterion.



    \subsection{D.8b - Global projected well-posedness and exponential decay}

    D.8b combines D.8a with the D.6 carrier bound.  The approximating family is
    uniformly bounded on each finite interval, D.8a supplies strong convergence,
    and the limit satisfies the projected weak formulation.  The global projected
    solution lies in
    \[
    X\in
    L^\infty_{\mathrm{loc}}([0,\infty);H)
    \cap
    L^2_{\mathrm{loc}}([0,\infty);\mathcal N).
    \]
    The low-tier decay then passes to the limit:
    \[
    \frac{d}{dt}\|X(t)\|_H^2
    \le
    -c_{\mathrm{glob}}\|X(t)\|_H^2,
    \qquad t\ge 0.
    \]
    Consequently,
    \[
    \|X(t)\|_H^2
    \le
    e^{-c_{\mathrm{glob}}t}\|X(0)\|_H^2.
    \]

    The projected weak solution and exponential carrier-decay surface are the
    conclusions here.  The result remains a projected-flow conclusion.  The classical
    Navier--Stokes conclusion uses it through the strict shadow descent and
    same-surface composition described in D.3--D.5.



    \subsection{Defect-Reduction Tower And Four-Body Recurrence Note}

    D.75 organizes the Euclidean repair routes as one defect-reduction picture.
    Each route starts from the same one-sided accumulated-scale obstruction and
    rewrites the survivor in a sharper normal form.  The page shows one common
    problem moving through several languages: shell gain, cumulative tail stress,
    signed descent, Volterra scale memory, lower-triangular scale memory, and the
    four-body recurrence.

    \[
    \mathcal E^{(0)}
    :=
    \begin{gathered}
    \text{one-sided scale-memory / accumulated lower-prefix transport-stress}\\
    \text{against the active shell}
    \end{gathered}
    \]

    Each route applies a different normal-form reduction to this class:

    \[
    \mathcal E^{(n+1)} = \mathcal R(\mathcal E^{(n)}),
    \]

    At this stage \(\mathcal R\) records a structural reduction.  The evidence gives
    descent of form, while a quantitative contraction theorem remains open.  The
    route stack has the same pattern in several languages:

    \[
    \begin{gathered}
    \text{shell obstruction}
    \rightsquigarrow
    \text{tail survivor}
    \rightsquigarrow
    \text{residual square-factor payment request},\\
    \text{cumulative tail stress}
    \rightsquigarrow
    \text{dyadic lower-prefix active square},\\
    \text{signed lifted bulk}
    \rightsquigarrow
    \text{boundary packet}+\text{mesoscopic residual},\\
    \text{one-sided prefix}
    \rightsquigarrow
    \text{weighted quotient mode}
    \rightsquigarrow
    \text{affine moments }(M_0,M_1).
    \end{gathered}
    \]

    The Body \(1\) lifted-band route gives the sharpest form of the same survivor.
    It gains a real spectral-gap kernel, and the remaining lower-shell defect is

    \[
    \mathcal P_j^\downarrow(t)\,2^{-j}D_j(t)^2.
    \]

    \[
    \text{raw lifted packet}
    \rightsquigarrow
    \text{kernelized lifted packet}
    \rightsquigarrow
    \text{persistent lower-shell defect}.
    \]

    \[
    2^{3k}\|\Delta_k u\|_2^2
    =
    2^k \cdot 2^{2k}\|\Delta_k u\|_2^2,
    \]

    The four-body route remains live as a defect-reduction loop:

    \[
    S_{\mathrm{cl}}\to Q_{\mathrm{cl}},\qquad
    (S_{\mathrm{cl}},Q_{\mathrm{cl}})\to C_{\mathrm{cl}},\qquad
    C_{\mathrm{cl}}\to G_{\mathrm{cl}},\qquad
    G_{\mathrm{cl}}\to S_{\mathrm{cl}}.
    \]

    In that reading, Body \(4\) exposes the current survivor at the continuation
    side and the \(4\to1\) return feeds it back into the next Body \(1\) export
    theorem on the same geometry.  The boundary is precise: the tower has structural
    descent, a norm-contraction theorem remains open, and the terminal comparison
    currently shows two survivor families.  The exact bridge question is whether
    \((B1)\)--\((B3)\) identify those families as one terminal class.



    \subsection{Derivative-LP Compatibility Bridge Note}

    D.76 localizes the derivative source for the Lagrangian pressure wall and the
    deformation commutator family.  It fixes the overstrong collar-local slogan:
    after Littlewood--Paley projection, the derivative tower splits by Bony geometry
    into low-high, high-low, and finite-collar resonant packets.

    \[
    (\partial_a^\beta A)\,U_{\alpha-\beta},
    \qquad
    0<\beta\le \alpha,
    \]

    \[
    \mathcal Z_\alpha
    :=
    -\sum_{0<\beta\le\alpha}\binom{\alpha}{\beta}
    (\partial_a^\beta A)\,U_{\alpha-\beta}.
    \]

    Fix a homogeneous Littlewood--Paley decomposition in the Lagrangian variable
    \(a\), with shell operators \(\Delta_j\), low cutoffs \(S_j\), and collar width
    \(C_0\ge4\). For one derivative split set

    \[
    F_{\alpha,\beta}:=\partial_a^\beta A,
    \qquad
    V_{\alpha,\beta}:=U_{\alpha-\beta}.
    \]

    The exact product localization is

    \[
    \Delta_j(F_{\alpha,\beta}V_{\alpha,\beta})
    =
    \mathsf{LH}_{\alpha,\beta,j}
    +\mathsf{HL}_{\alpha,\beta,j}
    +\mathsf{RR}_{\alpha,\beta,j}.
    \]

    The first two terms are strict coefficient packets. The resonant term is the
    finite-collar packet:

    \[
    \mathsf{RR}_{\alpha,\beta,j}\ne0
    \Longrightarrow
    |k-\ell|\le C_0,\qquad |j-k|\le C_0.
    \]

    Summing over \(0<\beta\le\alpha\) gives the pressure-source split

    \[
    \Delta_j\mathcal Z_\alpha
    =
    \mathcal Z_{\alpha,j}^{LH}
    +\mathcal Z_{\alpha,j}^{HL}
    +\mathcal Z_{\alpha,j}^{RR}.
    \]

    This gives the source-side bridge for Lemma \(4B\).  The pressure wall continues
    through the variable-coefficient exact projector

    \[
    \Pi_G^{ex}=-G\nabla_aL_G^{-1}\operatorname{div}_a .
    \]

    The shellwise response identity is

    \[
    \Delta_j\Pi_G^{ex}\mathcal Z_\alpha
    =
    \Pi_G^{ex}\mathcal Z_{\alpha,j}^{LH}
    +\Pi_G^{ex}\mathcal Z_{\alpha,j}^{HL}
    +\Pi_G^{ex}\mathcal Z_{\alpha,j}^{RR}
    +[\Delta_j,\Pi_G^{ex}]\mathcal Z_\alpha .
    \]

    The reserve \(4B\) debt is explicit.  The low-high projector commutator theorem
    is the named CM branch law surface for the coefficient packets and commutator; the
    same-depth resonant side is the named CM branch law surface for the capwise operator
    theorem or one of its symbolic sufficient routes.  The support value of D.76 is
    the exact localization of the remaining wall: the derivative tower localizes at
    the source level, and the live debt is propagation of that localized source
    through the elliptic response.


