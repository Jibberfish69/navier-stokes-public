      \subsection{Theorem D.2: Global Coercive Energy Estimate}

      D.2 pays the analytic cost of the projected lane.  It shows how the carrier
      flow absorbs the nonlinear term into the dissipative quantity.  The theorem
      note uses
      \[
      \mathcal E_D(X)
      :=
      \|\Delta_{D,\omega}^{1/2}X\|^2+\|\Omega_D(X)\|^2,
      \qquad
      \mathcal D_D(X)
      :=
      \|\Delta_{D,\omega}X\|^2
      +\|\Delta_{D,\omega}^{1/2}\Omega_D(X)\|^2.
      \]
      The formal energy identity leaves two nonlinear terms:
      \[
      \mathcal N_1(X)
      :=
      2\langle \Delta_{D,\omega}X,\mathbb P_DN_D(X)\rangle,
      \qquad
      \mathcal N_2(X)
      :=
      2\langle \Omega_D(X),
      [\nabla_{D,\omega},\mathbb P_DN_D(X)]\rangle .
      \]
      Those two terms are the D.2 hinge.  The desired estimate is
      \[
      |\mathcal N_1(X)|+|\mathcal N_2(X)|
      \le
      \varepsilon\,\mathcal D_D(X)
      +C_\varepsilon\,\Psi(\mathcal E_D(X)),
      \]
      with \(\Psi\) small enough or structured enough to close the continuation
      argument.

      The carrier-leakage completion supplies the derivative-placement estimate
      used at this hinge.  In model form,
      \[
      \|[\Delta_D,Q_i]\mathbb P_DN_D(X)e_\beta\|
      +\|Q_i\mathbb P_D[\Delta_D,N_D(X)]e_\beta\|
      \le
      \varepsilon\Big(
      \|\Delta_DX\|
      +\|\Delta_D^{1/2}\Omega_D(X)\|
      \Big)
      +C_{\varepsilon,i,\beta}\mathcal E_D(X)^{1/2}.
      \]
      This is the passage from a raw nonlinear transport term to an absorbable
      carrier term.  The reader-facing point is the coercive absorption statement:
      the projected nonlinearity is controlled on the same carrier domain supplied
      by D.1.

      With the H-level estimate and the commutator-tier estimate summed together,
      the theorem file records the lane-local inequality
      \[
      \frac{d}{dt}\|X(t)\|_{\mathcal N}^2
      +c_0\|\nabla_DX(t)\|_H^2
      \le
      C_0\|X(t)\|_H^2,
      \]
      using the carrier constants and the leakage discharge.  This gives the
      projected-lane coercive payment.  The payment belongs on the same theorem
      surface as the D.1 carrier and the later D.3 shadow readout; that shared
      surface is what lets the appendix cite it as projected-flow support.


