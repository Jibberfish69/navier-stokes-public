      \subsection{D.6b' - Global coercive decay in H}

      D.6b' is the scalar decay estimate behind the global carrier bound.  Split the
      drift term as
      \[
      \delta_\omega=S_\omega+K_\omega,
      \qquad
      S_\omega:=\tfrac12(\delta_\omega+\delta_\omega^*),
      \qquad
      K_\omega:=\tfrac12(\delta_\omega-\delta_\omega^*).
      \]
      The skew part \(K_\omega\) has zero \(H\)-growth.  The symmetric part is bounded
      by \(C_\delta\), and the active carrier supplies an effective coercive gap
      \(\lambda_*^{\mathrm{eff}}\).  The threshold is
      \[
      \nu\lambda_*^{\mathrm{eff}}>C_\delta.
      \]
      Under that threshold,
      \[
      \frac12\frac{d}{dt}\|X(t)\|_H^2
      +\nu\|\nabla_DX(t)\|_H^2
      +(\nu\lambda_*^{\mathrm{eff}}-C_\delta)\|X(t)\|_H^2
      \le 0.
      \]
      Thus, with \(c:=\nu\lambda_*^{\mathrm{eff}}-C_\delta>0\),
      \[
      \|X(t)\|_H\le e^{-ct}\|X(0)\|_H.
      \]
      This is the scalar decay input.  It says that the dissipative spectral gap
      dominates the symmetric drift on the carrier surface.


