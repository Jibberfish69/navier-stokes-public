      \subsection{D.8a - Strong convergence of the approximating family}

      D.8a is the compactness bridge for approximating carrier solutions.  The input
      family satisfies
      \[
      X_n \hbox{ bounded in } L^\infty(0,T;H)\cap L^2(0,T;\mathcal N),
      \]
      and
      \[
      \partial_tX_n \hbox{ bounded in } L^2(0,T;\mathcal N^*).
      \]
      On \(\mathbb T^3\), the compact embedding
      \[
      H^1_\sigma\Subset L^2_\sigma
      \]
      gives strong convergence by Aubin--Lions.  On \(\mathbb R^3\), the same lemma
      first gives local convergence in \(L^2(0,T;L^2(B_R))\), and the admissible tail
      estimate promotes the local convergence to the full carrier space:
      \[
      \sup_n\int_0^T\int_{|x|>R}|X_n(t,x)|^2\,dx\,dt\le \varepsilon
      \]
      for \(R\) large.  The output is a subsequence and a limit \(X\) with
      \[
      X_n\to X
      \qquad\hbox{strongly in }L^2(0,T;H).
      \]
      This strong convergence lets the projected nonlinear term pass to the limit on
      the certified approximation route.  The carrier realization file records this
      as Theorem \(R5\); D.4 uses Proposition \(R6\) as the continuation criterion.


