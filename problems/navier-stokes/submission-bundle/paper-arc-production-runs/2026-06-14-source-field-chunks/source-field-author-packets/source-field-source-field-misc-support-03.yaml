    text: |+
      \subsection{D.8b - Global projected well-posedness and exponential decay}

      D.8b combines D.8a with the D.6 carrier bound.  The approximating family is
      uniformly bounded on each finite interval, D.8a supplies strong convergence,
      and the limit satisfies the projected weak formulation.  The global projected
      solution lies in
      \[
      X\in
      L^\infty_{\mathrm{loc}}([0,\infty);H)
      \cap
      L^2_{\mathrm{loc}}([0,\infty);\mathcal N).
      \]
      The low-tier decay then passes to the limit:
      \[
      \frac{d}{dt}\|X(t)\|_H^2
      \le
      -c_{\mathrm{glob}}\|X(t)\|_H^2,
      \qquad t\ge 0.
      \]
      Consequently,
      \[
      \|X(t)\|_H^2
      \le
      e^{-c_{\mathrm{glob}}t}\|X(0)\|_H^2.
      \]

      The projected weak solution and exponential carrier-decay surface are the
      conclusions here.  The result remains a projected-flow conclusion.  The classical
      Navier--Stokes conclusion uses it through the strict shadow descent and
      same-surface composition described in D.3--D.5.


