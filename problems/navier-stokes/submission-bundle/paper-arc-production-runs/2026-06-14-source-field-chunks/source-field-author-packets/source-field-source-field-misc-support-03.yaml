      \[
      \Delta_j(F_{\alpha,\beta}V_{\alpha,\beta})
      =
      \mathsf{LH}_{\alpha,\beta,j}
      +\mathsf{HL}_{\alpha,\beta,j}
      +\mathsf{RR}_{\alpha,\beta,j}.
      \]

