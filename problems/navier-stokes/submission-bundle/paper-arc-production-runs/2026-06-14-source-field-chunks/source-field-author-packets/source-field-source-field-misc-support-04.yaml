      \subsection{Lemma E.I: Energy/Enstrophy Baseline And Its Insufficiency}

      Let \(\{u^{(n)},p^{(n)}\}\) be a smooth classical approximation family on
      \((0,T)\times\mathbb R^3\), with divergence-free admissible data and viscosity
      \(\nu>0\). The baseline estimate is

      \[
      \sup_n\sup_{t\in[0,T]}\|u^{(n)}(t)\|_{L^2_x}^2
      +2\nu\sup_n\int_0^T\|\nabla u^{(n)}(t)\|_{L^2_x}^2\,dt
      \le C_E.
      \]

      Every classical regularity route on this surface has to retain this bound,
      because it is the standard energy identity.  The lemma separates that necessary
      baseline from the two estimates that carry the remaining closure burden:

      \[
      \text{a dyadic tail/flux estimate suppressing dangerous transfer,}
      \]

      \[
      \text{or a high-frequency enstrophy coercivity estimate with absorbable
      commutator remainder.}
      \]

      To see the obstruction, write the dyadic enstrophy balance for \(P_j u\) and
      separate the low-high, high-low, and high-high transport pieces.  The baseline
      bound controls global energy and integrated dissipation.  The high-frequency
      transport remainder has to enter the absorbable-plus-summable form needed
      for the scale-barrier tail estimate or the gradient coercivity estimate.

      D.83 proves this exact route fact: energy/enstrophy control is necessary
      baseline data, and the proof needs the dyadic tail and coercivity bridges after
      that baseline is present.  It is an insufficiency lemma for the proof route; it
      records the proof-route gap rather than a blow-up claim.


