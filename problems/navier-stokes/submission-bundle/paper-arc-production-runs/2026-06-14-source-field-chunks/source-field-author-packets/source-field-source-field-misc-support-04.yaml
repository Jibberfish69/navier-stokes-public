      \subsection{Exact Dyadic Interaction Decomposition}

      The decomposition below is unconditional support for the classical
      three-dimensional Navier--Stokes vorticity equation.  It shows exactly where the
      dyadic route stops before an additional coercive mechanism is supplied.

      Let \(u\) be a smooth classical solution on
      \([0,T]\times\mathbb R^3\), with vorticity
      \(\omega=\nabla\times u\).  Fix a homogeneous Littlewood--Paley decomposition

      \[
      \omega=\sum_{j\ge -1}\Delta_j\omega.
      \]

      For each dyadic shell, the transport part cancels and the shell interaction is
      only the commutator:

      \[
      \big\langle \Delta_j(\omega\cdot\nabla u),\,\Delta_j\omega\big\rangle
      =
      \big\langle [\Delta_j,u\cdot\nabla]\omega,\,\Delta_j\omega\big\rangle.
      \]

      \[
      \big\langle u\cdot\nabla\Delta_j\omega,\,\Delta_j\omega\big\rangle = 0.
      \]

      The paraproduct expansion is

      \[
      u\cdot\nabla\omega
      =
      T_u(\nabla\omega)+T_{\nabla\omega}(u)+R(u,\nabla\omega).
      \]

      The localized commutator has the model form

      \[
      [\Delta_j,u\cdot\nabla]\omega
      =
      \sum_{|k-j|\le C}[\Delta_j,S_{k-1}u\cdot\nabla]\Delta_k\omega
      +\text{lower-frequency commutators}.
      \]

      \[
      \big|\big\langle [\Delta_j,S_{j-1}u\cdot\nabla]\Delta_j\omega,\,
      \Delta_j\omega\big\rangle\big|
      \le C_{\mathrm{sf},5128}
      |\nabla S_{j-1}u|_{L^\infty_x}\,|\Delta_j\omega|_{L^2_x}^2.
      \]

      The remainders have the desired second-order kernel gain,

      \[
      |\mathrm{Rem}_j|
      \le C_{\mathrm{sf},5136}
      2^{-2j}\|\omega\|_{\dot H_x^{1/2}}^2.
      \]

      The principal low-high term is different.  It is governed by the low-frequency
      strain coefficient \(\|\nabla S_{j-1}u\|_{L^\infty_x}\).  The decomposition
      alone does not give a uniform coercive deficit such as

      \[
      \big|\big\langle \Delta_j(\omega\cdot\nabla u),\Delta_j\omega\big\rangle\big|
      \le
      (1-\delta)\nu 2^{2j}\|\Delta_j\omega\|_{L_x^2}^2.
      \]

