      \subsection{Dyadic Flux Antisymmetry With Gap-Damped Defect}

      D.79 explains the deterministic mechanism behind the cross-scale decorrelation
      branch.  The useful paid fact is exact: bare dyadic exchange cancels by
      divergence-free transport and self-adjoint Littlewood--Paley projectors.  The
      unpaid part begins when the one-sided weights break that cancellation.

      \[
      E_j(t):=2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2,
      \qquad
      D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
      \]

      \[
      \mathcal N_j(t)
      :=
      2^{2j}\langle \Delta_j(u\cdot\nabla u),\Delta_j u\rangle.
      \]

      \[
      \mathcal N_j
      =
      \sum_{k,\ell}\mathcal I_{j;k,\ell},
      \qquad
      \mathcal I_{j;k,\ell}
      :=
      2^{2j}\langle \Delta_j(\Delta_k u\cdot\nabla\Delta_\ell u),\Delta_j u\rangle.
      \]

      \[
      j+M<k<\ell-4.
      \]

      \[
      \mathfrak F_{j,\ell;k}
      :=
      \big\langle \Delta_j(a_k\cdot\nabla \Delta_\ell u),\,\Delta_j u\big\rangle
      +
      \big\langle \Delta_\ell(a_k\cdot\nabla \Delta_j u),\,\Delta_\ell u\big\rangle.
      \]

      Because \(a_k\) is divergence-free and the Littlewood--Paley projectors are
      self-adjoint, the unweighted exchange cancels exactly:

      \[
      \mathfrak F_{j,\ell;k}=0.
      \]

      Once shell weights are inserted, the defect is the weight mismatch:

      \[
      \begin{aligned}
      &w_j\big\langle
      \Delta_j(a_k\cdot\nabla \Delta_\ell u),\Delta_j u
      \big\rangle
      +w_\ell\big\langle
      \Delta_\ell(a_k\cdot\nabla \Delta_j u),\Delta_\ell u
      \big\rangle\\
      &\qquad =
      (w_j-w_\ell)
      \big\langle a_k\cdot\nabla\Delta_\ell u,\Delta_j u\big\rangle .
      \end{aligned}
      \]

      For \(H^1\) shell weights this gives

      \[
      \mathcal I_{j;k,\ell}+\mathcal I_{\ell;k,j}
      =
      (2^{2j}-2^{2\ell})
      \big\langle \Delta_k u\cdot\nabla\Delta_\ell u,\Delta_j u\big\rangle .
      \]

      The lower index \(j\) in the lifted packet is a tail cutoff rather than a
      second receiving shell.  The exact exchange identity locates the new work:
      after weighted summation, the remaining defect comes from the mismatch between
