    \frac{\mu_j(Q_s^{ent})}{\mu_j(Q)}
    \qquad
    \text{for every terminal sector cell }Q_s^{ent}\subset Q.
    \]

    With this reduction, the constructive exact-potential shape route treats the
    entrance-sector sign packet as two pieces.  The inherited row-sum side pays one
    half; the diagonal side carries the source-level debt.

    \[
    d_j^{diag}(A)=\int_A \delta_{j,Q}\,d\mu_j
    \qquad\text{for every measurable }A\subseteq Q.
    \]

    \[
    \bar\delta_j(Q)
    :=
    \frac{d_j^{diag}(Q)}{\mu_j(Q)}
    =
    \frac{1}{\mu_j(Q)}
    \int_Q \delta_{j,Q}\,d\mu_j.
    \]

    The first reduction says that sectorwise relative oscillation of the diagonal
    density supplies the restriction law:

    \[
    \operatorname*{ess\,sup}_{a\in Q_s^{ent}}
    \bigl|\delta_{j,Q}(a)-\bar\delta_j(Q)\bigr|
    \le
    \sigma_{\mathrm{diag}}\,\bar\delta_j(Q).
    \]

    Under this hypothesis,

    \[
    d_j^{diag}(Q_s^{ent})
    =
    \int_{Q_s^{ent}}\delta_{j,Q}\,d\mu_j
    \ge
    (1-\sigma_{\mathrm{diag}})
    \bar\delta_j(Q)\,\mu_j(Q_s^{ent})
    =
    (1-\sigma_{\mathrm{diag}})
    d_j^{diag}(Q)\,
    \frac{\mu_j(Q_s^{ent})}{\mu_j(Q)},
    \]

    so the restriction constant is
    \(\theta_{\mathrm{diag}}=1-\sigma_{\mathrm{diag}}\).  Two stronger sufficient
    realizations are available.  A terminal-sector route lower-bounds the diagonal
    density at the sector label center and controls Holder oscillation on that
    sector.  A parent-cell route lower-bounds the diagonal density at the parent
    stopped-cell center and controls Holder oscillation on the parent cell.

    This is the strongest source-level reduction currently visible on the selector
    side of the constructive \(PTC\)-Shape branch. Its downstream use is support:
    sectorwise relative oscillation, finite shell comparability, and the active
    segment gradient bound feed the balanced-frame shape descendants.  The
    sectorwise oscillation and terminal sector-center density files are the places
    where this source-level selector debt is paid.



    \subsection{Directional Observability From Projector Identification}

    D.78 is a downstream observability step.  It starts after a branch-specific
    witness-to-readout theorem has supplied the constitutive import.  On the
    exact-potential branch that upstream theorem is \(EWI.A\); on the
    normal-covector branch it is \(NWI.A\).  After that upstream import, projector
    identification turns the observable witness \(W_J\) into a directional bound.

    \[
    \boxed{
    \widehat P_J\sfmodel{4342} P_{J,\top}^{seg}
    \Longrightarrow
    \Xi_J\le C_{\mathrm{sf},4333} |W_J|^2+\mathrm{Err}_J.
    }
    \]

    \[
    \mathrm{Err}_{J,\mathrm{id}}
    =
    \mathrm{Err}_{J,\mathrm{pack}}^{cm}
    +
    \mathrm{Err}_{J,\mathrm{tc}}^{cm}
    +
    \mathrm{Err}_{J,\mathrm{cal}}^{branch},
    \]

    The error split records where the costs come from.  The packing and transport
    terms are CM-paid imports from the upstream constitutive packet.  The
    calibration term remains branch-local.  The exact projector comparison is the
    triangle between \(P_{ab}\), \(\widehat P_J\), and \(P_{J,\top}^{seg}\):

    \[
    \|P_{ab}-\widehat P_J\|_F^2
    \le C_{\mathrm{sf},4354}
    |W_J|^2+\mathrm{Err}_{J,\mathrm{sync}},
    \]

    \[
    \|\widehat P_J-P_{J,\top}^{seg}\|_F^2
    \le C_{\mathrm{sf},4360}
    |W_J|^2+\mathrm{Err}_{J,\mathrm{id}}.
    \]

    This gives the exact-potential angular bound

    \[
    \Xi_J^{ang}
    :=
    \frac12\|P_{ab}-P_{J,\top}^{seg}\|_F^2
    \le C_{\mathrm{sf},4370}
    |W_J|^2+\mathrm{Err}_{J,\mathrm{sync}}+\mathrm{Err}_{J,\mathrm{id}}.
    \]

    The normal-covector branch has the parallel consumer shape:

    \[
    \Theta_J^\perp
    \le C_{\mathrm{sf},4378}
    |W_J|^2+\mathrm{Err}_{J,\perp}.
    \]

    On the exact-potential Cauchy--Green branch, the current on-disk branch export
    is \(D.7mr2\):

    \[
    \Xi_J^{ang}(a,b,t)
    \le
    C\,|W_J(a,b,t)|^2
    +
    C\,\operatorname{Err}_{J,\mathrm{sync}}(a,b,t)
    +
    C\,\operatorname{Err}_{J,CG}^{pair,\varepsilon}(a,b,t)
    +
    C\,\operatorname{Err}_{J,CG}^{strain,\mathrm{boot}}(a,b,t).
    \]

    The exact-potential read is

    \[
    \begin{gathered}
    \text{pair-to-cocycle input}+\text{selector-strain compatibility}\\
    \Longrightarrow \text{angular ledger estimate}\\
    \Longrightarrow
    \Xi_J^{ang}\le C_{\mathrm{sf},4404} |W_J|^2+\mathrm{Err}_J.
    \end{gathered}
    \]

    The boundary stays visible.  D.78 converts already supplied witness-to-readout
    information into a directional observability bound.  Residual pairwise closure
    and lower-envelope control remain later steps, and every use of this material
    begins downstream of \(EWI.A\) or \(NWI.A\).



    \subsection{Dyadic Flux Antisymmetry With Gap-Damped Defect}

    D.79 explains the deterministic mechanism behind the cross-scale decorrelation
    branch.  The useful paid fact is exact: bare dyadic exchange cancels by
    divergence-free transport and self-adjoint Littlewood--Paley projectors.  The
    unpaid part begins when the one-sided weights break that cancellation.

    \[
    E_j(t):=2^{2j}\|\Delta_j u(t)\|_{L_x^2}^2,
    \qquad
    D_j(t):=2^{4j}\|\Delta_j u(t)\|_{L_x^2}^2.
    \]

    \[
    \mathcal N_j(t)
    :=
    2^{2j}\langle \Delta_j(u\cdot\nabla u),\Delta_j u\rangle.
    \]

    \[
    \mathcal N_j
    =
    \sum_{k,\ell}\mathcal I_{j;k,\ell},
    \qquad
    \mathcal I_{j;k,\ell}
    :=
    2^{2j}\langle \Delta_j(\Delta_k u\cdot\nabla\Delta_\ell u),\Delta_j u\rangle.
    \]

    \[
    j+M<k<\ell-4.
    \]

    \[
    \mathfrak F_{j,\ell;k}
    :=
    \big\langle \Delta_j(a_k\cdot\nabla \Delta_\ell u),\,\Delta_j u\big\rangle
    +
    \big\langle \Delta_\ell(a_k\cdot\nabla \Delta_j u),\,\Delta_\ell u\big\rangle.
    \]

    Because \(a_k\) is divergence-free and the Littlewood--Paley projectors are
    self-adjoint, the unweighted exchange cancels exactly:

    \[
    \mathfrak F_{j,\ell;k}=0.
    \]

    Once shell weights are inserted, the defect is the weight mismatch:

    \[
    \begin{aligned}
    &w_j\big\langle
    \Delta_j(a_k\cdot\nabla \Delta_\ell u),\Delta_j u
    \big\rangle
    +w_\ell\big\langle
    \Delta_\ell(a_k\cdot\nabla \Delta_j u),\Delta_\ell u
    \big\rangle\\
    &\qquad =
    (w_j-w_\ell)
    \big\langle a_k\cdot\nabla\Delta_\ell u,\Delta_j u\big\rangle .
    \end{aligned}
    \]

    For \(H^1\) shell weights this gives

    \[
    \mathcal I_{j;k,\ell}+\mathcal I_{\ell;k,j}
    =
    (2^{2j}-2^{2\ell})
    \big\langle \Delta_k u\cdot\nabla\Delta_\ell u,\Delta_j u\big\rangle .
    \]

    The lower index \(j\) in the lifted packet is a tail cutoff rather than a
    second receiving shell.  The exact exchange identity locates the new work:
    after weighted summation, the remaining defect comes from the mismatch between
    the one-sided tail weights rather than from bare dyadic exchange.

    For the one-sided tail functional,

    \[
    w_\ell^{(j)}:=2^{-\sigma(\ell-j)},\qquad
    w_j^{(j)}=1,
    \qquad
    w_j^{(j)}-w_\ell^{(j)}=1-2^{-\sigma(\ell-j)}.
    \]

    In the lifted regime this mismatch is order one.  It gives direction rather
    than decay.  The weighted tail records the one-sided queue through its discrete
    gradient; the gap decay needed for the decorrelation theorem has to come from a
    stronger signed commutator-defect estimate after exact exchange cancellation.

    The corrected target is a weighted defect theorem of the form

    \[
    \sum_{j>N+M+4}2^j\,\mathcal R_{j,\mathrm{lift}}^\sigma
    \le
    \varepsilon\sum_{j>N+M+4}2^j(\mathcal T_j^\sigma)^2
    +C\sum_{j>N+M+4}\sum_{\ell\ge j}
    2^{(1+\sigma)j-\sigma\ell}|\mathcal C_{j,\ell}(t)|,
    \]

    followed by a barrier-scale bound on the final defect sum. A signed commutator
    theorem supplying an extra gap \(c>0\) would make the lifted term land
    on a one-sided carrier with kernel \(\beta=\sigma+c\):

    \[
    \sum_{j>N+M+4}2^j\,\mathcal R_{j,\mathrm{lift}}^\sigma(t)
    \le C_{\mathrm{sf},4521}
    \varepsilon\sum_{k>N+M}2^k
    \big(\mathcal D_k^{\uparrow,\beta}(t)\big)^2
    +C_\varepsilon\sum_{k>N+M}D_k(t).
    \]

    This is a conditional improvement in kernel structure.  The residual tail is

    \[
    \int_0^T\sum_{k>N+M}D_k(t)\,dt.
    \]

    That tail lies above the inherited first-moment surfaces currently available.
    The newest support audit sharpens the live target: in the truly separated
    geometry, the bare shell-exchange target is vacuous, so the surviving theorem
    has to live at the signed commutatorized lifted-remainder level before absolute
    values turn the defect back into a raw positive carrier.



    \subsection{Energy Baseline Bridge Lemma}

    This bridge tells the reader what the energy layer contributes to the
    classical route.  After the modified-equation route is set aside, the classical
    argument begins from the standard global energy budget and viscous dissipation
    control.  Those estimates are compulsory infrastructure for admissible data.
    They give the route its baseline size control.

    The singularity question is sharper than baseline size.  It asks whether the
    solution can transport enough energy into dangerous small scales to lose the
    classical continuation surface.  The global energy budget leaves that transport
    uncontrolled, and the dissipation integral leaves open a
    continuation-level gradient bound by itself.  The theorem-bearing work after
    the baseline layer is the small-scale cascade and the gradient-growth channel
    fed by that cascade.

    D.82 is the reader bridge into this baseline layer.  D.83 makes the
    necessary-infrastructure and insufficient-closure statement precise.  D.84
    then records the entrance-tail reserve already paid at regular entrance times,
    before the route reaches the square-source obstruction.



    \subsection{Lemma E.I: Energy/Enstrophy Baseline And Its Insufficiency}

    Let \(\{u^{(n)},p^{(n)}\}\) be a smooth classical approximation family on
    \((0,T)\times\mathbb R^3\), with divergence-free admissible data and viscosity
    \(\nu>0\). The baseline estimate is

    \[
    \sup_n\sup_{t\in[0,T]}\|u^{(n)}(t)\|_{L^2_x}^2
    +2\nu\sup_n\int_0^T\|\nabla u^{(n)}(t)\|_{L^2_x}^2\,dt
    \le C_E.
    \]

    Every classical regularity route on this surface has to retain this bound,
    because it is the standard energy identity.  The lemma separates that necessary
    baseline from the two estimates that carry the remaining closure burden:

    \[
    \text{a dyadic tail/flux estimate suppressing dangerous transfer,}
    \]

    \[
    \text{or a high-frequency enstrophy coercivity estimate with absorbable
    commutator remainder.}
    \]

    To see the obstruction, write the dyadic enstrophy balance for \(P_j u\) and
    separate the low-high, high-low, and high-high transport pieces.  The baseline
    bound controls global energy and integrated dissipation.  The high-frequency
    transport remainder has to enter the absorbable-plus-summable form needed
    for the scale-barrier tail estimate or the gradient coercivity estimate.

    D.83 proves this exact route fact: energy/enstrophy control is necessary
    baseline data, and the proof needs the dyadic tail and coercivity bridges after
    that baseline is present.  It is an insufficiency lemma for the proof route; it
    records the proof-route gap rather than a blow-up claim.



    \subsection{Exact Dyadic Interaction Decomposition}

    The decomposition below is unconditional support for the classical
    three-dimensional Navier--Stokes vorticity equation.  It shows exactly where the
    dyadic route stops before an additional coercive mechanism is supplied.

    Let \(u\) be a smooth classical solution on
    \([0,T]\times\mathbb R^3\), with vorticity
    \(\omega=\nabla\times u\).  Fix a homogeneous Littlewood--Paley decomposition

    \[
    \omega=\sum_{j\ge -1}\Delta_j\omega.
    \]

    For each dyadic shell, the transport part cancels and the shell interaction is
    only the commutator:

    \[
    \big\langle \Delta_j(\omega\cdot\nabla u),\,\Delta_j\omega\big\rangle
    =
    \big\langle [\Delta_j,u\cdot\nabla]\omega,\,\Delta_j\omega\big\rangle.
    \]

    \[
    \big\langle u\cdot\nabla\Delta_j\omega,\,\Delta_j\omega\big\rangle = 0.
    \]

    The paraproduct expansion is

    \[
    u\cdot\nabla\omega
    =
    T_u(\nabla\omega)+T_{\nabla\omega}(u)+R(u,\nabla\omega).
    \]

    The localized commutator has the model form

    \[
    [\Delta_j,u\cdot\nabla]\omega
    =
    \sum_{|k-j|\le C}[\Delta_j,S_{k-1}u\cdot\nabla]\Delta_k\omega
    +\text{lower-frequency commutators}.
    \]

    \[
    \big|\big\langle [\Delta_j,S_{j-1}u\cdot\nabla]\Delta_j\omega,\,
    \Delta_j\omega\big\rangle\big|
    \le C_{\mathrm{sf},5128}
    |\nabla S_{j-1}u|_{L^\infty_x}\,|\Delta_j\omega|_{L^2_x}^2.
    \]

    The remainders have the desired second-order kernel gain,

    \[
    |\mathrm{Rem}_j|
    \le C_{\mathrm{sf},5136}
    2^{-2j}\|\omega\|_{\dot H_x^{1/2}}^2.
    \]

    The principal low-high term is different.  It is governed by the low-frequency
    strain coefficient \(\|\nabla S_{j-1}u\|_{L^\infty_x}\).  The decomposition
    alone does not give a uniform coercive deficit such as

    \[
    \big|\big\langle \Delta_j(\omega\cdot\nabla u),\Delta_j\omega\big\rangle\big|
    \le
    (1-\delta)\nu 2^{2j}\|\Delta_j\omega\|_{L_x^2}^2.
    \]

    So D.87 is a boundary note, not a closure theorem.  It tells the reader exactly
    what later work must supply: an anti-cascade or coherence defect, an alignment
    suppression of the strain channel, or a genuine high-frequency gain strong
    enough to put the low-high coefficient below the viscous shell scale
    \(\nu2^{2j}\).


    \subsection{Exact-Potential Angular Record Discharge}

    The exact-potential angular record is an assembly step.  It shows how the
    branch turns a pair/projector record into the angular ledger needed downstream.
    It consumes \(D.7mq\), the installed synchronization estimate \((D.7m3)\), and
    selector-strain compatibility; it does not prove those inputs.

    Use the three projectors
    \[
    \Pi_J^{pair}:=\widehat P_{J,\varepsilon}^{pair},
    \qquad
    \Pi_J^{ref}:=P_J^{CG},
    \qquad
    \Pi_J^{top}:=P_{J,\top}^{seg},
    \]
    on the selector-good family \(\mathcal G_J\).  The weighted observation packet
    is
    \[
    \mathcal E_{J,M}^{obs}
    :=
    \int_{\mathcal G_J} M_J^2 |W_J|^2\,d\mu_J,
    \]
    and the angular defect is
    \[
    \Xi_J^{ang}
    :=
    1-(e_{ab}\cdot n_J)^2
    =
    \frac12
    \bigl\|e_{ab}e_{ab}^{\top}-\Pi_J^{top}\bigr\|_F^2 .
    \]

    The first input is \(D.7mq\).  It says that, once \(PTC\)-Lin and
    \(PTC\)-Shape have paid the pair-to-cocycle synchronization debt, the pair
    projector and the Cauchy--Green reference projector differ by a weighted
    vanishing remainder:
    \[
    \bigl\|\Pi_J^{pair}-\Pi_J^{ref}\bigr\|_F^2\le R_J^{pair}
    \quad\text{on }\mathcal G_J,
    \qquad
    \int_{\mathcal G_J} M_J^2 R_J^{pair}\,d\mu_J=o_J(1).
    \]
    The installed synchronization estimate \((D.7m3)\) connects the raw pair
    direction to \(\Pi_J^{pair}\):
    \[
    \bigl\|e_{ab}e_{ab}^{\top}-\Pi_J^{pair}\bigr\|_F^2
    \le C|W_J|^2+R_J^{sync},
    \qquad
    \int_{\mathcal G_J}M_J^2R_J^{sync}\,d\mu_J=o_J(1).
    \]
    By inserting \(\Pi_J^{pair}\) between \(e_{ab}e_{ab}^{\top}\) and
    \(\Pi_J^{ref}\), the branch gets the reference observation bound
    \[
    \int_{\mathcal G_J} M_J^2
    \bigl\|e_{ab}e_{ab}^{\top}-\Pi_J^{ref}\bigr\|_F^2\,d\mu_J
    \le C_{\mathrm{sf},5262}
    \mathcal E_{J,M}^{obs}+o_J(1).
    \]

    The second input is selector-strain compatibility.  It compares the reference
    projector with the top strain projector:
    \[
    \bigl\|\Pi_J^{ref}-\Pi_J^{top}\bigr\|_F^2\le R_J^{ssc}
    \quad\text{on }\mathcal G_J,
    \qquad
    \int_{\mathcal G_J} M_J^2 R_J^{ssc}\,d\mu_J=o_J(1).
    \]
    After choosing a measurable unit lift \(r_J\) of \(\Pi_J^{ref}\), this is also
    the statement
    \[
    1-(r_J\cdot n_J)^2\le \frac12 R_J^{ssc}.
    \]

    Combining the reference observation bound with the selector-strain bound gives
    the branch-facing angular record:
    \[
    \int_{\mathcal G_J} M_J^2\Xi_J^{ang}\,d\mu_J
    \le C_{\mathrm{sf},5284}
    \mathcal E_{J,M}^{obs}+o_J(1).
    \]
    Since \(0\le \Xi_J^{ang}\le 1\), this also supplies the older quadratic
    reconstruction target:
    \[
    \int_{\mathcal G_J} M_J^2(\Xi_J^{ang})^2\,d\mu_J
    \le C_{\mathrm{sf},5292}
    \mathcal E_{J,M}^{obs}+o_J(1).
    \]

    So D.89 pays the angular-ledger export only after its two upstream routes have
    been supplied:
    \[
    \begin{gathered}
    PTC\text{-}Lin+PTC\text{-}Shape\Longrightarrow \text{pair-to-cocycle input},\\
    \text{selector support packets}\Longrightarrow \text{source-sector exact potential}.
    \end{gathered}
    \]
    Those are the real debts.  D.89 is the place where those debts become an
    SG.4-facing directional ledger.



