      \subsection{Far-Separated Linear-To-Active-Square Bridge}

      The older fallback bridge carries the far-separated linear tail-square block
      into \(LPAS\). It remains useful as a consistency check, while the preceding
      direct absorption is the current reserve payment.

      \[
      E_j(t)=2^{2j}\|\Delta_j u(t)\|_2^2,
      \qquad
      D_j(t)=2^{4j}\|\Delta_j u(t)\|_2^2=2^{2j}E_j(t).
      \]

      \[
      P_j(t):=\sum_{N\le k\le j-C_0}E_k(t).
      \]
      The far-separated half and the active-square packet are
      \[
      Far_N^+(t):=2^{-2N}\sum_{j\ge N+C_0}P_j(t)E_j(t),
      \]
      \[
      LPAS_N(t):=\sum_{j\ge N+C_0}P_j(t)2^{-j}D_j(t)^2
      =\sum_{j\ge N+C_0}P_j(t)2^{3j}E_j(t)^2.
      \]
      Young's inequality gives, for every \(\eta>0\),
      \[
      Far_N^+(t)
      \le
      \eta LPAS_N(t)
      +C_\eta 2^{-4N}\sum_{j\ge N+C_0}2^{-3j}P_j(t).
      \]
      After summing the lower prefix in the opposite order,
      \[
      \sum_{j\ge N+C_0}2^{-3j}P_j(t)
      \le
      C_{C_0}2^{-3N}E_N(t),
      \]
      so
      \[
      \int_0^TFar_N^+(t)\,dt
      \le
      \eta\int_0^T LPAS_N(t)\,dt+C_{\eta,C_0,E}2^{-7N}.
      \]
      This proves the fallback bridge: \(LPAS\) controls the far-separated
      tail-square half up to a summable reserve. The direct energy absorption in
      D.118 is stronger for this reserve, because it closes the far-separated block
      without using \(LPAS\).


