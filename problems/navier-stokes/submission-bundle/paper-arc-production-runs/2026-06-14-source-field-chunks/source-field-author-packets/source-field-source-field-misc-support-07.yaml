    direct absorption is the current reserve payment.

    \[
    E_j(t)=2^{2j}\|\Delta_j u(t)\|_2^2,
    \qquad
    D_j(t)=2^{4j}\|\Delta_j u(t)\|_2^2=2^{2j}E_j(t).
    \]

    \[
    P_j(t):=\sum_{N\le k\le j-C_0}E_k(t).
    \]
    The far-separated half and the active-square packet are
    \[
    Far_N^+(t):=2^{-2N}\sum_{j\ge N+C_0}P_j(t)E_j(t),
    \]
    \[
    LPAS_N(t):=\sum_{j\ge N+C_0}P_j(t)2^{-j}D_j(t)^2
    =\sum_{j\ge N+C_0}P_j(t)2^{3j}E_j(t)^2.
    \]
    Young's inequality gives, for every \(\eta>0\),
    \[
    Far_N^+(t)
    \le
    \eta LPAS_N(t)
    +C_\eta 2^{-4N}\sum_{j\ge N+C_0}2^{-3j}P_j(t).
    \]
    After summing the lower prefix in the opposite order,
    \[
    \sum_{j\ge N+C_0}2^{-3j}P_j(t)
    \le
    C_{C_0}2^{-3N}E_N(t),
    \]
    so
    \[
    \int_0^TFar_N^+(t)\,dt
    \le
    \eta\int_0^T LPAS_N(t)\,dt+C_{\eta,C_0,E}2^{-7N}.
    \]
    This proves the fallback bridge: \(LPAS\) controls the far-separated
    tail-square half up to a summable reserve. The direct energy absorption in
    D.118 is stronger for this reserve, because it closes the far-separated block
    without using \(LPAS\).



    \subsection{Final Amplitude-Speed Gate Theorem}

    This subsection records the local collar gate used by the final collar route.
    The target estimate is
    \[
    \|u_{coh}\|_{L^\infty(\Gamma_j(t))}
    \le
    \kappa_U\nu2^j+C2^{-j}\Phi_\ast(\mathcal E_D(X)),
    \qquad
    \Phi_\ast\in\{\Phi,\Phi_{low}\}.
    \]
    The route has several supplier branches. High active shells are covered by the
    uniform \(H_D^s\) threshold theorem. Low shells are covered either by proving
    \[
    M_{low}(X)\le C\Phi(\mathcal E_D(X))
    \]
    or by using the enlarged ledger
    \[
    \Phi_\ast=\Phi_{low}:=\Phi+\theta_{low}M_{low}.
    \]
    The weighted plateau branch uses a selector \(w_j\) satisfying
    \[
    w_j=1
    \qquad\text{on every active fixed collar support.}
    \]
    The weighted fallback branch supplies the same coefficient inputs through the
    weighted-principal and lower-order residual split.

    Once one of these supplier branches is installed, the collar route gets the
    coherent coefficient bounds it needs:
    \[
    \|\nabla u_{coh}\|_\infty
    \le
    c_0\nu2^{2j}+C\Phi_\ast(\mathcal E_D(X)).
    \]
    The finite high-collar multiplier estimate has the same lower-order ledger.
    The current record decision is to use \(\Phi_\ast=\Phi_{low}\) until an
    original-ledger recovery theorem proves \(M_{low}\le C\Phi\).



    \subsection{Finite Entrance-Sector Sign Refinement}

    This is an active upstream debt note for the constructive balanced-frame route.
    It packages the selector-side exact primitive. The theorem-facing target is
    \[
    \begin{gathered}
    \text{sector-stable diagonal-density/row-sum control}\\
    \text{on a finite entrance-sector subdivision}
    \end{gathered}
    \Longrightarrow
    S_{\mathrm{refine}}.
    \]
    The input says that the TPS cap-balancing and reserve-sign refinement has been
    realized on a finite entrance-sector subdivision, that every terminal sector
    cell satisfies the diagonal-density and weighted row-sum bounds, and that each
    active pair is assigned to the terminal sector cell containing its entrance
    direction \(e_{ab}(t_0)\).

    This reduces the selector-side exact-potential primitive to one refinement
    theorem on the same layer. More sharply, after the inherited bounded-multiplicity
    entrance-sector graph is accepted, the remaining source-level selector wall is
    sectorwise relative oscillation control of the diagonal density around the
    parent-cell average. Downstream, this selector packet is paired with finite
    shell comparability and the regular-window bound
    \[
    \sup|\nabla v_J|
    \]
    on the active segments.



    \subsection{Finite Low-Shell Amplitude Residual Control Result}

    The uniform \(H_D^s\) threshold result covers high active shells
    \[
    j\ge J_{high}(C_X,\nu,\kappa_U).
    \]
    The remaining active low-shell block is
    \[
    \mathcal L(C_X,\nu,\kappa_U)
    :=
    \{j:j<J_{high}(C_X,\nu,\kappa_U)\}
    \]
    inside the active dyadic range. On a bounded active range, \(\mathcal L\) is
    finite. For \(j\in\mathcal L\), set
    \[
    A_j^{low}(I_j)
    :=
    \sup_{r\in I_j}\|u_{coh}(r)\|_{L_x^\infty(\Gamma_j(r))}.
    \]
    The low-shell residual condition is
    \[
    A_j^{low}(I_j)
    \le
    \kappa_U\nu2^j+C_U2^{-j}\Phi(\mathcal E_D(X))
    \qquad
    j\in\mathcal L.
    \]
    This is exactly the amplitude gate on the finite low-shell block. If the
    coherent flow is absolutely continuous and the persistent support is invariant
    on \(I_j\), the same bound also gives the flow-speed gate by integrating
    \(u_{coh}\) along the coherent flow.

    The finite residual ledger is
    \[
    \mathcal R_{low}(X)
    :=
    \max_{j\in\mathcal L}
    \left[
    A_j^{low}(I_j)-\kappa_U\nu2^j-C_U2^{-j}\Phi(\mathcal E_D(X))
    \right]_+.
    \]
    Thus \(\mathcal R_{low}=0\) is equivalent to all low active shells satisfying
    the amplitude gate. If
    \[
    \mathcal R_{low}(X)\le C_{low}\Phi(\mathcal E_D(X)),
    \]
    then the low-shell block contributes to the same lower-order ledger already
    present in the collar closure.



    \subsection{Finite Low-Shell Record Inclusion Result}

    The finite low-shell branch has a real amplitude datum
    \[
    M_{low}(X):=
    \max_{j\in\mathcal L}
    \sup_{r\in I_j}\|u_{coh}(r)\|_{L_x^\infty(\Gamma_j(r))}.
    \]
    Finiteness of \(\mathcal L\) does not bound this quantity. Scaling a coherent
    low-shell state by \(A\) scales \(M_{low}\) by \(A\), so a lower-order ledger
    that does not see this amplitude cannot dominate it uniformly.

    The honest bookkeeping route is to extend the ledger:
    \[
    \Phi_{low}(\mathcal E_D(X))
    :=
    \Phi(\mathcal E_D(X))+\theta_{low}M_{low}(X),
    \qquad
    \theta_{low}>0.
    \]
    Then
    \[
    M_{low}(X)\le \theta_{low}^{-1}\Phi_{low}(\mathcal E_D(X)).
    \]
    The non-extended route remains available only after proving
    \[
    M_{low}(X)\le C_\Phi\Phi(\mathcal E_D(X)).
    \]
    So the collar estimate is closed either with the original ledger plus this
    extra domination theorem, or with the explicit \(\Phi_{low}\) ledger.



    \subsection{Finite Shell Comparability On Core-Cap Family}

    This is the shell-side upstream debt paired with the selector refinement above.
    Keep the shell caps from the quadratic sign-separation packet and define
    \[
    s_{\pm,r}^{shell}
    :=
    \sigma_{N_a}\bigl(\widehat C_{\pm,r}\setminus \widetilde C_{\pm,r}\bigr).
    \]
    Let \(\delta_{J,r}^\pm(a)\) denote the corresponding shell-mass observables on
    the active family. The comparability input is
    \[
    \int_{G_J}
    \Bigl|
    \delta_{J,r}^\pm(a)-s_{\pm,r}^{shell}
    \Bigr|\,d\mu_j(a)
    \le
    \varepsilon_J^{shell},
    \]
    and the chosen model shells satisfy
    \[
    \max_{r,\pm} s_{\pm,r}^{shell}\le \varsigma_J,
    \qquad
    \varsigma_J\to 0.
    \]
    Define
    \[
    \eta_J^{shell}
    :=
    \varepsilon_J^{shell}
    +
    \varsigma_J\,\mu_j(G_J).
    \]
    The triangle inequality gives
    \[
    \int_{G_J}\delta_{J,r}^\pm(a)\,d\mu_j(a)
    \le
    \int_{G_J}\Bigl|\delta_{J,r}^\pm(a)-s_{\pm,r}^{shell}\Bigr|\,d\mu_j(a)
    +
    s_{\pm,r}^{shell}\mu_j(G_J).
    \]
    With the two inputs above, the shell leakage packet is bounded by
    \(\eta_J^{shell}\). This isolates the shell-side burden that survives on the
    constructive \(PTC\text{-}Shape\) branch after selector and graph-mass
    reductions: finite shell comparability on the same core-cap family.


