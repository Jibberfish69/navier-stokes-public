      \subsection{Finite Low-Shell Amplitude Residual Control Result}

      The uniform \(H_D^s\) threshold result covers high active shells
      \[
      j\ge J_{high}(C_X,\nu,\kappa_U).
      \]
      The remaining active low-shell block is
      \[
      \mathcal L(C_X,\nu,\kappa_U)
      :=
      \{j:j<J_{high}(C_X,\nu,\kappa_U)\}
      \]
      inside the active dyadic range. On a bounded active range, \(\mathcal L\) is
      finite. For \(j\in\mathcal L\), set
      \[
      A_j^{low}(I_j)
      :=
      \sup_{r\in I_j}\|u_{coh}(r)\|_{L_x^\infty(\Gamma_j(r))}.
      \]
      The low-shell residual condition is
      \[
      A_j^{low}(I_j)
      \le
      \kappa_U\nu2^j+C_U2^{-j}\Phi(\mathcal E_D(X))
      \qquad
      j\in\mathcal L.
      \]
      This is exactly the amplitude gate on the finite low-shell block. If the
      coherent flow is absolutely continuous and the persistent support is invariant
      on \(I_j\), the same bound also gives the flow-speed gate by integrating
      \(u_{coh}\) along the coherent flow.

      The finite residual ledger is
      \[
      \mathcal R_{low}(X)
      :=
      \max_{j\in\mathcal L}
      \left[
      A_j^{low}(I_j)-\kappa_U\nu2^j-C_U2^{-j}\Phi(\mathcal E_D(X))
      \right]_+.
      \]
      Thus \(\mathcal R_{low}=0\) is equivalent to all low active shells satisfying
      the amplitude gate. If
      \[
      \mathcal R_{low}(X)\le C_{low}\Phi(\mathcal E_D(X)),
      \]
      then the low-shell block contributes to the same lower-order ledger already
      present in the collar closure.


