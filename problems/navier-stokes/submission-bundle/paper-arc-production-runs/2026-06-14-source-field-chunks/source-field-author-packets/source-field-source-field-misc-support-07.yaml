      \subsection{Final Amplitude-Speed Gate Theorem}

      This subsection records the local collar gate used by the final collar route.
      The target estimate is
      \[
      \|u_{coh}\|_{L^\infty(\Gamma_j(t))}
      \le
      \kappa_U\nu2^j+C2^{-j}\Phi_\ast(\mathcal E_D(X)),
      \qquad
      \Phi_\ast\in\{\Phi,\Phi_{low}\}.
      \]
      The route has several supplier branches. High active shells are covered by the
      uniform \(H_D^s\) threshold theorem. Low shells are covered either by proving
      \[
      M_{low}(X)\le C\Phi(\mathcal E_D(X))
      \]
      or by using the enlarged ledger
      \[
      \Phi_\ast=\Phi_{low}:=\Phi+\theta_{low}M_{low}.
      \]
      The weighted plateau branch uses a selector \(w_j\) satisfying
      \[
      w_j=1
      \qquad\text{on every active fixed collar support.}
      \]
      The weighted fallback branch supplies the same coefficient inputs through the
      weighted-principal and lower-order residual split.

      Once one of these supplier branches is installed, the collar route gets the
      coherent coefficient bounds it needs:
      \[
      \|\nabla u_{coh}\|_\infty
      \le
      c_0\nu2^{2j}+C\Phi_\ast(\mathcal E_D(X)).
      \]
      The finite high-collar multiplier estimate has the same lower-order ledger.
      The current record decision is to use \(\Phi_\ast=\Phi_{low}\) until an
      original-ledger recovery theorem proves \(M_{low}\le C\Phi\).


