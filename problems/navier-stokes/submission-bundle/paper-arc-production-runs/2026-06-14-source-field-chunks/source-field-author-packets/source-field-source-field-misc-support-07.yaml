      \subsection{Far-Separated Linear-To-Active-Square Bridge Discharge}

      Let
      \[
      D_N(t):=\sum_{j\ge N}D_j(t).
      \]
      For a fixed separation width \(C_0\), define the oriented far-separated block
      \[
      Far_N^+(t):=
      2^{-2N}
      \sum_{j\ge N+C_0}
      E_j(t)
      \sum_{N\le k\le j-C_0}E_k(t).
      \]
      Assume the global energy bound
      \[
      \sup_{t<T}\|u(t)\|_2^2\le C_E.
      \]
      For each lower shell,
      \[
      E_k(t)=2^{2k}\|\Delta_k u(t)\|_2^2
      \le C_E2^{2k}.
      \]
      Hence
      \[
      \sum_{N\le k\le j-C_0}E_k(t)
      \le
      C_{C_0}C_E2^{2j}.
      \]
      Substitution into \(Far_N^+\) gives
      \[
      Far_N^+(t)
      \le C_{C_0}C_E2^{-2N}D_N(t).
      \]
      Choosing \(N\) so large that
      \[
      2C_{C_0}C_E2^{-2N}\le\varepsilon\nu
      \]
      gives
      \[
      Far_N^+(t)\le \varepsilon\nu D_N(t).
      \]

      The same argument applies to the opposite orientation after swapping shell
      labels. The full far-separated tail-square block is absorbed by the global
      energy bound. It
      does not require an \(LPAS\) bridge for the reserve.


