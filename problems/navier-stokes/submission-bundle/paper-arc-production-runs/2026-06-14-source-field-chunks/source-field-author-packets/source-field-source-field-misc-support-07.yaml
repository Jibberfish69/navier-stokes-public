      \subsection{Finite Low-Shell Record Inclusion Result}

      The finite low-shell branch has a real amplitude datum
      \[
      M_{low}(X):=
      \max_{j\in\mathcal L}
      \sup_{r\in I_j}\|u_{coh}(r)\|_{L_x^\infty(\Gamma_j(r))}.
      \]
      Finiteness of \(\mathcal L\) does not bound this quantity. Scaling a coherent
      low-shell state by \(A\) scales \(M_{low}\) by \(A\), so a lower-order ledger
      that does not see this amplitude cannot dominate it uniformly.

      The honest bookkeeping route is to extend the ledger:
      \[
      \Phi_{low}(\mathcal E_D(X))
      :=
      \Phi(\mathcal E_D(X))+\theta_{low}M_{low}(X),
      \qquad
      \theta_{low}>0.
      \]
      Then
      \[
      M_{low}(X)\le \theta_{low}^{-1}\Phi_{low}(\mathcal E_D(X)).
      \]
      The non-extended route remains available only after proving
      \[
      M_{low}(X)\le C_\Phi\Phi(\mathcal E_D(X)).
      \]
      So the collar estimate is closed either with the original ledger plus this
      extra domination theorem, or with the explicit \(\Phi_{low}\) ledger.


