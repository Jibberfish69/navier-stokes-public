      \subsection{Gradient High-Side Remainder Packet}

      The combined high-side packet was originally written as

      \[
      \mathfrak{H}^{grad}_{N}[u](t)
      :=
      \sum_{j\ge N}2^{2j}|\mathcal{C}_j(t)|,
      \]

      where \(\mathcal C_j\) bundles the lifted high-side remainder together with the
      genuine high-high commutator after the threshold-local spill collar has been
      separated.

      \[
      (S_{j-4}-S_{N+M})u,
      \]

      \[
      \mathfrak{H}^{grad}_{N}[u](t)
      \le
      \eta\nu D_N(t) + C_*2^{-2\delta N}
      \]

      The live open part is not the genuine high-high packet.  It is the lifted
      remainder

      \[
      \mathfrak{H}^{grad,lift}_{N}[u](t)
      :=
      \sum_{j\ge N}2^{2j}|\mathcal{C}^{lift}_j(t)|,
      \]

      coming from the intermediate transport band

      \[
      N+M < k < j-4,
      \]

      with output shell \(j\).  This is below the output shell but above the fixed
      collar, so the near-diagonal high-high argument does not apply.

      The naive bound has the form

      \[
      2^{2j}|\mathcal C_j^{lift}(t)|
      \le C_{\mathrm{sf},8889}
      \Bigl(\sum_{N+M<k<j-4}2^{3k/2}\|\Delta_ku(t)\|_{L^2_x}\Bigr)
      2^{4j}\|\Delta_ju(t)\|_{L^2_x}^2 .
      \]

      The coefficient still depends on the output shell \(j\).  The desired
      proposition-level result is

      \[
      \mathfrak H_N^{grad,lift}(t)
      \le
      \varepsilon\nu D_N(t)+C_*2^{-2\delta N},
      \]

      or the same bound after time integration.  That theorem is not installed.  The
      lifted remainder is the real open high-side packet.


