      \subsection{Mediating Object: gradient control bridge discharge}

      This object fixes the fourth-bridge branch order.  The live branch is the
      Euclidean gradient-transfer route on the classical equation.  The older
      curvature-based regularity bridge is preserved as provenance only.

      The gradient-control bridge (GCD.1) is the local implication that the scale
      barrier, same-surface nonlinear closure, and gradient-transfer coercivity
      together give classical continuation control.

      The branch-order dispute is settled locally: this paper is using Route B on
      the fixed Euclidean surface.  The final theorem warrant still depends on the
      Euclidean packet closure above.


