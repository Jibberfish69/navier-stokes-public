      \subsection{Gradient Lifted Remainder Time-Integrated Audit}

      This audit asks whether the lifted remainder can be paid only after integrating
      in time.  The desired theorem is

      \[
      \int_0^T|\mathfrak H_N^{grad,lift}(t)|\,dt
      \le
      \varepsilon\nu\int_0^TD_N(t)\,dt+C_*2^{-2\delta N}.
      \]

      \[
      (S_{j-4}-S_{N+M})u,
      \]

      keeps the same intermediate shell support

      \[
      N+M<k<j-4,
      \]

      so a proof of \((GLR.1)\) has to estimate that exact shell sum.

      \[
      |\mathfrak H_N^{grad,lift}[u](t)|
      \le C_{\mathrm{sf},8935}
      \|u_{\ge N+M}(t)\|_{L^2_x}\,E_N(t)^{1/2}D_N(t)^{1/2}.
      \]

      This model route would be useful, because the inherited scale barrier
      controls \(\|u_{\ge N+M}\|_{L_t^2L_x^2}\).  The current proof surface does not
      derive the model bound from the exact shell algebra.

      \[
      \sum_{N+M<k<j-4}2^{3k/2}\|\Delta_k u(t)\|_{L^2_x},
      \]

      is still the real coefficient.  It has not been collapsed into a generic
      high-tail factor without losing a supercritical dyadic weight.

      \[
      2^{2j}|\mathcal C_j^{lift}(t)|
      \le C_{\mathrm{sf},8952}
      \Big(\sum_{N+M<k<j-4}2^{3k/2}\|\Delta_k u(t)\|_{L^2_x}\Big)
      2^{4j}\|\Delta_j u(t)\|_{L^2_x}^2.
      \]

      There is a second obstruction.  The integrated argument naturally wants
      \(\sup_tE_N(t)\), but Proposition \(6.1^\sharp\) is exactly the mechanism
      intended to produce that bound.  Using it inside the proof of the lifted
      remainder would be circular.

      So the time-integrated lifted-remainder route remains open for two concrete
      reasons: the reduced high-tail form has not been proved from
      \(N+M<k<j-4\), and the most natural spacetime estimate imports the conclusion
      of the proposition it is supposed to feed.


