      \subsection{Gradient Paraproduct Reduction Lemma}

      \[
      \Lambda_N(t):=\|\nabla S_{N-4}u(t)\|_{L^\infty}.
      \]

      \[
      \widetilde\Lambda_N^\sharp(t)=\Lambda_N(t)+\Theta_N^\sharp(t).
      \]

      For the strict low-mode packet, write

      \[
      u_j:=\Delta_j u,
      \qquad
      E_N(t):=\sum_{j\ge N}2^{2j}\|u_j(t)\|_2^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|u_j(t)\|_2^2.
      \]

      \[
      a_N:=S_{N-4}u,
      \qquad
      \Lambda_N(t):=\|\nabla a_N(t)\|_\infty.
      \]

      \[
      LH_j:=\left\langle [\Delta_j,a_N\cdot\nabla]u_{\sfcomp{9075} j},-\Delta u_j\right\rangle.
      \]

      The uncommuted transport term cancels because \(a_N\) is divergence-free.
      Writing the commutator with the Littlewood--Paley kernel and placing one
      derivative on \(a_N\) gives

      \[
      \sum_{j\ge N}\bigl(|LH_j|+|HL_j|\bigr)
      \le
      C\Lambda_N(t)E_N(t).
      \]

      This is a repaired theorem-facing reduction.  Its cost is that the coefficient
      is the fixed-threshold strain \(\Lambda_N\), not the weaker
      \(\mathcal L_N\).  The spill lemma supplies the other half of
      \(\widetilde\Lambda_N^\sharp\).


