      \subsection{Gradient High-High Near-Diagonal Reduction Lemma}

      \[
      \mathcal C^{\nabla,HH}_j(t)
      :=
      \sum_k
      \left\langle
      \Delta_j\big(\Delta_k u(t)\cdot\nabla\widetilde\Delta_k u(t)\big),
      -\Delta\Delta_j u(t)
      \right\rangle,
      \]

      \[
      \widetilde\Delta_k:=\Delta_{k-1}+\Delta_k+\Delta_{k+1}.
      \]

      \[
      \mathfrak H^{grad,HH}_N[u](t)
      :=
      \sum_{j\ge N}\left|\mathcal C^{\nabla,HH}_j(t)\right|.
      \]

      This convention includes the \(-\Delta\Delta_j u\) test inside
      \(\mathcal C^{\nabla,HH}_j\).  No extra outside \(2^{2j}\) factor is added.

      \[
      \left|\mathcal C^{\nabla,HH}_j(t)\right|
      \le
      C\sum_{|k-j|\le M}
      2^{\frac92j}
      \|\Delta_k u(t)\|_2
      \|\widetilde\Delta_k u(t)\|_2
      \|\Delta_j u(t)\|_2.
      \]

      \[
      \mathfrak H^{grad,HH}_N[u](t)
      \le
      C_M\sum_{j\ge N-M}2^{\frac92j}\|\Delta_j u(t)\|_2^3.
      \]

      Fourier support gives near-diagonal survival only: after applying
      \(\Delta_j\), the product
      \[
      \Delta_ku\cdot\nabla\widetilde\Delta_ku
      \]
      contributes only when \(|k-j|\le M\).  Bernstein gives the
      \(2^{5j/2}\) product size, and the \(-\Delta\Delta_j u\) test contributes the
      \(2^{2j}\) gradient weight, producing the \(2^{9j/2}\) cubic packet.

      This reduction is proof-level for the genuine high-high slot.  It does not
      touch the lifted remainder, whose transport shell may satisfy
      \(N+M<k<j-4\).


