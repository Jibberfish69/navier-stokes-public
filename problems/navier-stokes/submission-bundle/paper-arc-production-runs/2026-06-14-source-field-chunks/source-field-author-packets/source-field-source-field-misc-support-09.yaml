    text: |+
      \subsection{Gradient Spill Reduction Lemma}

      The threshold-spill packet is finite-width in dyadic scale.  It appears when
      the moving low cutoff is replaced by the fixed cutoff \(S_{N-4}\).

      \[
      \widetilde\Lambda_N^\sharp(t)=\Lambda_N(t)+\Theta_N^\sharp(t).
      \]

      \[
      E_N(t):=\sum_{j\ge N}2^{2j}\|\Delta_j u(t)\|_2^2,
      \qquad
      D_N(t):=\sum_{j\ge N}2^{4j}\|\Delta_j u(t)\|_2^2.
      \]

      \[
      \Theta_N(t):=\sum_{m=N-M}^{N+M}2^{\frac32m}\|\Delta_m u(t)\|_2,
      \]

      \[
      \Theta_N^\sharp(t):=\sum_{m=N-M}^{N+M}2^{3m}\|\Delta_m u(t)\|_2^2.
      \]

      \[
      \sum_{j\ge N}|SP_j(t)|
      \le
      C_{\varepsilon,M,\nu}\Theta_N^\sharp(t)E_N(t)
      +\varepsilon\nu D_N(t).
      \]

      The proof uses finite collar overlap, integration by parts to put the
      derivative on the high output side, Bernstein on the threshold strip, and
      Young absorption into \(D_N\).  This pays the spill slot on the upgraded
      coefficient surface.  It does not assert uniform smallness of
      \(\Theta_N^\sharp\) as \(N\to\infty\); threshold choice remains part of the
      scheduler.


