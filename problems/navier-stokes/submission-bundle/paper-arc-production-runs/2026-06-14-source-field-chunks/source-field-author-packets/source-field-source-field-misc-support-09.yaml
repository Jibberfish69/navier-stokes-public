      \subsection{Gradient Genuine High-High Packet}

      After the strict low-mode and threshold-spill packets are removed, the genuine
      high-high object is

      \[
      \mathfrak{H}^{grad,HH}_{N}[u](t)
      :=
      \sum_{j\ge N}2^{2j}|\mathcal{C}^{HH}_j(t)|,
      \]

      where \(\mathcal C^{HH}_j\) is the near-diagonal high-high commutator
      remainder in the dyadic enstrophy identity.

      \[
      \mathfrak{H}^{grad,HH}_{N}[u](t)
      \le
      \eta\nu D_N(t) + C_*2^{-2\delta N}
      \]

      is now supplied by the near-diagonal reduction and cubic-tail absorption.
      The equivalent cubic form is

      \[
      \sum_{j\ge N-M}2^{\frac92j}\|\Delta_j u(t)\|_{L^2_x}^3
      \le
      \eta\nu D_N(t) + C_*2^{-2\delta N}.
      \]

      This subsection is a closed slot inside the larger gradient packet, not the
      whole fourth bridge.


