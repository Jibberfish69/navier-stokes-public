      \subsection{Lagrangian Stokes Bridge Program}

      The Lagrangian Stokes bridge is internal support for the Lagrangian route. The
      local Stokes estimate has to supply same-depth control after the flow-map
      pullback, while the far-corona bottleneck is closed elsewhere.

      \[
      \begin{aligned}
      &\partial_t v + A^\top\nabla_a q
      -\nu\,\operatorname{div}_a(G\nabla_a v)=f,\\
      &\operatorname{div}_a(Av)=0,\qquad G=AA^\top .
      \end{aligned}
      \]

      The desired estimate is a same-depth variable-coefficient Stokes estimate:

      \[
      \begin{aligned}
      \|v\|_{L_t^\infty H^s}
      +
      \|v\|_{L_t^2 H^{s+1}}
      +
      \|\partial_t v\|_{L_t^2 H^{s-1}}
      +
      \|\nabla_a q\|_{L_t^2 H^{s-1}}
      \le C_{\mathrm{sf},10567}
      \|v_0\|_{H^s}
      +
      \|f\|_{L_t^2 H^{s-1}}
      +
      \mathfrak C_s[A,G;v].
      \end{aligned}
      \]

      \(\mathfrak C_s[A,G;v]\) is allowed to use only the same-depth coefficient
      record already present in the Lagrangian package. It cannot hide extra
      derivatives of \(A\) or \(G\), since that would recreate the loss the six-lemma
      mainline is trying to avoid.

      For a frozen coefficient pair \(A_*,G_*=A_*A_*^\top\) coming from a genuine
      frozen flow map, the equation has the same Stokes character after composition
      with the frozen diffeomorphism:

      \[
      \operatorname{div}_a(A_* v)=0.
      \]

      \[
      \partial_t v + A_*^\top\nabla_a q-\nu\,\operatorname{div}_a(G_*\nabla_a v)=f.
      \]

      \[
      G_*=A_*A_*^\top,
      \qquad
      \det A_*=1,
      \]

      The frozen global problem is not the hard step. Standard Stokes theory plus
      composition and norm-equivalence constants for the frozen maps gives the
      same-depth estimate. The hard step appears when the proof localizes the frozen
      constraint.

      Localization breaks \(\operatorname{div}_a(A_*v)=0\). A cutoff argument must
      repair that divergence before the patchwise Stokes estimate can be summed. The
      local object needed here is an \(A_*\)-adapted Bogovskii repair:

      \[
      \operatorname{div}_a(A_*\mathcal B_{A_*}h)=h,
      \qquad
      \|\mathcal B_{A_*}h\|_{H^s_0(B)}
      \le C_{A_*,B,B'}\|h\|_{H^{s-1}(B')}.
      \]

