      \subsection{Lagrangian Material-Derivative Recheck Note}

      The material-derivative route becomes meaningful only after pulling the
      equation back along the flow map. A formal Eulerian replacement of
      \(\partial_t\) by \(D_t\) does not close the problem. The honest version is
      Lagrangian.

      \[
      \partial_t X(a,t)=u(X(a,t),t),
      \qquad
      X(a,0)=a.
      \]

      \[
      F(a,t):=\nabla_a X(a,t),
      \qquad
      A(a,t):=F(a,t)^{-1}.
      \]

      \[
      v(a,t):=u(X(a,t),t),
      \qquad
      q(a,t):=p(X(a,t),t).
      \]

      \[
      \det F(a,t)=1.
      \]

      The pulled-back equation is

      \[
      \partial_t v + A^\top \nabla_a q
      =
      \nu\,\operatorname{div}_a(G\nabla_a v),
      \qquad
      G:=AA^\top.
      \]

      At base energy level, pressure still cancels because

      \[
      \operatorname{div}_a(Av)=0,
      \qquad
      \int (A^\top\nabla_aq)\cdot v\,da
      =
      \int \nabla_aq\cdot Av\,da
      =0,
      \]

      and viscosity remains coercive:

      \[
      \frac12\frac{d}{dt}\|v(t)\|_{L_a^2}^2
      +
      \nu\int G\nabla_av:\nabla_av\,da
      =0.
      \]

      The benefit is exact: explicit advection disappears, pressure remains harmless
      in the natural pairing, and the viscous operator remains elliptic in divergence
      form. The price is also exact. Differentiating the pulled-back equation creates
      commutators from the coefficients \(A\) and \(G\):

      \[
      \partial_t\partial_a^\alpha v
      +
      A^\top\nabla_a\partial_a^\alpha q
      =
      \nu\operatorname{div}_a(G\nabla_a\partial_a^\alpha v)
      +
      \mathcal C_\alpha(A,G;v,q).
      \]

      The deformation geometry evolves by

      \[
      \partial_tA=-A(\nabla_xu)(X,t),
      \qquad
      \partial_tG
      =
      -A\big((\nabla_xu)+(\nabla_xu)^\top\big)(X,t)A^\top.
      \]

      Thus the Lagrangian route is a real fork only as a deformation-metric control
      program. It does not remove the tower burden; it moves the burden into
      coefficient geometry.


