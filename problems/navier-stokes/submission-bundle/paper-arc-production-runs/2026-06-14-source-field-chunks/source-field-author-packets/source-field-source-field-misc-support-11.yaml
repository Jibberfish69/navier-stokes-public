    For the fluid, the natural form package is

    \[
    \alpha:=u^\flat,
    \qquad
    \omega:=d\alpha,
    \qquad
    \delta\alpha=0,
    \qquad
    \Delta_H=d\delta+\delta d.
    \]

    Differential forms and Cartan exactness are well suited to the antisymmetric
    and exact channels. The symmetric strain/deformation side remains tensorial:

    \[
    G=AA^\top,
    \qquad
    \partial_tG
    =
    -A\big((\nabla u)+(\nabla u)^\top\big)A^\top.
    \]

    The section's status is support-only. It says which auxiliary language is
    licensed and what it may classify. It does not replace the concrete
    far-corona, survivor-dictionary, or deformation-drain theorems.



    \subsection{Lagrangian Material-Derivative Recheck Note}

    The material-derivative route becomes meaningful only after pulling the
    equation back along the flow map. A formal Eulerian replacement of
    \(\partial_t\) by \(D_t\) does not close the problem. The honest version is
    Lagrangian.

    \[
    \partial_t X(a,t)=u(X(a,t),t),
    \qquad
    X(a,0)=a.
    \]

    \[
    F(a,t):=\nabla_a X(a,t),
    \qquad
    A(a,t):=F(a,t)^{-1}.
    \]

    \[
    v(a,t):=u(X(a,t),t),
    \qquad
    q(a,t):=p(X(a,t),t).
    \]

    \[
    \det F(a,t)=1.
    \]

    The pulled-back equation is

    \[
    \partial_t v + A^\top \nabla_a q
    =
    \nu\,\operatorname{div}_a(G\nabla_a v),
    \qquad
    G:=AA^\top.
    \]

    At base energy level, pressure still cancels because

    \[
    \operatorname{div}_a(Av)=0,
    \qquad
    \int (A^\top\nabla_aq)\cdot v\,da
    =
    \int \nabla_aq\cdot Av\,da
    =0,
    \]

    and viscosity remains coercive:

    \[
    \frac12\frac{d}{dt}\|v(t)\|_{L_a^2}^2
    +
    \nu\int G\nabla_av:\nabla_av\,da
    =0.
    \]

    The benefit is exact: explicit advection disappears, pressure remains harmless
    in the natural pairing, and the viscous operator remains elliptic in divergence
    form. The price is also exact. Differentiating the pulled-back equation creates
    commutators from the coefficients \(A\) and \(G\):

    \[
    \partial_t\partial_a^\alpha v
    +
    A^\top\nabla_a\partial_a^\alpha q
    =
    \nu\operatorname{div}_a(G\nabla_a\partial_a^\alpha v)
    +
    \mathcal C_\alpha(A,G;v,q).
    \]

    The deformation geometry evolves by

    \[
    \partial_tA=-A(\nabla_xu)(X,t),
    \qquad
    \partial_tG
    =
    -A\big((\nabla_xu)+(\nabla_xu)^\top\big)(X,t)A^\top.
    \]

    Thus the Lagrangian route is a real fork only as a deformation-metric control
    program. It does not remove the tower burden; it moves the burden into
    coefficient geometry.



    \subsection{Lagrangian Observable-Quotient Bridge Note}

    Classical Lagrangian variables already separate the carrier from the Eulerian
    readout:

    \[
    (\Phi,F,A,G,v,q)
    \longrightarrow
    u=v\circ\Phi^{-1}.
    \]

    In the broader \(NC\to C\) route, the analogous shape is

    \[
    \text{NC carrier }X
    \longrightarrow
    \text{commutative shadow }u.
    \]

    The bridge idea is that the classical deformation carrier may be an
    intermediate geometric sector between a richer carrier and the Eulerian
    commutative field. This does not identify the classical Lagrangian carrier with
    the \(NC\) carrier, and it does not reduce the \(NC\) projection theorem to
    Lagrangian geometry. It only says that both routes separate raw representation
    from the sector where regularity is read.

    The useful common point is:

    \[
    \partial_t v+A^\top\nabla_aq
    =
    \nu\operatorname{div}_a(G\nabla_av),
    \qquad
    G=AA^\top.
    \]

    The control object is the deformation metric and its derivatives, not only the
    Eulerian mixed-jet tower. This makes the observable-sector analogy worth
    keeping as support, while the proof burden remains the deformation-drain
    theorem.



    \subsection{Lagrangian Observable-Sector Connection Note}

    In the top-level terminology here, Route A is the internal classical route and
    Route B is the broader \(NC\to C\) smoothness-closure route.  The point of the
    comparison is only the shared pullback/shadow shape between the classical
    Lagrangian pullback and the Route B quotient picture.

    For any Eulerian field \(f\), set

    \[
    \widetilde f(a,t):=f(X(a,t),t).
    \]

    \[
    \partial_t \widetilde f(a,t)
    =
    (D_t f)(X(a,t),t),
    \qquad
    D_t:=\partial_t+u\cdot\nabla.
    \]

    Explicit transport is absorbed into the comoving frame. For velocity,

    \[
    \partial_t v+A^\top\nabla_aq
    =
    \nu\operatorname{div}_a(G\nabla_av).
    \]

    Inside the \(NC\to C\) route, the shadow exact branch kills a pure invisible
    \(NC\) sector after projection, while the robustness branch leaves a controlled
    commutative remainder. The classical pullback has the same proof-shape at the
    level of representation: explicit transport is removed, and deformation
    geometry remains.

    The surviving classical data are

    \[
    F=\nabla_aX,
    \qquad
    A=F^{-1},
    \qquad
    G=AA^\top,
    \]

    with

    \[
    \partial_tF=(\nabla_xu)(X,t)F,
    \qquad
    \partial_tA=-A(\nabla_xu)(X,t).
    \]

    The exact takeaway is limited but useful. The Lagrangian route is an
    independent classical mechanism. Route B is a natural place to ask whether the
    same deformation mechanism survives projection into the commutative sector.
    This is route architecture, not a regularity theorem.



    \subsection{Lagrangian Six-Lemma Mainline}

