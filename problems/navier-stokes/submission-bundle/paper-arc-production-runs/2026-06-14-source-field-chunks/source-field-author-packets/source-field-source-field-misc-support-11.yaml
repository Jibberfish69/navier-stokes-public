      \subsection{Lifted Remainder Feedback Into Body 1 Audit}

      This audit asks whether the Body 1 feedback loop really strengthens the
      argument, or only moves the same open lifted packet from Body 4 back to Body 1.
      The remaining packet is the intermediate high-side transport band

      \[
      (S_{j-4}-S_{N+M})u,
      \qquad
      N+M<k<j-4.
      \]

      A useful feedback theorem would bound that band directly on the approximation
      family, or produce a stronger carrier that dominates it. Body 2 cannot supply
      that refinement by itself, since its information is frequency-coarse. Body 3
      can pass through a theorem already proved on the approximation family, but it
      does not turn a coarse tail bound into a finer shellwise transport estimate.

      The only noncircular feedback route is:

      \[
      \begin{gathered}
      \text{Body 1 proves a lifted-band transport leakage bound}\\
      \Longrightarrow\ \text{Body 3 passes it to the exact limit}\\
      \Longrightarrow\ \text{Body 4 consumes it}.
      \end{gathered}
      \]

      The coherent feedback shape is support-open. It does not close the lifted
      remainder; it places the same frequency-localized transport leakage theorem at
      the Body 1 export slot instead of hiding it inside the Body 4 consumer.


