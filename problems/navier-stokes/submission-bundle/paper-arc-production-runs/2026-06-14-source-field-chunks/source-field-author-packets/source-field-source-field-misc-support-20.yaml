    text: |+
      \subsection{B ASAC Time-Face All-Doors Rollup}

      The remaining doors consolidate around the diffuse terminal parent-cloud
      obstruction reached by source-ancestry compactness. Installed inputs supply
      finite local \(L_s^1\) source mass only. The terminal-layer profile

      \[
      g_m(s)=m\mathbf 1_{(-1/m,0]}(s)
      \]

      shows the remaining terminal-time concentration model.

      A branch-entropy theorem would price diffuse legal same-fluid parent clouds. For

      \[
      \pi_P=\frac{1}{M}\sum_{\alpha=1}^{M}\delta_{P^-_\alpha},
      \]

      \[
      \sum_{\alpha=1}^{M}M^{-2}=M^{-1}.
      \]

      No installed record carries \(H(P;M)\) with a positive coefficient, so the
      entropy door remains open.

      This historical no-incoming route shows that lateral no-flux alone did not
      remove a source atom on the terminal time face; the present paper keeps that
      route as source-wall pressure below the Part/Field terminal classification.

      \[
      \mu_*^{src}(B_R\times\{0\})=0
      \qquad\forall R<\infty.
      \]

      With this time-face anti-atom clause, the Liouville theorem for B ASAC TA would
      combine it with the no-earlier-selected-source-slice clause.

      The formal complement is the class B ASAC closed: same-fluid terminal carrier,
      zero ASAC defect, legal exits routed away, finite donor trees telescoped, no
      fixed preterminal entrance leaf, positive inherited terminal native source
      residue, and no production of temporal thickness, source Carleson, active
      reserve, transported no-incoming, or rigid anti-atom subclass.

      At current route resolution, this class is consistent with the installed
      source-wall bookkeeping. It is an obstruction class, not a contradiction
      theorem. Source-wall progress now needs one of the missing production theorems,
      or a later positive-scale bridge that moves the residue into retained-carrier
      readout.


