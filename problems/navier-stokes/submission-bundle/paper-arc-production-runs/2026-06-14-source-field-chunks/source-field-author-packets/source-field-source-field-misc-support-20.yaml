      \subsection{B ASAC Terminal-Layer Source-Drain Test}

      This test asks whether a zero-thickness terminal B ASAC source atom already
      creates chargeable incoming source-drain. Local donor balance and entrance leaf
      decay pay finite and non-Zeno refill trees. The remaining case is terminal Zeno
      refill.

      A terminal source atom can live on the final time face of every transported
      cylinder. It can have no fixed earlier incoming source pulse and no chargeable
      spatial boundary flux. The incoming mechanism is a terminal time-face
      concentration, not a transported side-boundary inflow.

      Transported-cylinder source-drain does not eliminate the atom without a
      time-face anti-atom theorem. The no-incoming source-drain route remains open
      exactly at zero-thickness terminal time-face concentration.


