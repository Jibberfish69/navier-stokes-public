    text: |+
      \subsection{Boot Square Weight Uniform Integrability Criterion}

      Let \(M_J^2\) be the Boot Square weight relative to \(\mu_J\). A
      standard sufficient condition for uniform integrability is a uniform higher
      moment: for some \(\delta>0\),

      \[
      \sup_J\int (M_J^2)^{1+\delta}\,d\mu_J<\infty.
      \]

      A simpler sufficient condition is a uniform \(L^\infty\) bound on \(M_J^2\)
      on the retained family together with controlled total \(\mu_J\)-mass. The
      current branch records this as a criterion only. The needed higher moment or
      uniform retained-family bound is not installed here.


