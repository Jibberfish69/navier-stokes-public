      \subsection{B ASAC Branch Entropy Test}

      Same-fluid ancestry and branch-complexity routes test the terminal B ASAC atom.
      These routes could force the terminal source atom to pay parent drain, legal
      loss, temporal residence, or source-weighted angular depletion.

      Same-fluid ancestry preserves legal packet lineage. It does not select a
      bounded parent subcloud carrying a fixed fraction of source mass. A diffuse
      legal parent cloud can distribute mass over arbitrarily many legal parents.

      Branch entropy would charge this diffuse ancestry only with a scale-normalized
      entropy reserve. The available first-moment donor and dissipation records do
      not control the required shellwise or entropy density.

      Two-tower donor depletion handles finite and non-Zeno refill through local donor
      balance and entrance leaf decay. The remaining terminal Zeno refill branch can
      pass through infinitely many shrinking heat windows with finite first-moment
      cost.

      Same-fluid ancestry is useful for legality and lineage. It does not close the
      terminal atom without a new scale-normalized branch entropy or donor-reserve
      theorem.


