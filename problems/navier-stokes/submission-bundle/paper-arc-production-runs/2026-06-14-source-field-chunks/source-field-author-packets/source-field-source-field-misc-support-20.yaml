      \subsection{B ASAC Local Energy Trace No-Positive-Jump Route}

      This route converts the terminal atom problem into a localized trace problem.
      For every transported compact cutoff \(R\), the target is that the localized
      native source-balance primitive has no positive terminal jump after ASAC, legal,
      projected, cutoff, boundary, finite donor, and non-Zeno refill payments are
      removed.

      A terminal source atom gives positive mass in \(B_R\times\{0\}\). After the
      paid channels are removed, that mass appears as a positive terminal jump in the
      remaining localized balance trace. A no-positive-jump theorem would rule it
      out.

      The installed source bound is only

      \[
      \int_{-1}^{0}\|F_m^{src,+}(s,\cdot)\|_{\mathcal M(B_R)}\,ds\le C_R.
      \]

      This gives bounded variation in time for the source primitive, and bounded
      variation allows jumps. The same terminal-layer profile

      \[
      g_m(s)=m\mathbf 1_{(-1/m,0]}(s)
      \]

      has finite \(L_s^1\) mass and converges to a terminal atom.

      Weak \(L^2\)-time continuity supplies continuity for linear velocity pairings.
      The localized balance trace is quadratic and one-sided after source selection,
      so concentration can create a measure-valued terminal jump while weak linear
      traces remain controlled. The local energy inequality supplies compactness and
      a one-sided balance, but it also permits defect measures and bounded-variation
      terminal jumps. The local-energy trace route remains open unless a stronger
      time regularity, temporal residence, or source Carleson theorem is added.


