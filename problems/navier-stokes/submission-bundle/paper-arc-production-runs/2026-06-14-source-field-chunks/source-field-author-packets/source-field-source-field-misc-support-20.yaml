    text: |+
      \subsection{B ASAC Local Energy Trace Recheck}

      The recheck reaches the same obstruction from the energy/enstrophy side. The
      local energy/enstrophy relation passes to terminal limits as an inequality with
      possible defect measure. A positive terminal source residue can appear inside
      that defect measure. B ASAC organizes the terminal equality/tangent geometry,
      but it does not supply strong trace continuity of the local energy/enstrophy
      density across the terminal time face.

      The terminal atom can still be represented as a source/trace defect without
      contradicting the available inequality. This route returns to temporal
      thickness or strong trace continuity inside B ASAC.


