      \subsection{Cascade Route Handoff From PST.A to Proof Dependency 5}

      \[
      \sup_{t\in I}E_N(t)+\int_I D_N(t)\,dt\le \rho
      \]

      The cascade obstruction is the high-frequency nonlinear flux. The repaired packet split gives

      \[
      \Pi_{\ge N}=LH+HL+SP+HH.
      \]

      \[
      |\Pi_{\ge N}(t)|
      \le
      C\widetilde\Lambda_N^\sharp(t)E_N(t)+\eta\nu D_N(t)+C_*2^{-2\delta N}.
      \]

      \[
      \sup_I E_N+\int_I D_N\le \rho.
      \]

      For each scheduled threshold, \(\widetilde\Lambda_N^\sharp\in L^1(I)\). The
      coefficient term is integrable and budget-small on the scheduler partition. The
      viscous term is absorbed by \(D_N\), and the reserve term is summable in the
      chosen high threshold.

      This handoff supplies route-level periodic shell/tail suppression. The internal
      proving surface is \(\mathbb T^3\) with \(f=0\). Whole-space \(\mathbb R^3\)
      export belongs to a separate downstream theorem.


