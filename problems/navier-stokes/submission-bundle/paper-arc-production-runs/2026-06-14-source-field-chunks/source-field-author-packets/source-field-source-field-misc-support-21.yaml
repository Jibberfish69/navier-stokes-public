      exit from \(\mathrm{Jump}_{avg}\). The missing theorem is the
      lower-bound/separation theorem for persistent averaged bad cells, with the
      pressure/source upper-bound side still conditional on the supplier rows recorded
      earlier.

      The needed statement is that persistent \(\mathrm{Jump}_{avg}\) on a terminal
      same-fluid tail produces a countable separated family of averaged bad cells
      with charges

      \[
      D_k\ge d_0
      \]

      and bounded overlap in the energy/source measure. A companion upper-bound
      theorem would control the same sum \(\sum_kD_k\) by finite energy and verified
      pressure/source suppliers.


