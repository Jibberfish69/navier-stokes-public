      \subsection{Branch-Native Averaged No-Escape Obstruction Model}

      The no-escape theorem is not derivable from the currently installed branch data
      alone. The current canonical surfaces require an additional quantified
      defect-charge or flux theorem.

      \[
      r_{\mathrm{good}}(t)=1-t.
      \]

      \[
      \inf_{t\in(s,1)} r_{\mathrm{good}}(t)=0.
      \]

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T).
      \]

      These data alone do not give a contradiction. They contain terminal good-radius
      collapse and finite energy, yet no installed object converts the collapse into a
      lower-bounded charge with divergent terminal accumulation.

      \[
      D_k\ge d_0>0\quad\text{on terminal jump scales}
      \]

      \[
      \sum_k D_k=\infty
      \quad\text{or}\quad
      \liminf_{k\to\infty}\sum_{j\le k}D_j>C(E_0,\mathrm{source}),
      \]

      The installed surfaces provide neither the lower-bound charge production nor the
      matching finite-energy upper bound for the same charge. This leaves the
      averaged no-escape route as a precise obstruction rather than a closed theorem.


