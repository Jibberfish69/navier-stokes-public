      \subsection{Branch-Native Averaged No-Escape Defect-Charge Lemma}

      A direct no-escape lemma would take \(\mathrm{Jump}_{avg}\) to a persistent
      averaged bad set \(B_\varepsilon^\Phi\), attach a nonnegative defect charge
      \(D_k\) to each terminal scale or scheduler cell, and prove a lower bound whose
      scale-sum contradicts finite energy or the averaged source budget.

      \[
      \mathrm{Jump}_{avg}\Longrightarrow B_\varepsilon^\Phi
      \text{ persists},
      \]

      \[
      B_\varepsilon^\Phi\text{ persists}
      \Longrightarrow D_k\ge d_0
      \text{ on a terminal subtail},
      \]

      \[
      \sum_k D_k\le C(E_0+\mathrm{source})
      \]

      would be the needed contradiction pattern.

      The contradiction works only when the lower-bound cells are quantitatively
      separated, or when their charges add to a divergent lower total. Current data
      supply persistence language. They do not supply the orthogonality, separation,
      or flux lower-bound theorem needed for the lower charge.

      The branch-native no-escape lemma remains open. The exact missing input is a
      quantitative defect-charge lower bound plus a finite-energy upper bound on the
      same charge.


