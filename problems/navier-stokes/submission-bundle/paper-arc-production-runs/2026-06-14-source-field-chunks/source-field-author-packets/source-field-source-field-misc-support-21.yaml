      \subsection{Cavg J Matrix Integration Lemma}

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T)
      \Longleftrightarrow
      T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing.
      \]

      This is the averaged field-scale fracture face: the tail contains a material point with no positive SCF-good coherence scale.

      The averaged endpoint matrix absorbs the bad material set into the existing
      averaged jump face. It is not a new fifth endpoint face.

      Good-region failure of averaged field coherence and bad-material failure of a
      positive SCF-good scale both enter \(\mathrm{Jump}_{\mathrm{avg}}\).


