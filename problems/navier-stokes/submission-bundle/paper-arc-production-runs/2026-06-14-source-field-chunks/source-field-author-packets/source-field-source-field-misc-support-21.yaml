    text: |+
      \subsection{Cavg J Averaged Jump Endpoint Typing}

      \[
      \mathrm{Jump}_{\mathrm{avg}}
      :=
      \exists\text{ same-fluid terminal approach tail }\mathcal T
      \text{ with }\mathcal T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing.
      \]

      The bad set \(\mathcal B_{\varepsilon_m}^{\Phi}\) records material points
      where no positive same-fluid cylinder has SCF base size below
      \(\varepsilon_m\). If a terminal approach tail meets this set, the tail carries
      an averaged field-scale fracture at that material point: every positive
      same-fluid scale available to the tail remains SCF-bad.

      This is the endpoint face denoted by \(\mathrm{Jump}_{\mathrm{avg}}\). The
      notation is a classification of the remaining averaged branch, not a proof that
      the branch has already been removed.

      \[
      \mathcal B_{\varepsilon_m/2}^{\Phi}=\varnothing
      \]

      \[
      End_{NS,avg}\Longrightarrow\neg \mathrm{Jump}_{\mathrm{avg}}
      \]


