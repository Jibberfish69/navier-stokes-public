    text: |+
      \subsection{BridgeA DG-Line Boot Square Terminal Proof Packet}

      Assume \(C^{al}\) and \(C^{CG}\) are symmetric tensors on the same retained
      family, and both have a simple-top gap at least \(\gamma_J>0\). Let \(P^{al}\)
      and \(P_J^{CG}\) denote their top projectors. Davis-Kahan gives

      \[
      \delta_J/\gamma_J\to0
      \Longrightarrow
      \mathrm{BridgeA}.
      \]

      \[
      A_J:=H_J^*H_J.
      \]

      \[
      \partial_t H_J=K_{\parallel,J}H_J+E_{H,J}.
      \]

      \[
      \partial_t A_J
      =H_J^*(K_{\parallel,J}^*+K_{\parallel,J})H_J+E_{A,J}.
      \]

      Let \(\lambda_1\ge\lambda_2>0\) be the eigenvalues of \(A_J\). The in-plane
      anisotropy drain condition is

      \[
      \langle u_1,S_{\parallel,J}u_1\rangle
      -
      \langle u_2,S_{\parallel,J}u_2\rangle
      \ge
      \delta_*-r_J(t),
      \]

      which is the dynamic input needed to keep the comparison gap open. This packet
      is conditional on the shared gap floor and the anisotropy drain.


