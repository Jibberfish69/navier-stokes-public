    text: |+
      \subsection{Cavg J Formal Averaged Endpoint Lemma}

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T)
      \Longleftrightarrow
      T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing.
      \]

      Equivalently, \(\mathrm{Jump}_{\mathrm{avg}}\) records loss of every positive
      SCF-good same-fluid coherence scale along the terminal tail.

      \[
      \mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing
      \Longrightarrow
      \mathrm{Jump}_{\mathrm{avg}}.
      \]

      For a point \((a,t)\) in the bad material set on the terminal tail, every
      positive same-fluid cylinder centered at \((a,t)\) violates the SCF base
      threshold \(\le\varepsilon_m\). The tail contains a material point with no
      positive SCF-good scale, which is exactly the averaged jump endpoint condition.


