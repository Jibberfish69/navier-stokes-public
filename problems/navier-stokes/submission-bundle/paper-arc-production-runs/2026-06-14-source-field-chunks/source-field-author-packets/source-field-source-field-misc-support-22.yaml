      \subsection{Compressed Periodic Navier-Stokes Theorem Chain}

      Let \(u_0\) be smooth, divergence-free, and zero-mean on \(\mathbb T^3\). Let
      \((u,p)\) be the maximal classical solution of the unforced three-dimensional
      incompressible Navier-Stokes equations on \([0,T_*)\).

      The compressed periodic chain is conditional on the cascade estimate and its
      integrable coefficient:

      \[
      \frac{d}{dt}E_N+(1-\eta)\nu D_N
      \le C\widetilde\Lambda_N^\sharp E_N+C_*2^{-2\delta N},
      \qquad
      \widetilde\Lambda_N^\sharp\in L^1(I).
      \]

      This gives

      \[
      \sup_I E_N+
      \int_I D_N\le\rho.
      \]

      Assume for contradiction that \(T_*<+\infty\). Classical maximality gives a
      first finite terminal obstruction. Once the cascade estimate supplies the
      uniform bound needed by the classical closure warrant, relaunching at
      \(t_j\uparrow T_*\) extends past \(T_*\), contradicting maximality.

      The periodic branch closes only after those analytic suppliers are in place.
      Whole-space \(\mathbb R^3\) export requires the separate export theorem and its
      remaining Euclidean burdens.


