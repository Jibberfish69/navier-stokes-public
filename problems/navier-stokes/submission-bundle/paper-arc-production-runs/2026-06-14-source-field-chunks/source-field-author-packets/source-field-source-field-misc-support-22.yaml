      \subsection{Cavg J Sequencing Audit For AACT Global}

      \[
      \mathrm{Jump}_{\mathrm{avg}}(\mathcal T)
      \Longleftrightarrow
      \mathcal T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing
      \]

      \[
      \mathcal T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing
      \Longrightarrow
      \mathrm{Jump}_{\mathrm{avg}}(\mathcal T).
      \]

      Pick \((a,t)\) in the intersection. By definition of the bad set, every
      positive same-fluid cylinder centered at \((a,t)\) violates the SCF base
      threshold \(\le\varepsilon_m\). The terminal tail contains a point with zero
      positive SCF-good scale, so the tail enters the averaged jump endpoint face.

      \[
      \mathcal G_{\varepsilon_m}^{\Phi}
      :=Q^\Phi\setminus\mathcal B_{\varepsilon_m}^{\Phi}.
      \]

      The set \(\mathcal G_{\varepsilon_m}^{\Phi}\) supplies coverage of the good
      region. Its complement is routed to \(\mathrm{Jump}_{\mathrm{avg}}\) by the
      endpoint lemma.

      \[
      \neg \mathrm{Jump}_{\mathrm{avg}}(\mathcal T),
      \]

      is then the hypothesis under which the endpoint theorem removes the averaged
      faces on the produced averaged endpoint package.

      The averaged route avoids the previous pointwise-readout circularity. It does
      not by itself discharge \(\mathrm{Jump}_{\mathrm{avg}}\). That branch remains
      for a separate no-pulse/no-jump supplier or for the CM exit side after the
      forward supplier has stopped.


