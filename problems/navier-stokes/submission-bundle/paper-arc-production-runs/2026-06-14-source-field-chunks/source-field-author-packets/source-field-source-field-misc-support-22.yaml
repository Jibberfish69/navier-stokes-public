      \subsection{Component Selection For Jump Avg}

      The selected \(\nu\mathrm{SCF}\) charge sees dissipation and local pressure. It
      does not see the velocity-energy component \(E_u\).

      Current surfaces do not exclude an \(E_u\)-only threshold channel. A terminal
      SCF threshold packet may be carried by the velocity-energy component. In that
      case \(\mathrm{SCF}_{\mathrm{base}}(Q_n)>\varepsilon_m\) can hold while
      \(\nu\mathrm{SCF}(Q_n)\) does not carry positive terminal mass.

      The local energy inequality gives local balances and finite global size. It
      does not prove the one-way component-selection theorem

      \[
      E_u\text{ terminal threshold}
      \Longrightarrow
      D_u\text{ or }P\text{ terminal mass on the same-fluid terminal schedule}.
      \]

      Adding \(E_u\) to the final charge also fails under current surfaces. Global
      energy controls a time-slice energy budget, but repeated shrinking terminal
      windows can reuse the same moving energy packet. No summable
      separated-window upper estimate for an additive \(E_u\) carrier is installed.

      The active-shell bypass also remains open. The existing theorem notes do not
      install active-shell amplitude gain from Original Smooth Data, direct
      active-Carleson control, or the signed weighted commutator-defect theorem. Those
      missing inputs block the visible route for forcing the \(E_u\) threshold into
      the selected analytic charge.

      \(\mathrm{Jump}_{\mathrm{avg}}\) branch elimination remains unresolved. The
      current proof surfaces sharpen the commutator, positive-carrier, active-shell,
      and component-selection obstructions. They do not discharge the branch.


