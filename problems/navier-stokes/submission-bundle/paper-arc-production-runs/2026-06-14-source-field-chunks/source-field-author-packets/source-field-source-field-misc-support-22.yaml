      \qquad
      \|\nabla u(t)\|_2,
      \qquad
      \Lambda_N(t),
      \qquad
      \Theta_N^\sharp(t),
      \qquad
      E_N(t),
      \qquad
      D_N(t).
      \]

      The estimates spend classical finite-interval smoothness only to justify dyadic testing, finite low-mode coefficient bounds, and scheduler partitions.

      The endpoint matrix receives the cascade estimate as an input. The endpoint
      exclusion is absent from the proof of that input.

      The strict low-mode coefficient is finite-dimensional for fixed \(N\). The route uses

      \[
      \Lambda_N(t)=\|\nabla S_{N-4}u(t)\|_\infty,
      \]

      \(\Lambda_N\) is a finite threshold-collar coefficient. Coeff.A proves
      fixed-threshold \(L^1\) admissibility. The scheduler chooses a threshold and
      then partitions the interval; it does not require a uniform-in-threshold
      coefficient bound.

      The repaired cascade chain is acyclic: finite-interval estimates feed the
      cascade estimate, the cascade estimate feeds the endpoint matrix, and endpoint
      exclusion remains downstream. Full critical gradient control is absent from the
      upstream estimates. Uniform all-threshold Besov gain is absent from the
      scheduler argument.


