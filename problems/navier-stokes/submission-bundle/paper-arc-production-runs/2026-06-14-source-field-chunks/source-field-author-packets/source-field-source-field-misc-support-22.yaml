    text: |+
      \subsection{Convective Weighted-Flux Bound For Moment.W}

      \[
      w_a(x)=(1+|x|^2)^a,
      \qquad
      M_a(t)=\int w_a|u(t,x)|^2dx.
      \]

      \[
      \left|\int |u|^2u\cdot\nabla w_a dx\right|
      \le C_{a,T}M_a(t).
      \]

      Thus Moment.W holds with G a=0 for the convective term on a classical finite window.

      \[
      |\nabla w_a(x)|\le C_a w_a(x).
      \]

      \[
      \left|\int |u|^2u\cdot\nabla w_a dx\right|
      \le C_a\|u(t)\|_{L^\infty}\int w_a|u|^2dx.
      \]

      \[
      \sup_{t\le T}\|u(t)\|_{L^\infty}\le C_T.
      \]

      The proof uses finite classical-window boundedness. A weak-solution version needs an alternate integrability supplier for the factor ||u|| infty.


