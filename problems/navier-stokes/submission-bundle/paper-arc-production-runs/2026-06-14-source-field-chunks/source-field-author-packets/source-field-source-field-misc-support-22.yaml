    The physical carrier is the coherent pair consisting of the divergence-free flow component together with its pressure response and finite same-fluid readout cover. The exact sector functions as a residue or compatibility detector inside this carrier.

    Assume the route-local Helmholtz-Leray projection on D, the continuum pressure response, the finite same-fluid cover, the bounded pack gauge, and the existing retained/averaged route hypotheses H1-H6. Then CCS NS(I,Q) is a theorem-facing replacement for the torus carrier template on the Navier-Stokes argument. It realizes the shared physical-sector decomposition as the NS continuum coherent sector and supplies the carrier object needed by the class-membership route.

    First, Helmholtz-Leray decomposition on D gives the canonical split of any admissible vector field into the divergence-free flow part and the gradient pressure/constraint part. For the NS equation, the constraint part is fixed by the pressure response. Thus the NS carrier over D is determined by the pair (P D u, p D) together with the local pressure readouts used in the route.

    Fourth, the exact-sector objection is resolved by assigning the exact sector its route-native role: it detects residue or compatibility inside the coherent carrier. The theorem-facing physical carrier is the continuum pressure/flow pair with readout maps. This role assignment matches the promoted objection surface and the superseded torus-template surface.

    Thus the continuum coherent sector replaces the torus carrier block for theorem-facing NS work on curved or charted D under the stated route hypotheses. Square.



