      \subsection{Conditional final charge upper control from active-window gain}

      Use active-window amplitude gain to construct the final charge upper control needed by the Jumpavg no-escape route.

      Assume an active-window, equivalently active-shell, amplitude gain strong enough
      to give the active-window estimate on terminal windows.

      The proof uses shell-to-window comparison, heat-scale dissipation tail control, and summable reserves.

      This supplies the scale-normalized upper side needed to pair with any future separated lower recurrence theorem.

      The conclusion is conditional. The active-window amplitude gain itself is not
      installed from Original Smooth Data. Raw finite mass gives only unweighted
      bounded-overlap control, and the current surfaces identify short active-shell
      pulses as the obstruction.

      Final charge upper control is available modulo active-window amplitude gain. The original-data route remains open until that gain, or an equivalent heat-scale -source estimate, is proved.


