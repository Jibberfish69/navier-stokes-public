    text: |+
      \subsection{Direct M Q To Sobolev Readout Constants}

      \[
      M_Q(u,p)
      \quad\text{witnessed by}\quad
      Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q},
      \]

      \[
      \|u(t)\|_{H^s(T^3)}
      \le C(M_Q)
      \]

      \[
      \|\chi_j u(t)\|_{H^s}
      \le C_j\sum_{k\le N}\|\nabla^k u(t)\|_{L^2(Q_j)}.
      \]

      The local tower bounds give a uniform finite value for the right-hand side. Field N,r,Q ensures that the local tower fields agree on overlaps as one global velocity field. Finite overlap gives

      \[
      \|u(t)\|_{H^s(T^3)}^2
      \le C\sum_j\|\chi_j u(t)\|_{H^s}^2
      \le C(M_Q)^2.
      \]

      Taking the supremum over the terminal window gives the norm bound required by the standard classical continuation criterion.


