    text: |+
      \subsection{hF survivor charge to SCFBase analytic charge bridge - obstruction}

      Bridge the finite-infinitesimal survivor charge with the SCFBase analytic charge so the Jump avg route can use one shared quantity for both lower and upper estimates.

      Its scale-window charge measures terminal deformation-memory in finite material separations.

      where mu D is the dissipation measure and mu P,chi is the local pressure measure.

      A reverse bridge would need terminal nu SCF mass to produce a nonzero finite-infinitesimal survivor.

      The unified survivor surface defines the finite-infinitesimal object as a theorem-facing candidate. It keeps weak-star compactness, nontrivial terminal survival, branch projection, and scale-family collapse as theorem burdens.

      A second valid route is to use nu SCF as the only branch charge and prove Jump avg lower accumulation directly for it.


