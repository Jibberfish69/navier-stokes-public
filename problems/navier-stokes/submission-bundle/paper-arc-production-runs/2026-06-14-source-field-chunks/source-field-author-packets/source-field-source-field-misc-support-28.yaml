      \subsection{Global terminal cover scheduler: no-Jump discharge and seed boundary}

      Since the cover and route parameter set are finite, B *, F * in L 1 on the terminal subtail. By absolute continuity of the integral, partition the terminal subtail into scheduler cells I alpha such that

      X j,p in L infty(I alpha cap I j), N j,p in L 1(I alpha cap I j), K <=m,j,p avg in L 1(I alpha cap I j).

      This file does not eliminate the complementary Jump avg branch. The previous failed scheduler attempt correctly identified the unconditional obstruction: if terminal good radii collapse to zero while local good cylinders exist pointwise, finite-cover scheduling fails unless that collapse is classified as Jump avg and then eliminated, or a summable infinite-cover scheduler is proved.

      The current result so closes the scheduler target only on the no-Jump avg positive-radius branch. The next target remains Jump avg branch elimination.


