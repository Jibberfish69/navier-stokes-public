      \subsection{Full-SCF upper side - E u active-window gain reduction}

      \[
      \nu_{\mathrm{fullSCF}}:=\mu_E+\mu_D+\sum_\chi\mu_{P,\chi}+\mu_G.
      \]

      \[
      \mathrm{Jump}_{\mathrm{avg}}\Longrightarrow
      \text{positive terminal lower accumulation for }\nu_{\mathrm{fullSCF}}.
      \]

      The enlarged charge adds E u to close the component-selection escape from SCF base. This fixes lower-side coverage, since every threshold component of SCF base is represented in fullSCF .

      \[
      \sum_k r_k^{-\alpha}E_u(Q_k)\le C.
      \]

      The current global energy record gives raw size control. It does not give the missing scale factor for terminal active windows.

      \[
      E_u\text{ terminal threshold}\Longrightarrow D_u/P\text{ terminal mass},
      \]

      \[
      \sum_k r_k^{-\alpha}E_u(Q_k)\le C(E_0)
      \]

      for the same separated or bounded-overlap terminal windows used by the lower accumulation route.

      The unconditional source theorem from Original Smooth Data remains open through the source-pulse wall persisted separately.


