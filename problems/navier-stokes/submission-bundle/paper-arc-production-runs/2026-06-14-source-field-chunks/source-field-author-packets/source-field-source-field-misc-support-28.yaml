    text: |+
      \subsection{Fully Quantified Threshold Scheduler Theorem}

      Let I=[t 0,T] be a finite interval. For each dyadic threshold N, assume nonnegative functions E N,D N obey

      \[
      \frac{d}{dt}E_N(t)+\alpha D_N(t)\le A_N(t)E_N(t)+R_N
      \]

      \[
      E_N(t_0)\to0,
      \qquad
      R_N\to0
      \qquad (N\to\infty).
      \]

      \[
      t_0=t_0<t_1<\cdots<t_K=T
      \]

      \[
      \sup_{t\in I}E_N(t)+\int_I D_N(t)dt\le \rho.
      \]

      \[
      e^{L_*}\le2.
      \]

      When K depends on N, choose N by the standard monotone selection: first choose a candidate threshold, compute K, then raise the threshold until (3) holds for that computed finite K. Since E N(t 0) and R N vanish as N increases, this terminates for any fixed computed partition size; if the partition is recomputed, repeat once and take the larger threshold. The resulting finite K is then fixed.

      The theorem chooses one threshold for the finite scheduler partition. It gives route-level shell/tail suppression and makes no all-threshold summability claim.


