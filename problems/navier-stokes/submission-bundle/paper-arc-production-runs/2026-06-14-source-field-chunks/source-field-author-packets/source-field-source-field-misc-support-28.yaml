    text: |+
      \subsection{In-Plane Anisotropy Drain Reduction}

      \[
      A_J=H_J^*H_J.
      \]

      Let lambda 1 >= lambda 2 be the eigenvalues of A J, with unit eigenvectors u 1,u 2. Let S parallel be the symmetric part of the reduced in-plane generator.

      The drain payment is the Rayleigh-quotient calculation
      \[
      \frac d{dt}\log\frac{\lambda_1}{\lambda_2}
      =2\langle S_\parallel u_1,u_1\rangle
      -2\langle S_\parallel u_2,u_2\rangle
      +\operatorname{Err}_J.
      \]
      On the retained branch, the anisotropy of \(S_\parallel\) along the evolving Gramian eigendirections makes the first two terms negative by a fixed amount, while the finite-frame error is absorbed by the selected packet tolerances. Integrating over the selected strip gives the in-plane anisotropy drain. Without that retained sign gap along the eigendirections, this drain remains an open input.


