      \subsection{Jump avg branch elimination - MCP visible theorem attempt}

      The final raw candidate nu SCF = mu D + sum chi mu P chi has a finite raw pressure/dissipation upper bound on bounded-overlap terminal windows under the finite transported atlas. This supplies an upper-side ingredient.

      \[
      \mathrm{Jump}_{\mathrm{avg}}\Longrightarrow
      \text{nonzero terminal }h/F\text{ survivor measure with separated positive scale-window mass.}
      \]

      The scale-normalized upper control route also remains conditional on active-window amplitude gain or an equivalent heat-scale -source estimate.

      A successful later discharge must pair that lower theorem with the already identified pressure/source upper estimate for the same charge, or install an equivalent branch-native averaged no-escape mechanism.


