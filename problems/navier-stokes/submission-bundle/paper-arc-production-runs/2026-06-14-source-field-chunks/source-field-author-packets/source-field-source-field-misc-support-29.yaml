    text: |+
      \subsection{Jump avg branch elimination rerun audit with nu SCF charge}

      Rerun the jump-avg-branch-elimination audit after forcing the route to use one shared charge.

      The hF survivor charge is kept out of the proof unless a comparison theorem with nu SCF is installed.

      For a separated or bounded-overlap terminal window family \(\{Q_i\}\) in the finite transported atlas,
      \[
      \sum_i \nu_{SCF}(Q_i)
      \le
      C_{atlas}\left(\mu_D(\Omega_T)+\sum_\chi \mu_{P,\chi}(\Omega_T)\right).
      \]
      The right side is finite because the energy inequality makes \(\mu_D\) finite, the local pressure measures are finite on the fixed atlas charts, and bounded overlap charges each point only \(C_{atlas}\) times.

      The reason is structural. Jump avg records terminal collapse of the full SCF base good radius. The charge nu SCF tracks only analytic pressure-dissipation mass. Current surfaces do not prove that full SCF base radius collapse must occur through the analytic pressure-dissipation components rather than through geometric, field-side, or unselected coherence loss.

      This is a local theorem-work audit artifact. It records a failed discharge and the exact remaining theorem. It does not update the proof-burden table to grounded.


