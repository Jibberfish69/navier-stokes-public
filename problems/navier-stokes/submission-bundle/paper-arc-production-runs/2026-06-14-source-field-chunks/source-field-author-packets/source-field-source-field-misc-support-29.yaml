    text: |+
      \subsection{Jump avg to SCFBase charge lower accumulation - obstruction}

      Jump avg supplies terminal loss of a uniform positive SCF base good radius. In radius language,

      \[
      \mathrm{Jump}_{\mathrm{avg}}(T)
      \Longleftrightarrow
      \forall T'\subset T\text{ terminal},\quad
      \inf_{(a,t)\in T'}r_{\mathrm{good}}(a,t)=0.
      \]

      The intended proof would identify the cause of this radius collapse with analytic concentration in the dissipation/local-pressure carrier nu SCF. Then a terminal compactness theorem would extract nonzero terminal nu SCF mass, and a separation theorem would turn that nonzero mass into a lower accumulation schedule.

      \[
      \mu_D=|\nabla u|^2dxdt,
      \qquad
      \mu_{P,\chi}=|p^{loc}_\chi|^{3/2}dxdt.
      \]

      The current surfaces do not force the SCF base failure to occur in these analytic components. Failure can still be assigned, at the level of available definitions, to geometric or field-side degeneration unless an additional component-selection theorem is installed.

      A formal obstruction model is so possible: terminal good-radius collapse holds, so Jump avg holds, while the analytic measure nu SCF has zero terminal lower density along the selected windows. This satisfies the present branch definitions and violates the desired lower bound.

      After that theorem, a second theorem must separate the terminal mass into a lower accumulation schedule.

      Lower accumulation for the same nu SCF charge is open. The finite upper carrier is installed, but the lower side is unavailable from the current definitions.

      This is a failed attempt for the lower-bound half of the Jump avg no-escape
      route. It preserves the prior solved upper-carrier lemma and narrows the next
      proof target to moving-concentration compactness plus component selection.


