    text: |+
      \subsection{Jump avg lower accumulation for the full-SCF shared charge}

      \[
      \nu_{\mathrm{fullSCF}}:=\mu_{E}+\mu_D+\sum_\chi\mu_{P,\chi}+\mu_{G},
      \]

      where E is the additive velocity-energy carrier, D is the dissipation carrier, P, are the local pressure carriers, and G is the controlled geometry record on the retained bounded-distortion same-fluid atlas.

      The enlarged charge is the shared charge for the next no-escape step. Its lower side sees every possible SCF base threshold component; its upper side is exactly the active-window amplitude-gain target.

      Assume Jump avg( T) on a bounded-distortion same-fluid terminal tail. Then there is a separated terminal schedule of admissible windows Q k such that

      \[
      \nu_{\mathrm{fullSCF}}(Q_k)\ge c_m>0
      \]

      \[
      \sum_k \nu_{\mathrm{fullSCF}}(Q_k)=\infty
      \]

      Apply a standard Vitali/Besicovitch extraction in the bounded-distortion same-fluid atlas to obtain a separated terminal subfamily with bounded overlap. The terminal property is preserved by passing to this subfamily.

      \[
      \nu_{\mathrm{fullSCF}}(Q_k)\ge c_m\varepsilon_m=:c_*>0.
      \]

      \[
      \liminf_k\nu_{\mathrm{fullSCF}}(Q_k)\ge c_*>0.
      \]

      Only the lower side is closed here. The branch contradiction for Jump avg still
      requires scale-normalized upper control for the \(E_u\) part of
      \(\mathrm{fullSCF}\). The next target is active-window amplitude gain.


