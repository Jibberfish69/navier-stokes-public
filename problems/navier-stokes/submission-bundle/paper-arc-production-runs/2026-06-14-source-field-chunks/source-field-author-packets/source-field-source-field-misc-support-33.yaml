    text: |+
      \subsection{Claim Boundary for the Formalized Package}

      The formalized package can safely present the route-aligned local theorem
      packet: class membership is tracked by the current witness grammar, and
      endpoint exclusion is stated only at the strength that the installed package
      supports.  A stand-alone global smoothness claim sits beyond that boundary
      until the source-wall root is proved or explicitly parked below the theorem
      surface with a review verdict.

      The formalization record adds no independent analytic proof burden.  Its job
      is claim control.  It marks the lowest statement the package can
      honestly make, marks the first statement that would overclaim, and keeps
      speculative recovered support from being presented as an installed bridge.

      At the present level, the live mathematical burden remains the source-wall
      root after reconciliation.  The manuscript should keep the route-aligned
      packet visible, name that unresolved burden plainly, and keep terminal
      stand-alone export in revision posture until the blocker is actually paid.


