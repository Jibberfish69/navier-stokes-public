      \subsection{Nonlinear shell-flux source control theorem - bounded solve attempt}

      Prove a source theorem strong enough to yield active-shell amplitude gain, hence scale-normalized nu SCF Carleson control.

      \[
      E_j'(t)+c\nu D_j(t)\le F_j(t),
      \]

      \[
      \langle \Delta_j(a_k\cdot\nabla\Delta_\ell u),\Delta_j u\rangle
      +
      \langle \Delta_\ell(a_k\cdot\nabla\Delta_j u),\Delta_\ell u\rangle=0.
      \]

      After shell weights, cutoffs, projectors, and lifted packets are inserted, the live terminal record becomes a weighted lifted remainder. A theorem strong enough for source control would have the form

      The available algebra gives the reduction, while it supplies no sign law for the true weighted object. The principal lifted remainder can align with expanding strain directions. One-sided shell weights preserve a positive active- burden after absolute values are taken.

      \[
      F_j(0;Au_0)=A^3F_j(0;u_0).
      \]

      The proposed fixed-shell -source right side is amplitude independent. Large-amplitude smooth data violate that estimate unless an additional amplitude normalization or structural cancellation theorem is supplied.

      Equivalently, a direct monotone/source-dominance law for the nonlinear shell source would close this target.


