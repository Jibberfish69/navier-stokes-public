    text: |+
      \subsection{Missing Signed Partners and Boundary Pricing}

      The boundary-pricing replacement is only conditional from the installed
      inputs.

      Same-fluid edge fidelity says that selected legal parents are meaningful.  It
      does not say that every unselected signed partner is illegal, small, or already
      paid as a boundary loss.

      \[
      A\to B,
      \qquad
      \operatorname{div}J(B)>0,
      \qquad
      \operatorname{div}J(A)<0.
      \]

      If \(B\) is selected terminal-positive and \(A\) is a legal interior donor
      omitted from the record, then \(A\) is not boundary flux and is not
      automatically a legal loss.  It is an internal negative source sink.  Pricing it
      requires a donor-depletion or signed-saturation theorem, not a bookkeeping
      classification.

      Diffuse legal parentage gives many such omitted donor partners. Each omitted
      partner can be fully legal, same-fluid, and physically interior. The fact that
      it was not selected into \(F_N\) does not make it small. Charging all omitted
      partners by absolute value again reopens the internal sink/donor-depletion
      problem.

      Without Terminal Signed Saturation.A or Parabolic NoFree Sink.A, missing signed
      partners cannot be priced as legal boundary losses.


