    text: |+
      \subsection{Manuscript Boundary for Extension Routes}

      The theorem-facing spine is the current class-membership and endpoint-exclusion
      route.  Downstream readouts, comparison material, recovery notes, and runtime
      or source-recovery records may be useful to the reader, but adjacency does not
      make them part of the theorem spine.

      An extension-side route can enter the spine only after it pays one of the
      three standard entrances.  It has to supply a named bridge into
      \(Member(Q;\mathcal O_{\mathrm{NS}})\), land on the same witness through a
      Pack, Part, or Field face, or provide an endpoint certificate map that the
      spine can actually spend.  Until one of those entrances is present, the route
      remains support material.

      The unresolved source-wall group is still the mathematical blocker at this
      point of the record.  Its presentations are allowed to explain what the proof
      search has reduced to; they are not allowed to certify theorem-spine closure
      unless they first land in a witness face or prove the positive supplier theorem
      they require.


