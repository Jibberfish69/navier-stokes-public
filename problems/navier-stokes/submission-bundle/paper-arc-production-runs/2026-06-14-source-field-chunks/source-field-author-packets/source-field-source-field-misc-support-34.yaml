      \subsection{Original Smooth Data and Active-shell Amplitude Gain}

      The direct active-Carleson theorem is exactly the Carleson-level output needed
      downstream.  Existing active-Carleson surfaces reduce it to heat-scale
      \(\rho\)-source control or active-shell amplitude gain.  This route returns to
      the same source theorem rather than proving a lower input beneath it.

      Preterminal smoothness gives decay of high shells at each fixed time before
      \(T_*\).  It gives no uniform terminal active-scale decay when active shells
      may drift to infinity while \(t\uparrow T_*\).  The needed theorem must control
      the moving active shell, not a fixed shell at a fixed preterminal time.

      The shell energy identity allows active pulses whenever nonlinear flux supplies
      the pulse.  The monotone/no-pulse surface shows that a monotone law requires a
      new flux-source domination theorem or direct active-Carleson control.

      No available sufficient mechanism proves active-shell amplitude gain from Original Smooth Data.


