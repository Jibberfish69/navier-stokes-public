      \]

      The desired theorem says that every positive source-parent measure either has
      bounded parent concentration or pays a diffuse reserve.  The concentration
      branch asks for a bounded set \(\mathcal C(P)\) carrying a fixed fraction of
      the predecessor mass.

      The remaining work is anti-diffuse: either force bounded parent concentration
      or charge broad legal parent diffusion to a summable reserve.

      \[
      j_{P^-}\in[j_P-M,j_P+M]
