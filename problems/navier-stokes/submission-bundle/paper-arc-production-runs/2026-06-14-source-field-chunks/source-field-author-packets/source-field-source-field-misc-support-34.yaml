      Finite banding and same-fluid edge fidelity do not prove Parent
      Concentration.A.  The displayed measure stays inside the legal frequency band
      and still defeats every fixed bounded parent set.

      For the diffuse-charge branch, the installed finite records price raw energy,
      local-energy balance, pressure/cutoff losses, and illegal source-localization
      loss.  They do not price legal parent branching entropy inside
      \(\mathsf{Pred}(P)\).  The active-window reserve would price this only after a
