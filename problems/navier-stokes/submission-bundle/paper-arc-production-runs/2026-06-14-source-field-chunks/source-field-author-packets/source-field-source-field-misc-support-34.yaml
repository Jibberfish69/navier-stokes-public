    Raw energy and local energy do not price legal diffuse source-parent branching
    at source-pulse normalization.

    A source or active-window Carleson reserve would price that diffusion.  The
    current surfaces identify exactly that reserve as Scale Critical Tree
    Carleson.A, Active Square Carleson.A, or an equivalent donor-depletion theorem.
    That reserve is not installed by current inputs.

    The local two-tower donor balance is valid.  For a legal donor packet \(P^-\)
    feeding a child, the localized shell balance has the form
    \[
    \int_I \mathrm{Drain}_{P^-}(t)\,dt
    \le
    E_{P^-}(t_0)-E_{P^-}(t_1)
    +\int_I \mathrm{Source}_{P^-}(t)\,dt
    +L_{\mathrm{legal}}.
    \]
    This is a local donor accounting identity.  It does not sum over an unbounded
    diffuse parent family without the missing Carleson reserve.

    At the current route resolution, the source or active-window Carleson reserve
    is precisely Scale Critical Tree Carleson.A, and the inverse LP concentration
    branch needs a new reverse-Holder parent-concentration principle beyond finite
    Littlewood-Paley banding.



    \subsection{Averaged-route Obstruction: the Jump-avg Complement}

    \[
    \hbox{Original Smooth Data}
    \Longrightarrow
    \hbox{uniform terminal-tail retained Pack/Part/Field/tower readout}.
    \]

    The candidate route covers the strict averaged-good branch.  The complementary
    branch is \(\mathrm{Jump}_{\mathrm{avg}}\).

    This row is valid only after \(\mathrm{Field}_{\mathrm{avg}}\) is available.
    On the \(\mathrm{Jump}_{\mathrm{avg}}\) branch,
    \(\mathrm{Field}_{\mathrm{avg}}\) is exactly the failed property.  The current
    endpoint matrix does not eliminate that complementary branch.



    \subsection{Jump-avg Lower Mass and the \(\nu_{\mathrm{SCF}}\) Charge}

    The existing upper-carrier note gives finite total
    \(\nu_{\mathrm{SCF}}\) on bounded-overlap terminal window families.  This
    makes \(\nu_{\mathrm{SCF}}\) the correct charge for the no-escape route.

    \[
    \mathrm{SCF}_{\mathrm{base}}(Q^\Phi_r)>\varepsilon_m
    \]
    forces either geometric Pack failure or
    \(\nu_{\mathrm{SCF}}(Q^\Phi_r)\) carries the analytic part of the threshold at
    the same scale.

    Once Pack stabilization controls the geometric part, persistent
    \(\mathrm{Jump}_{\mathrm{avg}}\) forces persistent analytic threshold failure.
    Every terminal subtail then contains a same-fluid window with positive analytic
    \(\nu_{\mathrm{SCF}}\) contribution at the SCF threshold scale.

    This gives a scale-normalized lower contribution, while the existing upper
    carrier controls raw \(\nu_{\mathrm{SCF}}\) mass.  A discharge needs the same
    normalization on both sides.  Finite raw mass permits shrinking terminal
    windows with positive scale-normalized density.  The contradiction requires a
    Carleson or active upper estimate for the scale-normalized
    \(\nu_{\mathrm{SCF}}\) density.

    The current raw upper carrier supplies finite raw mass.  The scale-normalized
    Carleson upper theorem remains the missing analytic estimate.


