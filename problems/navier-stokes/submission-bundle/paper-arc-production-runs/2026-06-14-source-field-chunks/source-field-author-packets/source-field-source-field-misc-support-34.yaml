      \subsection{Pair Weight Flattening.A Attempt}

      Pair Weight Flattening.A fails as an unconditional theorem on the current
      terminal source-current surface.  The attempted cancellation uses antisymmetry
      of each legal signed source-current edge in the saturated terminal packet graph:

      \[
      J^0(P\to P')=-J^0(P'\to P),
      \]

      That cancellation is stable only when the two endpoints carry the same
      effective terminal weight.  For separated shell endpoints, the weight defect is

      \[
      2^j2^{-\sigma(\ell-j)}-2^\ell
      =-2^\ell\left(1-2^{-(1+\sigma)(\ell-j)}\right).
      \]

      For legal separated shell edges with \(d=\ell-j\ge d_0>0\) in the active
      collar, this defect obeys the exact lower bound
      \[
      \left|2^j2^{-\sigma(\ell-j)}-2^\ell\right|
      \ge
      \left(1-2^{-(1+\sigma)d_0}\right)2^\ell.
      \]
      Thus the larger shell weight survives unless an additional flattening mechanism
      is supplied.

      Terminal heat-scale rescaling can flatten smooth geometric coefficients on one
      packet.  It does not flatten dyadic one-sided tail weights across
      source-current edges whose endpoints live at different effective shell weights.
      The mismatch is built into the source-wall weighting.

      \[
      \sum_e\int |J_e|dt,
      \]

      The current inputs give a signed-current record, not a theorem that makes the
      weighted pair defect summable.  Pair Weight Flattening.A cannot be used as an
      independent supplier for Weighted Lifted Skew Defect Legal.A under current
      inputs.

      The route can continue in one of two ways.  Terminal Weight Coherence.A can
      align the source-current endpoints at the same effective terminal weight, or
      Active Strain Alignment Cost.A can pay the residual aligned positive strain
      term.

      Until one of those arguments is installed, the pair defect returns to Scale
      Critical Tree Carleson.A.


