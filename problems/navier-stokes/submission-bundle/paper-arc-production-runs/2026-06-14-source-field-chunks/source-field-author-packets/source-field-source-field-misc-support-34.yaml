      \subsection{Original Smooth Data and Source Pulse Exclusion}

      This is the stronger active supplier target adjacent to the route-governing
      primitive Source PulseCMExit.A.  It is not the governing CM primitive itself.
      It is a sufficient forward theorem that would eliminate the source-pulse
      survivor absolutely.

      The installed original-data package supplies smooth preterminal evolution,
      finite raw energy, finite dissipation, pressure/source routing, legal-loss
      records, same-fluid localization, and the already-recorded terminal normal
      forms.

      Those inputs do not remove, charge, or rigidify the singular native positive
      active source measure.

      Each presentation must eliminate the same terminal native positive active source-pulse survivor.

      The current surfaces have already audited the common candidate mechanisms:
      pressure-vortex, helical/Beltrami, vorticity-direction coherence, localized
      drain, local-energy / CKN, compactness / Liouville, viscous-Duhamel, no-hop,
      active-Carleson, \(\rho\)-source, residual-tail, active-shell amplitude gain,
      terminal source coherence, reverse-Holder parent concentration, and Zeno
      rigid-class production.

      Each route reduces to the same native positive source-pulse primitive or one of the five exposed exits above.


