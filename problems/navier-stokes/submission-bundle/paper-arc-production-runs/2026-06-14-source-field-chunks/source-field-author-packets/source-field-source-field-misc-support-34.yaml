    text: |+
      \subsection{Parabolic No-Free Sink.A Attempt}

      Parabolic No-Free Sink.A tries to rule out a free inviscid donor sink feeding a
      terminal positive receiver.

      \[
      J(A\to B)=F>0,
      \]

      \[
      \operatorname{div}J(B)=F,
      \qquad
      \operatorname{div}J(A)=-F.
      \]

      There is positive terminal divergence at \(B\), but the donor \(A\) is an
      internal negative source sink.  This transfer need not cross boundary flux or a
      viscous heat edge.

      In the Navier-Stokes packet interpretation, this is legal inviscid transfer
      from donor packet to receiver packet.  It conserves signed energy at the
      current level and is exactly the mechanism the source wall must price.

      First-pulse selection excludes earlier positive source-current arrivals.  It
      does not exclude an internal negative donor sink.  A donor sink may have
      negative divergence throughout the relevant interval while feeding the selected
      positive receiver.  Since it is not a positive arrival, first-current pruning
      does not remove it.

      Terminal Signed Saturation.A keeps the donor counter-edge inside the usable
      signed record or sends it to a named legal record.  Two Tower Donor Depletion.A
      supplies a finite reserve for donor drain when repeated donor-to-receiver
      transfers occur.

      The obstruction is a legal internal donor sink.  The theorem needs a
      donor-depletion reserve or a signed-saturation theorem beyond the currently
      installed source-current algebra.


