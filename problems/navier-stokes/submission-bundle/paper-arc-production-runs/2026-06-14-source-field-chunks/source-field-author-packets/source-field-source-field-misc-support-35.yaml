    smooth topologies by Rellich compactness and parabolic bootstrapping.  A
    diagonal extraction over \(T\), \(R\), and \(k\) gives

    \[
    u_n\to u
    \quad\text{in }C^k([0,T]\times B_R)
    \]

    The pressure-tail hypothesis gives convergence of the pressure gradients on the
    same compact sets.  Passing to the limit in

    \[
    \partial_tu_n-\nu\Delta u_n+(u_n\cdot\nabla)u_n+\nabla p_n=0,
    \qquad \nabla\cdot u_n=0,
    \]

    gives the whole-space Navier--Stokes equation for \((u,p)\).

    The pressure convergence is the genuine export issue.  On \(\mathbb R^3\),
    pressure is fixed up to a harmless function of time by the Riesz-transform
    formula

    \[
    p=\mathcal R_i\mathcal R_j(u_i u_j),
    \]

    while the periodic pressures may carry box-scale harmonic pieces.  The displayed
    pressure-gradient convergence is the hypothesis that removes that ambiguity on
    compact sets.

    The periodic theorem supplies global smooth \(u_n\) for each box. Whole-space
    export requires the three uniform families above. Once those families are
    supplied, the export theorem follows.



    \subsection{Persistent Expansion Alignment Reserve Attempt}

    The failed direct discharge tests the dynamic persistent-alignment route after
    source-weighted eigenframe mixing.

    On smooth preterminal windows, positive vorticity stretching gives instantaneous
    growth of the active amplitude.  Over a time interval with genuine heat-time
    length, that growth would create either amplitude gain or drain expenditure.

    The terminal source-wall obstruction is the zero-thickness case.  The selected
    source can concentrate on a shrinking layer near the terminal time.  Then
    instantaneous stretching can remain large while integrated amplitude gain,
    temporal residence, and drain charge vanish in the limit.

    \[
    E_j' + c\nu D_j \le F_j.
    \]

    A source-balanced pulse can maintain the selected active amplitude over a short
    terminal interval when \(F_j\) balances viscous damping.  Excluding this requires
    one of the exits already listed: time-thickness, no-incoming source-drain, or
    active-shell amplitude gain.

    Persistent alignment alone does not force a reserve from installed inputs.  The
    zero-thickness terminal layer remains the blocking model.



    \subsection{Positive Adjoint Defect Depletion Attempt}

    The failed direct discharge tests the sharper target produced by Positive
    Source Adjoint Escape Identity.A.

    The desired comparison is
    \[
    A_{\mathrm{def},m}^{+,src}
    \le C_{\mathrm{PAD}}
    \sum_P\int_{Q(P)}
    |w_{j_P}|^2
    \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+dxdt.
    \]

    BASAC gives equality and tangent organization for the terminal defect class.
    It supplies no sign comparison for the positive strain carrier

    \[
    |w_j|^2\left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
    \]

    The pressure/eigenframe support controls near-band signed-current sustain.  It
    does not pay this full positive source-weighted carrier.  At this resolution,
    the target inequality is equivalent to a source-weighted terminal angular
    depletion theorem.

    Positive Adjoint Defect Depletion.A remains open.  The alternate route is to
    force the pressure/eigenframe defect to live directly on the native
    source-current carrier, rather than as a separate near-band signed support.



    \subsection{Positive Remainder Depletion.A Conditional Reduction}

    With a terminal angular-mixing or alignment-decorrelation supplier on the
    selected active windows, the positive remainder can be absorbed into dissipation
    plus parent drain and legal loss.  The conditional target is

    \[
    \sum_{P\in\mathcal F_N}\int_{Q(P)}[\mathcal R_P]_+
    \le
    \theta\sum_{P\in\mathcal F_N}\int_{Q(P)}\mathcal D_P
    +
    \operatorname{Drain}_{parent}(\mathcal F_N)
    +
    \operatorname{Loss}_{legal}(\mathcal F_N),
    \qquad 0<\theta<1.
    \]

    The legal records place pressure, cutoff, commutator, boundary, and exported
    divergence pieces into legal loss or legal parent drain, after an arbitrarily
    small local-drain absorption.  The only nonlegal main term is

    \[
    \mathcal R_P^{main}
    =
    \chi_P\langle S_{<j_P}^{loc}w_{j_P},w_{j_P}\rangle.
    \]

    \[
    [\mathcal R_P^{main}]_+
    =\chi_P |w_{j_P}|^2
    \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+.
    \]

    Terminal Angular Mixing.A supplies exactly the estimate

    \[
    \begin{aligned}
    \sum_{P\in\mathcal F_N}\int_{Q(P)}
    \chi_P |w_{j_P}|^2
    \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+
    &\le
    \theta_0\sum_{P\in\mathcal F_N}\int_{Q(P)}\mathcal D_P \\
    &\quad+
    \operatorname{Drain}_{parent}(\mathcal F_N)
    +\operatorname{Loss}_{legal}(\mathcal F_N)
    +o_N(1).
    \end{aligned}
    \]

    for some \(0<\theta_0<1\).  This is the packet form of Terminal Angular
    Mixing.A, equivalently Alignment Decorrel.A / Positive Strain Decorrelation.A.

    \[
    \mathcal R_P=\mathcal R_P^{main}+\mathcal R_P^{legal}+\mathcal R_P^{low}.
    \]

    Choose \(\varepsilon>0\) so that
    \(\theta:=\theta_0+\varepsilon<1\), and absorb harmless record constants into
    the definitions of legal parent drain and legal loss.  This proves Positive
    Remainder Depletion.A conditionally on Terminal Angular Mixing.A.

    The condition is genuine.  Trace-free strain can still have an expanding
    eigendirection.  On a selected terminal packet the active direction \(e_{j_P}\)
    may align with that expanding eigendirection, making
    \[
    \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+
    \]
    large.

    Energy, incompressibility, pressure routing, finite banding, and same-fluid
    transport supply size and legality controls.  They do not supply selected-window
    angular mixing, a negative-part comparison, or depletion of this positive
    aligned carrier.  Cauchy--Young turns the term into the active reserve, which is
    route-equivalent to the scale-critical Carleson target.

    The unconditional theorem remains open at the same atom already isolated by the
    source-residence route: prove terminal angular mixing / alignment decorrelation
    for the native positive active source carrier, or install an equivalent
    one-sided selected-window negative-part comparison or scale-critical reserve.



    \subsection{Positive Remainder Depletion.A Direct Attempt}

    The direct attempt asks for the packetwise absorption estimate

    \[
    \int_{Q(P)}[\mathcal R_P]_+
    \le
    \theta\int_{Q(P)}\mathcal D_P
    +
    \operatorname{Drain}_{parent}(P)
    +
    \operatorname{Loss}_{legal}(P),
    \qquad 0<\theta<1.
    \]

    The pre-Cauchy local source contains the active strain/source pairing before
    absolute-value estimates erase parent geometry.  A direct drain estimate would
    require a packet inequality of the form

    \[
    [\mathcal R_P]_+
    \le
    \theta\mathcal D_P+\operatorname{Loss}_{legal}(P).
    \]

    The available energy and local energy bounds supply first-moment dissipation and
    pressure/cutoff routing.  They do not supply a pointwise or packetwise sign rule
    for the positive active strain/source pairing.  The active source can align with
    an expanding strain direction on the selected window.  The drain absorption step
    is exactly a new positive-source depletion theorem.

    The unweighted nonlinear transport has global skew symmetry, and the dyadic
    exchange cancels before terminal packet selection.  After shell weights,
    projectors, same-fluid cutoffs, and positive-part extraction, the remaining
    object is the weighted lifted remainder

    \[
    G_N^{lift,\sigma}
    =
    \sum W_{j,\ell}^{\sigma}R_{j,k,\ell}^{lift}.
    \]

    \[
    \int G_N^{lift,\sigma}(t)\,dt\le C2^{-2\delta N}
    \]

    would be enough to close this branch.  The Pack continuation criterion

    \[
    S_{pack,Q}\in L^1(0,T_*)
    \Longrightarrow
    \Gamma_{pack,Q}\in L^\infty(0,T_*).
    \]

    does not supply the localized source/strain depletion estimate above.  It only
    converts a paid Pack strain record into deformation control.

    The active term is the scale-critical carrier that Scale Critical Tree
    Carleson.A must control.  This route returns to the Carleson theorem instead of
    proving the positive remainder depletion estimate.



    \subsection{Positive Remainder Depletion: Onward Alignment Reduction}

    The onward alignment reduction pushes Positive Remainder Depletion.A through the
    decorrelation exit of the native trilinear no-hidden split.  The result is a
    sharper open atom, not a discharge.

    \[
    \left[
    \langle S_{<j}^{loc}w_j,w_j\rangle
    \right]_+.
    \]

    \[
    w_j=|w_j|e_j,
    \qquad |e_j|=1,
    \]

    \[
    \left[
    \langle S_{<j}^{loc}w_j,w_j\rangle
    \right]_+
    =
    |w_j|^2
    \left[e_j\cdot S_{<j}^{loc}e_j\right]_+.
    \]

    \[
    \boxed{
    \sum_{P\in\mathcal F_N}
    \int_{Q(P)}
    |w_{j_P}|^2
    \left[e_{j_P}\cdot S_{<j_P}^{loc}e_{j_P}\right]_+
    \,dxdt
    \le
    C\rho_{inst,N}(\mathcal F_N)+o_N(1).
    }
    \]

    This is Alignment Decorrel.A, equivalently the concrete packet face of Positive
    Strain Decorrelation.A.

    \[
    \operatorname{tr}S=0.
    \]

    Trace-free strain alone does not control the selected positive part.  It only
    says the eigenvalues sum to zero; one eigendirection may still expand.

    Pressure recovery controls the elliptic response and legal cutoff records.  The
    interior stretching carrier and its shell-localized packet form remain
    sign-indefinite.  Pressure recovery supplies no depletion theorem for the
    selected positive part.

    Same-fluid transport keeps the selected carrier coherent.  It supplies no
    angular mixing rate for \(e_j\) relative to the expanding eigenspaces of
    \(S_{<j}^{loc}\).

    Vorticity-direction coherence, Beltrami/helical depletion, anti-Beltrami
    Carleson control, and pressure-strain depletion are possible suppliers.  Each
    needs a terminal coherence theorem on the same selected active windows.  No
    such theorem is installed by original smooth data in the native positive source
    topology.

    The branch remains open.  The smallest visible analytic atom is terminal angular
    mixing / alignment decorrelation for the native positive active source carrier.


