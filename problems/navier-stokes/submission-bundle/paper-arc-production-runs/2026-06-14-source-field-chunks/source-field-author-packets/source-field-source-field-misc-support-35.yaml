      \subsection{Periodic-to-\(\mathbb R^3\) Exhaustion and Required Uniform Estimates}

      This is a conditional export theorem.  It states the uniform estimates needed to
      pass from expanding periodic boxes to a whole-space \(\mathbb R^3\) solution.

      Let \(u_0\) be smooth, divergence-free, and rapidly decaying on
      \(\mathbb R^3\).  For box sizes \(L_n\to\infty\), let \(u_{n,0}\) be
      divergence-free periodic data on \(\mathbb T^3_{L_n}\) agreeing with \(u_0\) on
      larger and larger interior balls up to a small correction.  Let \((u_n,p_n)\)
      be the corresponding global smooth periodic solutions.

      \[
      \sup_n\sup_{t\le T}\|u_n(t)\|_{H^s(B_R)}\le C_{T,R,s},
      \qquad s>5/2.
      \]

      \[
      \lim_{R\to\infty}\sup_n\sup_{t\le T}\int_{|x|>R}|u_n(x,t)|^2dx=0.
      \]

      \[
      p_n=\mathcal R_i\mathcal R_j(u_{n,i}u_{n,j})+h_{n,L},
      \]

      \[
      \nabla p_n\to \nabla p
      \quad\text{in }C^k([0,T]\times B_R)
      \]

      Under these export hypotheses, a subsequence of \(u_n\) converges on compact
      subsets to a smooth whole-space solution \((u,p)\) of Navier--Stokes on
      \(\mathbb R^3\times[0,\infty)\) with initial datum \(u_0\) and finite energy
      for all finite time.

      The uniform local \(H^s\) bound with \(s>5/2\) gives compactness in lower local
      smooth topologies by Rellich compactness and parabolic bootstrapping.  A
      diagonal extraction over \(T\), \(R\), and \(k\) gives

      \[
      u_n\to u
      \quad\text{in }C^k([0,T]\times B_R)
      \]

      The pressure-tail hypothesis gives convergence of the pressure gradients on the
      same compact sets.  Passing to the limit in

      \[
      \partial_tu_n-\nu\Delta u_n+(u_n\cdot\nabla)u_n+\nabla p_n=0,
      \qquad \nabla\cdot u_n=0,
      \]

      gives the whole-space Navier--Stokes equation for \((u,p)\).

      The pressure convergence is the genuine export issue.  On \(\mathbb R^3\),
