      \subsection{Positive Remainder Depletion.A Direct Attempt}

      The direct attempt asks for the packetwise absorption estimate

      \[
      \int_{Q(P)}[\mathcal R_P]_+
      \le
      \theta\int_{Q(P)}\mathcal D_P
      +
      \operatorname{Drain}_{parent}(P)
      +
      \operatorname{Loss}_{legal}(P),
      \qquad 0<\theta<1.
      \]

      The pre-Cauchy local source contains the active strain/source pairing before
      absolute-value estimates erase parent geometry.  A direct drain estimate would
      require a packet inequality of the form

      \[
      [\mathcal R_P]_+
      \le
      \theta\mathcal D_P+\operatorname{Loss}_{legal}(P).
      \]

      The available energy and local energy bounds supply first-moment dissipation and
      pressure/cutoff routing.  They do not supply a pointwise or packetwise sign rule
      for the positive active strain/source pairing.  The active source can align with
      an expanding strain direction on the selected window.  The drain absorption step
      is exactly a new positive-source depletion theorem.

      The unweighted nonlinear transport has global skew symmetry, and the dyadic
      exchange cancels before terminal packet selection.  After shell weights,
      projectors, same-fluid cutoffs, and positive-part extraction, the remaining
      object is the weighted lifted remainder

      \[
      G_N^{lift,\sigma}
      =
      \sum W_{j,\ell}^{\sigma}R_{j,k,\ell}^{lift}.
      \]

      \[
      \int G_N^{lift,\sigma}(t)\,dt\le C2^{-2\delta N}
      \]

      would be enough to close this branch.  The Pack continuation criterion

      \[
      S_{pack,Q}\in L^1(0,T_*)
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty(0,T_*).
      \]

      does not supply the localized source/strain depletion estimate above.  It only
      converts a paid Pack strain record into deformation control.

      The active term is the scale-critical carrier that Scale Critical Tree
      Carleson.A must control.  This route returns to the Carleson theorem instead of
      proving the positive remainder depletion estimate.


