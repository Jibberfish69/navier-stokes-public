      \subsection{Maximal Reduction of the Averaged Frontier}

      For the selected strengthened-source averaged route, the five-burden frontier
      compresses to two primitive analytic kernels plus one exact-source optional
      branch.

      The remaining dependence is exactly terminal cover production, not the local scheduler mechanism.

      Tower amplitude is a readout/control object feeding endpoint exclusion.  The CM
      route consumes only Pack, Part, and Field.  TPS, exact-potential, Hodge, and
      Euclidean strict-shadow branches remain downstream/context branches unless they
      declare one of the three displayed bridges.

      \[
      S_{pack,Q}\in L^1([t_0,T_*))
      \Longrightarrow
      \Gamma_{pack,Q}\in L^\infty([t_0,T_*)).
      \]

      Energy and incompressibility do not supply this supremal material strain record.

      The two live analytic targets are:
      \[
      S_{pack,Q}\in L^1([t_0,T_*))
      \quad\hbox{from original dynamics,}
      \]
      and
      \[
      \mathrm{Jump}_{\mathrm{avg}}\Longrightarrow\bot
      \quad\hbox{through a scale-normalized }\nu_{\mathrm{SCF}}\hbox{ upper bound.}
      \]


