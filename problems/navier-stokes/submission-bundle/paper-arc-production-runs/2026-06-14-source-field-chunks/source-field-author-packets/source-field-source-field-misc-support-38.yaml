      \sum_m r_m^2=\infty,
      \]

      then the branch reaches a fixed preterminal time after finitely or countably many steps. At a fixed preterminal time, original smoothness gives high-shell decay. Hence every preterminal entrance leaf has vanishing normalized high-frequency source residue as N .

      Insert these entrance leaves into the finite-tree identity. The boundary terms and legal losses are summable by the packet record. Persistent order-one normalized source mass at the root contradicts the vanishing entrance leaves plus legal losses. Thus all non-Zeno branches are controlled.

