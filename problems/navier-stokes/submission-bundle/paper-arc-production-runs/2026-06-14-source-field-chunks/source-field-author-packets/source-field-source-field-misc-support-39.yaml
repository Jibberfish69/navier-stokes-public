      \subsection{SCFBad Concentration-To-Tower Theorem}

      Assume Pack.TTU, so same-fluid cylinders are geometrically comparable on the terminal tail.

      \[
      \mathfrak A_{N,Q}\in L^\infty([t_0,T_*)).
      \]

      Assume the endpoint depth is high enough to control all velocity and pressure carriers appearing in SCF base. Then the velocity pieces of SCF base are uniformly bounded on the active terminal packet.

      \[
      p=p^{loc}+h,
      \qquad
      -\Delta p^{loc}=\partial_i\partial_j(\chi u_i u_j).
      \]

      The local source carrier is bounded by the tower hypothesis, and the harmonic tail is bounded by the energy record. Hence the pressure component of SCF base is uniformly controlled at small scales.

      \[
      tower\text{-}blown.
      \]


