      \subsection{SCFBase Defect To Tower-Blown Typing}

      \[
      \mathfrak A_{N,Q}\in L^\infty([t_0,T_*)).
      \]

      Assume the endpoint depth controls the velocity, viscous, and pressure terms appearing in SCF base. Then a contradiction follows. Hence the finite tower/readout alternative fails, and the endpoint face is

      \[
      tower\text{-}blown.
      \]

      The tower bound supplies uniform control of the velocity rungs on the active terminal packet. The forcing rungs are

      \[
      K_k=-\nabla^{k+1}p+\nu\Delta U_k.
      \]

      The viscous part is controlled by the velocity tower at depth k+2. The pressure part is controlled by the local split

      \[
      p=p^{loc}+h,
      \qquad
      -\Delta p^{loc}=\partial_i\partial_j(\chi u_i u_j).
      \]

      The local product source is controlled by the tower/readout hypothesis. The harmonic tail is controlled by the energy record.

      \[
      \sup_{t<T_*}\mathfrak A_{N,Q}(t)=\infty.
      \]

      The defect is typed into the tower endpoint face. Tower Bound.Upstream is still not proved. The pressure defect compatibility note supplies the remaining relation between local pressure concentration and the SCF defect carrier.


