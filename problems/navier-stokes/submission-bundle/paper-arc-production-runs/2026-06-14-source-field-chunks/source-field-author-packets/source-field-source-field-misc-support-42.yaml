      \subsection{Single-shell active- estimate - failed discharge}

      This estimate is sufficient, after summing over shells, to prove active- upper-tail Carleson.

      The parabolic damping term controls the first moment int I D j. To control int I 2 -j D j 2, one needs either an amplitude bound on E j, an L 2 t -source bound on F j, or a direct active- inequality.

      Set the shell damping rate to \(\lambda_j:=c_0\nu 2^{2j}\), with the fixed
      Littlewood--Paley coercivity constant \(c_0>0\).  Multiplying by \(2^{3j}\)
      reduces the target to an entrance-tail reserve plus the -source estimate for
      F j.

      The required -source estimate for F j fails as a universal theorem from original smooth data by fixed-shell cubic amplitude scaling. Scaling smooth divergence-free data by amplitude A makes the shell flux scale like A 3, so the squared source scales like A 6 on short intervals, while the proposed universal right-hand side is amplitude-independent at fixed shell.

      -source estimate with amplitude normalization; active-shell amplitude gain; direct active- theorem with a nonlinear source mechanism.

      Active- upper-tail Carleson remains open at the single-shell source/amplitude level.


