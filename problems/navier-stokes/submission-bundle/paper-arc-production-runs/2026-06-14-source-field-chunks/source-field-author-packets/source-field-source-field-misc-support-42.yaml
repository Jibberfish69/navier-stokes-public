      Signed Weighted Lifted Remainder Cancellation.A. Solve by proving signed cancellation for the true weighted lifted remainder before positive-part extraction.

      \[
      F_j\le a_j(t)E_j+b_j(t)
      \]

      Direct Active Square Carleson.A. Solve by proving a direct Carleson estimate for the active- positive carrier on selected terminal windows.

      Uniform Temporal Source Integrability.A, Temporal Non Atomic Source.A, and no-inflow Zeno assembly. Solve from Heat Scale Square Source.A.

      The unweighted dyadic exchange identity cancels paired shell transfer before one-sided weights, lifted packet reductions, cutoffs, and terminal active-window selection enter.

      \[
      R_{j,k,\ell}^{lift}\sfcomp{24587} 2^{2j}\langle \mathcal C_j(\nabla a_k,\Delta_j u),\Delta_j u\rangle.
      \]

      Its sign follows active packet alignment with the local symmetric strain. Terminal active packets may align with expanding strain eigendirections. The current route has no theorem forcing eigendirection decorrelation or signed cancellation of this weighted term.

      \[
      E_j'+c\nu D_j\le F_j.
      \]

      A scalar source term can balance a short active pulse. so the damping identity alone gives no monotone dominance. A proof must use the Navier-Stokes trilinear structure of F j.

      The available trilinear structure gives signed dyadic exchange cancellation in the unweighted global sum. One-sided terminal weights create a weighted defect with variable sign. The positive strain-alignment configuration above remains legal.

      A direct active- estimate would absorb the positive fallback created after taking absolute values. Current estimates send the positive carrier back to the same active- / scale-critical tree-Carleson reserve. Pressure and cutoff terms move into legal records and leave the interior positive shell-flux carrier.


