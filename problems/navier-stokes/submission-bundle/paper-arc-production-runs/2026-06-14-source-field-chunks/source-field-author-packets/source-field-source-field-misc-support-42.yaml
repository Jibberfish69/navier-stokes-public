      \subsection{Skew Saturation Admissibility.A attempt}

      Failed as an unconditional theorem from the currently installed terminal packet hypotheses. A finite-saturation replacement is isolated.

      \[
      \mathcal F_N^\sharp
      \quad\text{is still a bounded-overlap same-fluid terminal ledger,}
      \]

      For one selected source edge e, the bare dyadic graph gives a formal counter-edge (e). Finite dyadic banding controls the shell indices involved in (e). Same-fluid transport supplies carrier fidelity once the partner packet is selected.

      \[
      \#\{P' : P'\text{ is a counter-edge partner of some selected edge into }P\}\gg1.
      \]

      Bounded overlap of F N controls selected child packets. It does not control the full partner hull produced by the bare exchange graph.

      The same diffuse parent pattern used in the source-parent obstruction applies here. Let one child packet receive legal source from many predecessor packets. The signed partners of those positive incoming edges live on many donor packets. Saturating the selected child family by all signed partners produces an incoming donor hull with unbounded multiplicity. No installed cover lemma bounds that hull by a fixed overlap constant.

      Thus the saturation theorem cannot be proved before boundary pricing or a finite-complexity parent theorem.

      where Finite Partner Multiplicity.A asserts that the signed partner hull has uniformly bounded physical packet overlap, and Same Fluid Partner Collar.A asserts that partner enlargement remains inside the same-fluid terminal collar up to legal loss.

      It reduces to finite partner multiplicity or to off-saturation boundary pricing. Without such a theorem, saturation may destroy the bounded-overlap terminal record needed for a localized skew current.


