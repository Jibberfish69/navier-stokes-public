      \subsection{Source theorem frontier for active-shell amplitude gain}

      Direct active- control is exactly the Carleson-level theorem needed downstream. Existing active- surfaces reduce it to -source control or active-shell amplitude gain.

      Preterminal smoothness controls fixed shell tails at fixed times. The active-shell theorem requires uniform control on moving terminal active shells whose frequency may drift upward as t -> T *.

      The monotone flux law surface records that shell energy plus raw dissipation permits scalar pulse profiles when nonlinear flux supplies the pulse. A monotone-dominance result so requires a new flux/source theorem or direct active- control.

      The amplitude-speed gate theorem works after one of its supplier branches is installed. It is a valid local gate under supplier hypotheses, while the required supplier from Original Smooth Data remains the source burden.

      The sharpest next target is a nonlinear shell-flux source theorem that forbids source-balanced active pulses at terminal active scales.


