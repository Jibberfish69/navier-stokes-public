    Equivalently, T' admits a finite positive-scale family of same-fluid parabolic cylinders with controlled overlap and SCF-smallness.

    \[
    \inf_{(a,t)\in T'}r_{\mathrm{good}}(a,t)=0.
    \]

    Equivalently, the same-fluid tail loses every uniform positive SCF-good scale approaching the endpoint.

    The alternatives are complementary for the nonnegative function r good on terminal subtails. If a terminal subtail has a positive lower bound, Alternative A holds. If every terminal subtail has infimum zero, Alternative B holds.

    In Alternative A, choose cylinders with radii in [r *,2r *] at every point of T'. The parabolic Vitali-Besicovitch selection theorem in same-fluid coordinates gives a finite subcover on the retained compact tail, with overlap controlled by dimension and the distortion bound. This is the quantitative terminal cover theorem.

    In Alternative B, there is no terminal subtail carrying a uniform positive SCF-good radius. This is the terminal coherence-loss endpoint face.

    This dichotomy is a compactness/coherence statement for moving parabolic cylinders. It uses no endpoint readout and no pointwise tower recovery.


