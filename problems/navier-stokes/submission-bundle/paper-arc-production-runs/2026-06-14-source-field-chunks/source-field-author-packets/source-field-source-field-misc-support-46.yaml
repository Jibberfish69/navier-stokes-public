      Conditional terminal theorem surface for the retained Navier-Stokes class-membership route.

      The theorem compresses the currently installed retained-route dependencies into one terminal chain and records the boundary against the averaged finite-energy route and terminal readout route.

      The exact same-depth pressure branch remains separate from this strengthened source route.

      \[
      \neg CM_{N,r,Q}\Longrightarrow Dead\vee packing\text{-}detached\vee tower\text{-}blown\vee Jump.
      \]

      \[
      I=[a,b]\Subset[0,T_*),
      \]

      \[
      \sum_j\|u\|_{L^1_t C^{m+2,\alpha}(B(c_j(t),2\rho_I))}
      +
      \sum_j\|p\|_{L^1_t C^{m+1,\alpha}(B(c_j(t),2\rho_I))}<\infty.
      \]

      \[
      \Gamma_{pack,Q}\in L^\infty(I).
      \]

      No averaged object is used as its pointwise counterpart upstream of these readout theorems.


