      \subsection{Terminal Readout Invocation: Recovering End NS From End NS avg}

      \[
      End_{NS,avg}.
      \]

      On the shrunken cover elements, ATD m supplies the finite-depth local tower packets needed for readout.

      The finite positive-scale cover converts averaged field coherence into pointwise field coherence. Each cover element has a uniform positive lower scale and the ATD m local tower gain. Finite overlap transfers the averaged field bounds to the old pointwise field row on the same-fluid approach window.

      The velocity tower part is read on the fixed-scale finite cover. Each shrunken element carries the local averaged tower packet, local Sobolev/Morrey converts that packet into pointwise control there, and the finite maximum over the cover gives one endpoint velocity-tower bound.

      \[
      K_q=-\nabla^{q+1}p+\nu\Delta U_q.
      \]

      The viscous part is read from the U q+2 tower rung, so the readout depth must reach at least N+2 for endpoint tower depth N.

      \[
      p=p_i^{loc}+h_i,
      \qquad
      -\Delta p_i^{loc}=\partial_a\partial_b(\chi_i u_a u_b),
      \]

      \[
      \|\nabla^{q+1}p_i^{loc}\|_{L^\infty(B_i')}
      \le
      C_{q,\alpha,i}\|\nabla^q(\chi_i u\otimes u)\|_{C^{0,\alpha}(2B_i)}.
      \]

      ATD m supplies the product-source carrier on the finite cover. The harmonic tail satisfies the energy far-tail estimate

      \[
      \|\nabla^{q+1}h_i\|_{L^\infty(B_i')}
      \le C_{q,i}\|u_0\|_{L^2}^2.
      \]


