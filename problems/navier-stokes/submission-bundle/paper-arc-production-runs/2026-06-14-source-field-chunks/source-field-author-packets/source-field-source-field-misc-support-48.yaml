      \subsection{Tgc A Hard Audit Terminal Radius Collapse}

      The audit question is whether terminal SCF-good radius collapse has theorem content as Jump avg, rather than serving as a bare relabeling.

      \[
      \mathcal B_{\varepsilon_m}^{\Phi}:=\{(a,t):r_{\mathrm{good}}(a,t)=0\}.
      \]

      \[
      \left[
      \forall\mathcal T'\subset\mathcal T\text{ terminal},\ \inf_{(a,t)\in\mathcal T'}r_{\mathrm{good}}(a,t)=0
      \right]
      \Longrightarrow
      \mathrm{Jump}_{\mathrm{avg}}(\mathcal T).
      \]

      \[
      r_{\mathrm{good}}(a,t)<r.
      \]

      Equivalently, no terminal subtail carries a uniform positive SCF-good scale. Hence Field avg( T) fails under the averaged field/coherence convention above.

      The averaged endpoint grammar identifies failure of the averaged field/coherence scale with Jump avg. so terminal radius collapse implies Jump avg.

      \[
      \mathcal T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing\Longrightarrow \mathrm{Jump}_{\mathrm{avg}},
      \]

      \[
      (a_n,t_n)\to T_*,\qquad r_{\mathrm{good}}(a_n,t_n)\downarrow0,
      \qquad r_{\mathrm{good}}(a_n,t_n)>0\text{ for each }n.
      \]

      Under that reading, terminal radius collapse is a genuine averaged field failure, hence an endpoint face.

      If Jump avg is read only as literal intersection with the pointwise bad set B m , the theorem fails to cover the terminal sequence-collapse scenario. The current route must so keep the broadened terminal-scale reading of Jump avg explicit.


