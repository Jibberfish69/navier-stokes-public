      The boot- multiplier route gives the same conclusion under compatible higher integrability of the boot multiplier and residual source factor. The current source surfaces record this as conditional: the multiplier and residual factors need an L p, p>2, or Holder-compatible pair of bounds. Those inputs remain open on selected terminal packets.

