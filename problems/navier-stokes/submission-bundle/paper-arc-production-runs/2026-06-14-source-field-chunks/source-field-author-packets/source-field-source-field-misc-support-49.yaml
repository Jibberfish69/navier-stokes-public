      \subsection{Trs Nu Scf Terminal Recurrence Scheduler Terminal Recurring Positive Nu Scf Mass Separated Bound}

      Show that recurring terminal positive nu SCF mass yields a separated or bounded-overlap lower schedule.

      \[
      Q_k=Q_{r_k}^{\Phi}(a_k,t_k)
      \]

      The window is required to lie inside the terminal subtail and have finite time footprint below T *.

      and its time footprint lies after sigma k. Hence it is disjoint from all earlier selected footprints.

      Induction gives infinitely many windows. Their time supports are pairwise disjoint, so the family is separated in time and has bounded overlap Omega=1. Since the selections occur in terminal subtails with sigma k T *, the family is terminal.

      This lemma does not produce positive nu SCF mass from Jump avg. That production remains the component-selection target. This lemma only converts recurring positive terminal mass into an upper-bound-compatible separated schedule.


