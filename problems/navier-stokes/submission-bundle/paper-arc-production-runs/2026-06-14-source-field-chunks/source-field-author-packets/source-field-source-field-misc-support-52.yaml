      \subsection{Modernized Four-Body Schema Under Torus / Tower / Deformation Geometry}

      This schema is run on the torus branch in the current argument, so the torus is not merely a diagnostic lab. It is the chosen classical surface for the internal proving branch.

      \[
      \mathcal P_{\mathrm{cl}}(T)=
      \bigl(
      S_{\mathrm{cl}}(T),
      Q_{\mathrm{cl}}(T),
      C_{\mathrm{cl}}(T),
      G_{\mathrm{cl}}(T)
      \bigr)
      \]

      \[
      S_{\mathrm{cl}}\to Q_{\mathrm{cl}},\qquad
      (S_{\mathrm{cl}},Q_{\mathrm{cl}})\to C_{\mathrm{cl}},\qquad
      C_{\mathrm{cl}}\to G_{\mathrm{cl}},\qquad
      G_{\mathrm{cl}}\to S_{\mathrm{cl}}.
      \]

      \[
      \mathcal P_{\mathrm{mod}}(T)
      :=
      \bigl(
      S_{\mathrm{tail}}(T),
      Q_{\mathrm{drain}}(T),
      C_{\mathrm{exact}}(T),
      G_{\mathrm{geo}}(T);
      \mathcal E_{\mathrm{live}}^{(n)}(T)
      \bigr),
      \]

      S tail (T) is the Body I scale-and-derivative-depth barrier, seen through dyadic tails E N,D N and tower tails T R, S r; Q drain (T) is the Body II drain record, either in Eulerian shadow form ( K r Eul , D r Eul , F r Eul ) or in primary deformation form ( K r Lag , D r Lag , C r Lag ); C exact (T) is the Body III exact-object-production packet, classically u (n) u and u (n) u (n) u u; G geo (T) is the Body IV geometry-evolving heat packet on (v,G); E live (n) (T) is the currently exposed survivor / defect carrier being passed around the loop.

      \[
      \boxed{
      \bigl(\mathcal P_{\mathrm{mod}}(T),\mathcal E_{\mathrm{live}}^{(n)}(T)\bigr)
      \Longrightarrow
      \bigl(\mathcal P_{\mathrm{mod}}(T^+),\mathcal E_{\mathrm{live}}^{(n+1)}(T^+)\bigr),
      }
      \]

      \[
      \mathcal E_{\mathrm{live}}^{(n)}
         \rightsquigarrow
         \mathcal F_r^{\mathrm{Eul}}
         \quad\text{or deeper}\quad
         \mathcal C_r^{\mathrm{Lag}}.
      \]

      That literal relay was present in the old packet, and it remains mandatory in the upgraded one.

      At the present route state, that replacement has not yet been proved. So the tails still survive, but in a much narrower role than before.

      This is still the monotonicity / coercive-energy body. The update is about language, not body reassignment
