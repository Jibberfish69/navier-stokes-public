      \subsection{Mixed-Jet Across-Rung Feed Picture}

      The point is to separate what is already exact from what is still only hoped for.

      \[
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
      \]

      \[
      \partial_t J_{m,\alpha}
      +
      \sum_{a=0}^{m}\sum_{\beta\le\alpha}
      \binom ma\binom{\alpha}{\beta}
      \big(J_{a,\beta}\cdot\nabla\big)J_{m-a,\alpha-\beta}
      +
      \nabla\Pi_{m,\alpha}
      =
      \nu\Delta J_{m,\alpha}.
      \]

      So what grows with depth is not just size. It is the number of interaction routes feeding the top rung.

      \[
      \langle (J_{m,\alpha}\cdot\nabla)u, J_{m,\alpha}\rangle,
      \]

      \[
      (a,\beta),\qquad (m-a,\alpha-\beta)
      \]

      \[
      J_{a,\beta}\otimes J_{m-a,\alpha-\beta}
      +
      J_{m-a,\alpha-\beta}\otimes J_{a,\beta}
      \]

      So unresolved lower defects are literally transported upward into higher defects.

      There is not yet any proved nonlinear downward telescoping across different rungs.

      But at present there is no theorem showing that when one sums over different rungs (m, ), these symmetric tensors telescope away.

      So the tower behaves like an infinite lower-triangular feed network with one downward damping channel.

