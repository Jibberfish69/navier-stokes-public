      \subsection{Minimum Drain-Rate Threshold Note}

      What is required is a one-sided drain law that is coercive on the blowup-driving roughness quantity.

      \[
      \mathcal K_r[u]\sfcomp{28523} \Psi_r[u]^\beta
      \qquad\text{for some }\beta>0,
      \]

      \[
      \frac{d}{dt}\mathcal K_r[u(t)]
      +
      c\,\Psi_r[u(t)]^p
      \le 0
      \qquad\text{for some }p>0.
      \]

      \[
      \frac{d}{dt}\mathcal K_r[u(t)]
      \le
      -c'\,\mathcal K_r[u(t)]^{p/\beta}.
      \]

      So K r is nonincreasing. If blowup would force r[u(t)] , then (2) already rules it out, because the same quantity that would have to blow up is being driven monotonically downward.

      \[
      \mathcal K_r' \le C_{\mathrm{sf},28533} -\mathcal K_r;
      \]

      \[
      \mathcal K_r' \le C_{\mathrm{sf},28537} -\mathcal K_r^\alpha,
        \qquad \alpha>1;
      \]

      Even (7) is enough for nonincrease of the blowup quantity once the law is already coercive on that quantity.

      The more realistic case is that one does not yet have a pure monotone law. Instead suppose

      Then the real threshold is no longer " or not ." The real question is whether the negative drain dominates the surviving positive production for large roughness.

      If p<m, the positive production wins at large scale, so the drain is not strong enough to force closure.


