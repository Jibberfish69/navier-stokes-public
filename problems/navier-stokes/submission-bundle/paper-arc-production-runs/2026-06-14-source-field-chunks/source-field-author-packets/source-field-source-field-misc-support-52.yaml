      \subsection{Mixed-Jet Cross-Rung Pairing Matrix}

      The point is that the familiar same-rung cancellations are only the diagonal shadow of a stronger matrix-level structure.

      \[
      A=(m,\alpha),
      \qquad
      B=(n,\gamma),
      \]

      \[
      J_A:=J_{m,\alpha},
      \qquad
      J_B:=J_{n,\gamma}.
      \]

      \[
      \partial_t J_A + (u\cdot\nabla)J_A + \widetilde T_A + \nabla \Pi_A = \nu\Delta J_A,
      \]

      \[
      \partial_t J_B + (u\cdot\nabla)J_B + \widetilde T_B + \nabla \Pi_B = \nu\Delta J_B,
      \]

      \[
      K_{A,B}(t):=\langle J_A(t),J_B(t)\rangle_{L^2_x}.
      \]

      So pressure does not only cancel on the diagonal. It cancels in every jet-vs-jet pairing.

      So viscosity acts on the full cross-rung correlation matrix, not only on the diagonal energies.

      So parity can help organize where the mixed source R A,B lands, but it does not by itself force those blocks to cancel.


