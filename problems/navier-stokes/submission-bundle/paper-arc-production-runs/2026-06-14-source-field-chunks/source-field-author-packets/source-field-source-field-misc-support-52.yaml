      \subsection{Mixed-Jet Preweight Viscous Extraction And Pair Symmetrization}

      The exact tower facts visible before factorial weights, generating fields, and weighted closure are the raw viscous extraction and pair symmetrization below.

      \[
      J_{m,\alpha}:=\partial_t^m\partial_x^\alpha u,
      \qquad
      \Pi_{m,\alpha}:=\partial_t^m\partial_x^\alpha p.
      \]

      \[
      \partial_t J_{m,\alpha}
      +
      \sum_{a=0}^{m}\sum_{\beta\le\alpha}
      \binom ma \binom{\alpha}{\beta}
      \big(J_{a,\beta}\cdot\nabla\big)J_{m-a,\alpha-\beta}
      +
      \nabla \Pi_{m,\alpha}
      =
      \nu\Delta J_{m,\alpha}.
      \]

      \[
      \nabla\cdot J_{m,\alpha}=0.
      \]

      \[
      \langle \nabla\Pi_{m,\alpha},J_{m,\alpha}\rangle=0,
      \]

      \[
      \langle (u\cdot\nabla)J_{m,\alpha},J_{m,\alpha}\rangle=0,
      \]

      Fix one surviving mixed term I a, m, . Because J a, =0, integration by parts gives

      So every individual mixed term surrenders one same-rung gradient to the viscous slot.

      So the endpoint term is not a viscosity term at all. It is a same-rung energy term with coefficient given by the base strain.

      These are the terms for which (12) is the natural raw estimate: one derivative goes to viscosity, and the rest becomes a coefficient product built from lower or split jets.

      Now ask whether complementary split pairs cancel before any weights are introduced.

      So the pair does not cancel in general. What it does is collapse to a symmetric strain-type coupling against the gradient of the top rung.

      So there is real pre-weight structure, but it is symmetrization, not automatic annihilation.

      The weighted/factorial route was introduced after this point, not instead of it. The reason for the weighted route was to organize the unresolved coefficient remainder across the entire infinite tower once the raw cancellations and raw viscous extraction had already been identified.

      The remaining interior coefficient sum m, int is not proved to cancel across the full tower.


