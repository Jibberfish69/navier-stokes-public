      \subsection{Monotone Functional Insufficiency Lemma}

      The point of the lemma is to show that the monotone bridge is real and necessary while still leaving the live obstruction at the high-frequency cascade.

      so the monotone bridge is necessary infrastructure but not the closure mechanism. After the Q(t) layer is installed, the live unresolved burden remains the cascade-to-gradient channel.

      The canonical source family explicitly defines Q(t) and derives its energy-dissipation evolution. Those equations control kinetic energy and enstrophy on the classical surface. But they do not by themselves prove a high-frequency tail estimate in the sense required by the scale-barrier bridge. Nor do they by themselves prove the fourth bridge needed to prevent gradient blow-up. So Q(t) is a theorem-bearing control quantity, but it hands the route forward rather than terminating it.

      Q(t) is explicit, Q(t) is necessary, Q(t) is insufficient by itself, so the next theorem burden is the high-frequency cascade and its downstream gradient channel.


