      \subsection{Mediating Object: monotone functional bridge discharge}

      This file gives the monotone bridge an exact local object in the same style used by the other bridge-facing packets.

      \[
      Q[u](t) := \|u(t)\|_{L^2_x}^2 + \|\nabla u(t)\|_{L^2_x}^2
      \]

      Q(t) is explicit, Q(t) is same-surface, Q(t) is necessary, Q(t) is insufficient by itself.

      The object controls the global energy/enstrophy layer. It does not directly control the dangerous-scale tail. That distinction is exactly why the bridge must hand off to the cascade carrier rather than pretending to close the theorem.

      Only indirect. The monotone bridge does not itself force continuation control. It merely ensures the gradient-side argument, whatever form it ultimately takes, inherits a legitimate same-surface global control layer.


