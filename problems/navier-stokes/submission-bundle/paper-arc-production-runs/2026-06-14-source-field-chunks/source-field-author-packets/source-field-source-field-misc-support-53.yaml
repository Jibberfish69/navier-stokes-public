      \subsection{Moving-Spill Fixed-Offset Reduction Lemma}

      So the moving-spill theorem is reduced to a finite-offset stability extension of the same-scale spill technology.

      \[
      b_\ell^{near,L}
      :=
      \int_{c_0\ell}^{c_1\ell} Q_r u\,\frac{dr}{r},
      \qquad
      1<c_0<c_1<\infty.
      \]

      \[
      \sum_{|m|\le M_L}\beta_m(\rho)=1,
      \qquad
      \rho\in[c_0,c_1],
      \]

      where each m is supported where 2 m, and M L< depends only on the logarithmic width L.

      \[
      b_{\ell,m}=T_m(\ell D)u.
      \]

      Moreover, b ,m is divergence-free and localized at frequency -1 with constants uniform up to the finite L-dependent family |m| M L.

      \[
      b_{\ell,m}=T_m(\ell D)u
      \]

      for an order-zero annular multiplier family T m. Since each Q r u is divergence-free, so is every b ,m .

      Let N,m mov denote the scalarized pairing contribution of b ,m inside the moving-spill channel. Then

      \[
      \left\langle
      [P_{\le \ell},b_{\ell,m}\!\cdot\nabla]u,\,
      P_{\le \ell}u
      \right\rangle
      =
      -\int_{\mathbb R^3}
      \tau_\ell(b_{\ell,m},u):\nabla u_{\le \ell}\,dx.
      \]

      Since b ,m is supported at scale -1 , only the edge-band part of u contributes inside the scalarized pairing. As in

      The resulting packet is same-scale, with a fixed annular offset determined by m. This is exactly N,m edge , proving (3).

      So the moving-spill theorem is reduced to a finite family of fixed-offset same-scale edge packets.

      The finite-offset reduction (5) is proved here. The stability theorem (6) remains open.

      That remaining step is exactly the point where the current spill technology must be checked for invariance under replacing the canonical edge operator by a finite family of annular order-zero multiplier families T m( D).


