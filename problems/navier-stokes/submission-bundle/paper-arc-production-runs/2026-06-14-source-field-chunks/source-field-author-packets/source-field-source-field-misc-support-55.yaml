      \subsection{E u replacement charge audit}

      If SCF base threshold concentration is carried by E u, then nu SCF may miss it, but nu SCF + sees it. Thus the enlarged charge formally fixes the component-selection defect.

      The current energy class does not provide this. Finite energy supplies global L t L x 2 and L t,x 10/3 bounds, but repeated shrinking terminal windows can have finite raw mass while their scale-normalized densities have divergent sum. Time-slice energy also cannot be counted across infinitely many terminal windows without a monotone or Carleson mechanism.

      The replacement-charge route does not eliminate Jump avg from the installed inputs.

      Without that scale-gain theorem, neither nu SCF nor nu SCF + can support the no-Field avg contradiction.


