      Role: close the missing bridge from the affine-frame defect package to the first center rung on the current lower-carrier route.

      It does not restore a bare comparison theorem on the full carrier |U 1(c j(t),t)|. It does not claim the affine-defect package is unnecessary. Its narrower claim is that once the affine defect is integrable, the first center rung itself is recovered through the deformation frame acceleration law.

      \[
      A_j(t):=U_1(c_j(t),t),
      \qquad
      \dot G_j(t)=A_j(t)\,G_j(t),
      \qquad
      G_j(t_0)=I,
      \]

      \[
      \mathcal E_j^{(1)}(t)
      :=
      -\nabla^2 p_j^{loc}(c_j(t),t)
      -\nabla^2 h_j(c_j(t),t)
      +\nu\Delta U_1(c_j(t),t).
      \]

      \[
      \ddot G_j(t)
      =
      \mathcal E_j^{(1)}(t)\,G_j(t).
      \]

      \[
      \ddot G_j
      =
      \dot A_j\,G_j
      +
      A_j\,\dot G_j.
      \]

      \[
      \dot A_j
      =
      -A_j^2
      +
      \mathcal E_j^{(1)}.
      \]


