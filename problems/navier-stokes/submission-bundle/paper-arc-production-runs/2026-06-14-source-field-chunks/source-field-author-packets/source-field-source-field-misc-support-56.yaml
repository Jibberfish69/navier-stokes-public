      \subsection{Javg Amp Local Energy Conversion Attempt Note}

      \[
      A_R^{aff}
      :=
      R^{-1}\sup_{t\in I_R}
      \int_{B_R^\Phi(t)}|u-u_R^{aff}|^2,
      \]

      \[
      D_R
      :=
      R^{-1}\iint_{Q_R^\Phi}|\nabla u|^2,
      \]

      and let P R loc denote the packet-local pressure contribution in the selected charge.

      \[
      R^{-2}\iint_{Q_R^\Phi}|u-u_R^{aff}|^3
      \le
      C(A_R^{aff}D_R)^{3/4}.
      \]

      Thus an SCF base threshold carried by the velocity term either sees D R, or it sees the amplitude channel A R aff . The target is to force that amplitude channel back into D R+P R loc .

      Test the local energy inequality against a transported cutoff adapted to Q R . In model normalized form,

      The pressure term is controlled by P R loc plus the already separated harmonic/far carrier. The cutoff and frame terms are controlled by the bounded same-fluid geometry. The convective term is exactly the active amplitude flux which, after interpolation, carries the same scale-critical factor as the velocity term.

      \[
      A_R^{aff}\text{ is paid by }D_R+P_R^{loc},
      \]

      \[
      A_R^{aff}\text{ persists / is transported through the active flux channel}.
      \]

      The second alternative is not excluded by finite energy, bounded pack gauge, or pressure Poisson structure alone.

      At a single time, Poincare gives a spatial relation between affine residual energy and instantaneous gradient energy. But D R is a heat-scale time integral. A terminal amplitude packet may be narrow in time, transported by the flow, or inherited from an earlier adjacent window. The installed estimates do not force it to deposit comparable heat-scale dissipation or local pressure mass on the same selected terminal schedule.

      Consequently, the lower side of branch-native Jump avg elimination remains open at the same active-amplitude wall.


