      \subsection{H1 H2 H6 Origin Retain Source Attack Note}

      The earlier attack version is superseded here. Its three primitive burdens are discharged by the endpoint-exclusion reading of Raw Data.Production, the retained smooth center-ball theorem, and the CM witness identity below.

      Here Raw Data.Production is read in the endpoint-exclusion route sense: on any same-fluid endpoint approach tail, either finite Pack/Part/Field/tower data are produced, or the failure is typed into the endpoint matrix. Since End NS removes the endpoint faces, endpoint-free approach tails carry the finite data.

      On compact classical intervals, smoothness of the maximal solution supplies retained center balls and finite local u,p norms. The retained smooth center-ball theorem gives

      \[
      \text{failure of retained admission}
      \Longrightarrow
      Dead\vee packing\text{-}detached\vee tower\text{-}blown\vee Jump.
      \]

      \[
      \Gamma_{pack,Q}\in L^\infty(I)
      \]

      \[
      \Gamma_{pack,Q}\text{ escapes every finite bound}
      \Longrightarrow
      packing\text{-}detached\vee tower\text{-}blown.
      \]

      Both faces are killed by the endpoint matrix once End NS is installed. Hence the pack gauge and finite same-fluid cover persist on endpoint-free approach tails.

      \[
      CM_{N,r,Q}=Pack_Q\wedge Part_{N,Q}\wedge Field_{N,r,Q}.
      \]

      The face dictionary is local: \(\neg Part_{N,Q}\) gives \(Dead\);
      \(\neg Pack_Q\) gives \(packing\)-detached or \(tower\)-blown; and
      \(\neg Field_{N,r,Q}\) gives \(Jump\).


