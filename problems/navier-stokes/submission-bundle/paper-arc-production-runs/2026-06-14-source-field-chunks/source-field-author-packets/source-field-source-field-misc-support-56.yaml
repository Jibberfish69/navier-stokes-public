      \subsection{Height Flux Synthesis Adversarial Audit}

      Post-audit correction: First Height Creation Dichotomy.A has now been attempted directly and collapsed as an independent target. The corrected live reading is that first-height language points back to Height Flux Control.A plus a genuine structural mechanism.

      It also correctly identifies the residual source wall as a Field-face problem after the witness split, not as a primitive positive bootstrap from Original Smooth Data.

      The synthesis does not prove Scale Critical Tree Carleson.A, Reserve Creation Charge.A, Donor Height Creation.A, or Height Flux Control.A.

      \[
      R_N(W)
      \le
      H_N(W)M_N(W),
      \qquad
      H_N(W):=\sup_{t\in W}\sup_{k>N}2^k\sum_{\ell>k+4}D_\ell(t).
      \]

      \[
      R_N(W)\ge \eta,
      \qquad
      M_N(W)=o_N(1),
      \]

      \[
      H_N(W)\to\infty.
      \]

      This justifies looking for a height-creation theorem rather than trying to control the spike-sensitive reserve by first-moment energy alone.

      \[
      \left[
      H_N(W)-H_N(Past(W))-Loss^{height}_{legal}(W)
      \right]_+
      \]

      Since that theorem collapsed, Donor Height Creation.A can be spent toward first-pulse Reserve Creation Charge.A only after a real structural Height Flux Control.A mechanism is installed.

      \[
      \int_W
      \sup_{k>N}
      \left[
      2^k\sum_{\ell>k+4}2^{2\ell}F_\ell(t)
      \right]_+
      dt.
      \]

      The CM convergence atlas, senior research architect synthesis memo, actual Height Flux Control synthesis memo, and donor-height reduction note are retained as audit-open target-refinement surfaces.


