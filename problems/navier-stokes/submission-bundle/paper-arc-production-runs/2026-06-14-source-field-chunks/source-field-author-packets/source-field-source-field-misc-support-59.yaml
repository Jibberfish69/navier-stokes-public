    If the tail is made of good points but the available good radii degenerate to zero toward the terminal endpoint, then the limiting tail has no positive SCF-good terminal scale. This is the strict-margin form of the same bad-set alternative and is recorded as Jump avg. Thus cover-degeneration is not a fifth face and not a pointwise readout theorem; it is the averaged field/coherence failure face.

    Scheduler integrability remains downstream. The proved classification here is cover degeneration as Jump avg, with the endpoint-removal step kept downstream so the averaged/pointwise type boundary stays intact.



    \subsection{Pctp Hard Cover Degeneration To Jumpavg Verification}

    \[
    \mathrm{Jump}_{\mathrm{avg}}(\mathcal T)
    \Longleftrightarrow
    \mathcal T\cap\mathcal B_{\varepsilon_m}^{\Phi}\ne\varnothing
    \]

    \[
    \text{cover-degeneration}\Longrightarrow \mathrm{Jump}_{\mathrm{avg}}.
    \]

    If the tail lies in the strict SCF-good region with a positive margin, then the SCF-good cylinders form an open cover. On every compact tail piece, compactness selects finitely many cylinders. Since this finite list has positive radii, the minimum radius is positive.

    The first case is Jump avg by the definition of the bad material set. The second case is the strict-margin form of the same averaged coherence failure: no positive terminal SCF-good scale survives on the same-fluid tail. This is exactly the averaged field/jump face, not a new primitive endpoint family.

    \[
    \text{strict averaged-good branch}\quad\text{or}\quad \mathrm{Jump}_{\mathrm{avg}}.
    \]

    On the strict branch, the remaining analytic obligation is the common AACT scheduler on the finite SCF-good cover.


