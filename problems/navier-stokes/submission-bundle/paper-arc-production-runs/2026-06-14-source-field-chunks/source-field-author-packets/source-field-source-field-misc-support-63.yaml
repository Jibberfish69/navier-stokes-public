      \subsection{Source Drain.Theorem Grade.A correct resolution: diffuse ancestry obstruction}

      The normalized-adjoint package remains a valid conditional parent-or-charge mechanism. It does not close the source wall as a theorem-grade consequence of Original Smooth Data.

      The failed theorem-grade certificate is First Pulse Kill.A at the no-diffuse-ancestry step.

      The first-pulse selection excludes earlier threshold-crossing source-pulse tiles on fixed backward slices. It does not price diffuse legal source-parent ancestry.

      \[
      \pi_P=\frac{1}{M}\sum_{\alpha=1}^M\delta_{P^-_\alpha},\qquad M\to\infty,
      \]

      \[
      \sup_{|\mathcal C|\le B}\pi_P(\mathcal C)\le \frac{B}{M}\to0,
      \]

      so bounded parent selection plus first-pulse minimality cannot imply source-parent compactness.

      Global skew cancellation is signed and unlocalized. The target is localized, terminal-selected, weighted, and positive-parted. Calderon-Zygmund pressure recovery supplies size control, while Cauchy/Young estimates return to an active- envelope.

      Raw energy dissipation gives only a first-moment tail. It does not control the scale-critical reserve

      \[
      \int\sum_{k>N}2^k\left(\sum_{\ell>k+4}D_\ell(t)\right)^2dt.
      \]

      A terminal heat-scale pulse can keep first-moment dissipation small while the scale-critical reserve remains non-small.

      \[
      \boxed{ZenoBoundedClass_B.A+ZenoResidueLiouville_B.A.}
      \]

      Equivalently, an admissible repair may prove a finite pricing theorem for diffuse legal source-parent ancestry. Such a theorem must dominate the diffuse parent measure in a /Carleson reserve or place the Zeno limit in a rigid class with a source-residue Liouville theorem.


