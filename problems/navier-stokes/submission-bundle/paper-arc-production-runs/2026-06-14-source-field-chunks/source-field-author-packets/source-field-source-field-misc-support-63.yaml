      \subsection{Terminal Defect Liouville.A external Liouville audit}

      Koch--Nadirashvili--Seregin--Sverak, Liouville theorems for the Navier-Stokes equations and applications, ar Xiv:0709.3599.

      The paper studies bounded ancient Navier-Stokes solutions. Its abstract says the general three-dimensional problem is beyond the available techniques, with partial results in axisymmetric settings.

      Albritton--Barker, On local Type I singularities of the Navier-Stokes equations and Liouville theorems, ar Xiv:1811.00502.

      The route produces Liouville conclusions under Type I / mild bounded ancient structure and an additional L 3-type backward-time condition. Those are not outputs of the present Terminal Bad Scale Extraction.A packet.

      Koch--Nadirashvili--Seregin--Sverak also emphasize in the singularity application section that producing a nonzero bounded ancient solution is not itself contradictory; one must add a scale-invariant exclusion or a Liouville theorem for the produced class.

      The available Liouville tools cover rigid classes such as bounded ancient mild
      solutions, Type I decay classes, additional backward-time $L^3$ control,
      axisymmetric or lower-dimensional reductions, or finite global ancient energy
      paired with a valid exclusion theorem. A terminal extraction becomes a
      contradiction only after the extracted object is proved to belong to one of
      those rigid classes $R_*$. The present packet has not supplied that membership,
      so this subsection records an external Liouville audit rather than a closed
      terminal-defect exclusion.


