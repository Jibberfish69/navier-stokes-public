      \subsection{Why Q(t) Is A Named Bridge}

      Why is the monotone-functional layer in the handed Navier-Stokes program a named source-level theorem object rather than generic background energy bookkeeping?

      The source family does four specific things that generic background energy prose does not do.

      \[
      Q(t)=\|u(t)\|_{L^2_x}^2+\|\nabla u(t)\|_{L^2_x}^2.
      \]

      \[
      \frac{dQ}{dt}
      =
      -\nu \|\Delta u\|_{L^2_x}^2
      + C\|\nabla u\|_{L^2_x}^3.
      \]

      It treats that object as one of the four nodes in the interdependency diagram, not as an unnamed background estimate.

      It assigns that node a specific route job: Q(t) stabilizes the global energy/enstrophy layer and feeds the compactness package, while remaining insufficient by itself and so handing the route forward to the cascade carrier.

      If Q(t) were only background energy prose, the source stack would merely use classical energy estimates silently and move on.

      Q(t) is explicit theorem-bearing infrastructure on the classical surface. Q(t) is not the whole theorem, because the post-monotone cascade carrier, scale barrier, compactness, and fourth bridge still have to close the loop.

      The original framework does not merely assume bounded energy in the background. It elevates the functional Q(t) into a named bridge that records global energy/enstrophy control on the same classical surface used by the other three pillars.


