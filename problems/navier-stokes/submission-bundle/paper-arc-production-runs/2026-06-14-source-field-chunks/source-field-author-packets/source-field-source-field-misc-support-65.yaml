      \subsection{Sterile Ontic-To-NS Theorem Map}

      This is a sterile theorem map, not a proof packet. Its job is to translate the ontic defect-transport story into the exact theorem objects already carried by the Navier-Stokes argument.

      Def exact: exact / pressure-like ordering correction, Def pers: persistent carrier / holonomy class, Def res: residual tail / absorbable remainder.

      D.1 is the projected sector and closed-graph domain statement. D.2 is the coercive estimate that keeps the residual tail absorbable. D.3 is the commutative shadow descent from the persistent carrier split. D.4 is the continuation step that lifts bounded NC control to classical control. Theorem 2.1 is the same-surface closure carrier that packages those four steps into the classical route theorem.

      This is not a new theorem family. It is the sterile form of the statement that the pure noncommutative phase-defect sector is shadow-invisible, while the carrier sector survives as the classical readout.

      Use this map when a working note or Marvin feed speaks in ontic language. Translate that language into the theorem objects above before it enters D.1, D.2, D.3, D.4, or the final closure carrier.


