      \subsection{Overlap-Defect Observability Placement Note}

      They should enter only after one has built a derived defect equation for a packet-overlap or separation-density quantity. That derived-defect packet is now available concretely in

      \[
      \text{good-set linearization}
      \Longrightarrow
      \text{transverse lower bound}
      \Longrightarrow
      \text{nonshadowing}
      \Longrightarrow
      \Gamma_J\to 0.
      \]

      \[
      w_J(t,x)
      \sfmodel{56542}
      \sum_{Q\sfcomp{56543} Q'}
      c_{Q,Q'}\,
      U_j(t)\phi_Q(x)\,\overline{U_j(t)\phi_{Q'}(x)},
      \]

      The two-point defect is the sharper object for shadow-tube and pair-gap work, because diagonal concentration is intrinsically a two-point phenomenon.

      \[
      \partial_t w_J+v_J\cdot\nabla w_J-\nu\Delta w_J
      =
      -\nabla\cdot(r_J\rho_J),
      \]

      \[
      \partial_t W_J
      +
      v_J(x,t)\cdot\nabla_x W_J
      +
      v_J(y,t)\cdot\nabla_y W_J
      -\nu(\Delta_x+\Delta_y)W_J
      =
      -\nabla_x\cdot\big(r_J(x,t)K_J\big)
      -\nabla_y\cdot\big(r_J(y,t)K_J\big).
      \]

      This still does not solve the live selector-local lower-bound burden. What it does close is the derived-defect side of the route: once the selector packet has produced nonshadowing or a shadow-time budget, the downstream parabolic tools can be attached to explicit equations rather than to a model stand-in.


