      \subsection{SSC D7mb Collapse And Suppliers}

      Active theorem-facing companion note for the measurable-derivative Cauchy--Green route on the exact-potential simple-top branch.

      Role: compress the D.7mb residual-budget route to one integrated collapse proposition plus honest supplier lemmas.

      The key correction is that the integrated collapse must use the squared D.7mb10 residual packet, not the unsquared sum of L 1 budgets. In this -budget reading, Mix Collapse-Honest is the hard supplier. Init Collapse and Drift Collapse-Honest are supporting suppliers for the same SSC-D7mb-collapse packet, not alternate route primitives.

      \[
      \Pi_J^{ref}:=P_J^{CG},
      \qquad
      \Pi_J^{top}:=P_{J,\top}^{seg},
      \]

      and keep one selector-good atom-free strip on the exact-potential simple-top branch. Define the pointwise D.7mb10 residual packet

      \[
      \eta_J^{mb}(t,a,b)
      :=
      |m_J(t_0,a,b)|
      +
      \eta_{J,\mathrm{mix}}^{mb}(t,a,b)
      +
      \eta_{J,\mathrm{drift}}^{mb}(t,a,b),
      \]

      \[
      \eta_{J,\mathrm{mix}}^{mb}(t,a,b)
      :=
      2\int_{t_0}^t
      \Bigl|
      Q_J^{top}(s)\,(W_J^N(s,a))^*S_J^N(s,a)W_J^N(s,a)\,n_J(a,b,s)
      \Bigr|\,ds,
      \]

      \[
      \eta_{J,\mathrm{drift}}^{mb}(t,a,b)
      :=
      3\int_{t_0}^t
      \frac{
      |\mathcal C_J^N(s,a)|\,|\partial_s S_J^N(s,a)|
      }{
      g_J^{str}(s,a)
      }\,ds.
      \]

      \[
      \bigl\|\Pi_J^{ref}(t,a)-\Pi_J^{top}(a,b,t)\bigr\|_F^2
      \le
      \frac{2\,\eta_J^{mb}(t,a,b)^2}{\operatorname{gap}_J^{CG}(t,a)^2}.
      \]

      Assume the full hypothesis package of D.7mb on the exact-potential simple-top branch, and assume the Cauchy--Green gap floor

      This is the sharpest on-disk reduction of the hard supplier. Any carrier-based shortcut must still prove an extra theorem that dominates the off-axis forcing by projector-angle error.

      The -budget route above is compatible with the installed bootstrap packet. The point is that D.7mm already controls the three D.7mb supplier records once its bootstrap envelope is -integrable on the selector-good family.

