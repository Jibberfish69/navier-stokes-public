      \subsection{Stable Projector Recovery Via Davis-Kahan}

      Role: isolate the exact payoff of the spectral gap once the observable surrogate exists.

      \[
      \widehat P_J:=\Pi_{\max}(\Sigma_J).
      \]

      \[
      \|\widehat P_J-\Pi_J^{ref}\|_F
      \le C_{\mathrm{sf},60453}
      \frac{\|\Sigma_J-\Sigma_J^{ref}\|_{\mathrm{op}}}{g_J^{str}}.
      \]

      \[
      \|\widehat P_J-\Pi_J^{ref}\|_F
      \le C_{\mathrm{sf},60459}
      \frac{\mathrm{Err}_{J,\mathrm{obs}}}{g_J^{str}}.
      \]

      Use the simple-top gap to ensure the top eigenspace is rank one. Apply Davis--Kahan between J and J ref . Read the numerator from the observable-construction record.

      The projector \(P_J\) is not yet compared here with the true top-strain projector \(P_{J,\mathrm{seg}}\). That comparison is the downstream selector-strain compatibility wall.

      \[
      \Sigma_J:=\widehat P_{J,\varepsilon}^{pair},
      \qquad
      \Sigma_J^{ref}:=P_J^{CG},
      \qquad
      \widehat P_J:=\Sigma_J,
      \qquad
      \Pi_J^{ref}:=\Sigma_J^{ref}.
      \]

      \[
      \|\widehat P_J-\Pi_J^{ref}\|_F^2
      \le
      \operatorname{Err}_{J,CG}^{pair,\varepsilon}.
      \]

      So on this branch the Davis--Kahan slot carries no remaining theorem debt beyond the closure of PTC-Lin and PTC-Shape.


