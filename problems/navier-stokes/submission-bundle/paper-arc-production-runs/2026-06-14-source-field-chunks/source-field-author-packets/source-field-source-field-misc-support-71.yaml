      \subsection{Strict-Shadow No-Remainder Consumer Corollary}

      This is a downstream consumer corollary on the Euclidean strict-shadow/export surface.

      It sits after the earlier CM-to-Euclidean export splice and after the exact strict-shadow package on that exported Euclidean surface. So it is not a branch root and it is not an additional theorem burden beside (A1a)--(A1c).

      and let u= C(X) on the Euclidean surface already supplied by the earlier CM-to-Euclidean export splice.

      \[
      \mathcal C(\nabla_X X)=(u\cdot\nabla)u,
      \qquad
      \mathcal C(\iota_X\Omega_D^{\mathrm{nc}}(X))=0,
      \]

      \[
      E_{\mathrm{sh}}(X)\equiv 0.
      \]

      \[
      \partial_t u+\mathbb P_{\mathrm{Leray}}(u\cdot\nabla u)=\nu\Delta u.
      \]

      \[
      \partial_t u+u\cdot\nabla u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0.
      \]

      Comparing (6)--(7) with (8) forces Shadow Def (X)=0, and comparing the exact projected nonlinear identity (3) with (9) forces E sh (X)=0. .

      So the exact strict-shadow/export branch and the weaker robustness branch remain separate theorem shapes.


