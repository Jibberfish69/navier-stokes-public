    \section{What Class Membership Means Here}

    Class membership is the statement that the terminal record is still a record of the same Navier--Stokes solution.  Write
    \[
      \Owork=\mathfrak O_{\NS}^{\mathrm{work}}(u_0,\nu,u,p)
    \]
    as a reader-facing name for that fixed object.  Here \(u_0\) is the initial datum, \(\nu>0\) is the fixed viscosity, and \((u,p)\) is the velocity-pressure pair solving the original incompressible Navier--Stokes system up to the alleged terminal time.  The same object also carries the pressure law, incompressibility, and the material carrier transported by \(u\).

    A terminal record \(Q\) is tested against this fixed object:
    \[
      \Member(Q;\Owork).
    \]
    This sentence has a concrete meaning.  The record \(Q\) remains attached to the same initial datum, the same preterminal velocity-pressure solution, the same viscosity, the same pressure law, the same divergence-free condition, the same transported material carrier, and the same terminal role in the alleged breakdown.  A related flow, an Euler boundary picture, a diagnostic trace, or an exported source record may help the argument, but membership is reserved for the selected record of the original branch.

    The exit predicate records the loss of that membership statement:
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The proof derives this negation by finding the first class datum that the selected terminal record cannot carry.  That is why the witness tree has faces.  The faces make the failure inspectable.

    \subsection{The fixed class data}

    The class data are fixed by the equation
    \[
      \partial_tu+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(\cdot,0)=u_0.
    \]
    The pressure is the pressure generated by incompressibility.  The carrier is moved by the same velocity field.  The viscosity remains the same positive number.  The terminal role is fixed by the contradiction setup: \(Q\) is offered as the finite-time terminal record of the original solution.

    A proposed record that changes one of these data has left the class being tested.  A regularized equation, inviscid comparison branch, detached source model, private packet, or generated geometry can still be useful.  It becomes part of the membership proof only when the page reattaches it to \(\Owork\) and identifies it with the selected record \(Q\).  Before that reattachment, it is support material or a boundary picture.

    Three common support families enter after this definition is fixed.  A forward-invariance route belongs to the pass side: after membership has been installed on a same-fluid family, it records how that membership is carried by the same field.  A collar-to-jump converse belongs to the Field side: on a fixed transported cover, it helps turn retained-cover oscillation into a one-field failure or a one-field payment.  A frozen-family source ledger belongs to the supplier side: it can pay pressure and source pieces feeding one-field preservation.  In all three cases the membership statement remains the same Pack, Part, and Field certificate on the selected record \(Q\).

    \subsection{Participation as one law}

    Participation is the pressure-viscosity-incompressibility law acting on the same carrier.  The equation reads transport, pressure, viscosity, and incompressibility together:
    \[
      D_tu+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      D_t=\partial_t+u\cdot\nabla.
    \]
    At finite derivative depth write
    \[
      U_k:=\nabla^k u,\qquad
      K_k:=-\nabla^{k+1}p+\nu\Delta U_k.
    \]
    Differentiating the original equation gives
    \[
      D_tU_k=K_k+B_k(u,\nabla u,\ldots,\nabla^k u),
      \qquad 0\le k\le N,
    \]
    where \(B_k\) is the commutator expression created by differentiating the transport term.  This tower is not a new equation.  It is the original Navier--Stokes law read at the derivative depths needed by the terminal test.

    \subsection{The witness certificate}

    At finite depth \(N\) and positive scale \(r\), the manuscript uses the analytic witness
    \[
      \CM_{N,r,Q}
      :=
      \Pack_Q\wedge\Part_{N,Q}\wedge\Field_{N,r,Q}.
    \]
    This witness is the local certificate for membership.  Pack supplies the same-fluid carrier.  Part supplies the same pressure-viscosity-incompressibility tower on that carrier.  Field supplies one positive scale on which neighboring velocity, pressure, and tower readings remain readings of one field.

    The membership direction is
    \[
      \forall N\ \exists r_N>0:\ \CM_{N,r_N,Q}
      \quad\Longrightarrow\quad
      \Member(Q;\Owork),
    \]
    with the branch readout attached at the continuation depth selected later in the proof.  The fail side is read by the Pack-first loss of this same certificate.  A loss of carrier is \(\neg\Pack_Q\).  A retained carrier with lost participation is \(\Pack_Q\wedge\neg\Part_{N,Q}\).  A retained carrier and retained participation with no positive coherent field scale is
    \[
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    The witness certificate is the bridge between the readable class statement \(\Member(Q;\Owork)\) and the three concrete tests the proof can inspect.

    \subsection{Euler as a boundary reading}

    Euler material has a narrow role in this paper.  It helps name a boundary of the fixed-viscosity Navier--Stokes class.  A terminal picture may retain incompressible transport and pressure balance while losing the fixed positive-viscosity law.  Such a picture may be understandable as an inviscid boundary object, while the Navier--Stokes class test records the lost participation or lost field readout.

    Slip and jump pictures belong in the manuscript only in this limited sense.  Matching normal flux with incompatible tangential readings can still describe an inviscid weak balance.  For the fixed-viscosity Navier--Stokes class, the same picture is tested by the same three faces: carrier, participation, and field.  The comparison helps the reader see the boundary; the class-membership conclusion is charged to the Navier--Stokes record itself.
