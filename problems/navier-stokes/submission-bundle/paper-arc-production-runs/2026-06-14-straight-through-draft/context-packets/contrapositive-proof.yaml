    \section{The Contrapositive Test}

    The contrapositive route begins after the forward analysis has selected a terminal record \(Q\) from the same Navier--Stokes branch.  The paper then asks one class question: does this selected record still carry the same-fluid data needed for continuation, or has it lost a required part of that data?

    The analytic certificate is
    \[
      \CM_{N,r,Q}
      :=
      \Pack_Q\wedge\Part_{N,Q}\wedge\Field_{N,r,Q}.
    \]
    The three factors have different jobs.  Pack supplies the positive transported carrier.  Part supplies the same pressure-viscosity-incompressibility law on that carrier through depth \(N\).  Field supplies one positive scale on which the tower readings form one velocity-pressure field.

    The membership direction is
    \[
      \forall N\ \exists r_N>0:\ \CM_{N,r_N,Q}
      \quad\Longrightarrow\quad
      \Member(Q;\Owork),
    \]
    with the continuation readout for the branch attached at the depth being used.  This is the pass side.  It says that the selected record remains inside the working Navier--Stokes class.

    The fail side is supplied by finite-witness classification.  A finite terminal obstruction \(\mathcal F\) that has been admitted as the same selected record cannot keep a continuation-complete Pack/Part/Field packet.  If it kept
    \[
      \Pack_Q,\qquad \Part_{N_s,Q},\qquad \Field_{N_s,r,Q}
    \]
    at a depth \(N_s\) high enough for the \(H^s\), \(s>5/2\), readout, the local \(H^s\) theory restarts the classical solution past \(T_*\).  A genuine finite terminal obstruction must lose the first available face in Pack-first order:
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N_s,Q},
      \qquad
      \Pack_Q\wedge\Part_{N_s,Q}\wedge\forall r>0\,\neg\Field_{N_s,r,Q}.
    \]
    That first face failure is the class-exit witness,
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork),
    \]
    for this admitted finite terminal record.

    The route uses both statements together.  The certificate direction proves membership from a retained packet.  The finite-witness classification proves exit when an admitted finite obstruction loses its first required packet face.  This separation is what keeps the proof from treating an arbitrary bad scale or bad cover as a class exit.

    The converse used here is typed.  A bad-looking packet has no proof role until it has been admitted as the selected same-solution terminal record.  After admission, the paper must derive the first lost face.  Carrier point-probe lemmas pay Pack admission.  Retained pressure packages pay Part placement or Field placement according to whether the same pressure-viscosity tower is lost or the one-field readout is lost.  Averaged jump notes pay Field admission only after Pack and Part have survived.  Euler boundary comparisons remain boundary comparisons unless they land one of these same faces.  The conclusion \(\Exit(Q;\Owork)\) belongs to the selected record after that typed face loss.

