    excerpt: |-
      - Surface-triggered target-switching rule: do not let the latest repo surface, contradiction, export verdict, direct-attempt note, or correction seize the theorem target. Hold the governing proof invariant first. For Navier-Stokes CM, the invariant is `Exit(Q):=not Member(Q)` through Pack/Part/Field; a surface-derived burden becomes live only after Codex proves why it is necessary inside that invariant, such as by showing a genuine in-class nonsmooth third branch.
      - In theorem-route selection, do not promote fallback diagnostics into primary targets. Before naming a live theorem target, classify candidate surfaces as primary preemption route, fallback diagnostic, downstream readout, support accounting, or stale overlay. If an upstream estimate or budget theorem would make a fallback endpoint moot, keep the upstream theorem as the live target and leave the fallback only as audit/classification support.
      - In theorem work, classify the proof program, proof role, logical skeleton, and proof mechanism before choosing the next attack. Use the broader repertoire of contrapositive, contradiction, cases, induction, invariants, monovariants, extremal principles, minimal counterexamples, descent, diagonalization, counting, bijection, generating functions, probabilistic method, compactness, topology, algebraic encoding, analytic estimates, and finite/computer-assisted exhaustion. If stuck, pivot proof method before pressing the same positive-forward estimate harder. For Navier-Stokes, CM contrapositive class exit remains the primary program; the proof-method library supports subproblems without replacing CM exit or deleting lawful exit witnesses.
      - In theorem conversation, type every loaded phrase before chaining it into a sentence. For Navier-Stokes CM work, keep these roles separate: finite breakdown or counterexample assumption, grammar-admissible test object, class-member predicate, witness face, face failure, support/readout, and class-exit conclusion. `CM-lawful` may only mean admissible for the CM test, never `Member(Q)`; a face failure lands in Pack/Part/Field, not the whole witness; `Exit(Q):=not Member(Q)` is the class-exit conclusion supported by the face failure, not a synonym for Pack/Part/Field.
      - In theorem work, failure labels such as `dead`, `blown`, and `jump` are outputs of a mechanism test, not a starting taxonomy. Before naming one, derive it from the proof program: `Dead` means Part-side participation failure or same-object dynamic carrier failure; raw no-positive-radius carrier is Pack-side unless participation failure is also derived; retained positive-window unbounded field means blown; incompatible surviving traces mean jump. A fluent label list without that derivation is a conduct failure.
