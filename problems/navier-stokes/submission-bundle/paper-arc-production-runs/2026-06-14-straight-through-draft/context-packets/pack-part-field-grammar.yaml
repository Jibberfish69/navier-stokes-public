author_contract:
  arc_id: pack-part-field-grammar
  must_write:
  - finished TeX prose, not a report
  - reader-facing explanation before compressed notation
  - full derivation/proof steps available in the current repo context
  - gold status and obstruction stated without redefining gold
  - CM/silver counterpart written where the arc touches class exit
  - endpoint status stated as proved, support, obstruction, obsolete, contradiction,
    or open continuation
  must_criticize:
  - attack the replacement's strongest claim and state how the replacement now pays
    or limits it
  - name the exact sentence, definition, or proof step where a reader could lose the
    thread
  - name any derivation jump that remains open, or state why the derivation is supplied
    on the page
  - record a repair decision before integration
  must_not_write:
  - boilerplate that presents the work as only a status snapshot
  - internal automation or progress-report voice
  - unfilled prose
  - unsupported theorem claim hidden as narrative confidence
  required_patterns: *1
  source_material_rule: every repo note, section, obstruction, and support item in
    the packet must be turned into prose, proof argument, endpoint status, or a sourced
    exclusion
  integration_path: verify_author_pack -> integrate_author_pack -> targeted changed-section
    build
mechanical_verifier:
  forbidden_prose_patterns:
  - This paper is a current-state
  - CMI-facing account
  - live gold boundary
  - source-spine
  - rewrite pack
  - status ledger
  - worker
  - runner
  - "\\btherefore\\b"
  - "\\\\over\\b"
  - "<<FILL"
  - "\\bTODO\\b"
  - "\\bTBD\\b"
  - placeholder
  minimum_replacement_chars: 600
  math_reader_critic_required:
  - claim_truth_attack
  - reader_thread_attack
  - open_derivation_attack
  - repair_decision
  must_emit: ready author pack with replace_section rewrites, not notes or reports
