  text: |
    \section{Velocity Failure Mechanisms}

    The words dead, jump, and blown name mechanisms after the first failed face has been located.  They are not substitutes for the Pack/Part/Field test.  The proof first fixes the selected record \(Q\), checks Pack, checks Part, and then checks Field.  The first failed face determines which mechanism name is lawful.

    \subsection{Dead}

    Dead names the clean Part mechanism.  A carrier is still present, and the proof can point to the same terminal body.  The failure is that the same pressure-viscosity-incompressibility law no longer acts on that body through the tower being tested.  The word does not mean zero velocity.  It means loss of same-object dynamics.  In symbols, the first face is
    \[
      \Pack_Q\wedge\neg\Part_{N,Q}.
    \]
    Once Part fails, neighboring field readings usually fail as a consequence.  The argument marks Part as the first lost requirement because the equation law has already stopped participating on the selected carrier.

    \subsection{Jump}

    Jump names the clean Field mechanism.  The carrier survives and the local law remains readable far enough to compare neighboring readings.  The readings fail to assemble into one velocity field on any positive scale allowed by the record.  The first face is
    \[
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    A jump is a coherence failure: finite local readings fail to be the readings of one smooth field.

    \subsection{Blown}

    Blown names the unbounded-tower mechanism.  A positive carrier remains visible, and a derivative, pressure term, viscous term, or continuation readout becomes unbounded at the finite depth under test.  The mechanism is routed through the ordered faces.  An unbounded reading that destroys the carrier is Pack failure.  An unbounded reading on a retained carrier whose pressure-viscosity tower is no longer the same Navier--Stokes tower is Part failure.  An unbounded reading after Pack and Part survive is Field failure when no positive-scale coherent field can include it.

    This is the point of the taxonomy.  Large quantities, terminal pulses, weak limits, and endpoint traces become exit evidence after the paper identifies the selected same-solution record and derives the first Pack, Part, or Field face failure on that record.
  truncated: false
