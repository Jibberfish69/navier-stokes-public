author_contract:
  arc_id: same-solution-close
  must_write:
  - finished TeX prose, not a report
  - reader-facing explanation before compressed notation
  - full derivation/proof steps available in the current repo context
  - gold status and obstruction stated without redefining gold
  - CM/silver counterpart written where the arc touches class exit
  - endpoint status stated as proved, support, obstruction, obsolete, contradiction,
    or open continuation
  must_criticize:
  - attack the replacement's strongest claim and state how the replacement now pays
    or limits it
  - name the exact sentence, definition, or proof step where a reader could lose the
    thread
  - name any derivation jump that remains open, or state why the derivation is supplied
    on the page
  - record a repair decision before integration
  must_not_write:
  - boilerplate that presents the work as only a status snapshot
  - internal automation or progress-report voice
  - unfilled prose
  - unsupported theorem claim hidden as narrative confidence
  required_patterns: *2
  source_material_rule: every repo note, section, obstruction, and support item in
    the packet must be turned into prose, proof argument, endpoint status, or a sourced
    exclusion
  integration_path: verify_author_pack -> integrate_author_pack -> targeted changed-section
    build
math_dependency_policy:
  containment_rule: theorem work may start only from a named manuscript gap in this
    arc, and the result must return as TeX-ready derivation, exact obstruction, or
    CM counterpart
  forbidden_work:
  - free-running proof search
  - new theorem attempts without a section_ref
  - positive-forward estimate churn that does not change the manuscript
  - route summaries that do not pay a line on the page
  required_handoff_fields:
  - section_ref
  - gap_sentence
  - repo_sources_used
  - gold_status
  - silver_or_cm_counterpart
  - tex_ready_replacement
  arc_author_job: write the same-solution bridge so the reader sees that the CM pass/exit
    test is applied to the terminal object already produced by the proof route
math_reader_critic_contract:
  arc_id: same-solution-close
  critic_scope: criticize only this authored arc and return repairable failures tied
    to the replacement text
  must_answer:
  - claim_truth_attack
  - reader_thread_attack
  - open_derivation_attack
  - repair_decision
  acceptable_repair_decisions:
  - passes after repair
  - open endpoint written explicitly
  - blocked with exact manuscript gap
  integration_rule: the author pack cannot pass until each replacement records a resolved
    math/reader criticism decision
