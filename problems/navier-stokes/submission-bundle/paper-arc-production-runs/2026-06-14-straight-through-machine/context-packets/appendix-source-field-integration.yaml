      - Treat "explain simply", "simpler please", "plainly", "plain English", "ordinary language", "tldr", and close variants as representation-debt flags, not cosmetic shortening requests. Recover the plain live object, its job, the actual blockage, and the next move before labels, notation, or receipts; repeated occurrences must be mined into durable profile/behavior updates.
      - Before answering a high-friction or behavior-repair turn, infer what Thomas is trying to see and answer from that thought-shape. A reply that sounds like a memo, taxonomy, compliance receipt, or assistant process note must be compressed before sending.
      - For MPP PDF quality failures, treat the PDF as one reader-facing proof artifact before local prose work. Judge the opening promise, reader route, proof arguments, theorem closure, teaching burden, and fragmentation/bluff risk first; local edits such as H^s wording, opening-page prose, appendix labels, build gates, or status sync only count when they serve that whole argument.
      - Criticism-inventory custody rule: a PDF criticism list is evidence for the next writing pass, not a Codex-owned work order. Do not promote criticisms into broad targets such as rewrite the opening, demote hinges, quarantine appendices, replace the proof grammar, separate branches, or impose a new spine unless each action is licensed by exact page evidence and Thomas's stated paper intent. Vague spans such as `the opening` are forbidden unless the exact object is named: title page, abstract, introduction, section opening, paragraph, sentence, or displayed formula. Choice verbs such as `resolve or demote` are forbidden when Codex has not identified the correct object and why. The default treatment of appendix material is expansion and mathematical payment into the MPP proof, not quarantine, deletion, or demotion; any structural reduction requires explicit user authorization or exact manuscript evidence that the material is outside the intended paper. Choose the next edit from a concrete page defect, preserve the working proof shape already on the page, and make the smallest honest improvement that helps the PDF carry the proof. Removing machinery voice is a safe target when it preserves the math and reader route.
