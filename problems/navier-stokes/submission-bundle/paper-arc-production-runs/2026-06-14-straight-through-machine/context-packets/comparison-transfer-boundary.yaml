    \section{Comparison and Transfer Boundary}

    The Navier--Stokes class proof is a same-solution Navier--Stokes proof.  Euler comparison enters through a typed boundary use.  For the same selected packet, Pack remains readable in the shared flux-volume sense, the fixed-viscosity Part or Field requirement fails through loss of viscous participation or one-field coherence, and the inviscid momentum-pressure law remains readable.  Then the fail branch has a concrete Euler boundary reading as well as its Navier--Stokes face decision.

    \begin{proposition}[Euler boundary comparison role]
    Let \(C\) be a comparison branch.  It enters the present Navier--Stokes class proof only through a theorem of the form
    \[
    \begin{aligned}
    C &\Longrightarrow
    \text{a selected packet }Q\\
      &\Longrightarrow
    \text{a Pack, Part, or Field decision for }Q
    \end{aligned}
    \]
    In the clean loss-of-viscosity case, the same theorem also reads the escaped packet as
    \[
      \mathrm{EVol}_Q+\mathrm{EMom}_Q.
    \]
    That theorem is the point where comparison pressure becomes Navier--Stokes proof material.  Smooth Euler to smooth Navier--Stokes remains a separate support bridge.  It can reassure the smooth side of the boundary while the class-exit mechanism stays with the selected Navier--Stokes packet and its typed face.
    \end{proposition}

    \begin{proof}
    The working class object \(\Owork\) is built from the original Navier--Stokes datum, pressure, viscosity, and same-fluid participation.  Comparison branches may share shapes with Navier--Stokes branches.  The class proof first needs the exact same-solution packet and its first failed face.  The Euler reading is added only after that packet has kept the shared inviscid flux-momentum law while losing the fixed-viscosity participation or one-field requirement.  The selected packet and typed face are what let comparison enter \(\Owork\); comparison outside them remains support.
    \end{proof}

    The smooth fixed-\(\nu\) bridge has a separate status.
    It asks for the scenario-inclusion theorem
    \[
      \mathrm{EulerSmooth}(u_0,[0,T])
      \Longrightarrow
      \mathrm{NSSmooth}_\nu(u_0,[0,T])
      \qquad(\nu>0\ \hbox{fixed}),
    \]
    with the same datum and the same time interval.
    The installed reductions give the usual \(H^s\), \(s>5/2\), continuation criterion and the relative equation for \(w=u^\nu-u^E\).
    They leave the needed relative \(H^s\) or tower bound open:
    \[
      \sup_{0\le t<T}\|u^\nu(t)-u^E(t)\|_{H^s}<\infty.
    \]
    In this manuscript that bridge is smooth-side support.
    It explains a comparison boundary, while the fixed-viscosity terminal Navier--Stokes record is still decided by Pack, Part, and Field.
