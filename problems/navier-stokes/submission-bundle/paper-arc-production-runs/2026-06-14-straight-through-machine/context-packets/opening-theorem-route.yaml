    \section{Current Main Result and Proof Roadmap}

    The result proved in this manuscript is a same-solution terminal classification theorem after admission.  It states what the proof can certify once a proposed finite Clay terminal claim has selected a terminal record \(Q\) for the original Navier--Stokes branch and once that record has entered the CM terminal test.  At that point the selected record is on one of two sides:
    \[
      \Member(Q;\Owork)
      \qquad\hbox{or}\qquad
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The member side is the continuation side.  The exit side is witnessed by the first failed face in the Part/Field tree.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch, and suppose \(Q\) is admitted as a same-solution terminal witness.  Then the CM terminal test has the following alternatives.  Either \(Q\) retains the class-membership data needed for the continuation side, written
    \[
      \Member(Q;\Owork),
    \]
    or the first failed witness face gives
    \[
      Field-window evidence outside CM,
      \qquad
      \neg\Part_{N,Q},
      \qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the second case \(Q\) supports
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Hence one admitted same-solution terminal record cannot be both the member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The admission clause is essential.  The CM test classifies the terminal object of the original equation.  The selected record must carry the same datum, same velocity-pressure branch, same fixed viscosity, same pressure law, same incompressibility constraint, and same terminal role.  A comparison packet, branch diagram, support estimate, or limiting profile helps after it is tied back to that same branch.

    The proof route has four tasks.  It fixes the exact Navier--Stokes object under test.  It derives what the direct estimates control and where the present forward accounting stops.  It checks whether a surviving obstruction is still a same-solution terminal record.  It identifies the first failed witness face when an admitted survivor cannot remain on the continuation side.

    The annular endpoint witness is the first place where these tasks meet.  A radius-zero point is too small to carry the Clay breakdown claim by itself.  The claim is carried by surrounding positive-radius fields as their radii shrink toward \(0\).  The direct annular theorem still needed is scale-uniform control of the remaining source on every same-solution terminal annular schedule.  The specific residual annular case is sorted in proof-program order: direct pass, exact terminal time-face pulse obstruction, no-admission support or Pack boundary on the governing record, readout-complete admitted Member branch, or readout-complete admitted Part/Field exit.

    The proof state used in this opening is deliberately narrow.  The forward cone, funnel, derivative-tower, and active-square calculations reduce the live direct question to source-balanced annular control.  They do not prove a raw volume-drain, cone-surface, or energy-only closure.  The theorem still missing on the direct side is the terminal time-face source obstruction: the proof still needs a theorem excluding a finite-mass heat-window source pulse, or an equivalent new-production theorem for the same terminal source atom.  The contrapositive counterpart begins only after a surviving positive-radius annular residue has been admitted as the same-solution terminal record with the continuation-readout bridge paid.  At that point the Pack question has already been answered by selection and carrier admission, so a finite nonsmooth readout-complete admitted residue must leave through Part or Field, while a record retaining Part and continuation-readout Field is on the member-continuation side.

    The rest of the paper follows this order.  The opening sections derive the forward obstruction from the energy and enstrophy identities and then refine it into the annular residual refill problem.  The CM sections define membership, Part and Field.  The branch sections explain which support objects contribute to the proof, which are obsolete, and which remain open.  The appendices are used where they help the reader see a proof contribution, obstruction, support role, or explicit continuation question.

