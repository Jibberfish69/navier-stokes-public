  - boilerplate that presents the work as only a status snapshot
  - internal automation or progress-report voice
  - unfilled prose
  - unsupported theorem claim hidden as narrative confidence
  required_patterns: *1
  source_material_rule: every repo note, section, obstruction, and support item in
    the packet must be turned into prose, proof argument, endpoint status, or a sourced
    exclusion
  integration_path: verify_author_pack -> integrate_author_pack -> targeted changed-section
    build
mechanical_verifier:
  forbidden_prose_patterns:
  - This paper is a current-state
  - CMI-facing account
  - live gold boundary
  - source-spine
  - rewrite pack
  - status ledger
  - worker
  - runner
  - "\\btherefore\\b"
  - "\\\\over\\b"
  - "<<FILL"
  - "\\bTODO\\b"
  - "\\bTBD\\b"
  - placeholder
  minimum_replacement_chars: 600
  math_reader_critic_required:
  - claim_truth_attack
  - reader_thread_attack
  - open_derivation_attack
  - repair_decision
  must_emit: ready author pack with replace_section rewrites, not notes or reports
