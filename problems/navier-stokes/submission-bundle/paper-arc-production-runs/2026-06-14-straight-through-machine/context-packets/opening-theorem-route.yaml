    \section{Original Problem Statement}

    The Clay Navier--Stokes problem asks whether a smooth divergence-free velocity field can lose smoothness in finite time under the three-dimensional incompressible Navier--Stokes evolution.  The unknowns are the velocity \(u(x,t)\) and pressure \(p(x,t)\).  In the periodic case, and in the whole-space case with smooth rapidly decaying data, they solve
    \[
      \partial_t u+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(\cdot,0)=u_0,
    \]
    with fixed viscosity \(\nu>0\) and no forcing.  The datum \(u_0\) is smooth and divergence-free.  The pressure is tied to \(u\) by incompressibility.  Equivalently, it is recovered by the elliptic pressure law that removes the gradient part of the nonlinear term.

    A proposed finite-time counterexample is a claim about one branch of this equation.  It starts from \(u_0\), follows the classical Navier--Stokes solution on a maximal interval \([0,T_*)\), and asserts that the usual continuation readout fails at \(T_*<\infty\).  This paper keeps that branch fixed.  The velocity, pressure, viscosity, pressure law, incompressibility constraint, and preterminal smooth solution all remain attached to the terminal object being tested.

    The proof has two certification layers.  Gold means the direct route: control the original solution strongly enough to continue it.  A completed gold proof is the strongest certificate because the same solution never leaves the continuation argument.

    Silver means the class-membership contrapositive route.  It begins after the forward work has left a precise terminal obstruction.  The question then changes from ``can the estimate be strengthened?'' to ``is the selected terminal record still a same-solution Navier--Stokes object?''  The class-membership test asks for three pieces of data.  Pack is the positive same-fluid carrier or packet.  Part is participation in the same pressure-viscosity-incompressibility law.  Field is one coherent positive-scale velocity-field readout.

    A terminal singularity claim includes more than the point \((x_*,T_*)\).  The claim is carried by positive-radius fields that shrink toward that point.  Those surrounding fields form the annular witness.  Gold would close the annular witness by controlling the remaining nonlinear source on every same-solution terminal annular schedule.  Silver can classify that same boundary only after a surviving annular residue has been selected as the same-solution terminal record with the continuation-readout bridge paid.  After that readout-complete admission, carrier is already established for the annular test, so a finite nonsmooth readout-complete admitted residue must leave the class through Part or Field.

