    \section{Proof Roadmap}

    The proof begins by fixing the object under test.  A finite terminal claim must select the terminal record of the same Navier--Stokes branch: same datum, same equation, same pressure law, same viscosity, same incompressibility constraint, and same preterminal smooth solution.  After that admission, the paper asks whether the selected record is a member record or an exit record.

    The first route is gold.  The energy identity controls kinetic energy and integrated enstrophy.  The enstrophy identity exposes the nonlinear source term
    \[
      \int (u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    The calculation in the opening section gives the local inequality \(Y'(t)\le C_\nu Y(t)^3\).  That inequality gives local control and leaves finite-time growth possible.  The annular and funnel work sharpens this into the residual source-refill question on shrinking positive-radius windows near a proposed endpoint.

    The second route is silver.  If a residual terminal obstruction survives the forward accounting, the paper tests the selected record \(Q\).  A retained record must carry
    \[
      \Pack_Q,\qquad
      \Part_{N,Q},\qquad
      \Field_{N,r,Q}
    \]
    to the continuation readout.  A failed record is exhausted in Pack-before-Part audited order:
    \[
      Field-window evidence outside CM,\qquad
      \neg\Part_{N,Q},\qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    The first failed face supports \(\Exit(Q;\Owork):=\neg\Member(Q;\Owork)\).

    The annular endpoint witness is the marked boundary of the present manuscript.  The radius-zero point is too small to carry the singularity claim by itself; the claim is carried by fields on shrinking positive-radius annuli.  Gold may close the boundary by proving scale-uniform annular control.  Silver may close it by admitting the surviving annular residue as the same-solution terminal record and landing Part or Field.  Until one of those arguments is written, the paper keeps the boundary visible.

    Two downstream support families are kept out of the opening claim.  The lower-carrier interval-integrability work belongs to the later receiver/source analysis, where a moving collar has to be shown to carry enough integrability for the retained window.  The strong-defect bridge work belongs to the later geometric-defect analysis, where a surviving defect has to be connected to a lawful Pack, Part, or Field role.  In the opening these families serve only as reminders that the annular boundary is not the whole proof topology.  They do not change the theorem stated above, and they do not convert the open gold annular supplier into a completed positive proof.

    The remaining sections follow this order.  They define the CM membership object, state the Part/Field witness laws, prove the class-law implication from face failure to exit, and then read the branch material as proof argument, support, obstruction, obsolete material, or open continuation.  The reader should always be able to tell which object is under test and which proof role the current paragraph is paying.
