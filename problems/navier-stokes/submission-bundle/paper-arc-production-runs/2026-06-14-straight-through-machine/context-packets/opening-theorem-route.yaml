    \section{Main Result}

    The main theorem is a same-solution terminal classification theorem after admission.  It keeps the annular boundary visible because the stronger gold annular supplier remains open.  The specific residual annular case is sorted as follows: gold pass, exact terminal time-face pulse obstruction, no-admission support or Pack boundary on the governing record, readout-complete admitted Member branch, or readout-complete admitted Part/Field exit.

    \begin{theorem}[Same-solution terminal classification with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\).  Suppose a finite terminal claim selects a terminal record \(Q\) for that same branch.  If \(Q\) is admitted as a same-solution terminal witness, then either
    \[
      \Member(Q;\Owork)
    \]
    or the first failed CM witness face gives
    \[
      Field-window evidence outside CM,
      \qquad
      \neg\Part_{N,Q},
      \qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    In the failed-face cases,
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    Thus one admitted same-solution terminal record cannot be both a member-continuation record and the same finite nonsmooth terminal witness.
    \end{theorem}

    The theorem is a classification theorem after admission.  Admission is the step that ties the object to the original Navier--Stokes branch.  It requires the same datum, same velocity-pressure solution, same fixed viscosity, same pressure law, same incompressibility constraint, and same terminal role.  Without that tie, the paper has only a comparison object or a diagnostic pattern, not the terminal record being classified.

    The annular boundary explains the present Clay-facing status.  A proposed terminal point \((x_*,T_*)\) is only the tip.  The singularity claim is carried by positive-radius fields shrinking toward that tip.  Gold would close this boundary directly by proving scale-uniform control of the residual annular refill.  The narrowed obstruction is terminal Zeno source-refill: same-solution source mass may concentrate along shrinking heat-time windows even while the physical energy remains finite.  In the residual currency, a source pulse on a heat window of length \(2^{-2j}\) has summable physical mass while \(D_j^{\mathrm{res}}\) stays bounded below.

    The exact gold child left by that pulse is \(\mathrm{TerminalTimeFaceAntiAtom.A}\), or the same-content new-production theorem \(\mathrm{TerminalNewProductionTheorem}_{B_{\mathrm{ASAC}}}\mathrm{.A}\).  The audited entrances are temporal thickness or super-\(L^1_s\) source integrability; selected-source domination by a finite same-window reserve plus a terminal strip modulus; transported no-incoming flux together with terminal-face source-production exclusion; first-appearance upgraded into a time-priced ledger, source integrability, or a rigid no-atom subclass; and production of \(B_{\mathrm{ASAC}}\) into \(B_{\mathrm{ASAC}}^{TA}\).  Without one of those exact inputs, the terminal layer \(g_m(s)=(a/\tau_m)1_{(-\tau_m,0]}(s)\) remains compatible with finite \(L^1_s\) source mass.

    Silver pays the same boundary after the surviving annular residue has been selected as the same-solution terminal record and the continuation-readout bridge has been paid.  Once it is admitted in that way, Pack is not the remaining landing for the annular test; carrier and selection have already been paid.  A nonsmooth readout-complete admitted annular witness must then fail by Part or by Field.  If Part and the continuation-readout Field survive with the \(H^s\), \(s>5/2\), bound, the dyadic source production forces \(D_j^{\mathrm{res}}\to0\), so the record is on the member side and cannot be the selected nonzero pulse.

    The proof skeleton is short.  First, a finite terminal claim supplies either the usual \(H^s\), \(s>5/2\), restart readout or a selected terminal record \(Q\) for the same branch.  Second, the selected record enters the CM participation-field tree only when the same-solution admission data are present.  Third, retained Part and Field feed the member-continuation side only through the selected continuation consumer.  Fourth, a finite nonsmooth terminal branch loses its first required face and supports \(\Exit(Q;\Owork)\).  The annular section applies that skeleton conditionally to the residual heat-scale pulse: finite physical source mass leaves the named terminal time-face child unpaid, while a readout-complete admitted nonzero pulse cannot retain both Part and continuation-readout Field.
