  text: |
    \section{The Same-Solution CM Proof}

    The closing proof has one same-object rule.
    Every terminal alternative must remain an alternative for the original Navier--Stokes branch.
    A large norm, weak limit, annular residue, exterior survivor, or transported atlas is only candidate evidence until it is tied back to the same datum, the same equation, the same pressure law, the same viscosity, the same preterminal ancestry, and the same terminal role.
    The CM test is applied to that tied-back record.

    \begin{proposition}[Terminal record entry from the finite Clay negation]
    Fix \(s>5/2\), a smooth divergence-free datum \(u_0\), viscosity \(\nu>0\), and the maximal classical branch
    \[
      u:[0,T_*)\to H^s
    \]
    generated by that datum.
    A finite terminal claim for this branch has only two same-branch readings.
    Either the \(H^s\) endpoint readout remains strong enough to restart \(u\) past \(T_*\), or the claim must select a terminal record \(Q\) extracted from the same branch and carrying the same datum, equation, pressure law, viscosity, preterminal ancestry, and terminal role.
    An obstruction outside those two readings belongs outside the finite-time breakdown claim for the original Clay solution.
    \end{proposition}

    \begin{proof}
    The Clay claim concerns the solution generated by \(u_0\).
    For each \(T<T_*\), this solution is smooth and solves the original Navier--Stokes system with the same pressure and viscosity.
    If
    \[
      \sup_{0<t<T_*}\|u(t)\|_{H^s}<\infty ,
    \]
    the local \(H^s\) theory gives a lifespan depending only on that bound.
    Restarting from times \(t_n\uparrow T_*\) then produces a classical continuation past \(T_*\), and uniqueness glues it to the original branch.
    Thus a genuine finite terminal claim has to locate the failed endpoint readout on the same branch.
    The terminal record \(Q\) is the record of that failure: the selected material packet or its loss, the same-equation participation information or its loss, and the field readout information or its loss, all inherited from \(u\).
    \end{proof}

    After terminal entry, the proof performs one ordered test on the selected record:
    \[
      \text{finite terminal claim}
      \Longrightarrow
      \begin{cases}
      \text{\(H^s\) readout and same-solution restart,}\\
      \text{same-solution terminal record \(Q\) admitted to the CM test.}
      \end{cases}
    \]
    Once \(Q\) is admitted, the CM test reads the record in the order
    \[
      \Pack_Q,\qquad \Part_{N,Q},\qquad \Field_{N,r,Q}.
    \]
    Survival through the three requirements feeds the member-side readout for the same solution.
    The first failed requirement supports class exit:
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]

    \begin{theorem}[Same-solution CM dichotomy]
    Let \(Q\) be the canonical terminal record selected by a finite terminal claim for the original Navier--Stokes solution, and suppose \(Q\) has been admitted as the same-solution record under test.
    Inside the CM test, \(Q\) has exactly two readings:
    \[
      \Member(Q;\Owork)
      \quad\hbox{or}\quad
      \Exit(Q;\Owork).
    \]
    The member reading gives the same-solution readout chain up to the selected continuation consumer.
    The exit reading is supported by the first failed witness face:
    \[
      \neg\Pack_Q,\qquad
      \Pack_Q\wedge\neg\Part_{N,Q},\qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    \end{theorem}

    \begin{proof}
    The terminal record entry proposition gives the same-branch reduction.
    The restart-readout case continues the same solution.
    In the remaining case, the finite terminal claim supplies the terminal record \(Q\) from the original branch.
    Membership in \(\Owork\) requires a positive same-fluid carrier, same-equation pressure-viscosity participation, and positive-scale field readout on that same record.
    When those requirements survive at the continuation depth, the member-side readout chain feeds the continuation criterion selected for that branch.
    For the classical Sobolev endpoint, the local \(H^s\) theorem restarts the same solution beyond \(T_*\).
    When the record loses a requirement, the ordered test stops at the first lost face.
    Loss of the carrier gives \(\neg\Pack_Q\).
    Carrier without same-equation participation gives \(\Pack_Q\wedge\neg\Part_{N,Q}\).
    Carrier and participation without any positive-scale coherent field readout gives
    \[
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    Each first face failure supports \(\Exit(Q;\Owork)\).
    The same admitted terminal record has no third CM reading.
    \end{proof}

    \begin{corollary}[No same-record third branch]
    An admitted same-solution terminal record cannot both remain on the member-continuation side and carry a first Pack, Part, or Field face failure.
    \end{corollary}

    \begin{proof}
    The member branch retains the three witness requirements and feeds the selected continuation consumer for the same solution.
    A first face failure is exactly the failure of one of those witness requirements on the same record.
    The same record cannot simultaneously retain a requirement and lose it as its first failed face.
    \end{proof}

    This theorem is a classification theorem after terminal-record admission.
    The separate public Clay bridge is the no-genuine-exit bridge from original smooth data to the absence of a genuine first Pack, Part, or Field face at finite time.

    The remaining bridge can be seen at the terminal Pack face.  Smoothness on every fixed slab \([0,T_*-\varepsilon]\) gives a same-solution packet before terminal time, but it does not give a uniform positive terminal carrier as \(\varepsilon\downarrow0\).  A terminal Pack loss can appear only in the limiting record unless the proof supplies a uniform terminal Pack persistence theorem.  Source time-thickness has the same shape.  Finite \(L^1_t\) terminal source mass is compatible with concentration at the terminal face; for instance \(g_m(s)=m\mathbf 1_{(-1/m,0]}(s)\) has bounded mass and still collapses to terminal time.  Thus the classification theorem leaves one honest remaining alternative.  A public Clay close needs a theorem ruling out a genuine first Pack, Part, or Field loss from original smooth data.  Without that theorem, each admitted terminal record stays inside the silver CM classification and the paper names the first face it loses.

    The branch sections pay into this theorem by selecting the record and identifying the face.
    The periodic branch selects the transported whole-torus atlas and reads non-continuation through that atlas.
    The whole-space branch selects the exterior Duhamel survivor after the initial heat tail and fixed compact-core far-field source have been removed.
    The annular endpoint branch is the active place where gold and silver separate.
    Gold would continue the original solution by controlling the residual refill on every same-solution terminal annular schedule.
    Silver receives a surviving annular residue only after it has been selected as the same-solution terminal record.
    At the current proof state, the stronger annular gold supplier remains open unless \(\mathrm{TerminalTimeFaceAntiAtom.A}\), \(\mathrm{TerminalNewProductionTheorem}_{B_{\mathrm{ASAC}}}\mathrm{.A}\), or an equivalent terminal time-face production theorem is proved.
    The admitted silver record is still classifiable: it is a member branch when the continuation readout survives, and it is a Part or Field exit when same-equation participation or positive-scale field readout is the first failed face.
