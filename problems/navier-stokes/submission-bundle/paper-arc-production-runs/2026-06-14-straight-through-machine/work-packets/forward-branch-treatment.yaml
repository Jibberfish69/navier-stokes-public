  text: |
    \section{Branch Coverage in the Main Proof}

    The branch sections now have one manuscript job.  They show where the accumulated mathematical material enters the same-solution proof, and they keep unsupported estimates outside the proof spine until the estimate names a terminal record and a face.

    \begin{proposition}[Branch obligations enter by first lost requirement]
    Let \(B\) be a non-Euler same-solution branch from source reserve, donor refill, zero-radius refinement, retained amplitude, low strain, height flux, signed current, square reserve, endpoint readout, no-pulse, local critical translation, or comparison.  The branch is proof-bearing exactly when it identifies the same terminal witness record and proves one of the following outcomes:
    \[
      \neg\Pack_Q,\qquad
      \Pack_Q\wedge\neg\Part_{N,Q},\qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q},
    \]
    or when it supplies the member-side continuation readout for that same record.  A branch still awaiting that witness record remains support, diagnostic pressure, readout pressure, or comparison pressure.
    \end{proposition}

    \begin{proof}
    The class object has three witness requirements and one member-side readout consequence.  A branch family can explain which requirement a familiar mechanism attacks.  It enters the proof only through a same-witness Pack, Part, or Field face, or through a same-witness continuation readout after the requirements survive.  Source-reserve, signed-current, no-pulse, endpoint, local-critical, whole-space, and comparison material all enter through that rule.
    \end{proof}

    \begin{corollary}[Coverage gives admissible proof roles]
    The coverage section records admissible proof roles.  Each row is a selected-record payment, a member-side readout payment, or support awaiting a named face theorem.
    \end{corollary}

    \begin{proof}
    The preceding proposition exhausts the branch roles used by the manuscript.  A row with a selected record and a first face is proof material.  A row with a selected record and continuation readout is pass-side proof material.  A row awaiting both payments remains support.
    \end{proof}
