    \section{How to Read the Appendices}

    The appendices collect supporting calculations, failed direct estimates, and branch-local reductions.  Each appendix entry receives a limited proof status: it either supplies a Pack, Part, Field, or member-side readout payment for a selected terminal record, or it remains support, obstruction evidence, obsolete direct work, or a scope boundary.

    Those calculations are evidence for the theorem above.  When an appendix calculation says that a source-control theorem, no-pulse route, critical-norm route, or direct exterior \(H^s\) estimate failed to close, it records the failure of that direct estimate.  The calculation becomes an input to the proof only when the main body cites it as a selected-record face payment or readout payment.

    The main-body theorem is the same-solution CM dichotomy together with the named surface payments.  A member branch gives continuation through its selected readout.  A failed branch gives class exit through the first failed Pack, Part, or Field face on the selected record.  The appendix keeps every unfinished or obsolete direct route visible and keeps that material from replacing the proof spine.

