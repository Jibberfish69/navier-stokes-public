  text: |
    \section{How Auxiliary Estimates Enter}

    An auxiliary estimate enters the proof after it names the selected terminal record and pays one of the closing hinges:
    \[
      \text{terminal record }Q
      \Longrightarrow
      \text{CM-test entry}
      \Longrightarrow
      \neg\Pack_Q
      \vee
      \neg\Part_{N,Q}
      \vee
      \forall r>0\,\neg\Field_{N,r,Q},
    \]
    or after it supplies the member-side readout chain up to the continuation consumer selected for that same record.  Support material can explain why a branch was considered.  It becomes proof material when it selects the record and pays the face or readout.

    This rule is the paper's protection against proof-attempt churn.  A failed direct estimate stays in the appendix as support, obstruction, or scope boundary.  It moves into the main proof only when the manuscript can say which same-solution object it selects and which Pack, Part, Field, or readout payment it supplies.

