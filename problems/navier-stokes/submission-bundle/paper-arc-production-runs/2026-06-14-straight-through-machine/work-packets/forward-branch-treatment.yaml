  text: |
    \section{Which Branches Still Matter}

    The preceding family analysis has one purpose: it prevents branch families from becoming a second proof spine.  Every family enters through one question.  Which same-solution terminal record is selected, and which requirement is paid or lost first?

    \begin{proposition}[Branch-family support exhaustion]
    Every non-Euler Navier--Stokes branch family used by the working class-membership program has one of the following support roles:
    \[
    \begin{array}{l}
    \neg\Pack_Q,\\
    \Pack_Q\wedge\neg\Part_{N,Q},\\
    \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q},\\
    \text{member-side continuation readout},\\
    \text{finite typed disjunction},\\
    \text{support awaiting a named face theorem.}
    \end{array}
    \]
    \end{proposition}

    \begin{proof}
    Read the families by their selected terminal object.  Source-control and donor-refill branches select terminal source ancestry or reserve.  Detached or unpaid ancestry without a positive same-fluid carrier is Pack-side.  Retained source residue with carrier and broken pressure-viscosity participation is Part-side.  Retained source residue that has passed Pack and Part becomes a Field or readout diagnostic.

    Zero-radius and terminal-atom branches select a point-object with no positive terminal carrier unless a retained positive-scale packet has first been supplied.  The point-object branch is a Pack face failure.  Retained Zeno and annular alternatives are finite typed subcases inside the same witness tree.

    Retained-amplitude, height-flux, low-strain, signed-current, and square-reserve branches select failures of gain, dwell, participation, source balance, or retained coherence.  Each such failure either breaks the carrier, breaks the same pressure-viscosity participation tower after the carrier survives, breaks positive-scale coherence after Pack and Part survive, or remains a positive supplier theorem outside the class primitive.

    Good-scale, endpoint-readout, no-pulse, averaged, and terminal-tail branches read a packet that has already retained enough structure to be read.  They support Field and the continuation consequence.  They become proof material only when the exact packet has already entered Pack, Part, or Field.

    Local critical translators place local \(L^3\) or Duhamel mass back on the same witness record.  Their role is branch-local: native source work or Pack/Part/Field exit.

    Broad fixed-viscosity transfer and broad Euler mirror branches are comparison programs.  The Euler material admitted into this manuscript is narrower.  The same selected Navier--Stokes packet has retained the shared flux-momentum reading, has lost fixed-viscosity Part or Field participation, and is thereby readable as the base Euler boundary object.  Everything else remains support outside the proof body.

    These alternatives exhaust the branch families because every branch either supplies a selected same-solution terminal object or supplies context for such an object.  Selected terminal objects are exhausted by the same Pack/Part/Field terminal-capture theorem.  Context without a selected face remains support outside the proof spine.
    \end{proof}

    \begin{center}
    \small
    \begin{tabular}{L{0.25\linewidth}L{0.31\linewidth}L{0.34\linewidth}}
    \textbf{Branch family} & \textbf{Object it can select} & \textbf{Proof role in this manuscript}\\
    \hline
    Source reserve and donor refill & terminal source ancestry or residual refill & Pack first; Part after carrier survives; Field after Pack and Part\\
    Zeno, terminal atoms, and annular limit & point-object or shrinking annular witness & point-object Pack failure; admitted annular witness returns to Part or Field payment\\
    Retained amplitude and low strain & terminal amplitude, dwell, or height-flux branch & finite routing through Pack, Part, Field, or Zeno\\
    Signed current and no-free-sink & source-current or donor-balance record & support until it proves a same-record face or readout\\
    Square reserve and native trilinear control & selected square-source reserve & auxiliary until the reserve lands in first-face order\\
    Endpoint readout and no-pulse & good-scale or read-cover packet & member-side readout after Pack, Part, and Field survive\\
    Local \(L^3\) translators & localized public-critical terminal mass & witness-record recovery before face testing\\
    Euler boundary comparison & same selected packet after fixed-viscosity loss & boundary reading after the Navier--Stokes face is typed\\
    \end{tabular}
    \end{center}
