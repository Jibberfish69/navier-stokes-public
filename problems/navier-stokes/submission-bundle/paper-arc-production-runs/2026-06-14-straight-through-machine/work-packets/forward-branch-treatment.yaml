    \section{How Forward Support Enters the Proof}

    This appendix records how forward-positive material enters the proof after the CM test has been fixed.  The repeated source files contain many local estimates and route probes.  The paper does not ask the reader to remember those file names.  It groups them by the kind of mathematical work they can pay.

    There are four support families:
    \begin{description}[leftmargin=0.26\linewidth,style=nextline]
    \item[Comparison support.]
    Explains a nearby boundary object and then returns to the Navier--Stokes record.
    \item[Export or legacy support.]
    Preserves a result whose force is spent only through a named proof hinge.
    \item[Forward supplier support.]
    Pays source, carrier, participation, or readout costs for the selected branch.
    \item[Receiver or endpoint support.]
    Reads the selected packet after Pack and Part have already survived.
    \end{description}
    Each family becomes proof material at the point where it selects \(Q\), proves a face, or supplies the member-side readout.  Before that point, it is useful support and the proof says so plainly.

    \subsection{Comparison support}

    Comparison support is the material that shows why an obstruction shape is natural by placing it beside a neighboring equation or a downstream export.  Its admissible use is narrow.  A comparison may help identify a candidate packet, reveal a boundary behavior, or warn the reader that a route has changed equation class.  The class proof then returns to the same Navier--Stokes record:
    \[
      Q_{\mathrm{NS}}
      \longrightarrow
      \Pack_{Q_{\mathrm{NS}}},\quad
      \Part_{N,Q_{\mathrm{NS}}},\quad
      \Field_{N,r,Q_{\mathrm{NS}}}.
    \]
    The comparison object carries no separate membership conclusion.  Its value is spent when the Navier--Stokes packet has been selected and the exact face or readout paid on that packet.

    \subsection{Export and legacy support}

    Export and legacy support preserves results that were produced for another surface of the project.  The current manuscript uses them through named hinges only:
    \[
    \text{terminal packet capture},\qquad
    \text{membership readout},\qquad
    \text{class exit},\qquad
    \text{no-third-branch exclusion}.
    \]
    A legacy theorem that pays one of these hinges keeps its force.  A legacy theorem that only repeats a route label stays outside the terminal proof claim.  This rule protects the paper from treating an old status word as a theorem.

    \subsection{Forward supplier support}

    Forward supplier support is the gold-side material.  It tries to pay the equation estimates directly: source reserve, donor refill, pressure residue, active-square production, terminal anti-atom control, annular residual load, shell gain, and high-frequency tail control.  When a supplier estimate succeeds, it can strengthen the member branch by producing a continuation readout.  When it reaches a precise obstruction, it can select the fail-side record consumed by the CM test.

    The current live example is the annular supplier.  Gold asks for scale-uniform control of the residual load on every shrinking annular schedule.  The installed material has not written that gold estimate as a closed theorem.  The exact child left by the terminal pulse is \(\mathrm{TerminalTimeFaceAntiAtom.A}\), or the same-content new-production theorem \(\mathrm{TerminalNewProductionTheorem}_{B_{\mathrm{ASAC}}}\mathrm{.A}\).  Its checked entrances are temporal thickness or super-\(L^1_s\) source integrability; selected-source domination by a finite same-window reserve plus a terminal strip modulus; transported no-incoming flux together with terminal-face source-production exclusion; first-appearance upgraded into a time-priced ledger, source integrability, or a rigid no-atom subclass; and production of \(B_{\mathrm{ASAC}}\) into \(B_{\mathrm{ASAC}}^{TA}\).  The specific residual annular case is still exhausted: a gold pass removes the residual obstruction; the exact terminal time-face pulse explains why current inputs do not prove gold; a non-admitted diagnostic stays support-only or returns to the governing Pack boundary; and an admitted finite nonsmooth annular witness exits through Part or Field.

    \subsection{Receiver and endpoint support}

    Receiver and endpoint support reads what remains after the object and law have survived.  On the pass side it supplies a continuation norm, such as the \(H^s\), \(s>5/2\), readout used in the main body.  On the fail side it supplies the Field alternative:
    \[
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    This is why endpoint work belongs after the carrier and participation checks.  A good endpoint readout certifies the member branch.  A failed endpoint readout, after the same carrier and same participation law are still present, identifies the Field face.
  truncated: false
