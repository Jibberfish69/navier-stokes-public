  text: |
    \section{The Support Boundary}

    Strong estimates do real work outside the class faces.  A source-control estimate can protect a packet.  A no-pulse estimate can protect a readout.  A signed-current estimate can locate a source obstruction.  A comparison estimate can explain why a neighboring theorem world behaves differently.  The class proof uses these estimates by asking what requirement they protect.

    \begin{proposition}[Support enters through a face]
    Let \(S\) be a source, readout, comparison, or supplier statement.  The statement becomes a class-proof conclusion only when it lands a selected same-solution object in one of the proof positions
    \[
    \begin{array}{l}
    \Pack_Q,\quad \Part_{N,Q},\quad \Field_{N,r,Q},\\
    \text{member-side continuation readout},\\
    \text{terminal packet capture},\\
    \text{or proof that no genuine finite exit object was selected.}
    \end{array}
    \]
    Until that landing is supplied, \(S\) serves the class proof as support.
    \end{proposition}

    \begin{proof}
    The class proof has three witness requirements and a small number of closing hinges.  A supplier estimate can help prove one of them.  A readout estimate can explain the continuation consequence after the requirements survive.  A comparison estimate can explain a boundary case.  The statement enters the proof when its exact target is a class requirement or closing hinge.
    \end{proof}

    \begin{corollary}[Forward-positive estimates keep their value]
    Moving a direct estimate into support preserves its mathematical value.  It assigns the estimate a proof job:
    \[
    \begin{array}{l}
    \text{support Pack},\quad \text{support Part},\quad \text{support Field},\\
    \text{support member-side readout},\\
    \text{or support proof that no genuine finite exit object was selected.}
    \end{array}
    \]
    \end{corollary}

    \begin{proof}
    The estimate remains available exactly where it has mathematical force.  The class proof prevents the estimate from standing in for the class law by itself.  Once the estimate names a requirement or hinge, it can be used in the proof of that requirement or hinge.
    \end{proof}
