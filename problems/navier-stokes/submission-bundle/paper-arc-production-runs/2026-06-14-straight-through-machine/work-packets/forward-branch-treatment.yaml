    job: gather the assigned TeX, theorem notes, route locks, brain/app/node material,
      proof status, symbols, dependencies, and writing rules for one arc
  - name: Author Packet
    job: write final TeX prose for the whole arc, including plain explanation, derivation/proof
      payment, and endpoint status
  - name: Math Supplier
    job: serve the selected arc only by supplying TeX-ready derivations, exact obstructions,
      endpoint classifications, or CM counterparts
  - name: Verifier
    job: reject placeholder prose, machinery voice, missing source coverage, unpaid
      claims, unresolved critic findings, and route-identity drift before integration
  - name: Integrator
