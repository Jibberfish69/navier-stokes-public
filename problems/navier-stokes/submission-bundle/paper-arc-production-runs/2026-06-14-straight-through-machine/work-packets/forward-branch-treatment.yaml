  line_start: 1111
  line_end: 1249
  text: |
    \section{How Forward Branches Enter the Proof}

    The proof has fixed the class test, so the branch families now have a narrower job.  They do not become new proof spines.  Each family has to tell the reader how it enters the same selected terminal record \(Q\):
    \[
    \begin{array}{l}
    \text{it selects the same-solution terminal record,}\\
    \text{it supplies the member-side continuation readout for that record,}\\
    \text{it proves the first failed Pack, Part, or Field face,}\\
    \text{or it remains support until one of those jobs is paid.}
    \end{array}
    \]
    This rule keeps the direct-estimate material useful while preserving CM proof priority.  A branch note may explain a real obstruction, a real estimate, or a real route failure.  The manuscript spends that note only after it identifies the terminal record and the face or readout the note pays.

    The main records are already visible.  On the periodic surface, the selected terminal record is the transported whole-torus atlas \(Q_{\mathrm{atlas}}\).  On the whole-space surface, the selected record comes from the exterior Duhamel split and the dyadic survivor test.  At the annular endpoint, the selected record is the limiting same-solution behavior on shrinking positive-radius annuli.  Those annuli are live terminal witnesses until gold controls the residual load or silver admits the surviving residual obstruction and lands it in Part or Field.

    A forward estimate is proof material when it says something precise about that selected record: which carrier survives, which participation law is retained or lost, which positive-scale field readout is available, or which continuation readout follows.  It is support while that record or face is still unnamed.

    \subsection{Source Reserve And Donor Refill}

    Source reserve is the branch where a terminal packet tries to acquire fresh nonlinear source near \(T_*\).  The gold question is quantitative: can the same solution keep a positive residual refill on shrinking heat-time windows after heat descendants, legal through-flow, finite payments, and paid dissipation have been removed?  The silver question is class-theoretic: when that reserve is selected as the terminal record, which membership face does it keep or lose first?

    \begin{definition}[Source-reserve branch]
    A source-reserve branch is a selected terminal branch for which a positive source quantity \(R_N(W)\) survives on a terminal heat window \(W\) after legal losses and inherited parent mass are separated.  The branch is retained for the CM test only when the reserve is attached to the original solution branch and its terminal carrier has been identified.
    \end{definition}

    \begin{proposition}[Source-reserve routing]
    Every selected source-reserve branch is routed through the first face it can answer:
    \[
    \begin{array}{rcl}
    \neg\Pack_Q &:& \text{no same-fluid carrier},\\
    \Pack_Q\wedge\neg\Part_{N,Q} &:& \text{carrier without same participation},\\
    \Pack_Q\wedge\Part_{N,Q} &:& \text{remaining Field or continuation-readout question.}
    \end{array}
    \]
    \end{proposition}

    \begin{proof}
    A source reserve with no positive same-fluid carrier fails Pack.  A source reserve with a carrier and no same pressure-viscosity-incompressibility tower fails Part.  A source reserve with carrier and participation has reached the retained-packet level; its remaining obstruction is a Field or continuation-readout question.  The proof force comes from the selected witness record and first failed face, not from the source-reserve label.
    \end{proof}

    Reserve creation, terminal reserve first appearance, positive remainder depletion, source-weighted angular depletion, BASAC reverse Holder production, terminal source anti-concentration, and uniform temporal source integrability all ask the same question in different coordinates:
    \[
      \text{can positive terminal source reserve be born for free on the original branch?}
    \]
    For the manuscript, those notes are support until they attach to the selected same-solution record.  First-appearance wording is not enough by itself: the packet must inject into a finite time-priced ledger, satisfy a super-\(L^1_s\) or terminal-modulus estimate, produce a rigid no-atom subclass, or enter the CM test with a concrete Pack/Part/Field face failure.  Once the reserve is inherited, charged, depleted, or landed in a Pack, Part, or Field face, it becomes proof material for that record.

    \subsection{BASAC, Pressure, And Rigid Residue}

    BASAC and pressure-residue arguments search for a terminal source measure that is too rigid to be paid by the ordinary source balance.  The direct route tries to rule that object out directly.  The class route asks which membership requirement the selected residue can keep.

    \begin{definition}[Rigid pressure-source residue]
    A rigid pressure-source residue is a selected terminal object whose pressure/source contribution remains after transported boundary losses, parent ancestry, and paid finite terms have been removed.  It is terminally relevant only when it is attached to the same solution branch.
    \end{definition}

    \begin{lemma}[Rigid residue requirement test]
    A rigid pressure-source residue has no independent class face.  It is Pack-side when it lacks a positive carrier, Part-side when it loses pressure participation after a carrier survives, and Field-side only after the same carrier and same participation tower both survive.
    \end{lemma}

    \begin{proof}
    Rigidity describes how a residue behaves.  The class object asks a different question: the selected residue must answer Pack, then Part, then Field on the same terminal record.  Those answers determine its proof role.  The residue is spent only after that role is certified.
    \end{proof}

    Pressure-tail Hardy controls, transported boundary tightness, pure-pressure sustain reductions, time-face anti-atom arguments, and production into rigid subclasses all narrow the selecte
