    \section{Lower-Prefix and Upper-Tail Survivors}
    \label{sec:lower-prefix-upper-tail-branch}

    The scale-barrier branch leaves one specific lower-side bill.  The lifted
    high-side remainder contains an active shell \(j\), the shells below it, and
    the tail above it.  The lower shells are not harmless merely because their
    frequencies are smaller.  They can carry accumulated strain into the active
    shell.  The upper shells are not harmless merely because viscosity is
    stronger there.  They can be refilled at the same heat scale.  The branch
    below is the exact lower-prefix/upper-tail branch created by those two facts.

    Let \(u_j=\Delta_j u\).  The scale variables used here are
    \[
      E_j(t)=2^{2j}\|u_j(t)\|_{L^2_x}^2,
      \qquad
      D_j(t)=2^{4j}\|u_j(t)\|_{L^2_x}^2.
    \]
    Thus \(E_j\) is the \(H^1\)-size of the \(j\)-th shell, and \(D_j\) is the
    same shell measured at one more derivative.  If \(C_1\) is the fixed
    separation in the far-corona region, define the lower-prefix energy seen by
    shell \(j\) by
    \[
      \mathcal P_j^\downarrow(t)
      =
      \sum_{k\le j-C_1}E_k(t).
    \]
    This is the amount of lower-scale \(H^1\) content that can act on shell
    \(j\) after the far-corona ordering has been imposed.

    The reason this quantity enters is the cumulative-tail stress theorem.  In
    the continuum notation, the far-corona stress object is
    \[
      T_r(t)
      =
      \int_0^{r/c_1}
      \chi_{mid}(\log\ell)\,
      \tau_\ell^{H^1}[u](t)\,\frac{d\ell}{\ell},
    \]
    and the direct far-corona square is
    \[
      \mathrm{FCTS}
      =
      \int_0^T\int
      r^{-2}\|Q_r u(t)\|_{L^2_x}^2
      \|T_r(t)\|_{L^2_x}^2\,\frac{dr}{r}\,dt
    \]
    Cauchy--Schwarz in the \(\ell\)-integral reduces this to the cumulative-tail
    theorem
    \[
      \int_0^T\int_{\ell_{top}}^{\ell_{bot}}
      \left(
      \int_{c_1\ell}^{\ell_{hi}}
      r^{-2}\|Q_r u(t)\|_{L^2_x}^2\,\frac{dr}{r}
      \right)
      \|\tau_\ell^{H^1}[u](t)\|_{L^2_x}^2\,\frac{d\ell}{\ell}\,dt
      \le
      C_{CTS}\nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \tag{CTS}
    \]
    Dyadicizing \(r\ge c_1\ell\) turns the inner \(r\)-tail into the lower
    prefix \(\sum_{k\le j-C_1}E_k\).  The inherited Euclidean estimate for the
    stress square is
    \[
      \|\tau_j^{H^1}[u](t)\|_{L^2_x}^2
      \le
      C\,2^{-j}D_j(t)^2.
    \]
    Hence the direct route from \((\mathrm{CTS})\) asks for the dyadic estimate
    \[
      \int_0^T
      \sum_{j\ge N}
      \mathcal P_j^\downarrow(t)\,
      2^{-j}D_j(t)^2\,dt
      \le
      \nu\int_0^T D_N(t)\,dt+C_*2^{-2\delta N}.
      \tag{LPAS}
    \]
    This is the raw lower-prefix active-square theorem.  Its left side says that
    lower-scale \(H^1\) memory is being multiplied by the square of the active
    shell's derivative drain.

    The raw theorem is too strong.  The failure is visible on an exact smooth
    Navier--Stokes solution.  On the torus, take
    \[
      u(x,t)
      =
      \left[
        a e^{-\nu2^{2k}t}\sin(2^kx_2)
        +
        b e^{-\nu2^{2j}t}\sin(2^jx_2)
      \right]e_1,
      \qquad j\gg k
    \]
    This field is divergence-free, depends only on \(x_2\), and points in the
    \(e_1\)-direction.  Thus
    \[
      (u\cdot\nabla)u=u_1\partial_{x_1}u=0,
    \]
    so the solution is pure heat flow with constant pressure.  The high shell
    has no nonlinear source.  Yet the lower shell \(k\) contributes a fixed
    positive lower-prefix amount
    \[
      \mathcal P_j^\downarrow(t)\ge c_P2^{2k}a^2=:P_0
    \]
    on the high-shell heat window.  For the high shell there are cutoff constants
    \(0<c_D\le C_D<\infty\), fixed by the Littlewood-Paley convention, such that
    \[
      c_D2^{4j}b^2e^{-2\nu2^{2j}t}
      \le D_j(t)\le
      C_D2^{4j}b^2e^{-2\nu2^{2j}t}.
    \]
    The raw active-square cost has the lower bound
    \[
      \int_0^\infty
      P_0\,2^{-j}D_j(t)^2\,dt
      \ge
      \frac{P_0c_D^2}{4\nu}2^{5j}b^4,
    \]
    while the drain available on the right is only
    \[
      \nu\int_0^\infty D_j(t)\,dt
      \le
      \frac{C_D}{2}2^{2j}b^2.
    \]
    Their ratio grows like \(2^{3j}b^2\).  The heat-decaying shear violates the
    raw active-square bound while carrying no positive nonlinear refill.  Thus
    raw active-square size is not the dangerous object.

    The corrected object is the residual same-fluid refill.  The shell equation
    gives
    \[
      \partial_t u_j-\nu\Delta u_j
      =
      -\Delta_j\mathbb P\nabla\cdot(u\otimes u).
    \]
    In \(H^1\) shell currency,
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)
      \le
      \Phi_j^+(t),
      \tag{1}
    \]
    where
    \[
      \Phi_j(t)
      =
      -2^{2j}
      \left\langle
      \Delta_j\mathbb P\nabla\cdot(u\otimes u),u_j
      \right\rangle,
      \qquad
      \Phi_j^+(t)=\max\{\Phi_j(t),0\}.
    \]
    Solving \((1)\) from an entrance time \(t_0\) gives
    \[
      E_j(t)
      \le
      e^{-c_0\nu2^{2j}(t-t_0)}E_j(t_0)
      +
      C\int_{t_0}^t
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds
    \]
    The first term is heat inheritance.  The second term is nonlinear refill.
    Set
    \[
      R_j^{src,+}(t;t_0)
      =
      \int_{t_0}^t
      e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds,
      \qquad
      D_j^{res}(t;t_0)=2^{2j}R_j^{src,+}(t;t_0).
    \]
    For the exact shear solution above, \(\Phi_j=0\) and
    \(D_j^{res}=0\).  The residual ledger removes precisely the harmless heat
    mode that defeated the raw theorem.

    The gold-side theorem left by this branch is
    \[
      \int_0^T
      \sum_{j\ge N}
      \mathcal P_j^\downarrow(t)\,
      2^{-j}
      \bigl(D_j^{res}(t;t_0(j,t))\bigr)^2\,dt
      \le
      \varepsilon\nu\int_0^T D_N(t)\,dt
      +C_*2^{-2\delta N}.
      \tag{R-LPAS}
    \]
    Equivalently, one may prove the residual cumulative-tail or residual
    far-corona theorem.  The available source notes do not record this residual
    estimate as proved from the present finite-energy, local-energy, pressure,
    cutoff, transport, and first-moment inputs.  They record it as the honest
    forward support target for this branch.

    The Volterra formulation explains why this target is more than a renamed
    square estimate.  Write \(s=\log r\) and place the middle-band scale interval
    in \(I=[s_0,s_1]\).  With
    \[
      \widetilde Z(\sigma,t)=Z_{e^\sigma}(t)\in L^2_x,
      \qquad
      w(s,t)=a(e^s,t)
      =
      e^{-2s}\|Q_{e^s}u(t)\|_{L^2_x}^2,
    \]
    the one-sided scale primitive is the lower-triangular operator
