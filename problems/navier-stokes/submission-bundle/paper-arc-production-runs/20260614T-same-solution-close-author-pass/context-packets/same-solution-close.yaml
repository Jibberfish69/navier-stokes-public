    \section{The Same-Solution CM Proof}

    The proof now turns the preceding branch analysis into one same-solution argument.
    The order is terminal entry, same-object admission, Pack, Part, Field, member-side readout, and class exit.
    The alleged counterexample stays attached to the original solution at every step.
    Once an admitted terminal alternative has landed in a first failed face, it has entered the pass-or-exit dichotomy.

    \begin{proposition}[Terminal record entry from the finite Clay negation]
    Fix \(s>5/2\), a smooth divergence-free datum \(u_0\), viscosity \(\nu>0\), and the maximal classical branch
    \[
      u:[0,T_*)\to H^s
    \]
    generated by that datum.
    A finite terminal Clay claim for this branch has two same-branch forms.
    It supplies the \(H^s\) endpoint readout that restarts \(u\) past \(T_*\), or it supplies a terminal record \(Q\) extracted from the original branch, with the same datum, same equation, same pressure law, same viscosity, same preterminal fluid ancestry, and same terminal role.
    An alleged obstruction that supplies neither object has failed to state finite-time breakdown of the original Clay solution.
    \end{proposition}

    \begin{proof}
    The Clay claim concerns the solution generated by \(u_0\).
    For each \(T<T_*\), that solution is smooth, solves the original Navier--Stokes system, and carries its material history from the same datum.
    An \(H^s\), \(s>5/2\), endpoint readout at \(T_*\) triggers the local continuation theorem and restarts the branch.
    In the remaining case, the terminal claim has to say what prevents the restart while staying attached to the same branch.
    The record \(Q\) is that endpoint data: the selected material packet or its failure, the same-equation participation information or its failure, and the field readout information or its failure.
    \end{proof}

    The proof has five steps.
    First, the finite Clay negation is reduced to the same-branch alternative above: restart readout, or terminal record \(Q\).
    Second, \(Q\) is admitted to the CM packet tree, or the proposed obstruction is rejected as the wrong object for the original solution.
    Third, the admitted record is read in the order
    \[
      \Pack_Q,\qquad \Part_{N,Q},\qquad \Field_{N,r,Q}.
    \]
    Fourth, the retained branch supplies the member-side readout chain for the same solution.
    Fifth, the failed branch is embedded as
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]

    \begin{theorem}[Same-solution CM dichotomy]
    Let \(Q\) be the canonical terminal record selected by a finite Clay terminal claim for the original Navier--Stokes solution.  In the CM test, \(Q\) has exactly two proof outcomes:
    \[
      \Member(Q;\Owork)
      \quad\hbox{or}\quad
      \Exit(Q;\Owork).
    \]
    The member outcome gives the same-solution readout chain up to the selected continuation consumer.  The exit outcome is supported by a first failed witness face:
    \[
      \neg\Pack_Q,\qquad
      \Pack_Q\wedge\neg\Part_{N,Q},\qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    \end{theorem}

    \begin{proof}
    The terminal record entry proposition gives the same-branch reduction.
    The restart-readout case continues the same solution.
    In the remaining case, the finite Clay claim supplies the terminal record \(Q\) from the original branch.
    Membership in \(\Owork\) is the conjunction of material custody, same-equation participation, and positive-scale field readout on that same record.
    When those requirements survive at the finite continuation levels, the member-side readout chain feeds the continuation criterion selected for that branch.
    For the classical Sobolev endpoint, the local \(H^s\) theorem restarts the same solution beyond \(T_*\).
    When the record loses one requirement, the first lost requirement is a Pack, Part, or Field face failure and gives \(\Exit(Q;\Owork)\).
    These two outcomes exhaust the same-solution terminal class.
    \end{proof}

    \begin{corollary}[No same-record third branch]
    An admitted same-solution terminal record cannot both remain an in-class member branch and carry a first Pack, Part, or Field face failure.
    \end{corollary}

    \begin{proof}
    The member branch retains the three witness requirements and feeds the selected continuation consumer.
    A first face failure is exactly the failure of one of those witness requirements on the same record.
    The same record cannot simultaneously retain a requirement and lose it as its first failed face.
    \end{proof}

    This theorem is the class-consumption theorem.
    Surface landings still do the work that makes a terminal record legitimate.
    The periodic branch selects the transported whole-torus atlas and reads non-continuation through that atlas.
    The whole-space branch selects the exterior Duhamel survivor after the initial heat tail and fixed compact-core far-field source are removed.
    The annular endpoint branch is the active gold-side obstruction: the surrounding positive-radius fields would be controlled directly by the stronger forward-positive annular supplier.
    The specific residual annular case is now accounted without claiming that stronger supplier: gold pass, exact terminal time-face pulse obstruction, no-admission support or Pack boundary on the governing record, admitted Member branch, or admitted Part/Field exit.
    A CMI-final version must still keep the stronger gold supplier unproved unless \(\mathrm{TerminalTimeFaceAntiAtom.A}\), \(\mathrm{TerminalNewProductionTheorem}_{B_{\mathrm{ASAC}}}\mathrm{.A}\), or one of the exact child entrances above is installed, and it must keep private annular diagnostics outside the proof until admission is paid.
