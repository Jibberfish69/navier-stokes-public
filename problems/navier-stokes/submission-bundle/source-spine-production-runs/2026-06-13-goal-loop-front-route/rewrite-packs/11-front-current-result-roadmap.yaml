    \section{Original Problem Statement}

    The Clay problem asks whether a smooth, divergence-free initial velocity for the three-dimensional incompressible Navier--Stokes equations can develop a finite-time loss of smoothness.  The unknowns are a velocity field \(u(x,t)\) and a pressure \(p(x,t)\).  On \(\mathbb T^3\), and on \(\mathbb R^3\) with smooth rapidly decaying data, they satisfy
    \[
      \partial_t u +(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
    \]
    with
    \[
      u(\cdot,0)=u_0.
    \]
    Here \(u_0\) is smooth and divergence-free, the viscosity \(\nu>0\) is fixed, and no external force is present.

    The object under test is the same solution branch generated by \(u_0\).  The velocity, pressure, pressure law, fixed viscosity, and incompressibility constraint stay attached to that branch.  A proposed counterexample has to give a finite terminal record of that branch and explain how the original solution reaches a finite time \(T_*\) at which the usual continuation readout fails.

    This manuscript keeps two proof routes visible from the start.  The gold route is the direct forward-positive route: use the equation to control the quantities that would continue the solution.  The silver route is the CM contrapositive route: when the gold route leaves an exact terminal obstruction, test whether that obstruction is still a same-solution Navier--Stokes object.  The CM test has three faces.  Pack asks for a positive carrier or selected packet.  Part asks for the same pressure-viscosity-incompressibility participation law on the derivative tower.  Field asks for a positive-scale coherent field readout.

    The current proof state has one visible unpaid place.  A radius-zero endpoint is a point-object.  A finite-time singularity would also be witnessed by surrounding positive-radius fields as they shrink toward the endpoint.  Those annular fields have to be controlled by the gold route or passed to the silver route with a first failed face: Part or Field.  The periodic branch is handled through the transported whole-torus atlas.  The whole-space branch is handled through the exterior-source CM dichotomy.

    \section{Current Main Result and Proof Roadmap}

    This section states what the manuscript currently proves, what it still owes, and how the later sections should be read.  The main result is a same-solution terminal classification theorem with an annular boundary kept open on the page.  The paper has written silver payments for the periodic whole-atlas branch and the whole-space exterior-source branch.  The stronger gold annular supplier remains the named forward-positive target.

    \subsection{Current theorem-level claim}

    \begin{theorem}[Same-solution terminal classification, with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\) on its maximal interval.  Suppose a finite Clay terminal claim selects a terminal record \(Q\) for that same branch.  Once the selected record is paid as a same-solution terminal witness, the CM terminal test has only two outcomes:
    \[
      \Member(Q;\Owork)
      \qquad\text{or}\qquad
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The member outcome is the retained same-solution continuation side.  The exit outcome is supported by the first failed witness:
    \[
      Field-window evidence outside CM,
      \qquad
      \neg\Part_{N,Q},
      \qquad
      \Part plus Field-window evidence_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    No admitted same-solution terminal record is both a member-continuation record and a finite nonsmooth terminal witness.
    \end{theorem}

    The phrase ``paid as a same-solution terminal witness'' carries the main burden.  It means the paper has selected the object actually produced by the alleged breakdown of the original solution and has kept enough data on that object to test carrier, participation, and field readout.  A comparison packet, surrogate equation, detached endpoint, or convenient diagnostic pattern is support material only after it is tied back to the same original branch.

    \subsection{Proof route through the manuscript}

    The manuscript follows four reader questions.
    \begin{enumerate}[leftmargin=2em]
      \item What is the exact Navier--Stokes object under test?
      \item What does the direct gold route control, and where does it currently stop?
      \item When a terminal obstruction survives that direct accounting, is it still a same-solution object?
      \item Which first CM Part/Field fails when the same terminal record cannot remain on the member-continuation side?
    \end{enumerate}

    The first question fixes the original branch: same datum, same velocity-pressure solution, same fixed viscosity, same pressure law, and same incompressibility constraint.  The second question is the forward-positive estimate problem.  The third question is the admission rule for the CM test.  The fourth question is the Field-certification classification that embeds the failed face as \(\Exit(Q;\Owork)\).

    \subsection{The gold boundary}

    The live gold boundary is the annular endpoint witness.  Around a proposed terminal point \((x_*,T_*)\), a typical shrinking annular window has the form
    \[
      A_m
      =
      \{(x,t):\alpha r_m<|x-x_*|<\beta r_m,\quad |t-t_m|\lesssim r_m^2\},
      \qquad
      r_m\downarrow0,\quad t_m\uparrow T_*.
    \]
    On such windows the unpaid quantity is the residual scale-critical refill after heat descendants, through-flow, legal losses, finite payments, and paid dissipation have already been removed.  At dyadic scale \(2^{-j_m}\simeq r_m\), write
    \[
      u_j=\Delta_j u,\qquad
      E_j(t)=2^{2j}\|u_j(t)\|_2^2,\qquad
      D_j(t)=2^{4j}\|u_j(t)\|_2^2 .
    \]
    The shell ledger has
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)\le \Phi_j^+(t),
    \]
    and the residual refill is read as
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The corresponding annular load \(D_m^{\mathrm{res}}\) is this quantity read on the shells and time windows meeting \(A_m\).

    The open gold supplier is the scale-uniform smallness statement
    \[
      \forall \varepsilon>0\ \exists r_\varepsilon>0
      \quad\text{such that}\quad
      r_m<r_\varepsilon \Longrightarrow D_m^{\mathrm{res}}\le \varepsilon
    \]
    for every same-solution terminal annular schedule.  A stronger summable form would be
    \[
      \sup_{\mathcal A}\sum_{m\ge M}D_m^{\mathrm{res}}\longrightarrow0
      \qquad(M\to\infty),
    \]
    where the supremum runs over admissible disjoint terminal annular schedules.  The current narrowed obstruction is terminal Zeno source-refill: positive same-solution source mass can be inherited along shrinking heat-time windows with \(r_m\downarrow0\) and \(\sum_m r_m^2<\infty\).  The named production target is \(\mathrm{TerminalTimeFaceAntiAtom.A}\), or an equivalent theorem giving temporal thickness, scale-critical source Carleson charge, diffuse-parent charge, no-incoming-flux control, or a rigid ancient source-residue Liouville class.

    \subsection{The silver payments currently written}

    The silver CM route receives only the residual obstruction left after the forward accounting above.  A radius-zero point is a Field-window support point-object.  The live singularity witness is the limiting behavior of the same solution on shrinking positive-radius annuli.  Once a surviving residual annular obstruction is selected as the same-solution terminal witness and is readout-complete for the claimed breakdown, carrier has already been supplied for this annular test.  The smooth branch is Member.  A finite nonsmooth admitted branch is Part when same pressure-viscosity-incompressibility participation is lost, or Field when participation survives with no positive-scale coherent field readout.

    On the periodic branch, the transported whole-torus atlas \(Q_{\mathrm{atlas}}\) pays selection and readout.  The terminal object is the whole transported atlas, and retained Part and Field on that atlas read out to the global \(H^s\), \(s>5/2\), continuation norm.  Failure of atlas selection, carrier scale, or material comparability is a Pack failure on \(Q_{\mathrm{atlas}}\).

    On the whole-space branch, the exterior Duhamel split supplies the corresponding decision surface.  The initial heat tail and any fixed compact-core far-field source vanish at spatial infinity.  A vanishing exterior nonlinear source gives the usual whole-space continuation readout.  A surviving exterior nonlinear source becomes a dyadic high-frequency escape and enters the same CM participation-field test: no retained material address is Pack failure, detachment from the same equation, pressure, viscosity, or source ancestry is Part failure, and retained Field-window evidence plus Part with no fixed positive Field scale is Field failure.

    \subsection{How to read the support material}

    Branch-family estimates, examples, failed positive-forward attempts, comparison material, and diagrammatic summaries are not independent proof routes in this manuscript.  They are useful when they pay one of the named manuscript jobs: they identify the same terminal object, explain why a gold estimate stops, supply a branch-specific silver payment, mark an obsolete or moot route, or record a forward note for later work.  The reader should be able to trace every support object back to the same branch, the gold boundary, a silver Part/Field face, or an explicit exclusion reason.

    CMI finality requires the annular witness to be paid by one of the two certification layers.  Gold pays it by proving the forward-positive annular supplier.  Silver pays it by selecting the surviving same-solution annular residue, keeping its readout data visible, and landing the first failed CM Part/Field.  The rest of the manuscript is organized around making those payments readable on the page.
