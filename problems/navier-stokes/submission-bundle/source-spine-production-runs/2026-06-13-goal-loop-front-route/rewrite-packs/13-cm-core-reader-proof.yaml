    \section{The Contrapositive Logic}

    The contrapositive route starts with the same-solution terminal object offered by a finite-time breakdown claim.  The object is not assumed to be a member, and it is not assumed to be an exit.  It is admitted as the record under examination.

    The class test reads the record through
    \[
      \CM_{N,r,Q}
      :=
      \Pack_Q\wedge\Part_{N,Q}\wedge\Field_{N,r,Q}.
    \]
    \(\Pack_Q\) says that the same-fluid body is present.  \(\Part_{N,Q}\) says that the same pressure-viscosity-incompressibility tower still acts on that body.  \(\Field_{N,r,Q}\) says that one positive scale still reads neighboring towers as one field.

    Membership is the survival of the witness at the finite depths needed by the selected continuation/readout criterion:
    \[
      \forall N\ \exists r_N>0:\ \CM_{N,r_N,Q}
      \quad\text{with the branch readout attached}
      \quad\Longrightarrow\quad
      \Member(Q;\Owork).
    \]
    Class exit is
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]

    The split has two sides.  On the pass side, the selected same-solution record retains Part and Field and carries the branch readout named by the proof:
    \[
      \CM_{N_*,r,Q}
      \ \text{on the selected record}
      \quad+\quad
      \text{branch readout}
      \Longrightarrow
      \Member(Q;\Owork).
    \]
    On the fail side, the same selected record loses its first membership face:
    \[
      \neg\Pack_Q
      \quad\text{or}\quad
      \Pack_Q\wedge\neg\Part_{N_*,Q}
      \quad\text{or}\quad
      \Pack_Q\wedge\Part_{N_*,Q}\wedge\forall r>0\,\neg\Field_{N_*,r,Q}.
    \]
    That first Part/Field failure supports \(\Exit(Q;\Owork)\).  The CM route is this pass-or-exit split on the same record.  It is not a shortcut around selecting the terminal object, and it is not a replacement for the forward-positive gold route.
