    \section{Simplifying The Witness Logic Table}

    The formal truth table has eight rows, but the proof does not ask the reader to carry all eight.  It asks for the first failed face on an actual same-fluid terminal object:
    \[
    \begin{array}{c|l}
    \text{face state on the selected record} & \text{proof reading}\\ \hline
    \Pack_Q\wedge\Part_{N,Q}\wedge\Field_{N,r,Q}
      & \text{member-side candidate, with readout still required}\\
    \neg\Pack_Q
      & \text{Field-certification failure}\\
    \Pack_Q\wedge\neg\Part_{N,Q}
      & \text{Part-first failure}\\
    \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}
      & \text{Field-first failure.}
    \end{array}
    \]
    The discarded formal rows are not ignored.  They are read through the same first-face rule.  A field reading without a same carrier has already lost Pack.  A participation reading without a same carrier has already lost Pack.  A carrier whose law and field both fail is recorded at the first lost face.

    Some failures are easiest to see from Field first.  A slip sheet is the clean example: the visible problem is neighboring-field jump, and the Part defect may be isolated only after the neighboring fields are placed on one record.  Field stays in the table for that reason.  It catches terminal pictures that Part alone does not expose on its own, while the final class-exit reading remains tied to the same Part/Field record.
