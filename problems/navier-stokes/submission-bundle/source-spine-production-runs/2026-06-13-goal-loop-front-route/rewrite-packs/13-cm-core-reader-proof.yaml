    \section{The Clay-Facing CM Completion}

    The class law consumes a finite terminal witness by a short chain:
    \[
    \begin{aligned}
    &\text{finite Clay breakdown witness}\\
    &\Longrightarrow \text{legitimate CM terminal object or scope rejection}\\
    &\Longrightarrow \text{first Part/Field failure}\\
    &\Longrightarrow \Exit(Q;\Owork).
    \end{aligned}
    \]
    The pass side supplies a lawful \(\Member(Q;\Owork)\) branch and reads out to smooth continuation when the pass branch is the same original solution branch.  The fail side first enters the CM terminal test and then loses one required feature.  There is no fourth same-solution terminal failure outside Part and Field.

    The present paper keeps the annular-limit witness as the live place where this chain is not yet a final Clay closure.  The surrounding positive-radius terminal witness still has to be paid by gold control or, after annular admission, by a completed silver Part/Field landing.

    \begin{definition}[Terminal witness consumption]
    A finite Clay terminal witness is consumed by the CM proof when it is admitted to the same-fluid terminal packet tree and exhausted as one of
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q},
    \]
    with the derived Part/Field failure embedded as
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    \end{definition}

    \begin{proposition}[Torus-atlas terminal face exhaustion]
    On the periodic surface, the whole transported terminal atlas \(Q_{\mathrm{atlas}}\) gives the terminal CM test object.  Every admitted finite terminal non-continuation on that atlas has one of the following readings:
    \[
    \begin{aligned}
    &\text{scope rejection of the proposed obstruction for the CM test,}\\
    &\neg\Pack_{Q_{\mathrm{atlas}}},\\
    &\Pack_{Q_{\mathrm{atlas}}}\wedge\neg\Part_{N_s,Q_{\mathrm{atlas}}},\\
    &\Pack_{Q_{\mathrm{atlas}}}\wedge\Part_{N_s,Q_{\mathrm{atlas}}}
      \wedge\forall r>0\,\neg\Field_{N_s,r,Q_{\mathrm{atlas}}}.
    \end{aligned}
    \]
    \end{proposition}

    \begin{proof}
    The torus material-atlas theorem supplies the terminal object.  \(Q_{\mathrm{atlas}}\) is the whole transported finite atlas, not a selected diagnostic packet.  It also fixes the readout-compatible Pack predicate, so failure of atlas selection is \(\neg\Pack_{Q_{\mathrm{atlas}}}\), not a fourth terminal requirement.  Once the proposed object is the same-solution terminal atlas object, the first failed membership requirement must be Part or Field.
    \end{proof}

    \begin{theorem}[Periodic CM classification state]
    For smooth divergence-free zero-mean data on \(\mathbb T^3\), the same-solution CM route classifies any admitted finite terminal witness.  Every legitimate finite terminal witness is admitted to the transported atlas \(Q_{\mathrm{atlas}}\), exhausted by its first failed Part or Field face, and embedded as
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    This is the periodic CM pass-or-exit result: the retained branch gives the usual continuation readout, and the failed branch is consumed as class exit for the same working object.
    \end{theorem}

    \begin{proof}
    Assume \(T_*<\infty\).  The whole-torus terminal atlas is readout-complete.  The finite endpoint either retains Part and Field on the same transported atlas, or it has a first Part or Field Part/Field failure.  An annular residue surrounding the endpoint is tested through this same atlas rather than as a private diagnostic packet.  The Part/Field-failure branch is consumed by the terminal witness theorem and embedded as class exit for the same working Navier--Stokes object.  The retained branch gives the \(H^s\), \(s>5/2\), continuation norm for the same original solution.  The failed branch is outside \(\Member(Q;\Owork)\), so it cannot serve as an in-class finite Clay continuation branch.
    \end{proof}
