    \section{The Class-Law Proof}

    Classification supplies the exit witness.  The proof has to show that one selected terminal branch cannot be both a member-continuation branch and the nonsmoothness-capable Part/Field-failure witness.

    \begin{definition}[Terminal Part/Field-failure witness]
    A terminal Part/Field-failure witness is a same-solution terminal record \(Q\) that is admitted to the CM test and satisfies \(\Exit(Q;\Owork)\) by a derived Part or Field Part/Field failure.  It belongs to the fail side of the obstruction split and carries no legal member-continuation status.
    \end{definition}

    \begin{proposition}[Legal branch law]
    Every legal same-solution continuation branch for the Clay Navier--Stokes problem is represented by the working class object:
    \[
      \Legal_{\NS}(Q)\Longrightarrow \Member(Q;\Owork).
    \]
    \end{proposition}

    \begin{proof}
    A legal same-solution continuation branch is the original smooth-data Navier--Stokes evolution continued as the same velocity-pressure solution with the same viscosity and the same fluid participation.  To be such a branch, it must retain a positive same-fluid carrier, the same Navier--Stokes law through the velocity tower, and positive-scale coherent field data.  Those are the requirements defining membership in \(\Owork\).
    \end{proof}

    \begin{theorem}[No third in-class terminal branch]
    There is no selected terminal record \(Q\) that is both a verified member-continuation record and a finite nonsmooth obstruction record:
    \[
      \begin{aligned}
      &\Member(Q;\Owork)\ \text{with required branch readout,}\\
      &Q\ \text{blocks smooth continuation at }T_*<\infty .
      \end{aligned}
    \]
    \end{theorem}

    \begin{proof}
    Membership gives Part and Field on one witness record, and the pass side also carries the continuation/readout supplier for that branch.  By that readout, the same selected branch is on the smooth continuation side of the split.  That contradicts the claim that the same branch blocks smooth continuation at \(T_*\).
    \end{proof}

    \begin{theorem}[CM branch target]
    Let \(O\) be a same-solution obstruction reached by the forward-positive Navier--Stokes program.  The CM proof must prove the following split on the selected terminal record \(Q\):
    \[
      O_{\Pass}
      \Longrightarrow
      \CM_{N_*,r,Q}\ \text{with branch readout}
      \Longrightarrow
      \Member(Q;\Owork),
    \]
    and
    \[
      O_{\Fail}\ \text{capable of finite nonsmoothness}
      \Longrightarrow
      \Exit(Q;\Owork).
    \]
    \end{theorem}

    \begin{proof}
    The pass branch retains the carrier, participation, and field requirements on one witness record and carries the branch readout named by the proof.  It is a member-continuation branch by that attached readout.

    The fail branch is offered as a finite same-solution terminal obstruction.  The classification theorem admits that obstruction to the CM test, or rejects it by scope, and then exhausts any admitted terminal object by the first Part/Field it loses: Part or Field.  The derived Part/Field failure is the finite-failure witness read as \(\Exit(Q;\Owork)\).
    \end{proof}

    \begin{theorem}[CM terminal witness classification target, with annular boundary]
    Every CM-test-admissible finite terminal Clay witness from the same smooth initial datum whose positive-radius terminal witness has been paid is classified by the CM terminal witness chain:
    \[
    \begin{aligned}
    &\text{finite breakdown witness}\\
    &\Longrightarrow \text{CM-test entry}\\
    &\Longrightarrow
      \left[
      \begin{array}{c}
        \neg\Pack_Q\\
        \text{or }\Pack_Q\wedge\neg\Part_{N,Q}\\
        \text{or }\Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}
      \end{array}
      \right]\\
    &\Longrightarrow \Exit(Q;\Owork).
    \end{aligned}
    \]
    This is the classification target for the alleged terminal object.
    \end{theorem}

    \paragraph{Current annular boundary.}
    The current theorem notes keep one boundary open for this theorem.  A radius-zero endpoint is not a continuation packet, but a finite-time singularity is witnessed by the fields around that endpoint.  The paper has to follow shrinking positive-radius annular windows around \((x_*,T_*)\) before it can claim a final annular payment.  After annular admission, that payment is Part or Field.

    The gold certification layer controls the residual scale-critical load on those annuli and recovers the continuation readout.  The silver certification layer follows any surviving annular residue to the first lost membership requirement.  This manuscript does not claim CMI finality until that annular witness is paid by one of those layers.

    \paragraph{Annular payment ledger.}
    The annular witness is measured on positive-radius windows before the terminal time.  A typical window is
    \[
      A_m
      =
      \{(x,t):\alpha r_m<|x-x_*|<\beta r_m,\quad
      |t-t_m|\lesssim r_m^2\},
      \qquad
      r_m\downarrow 0,\quad t_m\uparrow T_*.
    \]
    On each \(A_m\), the velocity and pressure are still those of the original preterminal Navier--Stokes solution.  The unpaid quantity is not raw energy in the window.  The current notes use the residual scale-critical load \(D_m^{\mathrm{res}}\): the load left after heat descendants, through-flow, legal losses, finite payments, and paid dissipation have been removed.

    Let \(j_m\) satisfy \(2^{-j_m}\simeq r_m\), and write
    \[
      u_j=\Delta_j u,\qquad
      E_j(t)=2^{2j}\|u_j(t)\|_2^2,\qquad
      D_j(t)=2^{4j}\|u_j(t)\|_2^2 .
    \]
    The shell energy inequality has the form
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)\le \Phi_j^+(t),
    \]
    where \(\Phi_j^+\) is the positive nonlinear source into the \(j\)-th shell.  Solving from an entrance time \(t_0\) gives
    \[
      E_j(t)\le e^{-c_0\nu2^{2j}(t-t_0)}E_j(t_0)
      +C\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The first term is the heat descendant.  The residual refill is the second term, placed in scale-critical currency:
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The annular load \(D_m^{\mathrm{res}}\) is this residual refill read on the shells and time windows that see \(A_m\).  It vanishes for pure heat descendants and counts only positive same-solution nonlinear refill still able to feed the annular profile.

    The gold target is the scale-uniform smallness statement
    \[
      \forall \varepsilon>0\ \exists r_\varepsilon>0
      \quad\text{such that}\quad
      r_m<r_\varepsilon \Longrightarrow D_m^{\mathrm{res}}\le \varepsilon
    \]
    for every same-solution terminal annular schedule \(A_m\).  A stronger summable form is
    \[
      \sup_{\mathcal A}\ \sum_{m\ge M}D_m^{\mathrm{res}}
      \longrightarrow 0
      \qquad(M\to\infty),
    \]
    where the supremum is over admissible disjoint terminal annular schedules.  The manuscript does not claim either estimate as proved.  These displays state the exact forward-positive bill still owed before the gold layer closes the annular witness.

    The silver route pays only the residual obstruction that survives this accounting.  It selects the same annular residue as the terminal record and keeps the readout data visible.  Once that annular witness is admitted, carrier has already been supplied for this test.  The admitted smooth branch is Member, and the admitted finite nonsmooth branch lands at Part for loss of the same pressure-viscosity-incompressibility participation tower, or Field for loss of positive-scale one-field readout after Part survives.

    \paragraph{Gold status ledger.}
    The forward-positive notes have paid organizing support.  The moving-cone local energy identity accounts for stored energy, interior dissipation, moving wall loss, transport flux, pressure work, and viscous wall exchange on the shrinking receiver.  A finite undiscounted scale-critical cone budget would make late cone slabs small and trigger the usual CKN/\(H^s\) regularity readout.  Raw active-square size and raw LPAS are not closure currencies, because a heat-decaying shear can make the raw bill large while the nonlinear refill is zero.  The live currency is the residual positive refill \(D_m^{\mathrm{res}}\).

    These points narrow the gold route without closing it.  The open supplier is the scale-uniform theorem saying that same-fluid participation removes the discounted physical-energy gap or beats the critical payment rate on every shrinking annular schedule.  The estimates proved so far do not supply that theorem from finite energy, the local energy identity, raw wall or cone-volume ledgers, raw LPAS, direct active-square Carleson, structural shell cancellation, or donor balance alone.  The surviving positive-forward branch is terminal Zeno source-refill:
    \[
      \cdots\to P^{-2}\to P^{-1}\to P^0,
      \qquad
      r_m\downarrow0,
      \qquad
      \sum_m r_m^2<\infty,
    \]
    with inherited positive same-solution source mass on shrinking heat-time windows.  The gold theorem still needed here is
    \[
      \mathrm{TerminalTimeFaceAntiAtom.A},
    \]
    or an equivalent production theorem giving temporal thickness, scale-critical source Carleson charge, diffuse-parent charge, no-incoming-flux control, or a rigid ancient source-residue Liouville class.  At the present proof state that production theorem is not proved.

    \paragraph{Silver status ledger.}
    The silver counterpart is the annular specialization
    \[
      \mathrm{AnnularLimitCMFaceLanding.A}.
    \]
    It does not reuse the bare endpoint shortcut.  It says that a surviving residual annular obstruction, once admitted as the same-solution terminal witness and readout-complete for the claimed breakdown, has already supplied the carrier side of this annular test.  The retained branch is the smooth/member branch:
    \[
      \Part_{N,Q}\wedge \exists r>0\,\Field_{N,r,Q}
      \quad\Longrightarrow\quad
      \Member(Q;\Owork).
    \]
    A finite nonsmooth admitted annular witness exits only through the remaining two faces:
    \[
      \neg\Part_{N,Q}
      \quad\text{or}\quad
      \Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    The admission boundary is explicit.  Selection means the paper follows the annular tail actually produced by the alleged finite-time breakdown of the original solution.  Readout completeness means that the selected tail still carries enough same-solution information to test the claimed breakdown: the carrier, the pressure-viscosity-incompressibility participation law, the derivative tower depth being used, and a positive-scale field record.  Without that payment, the silver route remains a conditional counterpart rather than a final proof claim.

    For the periodic branch, selection and readout are paid by the transported whole-torus atlas \(Q_{\mathrm{atlas}}\).  This is a branch-specific payment, not a proof that the open terminal Zeno source-refill theorem has been supplied in general.  The whole-space branch is separate.  For rapidly decaying data on \(\mathbb R^3\), the exterior Duhamel split removes the initial heat tail and the far-field effect of any fixed compact-core source.  A vanishing exterior nonlinear source supplies the usual whole-space continuation readout.  A surviving exterior source enters the same CM participation-field test as Part or Field pressure.  The direct exterior \(H^s\) tail theorem remains a stronger gold/export theorem, not a hidden premise of the silver whole-space CM branch.

    \begin{proof}
    Assume that the maximal smooth solution from \(u_0\) is alleged to stop at a finite time \(T_*\), and let \(Q\) be the terminal object offered by that breakdown claim.  The CM test admits only same-solution terminal objects.  A surrogate equation, comparison object, or support packet is rejected before it can count as the terminal object for this claim.

    For an admitted object, membership in the working CM class is the conjunction of positive Pack carrier, same pressure-viscosity Part action, and positive-scale Field record, with the branch readout attached on the pass side.  If all survive, the selected branch is on the \(\Member(Q;\Owork)\) side.  If the alleged finite terminal object is not on that side, the first failed requirement is \(\neg\Pack_Q\), or \(\Pack_Q\wedge\neg\Part_{N,Q}\), or \(\Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}\).  That first Part/Field failure is embedded as \(\Exit(Q;\Owork)\).

    In the annular-limit case, the point \(r_*=0\) can fail Pack as a point-object, while the surrounding positive-radius fields remain the live witness that must be controlled or classified.  That is why this theorem is a classification target with an annular boundary, not a final Clay closure by itself.
    \end{proof}
