    \section{Participation and One-Field Coherence Witness Laws}

    The terminal test is read on one record:
    \[
      \WitnessRecord=(u_0,\nu,u,p,Q,N,r,\Phi,T_*).
    \]
    The entries have a simple job.  \(Q\) is the selected terminal object.  \(N\) is the finite derivative depth being tested.  \(r>0\) is the field scale on which neighboring readings must still agree.  \(\Phi\) is the transported carrier, and \(T_*\) is the alleged finite terminal time.  Part and Field are all read on this same record.  Changing the record between faces would change the branch under test.

    \begin{definition}[Witness record]
    A witness record is one terminal data record
    \[
      \WitnessRecord=(u_0,\nu,u,p,Q,N,r,\Phi,T_*),
    \]
    where \((u,p)\) is the same preterminal solution generated by \(u_0\), \(\nu\) is the same fixed viscosity, \(Q\) is the selected terminal object, and \(\Phi\) is the same transported carrier.
    \end{definition}

    \begin{definition}[Participation witness law]
    \(\Part_{N,Q}\) means that \(Q\) carries the same pressure-viscosity-incompressibility participation law through tower depth \(N\).  On the packet and time window being tested,
    \[
      D_tU_k=K_k+B_k,
      \qquad
      K_k=-\nabla^{k+1}p+\nu\Delta U_k,
      \qquad
      0\le k\le N,
    \]
    with every term read from the same branch \((u,p)\) and the same transported carrier \(\Phi\).
    \end{definition}

    \begin{definition}[One-field witness law]
    \(\Field_{N,r,Q}\) means that, after Pack and Part have fixed the carrier and law, one positive scale \(r>0\) carries coherent field data through depth \(N\).  A concrete finite-difference model is
    \[
      \sup_{\substack{x,x+h\in Q_t\\0<|h|\le r}}
      \sum_{k=0}^{N}
      \frac{
        |U_k(x+h,t)-U_k(x,t)|
        +
        |K_k(x+h,t)-K_k(x,t)|
      }{|h|}
      <\infty
    \]
    on the time slices under test.
    \end{definition}

    The order matters.  Pack asks whether the same-fluid body is present.  Part asks whether the same equation still acts on that body.  Field asks whether the resulting readings still fit into one positive-scale field.  These are not three names for the same failure.  They are the three membership faces the proof uses to locate the first loss on the selected terminal record.
