    \section{Packet Witness Law}

    Pack is the entry face of the terminal test.  A finite-time breakdown claim cannot be tested from a bare point, a number, or a diagnostic trace.  It has to supply a same-solution carrier on which the law and the field can be read.

    \begin{definition}[Packet witness law]
    \(\Pack_Q\) means that the selected terminal record has a positive same-fluid carrier.  There is a transported carrier family \(\Phi_t\) moved by the same velocity field \(u\), a finite cover with finite overlap on the terminal region under test, and a positive carrier scale for the selected record.  A terminal trace with no positive carrier, a source atom with no transported body, or a donor history outside the same flow fails Pack.
    \end{definition}

    The periodic branch uses the whole transported material atlas \(Q_{\mathrm{atlas}}\).  That atlas fixes the packet before branch examples are read, so the proof cannot choose a private diagnostic packet after the obstruction is known.  The whole-space branch uses the corresponding exterior-source selection: once the initial heat tail and the fixed compact-core far-field contribution have been removed, any surviving exterior source must still receive a same-solution material address before it can enter Part or Field.
