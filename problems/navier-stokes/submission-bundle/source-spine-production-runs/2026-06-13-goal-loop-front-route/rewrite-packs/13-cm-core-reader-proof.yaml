    \section{Velocity Failure Types}

    The words dead, jump, and blown are mechanism labels.  They are not extra classes beyond Part and Field.  The proof first places the selected terminal record in the witness tree, then names the mechanism.

    \subsection{Dead}

    Dead is a Part-side mechanism.  The carrier is still being named, but the same pressure-viscosity-incompressibility law no longer acts on it through the tower being tested.  The word does not mean zero velocity.  It means loss of same-object dynamics.

    Once Part fails, Field usually fails as a consequence because neighboring readings cannot form one same-law field without the law that relates them.  The first Part/Field is Part when the carrier is retained and participation is the first lost requirement.

    \subsection{Jump}

    Jump is a Field-side mechanism.  The carrier and local law may still be readable at the level under inspection, while finite neighboring readings fail to assemble into one positive-scale field.  The incompatibility may occur inside one derivative tower or between nearby packet towers.

    A jump is not an infinite value.  It is a claim that finite readings cannot be the readings of one smooth field on any positive scale allowed by the record.  After the neighboring towers are put on the same witness record, the same event may expose a Part defect as well.  The first visible face is Field when one-field coherence is the first requirement the terminal object loses.

    \subsection{Blown}

    Blown is the unbounded-tower mechanism.  A positive carrier remains visible, and a velocity derivative, pressure term, viscous term, or continuation readout becomes unbounded at the finite depth under test.  The usual blowup picture belongs here only after the selected same-solution record has been fixed.

    The first Part/Field still has to be located.  If the deformation or atlas degenerates so severely that no positive same-fluid carrier remains, the first Part/Field is Pack.  If the carrier remains but the pressure-viscosity tower cannot be read as the same finite tower, the first Part/Field is Part.  If Pack and Part are retained while no positive-scale coherent field can include the unbounded reading, the first Part/Field is Field.  The same physical episode can be seen from neighboring packets in different ways, but the proof records the first failed face on the selected record.
