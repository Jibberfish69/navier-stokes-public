    \section{Defining Class Membership}

    The CM argument needs one fixed object.  The object is not a nearby flow, a comparison equation, a diagnostic trace, or a convenient limiting picture.  It is the original Navier--Stokes evolution generated by \(u_0\):
    \[
      \Owork=\Owork(u_0,\nu,u,p).
    \]
    This notation keeps the datum \(u_0\), the fixed viscosity \(\nu>0\), the velocity-pressure pair \((u,p)\), incompressibility, the pressure law, and the transported material carrier in one place.  A terminal record \(Q\) can be tested only as a record of that same object.

    The membership statement is
    \[
      \Member(Q;\Owork).
    \]
    It means that the selected terminal record still belongs to the same Navier--Stokes branch at the level required by the continuation/readout criterion being used.  Resemblance is not enough.  A trace can look Navier--Stokes-like, a comparison object can satisfy a related equation, and a support packet can preserve useful information.  None of those is membership unless the record remains attached to the same datum, same velocity-pressure solution, same viscosity, same pressure law, same incompressibility law, same transported carrier, and same terminal role.

    Class exit is the complementary reading
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The point of the witness tree is to make that negation inspectable.  The paper does not call a terminal picture an exit merely because it looks singular.  It asks which part of membership fails first: the carrier, the same-law participation, or the positive-scale field readout.

    \subsection{The fixed class data}

    The class data are fixed before the terminal object is tested:
    \[
      \partial_tu+(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      u(\cdot,0)=u_0.
    \]
    The pressure is the pressure generated by this incompressibility constraint.  The carrier is transported by this velocity field.  The viscosity is the same fixed positive number throughout the branch.  The terminal role is also fixed: \(Q\) is being offered as the finite-time terminal record of this original solution.

    A proposed terminal object that changes these data has changed the problem.  A regularized equation, inviscid comparison branch, exported geometric model, private packet, or detached source record may support the paper only after the manuscript explains how it reattaches to the original Navier--Stokes branch.  Otherwise it is a scope boundary, not the terminal object being tested.

    \subsection{Participation as one law}

    Participation is the same pressure-viscosity-incompressibility law acting on the same carrier.  It is not a metaphor and it is not only damping.  The equation reads pressure, viscosity, transport, and incompressibility together:
    \[
      D_tu+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
      \qquad
      D_t=\partial_t+u\cdot\nabla .
    \]
    At finite derivative depth, write
    \[
      U_k:=\nabla^k u,\qquad
      K_k:=-\nabla^{k+1}p+\nu\Delta U_k .
    \]
    At derivative depth \(k\), the differentiated equation reads
    \[
      D_tU_k=K_k+B_k(u,\nabla u,\ldots,\nabla^k u),
      \qquad 0\le k\le N,
    \]
    where \(B_k\) is the commutator expression generated by differentiating the original equation.  This tower does not introduce a new equation.  It records what the original equation demands at the finite derivative depths used by the terminal readout.

    \subsection{Euler as a boundary reading}

    Euler material is used only to name a boundary of the fixed-viscosity Navier--Stokes class.  A selected terminal picture may retain incompressible transport and pressure-momentum balance while losing the fixed positive viscosity law.  In that clean case it may be readable as an inviscid boundary object.  That reading does not prove an Euler theorem and does not replace the Navier--Stokes target.

    Slip and jump pictures illustrate the boundary.  Matching normal flux with incompatible tangential readings can still make sense for an inviscid weak balance.  For the fixed-viscosity Navier--Stokes class, the same picture has lost either the pressure-viscosity-incompressibility participation law or the positive-scale one-field readout.  The manuscript keeps Euler material only where it helps the reader see that boundary.
