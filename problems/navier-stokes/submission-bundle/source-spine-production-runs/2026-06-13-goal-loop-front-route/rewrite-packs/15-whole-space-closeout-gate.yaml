    \section{Whole-Space \texorpdfstring{\(\mathbb R^3\)}{R3} CM Exterior-Source Branch}

    The periodic branch and the whole-space branch use the same class test.  Their entry costs differ.  On \(\mathbb T^3\), the transported atlas lives on a compact spatial domain.  On \(\mathbb R^3\), a terminal claim can try to hide high derivatives in the far field.  The paper handles that risk before it imports the Pack, Part, and Field decision.

    Fix \(s>5/2\).  Let \(u\) be the smooth Navier--Stokes branch on \([0,T_*)\times\mathbb R^3\) from smooth rapidly decaying divergence-free data, and let \(\eta_R\) be an exterior cutoff.  The strong positive export theorem would prove
    \[
      \lim_{R\to\infty}\sup_{t<T_*}\|\eta_R u(t)\|_{H^s(\mathbb R^3)}=0.
    \]
    That theorem is useful, and it is stronger than the CM branch needs.  The CM branch starts from the Duhamel split and asks what remains after the harmless exterior pieces are removed:
    \[
      u(t)=e^{\nu t\Delta}u_0
      -\int_0^t e^{\nu(t-\tau)\Delta}\mathbb P\nabla\cdot(u\otimes u)(\tau)\,d\tau .
    \]

    The initial heat tail vanishes at spatial infinity because the datum is rapidly decaying.  A fixed compact-core nonlinear source has vanishing far-field effect because the heat kernel is off the diagonal at distance comparable to \(R\).  The remaining source is genuinely exterior:
    \[
      W_R(t):=
      \eta_R\int_0^t e^{\nu(t-\tau)\Delta}
      \mathbb P\nabla\cdot\bigl(\chi_{\ge R/4}u\otimes u\bigr)(\tau)\,d\tau .
    \]
    If \(W_R\) vanishes in exterior \(H^s\), the whole-space branch has the ordinary continuation tail.  If \(W_R\) survives, the survivor is the terminal object that must enter the CM matrix.

    \begin{proposition}[Whole-space exterior source split]
    The whole-space exterior \(H^s\) burden reduces to the genuinely exterior nonlinear source \(W_R\).  The initial heat tail and the fixed compact-core far-field source vanish at spatial infinity.  Hence the whole-space branch has the following two outcomes:
    \[
    \begin{array}{ll}
    \displaystyle \lim_{R\to\infty}\sup_{t<T_*}\|W_R(t)\|_{H^s}=0,
      & \text{member-side exterior readout},\\[0.8em]
    \displaystyle \limsup_{R\to\infty}\sup_{t<T_*}\|W_R(t)\|_{H^s}>0,
      & \text{terminal exterior survivor to classify.}
    \end{array}
    \]
    \end{proposition}

    \begin{proof}
    Rapid decay of \(u_0\) controls \(\eta_R e^{\nu t\Delta}u_0\) in \(H^s\) on every finite preterminal interval.  For a fixed compact source, the kernel of \(\Lambda^s e^{\nu(t-\tau)\Delta}\mathbb P\nabla\cdot\) is smooth away from the diagonal, while the cutoff \(\eta_R\) keeps the readout far from that source.  Off-diagonal heat-kernel decay gives a negative power of \(R\).  After those two terms are removed, the displayed exterior nonlinear source is the only term that can carry a terminal exterior \(H^s\) tail.
    \end{proof}

    \begin{lemma}[Bounded exterior frequencies vanish]
    For every fixed dyadic cutoff \(N_0\),
    \[
      \lim_{R\to\infty}\sup_{t<T_*}
      \|P_{\le N_0}W_R(t)\|_{H^s}=0 .
    \]
    \end{lemma}

    \begin{proof}
    On bounded frequency,
    \[
      \|P_{\le N_0}f\|_{H^s}\le C_sN_0^s\|f\|_{L^2}.
    \]
    The heat/Leray operator maps the exterior source from \(L^1_tL^{3/2}_x\) into the fixed-band \(L^\infty_tL^2_x\) response.  With \(F_R=\chi_{\ge R/4}(u\otimes u)\),
    \[
      \|F_R(t)\|_{L^{3/2}}
      \le
      \|\chi_{\ge R/4}u(t)\|_{L^3}\|u(t)\|_{L^3}.
    \]
    The energy class gives \(u\in L^4_tL^3_x\) on \([0,T_*)\).  The exterior factor tends to zero as \(R\to\infty\), and the second factor is square integrable in time on the same finite interval.  Thus \(F_R\to0\) in \(L^1_tL^{3/2}_x\), and the fixed-band \(H^s\) response vanishes.
    \end{proof}

    \begin{proposition}[Exterior survivor lands in the CM faces]
    Assume the exterior nonlinear source survives in \(H^s\).  Then the selected terminal exterior survivor lands in the CM matrix:
    \[
      \neg\Pack_Q\;\vee\;\neg\Part_{M,Q}\;\vee\;
      \forall \rho>0\,\neg\Field_{M,\rho,Q}.
    \]
    \end{proposition}

    \begin{proof}
    The bounded-frequency lemma removes every fixed dyadic window.  A surviving exterior source therefore selects radii \(R_j\to\infty\), times \(t_j<T_*\), and dyadic frequencies \(N_j\to\infty\) such that
    \[
      N_j^s\|P_{N_j}W_{R_j}(t_j)\|_{L^2}\ge c>0 .
    \]
    Let \(Q\) be the same-solution terminal record selected by that survivor.  A survivor lacking a retained material address in the original branch fails Pack.  A survivor detached from the same Navier--Stokes equation, pressure law, viscosity, or source ancestry fails Part.

    It remains to read the retained Pack+Part branch.  A fixed positive Field scale \(\rho>0\) through depth \(M>s\) gives a finite derivative tower on the selected record.  Littlewood--Paley decay on that fixed record gives
    \[
      N^s\|P_N f\|_{L^2}\le C_{\rho,M,Q}N^{s-M}\to0 .
    \]
    That decay contradicts the surviving sequence above.  Every fixed positive Field scale fails on the retained Pack+Part branch.
    \end{proof}

    \begin{theorem}[Whole-space CM classification state]
    For smooth rapidly decaying divergence-free data on \(\mathbb R^3\), the whole-space exterior branch has the same pass-or-exit form as the periodic branch, with its own noncompact payment.  The exterior Duhamel split selects the relevant terminal object.  A vanishing exterior nonlinear source gives the member-side exterior \(H^s\) readout.  A surviving exterior nonlinear source lands in Pack, Part, or Field failure and supports \(\Exit(Q;\Owork)\).
    \end{theorem}

    \begin{proof}
    The Duhamel split removes the initial heat tail and the fixed compact-core far-field source.  The remaining exterior nonlinear source either vanishes in \(H^s\) or survives.  In the vanishing case, the whole-space branch has the continuation tail needed by the member-side readout.  In the surviving case, bounded exterior frequencies vanish, so the survivor is a dyadic high-frequency escape.  The preceding proposition reads that escape as Pack failure, Part failure, or Field failure on the same terminal record.  The CM embedding consumes the first failed face as \(\Exit(Q;\Owork)\).  The direct positive exterior \(H^s\) theorem remains a stronger gold/export theorem.
    \end{proof}

    This is the whole-space branch result used later in the paper.  It keeps the periodic atlas and the noncompact exterior-source branch separate.  It also keeps the direct \(H^s\) tail theorem in its proper role: a stronger forward-positive route, valuable when proved, while the silver whole-space branch uses the CM face landing written above.

