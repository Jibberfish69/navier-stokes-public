    \section{The Closing Hinges}

    The close of the proof has three hinges.

    The first hinge is terminal record entry.  A finite Clay negation concerns one maximal classical branch from one datum.  At the alleged terminal time, that branch either has the \(H^s\), \(s>5/2\), endpoint readout that restarts it, or it has to name same-branch terminal data that prevents the restart.  That named data is the terminal record \(Q\).

    The second hinge is member-side readout.  When Pack, Part, and Field survive on the same record, the record stays readable through the continuation consumer selected by the proof.  For the classical Sobolev consumer, this produces the \(H^s\), \(s>5/2\), restart branch for the original solution.

    The third hinge is class exit.  The first failed Pack, Part, or Field face gives
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    A support estimate matters only by strengthening one of these hinges while preserving the same terminal record.

