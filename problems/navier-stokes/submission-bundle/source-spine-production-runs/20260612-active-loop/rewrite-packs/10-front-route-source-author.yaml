    \section{Gold Standard Approach (Explained) + Live Example}

    The direct route begins with estimates supplied by the equation itself.
    For a smooth divergence-free solution on \(\mathbb T^3\), multiplying the equation by \(u\) and integrating gives
    \[
      \frac12\frac{d}{dt}\|u(t)\|_{L^2}^2
      +\nu\|\nabla u(t)\|_{L^2}^2=0.
    \]
    This is the first honest control.
    The total kinetic energy does not increase, and viscosity spends energy through the gradient term.
    The equation gives a damping law before any CM language enters the paper.

    Smoothness asks for more than finite energy.
    It asks for a finite derivative tower on every finite time interval.
    The next natural calculation differentiates once.
    Set
    \[
      Y(t)=\frac12\|\nabla u(t)\|_{L^2}^2.
    \]
    The enstrophy identity has the form
    \[
      \frac12\frac{d}{dt}\|\nabla u(t)\|_{L^2}^2
      +\nu\|\Delta u(t)\|_{L^2}^2
      =
      \int_{\mathbb T^3}(u\cdot\nabla)u\cdot\Delta u\,dx.
    \]
    The left side contains the same viscous damping.
    The right side is the nonlinear source.
    It is the place where the fluid can feed the derivative level that viscosity is trying to damp.

    A successful gold proof would show that the source is always affordable.
    A typical target has the shape
    \[
      \left|\int_{\mathbb T^3}(u\cdot\nabla)u\cdot\Delta u\,dx\right|
      \le
      \frac{\nu}{2}\|\Delta u\|_{L^2}^2+F(Y(t)),
    \]
    with \(F\) tame enough to integrate for all finite time.
    The first term would be absorbed by viscosity.
    The remaining term would stay under control.
    The derivative tower would then stay finite, and the solution would continue.

    This route is the strongest possible finish when it works.
    It proves continuation directly from the equation.
    It also produces the right obstructions when it fails: source growth, scale transfer, endpoint concentration, annular residue, or a missing readout in the derivative tower.
    The rest of the manuscript uses those obstructions as named objects.
    The CM route does not replace the gold route; it consumes the terminal objects left by the gold route and asks whether they still belong to the same Navier--Stokes class.

