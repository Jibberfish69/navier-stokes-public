    \section{Original Problem Statement}

    The problem is the incompressible three-dimensional Navier--Stokes existence and smoothness problem.
    The unknowns are a velocity field \(u(x,t)\) and a pressure \(p(x,t)\).
    On the periodic three-torus \(\mathbb T^3\), and on the whole space \(\mathbb R^3\) with smooth rapidly decaying data, they satisfy
    \[
      \partial_t u +(u\cdot\nabla)u+\nabla p=\nu\Delta u,
      \qquad
      \nabla\cdot u=0,
    \]
    with
    \[
      u(\cdot,0)=u_0.
    \]
    The datum \(u_0\) is smooth and divergence-free.
    The viscosity \(\nu>0\) is fixed, and there is no external force.

    The Clay question is whether the smooth solution generated by \(u_0\) can lose smoothness at some finite time \(T_*\).
    Equivalently, can a classical same-solution branch reach a finite terminal time at which the usual Sobolev continuation readout fails?
    This paper keeps that object fixed.
    The branch under test is always the original Navier--Stokes branch with the same datum, the same velocity-pressure pair, the same pressure law, the same fixed viscosity, and the same incompressibility constraint.

    The proof has two layers.
    The gold layer is the direct forward-positive route: estimate the quantities in the equation strongly enough to continue the solution.
    The silver layer is the CM contrapositive route: when the forward route leaves a precise terminal obstruction, test whether that obstruction is still a same-solution Navier--Stokes object.
    A retained object must carry a positive packet or carrier, the same participation law, and a positive-scale coherent field readout.
    A failed object exits through the first lost face: Part or Field.

    The current proof state keeps the annular endpoint witness explicit.
    A radius-zero point is not by itself a continuation packet, but a finite-time singularity is witnessed by the surrounding positive-radius fields as they shrink toward the endpoint.
    Those annular fields must either be controlled by the gold route or landed by the silver Part/Field analysis.
    The periodic branch is treated through the transported whole-torus atlas.
    The whole-space branch is treated through the exterior-source CM dichotomy.

