    \section{Reframing the Problem}

    The CM route begins only after the forward route has named a terminal object.
    The question is then simple: is that object still the same Navier--Stokes solution that the Clay problem asked about?

    A same-solution terminal record must keep the original datum, the original velocity-pressure branch, the same fixed viscosity, the same pressure law, incompressibility, and the same terminal role.
    It must also keep three readable faces.
    Pack asks for a positive carrier or selected packet.
    Part asks for the same pressure-viscosity-incompressibility participation law on the derivative tower.
    Field asks for a positive-scale coherent field readout.

    The pass side is conservative.
    When Part and Field survive on the same record, the object remains on the member-continuation side and still reads out through the continuation criterion selected by the proof.
    The fail side is equally concrete.
    The proof does not call every bad-looking picture an exit.
    It records the first failed face of the same terminal record:
    \[
      \neg\Pack_Q,\qquad
      \Pack_Q\wedge\neg\Part_{N,Q},\qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    That first Part/Field failure supports
    \[
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]

    This reframing keeps the Clay object fixed while separating two jobs.
    Gold tries to continue the solution by estimates.
    Silver tests any exact terminal obstruction that gold leaves behind.
    At the present proof state, the annular endpoint witness is the visible unpaid place: the surrounding positive-radius fields must be controlled by the gold annular supplier or followed by the silver route to a first Part or Field face.
