    \section{Reaching Obstruction}

    The basic obstruction appears in the enstrophy estimate.
    Write
    \[
      I(t)=\int_{\mathbb T^3}(u\cdot\nabla)u\cdot\Delta u\,dx .
    \]
    A direct proof needs a bound on \(I(t)\) that gives a global upper bound for
    \[
      Y(t)=\frac12\|\nabla u(t)\|_{L^2}^2.
    \]
    The standard estimate starts with H\"older:
    \[
      |I(t)|
      \le
      \|u\|_{L^6}\|\nabla u\|_{L^3}\|\Delta u\|_{L^2}.
    \]
    Sobolev gives \(\|u\|_{L^6}\lesssim \|\nabla u\|_{L^2}\), and interpolation gives
    \[
      \|\nabla u\|_{L^3}
      \lesssim
      \|\nabla u\|_{L^2}^{1/2}\|\Delta u\|_{L^2}^{1/2}.
    \]
    Hence
    \[
      |I(t)|\lesssim
      \|\nabla u\|_{L^2}^{3/2}\|\Delta u\|_{L^2}^{3/2}.
    \]
    Young's inequality gives
    \[
      |I(t)|
      \le
      \frac{\nu}{2}\|\Delta u\|_{L^2}^2
      +C_\nu\|\nabla u\|_{L^2}^6.
    \]

    Substitution into the enstrophy identity gives
    \[
      Y'(t)\le C_\nu Y(t)^3.
    \]
    This comparison inequality gives local control, not global control.
    The model equation \(Z'=C_\nu Z^3\) has
    \[
      Z(t)=\frac{Z(0)}{\sqrt{1-2C_\nu Z(0)^2t}},
    \]
    so the comparison ceiling can become infinite in finite time.
    Restarting the estimate at \(t_0<T_*\) gives control only on a time interval of size comparable to \(Y(t_0)^{-2}\).
    To cross an alleged terminal time, the proof needs pointwise control of \(Y(t_0)\) as \(t_0\uparrow T_*\).

    The energy identity supplies
    \[
      \sup_{0\le t<T_*}\|u(t)\|_{L^2}^2
      +2\nu\int_0^{T_*}\|\nabla u(t)\|_{L^2}^2\,dt
      \le
      \|u_0\|_{L^2}^2.
    \]
    That is finite velocity energy and finite time-integrated enstrophy.
    It is not a pointwise derivative ceiling near \(T_*\).
    The same gap appears on higher rungs:
    \[
      \frac12\frac{d}{dt}\|\nabla^m u\|_{L^2}^2
      +\nu\|\nabla^{m+1}u\|_{L^2}^2
      \le
      C_m\|\nabla u\|_{L^\infty}\|\nabla^m u\|_{L^2}^2.
    \]
    The forward route then needs a time-integrable bound on \(\|\nabla u\|_{L^\infty}\), or a Sobolev bound strong enough to imply it.
    The estimate has named the needed control without producing it.

    The annular and cone work sharpen this obstruction.
    Near a proposed terminal point \((x_*,T_*)\), shrinking positive-radius windows can carry a residual scale-critical load after heat descendants, through-flow, legal losses, and paid dissipation have been removed.
    The current gold target is to show that this residual load cannot remain non-small on a terminal annular schedule.
    The current manuscript records that supplier as open.
    The surviving object passed to the CM layer is the residual same-solution annular obstruction, not a broad claim that the forward route has failed everywhere.

