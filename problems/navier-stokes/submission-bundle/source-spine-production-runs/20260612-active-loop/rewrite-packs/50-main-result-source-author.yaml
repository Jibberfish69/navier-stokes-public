    \section{Main Result}

    This section states the proof result at the level the manuscript currently supports.
    The result is a same-solution classification theorem, not a hidden claim that the stronger forward-positive annular estimate has already been proved.
    The paper separates those two things because the reader has to know exactly what is paid.

    \subsection{Current theorem-level claim}

    \begin{theorem}[Same-solution terminal classification, with annular boundary]
    Let \(u_0\) be smooth and divergence-free, and let \((u,p)\) be the maximal classical Navier--Stokes solution generated by \(u_0\) on its maximal interval.
    Suppose a finite Clay terminal claim selects a terminal record \(Q\) for that same branch.
    Once the selected record is paid as a same-solution terminal witness, the CM terminal test has only two outcomes:
    \[
      \Member(Q;\Owork)
      \qquad\text{or}\qquad
      \Exit(Q;\Owork):=\neg\Member(Q;\Owork).
    \]
    The member outcome is the retained same-solution continuation side.
    The exit outcome is supported by the first failed witness face:
    \[
      \neg\Pack_Q,
      \qquad
      \Pack_Q\wedge\neg\Part_{N,Q},
      \qquad
      \Pack_Q\wedge\Part_{N,Q}\wedge\forall r>0\,\neg\Field_{N,r,Q}.
    \]
    No admitted same-solution terminal record is both a member-continuation record and a finite nonsmooth terminal witness.
    \end{theorem}

    The phrase ``paid as a same-solution terminal witness'' carries the main burden.
    It means the paper has selected the object actually produced by the alleged breakdown of the original solution and has kept enough data on that object to test carrier, participation, and field readout.
    A comparison packet, surrogate equation, detached endpoint, or convenient diagnostic pattern is not enough.

    \subsection{What remains open in the gold layer}

    The direct forward-positive route would close the annular endpoint witness by proving scale-uniform control on shrinking positive-radius windows.
    A typical annular window has the form
    \[
      A_m
      =
      \{(x,t):\alpha r_m<|x-x_*|<\beta r_m,\quad |t-t_m|\lesssim r_m^2\},
      \qquad
      r_m\downarrow0,\quad t_m\uparrow T_*.
    \]
    On such windows the unpaid quantity is the residual scale-critical refill after heat descendants, through-flow, legal losses, finite payments, and paid dissipation have already been removed.
    At dyadic scale \(2^{-j_m}\simeq r_m\), write
    \[
      u_j=\Delta_j u,\qquad
      E_j(t)=2^{2j}\|u_j(t)\|_2^2,\qquad
      D_j(t)=2^{4j}\|u_j(t)\|_2^2 .
    \]
    The shell ledger has
    \[
      \frac12\frac{d}{dt}E_j(t)+c_0\nu D_j(t)\le \Phi_j^+(t),
    \]
    and the residual refill is read as
    \[
      D_j^{\mathrm{res}}(t;t_0)
      :=
      2^{2j}\int_{t_0}^{t}e^{-c_0\nu2^{2j}(t-s)}\Phi_j^+(s)\,ds .
    \]
    The corresponding annular load \(D_m^{\mathrm{res}}\) is the same quantity read on the shells and time windows meeting \(A_m\).

    The open gold supplier is the scale-uniform smallness statement
    \[
      \forall \varepsilon>0\ \exists r_\varepsilon>0
      \quad\text{such that}\quad
      r_m<r_\varepsilon \Longrightarrow D_m^{\mathrm{res}}\le \varepsilon
    \]
    for every same-solution terminal annular schedule.
    A stronger form would be
    \[
      \sup_{\mathcal A}\sum_{m\ge M}D_m^{\mathrm{res}}\longrightarrow0
      \qquad(M\to\infty),
    \]
    where the supremum runs over admissible disjoint terminal annular schedules.
    This manuscript records the supplier as an open forward-positive theorem target.
    The current narrowed obstruction is terminal Zeno source-refill: positive same-solution source mass can be inherited along shrinking heat-time windows with \(r_m\downarrow0\) and \(\sum_m r_m^2<\infty\).
    The named production target is \(\mathrm{TerminalTimeFaceAntiAtom.A}\), or an equivalent theorem giving temporal thickness, scale-critical source Carleson charge, diffuse-parent charge, no-incoming-flux control, or a rigid ancient source-residue Liouville class.

    \subsection{What the silver layer may claim}

    The silver CM route receives only the residual obstruction left after the forward accounting above.
    It does not reuse the bare endpoint shortcut.
    A radius-zero point is not the whole singularity witness; the live witness is the limiting behavior of the same solution on shrinking positive-radius annuli.

    The silver annular claim is this.
    Once a surviving residual annular obstruction is selected as the same-solution terminal witness and is readout-complete for the claimed breakdown, carrier has already been supplied for this annular test.
    The smooth branch is Member.
    A finite nonsmooth admitted branch is Part when same pressure-viscosity-incompressibility participation is lost.
    It is Field when participation survives with no positive-scale coherent field readout.

    On the periodic branch, the transported whole-torus atlas \(Q_{\mathrm{atlas}}\) pays selection and readout.
    The terminal object is the whole transported atlas, not a private annular packet.
    Retained Pack, Part, and Field on that atlas read out to the global \(H^s\), \(s>5/2\), continuation norm.
    Failure of atlas selection, carrier scale, or material comparability is a Pack failure on \(Q_{\mathrm{atlas}}\), not a fourth terminal requirement.

    On the whole-space branch, the exterior Duhamel split supplies the corresponding decision surface.
    The initial heat tail and any fixed compact-core far-field source vanish at spatial infinity.
    A vanishing exterior nonlinear source gives the usual whole-space continuation readout.
    A surviving exterior nonlinear source becomes a dyadic high-frequency escape and must enter the same CM packet test: no retained material address is Pack failure, detachment from the same equation, pressure, viscosity, or source ancestry is Part failure, and retained Pack plus Part with no fixed positive Field scale is Field failure.

    \subsection{Proof skeleton}

    The proof has four steps.
    First, a finite terminal claim for the original solution supplies either an \(H^s\), \(s>5/2\), restart readout or a selected terminal record \(Q\) for that same branch.
    Second, the selected record enters the CM packet tree only when it is the same-solution object with the same datum, equation, pressure law, fixed viscosity, incompressibility, and terminal role.
    Third, the retained branch carries Pack, Part, and Field to the selected continuation consumer.
    Fourth, the failed branch loses its first required face and embeds as \(\Exit(Q;\Owork)\).

    This theorem-level statement is the current main result of the manuscript.
    It is enough to organize the proof honestly.
    It is not yet a final CMI certification until the annular witness is paid by the gold supplier or, after annular admission, by a completed silver Part/Field landing for the selected same-solution annular residue.
