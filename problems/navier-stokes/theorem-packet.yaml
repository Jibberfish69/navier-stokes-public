theorem_statement:
  statement: For every smooth divergence-free rapidly decaying initial datum u^0 on
    R^3, with f = 0, there exist u,p in C^\infty(R^3 x [0,\infty)) solving the three-dimensional
    incompressible Navier-Stokes equations and satisfying int_{R^3} |u(x,t)|^2 dx
    < C for all t >= 0.
  lowest_safe_claim: For every smooth divergence-free rapidly decaying initial datum
    u^0 on R^3, with f = 0, there exist u,p in C^\infty(R^3 x [0,\infty)) solving
    the three-dimensional incompressible Navier-Stokes equations and satisfying int_{R^3}
    |u(x,t)|^2 dx < C for all t >= 0.
  first_unsafe_overclaim: Replacing the official Clay statement by a weaker route-local
    or data-class-local statement.
