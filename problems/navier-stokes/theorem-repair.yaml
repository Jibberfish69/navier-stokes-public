    first-binomial characteristic gives inherited pressure-explicit endpoint
    jets or one same-lag critical row remainder at every finite depth; it gives
    neither a new datum bill nor the still-unproved common tower radius. The
    vector adjoint future-incidence identity preserves the joined output and
