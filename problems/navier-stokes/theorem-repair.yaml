  quarantined_later_residual_history: >-
    Full weighted-Betchov recombination removes axial wobble, and perfect
    balance remains favorable. On every failed record the signed double-recent
    reconstruction leaves A_n/16 in the actual six-assignment current and
    forces A_n/32 either into the one-contraction/two-expansion signed strain shape
    positive part with its cofactor interface collar or into the complete finite-chord defect,
    including its double-recent dynamic-complement/pressure-heat terms. That allocation is
    selector-dependent: the uncorrected DRF.44 quantity adds the favorable face. After its
    exact refund the selector-covariant residual is Jrr = c_rho Q+ + (Drr - c_rho Q-),
    with every coarea, pressure-response, and finite-chord term kept joined.
    The shape telescope ends at enstrophy/palinstrophy, its next response has
    both signs, and the heat-age finite-chord telescope restores the same open
    endpoint/action. Selector-radius differentiation is an exact coordinate
    flux: after the favorable-face refund its monotone pieces recombine to the
    same Jrr at every radius, with no datum endpoint.
    At the primitive all-pair level, the actual contracting current satisfies
    \(D_tj_+=\mathbf1_{\{\alpha<0\}}D_tj\) with no sign-interface atom and
    \(P_+'=4(\mathcal G_+-\mathcal T_+)\), with
    \(\mathcal G_+\ge5P_+^2/(16H)\). Every completed positive pulse forces a
    datum-normalized lower bound on the joined angular--pressure--viscous
    turn-down response. Restoring both signs gives the future-weighted causal
    identity PRT.28, whose remaining joined response is same-critical with the
    complete endpoint-spanning intersection; the later TIR.37/TIR.37a aliases
    add no authority, rather than
    a new datum stock.
    On every canonical failed record, either the aggregate positive radial
    current is at least A_n/(4 Delta_n) at a record endpoint, or the same
    record contains a completed pulse carrying more than A_n/4 positive
    current. The completed pulse forces joined turn-down action at least
    5 A_n^2/(256 B_n), and that action lies either in actual angular turning
    or in the positive joined longitudinal response; on the balanced
    no-wobble face the longitudinal factor is exactly 3 c. This is a forced
    lower action, not a datum-finite upper payment.
    The literal reciprocal construction from the kinetic-energy row proves
    u_t in L_t^(4/3) H_x^(-1) intersect L_t^2 H_x^(-3/2), and every deeper
    velocity row as the joined negative-time distribution obtained by
    differentiating that same first row. At the first differentiated parent,
    generic termwise multiplication has an exact half-derivative deficit and
    only an L_t^(4/5) very-weak product coefficient; the complete binomial and
    pressure recombination remains lawful as one distribution. Thus Thomas's
    reciprocal direction is real, but energy alone supplies neither its
    Bochner rows nor a common radius. This is not an obstruction to the
    stronger signed same-history cancellation.
    Recombining both material-current signs and every pair orientation before
    taking the positive part gives Q = [P_(1/2)]+. Its full radial growth has
    the exact weighted-mean decomposition
    G_all = 5 Q^2/(16 H) + V_rad on the positive-current sector. Refunding the
    nonnegative internal radial variance gives the identity
    Q' = 4(5 Q^2/(16 H) - C_hat). Every failed record therefore has either a
    normalized full-current endpoint at least 1/4 or a completed pulse whose
    variance-refunded joined action is at least 5/256 after datum
    normalization. The response split is positive aggregate angular excess
    A_all - V_rad or positive aggregate longitudinal response; on an
    individual balanced no-wobble chord the longitudinal factor remains 3 c.
    This is algebraically narrower than the P+-only/raw-response coordinates,
    but FSQ.37 remains same-critical with the complete endpoint-spanning
    intersection and is quarantined support, not a strict reduction or live aim.
    A full-current right endpoint of height M either falls to M/2 before the
    next record and forces refunded joined action at least M/8, or remains
    positive across the bridge and next record with traversal time below
    6 A_n/M; on the endpoint threshold this is below 24 Delta_n. A left
    endpoint has the same half-turn alternative or first propagates to the
    right endpoint, with every resulting factor retained. Canonical adjacency
    alone cannot force the turn: an exact scalar zero-response winding
    calibration satisfies the recombined current law, critical balance,
    height-mass form, and all record levels while taking only endpoint
    branches. It is not a Navier-Stokes history; it proves only that persistent
    terminal winding must be excluded by an additional same-fluid consequence
    of the pressure-explicit law.
  quarantined_later_contrapositive_history: >-
    A later contrapositive readout of failure of the endpoint-spanning
    intersection forces disjoint last-half-prefix windows
    carrying at
    least one quarter normalized signed current on receiver levels tending to
    infinity while their datum-paid pressure-complete source masses vanish. It
