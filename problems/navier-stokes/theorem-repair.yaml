    weight leaves a contact current or sign-changing current square.
    The same records satisfy an exact endpoint-or-completed-pulse alternative:
    one normalized endpoint current is at least 1/4, or the normalized
    positive joined turn-down action is at least 5/256. The corresponding
    vanishing statement CPR.34 would exclude every failed record, but no
    datum row presently proves it; it remains same-critical and is not a
    strict smaller reduction.
    Full signed-current recombination removes contracting/expanding common
    modes, and the exact radial-variance refund removes internal radial spread
    which does not drive the net pulse. The resulting endpoint-or-refunded-
    action alternative is exact, but its vanishing condition FSQ.37 is still
    the failed-prefix exclusion at the same quantifiers and has no proved
    datum-finite numerator.
    Endpoint recurrence now has an exact causal fork: half-turn pays joined
    response action, while no half-turn propagates the same positive winding
    into the adjacent record on a compressed time span. Prefix-level topology
    does not itself bracket current height, so it cannot convert the persistent
    branch into a completed pulse without an additional pressure-explicit
    same-fluid theorem.
    The failure also forces a scale-critical complete-source square, a viscosity-matched
    pulse carrying at least one eighth of the record, and divergent signed
    supplier prefixes at every reciprocal binomial depth. The remote parent
    tail evacuates at a record-dependent reciprocal depth, and all
    datum-heat-containing interactions vanish on the pulse sets. A fixed
    fraction must therefore be carried by a finite parent prefix and by two
    nonlinear Duhamel descendants at diverging frequency, simultaneously
    inside one finite parent-ratio sector. Heat damping removes the old high
    parent and forces its rebuilding from the complete pressure source in a
    shrinking recent window. Applying the dynamic-core absorptions before
    source-square Cauchy strengthens this to both ordered parents: the symmetric
    minimum-leg floor makes both high, and one common old/recent split forces a
    double-recent source-ancestry fourth-moment pulse while its first moments
    remain summable. Keeping the same receiver signed leaves an A_n/16
    double-recent current and forces an A_n/32 imbalance-collar/complete-defect
    coordinate alternative. Exact selector refund restores the favorable face
    to the defect; physical travel is paid. The episodewise relative co-normal
    probe pays the multiplicity of aligned long local-height losses on a fixed
    cohort, but non-aligned long episodes retain a pi/6 relative-frame action
    and short episodes retain positive BV incidence. Those two alternatives
    remain same-critical. Before absolute values, membership and contracting-
    line motion are one objective projector derivative; the moving-weight
    finite-chord and first-binomial complements refund that signed derivative
    exactly, and generic pair selection gives only the parallel unmasked
    selector/complement cancellation. Signed sharp-threshold layer cake
    removes entry/exit overcounting and gives the datum endpoint
    integral q+/c <= ||grad u0||_2^2/16, but its pressure-vorticity-viscous
    remainder is same-critical and the selector-radius refund tends back to
    Jrr. Each first loss of alignment sharpens to the
    selected joined critical square integral |R_-|^2/c with constant
    pi^2/(36 ell), but the objective second response and complete signed
    refund produce no datum endpoint for that square. Selector radius
    only transfers the same current between refunded strain and finite-chord
    coordinates; its endpoint pieces cancel. The sharp Lorentz kernel then
    forces a shrinking receiver
    pulse and an earlier diverging complete-source average, but no signed
    nested record or positive source-mass floor. Retaining sign before
    scalarization gives an A_n/64 each-slot adjoint source-time incidence;
    its unweighted source mass still vanishes, so the future receiver
    diverges. Exact energy/helicity projection leaves the whole incidence in
    the invariant-transverse receiver; the symmetric slots coincide, its
    square is an anti-causal quotient Gramian, and the binomial projection
    frame cancels back to the same two moving age edges plus the same-window
    higher row. Squaring this incidence gives an exact divergent scalar
    square, but its two-parent pullback is only finite-cutoff/form-domain and
    its forward storage is future-defined; no bounded continuum parent
    operator or causal datum stock follows. The projected low-flow
    evolution has an r^2 gap, while the actual one-history band retains the
    exact pressure-complete leave/re-enter commutator; the 4/5 floor is not a
    descent equality. Rejoining its two high-output assignments with the four
    complementary receiver assignments restores the paid six-assignment FIM
    exterior, but exact adjoint ancestry retains the complementary receiver
    current, the propagated-receiver defect, and later mixed band-edge
