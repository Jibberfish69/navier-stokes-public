    edge, not a datum endpoint or selector commutator. If a common mixed-row
    radius is supplied, the generating field resums exactly to the same recent
    parent; beyond the heat depth the high-pass gain disappears, and the radius
    majorant must itself carry the same receiver-weighted action. The joined endpoint
