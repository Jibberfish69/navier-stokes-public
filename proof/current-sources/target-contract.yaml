---
proof_ontology.object: One fluid with its coupled velocity, pressure, and prescribed
  force when present. The mixed jet expresses compatible spatial and material responses
  as functions of the governing independent space-time variables.
proof_ontology.derivative_order: Taking a higher material derivative does not fix
  the independent variables or advance the fluid to a later physical time. Evaluation
  at specified parameter values is a separate operation. Preserve material-to-Eulerian
  conversion and commutator terms when changing derivative coordinates.
proof_ontology.current_construction_custody_20261020.selected_direction: datum and
  governing equation -> mixed jet with its critical-height Sobolev membership -> all-finite-temporal-order
  spatial intersection -> later critical-height substitution exposing viscosity ->
  finite rectangles and norm readouts
proof_ontology.current_construction_custody_20261020.critical_heights_role: Retain
  two roles from the latest direct explanation. Critical height supplies the Sobolev-domain
  reading alongside mixed-jet generation; later differentiated-equation substitution
  displays viscosity and finite estimates. The earlier blanket downstream-only interpretation
  is superseded.
proof_ontology.current_construction_custody_20261020.finite_selection_use: Use the
  supplied constructed intersection at its stated interval and hypotheses. Coordinate
  selection preserves its memberships; each fixed finite sum of defining norms is
  finite without another hypothesis.
proof_ontology.current_construction_custody_20261020.later_representation_role: Columnwise
  conversions and rectangle-first exhaustion remain usable at their proved scope;
  they do not identify the original method or replace the direction selected here.
proof_ontology.current_construction_custody_20261020.exploratory_test_role: Local
  persistence, norm-roof equivalences, completed-current inversion, and strain tests
  retain their individual scopes. A limit of a test introduces no prerequisite for
  the original construction.
proof_ontology.current_construction_custody_20261020.verification_boundary: Preserve
  supplied source theorem status separately from recovered reasoning and checked Lean
  coverage. This correction certifies no new Lean constructor or global theorem.
proof_ontology.independent_constructions:
  intersection:
    entry: datum and governing equation -> mixed jet over its independent variables
      -> compatible intersection
    rectangle_prerequisite: false
  rectangle_relationships:
    entry: critical-height differentiation with mixed-jet substitution -> relationship
      rows -> finite rectangles of those relationships
    intersection_prerequisite: false
proof_ontology.common_origin: Both constructions inherit compatibility from the one
  fluid and mixed jet. Their independence does not mean independent fluids or uncoupled
  rows.
proof_ontology.permitted_compositions: An established rectangle relation can be used
  to prove an intersection result, and an independently established intersection can
  be used to derive rectangle results, with the actual hypotheses of each argument
  retained.
proof_ontology.order_rule: Discovery order, exposition order, and the direction of
  one proof route do not define the ontology or impose a universal prerequisite between
  intersection and rectangles. A known conclusion may have a useful independent derivation.
proof_ontology.scope_rule: Distinguish the governing relationship, a particular evaluation,
  sourced interval membership or norm control, and endpoint continuation. A derivative
  is not an evaluation. Preserve each result's actual variables, interval, and hypotheses
  without imposing an order between the independent constructions.
proof_program_completion.proof_object: One smooth divergence-free finite-energy datum
  u_0, one fixed viscosity nu>0, and the one pressure-complete maximal Navier--Stokes
  history generated by that datum. All temporal rows, spatial rows, pressure rows,
  finite rectangles, endpoint traces, and restart data are coordinates of this same
  history.
proof_program_completion.pressure_explicit_recurrence:
  velocity: V_{n+1} + sum_{j=0}^n binom(n,j) (V_j dot grad)V_{n-j} + grad Q_n = nu
    Delta V_n
  pressure: "-Delta Q_n = sum_{j=0}^n binom(n,j) partial_i partial_j((V_j)_i (V_{n-j})_j)"
proof_program_completion.producer_statement: For every finite N,M, the one maximal
  u_0-generated pressure-complete history satisfies sup_{0<T<T_*} R_{N,M}(u;T) < infinity.
  The bound may depend on N,M, no common tower constant is asserted, and all rectangles
  agree under restriction.
proof_program_completion.closure_chain: u_0 -> full material jet with compatible intersection
  -> finite rectangle readouts -> complete zeroth spatial row S_0 -> adjacent critical
  block E_{3/2} in L_infinity intersect L_1, H in W^1_1, and P_{1/2} in L_1 -> common
  H_x^infinity endpoint -> actual pressure-complete endpoint jet -> same-history local
  restart and uniqueness -> contradiction of finite maximality -> T_*=infinity.
